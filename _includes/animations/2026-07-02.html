<script>
(window.AnimScenes = window.AnimScenes || {}).t0702 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? '\u00a0:' : ':';
  const at = fr ? 'en' : 'at';
  const num = (v, d = 0) => { const s = Math.abs(v).toFixed(d); return (v < -0.005 ? '−' : '') + (fr ? s.replace('.', ',') : s); };
  // Measured on the official code in local Chrome (getBoundingClientRect and pixel scans of the render):
  // html (115, 60) 170 × 180, border 30px; body (153, 103.59) 94 × 102; p (155, 103.59 / 137.59 / 171.59) 60 × 24,
  // painted at y = 104, 138, 172; shadows ×0.4: 79q → 29.858, -291q → -109.984, 370q → 139.843, -5q → -1.890.
  const FIN = 30;
  const lerp = (a, b, k) => a + (b - a) * k;
  const put = (e, x, y, w, h) => { e.style.left = `${x}px`; e.style.top = `${y}px`; e.style.width = `${w}px`; e.style.height = `${h}px`; };
  const html = $('.t0702-html'), body = $('.t0702-body');
  const ps = $$('.t0702-p'), s1 = $$('.t0702-s1'), s2 = $$('.t0702-s2'), s3 = $$('.t0702-s3');
  const L = (k) => $$(`.zlab[data-l="${k}"]`);
  const col = (teach, v) => (teach ? `var(--t0702-${v})` : 'var(--t0702-bk)');
  const X = 155, W = 60, H = 24, Y = [104, 138, 172];
  const D1 = 29.858, D2 = -109.984, D3 = 139.843, DY = -1.89;
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    // 1. html's border grows inward to 30px
    const bw = lerp(0, 30, pr(t, [1, 3]));
    html.style.borderWidth = `${bw}px`;
    html.style.borderColor = col(teach, 'c1');
    html.style.opacity = pr(t, [0.2, 0.6]);
    // 2. the first p: its 12px border makes a 60 × 24 bar
    const h0 = lerp(0, H, pr(t, [6, 8]));
    // 3. the two other p: first 13.6px apart, then 10px once the −3.6 bottom margin collapses
    const g = lerp(13.6, 10, pr(t, [12.5, 14]));
    const ys = [Y[0], Y[0] + H + g, Y[0] + 2 * (H + g)];
    const k1 = pr(t, [16, 18]), k2 = pr(t, [21, 23]), k3 = pr(t, [26, 28]);
    ps.forEach((e, i) => {
      // in real colors, the p and its 79q copy are drawn as one bar (no seam where they overlap)
      put(e, X, ys[i], teach ? W : W + D1 * k1, i ? H : h0);
      e.style.opacity = i ? pr(t, [10.3, 10.8]) : (t >= 5.5 ? 1 : 0);
      e.style.background = col(teach, 'c2');
    });
    body.style.opacity = teach && t >= 5.5 && t < 15 ? 1 : 0;
    // 4–6. the three shadows slide out of each p
    s1.forEach((e, i) => { put(e, X + D1 * k1, ys[i], W, H); e.style.opacity = teach ? pr(t, [15.3, 15.8]) : 0; e.style.background = col(teach, 'c3'); });
    s2.forEach((e, i) => { put(e, X + D2 * k2, ys[i], W, H); e.style.opacity = pr(t, [20.3, 20.8]); e.style.background = col(teach, 'c4'); });
    s3.forEach((e, i) => { put(e, X + D3 * k3, ys[i] + DY * k3, W, H); e.style.opacity = pr(t, [25.3, 25.8]); e.style.background = col(teach, 'c5'); });
    [[0.3, 5], [5.3, 10], [10.3, 15], [15.3, 20], [20.3, 25], [25.3, 30]].forEach(([a, e], k) => L(k + 1).forEach((l) => (l.style.opacity = win(t, a, e))));
    let txt;
    if (step === 0) txt = `html${c} 170 × 180 ${at} (115, 60) · border ${num(bw, 1)}px`;
    else if (step === 1) txt = `p${c} 60 × ${num(h0, 1)} ${at} (155, 104)`;
    else if (step === 2) txt = `${fr ? 'écart' : 'gap'}${c} ${num(g, 1)}px · y = ${ys.map((v) => num(v, 1)).join(fr ? '\u00a0; ' : ', ')}`;
    else if (step === 3) txt = `79q 0${c} x = ${num(X + D1 * k1, 2)} → ${num(X + W + D1 * k1, 2)}`;
    else if (step === 4) txt = `-291q 0${c} x = ${num(X + D2 * k2, 2)} → ${num(X + W + D2 * k2, 2)}`;
    else if (step === 5) txt = `370q -5q${c} x = ${num(X + D3 * k3, 2)} · y = ${num(Y[0] + DY * k3, 2)}`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
