{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="Fond"><h3>1. Un fond pour tous</h3><p><code>&lt;img>&lt;img>&lt;p>&lt;style></code> : body contient deux images et un p, et style finit dans le p. <code>*</code> donne à chaque élément un fond sombre et <code>height:30</code>. html ne fait que 400 × 30, mais son fond couvre tout le canevas.</p></div>
<div class="cap" data-t="4.5" data-step="U"><h3>2. Une image en U</h3><p>Une img sans src n'a pas de largeur : 0. Sa boîte n'est que bordures et padding : 55 + 15 + 0 + 15 + 55 = 140 de large, 65 + 30 + 65 + 40 = 200 de haut. Pas de bordure en haut : le jaune forme un U. Les 30px du milieu montrent le fond sombre de l'image.</p></div>
<div class="cap" data-t="9" data-step="Marges"><h3>3. Les marges</h3><p><code>margin:42 8-34%32</code>. Les deux images sont côte à côte sur une ligne : x = 8 + 32 = 40, puis 40 + 140 + 8 + 32 = 220. y = 8 + 42 = 50. La marge du bas vaut −34 % des 384px de body : −130,55. La ligne finit en 50 + 200 − 130,55 = 119,45.</p></div>
<div class="cap" data-t="13.5" data-step="Miroir"><h3>4. Le miroir</h3><p><code>+*</code> dans <code>img</code> veut dire <code>img + *</code> : la deuxième image, et le p. <code>scale:-1</code> retourne la deuxième image autour de son centre, (290, 150). Sa barre du bas passe en haut, son creux s'ouvre vers le bas.</p></div>
<div class="cap" data-t="18" data-step="clip-path"><h3>5. Le dôme</h3><p><code>inset(0 0 -50% round 1in)</code> ne coupe rien en haut ni sur les côtés, et descend 100px sous la boîte. Des coins de 96px sont trop grands pour 140px : Chrome les ramène à 70, un demi-cercle. Le haut devient un dôme. Les coins du bas tombent 100px sous la boîte, où rien n'est dessiné. Sur la deuxième image, le miroir met le dôme en bas.</p></div>
<div class="cap" data-t="22.5" data-step="Bande"><h3>6. La bande</h3><p>Le p vient après la ligne : 119,45 + sa marge du haut de 16 = 135,45. Il fait 30 de haut : une bande sombre de y = 135 à 165. Il a aussi reçu <code>scale:-1</code>. Ça ne change pas son dessin, mais il passe sur son propre calque, peint par-dessus les deux images.</p></div>
<div class="cap" data-t="27" data-step="Résultat" data-live="172 caractères · 100 % identique"><h3>7. Résultat : 172 caractères</h3><p>Deux images en U, une retournée, un clip-path pour les dômes, et une bande par-dessus.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="Background"><h3>1. One background for all</h3><p><code>&lt;img>&lt;img>&lt;p>&lt;style></code>: body holds two images and a p, and style ends up inside the p. <code>*</code> gives every element a dark background and <code>height:30</code>. html is only 400 × 30, but its background covers the whole canvas.</p></div>
<div class="cap" data-t="4.5" data-step="U"><h3>2. A U-shaped image</h3><p>An img with no src has no width: 0. Its box is only borders and padding: 55 + 15 + 0 + 15 + 55 = 140 wide, 65 + 30 + 65 + 40 = 200 tall. There is no top border, so the yellow is a U. The 30px in the middle show the image's own dark background.</p></div>
<div class="cap" data-t="9" data-step="Margins"><h3>3. The margins</h3><p><code>margin:42 8-34%32</code>. The two images sit side by side on one line: x = 8 + 32 = 40, then 40 + 140 + 8 + 32 = 220. y = 8 + 42 = 50. The bottom margin is −34% of body's 384px: −130.55. The line ends at 50 + 200 − 130.55 = 119.45.</p></div>
<div class="cap" data-t="13.5" data-step="Flip"><h3>4. The flip</h3><p><code>+*</code> inside <code>img</code> means <code>img + *</code>: the second image, and the p. <code>scale:-1</code> turns the second image around its center, (290, 150). Its bottom bar goes to the top, and its gap now opens downward.</p></div>
<div class="cap" data-t="18" data-step="clip-path"><h3>5. The dome</h3><p><code>inset(0 0 -50% round 1in)</code> cuts nothing at the top or on the sides, and goes 100px below the box. 96px corners are too big for 140px: Chrome shrinks them to 70, a half circle. The top becomes a dome. The bottom corners fall 100px below the box, where nothing is drawn. On the second image, the flip puts the dome at the bottom.</p></div>
<div class="cap" data-t="22.5" data-step="Band"><h3>6. The band</h3><p>The p comes after the line: 119.45 + its 16px top margin = 135.45. It is 30 tall: a dark band from y = 135 to 165. It got <code>scale:-1</code> too. That does not change how it looks, but it gets its own layer, painted over both images.</p></div>
<div class="cap" data-t="27" data-step="Result" data-live="172 characters · 100% match"><h3>7. Result: 172 characters</h3><p>Two U-shaped images, one flipped, a clip-path for the domes, and a band on top.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0610 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? '\u00a0:' : ':';
  const at = fr ? 'en' : 'at';
  const num = (n) => (fr ? String(n).replace('.', ',') : String(n));
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  // Measured on the official code in local Chrome (400 × 300 iframe, quirks mode, getBoundingClientRect, getComputedStyle).
  // html 400 × 30 at (0, 0), body 384 × 30 at (8, 8). Every element: background #4C4C6B, height 30.
  // img: width 0, height 30, padding 65 15, border 0 55 40 → 140 × 200, at (40, 50) and (220, 50).
  // margin-bottom −34% of 384 = −130.547 → the line ends at 119.453; p (margin 16) at (8, 135.453), 384 × 30.
  // Second img and p: scale −1. clip-path inset(0 0 −50% round 96px) on 140 × 300 → radius 70.
  const FIN = 27;
  const i1 = $('.t0610-i1'), i2 = $('.t0610-i2'), band = $('.t0610-band');
  const bh = $('.t0610-bh'), bb = $('.t0610-bb'), c1 = $('.t0610-c1'), c2 = $('.t0610-c2'), bp = $('.t0610-bp');
  const line = $('.t0610-line');
  const labs = $$('.zlab');
  const ivs = [[0.3, 4.5], [4.8, 9], [9.3, 13.5], [13.8, 18], [18.3, 22.5], [22.8, FIN]];
  const box = (e, x, y, w, h) => { e.style.left = `${x}px`; e.style.top = `${y}px`; e.style.width = `${w}px`; e.style.height = `${h}px`; };
  box(c1, 40, 50, 140, 300);
  box(c2, 220, -50, 140, 300);
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const tw = teach ? 1 - pr(t, [FIN, FIN + 0.8]) : 0;
    i1.style.borderColor = mix(tw, 'var(--t0610-b1)', '#fae29e');
    i2.style.borderColor = mix(tw, 'var(--t0610-b2)', '#fae29e');
    i1.style.backgroundColor = i2.style.backgroundColor = mix(tw, 'var(--t0610-ib)', '#4c4c6b');
    band.style.backgroundColor = mix(tw, 'var(--t0610-pb)', '#4c4c6b');
    // step 2: the first image; step 3: the second one slides to x = 220
    i1.style.opacity = pr(t, [4.8, 5.6]);
    i2.style.opacity = pr(t, [9.4, 10]);
    i2.style.left = `${40 + 180 * pr(t, [9.6, 11.2])}px`;
    // step 4: the flip (scale −1 is a half turn)
    i2.style.transform = `rotate(${180 * pr(t, [14.2, 16.2])}deg)`;
    // step 5: the clip-path, radius growing to 70 (96 at the end, same shape)
    const k5 = pr(t, [18.8, 20.6]);
    const r = k5 >= 1 ? 96 : 70 * k5;
    i1.style.clipPath = i2.style.clipPath = k5 > 0 ? `inset(0 0 -50% round ${r}px)` : 'none';
    c1.style.borderRadius = c2.style.borderRadius = `${Math.min(r, 70)}px`;
    c1.style.opacity = c2.style.opacity = win(t, 18.4, 22.5);
    // step 6: the band
    band.style.opacity = pr(t, [23.6, 24.4]);
    bp.style.opacity = win(t, 23, FIN);
    line.style.opacity = Math.max(win(t, 10.2, 13.5), win(t, 22.8, FIN));
    bh.style.opacity = bb.style.opacity = win(t, 0.6, 4.5);
    labs.forEach((l) => {
      // b1, b2: in the empty band below the shapes (b2 kept short, the canvas label sits at its left);
      // tr, tl: in the empty band above them
      const k = +l.dataset.l, pos = l.dataset.pos;
      const left = pos === 'tl';
      l.style.left = left ? 'calc(4px * var(--k, 1))' : 'auto';
      l.style.right = left ? 'auto' : 'calc(4px * var(--k, 1))';
      l.style.transformOrigin = left ? '0 0' : '100% 0';
      l.style.top = pos === 'b2' ? 'calc(256px + 19px * var(--k, 1))' : pos === 'b1' ? '256px' : 'calc(47px - 16px * var(--k, 1))';
      l.style.opacity = win(t, ...ivs[k - 1]);
    });
    let txt;
    if (step === 0) txt = `html${c} 400 × 30`;
    else if (step === 1) txt = `img${c} 140 × 200`;
    else if (step === 2) txt = `(40, 50), (220, 50) · ${fr ? 'fin de ligne' : 'line ends'} ${num(119.45)}`;
    else if (step === 3) txt = `scale:-1 ${fr ? 'autour de' : 'around'} (290, 150)`;
    else if (step === 4) txt = `${fr ? 'rayon' : 'radius'} 96 → 70`;
    else if (step === 5) txt = `p${c} 384 × 30 ${at} (8, ${num(135.45)})`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
