(window.AnimScenes = window.AnimScenes || {}).t0713 = (fig) => {

    else if (step === 4) txt = fr ? `bordure du bas${c} opacité ${num(fade * 100)} % · sommet (200, 210)` : `bottom border${c} ${num(fade * 100)}% opacity · apex (200, 210)`;
    else txt = $$('.caps .cap')[5].dataset.live || '';
