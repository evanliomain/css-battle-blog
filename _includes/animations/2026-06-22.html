(window.AnimScenes = window.AnimScenes || {}).t0622 = (fig) => {

  const $ = (s) => fig.querySelector(s);

  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));

  // 23% of 89 = 20.47px is drawn as 20px (a 20px variant gives the same pixels): bar rows 185..204, left/right pieces y 205..254, bottom 254..274.
  // Wheels in the render: x 150..179 and 220..249, y 215..244.
  const FIN = 37;
  const AX = -7.55906, AY = -69.9213, AW = 415.11812, AH = 369.9213;
  const SX = 0.49 * AW, SY = 0.49 * AH, MW = AW - 2 * SX, MH = AH - 2 * SY, K = 144;
  const HC = [AW / 2, AH / 2];
  const cols = [[0, SX, 0, K], [SX, MW, K, AW - 2 * K], [AW - SX, SX, AW - K, K]];
  const rows = [[0, SY, 0, K], [SY, MH, K, AH - 2 * K], [AH - SY, SY, AH - K, K]];
  const HP = [];
  rows.forEach((r, j) => cols.forEach((q, i) => HP.push({ src: [q[0], r[0], q[1], r[1]], dst: [q[2], r[2], q[3], r[3]], dx: i - 1, dy: j - 1, mid: i === 1 && j === 1 })));
  const BX = 120, BY = 185, BW = 160, BH = 89, BC = [80, 44.5];
  const BP = [
    { src: [0, 0, 142.4, 88], dst: [0, 20, 80, 49] }, { src: [17.6, 0, 142.4, 88], dst: [80, 20, 80, 49] },
    { src: [0, 88, 142.4, 1], dst: [0, 69, 80, 20] }, { src: [17.6, 88, 142.4, 1], dst: [80, 69, 80, 20] },
  ];
  const HU = [[AX, AY, AW, 55 - AY], [AX, 175, AW, 125], [AX, AY, 119.5 - AX, AH], [280.5, AY, AX + AW - 280.5, AH]];
  const BU = [[120, 250, 160, 24], [190, 205, 20, 45]];

    put(e, [ox + r[0], oy + r[1], r[2], r[3]]);
    const sx = r[2] / src[2], sy = r[3] / src[3];
    e.style.background = `radial-gradient(${28 * sx}px ${28 * sy}px at ${(C[0] - src[0]) * sx}px ${(C[1] - src[1]) * sy}px, transparent 96.43%, ${color} 100%)`;
  };

    put(e, r);
    e.style.outline = o > 0 ? `calc(1.5px * var(--k, 1)) dashed color-mix(in srgb, var(--t0622-gd) ${(o * 100).toFixed(0)}%, transparent)` : 'none';
    e.style.outlineOffset = 'calc(-0.75px * var(--k, 1))';

  const hp = $$('[data-e="h"]'), hu = $$('[data-e="hu"]'), hl = $$('[data-e="hl"]');
  const bp = $$('[data-e="b"]'), bu = $$('[data-e="bu"]'), bl = $$('[data-e="bl"]');

    });

    hu.forEach((e, i) => { put(e, HU[i]); e.style.background = col('ho'); e.style.opacity = pr(t, [19, 19.3]); });
    dash(ha, [AX, AY, AW, AH], win(t, 4.6, 21));

    dash(hl[0], [AX + SX, AY, 0, AH], lc); dash(hl[1], [AX + SX + MW, AY, 0, AH], lc);

      const n = +l.dataset.l, second = l.classList.contains('t0622-l2');
      l.style.left = wide ? 'calc(-40px + 4px * var(--k, 1))' : 'calc(4px * var(--k, 1))';
      l.style.top = wide ? `calc(-110px + ${second ? 20 : 4}px * var(--k, 1))` : second ? 'calc(300px - 20px * var(--k, 1))' : 'calc(4px * var(--k, 1))';
      const ivs = [[0.3, 4.5], [4.8, 10], [10.3, 15], [15.3, 21], [21.3, 26], [26.3, 31], [31.3, FIN]];
      l.style.opacity = win(t, ...ivs[n - 1]);
    });
    let txt;
    if (step === 0) txt = `${fr ? 'canevas' : 'canvas'}${c} #F0CD48`;
    else if (step === 1) txt = `${fr ? 'aire' : 'area'}${c} ${num(AW, 2)} × ${num(AH, 2)}`;
    else if (step === 2) txt = `${fr ? '49\u00a0%' : '49%'}${c} ${num(SX, 2)} × ${num(SY, 2)}`;

    else if (step === 4) txt = `body${c} ${BW} × ${BH}`;
    else if (step === 5) txt = `${fr ? 'découpe' : 'slice'}${c} 0 89${fr ? '\u00a0%' : '%'} 1`;
    else if (step === 6) txt = `${fr ? 'morceau de gauche' : 'left piece'}${c} ${num(142.4 + (80 - 142.4) * kB, 1)} × ${num(88 + (49 - 88) * kB, 1)}`;
    else txt = $$('.caps .cap')[7].dataset.live || '';
    live.textContent = txt;
  };
};
