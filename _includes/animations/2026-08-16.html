<div class="cap" data-t="0" data-step="html : 208 de large"><h3>1. <code>html</code> : 208px de large</h3><p><code>*</code> donne à tous les éléments <code>margin:.7%24%20</code>, <code>padding:10</code>, <code>border-radius:1in</code> et le fond #6592CF. Une marge en % est une part de la largeur du bloc parent. Pour html, c'est le canevas de 400px : 24 % font 96px à gauche et à droite, 0,7 % font 2,8px en haut. html fait 400 − 2 × 96 = 208px de large. Son contenu le rend plus haut que le canevas : il finit en y = 334,6. Le fond de la racine peint tout le canevas.</p></div>
<div class="cap" data-t="5" data-step="body : 97,78 de large"><h3>2. <code>body</code> : 97,78px de large</h3><p>Dans les 10px de padding de html, le contenu fait 188px de large. Pour body, 24 % valent 45,11px de chaque côté, et 0,7 % valent 1,31px en haut. body fait 97,78px de large, à partir de x = 151,11, et commence en y = 14,11. Son fond est du même bleu : il ne se voit pas.</p></div>
<div class="cap" data-t="10" data-step="Trois dt"><h3>3. Trois <code>dt</code> de 40,47 × 70</h3><p>Chaque <code>&lt;dt></code> ferme le précédent, et chaque <code>&lt;p></code> va dans son dt. Le contenu de body fait 77,78px : 24 % valent 18,66px. Chaque dt fait 40,47px de large, à partir de x = 179,77. En haut, les marges et les paddings s'ajoutent : 2,8 + 10 + 1,31 + 10 + 0,53 = 24,64. Le p est vide : son padding lui donne 20px de haut, et <code>p{margin:15</code> met 15px au-dessus et en dessous. Avec le padding du dt : 10 + 15 + 20 + 15 + 10 = 70px. La marge du bas de 20px place les dt en y = 24,64, 114,64 et 204,64.</p></div>
<div class="cap" data-t="16" data-step="Des pilules"><h3>4. Des pilules</h3><p><code>border-radius:1in</code> vaut 96px. Un rayon ne peut pas dépasser la moitié d'un côté : Chrome le réduit. Pour un dt de 40,47 × 70, il tombe à 20,23px : une pilule. Pour un p de 20px de haut, à 10px. Tout est encore bleu sur bleu : rien ne se voit.</p></div>
<div class="cap" data-t="20" data-step="Six pilules sombres"><h3>5. Six pilules sombres</h3><p><code>box-shadow:-35vh 0,35vh 0</code> : 35vh valent 35 % de 300, soit 105px. Chaque dt a deux copies, 105px à gauche et à droite : de x = 74,77 à 115,23, et de 284,77 à 325,23. Ces ombres n'ont pas de couleur : elles prennent <code>currentColor</code>, <code>color:243D83</code>, une couleur sans <code>#</code> que le mode quirks accepte.</p></div>
<div class="cap" data-t="25" data-step="Les encoches"><h3>6. Les encoches</h3><p><code>margin:15-105</code> se lit 15 et −105. Les marges négatives élargissent le p de 105px de chaque côté : 20,47 + 210 = 230,47px, de x = 84,77 à 315,23. Le p vient après son dt : son fond bleu est peint par-dessus les ombres. Il y creuse une encoche de 20px de haut au bout arrondi. Les pilules de gauche s'ouvrent vers la droite, celles de droite vers la gauche.</p></div>
<div class="cap" data-t="31" data-step="Résultat" data-live="151 caractères · 100 % identique"><h3>7. Résultat : 151 caractères</h3><p>Trois dt invisibles et leurs deux ombres font six pilules. Le p de chaque dt, élargi par des marges négatives, les encoche avec la couleur du fond.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html: 208 wide"><h3>1. <code>html</code>: 208px wide</h3><p><code>*</code> gives every element <code>margin:.7%24%20</code>, <code>padding:10</code>, <code>border-radius:1in</code> and the background #6592CF. A margin in % is a share of the width of the parent block. For html, that is the 400px canvas: 24% is 96px on the left and right, .7% is 2.8px on top. html is 400 − 2 × 96 = 208px wide. Its content makes it taller than the canvas: it ends at y = 334.6. The background of the root paints the whole canvas.</p></div>
<div class="cap" data-t="5" data-step="body: 97.78 wide"><h3>2. <code>body</code>: 97.78px wide</h3><p>Inside the 10px padding of html, the content is 188px wide. For body, 24% is 45.11px on each side, and .7% is 1.31px on top. body is 97.78px wide, from x = 151.11, and starts at y = 14.11. Its background is the same blue: it does not show.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0816 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const box = (e, r, rad) => { e.style.left = `${r[0]}px`; e.style.top = `${r[1]}px`; e.style.width = `${r[2]}px`; e.style.height = `${r[3]}px`; e.style.borderRadius = `${rad}px`; };
  const n2 = (v) => (fr ? v.toFixed(2).replace('.', ',') : v.toFixed(2));
  const c = fr ? '\u00a0:' : ':';
  const sep = fr ? '\u00a0;' : ',';
  // Measured on the official code (getBoundingClientRect in local Chrome):
  // html (96, 2.80) 208 × 331.84 · body (151.11, 14.11) 97.78 × 290.53
  // dt (179.77, 24.64 / 114.64 / 204.64) 40.47 × 70 · p (84.77, dt top + 25) 230.47 × 20
  // shadows: dt box moved by ±105px → x 74.77..115.23 and 284.77..325.23
  // Exact layout values (Chrome lays out in 1/64 px):
  const HT = [96, 2.796875, 208, 331.84375], BD = [151.109375, 14.109375, 97.78125, 290.53125];
  const DX = 179.765625, DW = 40.46875, DH = 70, DY = [24.640625, 114.640625, 204.640625];
  const FIN = 31;
  const rr = (w, h) => Math.min(96, w / 2, h / 2);
  const ht = $('.t0816-ht'), bd = $('.t0816-bd');
  const gh = $('.t0816-g[data-g="ht"]'), gb = $('.t0816-g[data-g="bd"]');
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    const fill = (k) => `var(--t0816-${teach ? k : 'bg'})`;
    const rad = pr(t, [16.4, 18.4]);
    const m = pr(t, [25.6, 28.4]);
    const off = 105 * pr(t, [20.8, 23.6]);
    // html and body
    box(ht, HT, rad * rr(HT[2], HT[3])); box(gh, HT, rad * rr(HT[2], HT[3]));
    box(bd, BD, rad * rr(BD[2], BD[3])); box(gb, BD, rad * rr(BD[2], BD[3]));
    ht.style.background = fill('ht'); bd.style.background = fill('bd');
    // From the result on, the boxes in the background color are left out: they only add faint edges.
    const gone = 1 - pr(t, [FIN, FIN + 0.5]);
    ht.style.opacity = gone * pr(t, [0.3, 1]);
    bd.style.opacity = gone * pr(t, [5.3, 6]);
    gh.style.opacity = 0.9 * win(t, 0.3, 4.8);
    gb.style.opacity = 0.9 * win(t, 5.2, 9.8);
    // three dt, their p and their shadows
    const pw = DW - 20 + 210 * m, px = DX + 10 - 105 * m;
    for (let k = 0; k < 3; k++) {
      const a = 10.4 + 1.2 * k;
      const D = [DX, DY[k], DW, DH], P = [px, DY[k] + 25, pw, 20];
      const dt = $(`.t0816-dt[data-k="${k}"]`), p = $(`.t0816-p[data-k="${k}"]`);
      const gd = $(`.t0816-g[data-g="dt"][data-k="${k}"]`), gp = $(`.t0816-g[data-g="p"][data-k="${k}"]`);
      box(dt, D, rad * rr(DW, DH)); box(gd, D, rad * rr(DW, DH));
      box(p, P, rad * 10); box(gp, P, rad * 10);
      dt.style.background = fill('dt');
      // In the result, only the ends of the bar that lie on the pills are painted: a blue bar on the blue canvas leaves faint edges.
      p.style.background = !teach && t >= FIN ? 'linear-gradient(90deg, var(--t0816-bg) 31px, transparent 0 calc(100% - 31px), var(--t0816-bg) 0)' : fill('p');
      dt.style.opacity = gone * pr(t, [a, a + 0.6]);
      p.style.opacity = pr(t, [a + 0.3, a + 0.9]);
      gd.style.opacity = 0.9 * win(t, a, 19.8);
      gp.style.opacity = 0.9 * Math.max(win(t, a + 0.3, 15.8), win(t, 25.2, 30.8));
      for (const s of [-1, 1]) {
        const sh = $(`.t0816-sh[data-k="${k}"][data-s="${s}"]`);
        box(sh, [DX + s * off, DY[k], DW, DH], rad * rr(DW, DH));
        sh.style.opacity = pr(t, [20.3, 20.8]);
      }
    }
    $$('.t0816-d, .t0816-m').forEach((e) => {
      const i = +(e.dataset.d || e.dataset.m);
      e.style.opacity = [0, win(t, 1, 4.8), win(t, 6, 9.8), win(t, 11, 15.8)][i];
    });
    [[0.2, 4.8], [5.2, 9.8], [10.2, 15.8], [16.2, 19.8], [20.2, 24.8], [25.2, 30.6]].forEach(([a, z], i) => ($(`.t0816-l[data-l="${i + 1}"]`).style.opacity = win(t, a, z)));
    let txt = '';
    if (step === 0) txt = `html${c} (96${sep} ${n2(2.8)}) · 208 × ${n2(331.84)}`;
    else if (step === 1) txt = `body${c} (${n2(151.11)}${sep} ${n2(14.11)}) · ${n2(97.78)} × ${n2(290.53)}`;
    else if (step === 2) txt = `dt${c} x = ${n2(179.77)} · y = ${n2(24.64)}, ${n2(114.64)}, ${n2(204.64)}`;
    else if (step === 3) txt = `border-radius${c} dt ${n2(20.23 * rad)}px · p ${n2(10 * rad)}px`;
    else if (step === 4) txt = `${fr ? 'ombres' : 'shadows'}${c} x = ${n2(DX - off)} ${fr ? 'et' : 'and'} ${n2(DX + off)}`;
    else if (step === 5) txt = `p${c} ${n2(pw)}px · x = ${n2(px)} → ${n2(px + pw)}`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
