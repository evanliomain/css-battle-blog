<div class="cap" data-t="0" data-step="body : 40 × 40"><h3>1. <code>body</code> : 40 × 40</h3><p>Pas de doctype : la page est en mode quirks, et les nombres sans unité sont des px. Dans <code>margin:50+45%210</code>, les <code>+</code> séparent les valeurs : 50px en haut, 45 % sur les côtés, 210px en bas. 45 % de 400 font 180px. En mode quirks, le body est étiré sur la hauteur de la fenêtre, moins ses marges : 300 − 50 − 210 = 40px. Le body est un carré de 40 × 40 en (180 ; 50). <code>bgcolor=51a499</code> peint tout le canevas.</p></div>

<div class="cap" data-t="17" data-step="Jaune du haut"><h3>4. Jaune du haut</h3><p><code>0+5vw+0+5vw</code> : 20px vers le bas, 20px d'étalement. 40 + 2 × 20 = 80 : un carré de 80 × 80, de (160 ; 50) à (240 ; 130), de la même couleur du texte.</p></div>

<div class="cap" data-t="28" data-step="Le trou sous le body"><h3>6. Le trou sous le <code>body</code></h3><p>Une ombre <code>box-shadow</code> n'est jamais peinte sous sa propre boîte. La boîte du body, de (180 ; 50) à (220 ; 90), reste vide. Le body n'y peint pas de fond : <code>html</code> n'en a pas, donc le fond du body passe au canevas. On voit le canevas sarcelle : l'encoche du haut.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0818 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const S = (k) => $(`.t0818-s[data-s="${k}"]`);
  const L = (k) => $(`.t0818-l[data-l="${k}"]`);
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const box = (e, r) => { e.style.left = `${r[0]}px`; e.style.top = `${r[1]}px`; e.style.width = `${r[2]}px`; e.style.height = `${r[3]}px`; };
  const r0 = (v) => Math.round(v);
  const c = fr ? ' :' : ':';
  const sep = fr ? ' ;' : ',';
  // Measured on the official code (getBoundingClientRect, computed styles, one shadow at a time on a white canvas):
  // body 40 × 40 at (180, 50), margins 50px 180px 210px, font 16px.
  // 4th shadow: x 100..299, y 50..249 · 3rd: x 160..239, y 170..249 · 2nd: x 160..239, y 50..129 (4800 px: none under the body)
  // 1st: x 180..219, y 210..249.
  // [offset y, spread, offset window, spread window, appear]
  const SH = { 4: [80, 80, [5.6, 7.6], [8.2, 10.2], 5.2], 3: [140, 20, [11.6, 13.6], [14.2, 15.8], 11.2], 2: [20, 20, [17.6, 18.8], [19.4, 21], 17.2], 1: [160, 0, [23.6, 25.8], [0, 1], 23.2] };
  const real = { 4: 'dk', 3: 'ye', 2: 'ye', 1: 'tl' };
  const nth = { 4: fr ? '4ᵉ' : '4th', 3: fr ? '3ᵉ' : '3rd', 2: fr ? '2ᵉ' : '2nd', 1: fr ? '1ʳᵉ' : '1st' };
  const FIN = 32;
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    const geo = {};
    for (const k of [4, 3, 2, 1]) {
      const [oy, sp, wo, ws, ap] = SH[k];
      const o = oy * pr(t, wo), s = sp ? sp * pr(t, ws) : 0;
      // The teal patch ends 1px lower than its real 250: same color as the canvas, it hides the row the 4th shadow
      // would leave at the scaled stage size (no seam under the bottom notch).
      const ext = k === 1 ? pr(t, wo) : 0;
      geo[k] = [180 - s, 50 + o - s, 40 + 2 * s, 40 + 2 * s];
      box(S(k), [geo[k][0], geo[k][1], geo[k][2], geo[k][3] + ext]);
      S(k).style.opacity = pr(t, [ap, ap + 0.4]);
      S(k).style.background = `var(--t0818-${teach ? `s${k}` : real[k]})`;
    }
    // the moving copy of the body box, while a shadow is offset and spread
    const cur = { 1: 4, 2: 3, 3: 2, 4: 1 }[step];
    const mv = $('.t0818-g[data-g="move"]');
    if (cur) {
      const [, , , , ap] = SH[cur];
      box(mv, geo[cur]);
      mv.style.opacity = win(t, ap, ap + 5.4) * 0.9;
    } else mv.style.opacity = 0;
    const body = $('.t0818-g[data-g="body"]');
    const blink = step === 5 ? 0.55 + 0.45 * Math.cos((t - 28) * Math.PI * 1.2) : 1;
    body.style.opacity = 0.95 * Math.max(win(t, 0.3, 5.2), win(t, 27.8, 31.6) * blink, t >= 5 && t < 28 ? 0.45 : 0);
    const dims = win(t, 1.4, 4.6);
    $$('.t0818-d, .t0818-m').forEach((e) => (e.style.opacity = dims));
    [[0.2, 4.6], [5.2, 10.6], [11.2, 16.6], [17.2, 22.6], [23.2, 27.6], [28.2, 31.6]].forEach(([a, z], i) => (L(i + 1).style.opacity = win(t, a, z)));
    let txt = '';
    if (step === 0) txt = `body${c} 40 × 40 · (180${sep} 50)`;
    else if (step >= 1 && step <= 4) {
      const g = geo[cur];
      txt = `${nth[cur]} ${fr ? 'ombre' : 'shadow'}${c} ${r0(g[2])} × ${r0(g[3])} · (${r0(g[0])}${sep} ${r0(g[1])}) → (${r0(g[0] + g[2])}${sep} ${r0(g[1] + g[3])})`;
    } else if (step === 5) txt = `body${c} (180${sep} 50) → (220${sep} 90) · ${fr ? 'canevas' : 'canvas'} #51a499`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
