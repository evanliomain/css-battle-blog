<div class="cap" data-t="0" data-step="html en vert"><h3>1. html : un canevas vert</h3><p>Pas de doctype : la page est en mode quirks. <code>*</code> vise html, head, style et body ; head et style sont masqués. html fait 400 × 300, et son fond <code>#4A9A86</code> passe à tout le canevas. Tout le reste est peint par-dessus.</p></div>
<div class="cap" data-t="4.5" data-step="L'image"><h3>2. L'image : un anneau sur du violet</h3><p>Le débord <code>5vw</code> vaut 20px : la zone de la border-image fait 440 × 340, depuis (−20 ; −20). Le dégradé la remplit. Son centre : 50 % de 440, et <code>25vw</code> = 100px vers le bas, soit (200 ; 80) sur le canevas. Transparent jusqu'à 74q = 69,92px, crème jusqu'à <code>5lh</code>, puis violet. Dans html, 1lh vaut 18px : l'anneau s'arrête à 90px.</p></div>
<div class="cap" data-t="9.5" data-step="La tige"><h3>3. Les tranches : un trou de 30px</h3><p>77in = 7392px et 2lh = 36px : <code>min(77in/2lh)</code> vaut 205,33, gardé à 205. Les tranches : 20 en haut et en bas, 205 à gauche et à droite. Avec <code>auto</code>, chaque bord a la taille de sa tranche : l'image reste telle quelle, sauf le milieu, jamais peint. Ce milieu va de x = 185 à 215 sur toute la hauteur : le fond vert s'y voit, c'est la tige.</p></div>
<div class="cap" data-t="14.5" data-step="body"><h3>4. body : le bloc vert</h3><p>Le <code>*{</code> imbriqué vaut <code>* *</code> : head, style et body. Seul body s'affiche. <code>25%</code> vaut 100px : body va de x = 100 à 300. En mode quirks, il prend la hauteur de html moins sa marge basse : 300 − 240 = 60. Il garde le fond vert de <code>*</code> et cache le haut de l'anneau.</p></div>
<div class="cap" data-t="19" data-step="Police"><h3>5. font : un autre 1lh</h3><p><code>9lh</code> se calcule avec le 1lh de html : 9 × 18 = 162px. Dans body, 1lh vaut alors 187px. La même border-image change : <code>5lh</code> = 935px, et 7392 / 374 = 19,76, gardé à 20. Sa zone fait 240 × 100, depuis (80 ; −20), avec le même centre (200 ; 80). Crème partout, sauf le disque transparent.</p></div>
<div class="cap" data-t="24" data-step="Cadre"><h3>6. Un cadre de 20px</h3><p>Tranches de 20 partout, largeur <code>auto</code> = 20px. Le milieu non peint fait 200 × 60 : c'est la boîte de body. Il ne reste qu'un cadre crème de 20px, tout entier dans le débord. Là où son bas croise le disque, il est transparent : le disque vert reste entier.</p></div>
<div class="cap" data-t="29" data-step="Résultat" data-live="156 caractères · 100 % identique"><h3>7. Résultat : 156 caractères</h3><p>Une seule border-image, lue avec deux hauteurs de ligne. Dans html, son milieu non peint fait la tige. Autour de body, elle fait le liseré crème.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0728 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const c = fr ? '\u00a0:' : ':';
  const sc = fr ? '\u00a0;' : ',';
  // Measured on the official code in local Chrome (quirks mode, 400 × 300):
  // html 400 × 300, 1lh = 18px, border-image-slice 20 205, width auto (= 20px 205px), outset 20px:
  //   area (-20, -20) 440 × 340, gradient center (200, 80), transparent to 74q = 69.92px, cream to 90px, then purple.
  // body (100, 0) 200 × 60, font-size 162px, 1lh = 187px, slice 20, width auto (= 20px), outset 20px:
  //   area (80, -20) 240 × 100, same center, transparent to 69.92px, cream to 935px.
  const FIN = 29;
  const hbg = $('.t0728-hbg'), hbi = $('.t0728-hbi'), bbg = $('.t0728-bbg'), bbi = $('.t0728-bbi');
  const ha = $('.t0728-ha'), bb = $('.t0728-bb'), ba = $('.t0728-ba'), sl = $$('.t0728-sl');
  const L = (k) => $$(`.t0728-l[data-l="${k}"]`);
  const hole = (W, H, x0, x1, y0, y1) => `polygon(evenodd, 0 0, ${W}px 0, ${W}px ${H}px, 0 ${H}px, 0 0, ${x0}px ${y0}px, ${x1}px ${y0}px, ${x1}px ${y1}px, ${x0}px ${y1}px, ${x0}px ${y0}px)`;
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    const ann = 1 - pr(t, [FIN, FIN + 0.6]);
    const v = (k, r) => `var(--t0728-${teach ? k : r})`;
    // html: background, then its border image, then the gap in the middle
    hbg.style.background = v('hb', 'gr');
    const a = pr(t, [5, 6.6]);
    hbi.style.opacity = a;
    hbi.style.background = `radial-gradient(circle at 220px 100px, transparent 69.92px, ${v('ri', 'cr')} 0 90px, ${v('ou', 'pu')} 0)`;
    const w = 30 * pr(t, [10.2, 12.8]);
    hbi.style.clipPath = hole(440, 340, 220 - w / 2, 220 + w / 2, 20, 320);
    ha.style.opacity = 0.9 * win(t, 4.7, 13.9);
    sl.forEach((e) => (e.style.opacity = 0.9 * win(t, 9.7, 13.9)));
    // body: its box, then its border image, then the 20px frame
    const f = pr(t, [24.5, 27]);
    const g = f >= 1 ? 1 : 0; // once the frame is cut, body's background slips 1px under it
    Object.assign(bbg.style, { left: `${100 - g}px`, top: `${-g}px`, width: `${200 + 2 * g}px`, height: `${60 + 2 * g}px` });
    bbg.style.opacity = pr(t, [15, 16.2]);
    bbg.style.background = v('bb', 'gr');
    bbi.style.opacity = pr(t, [19.6, 21.2]);
    bbi.style.background = `radial-gradient(circle at 120px 100px, transparent 69.92px, ${v('bi', 'cr')} 0)`;
    bbi.style.clipPath = hole(240, 100, 120 - 100 * f, 120 + 100 * f, 50 - 30 * f, 50 + 30 * f);
    bb.style.opacity = 0.9 * win(t, 14.7, 28.7);
    ba.style.opacity = 0.9 * win(t, 19.2, 28.7);
    [[0.3, 4.2], [4.8, 9.2], [9.8, 14.2], [14.8, 18.7], [19.3, 23.7], [24.3, 28.7]].forEach(([p, z], k) => L(k + 1).forEach((e) => (e.style.opacity = win(t, p, z) * ann)));
    let txt;
    if (step === 0) txt = `html${c} 400 × 300 · #4A9A86`;
    else if (step === 1) txt = `border-image${c} 440 × 340 · (200${sc} 80)`;
    else if (step === 2) txt = `${fr ? 'trou' : 'gap'}${c} ${Math.round(w)}px · x = ${Math.round(200 - w / 2)} → ${Math.round(200 + w / 2)}`;
    else if (step === 3) txt = `body${c} 200 × 60 · (100${sc} 0)`;
    else if (step === 4) txt = `body${c} 1lh = 187px · 5lh = 935px`;
    else if (step === 5) txt = `${fr ? 'cadre' : 'frame'}${c} 20px · 240 × 100`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
