<div class="cap" data-t="0" data-step="Deux boîtes"><h3>1. Deux boîtes</h3><p>Le premier <code>*{</code> vise tous les éléments, html compris. Tous reçoivent <code>margin:40 26.2%18.6%</code>. Pas de doctype : en mode quirks, <code>40</code> est en px. html a 26,2 % de 400 = 104,8 sur les côtés : 190,4 de large, en (104,8 ; 40). Pour body, les pourcentages se prennent sur les 190,4 de html : 49,88 sur les côtés, donc 90,66 de large, en (154,67 ; 80). Le mode quirks étire body à 110,2 de haut.</p></div>
<div class="cap" data-t="5" data-step="Deux échelles"><h3>2. Deux échelles</h3><p>Le <code>*{</code> imbriqué vise head, style et body, mais pas html. <code>font:82%/1%'</code> donne à body 82 % de 16 = 13,12px, et une hauteur de ligne de 1 % : 0,1312px. Le <code>'</code> seul ouvre un nom de police vide, et la règle reste valide. html garde 16px et une hauteur de ligne <code>normal</code> : 1lh = 18px dans mon Chrome. Le même code donne donc deux tailles : 28lh vaut 504px pour html et 3,67px pour body.</p></div>
<div class="cap" data-t="10" data-step="Fond de html"><h3>3. Le fond de html</h3><p>Le fond de html couvre tout le canevas, mais ses tuiles se calent sur la boîte de html : 109,76 × 190,2, décalées de 333q = 314,65px, centrées en hauteur. Le cercle a 504px de rayon : <code>#8885</code> jusqu'à 5 % = 25,2px, puis le <code>0</code> fait un bord net, puis du vert. Le rose commencerait à 677 % = 3412px : jamais sur le canevas. Il reste 4 disques gris, en y = 135,1.</p></div>
