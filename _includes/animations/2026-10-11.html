<div class="cap" data-t="0" data-step="Un dégradé presque tout rouge"><h3>1. Un dégradé presque tout rouge</h3><p>L'image, sur <code>html</code> (400 × 300) : une ellipse qui passe par les quatre coins (en pointillés, à voir en vue large). Rouge jusqu'à 70.1vw (280,4px), marine jusqu'à 99,279 % (≈ 280,8px), crème après. Le marine et le crème ne tiennent que dans les quatre coins, sur quelques pixels.</p></div>
<div class="cap" data-t="4" data-step="Des tranches minuscules"><h3>2. Des tranches minuscules</h3><p><code>.1%.67%1</code> découpe : 0,3px en haut, 2,68px sur les côtés, 1px en bas. Les coins sont minuscules. Vu de très près, celui d'en bas à gauche contient le bord crème, le fil marine et le rouge, en lignes presque droites.</p></div>
<div class="cap" data-t="9" data-step="Quatre coins couvrent tout"><h3>3. Quatre coins couvrent tout</h3><p><code>/80%60%40%</code> : 80 % + 40 % de la hauteur dépassent la boîte, toutes les largeurs sont réduites par ⅚. Haut 200px, côtés 200px, bas 100px : les quatre coins pavent le canevas. Bords et milieu n'ont plus de place.</p></div>
<div class="cap" data-t="13" data-step="Les coins du bas : le V"><h3>4. Les coins du bas : le V</h3><p>Chaque coin du bas étire sa tranche de 2,68 × 1 en 200 × 100 : ×74,6 en largeur, ×100 en hauteur. Les deux lignes deviennent des biais presque à 45° : le V marine et le triangle rouge, coupés net à y = 200.</p></div>
<div class="cap" data-t="17" data-step="Les coins du haut : le crème"><h3>5. Les coins du haut : le crème</h3><p>Les tranches du haut, de 0,3px, sont presque toutes crème : étirées en 200 × 200, elles remplissent le haut du canevas. Seul leur coin intérieur touche le fil marine, ce qui donne une fine pointe marine au milieu.</p></div>
<div class="cap" data-t="20.5" data-step="body : la tige rouge"><h3>6. body : la tige rouge</h3><p><code>margin:40 185 80</code> : le <code>body</code> fait 30 × 180. Même <code>border-image</code>, mais le rayon horizontal de l'ellipse n'est plus que de 21px environ : 280,4px de rouge la couvrent toute, et le marine n'a plus de place. Une barre rouge, qui cache la pointe marine.</p></div>
<div class="cap" data-t="25" data-step="Résultat" data-live="117 caractères · 100 % identique"><h3>7. Résultat : 117 caractères</h3><p>Pas de fond, pas de forme : quatre coins étirés et une barre.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t1011 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s), $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live'), end = $('.cap[data-live]').dataset.live;
  const grad = $('.grad'), ell = $('.ell'), cns = $$('.cn'), tints = $$('.tint'), vl = $('.vline'), hl = $('.hline');
  const Q = { tl: $('.q-tl'), tr: $('.q-tr'), bl: $('.q-bl'), br: $('.q-br') };
  const G = { tl: $('.g-tl'), tr: $('.g-tr'), bl: $('.g-bl'), br: $('.g-br') };
  const bBi = $('.b-bi'), bTint = $('.b-tint'), bOut = $('.b-out'), src = $('.src'), mag = $('.mag');
  const tags = $$('.tag[data-w]');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b, f = 0.5) => Math.min(pr(t, a, a + f), 1 - pr(t, b - f, b));
  const num = (v, d = 1) => v.toFixed(d).replace('.', fr ? ',' : '.');
  // quarter rectangles (canvas px) and their slices (image px)
  const R = { tl: [0, 0, 200, 200, 2.68, 0.3], tr: [200, 0, 200, 200, 2.68, 0.3], bl: [0, 200, 200, 100, 2.68, 1], br: [200, 200, 200, 100, 2.68, 1] };
  const grow = { bl: [13.3, 16], br: [13.3, 16], tl: [17.3, 20], tr: [17.3, 20] };
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const fin = pr(t, 25.2, 26.2);
    grad.style.opacity = Math.min(pr(t, 0, 0.6), 1 - pr(t, 13, 13.6));
    ell.style.opacity = win(t, 0.8, 9, 0.6);
    cns.forEach((c) => { c.style.opacity = win(t, 1.4, 4, 0.5); });
    src.style.opacity = mag.style.opacity = win(t, 4.1, 9, 0.5);
    tints.forEach((e) => { e.style.opacity = teach ? win(t, 9.3, 13.2, 0.5) : 0; });
    vl.style.opacity = hl.style.opacity = win(t, 9.2, 25.2, 0.5) * (1 - fin);
    let sc = [1, 1];
    for (const k of ['bl', 'br', 'tl', 'tr']) {
      const [x, y, w, h, sw, sh] = R[k];
      const p = pr(t, ...grow[k]);
      const sx = Math.exp(Math.log(sw / w) * (1 - p)), sy = Math.exp(Math.log(sh / h) * (1 - p));
      Q[k].style.opacity = t >= grow[k][0] ? 1 : 0;
      Q[k].style.transform = p < 1 ? `scale(${sx},${sy})` : "none";
      const gx = k[1] === 'l' ? x : x + w - w * sx, gy = k[0] === 't' ? y : y + h - h * sy;
      Object.assign(G[k].style, { left: gx + 'px', top: gy + 'px', width: Math.max(w * sx, 6) + 'px', height: Math.max(h * sy, 6) + 'px' });
      G[k].style.opacity = teach && t >= grow[k][0] ? 1 - fin : 0;
      if ((step === 3 && k === 'bl') || (step === 4 && k === 'tl')) sc = [sx * w / sw, sy * h / sh];
    }
    const bIn = pr(t, 21.5, 22.4);
    bBi.style.opacity = bIn;
    bTint.style.opacity = teach ? bIn * (1 - fin) : 0;
    bOut.style.opacity = win(t, 20.7, 25.2, 0.5);
    tags.forEach((g) => { g.style.opacity = +g.dataset.w === step + 1 ? win(t, +$$('.cap')[step].dataset.t + 0.3, step < 6 ? +$$('.cap')[step + 1].dataset.t : 99, 0.4) : 0; });
    let txt = '';
    if (step === 0) txt = fr ? 'rouge → 280,4px · marine → 280,8px · rayon 282,8px' : 'red → 280.4px · navy → 280.8px · radius 282.8px';
    else if (step === 1) txt = fr ? 'tranches : haut 0,3px · côtés 2,68px · bas 1px' : 'slices: top 0.3px · sides 2.68px · bottom 1px';
    else if (step === 2) txt = fr ? 'largeurs ×⅚ : haut 200 · côtés 200 · bas 100' : 'widths ×⅚: top 200 · sides 200 · bottom 100';
    else if (step === 3 || step === 4) txt = `×${num(sc[0])} ${fr ? 'en largeur' : 'across'} · ×${num(sc[1])} ${fr ? 'en hauteur' : 'down'}`;
    else if (step === 5) txt = fr ? 'body : 30 × 180 en (185, 40) · rayon ≈ 21,2px < 280,4px' : 'body: 30 × 180 at (185, 40) · radius ≈ 21.2px < 280.4px';
    else txt = end;
    live.textContent = txt;
  };
};
</script>
