<div class="cap" data-t="0" data-step="La boîte de html"><h3>1. html : 210 × 90</h3><p><code>&amp;</code> seul, hors de toute règle, vise la racine : html. Pas de doctype : mode quirks, les marges sans unité sont des px. <code>margin:60 95 150</code> laisse 400 − 95 − 95 = 210px de large. En mode quirks, html prend la hauteur de la fenêtre moins ses marges : 300 − 60 − 150 = 90, de y = 60 à 150. Le fond de la racine se peint sur tout le canevas : tout est corail.</p></div>
<div class="cap" data-t="5" data-step="Trois bordures"><h3>2. Une bordure, sauf à gauche</h3><p><code>*</code> donne à chaque élément une bordure crème de 32q. 1q vaut un quart de millimètre : 32q font 30,24px, et mon Chrome la dessine sur 30px. <code>border-left:0</code> retire le côté gauche. Pour html, il reste une barre en haut, de y = 60 à 90, une barre en bas, de y = 120 à 150, et le côté droit. Le tout est ouvert à gauche.</p></div>
<div class="cap" data-t="10" data-step="Le rayon"><h3>3. Deux coins arrondis</h3><p><code>border-radius:0 1in 1in 0</code> demande 96px aux deux coins droits. 96 + 96 = 192, plus que les 90px de haut : le navigateur réduit tous les rayons dans le même rapport, jusqu'à 45px. Le bord extérieur devient un demi-cercle de 45px de rayon. À l'intérieur, le rayon vaut 45 − 30 = 15 : le côté droit est un demi-anneau.</p></div>
<div class="cap" data-t="15" data-step="La largeur de body"><h3>4. body : 30px de large</h3><p>body a la bordure de <code>*</code>, et sa marge : <code>0 90-120</code>, soit 0 en haut, 90 à gauche et à droite, −120 en bas. Il se place dans le contenu de html, 180px de large à partir de x = 95. La marge gauche, hachurée, le met en x = 185. Il resterait 180 − 90 − 90 − 30 pour son contenu : moins que rien, donc 0. body ne fait que la largeur de sa bordure droite : de x = 185 à 215.</p></div>
<div class="cap" data-t="20" data-step="La hauteur de body"><h3>5. body descend jusqu'à y = 240</h3><p>En mode quirks, body prend la hauteur du contenu de html, 30px, moins ses marges du haut et du bas : 30 − 0 − (−120) = 150. Il va de y = 90 à 240, et croise la barre du bas. Sa boîte de marge fait 150 − 120 = 30px, la hauteur du contenu de html : html reste à 90px. Le pied du P va de y = 60 à 240.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0414 = (fig) => {
  const fr = document.documentElement.lang === 'fr';

  const win = (t, a, b) => Math.min(pr(t, a, a + 0.5), 1 - pr(t, b - 0.3, b));
  const n = (s) => (fr ? s.replace(/(\d)\.(\d)/g, '$1,$2') : s);
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  // Measured on the official code in local Chrome 157 (400 × 300 iframe, quirks mode, getBoundingClientRect, getComputedStyle):
  // html 95, 60, 210 × 90, margin 60px 95px 150px, borders 30px 30px 30px 0px (32q = 30.236px, drawn 30px), radii 96px, background rgb(238, 119, 102);
  // body 185, 90, 30 × 150, margin 0px 90px -120px, borders 30px 30px 30px 0px. Same edges as the target (x = 95, 185, 215, 305; y = 60, 90, 120, 150, 240).
  // In real colors, body is drawn from y = 89, under the top bar's edge, so that no seam shows at y = 90.
  const C = '#f2eaa8';
  const H = $('.t0414-html'), B = $('.t0414-body'), band = $('.t0414-band');
  const ol = (k) => $('.t0414-o' + k);
  const labs = $$('.zlab');
  const ivs = { 1: [0.3, 4.8], 2: [5.3, 9.8], 3: [10.3, 14.8], 4: [15.3, 19.8], 5: [20.3, 24.8] };
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const tw = teach ? 1 - pr(t, 25.2, 26.2) : 0;
    ol('html').style.opacity = win(t, 0.3, 4.8);
    // html's border grows to 30px, then its right corners round to 45px
    const bw = 30 * pr(t, 5.5, 7.5);
    H.style.borderWidth = `${bw}px ${bw}px ${bw}px 0`;
    H.style.borderColor = mix(tw, 'var(--t0414-hb)', C);
    const r = 45 * pr(t, 10.5, 12.5);
    H.style.borderRadius = `0 ${r}px ${r}px 0`;
    // body: its right border, 30px wide, then 150px tall
    const ov = 1 - tw;
    const bh = 30 + 120 * pr(t, 20.5, 22.5);
    B.style.top = 90 - ov + 'px';
    B.style.height = bh + ov + 'px';
    B.style.opacity = pr(t, 15.5, 16.5);
    B.style.background = mix(tw, 'var(--t0414-bd)', C);
    band.style.opacity = win(t, 15.5, 19.8);
    ol('cont').style.opacity = win(t, 15.5, 19.8);
    ol('body').style.opacity = win(t, 22.5, 24.8);
    labs.forEach((l) => { const iv = ivs[l.dataset.l]; l.style.opacity = iv ? win(t, ...iv) : 0; });
    let txt;
    if (step === 0) txt = `400 − 95 − 95 = 210 · 300 − 60 − 150 = 90`;
    else if (step === 1) txt = `32q = 8mm = 30.24px · 60 + 30 = 90 · 150 − 30 = 120`;
    else if (step === 2) txt = `96 × 90 / 192 = 45 · 45 − 30 = 15`;
    else if (step === 3) txt = `95 + 90 = 185 · 185 + 30 = 215`;
    else if (step === 4) txt = `30 − 0 + 120 = 150 · 90 + 150 = 240 · 150 − 120 = 30`;
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = n(txt);
  };
};
