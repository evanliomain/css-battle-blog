{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="html : le cadre"><h3>1. <code>html</code> : le cadre</h3><p><code>*</code> vise tous les éléments. 5vw, c'est 5 % de 400px : 20px. En mode quirks, <code>html</code> remplit le cadre de 400 × 300 moins ses marges : 220 × 150, de (90 ; 75) à (310 ; 225). Sa bordure noire est le contour de la mallette. Le fond orange du <code>body</code> va sur tout le canevas, parce que <code>html</code> n'a pas de fond.</p></div>
<div class="cap" data-t="4" data-step="body : la poignée"><h3>2. <code>body</code> : la poignée</h3><p><code>+*</code>, c'est <code>* + *</code> : un élément qui en suit un autre. Ici, le <code>body</code>, après <code>head</code>. En mode quirks, le body s'étire pour remplir la boîte de contenu de <code>html</code>, haute de 110px, moins ses marges : 110 + 50 − 110 = 50px de haut, et 180 − 2 × 40 = 100px de large. Il va de (150 ; 45) à (250 ; 95), avec des coins arrondis de 20px. Sa bordure du bas se pose sur celle de <code>html</code>. Son intérieur reste orange : son fond est peint sur le canevas, pas dans sa boîte.</p></div>
<div class="cap" data-t="8.5" data-step="dt : la barre du milieu"><h3>3. <code>dt</code> : la barre du milieu</h3><p>Le <code>*</code> imbriqué vise ce qui est dans le body : <code>dt</code> et <code>h1</code>. Le dt part de la boîte de contenu du body, 60px de large à y = 65. <code>margin:75-80-150</code> le descend de 75px, à y = 140, et l'élargit de 80px de chaque côté : 220px, de x = 90 à 310. Ses côtés et son bas tombent sur la bordure de <code>html</code> : seule sa bordure du haut se voit, la barre. La marge de −150 ramène sa boîte de marge à 75 + 85 − 150 = 10px, la hauteur de contenu du body : ni le body ni <code>html</code> ne grandissent.</p></div>
<div class="cap" data-t="13" data-step="h1 : une ligne vide"><h3>4. <code>h1</code> : une ligne vide</h3><p>Le h1 contient une espace insécable. Pour le HTML, ce n'est pas un blanc : le h1 a donc une ligne, haute de 37px en 32px. Avec ses bordures : 77px. <code>margin:-40 30 8</code> le place de (140 ; 120) à (260 ; 197). Sa boîte de marge, −40 + 77 + 8 = 45px, fait la hauteur de contenu du dt : le dt fait 85px, et sa bordure du bas tombe sur celle de <code>html</code>. Ici, la bordure du h1 est noire, comme elle le serait sans <code>color</code>.</p></div>
<div class="cap" data-t="17.5" data-step="color:F3AC3C"><h3>5. <code>color:F3AC3C</code></h3><p>Pas de <code>#</code> : en mode quirks, Chrome lit quand même une couleur hexadécimale pour <code>color</code>. La bordure prend la couleur du texte : celle du h1 devient orange. Son haut et son bas se perdent dans l'orange de l'intérieur. Ses deux côtés, de x = 140 à 160 et de 240 à 260, coupent la barre en trois.</p></div>
<div class="cap" data-t="21.5" data-step="Résultat" data-live="155 caractères · 100 % identique"><h3>6. Résultat : 155 caractères</h3><p>Quatre boîtes avec la même bordure noire de 20px : <code>html</code> pour le contour, le <code>body</code> pour la poignée, le <code>dt</code> pour la barre, et un <code>h1</code> dont la bordure orange ouvre deux trous.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html: the frame"><h3>1. <code>html</code>: the frame</h3><p><code>*</code> matches every element. 5vw is 5% of 400px: 20px. In quirks mode, <code>html</code> fills the 400 × 300 frame minus its margins: 220 × 150, from (90, 75) to (310, 225). Its black border is the outline of the briefcase. The <code>body</code>'s orange background goes to the whole canvas, because <code>html</code> has none.</p></div>
<div class="cap" data-t="4" data-step="body: the handle"><h3>2. <code>body</code>: the handle</h3><p><code>+*</code> is <code>* + *</code>: an element right after another one. Here, the <code>body</code>, after <code>head</code>. In quirks mode, the body stretches to fill the content box of <code>html</code>, 110px tall, minus its margins: 110 + 50 − 110 = 50px tall, and 180 − 2 × 40 = 100px wide. It goes from (150, 45) to (250, 95), with 20px rounded corners. Its bottom border sits on the border of <code>html</code>. Its inside stays orange: its background is painted on the canvas, not in its box.</p></div>
<div class="cap" data-t="8.5" data-step="dt: the middle bar"><h3>3. <code>dt</code>: the middle bar</h3><p>The nested <code>*</code> matches what is in the body: <code>dt</code> and <code>h1</code>. The dt starts in the body's content box, 60px wide at y = 65. <code>margin:75-80-150</code> moves it 75px down, to y = 140, and widens it by 80px on each side: 220px, from x = 90 to 310. Its sides and bottom land on the border of <code>html</code>: only its top border shows, the bar. The −150 margin brings its margin box down to 75 + 85 − 150 = 10px, the body's content height: neither the body nor <code>html</code> grows.</p></div>
<div class="cap" data-t="13" data-step="h1: an empty line"><h3>4. <code>h1</code>: an empty line</h3><p>The h1 holds a no-break space. For HTML, it is not white space, so the h1 gets a line: 37px tall at 32px. With its borders: 77px. <code>margin:-40 30 8</code> puts it from (140, 120) to (260, 197). Its margin box, −40 + 77 + 8 = 45px, is the dt's content height: the dt is 85px tall, and its bottom border lands on the border of <code>html</code>. Here the h1's border is black, as it would be without <code>color</code>.</p></div>
<div class="cap" data-t="17.5" data-step="color:F3AC3C"><h3>5. <code>color:F3AC3C</code></h3><p>No <code>#</code>: in quirks mode, Chrome still reads a hex color for <code>color</code>. The border takes the text color, so the h1's border turns orange. Its top and bottom are lost in the orange inside. Its two sides, from x = 140 to 160 and from 240 to 260, cut the bar in three.</p></div>
<div class="cap" data-t="21.5" data-step="Result" data-live="155 characters · 100% match"><h3>6. Result: 155 characters</h3><p>Four boxes with the same 20px black border: <code>html</code> for the outline, the <code>body</code> for the handle, the <code>dt</code> for the bar, and an <code>h1</code> whose orange border opens two gaps.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0823 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const H = $('.t0823-html'), B = $('.t0823-body'), D = $('.t0823-dt'), H1 = $('.t0823-h1');
  const LN = $('.t0823-ln'), G = $('.t0823-g'), OL = $('.t0823-o'), live = $('.live');
  const L = (k) => $(`.t0823-l[data-l="${k}"]`);
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const mix = (a, b, p) => a.map((v, i) => v + (b[i] - v) * p);
  const box = (e, r) => { e.style.left = `${r[0]}px`; e.style.top = `${r[1]}px`; e.style.width = `${r[2]}px`; e.style.height = `${r[3]}px`; };
  const n = (v) => Math.round(v);
  const c = fr ? '\u00a0:' : ':';
  // [x, y, w, h] in canvas px, measured with getBoundingClientRect on the official code
  const R = {
    canvas: [0, 0, 400, 300], html: [90, 75, 220, 150], hc: [110, 95, 180, 110],
    body: [150, 45, 100, 50], bc: [170, 65, 60, 10], dt: [90, 140, 220, 85],
    dc: [110, 160, 180, 45], h1: [140, 120, 120, 77],
  };
  const W = { h: [0.8, 2.8], b: [5, 7], d: [9.5, 11.5], i: [14, 16], col: [18.2, 19.4], fin: [21.5, 22.1] };
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < W.fin[0];
    // 1. html
    const ph = pr(t, W.h), hr = mix(R.canvas, R.html, ph);
    box(H, hr);
    H.style.opacity = pr(t, [0.1, 0.6]);
    H.style.borderColor = teach ? 'var(--t0823-th)' : '#000';
    // 2. body: from the content box of html to its place
    const pb = pr(t, W.b), br = mix(R.hc, R.body, pb);
    box(B, br);
    B.style.opacity = pr(t, [4.2, 4.7]);
    // once in place, in real colors, the parts that lie exactly on the html border are left to it (no doubled edge)
    B.style.borderColor = teach ? 'var(--t0823-tb)' : pb >= 1 ? '#000 #000 transparent' : '#000';
    // 3. dt: from the content box of the body to its place (its height, 85px, comes from the h1)
    const pd = pr(t, W.d), dr = mix([R.bc[0], R.bc[1], R.bc[2], 85], R.dt, pd);
    box(D, dr);
    D.style.opacity = pr(t, [8.7, 9.2]);
    D.style.borderColor = teach ? 'var(--t0823-td)' : pd >= 1 ? '#000 transparent transparent' : '#000';
    // 4. h1: from the content box of the dt to its place; 5. its border turns orange
    const pi = pr(t, W.i), ir = mix([R.dc[0], R.dc[1], R.dc[2], 77], R.h1, pi);
    box(H1, ir);
    H1.style.opacity = pr(t, [13.2, 13.7]);
    const pc = pr(t, W.col);
    H1.style.borderColor = pc >= 1 ? 'var(--t0823-or)' : `color-mix(in srgb, var(--t0823-or) ${pc * 100}%, ${teach ? 'var(--t0823-t1)' : '#000'})`;
    box(LN, [ir[0] + 20, ir[1] + 20, ir[2] - 40, 37]);
    LN.style.opacity = teach ? win(t, 13.6, 17.9) : 0;
    box(OL, ir);
    OL.style.opacity = teach ? pr(t, [18.6, 19.2]) * (1 - pr(t, [21.1, 21.5])) : 0;
    // dashed guide: the parent's content box while each element moves in
    const g = [[R.canvas, 0.2, 3.8], [R.hc, 4.2, 8.2], [R.bc, 8.7, 12.7], [R.dc, 13.2, 17.3]];
    G.style.opacity = 0;
    for (const [r, a, z] of g) if (t >= a && t <= z) { box(G, r); G.style.opacity = 0.85 * win(t, a, z); }
    const lw = [[0.2, 3.9], [4.2, 8.3], [8.7, 12.8], [13.2, 17.3], [17.7, 21.3]];
    lw.forEach(([a, z], k) => (L(k + 1).style.opacity = win(t, a, z)));
    let txt = '';
    if (step === 0) txt = `html${c} ${n(hr[2])} × ${n(hr[3])} · ${fr ? 'de' : 'from'} (${n(hr[0])}${fr ? '\u00a0;' : ','} ${n(hr[1])})`;
    else if (step === 1) txt = `body${c} ${n(br[2])} × ${n(br[3])} · x ${n(br[0])} → ${n(br[0] + br[2])} · y ${n(br[1])} → ${n(br[1] + br[3])}`;
    else if (step === 2) txt = `dt${c} x ${n(dr[0])} → ${n(dr[0] + dr[2])} · y ${n(dr[1])} → ${n(dr[1] + dr[3])}`;
    else if (step === 3) txt = `h1${c} ${n(ir[2])} × 77 · x ${n(ir[0])} → ${n(ir[0] + ir[2])} · y ${n(ir[1])} → ${n(ir[1] + 77)}`;
    else if (step === 4) txt = `h1 · border-color${c} ${pc >= 1 ? '#F3AC3C' : fr ? 'noir → #F3AC3C' : 'black → #F3AC3C'}`;
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
