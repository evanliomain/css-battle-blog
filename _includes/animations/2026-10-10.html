<div class="cap" data-t="0" data-step="Le fond du body sur le canevas"><h3>1. Le fond du body sur le canevas</h3><p><code>html</code> n'a pas de fond : celui du <code>body</code>, <code>#042f38</code>, est donc peint sur tout le canevas.</p></div>
<div class="cap" data-t="3" data-step="html : une boîte de 70 × 130"><h3>2. html : une boîte de 70 × 130</h3><p><code>margin:85 40%85 170</code> : 40 % de 400px = 160px à droite, 170px à gauche, il reste 70px de large. En mode quirks, la hauteur vaut 300 − 2 × 85 = 130.</p></div>
<div class="cap" data-t="6" data-step="Un dégradé découpé en neuf"><h3>3. Un dégradé découpé en neuf</h3><p>Le <code>conic-gradient</code> part du haut et tourne : la moitié droite est grise, la gauche dorée. Il couvre la boîte (70 × 130), et <code>10 30%</code> le découpe : 10px en haut et en bas, 21px à gauche et à droite.</p></div>
<div class="cap" data-t="10" data-step="Seuls les coins restent"><h3>4. Seuls les coins restent</h3><p><code>/5ch 29%</code> fixe la taille des bords : 40px en haut et en bas, ≈ 20px sur les côtés. Les coins deviennent des rectangles de 20 × 40. Avec <code>space</code>, une tuile de bord trop grande pour sa place n'est pas dessinée, et sans <code>fill</code> le milieu non plus.</p></div>
<div class="cap" data-t="14" data-step="body : une bande de 1630px"><h3>5. body : une bande de 1630px</h3><p><code>margin:55-780</code> : 55px en haut et en bas, −780px sur les côtés. Le <code>body</code> devient une bande de 1630 × 20 qui déborde de 610px de chaque côté. Ses bords de 40px ne tiennent pas dans 20px : tous sont réduits au quart.</p></div>
<div class="cap" data-t="18" data-step="space : deux tuiles, trois espaces"><h3>6. space : deux tuiles, trois espaces</h3><p>Les coins font 118 × 10, hors du canevas. Le morceau du haut, doré puis gris, fait 652px de large. Il en tient deux sur 1394px ; <code>space</code> répartit les 90px qui restent en trois espaces de 30px. Le bord du bas fait pareil, juste dessous.</p></div>
<div class="cap" data-t="23" data-step="L'espace du milieu"><h3>7. L'espace du milieu</h3><p>Sur le canevas : la fin grise de la 1re tuile, l'espace du milieu de x=190 à 220, puis le début doré de la 2e. Les couleurs s'échangent d'un côté à l'autre.</p></div>
<div class="cap" data-t="26" data-step="Résultat" data-live="133 caractères · 100 % identique"><h3>8. Résultat : 133 caractères</h3><p>Un seul <code>border-image</code>, lu sur deux boîtes : les coins sur le petit <code>html</code>, les bords sur le large <code>body</code>. L'image complète en 133 caractères.</p></div>

<div class="cap" data-t="3" data-step="html: a 70 × 130 box"><h3>2. html: a 70 × 130 box</h3><p><code>margin:85 40%85 170</code>: 40% of 400px = 160px on the right, 170px on the left, which leaves 70px of width. In quirks mode the height is 300 − 2 × 85 = 130.</p></div>
<div class="cap" data-t="6" data-step="A gradient cut in nine"><h3>3. A gradient cut in nine</h3><p>The <code>conic-gradient</code> starts at the top and turns: the right half is grey, the left half gold. It covers the box (70 × 130), and <code>10 30%</code> slices it: 10px at the top and bottom, 21px on the left and right.</p></div>
<div class="cap" data-t="10" data-step="Only the corners stay"><h3>4. Only the corners stay</h3><p><code>/5ch 29%</code> sets the border sizes: 40px at the top and bottom, ≈ 20px on the sides. The corners become 20 × 40 rectangles. With <code>space</code>, an edge tile too big for its room is not drawn, and with no <code>fill</code>, neither is the middle.</p></div>
<div class="cap" data-t="14" data-step="body: a 1630px band"><h3>5. body: a 1630px band</h3><p><code>margin:55-780</code>: 55px at the top and bottom, −780px on the sides. <code>body</code> becomes a 1630 × 20 band that sticks out 610px on each side. Its 40px borders don't fit in 20px, so all of them are cut to a quarter.</p></div>
<div class="cap" data-t="18" data-step="space: two tiles, three gaps"><h3>6. space: two tiles, three gaps</h3><p>The corners are 118 × 10, off the canvas. The top piece, gold then grey, is 652px wide. Two fit in 1394px; <code>space</code> splits the 90px left into three 30px gaps. The bottom edge does the same, right below.</p></div>
<div class="cap" data-t="23" data-step="The middle gap"><h3>7. The middle gap</h3><p>On the canvas: the grey end of tile 1, the middle gap from x=190 to 220, then the gold start of tile 2. The colors swap from one side to the other.</p></div>
<div class="cap" data-t="26" data-step="Result" data-live="133 characters · 100% match"><h3>8. Result: 133 characters</h3><p>One <code>border-image</code>, read on two boxes: the corners on the small <code>html</code>, the edges on the wide <code>body</code>. The whole picture in 133 characters.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t1010 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const WHITE = $('.white'), HF = $('.hfull'), H = $('.h'), B = $('.b'), HBOX = $('.hbox'), BBOX = $('.bbox'), MID = $('.mid'), live = $('.live');
  const HS = $$('.hs'), E1 = $$('.e1'), COR = $$('.cor'), GAP = $$('.gap');
  const P = [1, 2, 3, 4].map((i) => $('.p' + i));
  const labs = $$('.lab');
  const caps = $$('.caps .cap');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const lerp = (a, b, m) => a + (b - a) * m;
  const n = (v, d = 0) => v.toFixed(d).replace('.', fr ? ',' : '.').replace('-', '−');
  const c = fr ? ' :' : ':';
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.6), 1 - pr(t, b - 0.5, b));
  const place = (el, x, y, w, h) => Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  const BI = 'conic-gradient(#d9d9d9 50%,#bfa148 0)10 30%/40px 29% space';
  // Label windows, in the order of the .lab elements.
  const LW = [[0.4, 3], [5, 6], [6.4, 10], [11.6, 14], [12, 14], [15, 18], [16, 18], [19.6, 23], [19.6, 23], [23.4, 26]];
  // Corner pieces: from their slice (21 × 10) to their border area (20.3 × 40).
  const PS = [[170, 85, 170, 85], [219, 85, 219.7, 85], [170, 205, 170, 175], [219, 205, 219.7, 175]];
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const real = !teach || t >= 26;
    const wide = fig.dataset.view === 'wide';
    WHITE.style.opacity = 1 - pr(t, 0.6, 2.4);
    // html: the canvas → 70 × 130 at (170, 85).
    const m = pr(t, 3.4, 5.4);
    const hx = lerp(0, 170, m), hy = lerp(0, 85, m), hw = lerp(400, 70, m), hh = lerp(300, 130, m);
    place(HBOX, hx, hy, hw, hh);
    HBOX.style.opacity = win(t, 3.2, 14.4);
    HF.style.opacity = Math.min(pr(t, 6.2, 7), 1 - pr(t, 10.4, 11.4));
    HS.forEach((e) => { e.style.opacity = win(t, 7, 11.4); });
    const k = pr(t, 10.4, 12);
    P.forEach((e, i) => {
      const [x0, y0, x1, y1] = PS[i];
      place(e, lerp(x0, x1, k), lerp(y0, y1, k), lerp(21, 20.3, k), lerp(10, 40, k));
      e.style.opacity = t >= 10.4 && t < 12.6 ? 1 : 0;
    });
    H.style.borderImage = t >= 12.6 ? BI : 'none';
    E1.forEach((e) => { e.style.opacity = win(t, 12, 14.2); });
    // body: html's box → the 1630 × 20 band at (−610, 140).
    const q = pr(t, 14.4, 16.6);
    const bx = lerp(170, -610, q), by = lerp(85, 140, q), bw = lerp(70, 1630, q), bh = lerp(130, 20, q);
    place(BBOX, bx, by, bw, bh);
    BBOX.style.opacity = win(t, 14.2, 19.6);
    B.style.borderImage = t >= 18.2 ? BI : 'none';
    B.style.opacity = pr(t, 18.2, 18.9);
    COR.forEach((e) => { e.style.opacity = real ? 0 : pr(t, 19, 19.6); });
    GAP.forEach((e) => { e.style.opacity = real ? 0 : pr(t, 19.4, 20); });
    MID.style.opacity = win(t, 23.2, 26);
    labs.forEach((e, i) => {
      const [x, y] = (wide ? e.dataset.w : e.dataset.c).split(' ');
      e.style.left = x + 'px';
      e.style.top = y + 'px';
      e.style.transform = wide ? 'scale(var(--k))' : '';
      e.style.opacity = win(t, LW[i][0], LW[i][1]);
    });
    let txt = '';
    if (step === 0) txt = fr ? 'fond du body #042f38 → canevas' : "body's background #042f38 → canvas";
    else if (step === 1) txt = `html${c} x ${n(hx)} → ${n(hx + hw)}, y ${n(hy)} → ${n(hy + hh)}`;
    else if (step === 2) txt = fr ? 'tranches : 10px · 30 % × 70 = 21px' : 'slices: 10px · 30% × 70 = 21px';
    else if (step === 3) txt = fr ? 'bords : 5ch = 40px · 29 % × 70 = 20,3px' : 'borders: 5ch = 40px · 29% × 70 = 20.3px';
    else if (step === 4) txt = `body${c} x ${n(bx)} → ${n(bx + bw)}, y ${n(by)} → ${n(by + bh)}`;
    else if (step === 5) txt = '1630 − 2 × 118 = 1394 = 2 × 652 + 3 × 30';
    else if (step === 6) txt = fr ? 'espace : x 190 → 220' : 'gap: x 190 → 220';
    else txt = caps[step].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
