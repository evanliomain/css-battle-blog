<div class="cap" data-t="0" data-step="Un jaune transparent"><h3>1. Un jaune transparent</h3><p>Seul en haut de la feuille, <code>&amp;</code> désigne la racine, <code>html</code>. <code>#dc26</code> est un hex à 4 chiffres : <code>#ddcc22</code> avec une opacité de <code>66</code>, soit 40 %. Le fond de <code>html</code> passe au canevas, posé sur le blanc de la page : on obtient <code>#f1eba7</code>, à un niveau près du <code>#f2eaa8</code> de la cible.</p></div>
<div class="cap" data-t="4" data-step="*{margin:75 : le body"><h3>2. <code>*{margin:75</code> : le body</h3><p>Imbriqué dans <code>&amp;</code>, ce <code>*</code> vise tout ce qui est dans <code>html</code>. Le <code>body</code> prend 75 de chaque côté. En mode quirks, il remplit la hauteur du cadre moins ses marges : une boîte de 250 × 150 en (75, 75). Les titres reçoivent aussi ce 75, mais la règle suivante le remplace.</p></div>
<div class="cap" data-t="8" data-step="Neuf titres, neuf carrés"><h3>3. Neuf titres, neuf carrés</h3><p>Un nouveau titre ferme le précédent : <code>&lt;h1>&lt;h4>&lt;h1>…</code> donne neuf frères dans le <code>body</code>, sans balise fermante. Ils sont vides, donc leur contenu fait 0 × 0. <code>border:5vh</code> = 15px autour de rien : un carré de 30. <code>float:left</code> les aligne, 8 tiennent dans 250 et le neuvième passe à la ligne. Les marges viennent à l'étape 5.</p></div>
<div class="cap" data-t="13" data-step="h1{width:50} : les barres"><h3>4. <code>h1{width:50}</code> : les barres</h3><p>Seuls les <code>h1</code> prennent une largeur : 15 + 50 + 15 = 80. Les <code>h4</code> et le <code>h5</code> restent à 30. Un <code>h1</code>, un carré et un <code>h1</code> font 190 : le <code>h1</code> suivant (80 de plus) ne tient plus dans 250 et passe à la ligne. Trois par rangée, trois rangées.</p></div>
<div class="cap" data-t="17" data-step="margin:0 4%30 : les écarts"><h3>5. <code>margin:0 4%30</code> : les écarts</h3><p>Une marge en % se calcule sur la largeur du bloc parent : 4 % de 250 = 10 à gauche et à droite. 30 en dessous. Une rangée fait 10 + 80 + 10 + 10 + 30 + 10 + 10 + 80 + 10 = 250, pile la largeur du <code>body</code>. Les rangées tombent en y = 75, 135 et 195.</p></div>
<div class="cap" data-t="21" data-step="border-radius:1ch : trois rayons"><h3>6. <code>border-radius:1ch</code> : trois rayons</h3><p>Ici, <code>1ch</code> vaut la moitié de la taille de police, et chaque balise de titre a la sienne. <code>h1</code> : 32px, rayon 16, ramené à 15 sur une barre de 30 de haut : une pilule. <code>h4</code> : 16px, rayon 8. <code>h5</code> : 13,28px, rayon 6,64. Une seule valeur, trois rayons choisis par les balises.</p></div>
<div class="cap" data-t="25" data-step="h4{rotate:4rad} : les losanges"><h3>7. <code>h4{rotate:4rad}</code> : les losanges</h3><p>4 radians = 229,18°. Un carré est le même tous les 90°, donc ça fait 49,18° : 4,18° de plus que 45. Sur un carré de 30 aux coins arrondis, le contour bouge de 0,72px au plus, et seuls quelques dizaines de pixels de bord changent. <code>4rad</code> a un caractère de moins que <code>45deg</code>.</p></div>
<div class="cap" data-t="30" data-step="Résultat" data-live="169 caractères · 100 % identique"><h3>8. Résultat : 169 caractères</h3><p>Neuf balises, pas un attribut. Ce sont les balises qui choisissent : la largeur (<code>h1</code>), le rayon (la taille de police de chaque titre) et la rotation (<code>h4</code>).</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="A see-through yellow"><h3>1. A see-through yellow</h3><p>Alone at the top of the sheet, <code>&amp;</code> is the root, <code>html</code>. <code>#dc26</code> is a 4-digit hex: <code>#ddcc22</code> with an alpha of <code>66</code>, which is 40%. <code>html</code>'s background goes to the canvas, over the page's white: that gives <code>#f1eba7</code>, one level away from the target's <code>#f2eaa8</code>.</p></div>
<div class="cap" data-t="4" data-step="*{margin:75: the body"><h3>2. <code>*{margin:75</code>: the body</h3><p>Nested in <code>&amp;</code>, this <code>*</code> targets everything inside <code>html</code>. The <code>body</code> gets 75 on each side. In quirks mode, it fills the frame's height minus its margins: a 250 × 150 box at (75, 75). The headings get this 75 too, but the next rule replaces it.</p></div>
<div class="cap" data-t="8" data-step="Nine headings, nine squares"><h3>3. Nine headings, nine squares</h3><p>A new heading closes the one before it: <code>&lt;h1>&lt;h4>&lt;h1>…</code> gives nine siblings in the <code>body</code>, with no closing tags. They are empty, so their content is 0 × 0. <code>border:5vh</code> = 15px around nothing: a 30px square. <code>float:left</code> lines them up: 8 fit in 250, and the ninth wraps. The margins come at step 5.</p></div>
<div class="cap" data-t="13" data-step="h1{width:50}: the bars"><h3>4. <code>h1{width:50}</code>: the bars</h3><p>Only the <code>h1</code>s get a width: 15 + 50 + 15 = 80. The <code>h4</code>s and the <code>h5</code> stay at 30. An <code>h1</code>, a square and an <code>h1</code> make 190: the next <code>h1</code> (80 more) no longer fits in 250 and wraps. Three per row, three rows.</p></div>
<div class="cap" data-t="17" data-step="margin:0 4%30: the gaps"><h3>5. <code>margin:0 4%30</code>: the gaps</h3><p>A margin in % is a share of the parent block's width: 4% of 250 = 10 on the left and on the right. 30 below. A row is 10 + 80 + 10 + 10 + 30 + 10 + 10 + 80 + 10 = 250, exactly the <code>body</code>'s width. The rows land at y = 75, 135 and 195.</p></div>
<div class="cap" data-t="21" data-step="border-radius:1ch: three radii"><h3>6. <code>border-radius:1ch</code>: three radii</h3><p>Here <code>1ch</code> is half the font size, and each heading tag has its own. <code>h1</code>: 32px, radius 16, scaled down to 15 on a bar 30 tall: a pill. <code>h4</code>: 16px, radius 8. <code>h5</code>: 13.28px, radius 6.64. One value, three radii, picked by the tags.</p></div>
<div class="cap" data-t="25" data-step="h4{rotate:4rad}: the diamonds"><h3>7. <code>h4{rotate:4rad}</code>: the diamonds</h3><p>4 radians = 229.18°. A square looks the same every 90°, so that is 49.18°: 4.18° more than 45. On a 30px square with rounded corners, the outline moves by 0.72px at most, and only a few dozen edge pixels change. <code>4rad</code> is one character shorter than <code>45deg</code>.</p></div>
<div class="cap" data-t="30" data-step="Result" data-live="169 characters · 100% match"><h3>8. Result: 169 characters</h3><p>Nine tags, not one attribute. The tags do the choosing: the width (<code>h1</code>), the radius (each heading's font size) and the rotation (<code>h4</code>).</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t1118 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const CY = $('.t1118-cy'), BODY = $('[data-o="body"]'), live = $('.live');
  const E = $$('.t1118-e');
  const NR = $('.t1118-r'), NW = $('.t1118-w'), NP = $('.t1118-p'), NM = $('.t1118-m');
  const L = (k) => $(`.t1118-l-${k}`);
  const T = ['h1', 'h4', 'h1', 'h1', 'h5', 'h1', 'h1', 'h4', 'h1'];
  const FS = { h1: 32, h4: 16, h5: 13.28 };
  // layouts measured in Chrome: squares with no margin, then h1 at 80 wide with no margin, then the final grid
  const L3 = [[75, 75], [105, 75], [135, 75], [165, 75], [195, 75], [225, 75], [255, 75], [285, 75], [75, 105]];
  const L4 = [[75, 75], [155, 75], [185, 75], [75, 105], [155, 105], [185, 105], [75, 135], [155, 135], [185, 135]];
  const L5 = [[85, 75], [185, 75], [235, 75], [85, 135], [185, 135], [235, 135], [85, 195], [185, 195], [235, 195]];
  const W = { a: [0.3, 2.3], b: [4.3, 6.3], c: [8.3, 10.3], d: [13.3, 15.8], e: [17.3, 19.8], f: [21.3, 23.3], g: [25.3, 28.3], fin: [30.1, 30.9] };
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const lerp = (a, b, m) => a + (b - a) * m;
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const num = (v, d) => v.toFixed(d).replace('.', fr ? ',' : '.');
  const short = (v) => (Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(v)) : num(v, 1));
  const c = fr ? ' :' : ':';
  return (t, st) => {
    const step = st + 1;
    const teach = fig.dataset.teach === '1';
    const real = !teach || t >= W.fin[0];
    const guides = t < W.fin[0] ? 1 : 0;
    const a = pr(t, W.a), b = pr(t, W.b), cc = pr(t, W.c), d = pr(t, W.d), e = pr(t, W.e), f = pr(t, W.f), g = pr(t, W.g);
    CY.style.opacity = a;
    // body: quirks body at (8, 8) 384 × 284, then margin 75 → (75, 75) 250 × 150
    const m = lerp(8, 75, b);
    Object.assign(BODY.style, { left: `${m}px`, top: `${m}px`, width: `${400 - 2 * m}px`, height: `${300 - 2 * m}px`, opacity: (step >= 2 && step <= 5 ? 1 : 0) * guides });
    const rot = 229.183 * g;
    E.forEach((el, i) => {
      const tag = T[i];
      const p = d < 1 ? [lerp(L3[i][0], L4[i][0], d), lerp(L3[i][1], L4[i][1], d)] : [lerp(L4[i][0], L5[i][0], e), lerp(L4[i][1], L5[i][1], e)];
      const w = tag === 'h1' ? 30 + 50 * d : 30;
      const r = Math.min(FS[tag] / 2, 15) * f;
      el.style.left = `${p[0]}px`;
      el.style.top = `${p[1]}px`;
      el.style.width = `${w}px`;
      el.style.borderRadius = `${r}px`;
      el.style.opacity = Math.min(1, cc * 1.2);
      el.style.transform = `scale(${lerp(0.4, 1, cc)}) rotate(${tag === 'h4' ? rot : 0}deg)`;
      el.style.background = real ? 'var(--t1118-b)' : `var(--t1118-${tag})`;
      el.firstElementChild.style.opacity = !real && step >= 3 && step <= 6 ? 1 : 0;
    });
    // digits in the code
    NW.textContent = String(Math.round(50 * d));
    NP.textContent = short(4 * e);
    NM.textContent = String(Math.round(30 * e));
    NR.textContent = short(4 * g);
    L('a').style.opacity = win(t, 0.3, W.b[0] - 0.2);
    L('b').style.opacity = win(t, W.b[0], W.c[0] - 0.2);
    L('c').style.opacity = win(t, W.c[0], W.d[0] - 0.2);
    L('d').style.opacity = win(t, W.d[0], W.e[0] - 0.2);
    L('e').style.opacity = win(t, W.e[0], W.f[0] - 0.2);
    L('f').style.opacity = win(t, W.f[0], W.g[0] - 0.2);
    L('g').style.opacity = win(t, W.g[0], W.fin[0]);
    let txt = '';
    if (step === 1) txt = `${fr ? 'canevas' : 'canvas'}${c} ${a < 0.5 ? '#ffffff' : '#f1eba7'}`;
    else if (step === 2) txt = `body${c} ${Math.round(400 - 2 * m)} × ${Math.round(300 - 2 * m)} ${fr ? 'en' : 'at'} (${Math.round(m)}, ${Math.round(m)})`;
    else if (step === 3) txt = `9 × 30 × 30 · ${fr ? '8 par rangée' : '8 per row'}`;
    else if (step === 4) txt = `h1${c} ${Math.round(30 + 50 * d)} · ${fr ? 'rangée' : 'row'} ${Math.round(80 + 30 + 80)}`;
    else if (step === 5) txt = `${fr ? 'rangée' : 'row'}${c} ${num(190 + 60 * e, 0)} · y = 75 · ${Math.round(105 + 30 * e)} · ${Math.round(135 + 60 * e)}`;
    else if (step === 6) txt = `${fr ? 'rayons' : 'radii'}${c} ${num(15 * f, 2).replace(/[.,]00$/, '')} · ${num(8 * f, 2).replace(/[.,]00$/, '')} · ${num(6.64 * f, 2).replace(/[.,]00$/, '')}`;
    else if (step === 7) txt = `rotate${c} ${num(rot, 2)}° ≡ ${num(rot % 90, 2)}°`;
    else txt = $$('.caps .cap')[7].dataset.live || '';
    live.textContent = txt;
  };
};
