<div class="now" aria-live="polite">
<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="html, une boîte de 22 × 22"><h3>1. <code>html</code>, une boîte de 22 × 22</h3><p><code>*</code> vise <code>html</code> et le <code>body</code> (<code>head</code> et <code>style</code> ne s'affichent pas). Le <code>&amp;</code> de tête vise <code>html</code> seul. Avec <code>margin:139 189</code>, il ne reste que 400 − 2 × 189 = 22 de large et 300 − 2 × 139 = 22 de haut, au centre. Son fond crème passe au canevas.</p></div>
<div class="cap" data-t="4" data-step="outline : un carré de 150"><h3>2. <code>outline</code> : un carré de 150</h3><p><code>4pc</code> fait 64px : l'<code>outline</code> bleu nuit fait de la boîte un carré de 22 + 2 × 64 = 150, de x = 125 à 275. Ses coins suivent ceux de la boîte, agrandis de 64 : <code>9q</code> (8,5) donne 72,5 en haut à gauche, <code>3mm</code> (11,34) donne 75,34 en haut à droite et en bas à gauche, et le coin à 0 reste pointu.</p></div>
<div class="cap" data-t="8" data-step="rotate : la pointe en haut"><h3>3. <code>rotate</code> : la pointe en haut</h3><p><code>rotate:225deg</code> tourne <code>html</code> autour de son centre, (200, 150). Le coin pointu passe en haut, à 150 − 106 = 44. Les deux coins de 75,34 vont à gauche et à droite : presque deux demi-cercles, de x = 125 à 275. Le coin de 72,5 part en bas.</p></div>
<div class="cap" data-t="12" data-step="Le body, 80 × 40"><h3>4. Le <code>body</code>, 80 × 40</h3><p>Le <code>body</code> est dans <code>html</code>. <code>margin:-9-29</code> le fait déborder : 22 + 2 × 29 = 80 de large. En mode quirks, il remplit la hauteur de <code>html</code> : 22 + 2 × 9 = 40. Il est centré sur <code>html</code>, et tourne avec lui. Il a le fond crème, et il est peint par-dessus l'<code>outline</code>, parce qu'il est lui-même tourné.</p></div>
<div class="cap" data-t="16" data-step="Encore 225° : la porte"><h3>5. Encore 225° : la porte</h3><p>Le <code>body</code> a aussi son propre <code>rotate:225deg</code> : 225 + 225 = 450°, soit 90°. Il se retrouve debout : 40 de large et 80 de haut, de x = 180 à 220 et de y = 110 à 190. Ses deux coins du haut ont les rayons 8,5 et 11,34 : la porte. Il cache aussi le trou de l'<code>outline</code>, la boîte de <code>html</code>, au centre.</p></div>
<div class="cap" data-t="20" data-step="box-shadow : la coupe"><h3>6. <code>box-shadow</code> : la coupe</h3><p>L'ombre du <code>body</code> est décalée de <code>34vw</code> = 136 le long de son axe, qui pointe vers le bas à l'écran, et étalée de <code>1in</code> = 96. Son haut est en 110 − 96 + 136 = 150. Crème sur crème, elle cache tout ce qui est dessous : le bas de la goutte et le bas de la porte. <code>html</code> a la même ombre, vers le haut à gauche, mais sous son <code>outline</code> : on ne la voit pas.</p></div>
<div class="cap" data-t="24" data-step="Résultat" data-live="150 caractères · 100 % identique"><h3>7. Résultat : 150 caractères</h3><p>Une boîte de 22 × 22 et son <code>outline</code> pour la goutte, le <code>body</code> pour la porte, et son ombre pour la coupe : tout vient d'une règle <code>*</code> commune et d'une règle pour <code>html</code>.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html, a 22 × 22 box"><h3>1. <code>html</code>, a 22 × 22 box</h3><p><code>*</code> matches <code>html</code> and the <code>body</code> (<code>head</code> and <code>style</code> are not displayed). The top-level <code>&amp;</code> matches <code>html</code> only. With <code>margin:139 189</code>, it is left with 400 − 2 × 189 = 22 across and 300 − 2 × 139 = 22 down, in the middle. Its cream background goes to the canvas.</p></div>
<div class="cap" data-t="4" data-step="outline: a 150 square"><h3>2. <code>outline</code>: a 150 square</h3><p><code>4pc</code> is 64px: the navy <code>outline</code> turns the box into a 22 + 2 × 64 = 150 square, from x = 125 to 275. Its corners follow the box's, grown by 64: <code>9q</code> (8.5) gives 72.5 at the top left, <code>3mm</code> (11.34) gives 75.34 at the top right and bottom left, and the corner at 0 stays sharp.</p></div>
<div class="cap" data-t="8" data-step="rotate: the tip goes up"><h3>3. <code>rotate</code>: the tip goes up</h3><p><code>rotate:225deg</code> turns <code>html</code> around its center, (200, 150). The sharp corner goes to the top, at 150 − 106 = 44. The two 75.34 corners go left and right: almost two half circles, from x = 125 to 275. The 72.5 corner goes to the bottom.</p></div>
<div class="cap" data-t="12" data-step="The body, 80 × 40"><h3>4. The <code>body</code>, 80 × 40</h3><p>The <code>body</code> is inside <code>html</code>. <code>margin:-9-29</code> makes it stick out: 22 + 2 × 29 = 80 wide. In quirks mode, it fills <code>html</code>'s height: 22 + 2 × 9 = 40. It is centered on <code>html</code>, and turns with it. It has the cream background, and it is painted over the <code>outline</code>, because it is turned itself.</p></div>
<div class="cap" data-t="16" data-step="225° more: the door"><h3>5. 225° more: the door</h3><p>The <code>body</code> also has its own <code>rotate:225deg</code>: 225 + 225 = 450°, so 90°. It ends up standing: 40 wide and 80 tall, from x = 180 to 220 and y = 110 to 190. Its two top corners have radii 8.5 and 11.34: the door. It also covers the hole of the <code>outline</code>, <code>html</code>'s own box, in the middle.</p></div>
<div class="cap" data-t="20" data-step="box-shadow: the cut"><h3>6. <code>box-shadow</code>: the cut</h3><p>The <code>body</code>'s shadow is offset by <code>34vw</code> = 136 along its own axis, which points down on screen, and spread by <code>1in</code> = 96. Its top is at 110 − 96 + 136 = 150. Cream on cream, it hides everything under it: the bottom of the drop and the bottom of the door. <code>html</code> has the same shadow, toward the top left, but under its <code>outline</code>: it never shows.</p></div>
<div class="cap" data-t="24" data-step="Result" data-live="150 characters · 100% match"><h3>7. Result: 150 characters</h3><p>A 22 × 22 box and its <code>outline</code> for the drop, the <code>body</code> for the door, and its shadow for the cut: it all comes from one shared <code>*</code> rule and one rule for <code>html</code>.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t1115 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const H = $('.t1115-h'), B = $('.t1115-b'), G = $('[data-o="h"]'), CUT = $('.t1115-cut'), live = $('.live');
  const L = (k) => $(`.t1115-l-${k}`);
  const W = { h: [0.3, 2.3], o: [4.3, 6.3], r: [8.3, 10.8], b: [12.3, 13.8], d: [16.3, 18.8], s: [20.3, 22.3], fin: [24.1, 24.9] };
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const lerp = (a, b, m) => a + (b - a) * m;
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const num = (v, d) => v.toFixed(d).replace('-', '−').replace('.', fr ? ',' : '.');
  const c = fr ? ' :' : ':';
  return (t, st) => {
    const step = st + 1;
    const teach = fig.dataset.teach === '1';
    const real = !teach || t >= W.fin[0];
    const guides = t < W.fin[0] ? 1 : 0;
    const h = pr(t, W.h), o = pr(t, W.o), r = pr(t, W.r), b = pr(t, W.b), d = pr(t, W.d), s = pr(t, W.s);
    // html's box: the whole frame shrinking to 22 × 22 (dashed guide), the real box only once it is small
    const gx = lerp(0, 189, h), gy = lerp(0, 139, h), gw = lerp(400, 22, h), gh = lerp(300, 22, h);
    Object.assign(G.style, { left: `${gx}px`, top: `${gy}px`, width: `${gw}px`, height: `${gh}px`, opacity: (step <= 2 ? Math.max(h, step === 1 ? 0.6 : 1) : 0) * guides });
    H.style.outlineWidth = `${64 * o}px`;
    H.style.rotate = `${225 * r}deg`;
    H.style.boxShadow = `${136 * s}px 0 0 ${96 * s}px ${real ? 'var(--t1115-c)' : 'var(--t1115-hs)'}`;
    B.style.opacity = b;
    B.style.rotate = `${225 * d}deg`;
    B.style.background = real ? 'var(--t1115-c)' : 'var(--t1115-door)';
    B.style.boxShadow = `${136 * s}px 0 0 ${96 * s}px ${real ? 'var(--t1115-c)' : 'var(--t1115-bs)'}`;
    CUT.style.opacity = (step === 6 ? s : 0) * guides;
    L('h').style.opacity = win(t, W.h[0], W.o[0] - 0.2);
    L('o').style.opacity = win(t, W.o[0], W.r[0] - 0.2);
    L('r').style.opacity = win(t, W.r[0], W.b[0] - 0.2);
    L('b').style.opacity = win(t, W.b[0], W.d[0] - 0.2);
    L('d').style.opacity = win(t, W.d[0], W.s[0] - 0.2);
    L('s').style.opacity = win(t, W.s[0], W.fin[0]);
    let txt = '';
    if (step === 1) txt = `html${c} ${Math.round(gw)} × ${Math.round(gh)}`;
    else if (step === 2) txt = `outline${c} ${Math.round(64 * o)}px · ${fr ? 'coins' : 'corners'} ${num(8.5 + 64 * o, 1)} / ${num(11.34 + 64 * o, 2)} / 0`;
    else if (step === 3) txt = `rotate${c} ${Math.round(225 * r)}°`;
    else if (step === 4) txt = `body${c} 80 × 40`;
    else if (step === 5) txt = `body${c} ${Math.round(225 + 225 * d)}° = ${Math.round(225 + 225 * d) % 360}°`;
    else if (step === 6) txt = `box-shadow${c} ${Math.round(136 * s)}px 0 0 ${Math.round(96 * s)}px`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
