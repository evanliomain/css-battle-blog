<div class="cap" data-t="0" data-step="La boîte de html"><h3>1. html : 290 × 200</h3><p>Le premier <code>*</code> vise tous les éléments, html compris. Pas de doctype : mode quirks, les marges sans unité sont des px. <code>margin:50 55</code> laisse 400 − 55 − 55 = 290px de large. En mode quirks, html prend la hauteur de la fenêtre moins ses marges : 300 − 50 − 50 = 200. Le fond de la racine se peint sur tout le canevas.</p></div>
<div class="cap" data-t="5" data-step="Une bordure transparente"><h3>2. 100px de bordure invisible</h3><p><code>border:75pt solid#0000</code> donne à chaque élément une bordure de 75pt, soit 100px, transparente : <code>#0000</code> est un noir d'opacité 0. Pour html, il reste 290 − 200 = 90px de large pour le contenu, et 200 − 200 = 0 de haut. Le contenu se réduit à un trait, en y = 150.</p></div>
<div class="cap" data-t="10" data-step="Le côté gauche"><h3>3. Un côté gauche en triangle</h3><p><code>border-left-color:E8AD6D</code> n'a pas de <code>#</code>. En mode quirks, la couleur est quand même acceptée : le côté gauche devient orange. Les côtés du haut et du bas font 100px, et le contenu 0 de haut : leurs coins en biseau se rejoignent au milieu. Le côté gauche est un triangle, de 100px de large, pointe en (155, 150).</p></div>
<div class="cap" data-t="15" data-step="body"><h3>4. body, un second triangle</h3><p>body a la même bordure, et la marge de <code>* *</code> : −100 en haut et en bas, −20 à gauche et à droite. Le contenu de html fait 90 de large, plus 20 + 20 : 130px pour body. Sa bordure de 200px n'y tient pas : il fait 200 de large, en x = 155 − 20 = 135. En mode quirks, il fait 0 + 100 + 100 = 200 de haut. Son côté gauche est un second triangle, pointe en (235, 150). Il couvre la pointe du premier, dans le même orange.</p></div>
<div class="cap" data-t="20" data-step="Le premier p"><h3>5. Le premier p : un carré de bordure</h3><p>Les deux p prennent la marge de <code>* * *</code> et une nouvelle bordure : 59q, soit 55,75px, que mon Chrome dessine sur 55px. Le contenu de body fait 0 × 0, en (235, 150). La marge droite de −110 donne au p 0 + 110 = 110px de large, bordures comprises : le contenu fait 110 − 55 − 55 = 0. Le premier p est un carré de 110px, en (235, 150 + 10).</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0413 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.5), 1 - pr(t, b - 0.3, b));
  const n = (s) => (fr ? s.replace(/(\d)\.(\d)/g, '$1,$2') : s);
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  const tint = (k, c) => (k <= 0 ? 'transparent' : `color-mix(in srgb, ${c} ${(k * 35).toFixed(1)}%, transparent)`);
  // Measured on the official code in local Chrome 157 (400 × 300 page, quirks mode, getBoundingClientRect, getComputedStyle):
  // html 55, 50, 290 × 200, borders 100px (75pt), transparent, left rgb(232, 173, 109); background rgb(88, 138, 149) (canvas).
  // body 135, 50, 200 × 200, margin -100px -20px, same border and background.
  // p 235, 160, 110 × 110 and p 235, 30, 110 × 110, margin 10px -110px -250px 0px, borders 55px (59q = 55.75px) rgba(0, 34, 85, 0.467).
  // body's background starts 1px right of its left edge, so that it never tints the edge pixels of its orange side (no seam over html's triangle).
  // Rendered colors: #588a95, #e8ad6d, #2f5977 (rgba(0, 34, 85, 0.467) over #588a95).
  const OR = '#e8ad6d', BL = '#2f5977';
  const H = $('.t0413-html'), B = $('.t0413-body'), P1 = $('.t0413-p1'), P2 = $('.t0413-p2');
  const ol = (k) => $('.t0413-o' + k);
  const labs = $$('.zlab');
  const ivs = { 1: [0.3, 4.8], 2: [5.3, 9.8], 3: [10.3, 14.8], 4: [15.3, 19.8], 5: [20.3, 24.8], 6: [25.3, 29.8] };
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const tw = teach ? 1 - pr(t, 30.2, 31.2) : 0;
    ol('html').style.opacity = win(t, 0.3, 14.8);
    ol('cont').style.opacity = win(t, 5.3, 9.8);
    // html's border: 100px, transparent, then its left side turns orange
    const bw = 100 * pr(t, 5.5, 7.5);
    H.style.borderWidth = bw + 'px';
    const side = tint(tw, 'var(--t0413-hb)');
    const lk = pr(t, 10.5, 11.5);
    H.style.borderColor = side;
    H.style.borderLeftColor = lk <= 0 ? side : mix(tw, 'var(--t0413-hb)', OR);
    $('.t0413-d1').style.opacity = win(t, 11.5, 14.8);
    // body: same border, 200 × 200 at (135, 50); its background is the canvas color
    B.style.opacity = pr(t, 15.5, 16.5);
    B.style.borderColor = tint(tw, 'var(--t0413-bd)');
    B.style.borderLeftColor = mix(tw, 'var(--t0413-bd)', OR);
    ol('body').style.opacity = win(t, 15.5, 19.8);
    $('.t0413-d2').style.opacity = win(t, 16.5, 19.8);
    // the p: 110px wide, as tall as their two 55px borders
    const p1 = 110 * pr(t, 20.5, 22.5);
    P1.style.height = p1 + 'px';
    P1.style.opacity = pr(t, 20.5, 21);
    P1.style.background = mix(tw, 'var(--t0413-p1)', BL);
    const p2 = 110 * pr(t, 25.5, 27.5);
    P2.style.height = p2 + 'px';
    P2.style.opacity = pr(t, 25.5, 26);
    P2.style.background = mix(tw, 'var(--t0413-p2)', BL);
    ol('p1').style.opacity = win(t, 20.5, 24.8);
    ol('p2').style.opacity = win(t, 25.5, 29.8);
    labs.forEach((l) => { const iv = ivs[l.dataset.l]; l.style.opacity = iv ? win(t, ...iv) : 0; });
    let txt;
    if (step === 0) txt = `400 − 55 − 55 = 290 · 300 − 50 − 50 = 200`;
    else if (step === 1) txt = `75pt = 100px · 290 − 200 = 90 · 200 − 200 = 0`;
    else if (step === 2) txt = `55 + 100 = 155 · 50 + 100 = 150`;
    else if (step === 3) txt = `155 − 20 = 135 · 0 + 100 + 100 = 200 · 135 + 100 = 235`;
    else if (step === 4) txt = `59q = 55.75px · 0 + 110 − 55 − 55 = 0 · 150 + 10 = 160`;
    else if (step === 5) txt = `160 + 110 = 270 · 270 + 10 − 250 = 30`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = n(txt);
  };
};
