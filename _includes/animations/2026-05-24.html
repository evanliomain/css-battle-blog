<div class="cap" data-t="0" data-step="Boîtes"><h3>1. Les boîtes</h3><p>L'espace insécable du début n'est pas un blanc : il ouvre body, avec un texte. Viennent ensuite p, un autre espace insécable et le style, dans p. html fait 400 × 300. En mode quirks, body remplit html moins sa marge par défaut de 8px : 384 × 284 en (8, 8). <code>p{margin:0 118}</code> donne 384 − 236 = 148 de large, en x = 126. head et style ne s'affichent pas.</p></div>
<div class="cap" data-t="5.5" data-step="Lignes"><h3>2. Des lignes de 96px</h3><p>Le <code>*{</code> imbriqué vise les éléments placés dans un autre : body et p. <code>font:.01q/1in'</code> leur donne une police de 0,0094px : les espaces insécables ne se voient pas. Mais chaque ligne fait 1in = 96px. La première ligne de body pousse p en y = 8 + 96 = 104, et la ligne de p lui donne 96 de haut. L'apostrophe finale, jamais fermée, ouvre le nom de police vide que le raccourci exige.</p></div>
<div class="cap" data-t="11" data-step="html"><h3>3. L'anneau de html</h3><p>Tous les éléments reçoivent le même dégradé. Rayon 1q = 0,945px, arrêts en px : transparent jusqu'à 5pc = 80px, #E8AD6D de 80 à 130px, puis transparent. Le dernier arrêt, à 100 % = 0,945px, est ramené à 130px : un anneau net. html n'a pas de <code>--z</code> : le repli <code>69q#2F5A76</code> donne la couleur de fond et la position. Sa police fait 16px, donc 25ch = 200px : centre en (200, 150) dans une tuile de 400 × 300. 69q = 65,20px décale la tuile : centre en (265,20 ; 150).</p></div>
<div class="cap" data-t="18" data-step="body"><h3>4. Le demi-anneau de body</h3><p>Pour body, <code>--z:134q</code> : <code>var(--z)</code> ne donne qu'une position, pas de couleur. Sa police est minuscule, donc 25ch vaut presque 0 : le centre est sur le bord gauche de la tuile, à 50 % de 284 = 142. 134q = 126,61px : la tuile commence en x = 8 + 126,61 = 134,61. Seule la moitié droite de l'anneau est dans cette tuile. La tuile de gauche dessine son propre anneau en x = 134,61 − 384 = −249,39, hors de la boîte de body.</p></div>
<div class="cap" data-t="25" data-step="Trou"><h3>5. Un trou au milieu</h3><p>Les deux anneaux remplissent presque tout l'espace entre eux. Mais un point à moins de 80px des deux centres est dans les deux trous. Il reste une petite lentille bleue, de x = 185,20 à 214,61 et de y = 103,77 à 196,23.</p></div>
<div class="cap" data-t="29.5" data-step="p"><h3>6. p bouche le trou</h3><p>p reçoit aussi <code>134q</code>, sans couleur. Sa tuile fait 148 × 96, centre sur son bord gauche, en y = 104 + 48 = 152. Les tuiles commencent en 126 + 126,61 = 252,61 et 252,61 − 148 = 104,61. De x = 126 à 252,61, p montre donc l'anneau centré en (104,61 ; 152). De 80 à 130px de ce centre, il couvre toute la lentille. À droite de 252,61, le centre suivant est trop proche : transparent.</p></div>
<div class="cap" data-t="36" data-step="Résultat" data-live="144 caractères · 100 % identique"><h3>7. Résultat : 144 caractères</h3><p>Un seul dégradé, trois boîtes. html dessine un anneau entier. body, coupé par le bord de sa tuile, un demi-anneau. p, un morceau d'anneau qui bouche le trou entre les deux.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="Boxes"><h3>1. The boxes</h3><p>The leading no-break space is not white space: it opens body, as text. Then come p, another no-break space and the style, inside p. html is 400 × 300. In quirks mode, body fills html minus its default 8px margin: 384 × 284 at (8, 8). <code>p{margin:0 118}</code> makes p 384 − 236 = 148 wide, at x = 126. head and style are not displayed.</p></div>
<div class="cap" data-t="5.5" data-step="Lines"><h3>2. 96px lines</h3><p>The nested <code>*{</code> matches the elements inside another one: body and p. <code>font:.01q/1in'</code> gives them a 0.0094px font: the no-break spaces can't be seen. But each line is 1in = 96px tall. body's first line pushes p down to y = 8 + 96 = 104, and p's own line makes it 96 tall. The final quote, never closed, opens the empty font name the shorthand needs.</p></div>
<div class="cap" data-t="11" data-step="html"><h3>3. html's ring</h3><p>Every element gets the same gradient. Ray 1q = 0.945px, stops in px: transparent up to 5pc = 80px, #E8AD6D from 80 to 130px, then transparent. The last stop, at 100% = 0.945px, is pulled up to 130px: a sharp ring. html has no <code>--z</code>: the fallback <code>69q#2F5A76</code> gives the background color and the position. Its font is 16px, so 25ch = 200px: center at (200, 150) in a 400 × 300 tile. 69q = 65.20px moves the tile: center at (265.20, 150).</p></div>
<div class="cap" data-t="18" data-step="body"><h3>4. body's half ring</h3><p>For body, <code>--z:134q</code>: <code>var(--z)</code> gives only a position, no color. Its font is tiny, so 25ch is almost 0: the center sits on the left edge of the tile, at 50% of 284 = 142. 134q = 126.61px: the tile starts at x = 8 + 126.61 = 134.61. Only the right half of the ring is in this tile. The tile on the left draws its own ring at x = 134.61 − 384 = −249.39, outside body's box.</p></div>
<div class="cap" data-t="25" data-step="Gap"><h3>5. A gap in the middle</h3><p>The two rings fill almost all the space between them. But a point less than 80px from both centers is in both holes. A small blue lens is left, from x = 185.20 to 214.61 and from y = 103.77 to 196.23.</p></div>
<div class="cap" data-t="29.5" data-step="p"><h3>6. p fills the gap</h3><p>p gets <code>134q</code> too, with no color. Its tile is 148 × 96, center on its left edge, at y = 104 + 48 = 152. Tiles start at 126 + 126.61 = 252.61 and 252.61 − 148 = 104.61. So from x = 126 to 252.61, p shows the ring centered at (104.61, 152). From 80 to 130px off that center, it covers the whole lens. Right of 252.61, the next center is too close: transparent.</p></div>
<div class="cap" data-t="36" data-step="Result" data-live="144 characters · 100% match"><h3>7. Result: 144 characters</h3><p>One gradient, three boxes. html draws a full ring. body, cut by the edge of its tile, a half ring. p, a piece of ring that fills the gap between them.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0524 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.5), 1 - pr(t, b - 0.3, b));
  const c = fr ? '\u00a0:' : ':';
  const n = (s) => (fr ? s.replace(/(\d)\.(\d)/g, '$1,$2') : s);
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  // Measured on the official code in local Chrome (400 × 300 iframe, quirks mode, getBoundingClientRect, getComputedStyle, variant renders).
  // html 0, 0, 400 × 300; body 8, 8, 384 × 284; p 126, 104, 148 × 96 (line-height 96px, font-size 0.00944882px).
  // html: radial-gradient(1q at 200px 50%, …) at 65.1969px 50%, color #2f5a76. body and p: at 0px 50% (25ch with the tiny font),
  // position 126.614px 50%, no color. Same picture with html at 200px and body, p at 0 written out.
  const S = 65.1969, P = 126.614;
  const ring = (cc, at) => `radial-gradient(1px at ${at}, transparent 80px, ${cc} 0 130px, transparent)`;
  const ringC = (cc) => `radial-gradient(circle, transparent 80px, ${cc} 0 130px, transparent 0)`;
  const bg = $('.t0524-bg'), hr = $('.t0524-hr'), bg2 = $('.t0524-bg2'), br = $('.t0524-br'), lens = $('.t0524-lens'), pg = $('.t0524-pg'), pr2 = $('.t0524-pr');
  const hbox = $('.t0524-hbox'), bbox = $('.t0524-bbox'), pbox = $('.t0524-pbox'), b1 = $('.t0524-b1'), b2 = $('.t0524-b2');
  const l1 = $('.t0524-l1'), l2 = $('.t0524-l2'), l3 = $('.t0524-l3'), l4 = $('.t0524-l4');
  const hc = $('.t0524-hc'), hc2 = $('.t0524-hc2'), bc = $('.t0524-bc'), pc = $('.t0524-pc');
  const labs = $$('.zlab');
  const ivs = [[0.3, 5.3], [5.8, 10.8], [11.3, 17.8], [18.3, 24.8], [25.3, 29.3], [29.8, 35.8]];
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const wide = fig.dataset.view === 'wide';
    const tw = teach ? 1 - pr(t, 36.2, 37.2) : 0;
    const col = (v) => mix(tw, `var(--t0524-${v})`, 'var(--t0524-ring)');
    // html: background color, then the ring at x = 200, then the tile moves 69q to the right
    bg.style.opacity = pr(t, 11.3, 12.3);
    const s = S * pr(t, 14, 16);
    hr.style.backgroundImage = ring(col('html'), '200px 50%');
    hr.style.backgroundPosition = `${300 + s}px 40px`;
    hr.style.opacity = pr(t, 12.3, 13.3);
    l1.style.left = `${s}px`;
    l2.style.left = `${s - 400}px`;
    l1.style.opacity = l2.style.opacity = win(t, 12.3, 17.8);
    hc.style.left = `${200 + s}px`;
    hc2.style.left = `${s - 200}px`;
    hc.style.opacity = hc2.style.opacity = win(t, 12.3, 17.8);
    // body: center on the tile's left edge, the tile moves 134q to the right; the left half is not in the tile
    const sb = P * pr(t, 20.8, 22.8), bx = 8 + sb;
    br.style.left = `${bx}px`;
    br.style.width = `${392 - bx}px`;
    br.style.backgroundImage = ring(col('body'), '0 50%');
    br.style.opacity = pr(t, 19.3, 20.3);
    bg2.style.left = `${bx - 130}px`;
    bg2.style.background = ringC(col('body'));
    bg2.style.opacity = 0.3 * win(t, 18.3, 24.8);
    l3.style.left = `${bx}px`;
    l3.style.opacity = win(t, 18.3, 24.8);
    bc.style.left = `${bx}px`;
    bc.style.opacity = win(t, 18.3, 24.8);
    // the shared hole: inside both rings' holes
    lens.style.background = `radial-gradient(circle at 265.197px 150px, ${mix(teach ? 1 : 0.85, 'var(--t0524-lens)', '#fff')} 80px, transparent 0)`;
    lens.style.opacity = t < 25.3 ? 0 : t < 28.3 ? 0.8 + 0.2 * Math.cos(Math.PI * 2 * (t - 25.3) / 1.5) : t < 30.8 ? 1 - pr(t, 30.3, 30.8) : 0;
    // p: same gradient in a 148 × 96 tile, moved 134q to the right
    const sp = P * pr(t, 31.3, 33.3);
    pr2.style.backgroundImage = ring(col('p'), '0 50%');
    pr2.style.backgroundPosition = `${sp}px 1px`; // 1px taller than p's box, same tiles: hides the 0.23px tip of the lens at small sizes
    pr2.style.opacity = pr(t, 29.8, 30.8);
    pg.style.background = ringC(col('p'));
    pg.style.opacity = 0.3 * win(t, 33.4, 35.8);
    pc.style.opacity = win(t, 33.4, 35.8);
    l4.style.left = `${126 + sp}px`;
    l4.style.opacity = win(t, 29.8, 35.8);
    // boxes and lines
    hbox.style.opacity = win(t, 0.3, 10.8);
    bbox.style.opacity = Math.max(win(t, 0.3, 10.8), win(t, 18.3, 24.8));
    pbox.style.opacity = Math.max(win(t, 0.3, 10.8), win(t, 29.8, 35.8));
    b1.style.opacity = b2.style.opacity = win(t, 5.8, 10.8);
    // labels: top left of the canvas, or of the wide frame
    labs.forEach((l) => {
      l.style.left = wide ? 'calc(-280px + 4px * var(--k, 1))' : 'calc(4px * var(--k, 1))';
      l.style.top = wide ? 'calc(-20px + 4px * var(--k, 1))' : 'calc(4px * var(--k, 1))';
      l.style.opacity = win(t, ...ivs[+l.dataset.l - 1]);
    });
    let txt;
    if (step === 0) txt = `body${c} 400 − 16 = 384 · p${c} 384 − 236 = 148 · x = 8 + 118 = 126`;
    else if (step === 1) txt = n(`.01q = 0.0094px · 1in = 96px · p${c} y = 8 + 96 = 104`);
    else if (step === 2) txt = n(`25ch = 200px · 69q = 65.20px · 200 + 65.20 = 265.20`);
    else if (step === 3) txt = n(`134q = 126.61px · 8 + 126.61 = 134.61 · 8 + 142 = 150`);
    else if (step === 4) txt = n(`x 185.20 → 214.61 · y 103.77 → 196.23`);
    else if (step === 5) txt = n(`126 + 126.61 − 148 = 104.61 · 104 + 48 = 152`);
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
