<div class="cap" data-t="0" data-step="Deux boîtes"><h3>1. Deux boîtes, une règle</h3><p><code>*{</code> vise html, head, style et body. Le <code>*{</code> imbriqué vise les éléments placés dans un autre : head, style et body. head et style ne s'affichent pas. Il reste deux boîtes. En mode quirks, html remplit le cadre : 400 × 300. body le remplit moins sa marge par défaut de 8px : 384 × 284 en (8, 8).</p></div>
<div class="cap" data-t="6" data-step="La variable"><h3>2. Une variable pour body seulement</h3><p>Seul le niveau imbriqué pose <code>--p:92q</code>. html n'a pas de <code>--p</code> : <code>var(--p,50vh#DE387B</code> prend son repli, une position <code>0 50vh</code> = 0 150px et une couleur. Le fond de la racine est peint sur tout le canevas : tout devient rose. body prend <code>0 92q</code> = 0 86,93px, une position sans couleur.</p></div>
<div class="cap" data-t="12" data-step="L'anneau"><h3>3. Un anneau net</h3><p><code>1q at top</code> : un cercle de 1q = 0,945px de rayon, centré au milieu du haut de la tuile. Les arrêts continuent au-delà. Transparent jusqu'à 5ch = 40px, #38051E de 40px (le <code>0</code> est ramené là) à 15ex. Le dernier <code>#0000</code> n'a pas de position : il va à 100 %, soit 0,945px, ramené à 15ex. Un bord net. 15ex vaut 107,695px dans mon Chrome ; la cible place ce bord à 110px du centre, et l'animation suit la cible.</p></div>
<div class="cap" data-t="18" data-step="Bord de tuile"><h3>4. Le bord de la tuile coupe l'anneau</h3><p>L'image de html fait 400 × 300, comme sa boîte, et se répète. La position la commence en y = 150 : le centre de l'anneau est sur ce bord. Au-dessus, c'est le bas de la tuile précédente, transparent : son propre anneau est 300px plus haut. Il reste le demi-anneau du bas, de y = 150 à 260.</p></div>
<div class="cap" data-t="24" data-step="body"><h3>5. Le demi-anneau de body</h3><p>La tuile de body fait 384 × 284 et commence en y = 8 + 86,93 = 94,93, centre en x = 8 + 192 = 200. Son demi-anneau va de 94,93 à 204,93, avec un trou rose jusqu'à 134,93. body est peint par-dessus : il couvre le trou de html. En y = 150, son bord extérieur est à 95,22px du milieu, celui de html à 110px : deux marches de 14,78px.</p></div>
<div class="cap" data-t="30" data-step="Résultat" data-live="108 caractères · 100 % identique"><h3>6. Résultat : 108 caractères</h3><p>Un seul dégradé pour deux boîtes. La variable ne change que la position, et le repli de html apporte en plus la couleur du canevas.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="Two boxes"><h3>1. Two boxes, one rule</h3><p><code>*{</code> matches html, head, style and body. The nested <code>*{</code> matches the elements inside another one: head, style and body. head and style are not displayed. Two boxes are left. In quirks mode, html fills the frame: 400 × 300. body fills it minus its default 8px margin: 384 × 284 at (8, 8).</p></div>
<div class="cap" data-t="6" data-step="Variable"><h3>2. A variable for body only</h3><p>Only the nested level sets <code>--p:92q</code>. html has no <code>--p</code>: <code>var(--p,50vh#DE387B</code> takes its fallback, a position <code>0 50vh</code> = 0 150px and a color. The root's background is painted on the whole canvas: everything turns pink. body gets <code>0 92q</code> = 0 86.93px, a position with no color.</p></div>
<div class="cap" data-t="12" data-step="Ring"><h3>3. A sharp ring</h3><p><code>1q at top</code>: a circle with a 1q = 0.945px radius, centered on the middle of the tile's top edge. The stops go on past it. Transparent up to 5ch = 40px, #38051E from 40px (the <code>0</code> is pulled up there) to 15ex. The last <code>#0000</code> has no position: it goes at 100%, that is 0.945px, pulled up to 15ex. A sharp edge. 15ex is 107.695px in my Chrome; the target puts that edge 110px from the center, and the animation follows the target.</p></div>
<div class="cap" data-t="18" data-step="Tile edge"><h3>4. The tile edge cuts the ring</h3><p>html's image is 400 × 300, like its box, and it repeats. The position starts it at y = 150: the center of the ring is on that edge. Above it is the bottom of the previous tile, transparent: its own ring is 300px higher. The bottom half ring is left, from y = 150 to 260.</p></div>
<div class="cap" data-t="24" data-step="body"><h3>5. body's half ring</h3><p>body's tile is 384 × 284 and starts at y = 8 + 86.93 = 94.93, center at x = 8 + 192 = 200. Its half ring runs from 94.93 to 204.93, with a pink hole down to 134.93. body is painted on top: it covers html's hole. At y = 150, its outer edge is 95.22px from the middle, html's is 110px: two 14.78px steps.</p></div>
<div class="cap" data-t="30" data-step="Result" data-live="108 characters · 100% match"><h3>6. Result: 108 characters</h3><p>One gradient for two boxes. The variable only changes the position, and html's fallback also brings the canvas color.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0420 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.5), 1 - pr(t, b - 0.3, b));
  const c = fr ? '\u00a0:' : ':';
  const n = (s) => (fr ? s.replace(/(\d)\.(\d)/g, '$1,$2') : s);
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  // Measured on the official code in local Chrome (400 × 300 iframe, quirks mode, getBoundingClientRect, getComputedStyle).
  // html 0, 0, 400 × 300: background-position 0px 150px, color rgb(222, 56, 123). body 8, 8, 384 × 284: position 0px 86.9291px, no color.
  // Gradient on both: radial-gradient(1q at 50% 0%, transparent 40px, rgb(56, 5, 30) 0px, rgb(56, 5, 30) 107.695px, transparent).
  // The target puts the outer edges 110px from the centers (rows 95 to 259 at x = 200, columns 90 to 309 at y = 150): the animation uses 110.
  const R = 110, HOLE = 40;
  const ring = (col, at, r) => `radial-gradient(circle at ${at}, transparent ${Math.min(HOLE, r)}px, ${col} 0 ${r}px, transparent 0)`;
  const hu = $('.t0420-hu'), hl = $('.t0420-hl'), hc = $('.t0420-hc'), bl = $('.t0420-bl'), bc = $('.t0420-bc');
  const ht = $('.t0420-ht'), ht2 = $('.t0420-ht2'), bt = $('.t0420-bt'), bt2 = $('.t0420-bt2');
  const hbox = $('.t0420-hbox'), bbox = $('.t0420-bbox'), hp = $('.t0420-hp'), bp = $('.t0420-bp'), white = $('.t0420-white');
  const labs = $$('.zlab');
  const ivs = { 1: [0.3, 5.8], 2: [6.3, 11.8], 3: [12.3, 17.8], 4: [18.3, 23.8], 5: [24.3, 29.8] };
  const box = (el, o, col, teach) => {
    el.style.opacity = o;
    el.style.boxShadow = teach && o > 0 ? `inset 0 0 0 calc(2px * var(--k, 1)) ${col}` : 'none';
    el.style.outline = !teach && o > 0 ? 'calc(1.5px * var(--k, 1)) dashed #14142a' : 'none'; // the boxes only show on the white step
    el.style.outlineOffset = 'calc(-0.75px * var(--k, 1))';
    el.style.filter = 'none';
  };
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const tw = teach ? 1 - pr(t, 30.2, 31.2) : 0;
    const colH = mix(tw, 'var(--t0420-h)', '#38051e'), colB = mix(tw, 'var(--t0420-b)', '#38051e');
    // step 2: html's fallback color goes to the canvas
    white.style.opacity = 1 - pr(t, 6.4, 7.6);
    // step 3: html's ring grows, whole; step 4: the tile edge removes its top half
    const rh = R * pr(t, 12.8, 14.8);
    hu.style.background = ring(colH, '110px 110px', rh); // 1px taller than the half, under hl: no seam at y = 150
    hl.style.background = ring(colH, '200px 0', rh);
    hu.style.opacity = pr(t, 12.3, 12.8) * (1 - pr(t, 19.3, 20.5));
    hl.style.opacity = pr(t, 12.3, 12.8);
    hc.style.background = ring(colH, '200px 0', R);
    hc.style.opacity = Math.min(pr(t, 20.5, 21.5), 1 - pr(t, 23.5, 23.8)); // the tile above's ring, shown during step 4 only
    // step 5: body's half ring, on top
    const rb = R * pr(t, 25.3, 27.3);
    bl.style.background = ring(colB, '192px 0', rb);
    bl.style.opacity = pr(t, 24.8, 25.3);
    bc.style.background = ring(colB, '192px 0', R);
    bc.style.opacity = Math.min(pr(t, 27.3, 28.3), 1 - pr(t, 29.5, 29.8)); // the tile above's ring, shown during step 5 only
    ht.style.opacity = ht2.style.opacity = win(t, 18.3, 23.8);
    bt.style.opacity = bt2.style.opacity = win(t, 24.3, 29.8);
    hp.style.opacity = win(t, 12.3, 23.8);
    bp.style.opacity = win(t, 24.3, 29.8);
    box(hbox, win(t, 0.3, 5.8), 'var(--t0420-hbox)', teach);
    box(bbox, win(t, 0.3, 5.8), 'var(--t0420-bbox)', teach);
    labs.forEach((l) => { const iv = ivs[l.dataset.l]; l.style.opacity = iv ? win(t, ...iv) : 0; });
    let txt;
    if (step === 0) txt = `html${c} 400 × 300 · body${c} (8, 8) · 384 × 284`;
    else if (step === 1) txt = n(`html${c} 50vh = 150px · body${c} 92q = 86.93px`);
    else if (step === 2) txt = n(`1q = 0.945px · 5ch = 40px · 15ex${c} 107.695px ${fr ? 'chez moi' : 'in my Chrome'}`);
    else if (step === 3) txt = n(`150 + 110 = 260 · ${fr ? 'tuile du dessus' : 'tile above'}${c} −150 → 150`);
    else if (step === 4) txt = n(`8 + 86.93 = 94.93 · √(110² − 55.07²) = 95.22`);
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
