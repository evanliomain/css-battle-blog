{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="Six boîtes"><h3>1. Six boîtes</h3><p>Chrome ajoute html et body autour des trois <code>dl</code> et du <code>p</code> : six boîtes, chacune dans la précédente. Pas de doctype : en mode quirks, <code>10 110</code> et <code>30</code> sont en px. Il ne reste aucune place pour le contenu, donc <code>padding:10 110</code> donne à chaque boîte 0 + 2 × 110 = 220px de large. Un dl fait 30 + 2 × 10 = 50px de haut, une ellipse grâce à <code>border-radius:50%</code>. Le p est vide : 20px. <code>offset</code> place le centre de chaque boîte sur le centre de son parent : toutes en (200 ; 150).</p></div>
<div class="cap" data-t="4.5" data-step="html tourne"><h3>2. html tourne de 45°</h3><p><code>offset:ray(45deg</code> fait aussi tourner la boîte dans la direction du rayon. <code>ray(45deg)</code> part vers le haut et la droite : html tourne de 45° dans le sens inverse des aiguilles d'une montre, et emporte tout ce qu'il contient. Son fond jaune, lui, couvre tout le canevas sans tourner.</p></div>
<div class="cap" data-t="9" data-step="body tourne"><h3>3. body : 90°</h3><p>body a le même <code>offset</code>, donc il tourne de 45° de plus, à l'intérieur de html : 90° en tout. Sa boîte jaune de 264 × 220 à l'écran est posée sur le canevas jaune : elle ne se voit pas.</p></div>
<div class="cap" data-t="13.5" data-step="1er dl"><h3>4. Le premier dl : 135°</h3><p>Encore 45° : le premier dl est à 135°. Les deux autres dl et le p sont dedans, ils suivent. Les trois ellipses sont encore l'une sur l'autre.</p></div>
<div class="cap" data-t="18" data-step="2e dl"><h3>5. Le deuxième dl : 180°</h3><p>Le deuxième dl arrive à 180° : il est de nouveau horizontal, de x = 90 à 310. Le premier dl reste sur la diagonale qui descend vers la droite.</p></div>
<div class="cap" data-t="22.5" data-step="3e dl"><h3>6. Le troisième dl : 225°</h3><p>Le troisième dl arrive à 225°, l'autre diagonale. Les trois ellipses de 220 × 50 se croisent au centre : six pétales.</p></div>
<div class="cap" data-t="27" data-step="p : la fente"><h3>7. Le p : 270°</h3><p>Le p arrive à 270° : une bande verticale de 20 × 220, de x = 190 à 210. Il est peint après les dl, et il est jaune : il coupe le milieu des pétales.</p></div>
<div class="cap" data-t="31.5" data-step="Résultat" data-live="124 caractères · 100 % identique"><h3>8. Résultat : 124 caractères</h3><p>Les dl sont bleus : le sélecteur <code>dl</code> l'emporte sur <code>*</code>. html, body et le p sont jaunes. Une seule déclaration <code>offset</code>, répétée de boîte en boîte, donne les trois angles des pétales et celui de la fente.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="Six boxes"><h3>1. Six boxes</h3><p>Chrome adds html and body around the three <code>dl</code> and the <code>p</code>: six boxes, each one inside the previous one. There is no doctype: in quirks mode, <code>10 110</code> and <code>30</code> are px. There is no room left for content, so <code>padding:10 110</code> makes every box 0 + 2 × 110 = 220px wide. A dl is 30 + 2 × 10 = 50px tall, an ellipse thanks to <code>border-radius:50%</code>. The p is empty: 20px. <code>offset</code> puts the center of each box on its parent's center: all of them at (200, 150).</p></div>
<div class="cap" data-t="4.5" data-step="html turns"><h3>2. html turns 45°</h3><p><code>offset:ray(45deg</code> also turns the box to the direction of the ray. <code>ray(45deg)</code> points up and to the right: html turns 45° counterclockwise, and carries everything inside it. Its yellow background still covers the whole canvas, without turning.</p></div>
<div class="cap" data-t="9" data-step="body turns"><h3>3. body: 90°</h3><p>body has the same <code>offset</code>, so it turns 45° more, inside html: 90° in all. Its yellow box, 264 × 220 on screen, sits on the yellow canvas: it does not show.</p></div>
<div class="cap" data-t="13.5" data-step="1st dl"><h3>4. The first dl: 135°</h3><p>45° more: the first dl is at 135°. The two other dl and the p are inside it, so they follow. The three ellipses are still on top of each other.</p></div>
<div class="cap" data-t="18" data-step="2nd dl"><h3>5. The second dl: 180°</h3><p>The second dl reaches 180°: it is horizontal again, from x = 90 to 310. The first dl stays on the diagonal that goes down to the right.</p></div>
<div class="cap" data-t="22.5" data-step="3rd dl"><h3>6. The third dl: 225°</h3><p>The third dl reaches 225°, the other diagonal. The three 220 × 50 ellipses cross in the middle: six petals.</p></div>

<div class="cap" data-t="31.5" data-step="Result" data-live="124 characters · 100% match"><h3>8. Result: 124 characters</h3><p>The dl are blue: the <code>dl</code> selector beats <code>*</code>. html, body and the p are yellow. One <code>offset</code> declaration, repeated from box to box, gives the three angles of the petals and the angle of the slit.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0803 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const c = fr ? ' :' : ':';
  // Measured on the official code in local Chrome (quirks mode, 400 × 300):
  // html 400 × 300 (content box 180 × 280 at (110, 10)), body 220 × 264 (content 0 × 244),
  // each dl 220 × 50 (content 0 × 30), p 220 × 20 (content 0 × 0).
  // offset-rotate auto: each element turns -45deg (counterclockwise) in its parent; every center lands on (200, 150).
  // Final picture: ellipses 220 × 50 at 135°, 180°, 225°, yellow p 20 × 220 from x = 190 to 210, y = 40 to 260.
  const FIN = 31.5;
  const H = $('.t0803-h'), B = $('.t0803-b'), P = $('.t0803-p');
  const E = $$('.t0803-e');
  const XH = $('.t0803-h > .t0803-x'), XB = $('.t0803-b > .t0803-x');
  const L = (k) => $$(`.t0803-l[data-l="${k}"]`);
  // One element turns per step: html, body, dl 1, dl 2, dl 3, p.
  const T = [4.6, 9.1, 13.6, 18.1, 22.6, 27.1];
  const LIVE = fr
    ? ['html 400 × 300 · body 220 × 264 · dl 220 × 50 · p 220 × 20', 'html : 45°', 'body : 90°', '1er dl : 135°', '2e dl : 180°', '3e dl : 225°', 'p : 270°']
    : ['html 400 × 300 · body 220 × 264 · dl 220 × 50 · p 220 × 20', 'html: 45°', 'body: 90°', '1st dl: 135°', '2nd dl: 180°', '3rd dl: 225°', 'p: 270°'];
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    const col = (v, real) => (teach ? `var(--t0803-${v})` : real);
    [H, B, ...E, P].forEach((e, i) => (e.style.transform = `rotate(${-45 * pr(t, [T[i], T[i] + 1.6])}deg)`));
    const show = pr(t, [0.1, 0.9]);
    B.style.background = teach ? 'var(--t0803-tb)' : 'transparent';
    E.forEach((e, i) => {
      e.style.background = col(`t${i + 1}`, 'var(--t0803-bl)');
      e.style.opacity = show;
    });
    P.style.background = col('tp', 'var(--t0803-ye)');
    B.style.opacity = show;
    const ann = 1 - pr(t, [FIN, FIN + 0.6]);
    XH.style.opacity = 0.9 * show * ann;
    XB.style.opacity = 0.9 * show * ann;
    [[0.4, 4.4], [5, 8.9], [9.5, 13.4], [14, 17.9], [18.5, 22.4], [23, 26.9], [27.5, 31.4]].forEach(([a, z], k) => L(k + 1).forEach((e) => (e.style.opacity = win(t, a, z))));
    live.textContent = step < 7 ? LIVE[step] : $$('.caps .cap')[7].dataset.live || '';
  };
};
</script>
