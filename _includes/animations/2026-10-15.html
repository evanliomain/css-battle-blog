<figure class="anim t1015" data-duration="26" data-scene="t1015" data-wide="-50 -40 500 380" style="--bg:#fff">
<style>
.t1015{--mark:#1b1f24}
.t1015 .scene>*{box-sizing:border-box}
.t1015 .h{left:105px;top:90px;width:190px;height:170px;border:85px solid #cccb}
.t1015 .h-out{left:105px;top:90px;width:190px;height:170px;outline:2px dashed var(--mark);outline-offset:-1px}
.t1015 .bx{left:190px;top:150px;width:20px;height:20.19px}
.t1015 .bx-out{outline:2px dashed var(--mark);outline-offset:1px}
.t1015 .ov{width:20px;height:20.19px;outline:2px dashed var(--mark);outline-offset:2px}
.t1015 .axis{left:199px;top:-40px;width:0;height:380px;border-left:2px dashed #4f7fd1}
.t1015 .tag{z-index:60;font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#fff;background:var(--mark);padding:3px 5px;border-radius:3px;white-space:nowrap}
.t1015[data-view="wide"] .tag{font-size:14px}
</style>
<div class="anim-col">
<div class="stage" role="img" aria-label="{% if include.lang == "fr" %}Animation : le cadre gris de html, les deux boîtes de 20px du body et de l'option, leurs sept ombres, puis la copie retournée par le body{% else %}Animation: html's grey frame, the two 20px boxes of body and option, their seven shadows, then the mirrored copy from body{% endif %}">
<div class="scene">
<div class="h"></div>
<div class="h-out"></div>
<div class="axis"></div>
<div class="bx b"></div>
<div class="bx o"></div>
<div class="bx bx-out"></div>
<div class="ov" style="left:250.47px;top:150px"></div><div class="ov" style="left:129.53px;top:150px"></div>
<b class="tag" data-w="1" style="left:8px;top:8px">html · margin:90 105 · border:90q → 85px</b>
<b class="tag" data-w="1" style="left:8px;top:34px">#cccb + #fff ≈ #d9d9d9</b>
<b class="tag" data-w="2" style="left:8px;top:8px">body · 0 + 25 − 5 = 20px</b>
<b class="tag" data-w="2" style="left:8px;top:34px">&lt;option> · 1.2em + 1px ≈ 20px</b>
<b class="tag" data-w="3" style="left:8px;top:8px">box-shadow × 7 · 5em = 80px</b>
<b class="tag" data-w="4" style="left:8px;top:8px">body · scale:-1 1</b>
<b class="tag" data-w="4" style="left:8px;top:34px">option · −1 × −1 = 1</b>
<b class="tag" data-w="5" style="left:8px;top:8px">{% if include.lang == "fr" %}#f218 sur #8c8c8c ≈ #ca534a{% else %}#f218 over #8c8c8c ≈ #ca534a{% endif %}</b>
<b class="tag" data-w="5" style="left:8px;top:34px">{% if include.lang == "fr" %}à gauche : rouge sous le gris{% else %}left: red under grey{% endif %}</b>
</div>
</div>
<div class="legend"><span><i style="--c:#8c8c8c"></i>{% if include.lang == "fr" %}ombres de l'option{% else %}option's shadows{% endif %}</span><span><i style="--c:#4f7fd1"></i>{% if include.lang == "fr" %}ombres du body (grises en vrai){% else %}body's shadows (grey in reality){% endif %}</span></div>
</div>
<div class="anim-side">
<pre class="code" aria-hidden="true"><span data-on="2">&lt;option></span>&lt;style>&amp;{<span data-on="1">margin:90 105</span>;<span data-on="1">border:90q solid#cccb</span>;<span data-on="3">color:8C8C8C</span>;*{<span data-on="2">margin:-25 0 5</span>;<span data-on="4" data-tone="2">scale:-1 1</span>;box-shadow:<span data-on="3 5">64q 0#f218</span><span data-on="3">,-63q 0,5vw 0,5vw 53q,64q 53q,58q -5em,58q -64q</span></pre>
<div class="now" aria-live="polite">
<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="html : un cadre gris"><h3>1. html : un cadre gris</h3><p><code>&amp;</code> seul, c'est <code>html</code>. <code>margin:90 105</code> et une bordure de 90q (85px) en font un cadre de 190 × 170 en (105, 90), dont le contenu ne fait que 20px de large. <code>#cccb</code> est un gris transparent : sur la page blanche, il donne le gris clair <code>#d9d9d9</code>.</p></div>
<div class="cap" data-t="4" data-step="body et &lt;option> : deux boîtes de 20px"><h3>2. body et &lt;option> : deux boîtes de 20px</h3><p>Le <code>*</code> imbriqué donne <code>margin:-25 0 5</code> au <code>body</code>. En mode quirks, il s'étire à la hauteur du contenu de <code>html</code> (0px ici) moins ses marges : 0 + 25 − 5 = 20px. Dedans, une <code>&lt;option></code> vide hors d'un <code>&lt;select></code> reste un bloc d'au moins 1,2em de haut plus 1px de padding, sans CSS : 20,19px. Elle reçoit les mêmes marges, qui fusionnent avec celles du <code>body</code> : les deux boîtes sont en (190, 150), larges de 20px, sans fond.</p></div>
<div class="cap" data-t="8" data-step="Sept ombres"><h3>3. Sept ombres</h3><p>Les deux boîtes reçoivent les mêmes 7 ombres, montrées ici sur l'<code>option</code> : un carré rouge transparent (<code>#f218</code>) et six gris, de la couleur de <code>color</code> (<code>8C8C8C</code>, sans <code>#</code> en mode quirks). <code>64q</code> ≈ 60,5px, <code>53q</code> ≈ 50px, <code>5em</code> = 80px.</p></div>
<div class="cap" data-t="14" data-step="scale:-1 1 : le miroir"><h3>4. scale:-1 1 : le miroir</h3><p><code>body</code> reçoit <code>scale:-1 1</code> : il se retourne autour de x = 200, ombres comprises. <code>option</code> est dans <code>body</code>, donc retournée elle aussi, mais son propre <code>scale:-1 1</code> la remet à l'endroit. Une liste, deux copies : l'une telle quelle, l'autre en miroir.</p></div>
<div class="cap" data-t="18.5" data-step="Qui passe dessus"><h3>5. Qui passe dessus</h3><p><code>option</code> est peinte après <code>body</code>. À droite, son rouge tombe sur un carré gris du <code>body</code> : <code>#f218</code> sur <code>#8c8c8c</code> donne le rouge brique <code>#ca534a</code>. À gauche, le rouge du <code>body</code> est caché sous un carré gris de l'<code>option</code>. Chaque barre du haut, ce sont deux carrés empilés.</p></div>
<div class="cap" data-t="22" data-step="Résultat" data-live="162 caractères · 100 % identique"><h3>6. Résultat : 162 caractères</h3><p>Deux boîtes, sept ombres, quatorze carrés : le calendrier.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html: a grey frame"><h3>1. html: a grey frame</h3><p><code>&amp;</code> alone is <code>html</code>. <code>margin:90 105</code> and a 90q (85px) border make it a 190 × 170 frame at (105, 90), with content only 20px wide. <code>#cccb</code> is a see-through grey: over the white page it gives the light grey <code>#d9d9d9</code>.</p></div>
<div class="cap" data-t="4" data-step="body and &lt;option>: two 20px boxes"><h3>2. body and &lt;option>: two 20px boxes</h3><p>The nested <code>*</code> gives <code>body</code> <code>margin:-25 0 5</code>. In quirks mode it stretches to the height of <code>html</code>'s content (0px here) minus its margins: 0 + 25 − 5 = 20px. Inside it, an empty <code>&lt;option></code> outside a <code>&lt;select></code> is still a block at least 1.2em tall plus 1px of padding, with no CSS: 20.19px. It gets the same margins, which merge with body's, so both boxes sit at (190, 150), 20px wide, with no background.</p></div>
<div class="cap" data-t="8" data-step="Seven shadows"><h3>3. Seven shadows</h3><p>Both boxes get the same 7 shadows, shown here on <code>option</code>: a see-through red square (<code>#f218</code>) and six grey ones, in the <code>color</code> (<code>8C8C8C</code>, no <code>#</code> needed in quirks mode). <code>64q</code> ≈ 60.5px, <code>53q</code> ≈ 50px, <code>5em</code> = 80px.</p></div>
<div class="cap" data-t="14" data-step="scale:-1 1: the mirror"><h3>4. scale:-1 1: the mirror</h3><p><code>body</code> gets <code>scale:-1 1</code>: it flips around x = 200, shadows included. <code>option</code> is inside <code>body</code>, so it is flipped too, but its own <code>scale:-1 1</code> flips it back. One list, two copies: one as written, one mirrored.</p></div>
<div class="cap" data-t="18.5" data-step="Who is on top"><h3>5. Who is on top</h3><p><code>option</code> is painted after <code>body</code>. On the right, its red lands on one of body's grey squares: <code>#f218</code> over <code>#8c8c8c</code> gives the brick red <code>#ca534a</code>. On the left, body's red is hidden under a grey square of <code>option</code>. Each bar at the top is two squares stacked.</p></div>
<div class="cap" data-t="22" data-step="Result" data-live="162 characters · 100% match"><h3>6. Result: 162 characters</h3><p>Two boxes, seven shadows, fourteen squares: the calendar.</p></div>
{%- endif %}
</div>
<div class="live"></div>
</div>
</div>
<script>
(window.AnimScenes = window.AnimScenes || {}).t1015 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s), $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live'), end = $('.cap[data-live]').dataset.live, caps = $$('.cap');
  const H = $('.h'), hOut = $('.h-out'), axis = $('.axis'), B = $('.b'), O = $('.o'), bxOut = $('.bx-out'), ovs = $$('.ov');
  const tags = $$('.tag[data-w]');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b, f = 0.5) => Math.min(pr(t, a, a + f), 1 - pr(t, b - f, b));
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, m) => `rgb(${hex(a).map((v, i) => Math.round(v + (hex(b)[i] - v) * m)).join(',')})`;
  const num = (v, d = 1) => (Math.abs(v) < 0.005 ? 0 : v).toFixed(d).replace('.', fr ? ',' : '.');
  const q = 96 / 101.6;
  const SH = [[64 * q, 0], [-63 * q, 0], [20, 0], [20, 53 * q], [64 * q, 53 * q], [58 * q, -80], [58 * q, -64 * q]];
  const RED = 'rgb(255 34 17 / .533)', GREY = '#8c8c8c';
  const list = (k, col) => SH.map(([x, y], i) => `${x * k[i]}px ${y * k[i]}px ${i ? col : RED}`).join(',');
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const real = teach ? pr(t, 18.6, 19.6) : 1;
    H.style.opacity = pr(t, 0.2, 1);
    hOut.style.opacity = win(t, 0.2, 4, 0.5);
    const ks = SH.map((_, i) => pr(t, 8.4 + 0.7 * i, 9.2 + 0.7 * i));
    O.style.boxShadow = t >= 8.4 ? list(ks, GREY) : 'none';
    B.style.boxShadow = t >= 14.2 ? list(SH.map(() => 1), mix('#4f7fd1', GREY, real)) : 'none';
    B.style.opacity = pr(t, 14.2, 14.8);
    const sx = 1 - 2 * pr(t, 15.2, 17.6);
    B.style.transform = `scale(${sx},1)`;
    axis.style.opacity = win(t, 14.4, 18.5, 0.5);
    bxOut.style.opacity = win(t, 4.2, 14, 0.5);
    ovs.forEach((e) => { e.style.opacity = win(t, 18.8, 22, 0.4); });
    tags.forEach((e) => {
      const w = +e.dataset.w - 1;
      e.style.opacity = w === step ? win(t, +caps[w].dataset.t + 0.3, +caps[w + 1].dataset.t, 0.4) : 0;
    });
    let txt = '';
    if (step === 0) txt = fr ? 'html : 190 × 170 en (105, 90) · bordure 85px · contenu 20 × 0' : 'html: 190 × 170 at (105, 90) · border 85px · content 20 × 0';
    else if (step === 1) txt = fr ? 'body, option : 20 × 20,19 en (190, 150)' : 'body, option: 20 × 20.19 at (190, 150)';
    else if (step === 2) {
      let i = ks.findIndex((k) => k < 1);
      if (i < 0) i = 6;
      txt = `${fr ? 'ombre' : 'shadow'} ${i + 1}/7${fr ? ' :' : ':'} ${num(SH[i][0] * ks[i])} ${num(SH[i][1] * ks[i])} px`;
    } else if (step === 3) txt = `body${fr ? ' :' : ':'} scale ${num(sx, 2)} 1 · option${fr ? ' :' : ':'} 1 1`;
    else if (step === 4) txt = fr ? '#f218 sur #8c8c8c ≈ #ca534a' : '#f218 over #8c8c8c ≈ #ca534a';
    else txt = end;
    live.textContent = txt;
  };
};
</script>
</figure>
