<pre class="code" aria-hidden="true">&lt;style><span data-on="1">&amp;{</span><span data-on="1 5">background:</span><span data-on="4">28%64q</span>/<span data-on="2">55%120%</span><span data-on="3">conic-gradient(at 5pc,#e25c57,25%,#e2ad56 0 50%,#e25c57 0 75%,#222 0</span></pre>
<div class="now" aria-live="polite">
<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="html"><h3>1. &amp; vise html</h3><p>Au premier niveau d'une feuille de style, <code>&amp;</code> désigne la racine, html. Le fond de html est peint sur tout le canevas. Sa zone de placement est la boîte de html : en mode quirks, html remplit la fenêtre, 400 × 300. Rien n'est encore peint.</p></div>
<div class="cap" data-t="4.5" data-step="Tuile"><h3>2. Une tuile de 220 × 360</h3><p><code>55%120%</code> est la taille de l'image de fond : 55 % de 400 = 220 de large, 120 % de 300 = 360 de haut. La tuile est plus haute que le canevas. Sans position, elle serait en (0, 0).</p></div>
<div class="cap" data-t="9" data-step="Quatre quarts"><h3>3. Quatre quarts</h3><p><code>at 5pc</code> met le centre à 5pc = 80px du bord gauche de la tuile. Avec une seule valeur, la hauteur est 50 % : le centre est en (80, 180). Le dégradé tourne depuis le haut, dans le sens des aiguilles d'une montre : rouge jusqu'à 25 %, jaune jusqu'à 50 %, rouge jusqu'à 75 %, #222 jusqu'au bout. Chaque quart est un rectangle. Le <code>25%</code> seul est un repère de transition : le <code>0</code> du jaune est remonté à 25 %, le repère est au même endroit, et le passage est net.</p></div>
<div class="cap" data-t="14.5" data-step="Position"><h3>4. Placée en (50,4 ; 60,47)</h3><p><code>28%64q</code>. Un pourcentage aligne le point à 28 % de la tuile sur le point à 28 % de la zone : 28 % × (400 − 220) = 50,4. 1Q vaut 0,945px : 64q = 60,47px. Le noir va maintenant de x = 50,4 à 130,4 et de y = 60,47 à 240,47.</p></div>
<div class="cap" data-t="19.5" data-step="Répétition"><h3>5. Répétée</h3><p>Par défaut, le fond se répète : une copie tous les 220px en largeur et tous les 360px en hauteur, aussi vers la gauche et vers le haut. Sur le canevas, il y a trois colonnes de tuiles et deux rangées. Les quarts noirs de deux tuiles font les deux colonnes. Le quart 1 de trois tuiles fait la bande rouge du milieu. En haut, on voit le bas de la rangée du dessus : du rouge (quart 3) au-dessus des colonnes, du jaune (quart 2) ailleurs. En bas, c'est le bas des mêmes tuiles.</p></div>
<div class="cap" data-t="25.5" data-step="Résultat" data-live="102 caractères · 100 % identique"><h3>6. Résultat : 102 caractères</h3><p>Un dégradé, une tuile, répétée : tout le tissage vient d'un seul fond, sur html.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html"><h3>1. &amp; targets html</h3><p>At the top level of a style sheet, <code>&amp;</code> means the root, html. html's background is painted over the whole canvas. Its positioning area is html's box: in quirks mode, html fills the window, 400 × 300. Nothing is painted yet.</p></div>
<div class="cap" data-t="4.5" data-step="Tile"><h3>2. A 220 × 360 tile</h3><p><code>55%120%</code> is the size of the background image: 55% of 400 = 220 wide, 120% of 300 = 360 tall. The tile is taller than the canvas. With no position, it would sit at (0, 0).</p></div>
<div class="cap" data-t="9" data-step="Four quarters"><h3>3. Four quarters</h3><p><code>at 5pc</code> puts the center 5pc = 80px from the tile's left edge. With one value, the height is 50%: the center is at (80, 180). The gradient turns clockwise from the top: red up to 25%, yellow up to 50%, red up to 75%, #222 to the end. Each quarter is a rectangle. The lone <code>25%</code> is a transition hint: the yellow's <code>0</code> is raised to 25%, the hint sits at the same place, and the change is sharp.</p></div>
<div class="cap" data-t="14.5" data-step="Position"><h3>4. Placed at (50.4, 60.47)</h3><p><code>28%64q</code>. A percentage lines up the point at 28% of the tile with the point at 28% of the area: 28% × (400 − 220) = 50.4. 1Q is 0.945px: 64q = 60.47px. The black now runs from x = 50.4 to 130.4 and from y = 60.47 to 240.47.</p></div>
<div class="cap" data-t="19.5" data-step="Repeat"><h3>5. Repeated</h3><p>By default, a background repeats: a copy every 220px across and every 360px down, also to the left and up. On the canvas, there are three columns of tiles and two rows. The black quarters of two tiles make the two columns. Quarter 1 of three tiles makes the red middle band. At the top, the canvas shows the bottom of the row above: red (quarter 3) above the columns, yellow (quarter 2) elsewhere. At the bottom, it is the bottom of the same tiles.</p></div>
<div class="cap" data-t="25.5" data-step="Result" data-live="102 characters · 100% match"><h3>6. Result: 102 characters</h3><p>One gradient, one tile, repeated: the whole woven pattern comes from a single background, on html.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0510 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const lin = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.5), 1 - pr(t, b - 0.3, b));
  const c = fr ? ' :' : ':';
  const pc = fr ? ' %' : '%';
  const n = (v) => (fr ? String(v).replace('.', ',') : String(v));
  // Measured on the official code in local Chrome (400 × 300 iframe, quirks mode, getBoundingClientRect, computed styles):
  // html 0, 0, 400 × 300; background-position 28% 60.4724px, background-size 55% 120% (220 × 360), repeat;
  // conic-gradient(at 5pc 50%, …): center (80, 180) in the tile; tile at (50.4, 60.4724), copies every 220 × 360.
  // The last frame shows only .t0510-plane: one box with the same repeating tile, so it draws the same pixels.
  const FIN = 25.5;
  const TX = 50.4, TY = 60.4724;
  const REAL = [[226, 92, 87], [226, 173, 86], [226, 92, 87], [34, 34, 34]];
  const TEACH = [[251, 146, 60], [74, 222, 128], [167, 139, 250], [56, 189, 248]];
  const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
  const rgb = (col) => `rgb(${col.join(' ')})`;
  const grad = (cols, a) => {
    const st = [];
    for (let i = 0; i < 4; i++) {
      const s = 25 * i, e = Math.min(25 * (i + 1), 100 * a);
      if (e > s) st.push(`${rgb(cols[i])} ${s}% ${e}%`);
    }
    if (a < 1) st.push(`transparent ${(100 * a).toFixed(3)}% 100%`);
    return `conic-gradient(at 80px 180px, ${st.join(', ')})`;
  };
  const plane = $('.t0510-plane'), tile = $('.t0510-tile'), ctr = $('.t0510-ctr');
  const hbox = $('.t0510-html'), main = $('.t0510-main'), copies = $$('.t0510-copy');
  const labs = $$('.zlab[data-l]');
  const ivs = [[0.3, 4.2], [4.9, 8.7], [9.6, 14.2], [16.8, 19.2], [20.2, 25.2]];
  const lerp = (a, b, k) => a + (b - a) * k;
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const fin = pr(t, FIN + 0.2, FIN + 0.9);
    const tw = teach ? 1 - fin : 0;
    const cols = REAL.map((col, i) => mix(col, TEACH[i], tw));
    // step 1: html's box
    hbox.style.opacity = win(t, 0.3, 4.3);
    // step 2: the 220 × 360 tile at (0, 0); step 4: moved to (50.4, 60.47)
    const k = pr(t, 15, 17);
    const x = lerp(0, TX, k), y = lerp(0, TY, k);
    tile.style.left = main.style.left = `${x}px`;
    tile.style.top = main.style.top = `${y}px`;
    main.style.opacity = Math.min(pr(t, 4.8, 5.5), 1 - pr(t, FIN, FIN + 0.5));
    // step 3: the four quarters sweep in, clockwise from the top
    const a = lin(t, 9.6, 12.6);
    tile.style.backgroundImage = a > 0 ? grad(cols, a) : 'none';
    tile.style.opacity = 1 - fin;
    ctr.style.opacity = win(t, 9.4, 19.2);
    ctr.style.left = `${x + 80}px`;
    ctr.style.top = `${y + 180}px`;
    // step 5: the copies (one box with the repeating tile, under the original)
    plane.style.backgroundImage = grad(cols, 1);
    plane.style.opacity = pr(t, 20.2, 21.6);
    const co = win(t, 20.2, 25.3);
    copies.forEach((b) => { b.style.opacity = co; });
    labs.forEach((l) => {
      l.style.opacity = win(t, ...ivs[+l.dataset.l - 1]);
    });
    let txt;
    if (step === 0) txt = `& = html${c} 400 × 300`;
    else if (step === 1) txt = `55${pc} × 400 = 220 · 120${pc} × 300 = 360`;
    else if (step === 2) txt = `5pc = 5 × 16 = 80px · 50${pc} × 360 = 180`;
    else if (step === 3) txt = `28${pc} × (400 − 220) = ${n(50.4)} · 64q = 64 × ${n(0.945)} = ${n(60.47)}px`;
    else if (step === 4) txt = `x${c} −${n(169.6)}, ${n(50.4)}, ${n(270.4)} · y${c} −${n(299.53)}, ${n(60.47)}`;
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
