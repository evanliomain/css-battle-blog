<div class="cap" data-t="0" data-step="La boîte de html"><h3>1. La boîte de html</h3><p><code>*{</code> vise html, head, style et body ; head et style ne s'affichent pas. <code>&amp;{</code>, hors de toute règle, vise la racine : html. Sa marge passe après celle de <code>*{</code> et l'emporte. En mode quirks, <code>-25 100</code> compte en px et html s'étire sur la hauteur du cadre, marges ôtées : 200 × 350, de y = -25 à 325.</p></div>
<div class="cap" data-t="5" data-step="Le canevas"><h3>2. Le fond de html va au canevas</h3><p>Le fond de l'élément racine est peint sur tout le canevas, pas seulement dans sa boîte. Tout devient moutarde, même là où il n'y aura jamais de boîte.</p></div>
<div class="cap" data-t="10" data-step="Deux ombres"><h3>3. Deux ombres internes</h3><p><code>inset 5in 0</code> décale une copie de la boîte de 480px vers la droite et peint en gris ce qu'elle ne couvre plus : toute la boîte, large de 200px. La première ombre de la liste passe dessus : <code>inset 0 0 0 74q</code> a un étalement de 74 × 0,945 = 69,92px. Il reste un trou gris de 60,16 × 210,16 au milieu.</p></div>
<div class="cap" data-t="15" data-step="Les coins"><h3>4. border-radius:15%</h3><p>Les pourcentages suivent chaque côté : 15 % de 200 = 30px en largeur, 15 % de 350 = 52,5px en hauteur. Les ombres internes suivent l'arrondi. Les coins du trou restent carrés : 30 - 69,92 est négatif.</p></div>
<div class="cap" data-t="20" data-step="body"><h3>5. body, une barre olive</h3><p>Avec <code>margin:-35 85</code>, body fait 400 - 200 - 170 = 30px de large et 350 + 70 = 420px de haut, de y = -60 à 360. Il reçoit les mêmes ombres : 69,92px d'étalement de chaque côté couvrent ses 30px. body est tout olive. Il coupe le trou gris en deux et dépasse html de 35px en haut et en bas.</p></div>
<div class="cap" data-t="25" data-step="L'écrasement"><h3>6. scale:1 .57</h3><p>html est écrasé à 57 % de sa hauteur autour de son centre, (200, 150), avec ses ombres et body à l'intérieur. html : 350 × 0,57 = 199,5, de y = 50,25 à 249,75. Les barres grises : de 90,1 à 209,9. body : 239,4, de 30,3 à 269,7. Les coins : 30 × 29,9, presque ronds.</p></div>
<div class="cap" data-t="30" data-step="Résultat" data-live="141 caractères · 100 % identique"><h3>7. Résultat : 141 caractères</h3><p>Une seule liste d'ombres pour html et body, dessinée sur un html trop haut, puis écrasée d'un coup.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0421 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.5), 1 - pr(t, b - 0.3, b));
  // Measured on the official code in local Chrome (400 × 300 iframe, quirks mode, getBoundingClientRect, getComputedStyle).
  // html: 200px × 350px, margin -25px 100px, so (100, -25) before the scale; scale 1 .57 around (200, 150) gives (100, 50.25) 200 × 199.5.
  // box-shadow on html and body: 0 0 0 69.9213px inset #4a4a23, 480px 0 0 0 inset #d9d9d9. border-radius 15% on html only.
  // body: 30px × 420px, margin -35px 85px, so (185, -60) before the scale, (185, 30.3) 30 × 239.4 after it.
  // html's background #c0a623 is painted on the whole canvas.
  const white = $('.t0421-white'), h = $('.t0421-h'), b = $('.t0421-b'), hb = $('.t0421-hb'), bb = $('.t0421-bb');
  const labs = $$('.zlab');
  const ivs = { 1: [0.3, 4.8], 2: [5.3, 9.8], 3: [10.3, 14.8], 4: [15.3, 19.8], 5: [20.3, 24.8], 6: [27.6, 29.8] };
  const box = (el, o, col, teach) => {
    el.style.opacity = o;
    el.style.boxShadow = teach && o > 0 ? `inset 0 0 0 calc(2px * var(--k, 1)) ${col}` : 'none';
    el.style.outline = !teach && o > 0 ? 'calc(1.5px * var(--k, 1)) dashed #fff' : 'none';
    el.style.outlineOffset = 'calc(-0.75px * var(--k, 1))';
    el.style.filter = !teach && o > 0 ? 'drop-shadow(0 0 calc(1px * var(--k, 1)) rgb(0 0 0 / .9))' : 'none';
  };
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    // step 2: the canvas turns mustard
    white.style.opacity = 1 - pr(t, 5.3, 6.5);
    // step 3: html's gray shadow sweeps in, then the olive spread grows
    const gx = 480 * pr(t, 10.4, 12.2), hs = 69.9213 * pr(t, 12.4, 14);
    h.style.boxShadow = `inset 0 0 0 ${hs}px var(--t0421-ho), inset ${gx}px 0 var(--t0421-g)`;
    // step 4: the corners
    const r = pr(t, 15.4, 17);
    h.style.borderRadius = `${30 * r}px / ${52.5 * r}px`;
    // step 5: body and its shadows
    b.style.opacity = pr(t, 20.3, 20.9);
    const bs = 69.9213 * pr(t, 21.4, 23);
    // once the olive spread covers body's 30px, its gray shadow is hidden: drop it, so no gray shows at body's antialiased edges
    b.style.boxShadow = `inset 0 0 0 ${bs}px var(--t0421-bo)` + (bs < 16 ? ', inset 480px 0 var(--t0421-g)' : '');
    // step 6: the squeeze
    h.style.transform = `scale(1, ${1 - 0.43 * pr(t, 25.4, 27.4)})`;
    box(hb, Math.max(win(t, 0.3, 4.8), win(t, 25.4, 29.8)), 'var(--t0421-hbox)', teach);
    box(bb, win(t, 20.3, 29.8), 'var(--t0421-bbox)', teach);
    labs.forEach((l) => { const iv = ivs[l.dataset.l]; l.style.opacity = iv ? win(t, ...iv) : 0; });
    let txt;
    if (step === 0) txt = fr ? 'html : (100, -25) · 200 × 350' : 'html: (100, -25) · 200 × 350';
    else if (step === 1) txt = fr ? 'fond de html #c0a623 → tout le canevas' : "html's background #c0a623 → whole canvas";
    else if (step === 2) txt = fr ? '74q = 69,92px · trou : 200 - 139,84 = 60,16' : '74q = 69.92px · hole: 200 - 139.84 = 60.16';
    else if (step === 3) txt = fr ? '15 % de 200 = 30 · 15 % de 350 = 52,5' : '15% of 200 = 30 · 15% of 350 = 52.5';
    else if (step === 4) txt = fr ? 'body : (185, -60) · 30 × 420 · 30 < 2 × 69,92' : 'body: (185, -60) · 30 × 420 · 30 < 2 × 69.92';
    else if (step === 5) txt = fr ? '350 × 0,57 = 199,5 · 420 × 0,57 = 239,4' : '350 × 0.57 = 199.5 · 420 × 0.57 = 239.4';
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
