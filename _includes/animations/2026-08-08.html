<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="Qui reçoit quoi"><h3>1. Deux niveaux de <code>*</code></h3><p><code>* *</code> vise tout élément placé dans un autre : head, body, les quatre img et style, donc tous sauf html. Le <code>*{</code> imbriqué veut dire <code>* * *</code> : ce qui est dans body, les quatre img et style. head et style ne s'affichent pas. Pas de doctype : en mode quirks, un nombre sans unité est en px. Les boîtes en pointillés sont html et body ; elles descendent sous le canevas.</p></div>
<div class="cap" data-t="4.5" data-step="Le fond"><h3>2. Le fond bleu-vert</h3><p><code>background:#2E8DA6</code> va à body (et à head, aux img, à style). html n'a pas de fond : le navigateur peint alors le fond de body sur tout le canevas, et non dans la boîte de body. C'est le bleu-vert.</p></div>
<div class="cap" data-t="9" data-step="padding:20 28"><h3>3. Un padding, deux rôles</h3><p>Le même <code>padding:20 28</code> va à body et aux img. body a sa marge par défaut de 8px : son contenu commence en x = 8 + 28 = 36 et y = 8 + 20 = 28, sur 384 − 56 = 328px de large. Une img sans source a un contenu de 0 × 0 : avec le padding, elle fait 2 × 28 = 56 sur 2 × 20 = 40. Son fond est bleu-vert comme le canevas : elle est invisible. Sans marges, les quatre se suivent à partir de x = 36.</p></div>
<div class="cap" data-t="13.5" data-step="Les marges"><h3>4. Deux img par ligne</h3><p><code>margin:-8-24 45%80</code> : −8 en haut, −24 à droite, 45 % en bas, 80 à gauche. Chaque img prend 80 + 56 − 24 = 112px de la ligne : la première commence en 36 + 80 = 116, la deuxième en 116 + 56 − 24 + 80 = 228. Une troisième demanderait 3 × 112 = 336px, plus que 328 : elle passe à la ligne. La marge du bas vaut 45 % de 328, soit 147,6, et Chrome donne 147,594px. La ligne 1 commence en y = 28 − 8 = 20, la ligne 2 en 20 + 179,594 = 199,594, peinte en 200.</p></div>
<div class="cap" data-t="18" data-step="7ch 0,-7ch 0"><h3>5. Une copie de chaque côté</h3><p><code>7ch 0,-7ch 0</code> : dans mon Chrome, la police est Times 16px et 1ch vaut 8px, donc 7ch = 56px, la largeur d'une img. Les ombres n'ont pas de couleur : elles prennent <code>color</code>, <code>FFF1F1</code>. Chaque img reçoit une copie blanche collée à sa droite et une collée à sa gauche. La copie droite de l'img 1 et la copie gauche de l'img 2 tombent au même endroit, de x = 172 à 228 : trois rectangles blancs par ligne.</p></div>
<div class="cap" data-t="22.5" data-step="0 5ch#E5969E"><h3>6. La copie rose</h3><p><code>0 5ch#E5969E</code> : 5ch = 40px, la hauteur d'une img. Une copie rose se colle sous chaque img, de y = 60 à 100 et de 240 à 280. Les img elles-mêmes restent invisibles : entre les rectangles blancs, au-dessus des roses, c'est leur fond bleu-vert.</p></div>
<div class="cap" data-t="27" data-step="Résultat" data-live="134 caractères · 100 % identique"><h3>7. Résultat : 134 caractères</h3><p>Quatre boîtes invisibles de 56 × 40, deux par ligne. Le même padding place le contenu de body et donne leur taille aux img, et trois ombres en <code>ch</code>, juste de la taille d'une img, dessinent les zigzags.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="Who gets what"><h3>1. Two levels of <code>*</code></h3><p><code>* *</code> matches every element inside another one: head, body, the four img and style, so all of them but html. The nested <code>*{</code> means <code>* * *</code>: what is inside body, the four img and style. head and style are not displayed. There is no doctype: in quirks mode, a number with no unit is in px. The dashed boxes are html and body; they go below the canvas.</p></div>
<div class="cap" data-t="4.5" data-step="The background"><h3>2. The blue-green background</h3><p><code>background:#2E8DA6</code> goes to body (and to head, the img and style). html has no background, so the browser paints body's background on the whole canvas, and not in body's box. That is the blue-green.</p></div>
<div class="cap" data-t="9" data-step="padding:20 28"><h3>3. One padding, two jobs</h3><p>The same <code>padding:20 28</code> goes to body and to the img. body keeps its default 8px margin, so its content starts at x = 8 + 28 = 36 and y = 8 + 20 = 28, and is 384 − 56 = 328px wide. An img with no source has a 0 × 0 content: with the padding, it is 2 × 28 = 56 wide and 2 × 20 = 40 tall. Its background is blue-green like the canvas, so it is invisible. Without margins, the four sit in a row from x = 36.</p></div>
<div class="cap" data-t="13.5" data-step="The margins"><h3>4. Two img per line</h3><p><code>margin:-8-24 45%80</code>: −8 on top, −24 on the right, 45% at the bottom, 80 on the left. Each img takes 80 + 56 − 24 = 112px of the line: the first starts at 36 + 80 = 116, the second at 116 + 56 − 24 + 80 = 228. A third would need 3 × 112 = 336px, more than 328, so it goes to a new line. The bottom margin is 45% of 328, so 147.6, and Chrome gives 147.594px. Line 1 starts at y = 28 − 8 = 20, line 2 at 20 + 179.594 = 199.594, painted at 200.</p></div>
<div class="cap" data-t="18" data-step="7ch 0,-7ch 0"><h3>5. A copy on each side</h3><p><code>7ch 0,-7ch 0</code>: in my Chrome the font is Times 16px and 1ch is 8px, so 7ch = 56px, the width of an img. The shadows have no color, so they take <code>color</code>, <code>FFF1F1</code>. Each img gets a white copy right against its right side and one right against its left side. Img 1's right copy and img 2's left copy land on the same spot, x = 172 to 228: three white rectangles per row.</p></div>
<div class="cap" data-t="22.5" data-step="0 5ch#E5969E"><h3>6. The pink copy</h3><p><code>0 5ch#E5969E</code>: 5ch = 40px, the height of an img. A pink copy sits right below each img, from y = 60 to 100 and from 240 to 280. The img themselves stay invisible: between the white rectangles, above the pink ones, you see their blue-green background.</p></div>
<div class="cap" data-t="27" data-step="Result" data-live="134 characters · 100% match"><h3>7. Result: 134 characters</h3><p>Four invisible 56 × 40 boxes, two per line. The same padding places body's content and sizes the img, and three shadows in <code>ch</code>, exactly the size of an img, draw the zigzags.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0808 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const lerp = (a, b, k) => a + (b - a) * k;
  const nf = (v, d) => { const s = String(+v.toFixed(d)); return fr ? s.replace('.', ',') : s; };
  const c = fr ? '\u00a0:' : ':';
  const sep = fr ? '\u00a0;' : ',';
  // Measured on the official code in local Chrome (quirks mode, 400 × 300), getBoundingClientRect and computed styles:
  // html (0, 0) 400 × 415.188, no background; body (8, 8) 384 × 399.188, padding 20px 28px, margin 8px;
  // without margins, the img are at (36, 28), (92, 28), (148, 28), (204, 28), all 56 × 40;
  // with the official margins (-8px -24px 147.594px 80px): (116, 20), (228, 20), (116, 199.594), (228, 199.594), all 56 × 40;
  // box-shadow computed as 56px 0, -56px 0, 0 40px (Times 16px: 1ch = 8px). Row 2 is painted at y = 200.
  const FIN = 27;
  const P0 = [[36, 28], [92, 28], [148, 28], [204, 28]];
  const P1 = [[116, 20], [228, 20], [116, 199.594], [228, 199.594]];
  const BL = $('.t0808-blank');
  const I = $$('.t0808-i');
  const SR = $$('.t0808-s[data-k="r"]'), SL = $$('.t0808-s[data-k="l"]'), SP = $$('.t0808-s[data-k="p"]');
  const X = (k) => $$(`.t0808-box[data-x="${k}"]`);
  const G = (k) => $(`.t0808-tag[data-g="${k}"]`);
  const L = (k) => $(`.t0808-l[data-l="${k}"]`);
  const box = (e, x, y, w, h) => Object.assign(e.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px` });
  // painted shapes snap to whole pixels, as Chrome paints row 2 (199.594) at 200
  const pbox = (e, x, y, w, h) => box(e, Math.round(x), Math.round(y), w, h);
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    const ann = 1 - pr(t, [FIN, FIN + 0.6]);
    // 1. html and body
    const tag = win(t, 0.2, 4.4);
    X('h').forEach((e) => (e.style.opacity = tag * 0.9));
    X('b').forEach((e) => (e.style.opacity = tag * 0.9));
    G('h').style.opacity = tag;
    G('b').style.opacity = tag;
    // 2. the canvas turns blue-green
    BL.style.opacity = 1 - pr(t, [5, 6.2]);
    // 3. padding: body's content box, the img grow from 0 × 0 to 56 × 40
    const ki = pr(t, [9.6, 11.4]);
    X('c').forEach((e) => (e.style.opacity = win(t, 9.1, 17.8) * 0.9));
    // 4. margins: from the row at y = 28 to two lines of two
    const km = pr(t, [14.2, 16.4]);
    const mw = win(t, 14.4, 17.8);
    X('m').forEach((e) => (e.style.opacity = mw * 0.9));
    X('g').forEach((e) => (e.style.opacity = mw * 0.9));
    G('g').style.opacity = mw;
    const kr = pr(t, [18.6, 20]), kl = pr(t, [20.2, 21.6]), kp = pr(t, [23.2, 25]);
    const pos = P0.map(([x0, y0], n) => {
      const xg = 36 + n * 56 * ki;
      return t < 13.5 ? [xg, y0] : [lerp(x0, P1[n][0], km), lerp(y0, P1[n][1], km)];
    });
    const w = 56 * ki, h = 40 * ki;
    const jw = Math.max(win(t, 9.1, 17.8), win(t, 18.1, 26.8)) * 0.9;
    pos.forEach(([x, y], n) => {
      const j = X('j')[n];
      box(j, x, y, w, h);
      j.style.opacity = t >= 9.6 ? jw : 0;
      const g = G(String(n));
      Object.assign(g.style, { left: `${x + 22}px`, top: `${y + 12}px`, opacity: t >= 10.4 ? win(t, 10.4, 17.8) : 0 });
      pbox(I[n], x, y, w, h);
      I[n].style.background = teach ? 'var(--t0808-ti)' : 'var(--t0808-tl)';
      I[n].style.opacity = t >= 9.6 && (teach || t < FIN) ? 1 : 0;
      // 5-6. the three shadows: same size as the img, slid out by 7ch, -7ch and 5ch
      pbox(SR[n], x + 56 * kr, y, 56, 40);
      pbox(SL[n], x - 56 * kl, y, 56, 40);
      pbox(SP[n], x, y + 40 * kp, 56, 40);
      SR[n].style.background = teach ? 'var(--t0808-tr)' : 'var(--t0808-wh)';
      SL[n].style.background = teach ? 'var(--t0808-tlf)' : 'var(--t0808-wh)';
      SP[n].style.background = teach ? 'var(--t0808-tp)' : 'var(--t0808-pk)';
      SR[n].style.opacity = t >= 18.6 ? 1 : 0;
      SL[n].style.opacity = t >= 20.2 ? 1 : 0;
      SP[n].style.opacity = t >= 23.2 ? 1 : 0;
    });
    [[4.6, 8.8, 2], [9.1, 13.3, 3], [13.6, 17.8, 4], [18.1, 22.3, 5], [22.6, 26.8, 6]].forEach(([a, z, k]) => (L(k).style.opacity = win(t, a, z) * ann));
    let txt = '';
    if (step === 0) txt = fr ? '* * → 7 éléments · * * * → 5' : '* * → 7 elements · * * * → 5';
    else if (step === 1) txt = fr ? 'canevas\u00a0: #2E8DA6' : 'canvas: #2E8DA6';
    else if (step === 2) txt = `img${c} ${nf(w, 2)} × ${nf(h, 2)}`;
    else if (step === 3) txt = `img 2${c} (${nf(pos[1][0], 3)}${sep} ${nf(pos[1][1], 3)}) · img 3${c} (${nf(pos[2][0], 3)}${sep} ${nf(pos[2][1], 3)})`;
    else if (step === 4) txt = `box-shadow${c} ${nf(56 * kr, 2)}px 0, ${nf(-56 * kl, 2)}px 0`;
    else if (step === 5) txt = `box-shadow${c} 0 ${nf(40 * kp, 2)}px`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
