<figure class="anim t1108" data-duration="22" data-scene="t1108" data-wide="-30 -30 460 360" data-off-label="-26 -26" style="--bg:#fae29e">
<style>
.t1108{--t1108-blue:#469dba;--t1108-teach:#d6457f;--t1108-dash:rgb(20 50 70 / .75)}
.t1108 .t1108-grp > *{position:absolute}
.t1108 .t1108-box{left:0;top:0;width:100%;height:100%;box-sizing:border-box;border:2px dashed var(--t1108-dash);pointer-events:none}
.t1108 .t1108-band{background:var(--t1108-blue);opacity:.45}
.t1108 .t1108-h{background:var(--t1108-blue)}
.t1108 .t1108-ctr{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--t1108-dash);left:170px;top:180px}
.t1108 .zlab{color:#fff;background:rgb(20 50 70 / .85);padding:1px 5px;border-radius:3px}
.t1108 .legend .t1108-mk{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
</style>
<div class="anim-col">
<div class="stage" role="img" aria-label="{% if include.lang == "fr" %}Animation : une bordure haute double de 90px dessine deux barres sur html ; le body, étiré à 240px de haut par ses marges négatives, reçoit la même bordure, puis tourne d'un quart de tour : ses deux barres deviennent verticales{% else %}Animation: a 90px double top border draws two bars on html; the body, stretched to 240px tall by its negative margins, gets the same border, then turns a quarter turn: its two bars become vertical{% endif %}">
<div class="scene">
<div class="t1108-grp t1108-hg" style="left:110px;top:60px;width:120px;height:150px">
<div class="t1108-band"></div>
<div class="t1108-h t1108-h1"></div>
<div class="t1108-h t1108-h2"></div>
<div class="t1108-box"></div>
</div>
<div class="t1108-grp t1108-bg" style="left:110px;top:60px;width:120px;height:240px;transform-origin:60px 120px">
<div class="t1108-h t1108-b1"></div>
<div class="t1108-h t1108-b2"></div>
<div class="t1108-box"></div>
</div>
<div class="t1108-ctr"></div>
<span class="zlab t1108-l-bg" style="left:8px;top:8px">#FAE29E → {% if include.lang == "fr" %}canevas{% else %}canvas{% endif %}</span>
<span class="zlab t1108-l-html" style="left:112px;top:216px">html · 120 × 150</span>
<span class="zlab t1108-l-hgt" style="left:112px;top:240px">300 − 60 − 90 = 150</span>
<span class="zlab t1108-l-q" style="left:238px;top:66px">96q = {% if include.lang == "fr" %}90,71{% else %}90.71{% endif %} → 90px</span>
<span class="zlab t1108-l-thirds" style="left:238px;top:96px">30 / 30 / 30</span>
<span class="zlab t1108-l-body" style="left:236px;top:276px">body · 120 × 240</span>
<span class="zlab t1108-l-neg" style="left:236px;top:160px">60 + 90 + 90 = 240</span>
<span class="zlab t1108-l-same" style="left:112px;top:36px">{% if include.lang == "fr" %}body : même border-top{% else %}body: same border-top{% endif %}</span>
<span class="zlab t1108-l-rot" style="left:178px;top:186px">rotate:90deg</span>
</div>
</div>
<div class="legend"><span><i style="--c:var(--t1108-blue)"></i>{% if include.lang == "fr" %}bordure de html{% else %}html's border{% endif %}</span><span><i style="--c:var(--t1108-teach)"></i>{% if include.lang == "fr" %}bordure du body (bleue en vrai){% else %}body's border (blue in reality){% endif %}</span><span><i class="t1108-mk"></i>{% if include.lang == "fr" %}boîtes de html et du body{% else %}html and body boxes{% endif %}</span></div>
</div>
<div class="anim-side">
<pre class="code" aria-hidden="true">&lt;style>*{<span data-on="2 4">border-top:96q double#469DBA</span>;<span data-on="1">margin:60 170 90 110</span>;*{<span data-on="1" data-tone="2">background:#FAE29E</span>;<span data-on="3" data-tone="2">margin:-90 0</span>;<span data-on="5" data-tone="2">rotate:90deg</span></pre>
<div class="now" aria-live="polite">
<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="html : 120 × 150"><h3>1. html : une boîte de 120 × 150</h3><p><code>*</code> vise <code>html</code> et le <code>body</code>. Sur <code>html</code>, <code>margin:60 170 90 110</code> laisse 400 − 170 − 110 = 120px de large. En mode quirks, <code>html</code> remplit la fenêtre moins ses marges haute et basse : 300 − 60 − 90 = 150px de haut. <code>html</code> n'a pas de fond : le <code>#FAE29E</code> du <code>body</code> part sur tout le canevas.</p></div>
<div class="cap" data-t="3.5" data-step="Une bordure double : deux barres"><h3>2. Une bordure double : deux barres</h3><p><code>96q</code> fait 90,71px, et Chrome arrondit une épaisseur de bordure au pixel inférieur : 90px. Le style <code>double</code> la coupe en trois tiers égaux : trait de 30, vide de 30, trait de 30. Sur <code>html</code>, ce sont les deux barres horizontales, en y = 60 et y = 120.</p></div>
<div class="cap" data-t="7" data-step="body : 240px de haut"><h3>3. body : des marges négatives qui l'étirent</h3><p>Le <code>*{…}</code> imbriqué vise le <code>body</code>. En mode quirks, le <code>body</code> remplit le contenu de <code>html</code> (60px sous la bordure) moins ses propres marges. Avec <code>margin:-90 0</code>, il gagne 90px en haut et 90px en bas : 60 + 90 + 90 = 240px. Il va de y = 60 à y = 300, aussi large que <code>html</code>.</p></div>
<div class="cap" data-t="10.5" data-step="La même bordure sur le body"><h3>4. La même bordure sur le body</h3><p>Le <code>*</code> du dehors vise aussi le <code>body</code> : il a la même bordure haute double. Son haut est en y = 60, comme celui de <code>html</code> : ses deux barres tombent pile sur les deux premières. Pour l'instant, on ne voit rien de neuf.</p></div>
<div class="cap" data-t="14" data-step="rotate:90deg : un quart de tour"><h3>5. rotate:90deg : un quart de tour</h3><p><code>rotate:90deg</code> fait tourner le <code>body</code> autour de son centre, (170 ; 180), dans le sens des aiguilles d'une montre. Son bord haut passe à droite : ses deux barres deviennent verticales, en x = 260 et x = 200, de y = 120 à y = 240. Son fond est parti au canevas, donc la boîte tournée ne cache rien.</p></div>
<div class="cap" data-t="18" data-step="Résultat" data-live="105 caractères · 100 % identique"><h3>6. Résultat : 105 caractères</h3><p>Une seule bordure, écrite une fois, dessine les quatre barres : deux sur <code>html</code>, deux sur le <code>body</code> tourné.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html: 120 × 150"><h3>1. html: a 120 × 150 box</h3><p><code>*</code> matches <code>html</code> and the <code>body</code>. On <code>html</code>, <code>margin:60 170 90 110</code> leaves 400 − 170 − 110 = 120px of width. In quirks mode, <code>html</code> fills the window minus its top and bottom margins: 300 − 60 − 90 = 150px tall. <code>html</code> has no background, so the <code>body</code>'s <code>#FAE29E</code> goes to the whole canvas.</p></div>
<div class="cap" data-t="3.5" data-step="A double border: two bars"><h3>2. A double border: two bars</h3><p><code>96q</code> is 90.71px, and Chrome rounds a border width down to a whole pixel: 90px. The <code>double</code> style cuts it into three equal thirds: a 30px line, a 30px gap, a 30px line. On <code>html</code>, those are the two horizontal bars, at y = 60 and y = 120.</p></div>
<div class="cap" data-t="7" data-step="body: 240px tall"><h3>3. body: negative margins stretch it</h3><p>The nested <code>*{…}</code> matches the <code>body</code>. In quirks mode, the <code>body</code> fills <code>html</code>'s content (60px under the border) minus its own margins. With <code>margin:-90 0</code>, it gains 90px at the top and 90px at the bottom: 60 + 90 + 90 = 240px. It runs from y = 60 to y = 300, as wide as <code>html</code>.</p></div>
<div class="cap" data-t="10.5" data-step="Same border on the body"><h3>4. The same border on the body</h3><p>The outer <code>*</code> matches the <code>body</code> too: it gets the same double top border. Its top is at y = 60, like <code>html</code>'s, so its two bars land exactly on the first two. Nothing new shows yet.</p></div>
<div class="cap" data-t="14" data-step="rotate:90deg: a quarter turn"><h3>5. rotate:90deg: a quarter turn</h3><p><code>rotate:90deg</code> turns the <code>body</code> clockwise around its centre, (170, 180). Its top edge goes to the right: its two bars become vertical, at x = 260 and x = 200, from y = 120 to y = 240. Its background went to the canvas, so the turned box hides nothing.</p></div>
<div class="cap" data-t="18" data-step="Result" data-live="105 characters · 100% match"><h3>6. Result: 105 characters</h3><p>One border, written once, draws all four bars: two on <code>html</code>, two on the turned <code>body</code>.</p></div>
{%- endif %}
</div>
<div class="live"></div>
</div>
</div>
<script>
(window.AnimScenes = window.AnimScenes || {}).t1108 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const HG = $('.t1108-hg'), BG = $('.t1108-bg'), CTR = $('.t1108-ctr'), live = $('.live');
  const L = (k) => $(`.t1108-l-${k}`);
  const W = { html: [0.3, 1.5], band: [3.7, 5.2], cut: [5.4, 6.4], body: [7.2, 9.4], bsh: [10.7, 12.2], rot: [14.2, 16.6], fin: [18.1, 18.9] };
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const lerp = (a, b, m) => a + (b - a) * m;
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const f1 = (v) => { const s = (Math.round(v * 10) / 10).toFixed(1).replace(/\.0$/, ''); return (fr ? s.replace('.', ',') : s).replace('-', '−'); };
  const c = fr ? ' :' : ':';
  const place = (el, x, y, w, h) => Object.assign(el.style, { left: `${x}px`, top: `${y}px`, width: `${Math.max(0, w)}px`, height: `${Math.max(0, h)}px` });
  place($('.t1108-b1'), 0, 0, 120, 30);
  place($('.t1108-b2'), 0, 60, 120, 30);
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const real = !teach || t >= W.fin[0];
    const guides = t < W.fin[0] ? 1 : 0;
    // 1. html box
    HG.querySelector('.t1108-box').style.opacity = pr(t, W.html) * guides;
    L('bg').style.opacity = win(t, 0.3, 3.2);
    L('html').style.opacity = win(t, W.html[0], W.body[0]);
    L('hgt').style.opacity = win(t, W.html[0], W.band[0]);
    // 2. a 90px band grows, then its middle third goes away
    const g = 90 * pr(t, W.band), cut = pr(t, W.cut);
    const band = $('.t1108-band');
    place(band, 0, 0, 120, g);
    band.style.opacity = t >= W.band[0] ? 0.45 * (1 - cut) : 0;
    const bars = t >= W.cut[0] ? 1 : 0;
    place($('.t1108-h1'), 0, 0, 120, 30);
    place($('.t1108-h2'), 0, 60, 120, 30);
    $('.t1108-h1').style.opacity = $('.t1108-h2').style.opacity = bars ? Math.max(0.45, cut) : 0;
    L('q').style.opacity = win(t, W.band[0], W.body[0]);
    L('thirds').style.opacity = win(t, W.cut[0], W.body[0]);
    // 3. body: from html's content box (y 150, 60 tall) to y 60, 240 tall
    const m = pr(t, W.body);
    const by = lerp(150, 60, m), bh = lerp(60, 240, m);
    BG.style.top = `${by}px`;
    BG.style.height = `${bh}px`;
    BG.querySelector('.t1108-box').style.opacity = (t >= W.body[0] ? 1 : 0) * guides;
    L('body').style.opacity = win(t, W.body[0], W.rot[0]);
    L('neg').style.opacity = win(t, W.body[0], W.bsh[0]);
    // 4. the same border on the body, on top of html's bars
    const bs = pr(t, W.bsh);
    $$('.t1108-b1, .t1108-b2').forEach((e) => { e.style.opacity = bs; e.style.background = real ? 'var(--t1108-blue)' : 'var(--t1108-teach)'; });
    L('same').style.opacity = win(t, W.bsh[0], W.rot[0]);
    // 5. quarter turn around (170, 180)
    const rot = 90 * pr(t, W.rot);
    BG.style.transform = `rotate(${rot}deg)`;
    CTR.style.opacity = win(t, W.rot[0] - 0.3, W.fin[0]);
    L('rot').style.opacity = win(t, W.rot[0] - 0.3, W.fin[0]);
    let txt = '';
    if (step === 0) txt = `html${c} x 110 → 230, y 60 → 210`;
    else if (step === 1) txt = `border-top${c} ${f1(g)}px · 30 / 30 / 30`;
    else if (step === 2) txt = `body${c} x 110 → 230, y ${f1(by)} → ${f1(by + bh)}`;
    else if (step === 3) txt = `${fr ? 'barres du body' : "body's bars"}${c} y 60 → 90, 120 → 150`;
    else if (step === 4) txt = `${fr ? 'quart de tour' : 'quarter turn'}${c} ${Math.round(rot)}°`;
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
</figure>
