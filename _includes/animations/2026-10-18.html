<figure class="anim t1018" data-duration="25" data-scene="t1018" data-wide="-50 -40 500 380" style="--bg:#2d3464">
<style>
.t1018{--sky:#c0d6e7;--navy:#2d3464;--red:#d95362;--gold:#f2b134;--hd:#8fd694;--g:radial-gradient(1Q at 50% 100px,var(--sky),79Q,var(--navy))}

<div class="anim-side">
<pre class="code" aria-hidden="true"><span data-on="3 5">&lt;p>&lt;p></span>&lt;style>*{<span data-on="1 3">background:radial-gradient(1Q at 50%25vw,#c0d6e7,79Q,#2d3464)</span><span data-on="4">0 63Q</span>}&amp;>*{<span data-on="2" data-tone="2">background:#d95362;border-radius:32Q;margin:50 70</span>;<span data-on="3 5">p{height:85;margin:30</span>;<span data-on="6">+p{scale:-1</span></pre>
<div class="now">
<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="Un dégradé pour tout le monde"><h3>1. Un dégradé pour tout le monde</h3><p><code>*</code> donne le même fond à tous les éléments. Sur <code>html</code> : un cercle centré à 25vw (100px) du haut, décalé ensuite de 63Q. <code>79Q</code> est un repère de transition placé après la fin d'un dégradé de 1Q : le dernier arrêt est repoussé à 79Q, et le bord du disque (74,6px de rayon) devient net.</p></div>
<div class="cap" data-t="3.6" data-step="body : le bloc rouge"><h3>2. body : le bloc rouge</h3><p><code>&amp;>*</code> vise les enfants de <code>html</code>. Seul <code>body</code> se voit : fond rouge, coins de 32Q (30px), <code>margin:50 70</code>. En mode quirks il prend toute la hauteur moins ses marges : 260×200. Il cache le disque de <code>html</code>.</p></div>
<div class="cap" data-t="7.3" data-step="Le premier p : une fenêtre"><h3>3. Le premier p : une fenêtre</h3><p>Le premier <code>p</code> fait 200×85, à 30px des côtés du <code>body</code>. En haut, sa marge de 30px se fond dans celle du <code>body</code> : il touche son bord. Il reçoit lui aussi le dégradé, à sa taille : le centre du cercle est à 100px du haut, sous la boîte de 85px. Seul le haut du cercle y entre.</p></div>
<div class="cap" data-t="10.9" data-step="0 63Q : la coupe nette"><h3>4. 0 63Q : la coupe nette</h3><p><code>0 63Q</code> fait descendre le fond de 59,5px. Il se répète, donc une copie arrive par le haut avec son propre cercle, et le bord de cette tuile coupe la calotte à plat, à y=109,5. Les tuiles débordent du <code>p</code>, mais seul ce qui est dans sa boîte est peint.</p></div>
<div class="cap" data-t="15" data-step="Le second p"><h3>5. Le second p</h3><p>Le second <code>p</code> est identique, 30px plus bas (les marges de 30px se fondent entre les deux). Entre eux, le rouge du <code>body</code> reste visible : c'est la barre.</p></div>
<div class="cap" data-t="18.2" data-step="scale:-1 : retourné"><h3>6. scale:-1 : retourné</h3><p><code>+p{scale:-1}</code> retourne le second <code>p</code> dans les deux sens, comme un demi-tour. Sa calotte passe en bas, bord plat vers la barre.</p></div>
<div class="cap" data-t="21.8" data-step="Au pixel près" data-live="169 caractères · 100 % identique"><h3>7. Au pixel près</h3><p>Un dégradé, deux fenêtres, une seule retournée : l'image exacte en 169 caractères.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="One gradient for everyone"><h3>1. One gradient for everyone</h3><p><code>*</code> gives every element the same background. On <code>html</code>: a circle centered 25vw (100px) from the top, then shifted by 63Q. <code>79Q</code> is a color hint placed past the end of a 1Q gradient: the last stop gets pushed to 79Q, and the disc edge (74.6px radius) turns sharp.</p></div>
<div class="cap" data-t="3.6" data-step="body: the red block"><h3>2. body: the red block</h3><p><code>&amp;>*</code> matches <code>html</code>'s children. Only <code>body</code> shows: red background, 32Q (30px) corners, <code>margin:50 70</code>. In quirks mode it takes the full height minus its margins: 260×200. It hides <code>html</code>'s disc.</p></div>
<div class="cap" data-t="7.3" data-step="The first p: a window"><h3>3. The first p: a window</h3><p>The first <code>p</code> is 200×85, 30px in from the <code>body</code>'s sides. At the top, its 30px margin merges with the <code>body</code>'s, so it sits flush with its edge. It gets the gradient too, at its own size: the circle's center is 100px from the top, below the 85px box. Only the top of the circle fits.</p></div>
<div class="cap" data-t="10.9" data-step="0 63Q: the flat cut"><h3>4. 0 63Q: the flat cut</h3><p><code>0 63Q</code> moves the background 59.5px down. It repeats, so a copy comes in from above with its own circle, and that tile's edge cuts the cap flat, at y=109.5. The tiles stick out of the <code>p</code>, but only what is inside its box gets painted.</p></div>
<div class="cap" data-t="15" data-step="The second p"><h3>5. The second p</h3><p>The second <code>p</code> is the same, 30px lower (the two 30px margins collapse into one). Between them, the red <code>body</code> shows through: that is the bar.</p></div>
<div class="cap" data-t="18.2" data-step="scale:-1: flipped"><h3>6. scale:-1: flipped</h3><p><code>+p{scale:-1}</code> flips the second <code>p</code> both ways, like a half turn. Its cap moves to the bottom, flat side toward the bar.</p></div>
<div class="cap" data-t="21.8" data-step="Pixel-perfect" data-live="169 characters · 100% match"><h3>7. Pixel-perfect</h3><p>One gradient, two windows, one of them flipped: a pixel-perfect match in 169 characters.</p></div>
{%- endif %}

<script>
(window.AnimScenes = window.AnimScenes || {}).t1018 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const html = $('.t1018-html'), hd = $('.t1018-hd'), body = $('.t1018-body'), gh = $('.t1018-gh'), p1 = $('.t1018-p1'), p2 = $('.t1018-p2'), live = $('.live');
  const lab = [1, 2, 3, 4, 5, 6].map((i) => $('.t1018-l' + i));
  const tiles = (el) => [el.querySelector('.t1018-tb'), el.querySelector('.t1018-ta')];
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const n = (v) => (+v.toFixed(1)).toString().replace('.', fr ? ',' : '.');
  const c = fr ? ' :' : ':';
  const S = 63 * 96 / 101.6;
  const L = fr
    ? { d: 'disque', ctr: 'centre', r: 'rayon', cap: 'calotte', cut: 'coupe', bar: 'barre', rot: 'demi-tour', end: '169 caractères · 100 % identique' }
    : { d: 'disc', ctr: 'center', r: 'radius', cap: 'cap', cut: 'cut', bar: 'bar', rot: 'half turn', end: '169 characters · 100% match' };
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && step < 6;
    const sh = step < 3 ? 0 : S * pr(t, 11.4, 13.6);
    const set = (el, on) => {
      el.style.background = teach ? 'var(--navy)' : `var(--g) 0 ${sh}px`;
      const [tb, ta] = tiles(el);
      ta.style.top = `${sh}px`;
      tb.style.top = `${sh - 85}px`;
      ta.style.opacity = tb.style.opacity = teach ? 1 : 0;
      el.style.opacity = on;
    };
    html.style.opacity = pr(t, 0.2, 1.2);
    body.style.opacity = pr(t, 3.9, 4.9);
    hd.style.opacity = teach && step === 1 ? pr(t, 4.4, 5.2) : 0;
    set(p1, pr(t, 7.6, 8.6));
    set(p2, pr(t, 15.3, 16.3));
    gh.style.opacity = teach && step === 3 ? pr(t, 11, 11.4) : 0;
    const [gb, ga] = tiles(gh);
    ga.style.top = `${sh}px`;
    gb.style.top = `${sh - 85}px`;
    const turn = pr(t, 18.7, 20.9);
    p2.style.rotate = turn < 1 ? `${180 * turn}deg` : '0deg';
    p2.style.scale = turn < 1 ? '1' : '-1';
    const show = [step === 0, step === 1, step === 2, step === 3, step === 4, step === 5];
    lab.forEach((l, i) => { l.style.opacity = show[i] ? 1 : 0; });
    let txt = '';
    if (step === 0) txt = `${L.d}${c} ${L.ctr} (200, 159.5) · ${L.r} 79Q = 74.6 px`;
    else if (step === 1) txt = `body${c} x 70 → 330, y 50 → 250 · 260 × 200`;
    else if (step === 2) txt = `p${c} x 100 → 300, y 50 → 135 · ${L.ctr} y 150 · ${L.cap} y 75.4 → 135`;
    else if (step === 3) txt = `background-position${c} 0 ${n(sh)} px · ${L.cut} y ${n(50 + sh)}`;
    else if (step === 4) txt = `p + p${c} y 165 → 250 · ${L.bar} y 135 → 165`;
    else if (step === 5) txt = `${L.rot}${c} ${Math.round(180 * turn)}° · scale:-1 = 180°`;
    else txt = L.end;
    live.textContent = fr ? txt.replace(/(\d)\.(\d)/g, '$1,$2') : txt;
  };
};
</script>
