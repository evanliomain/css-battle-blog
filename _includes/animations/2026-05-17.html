{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="Éléments"><h3>1. html, body, hr</h3><p><code>&lt;hr size=42></code> vient en premier. Un hr ne peut pas aller dans head : il ouvre body, et le <code>&lt;style></code> qui le suit va aussi dans body. Au premier niveau, <code>&amp;</code> désigne html. Son <code>*</code> vise head, body, hr et style ; le <code>*</code> intérieur vise hr et style. head et style ne s'affichent pas : il reste trois boîtes.</p></div>
<div class="cap" data-t="4.5" data-step="Cadre"><h3>2. Un canevas gris, un cadre violet</h3><p><code>#0001</code> est du noir à 0,067 d'opacité. Le fond de html peint tout le canevas : #eeeeee sur blanc. <code>5vw</code> vaut 5 % de 400, soit 20px : un cadre en <code>#217B</code>, du #221177 à 0,733 d'opacité, #594c97 sur le gris dans mon Chrome. La boîte de contenu de html fait 360 × 260.</p></div>
<div class="cap" data-t="9" data-step="body"><h3>3. body : 500 × 760, six gros points</h3><p><code>margin:-250-70</code> : -250 en haut et en bas, -70 sur les côtés. body fait 360 + 140 = 500 de large, et en mode quirks il remplit la hauteur de html : 260 + 500 = 760. Il est en (-50, -230). <code>45vw</code> vaut 180px : les points sont des disques de 180px de diamètre, un par coin et un au milieu de chaque grand côté.</p></div>
<div class="cap" data-t="15" data-step="hr"><h3>4. hr : 740 × 400, six de plus</h3><p>Le <code>*</code> intérieur donne à hr <code>margin:0-300</code>. <code>size=42</code> lui donne 40px de haut dans mon Chrome. 140 + 600 = 740 de large, 40 + 360 = 400 de haut, en (-170, -50). Mêmes points de 180px : un par coin et un au milieu du haut et du bas, en x = 200.</p></div>
<div class="cap" data-t="21" data-step="Clip de body"><h3>5. Le clip-path de body</h3><p><code>inset(5lh)</code> garde ce qui est à 90px ou plus à l'intérieur des bords de la boîte : 1lh vaut 18px dans mon Chrome. Sur body, il reste x = 40 à 360. Les points des côtés sont centrés sur 40 et 360 : il en reste la moitié. Le clip vaut aussi pour hr, qui est dans body : ses points des coins, centrés sur -80 et 480, disparaissent.</p></div>
<div class="cap" data-t="26" data-step="Clip de hr"><h3>6. Le clip-path de hr</h3><p>Sur hr, les mêmes 90px gardent y = 40 à 260. Les points du milieu sont centrés sur 40 et 260 : il reste leurs moitiés intérieures, les demi-disques du haut et du bas.</p></div>
<div class="cap" data-t="31" data-step="Résultat" data-live="135 caractères · 100 % identique"><h3>7. Résultat : 135 caractères</h3><p>Quatre demi-disques dans un cadre. Sur douze points de 180px, quatre se voient, chacun coupé en deux par un clip-path. Les autres sont hors du canevas ou coupés.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="Elements"><h3>1. html, body, hr</h3><p><code>&lt;hr size=42></code> comes first. An hr cannot go in head: it opens body, and the <code>&lt;style></code> after it goes into body too. At the top level, <code>&amp;</code> is html. Its <code>*</code> matches head, body, hr and style; the inner <code>*</code> matches hr and style. head and style are not displayed: three boxes are left.</p></div>
<div class="cap" data-t="4.5" data-step="Frame"><h3>2. A gray canvas, a purple frame</h3><p><code>#0001</code> is black at 0.067 opacity. html's background paints the whole canvas: #eeeeee on white. <code>5vw</code> is 5% of 400, 20px: a frame in <code>#217B</code>, #221177 at 0.733 opacity, #594c97 on the gray in my Chrome. html's content box is 360 × 260.</p></div>
<div class="cap" data-t="9" data-step="body"><h3>3. body: 500 × 760, six big dots</h3><p><code>margin:-250-70</code>: -250 at the top and bottom, -70 on the sides. body is 360 + 140 = 500 wide, and in quirks mode it fills html's height: 260 + 500 = 760. It sits at (-50, -230). <code>45vw</code> is 180px: the dots are discs 180px across, one per corner and one in the middle of each long side.</p></div>
<div class="cap" data-t="15" data-step="hr"><h3>4. hr: 740 × 400, six more</h3><p>The inner <code>*</code> gives hr <code>margin:0-300</code>. <code>size=42</code> makes it 40px tall in my Chrome. 140 + 600 = 740 wide, 40 + 360 = 400 tall, at (-170, -50). The same 180px dots: one per corner and one in the middle of the top and bottom, at x = 200.</p></div>
<div class="cap" data-t="21" data-step="body's clip"><h3>5. body's clip-path</h3><p><code>inset(5lh)</code> keeps what is 90px or more inside the box edges: 1lh is 18px in my Chrome. On body, x = 40 to 360 is left. The side dots are centered on 40 and 360: half of each is left. The clip also applies to hr, inside body: its corner dots, centered on -80 and 480, are gone.</p></div>
<div class="cap" data-t="26" data-step="hr's clip"><h3>6. hr's clip-path</h3><p>On hr, the same 90px keeps y = 40 to 260. The middle dots are centered on 40 and 260: their inner halves are left, the top and bottom half discs.</p></div>
<div class="cap" data-t="31" data-step="Result" data-live="135 characters · 100% match"><h3>7. Result: 135 characters</h3><p>Four half discs in a frame. Of twelve 180px dots, four show, each cut in half by a clip-path. The others are off the canvas or clipped away.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0517 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.5), 1 - pr(t, b - 0.3, b));
  const c = fr ? ' :' : ':';
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  // Measured on the official code in local Chrome 157 (400 × 300 iframe, quirks mode, getBoundingClientRect, getComputedStyle, variant renders).
  // html 0, 0, 400 × 300, border 20px (#217B), background #0001 (canvas #eeeeee). 1lh = 18px, so inset(5lh) = 90px.
  // body -50, -230, 500 × 760, border 180px dotted #438D, content 130, -50, 140 × 400. Dots (centers): (40|360, -140|150|440).
  // hr -170, -50, 740 × 400 (height 40px from size=42), content 10, 130, 380 × 40. Dots: (-80|200|480, 40|260).
  // Clips: body x 40..360, y -140..440 (also clips hr); hr x -80..480, y 40..260.
  const bg = $('.t0517-bg'), frame = $('.t0517-frame'), body = $('.t0517-body'), hr = $('.t0517-hr');
  const bd = $$('.t0517-bd'), hd = $$('.t0517-hd');
  const xhtml = $('.t0517-xhtml'), xbody = $('.t0517-xbody'), xbodyc = $('.t0517-xbodyc'), xhr = $('.t0517-xhr'), xhrc = $('.t0517-xhrc');
  const cbody = $('.t0517-cbody'), chr = $('.t0517-chr');
  const labs = $$('.zlab');
  const ivs = [[0.3, 4.3], [4.8, 8.8], [9.3, 14.8], [15.3, 20.8], [21.3, 25.8], [26.3, 30.8]];
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const wide = fig.dataset.view !== 'canvas';
    const tw = teach ? 1 - pr(t, 31.2, 32.2) : 0;
    // step 2: the canvas turns gray, the frame appears
    bg.style.opacity = pr(t, 5, 6.2);
    frame.style.opacity = pr(t, 6.4, 7.4);
    frame.style.borderColor = mix(tw, 'var(--t0517-hb)', 'var(--t0517-frame)');
    xhtml.style.opacity = win(t, 0.3, 8.8);
    // step 3: body's box, then its six dots grow from their centers
    xbody.style.opacity = win(t, 9.3, 14.8);
    xbodyc.style.opacity = 0.8 * win(t, 9.3, 14.8);
    const sb = pr(t, 10.8, 12.3);
    const BD = mix(tw, 'var(--t0517-bd)', 'var(--t0517-dot)');
    bd.forEach((e) => { e.style.opacity = t < 10.75 ? 0 : 1; e.style.transform = `scale(${sb})`; e.style.background = BD; });
    // step 4: hr's box and dots
    xhr.style.opacity = win(t, 15.3, 20.8);
    xhrc.style.opacity = 0.8 * win(t, 15.3, 20.8);
    const sh = pr(t, 16.8, 18.3);
    const HD = mix(tw, 'var(--t0517-hd)', 'var(--t0517-dot)');
    hd.forEach((e) => { e.style.opacity = t < 16.75 ? 0 : 1; e.style.transform = `scale(${sh})`; e.style.background = HD; });
    // steps 5 and 6: the two clip-paths close in to 90px
    cbody.style.opacity = win(t, 21.3, 25.8);
    const kb = pr(t, 22.3, 24);
    body.style.clipPath = `inset(${90 * kb}px ${210 * kb - 120}px)`; // from -120px on the sides: hr's box reaches 120px past body's
    chr.style.opacity = win(t, 26.3, 30.8);
    hr.style.clipPath = `inset(${90 * pr(t, 27.3, 29)}px)`;
    labs.forEach((l) => {
      l.style.opacity = win(t, ...ivs[+l.dataset.l - 1]);
      l.style.left = wide ? '-182px' : '4px';
      l.style.top = wide ? '-292px' : '3px';
    });
    let txt;
    if (step === 0) txt = '& → html · & * → head, body, hr, style · & * * → hr, style';
    else if (step === 1) txt = fr ? '#0001 sur blanc → #eeeeee · 5vw = 20px' : '#0001 on white → #eeeeee · 5vw = 20px';
    else if (step === 2) txt = `body${c} 360 + 2 × 70 = 500 · 260 + 2 × 250 = 760 · 45vw = 180px`;
    else if (step === 3) txt = `hr${c} 140 + 2 × 300 = 740 · 40 + 2 × 180 = 400`;
    else if (step === 4) txt = fr ? '5lh = 5 × 18 = 90px · body : x de 40 à 360' : '5lh = 5 × 18 = 90px · body: x from 40 to 360';
    else if (step === 5) txt = fr ? 'hr : y de 40 à 260' : 'hr: y from 40 to 260';
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
