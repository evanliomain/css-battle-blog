<div class="cap" data-t="0" data-step="La boîte de html"><h3>1. html : 110 × 110, hors du bord</h3><p><code>&amp;</code> seul, hors de toute règle, vise la racine : html. Pas de doctype : mode quirks, les marges sans unité sont des px. La marge droite est négative : html va de x = 350 à 400 + 60 = 460, soit 110px de large, dont 60 hors du canevas. En mode quirks, html prend la hauteur de la fenêtre moins ses marges : 300 − 95 − 95 = 110, de y = 95 à 205. Le fond de la racine se peint sur tout le canevas : tout est vert.</p></div>
<div class="cap" data-t="5" data-step="L'étalement"><h3>2. Une ombre étalée de 101q</h3><p><code>color:17405B</code> n'a pas de dièse, et le mode quirks l'accepte quand même. Les six ombres n'ont pas de couleur : elles prennent ce bleu nuit. <code>0 0 0 101q</code> n'a pas de décalage, mais s'étale de 101q, soit 95,43px, de chaque côté. Elle couvre tout le côté droit du canevas, de haut en bas. Une ombre ne se peint jamais sous sa propre boîte : dans la boîte de html, le vert du canevas reste visible. C'est le bloc vert à droite.</p></div>
<div class="cap" data-t="10" data-step="-116q 0"><h3>3. Une copie à gauche</h3><p>Une ombre est une copie de la boîte, 110 × 110, décalée. <code>-116q 0</code> la décale de 109,61px vers la gauche, de x = 240 à 350. Elle prolonge le bleu nuit vers la gauche sur la rangée du milieu. La cible y place un bord en x = 240.</p></div>
<div class="cap" data-t="15" data-step="-25vw -1in"><h3>4. Une copie en haut</h3><p><code>-25vw -1in</code> décale la boîte de 100px vers la gauche et de 96px vers le haut : de x = 250 à 360, de y = −1 à 109. En haut du canevas, le bleu nuit commence donc en x = 250. Le haut de la copie dépasse un peu du canevas, et ça ne change rien.</p></div>
<div class="cap" data-t="20" data-step="Deux copies"><h3>5. Deux copies, en haut et en bas</h3><p><code>-217q -69q</code> et <code>-217q 69q</code> décalent la boîte de 205,04px vers la gauche, et de 65,20px vers le haut ou vers le bas. La cible place ces deux blocs de x = 145 à 255, et de y = 30 à 140 et de 160 à 270. Entre les deux, une bande de 20px reste verte.</p></div>
<div class="cap" data-t="25" data-step="-75vw 0"><h3>6. La dernière copie, à gauche</h3><p><code>-75vw 0</code> décale la boîte de 300px vers la gauche : de x = 50 à 160. Elle ferme le bout gauche de la bande verte. Il reste une barre verte de x = 160 à 240, de y = 140 à 160 : rien ne la peint, c'est le canevas entre les copies.</p></div>
<div class="cap" data-t="30" data-step="Résultat" data-live="130 caractères · 100 % identique"><h3>7. Résultat : 130 caractères</h3><p>Une seule boîte, qui dépasse du canevas. Son fond peint tout le canevas, six ombres bleu nuit font les marches, et les deux blocs verts sont le canevas qui reste visible.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html's box"><h3>1. html: 110 × 110, past the edge</h3><p><code>&amp;</code> alone, outside any rule, matches the root: html. No doctype: quirks mode, unitless margins are px. The right margin is negative: html runs from x = 350 to 400 + 60 = 460, 110px wide, 60 of them off the canvas. In quirks mode, html takes the viewport's height minus its margins: 300 − 95 − 95 = 110, from y = 95 to 205. The root's background is painted on the whole canvas: everything is green.</p></div>
<div class="cap" data-t="5" data-step="The spread"><h3>2. A shadow spread by 101q</h3><p><code>color:17405B</code> has no hash, and quirks mode takes it anyway. The six shadows have no color: they take that navy. <code>0 0 0 101q</code> has no offset, but a 101q spread, 95.43px on every side. It covers the whole right side of the canvas, top to bottom. A shadow is never painted under its own box: in html's box, the green canvas stays visible. That is the green block on the right.</p></div>
<div class="cap" data-t="10" data-step="-116q 0"><h3>3. A copy on the left</h3><p>A shadow is a copy of the box, 110 × 110, moved. <code>-116q 0</code> moves it 109.61px to the left, from x = 240 to 350. It takes the navy further left on the middle row. The target puts an edge at x = 240 there.</p></div>
<div class="cap" data-t="15" data-step="-25vw -1in"><h3>4. A copy at the top</h3><p><code>-25vw -1in</code> moves the box 100px to the left and 96px up: from x = 250 to 360, from y = −1 to 109. At the top of the canvas, the navy now starts at x = 250. The top of the copy runs a little off the canvas, and that changes nothing.</p></div>
<div class="cap" data-t="20" data-step="Two copies"><h3>5. Two copies, up and down</h3><p><code>-217q -69q</code> and <code>-217q 69q</code> move the box 205.04px to the left, and 65.20px up or down. The target puts these two blocks from x = 145 to 255, and from y = 30 to 140 and 160 to 270. Between them, a 20px band stays green.</p></div>
<div class="cap" data-t="25" data-step="-75vw 0"><h3>6. The last copy, on the left</h3><p><code>-75vw 0</code> moves the box 300px to the left: from x = 50 to 160. It closes the left end of the green band. A green bar is left from x = 160 to 240, from y = 140 to 160: nothing paints it, it is the canvas between the copies.</p></div>
<div class="cap" data-t="30" data-step="Result" data-live="130 characters · 100% match"><h3>7. Result: 130 characters</h3><p>One box, hanging off the canvas. Its background paints the whole canvas, six navy shadows make the steps, and the two green blocks are the canvas left visible.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0415 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.5), 1 - pr(t, b - 0.3, b));
  const n = (s) => (fr ? s.replace(/(\d)\.(\d)/g, '$1,$2') : s);
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  // Measured on the official code in local Chrome 157 (400 × 300 iframe, quirks mode, no scrollbars, getBoundingClientRect, getComputedStyle):
  // html 350, 95, 110 × 110, margin 95px -60px 95px 350px, background rgb(47, 170, 139) on the whole canvas, color rgb(23, 64, 91);
  // shadows: spread 95.4331px / -109.606px 0 / -100px -96px / -205.039px -65.1969px / -205.039px 65.1969px / -300px 0.
  // The target puts the edges on whole pixels (x = 50, 145, 160, 240, 250, 255; y = 30, 95, 140, 160, 205, 270): the animation draws them there.
  // The -217q copies are drawn 1px wider, under the spread, so that no seam shows at x = 255.
  const N = '#17405b';
  const sp = $('.t0415-spread'), box = $('.t0415-box');
  const sh = { 2: $('.t0415-s2'), 3: $('.t0415-s3'), 4: $('.t0415-s4'), 5: $('.t0415-s5'), 6: $('.t0415-s6') };
  // offsets in the animation (target positions), teaching color, start time
  const S = { 2: [-110, 0, 's2', 10.5], 3: [-100, -96, 's3', 15.5], 4: [-205, -65, 's45', 20.5], 5: [-205, 65, 's45', 20.5], 6: [-300, 0, 's6', 25.5] };
  const ol = (k) => $('.t0415-o' + k);
  const labs = $$('.zlab');
  const ivs = { 1: [0.3, 4.8], 2: [5.3, 9.8], 3: [10.3, 14.8], 4: [15.3, 19.8], 5: [20.3, 24.8], 6: [25.3, 29.8] };
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const tw = teach ? 1 - pr(t, 30.2, 31.2) : 0;
    const col = (k) => mix(tw, `var(--t0415-${k})`, N);
    ol('box').style.opacity = Math.max(win(t, 0.3, 4.8), win(t, 7.5, 9.8));
    // the spread grows around html's box; the box stays a hole
    const s = 95 * pr(t, 5.5, 7.5);
    sp.style.left = 350 - s + 'px';
    sp.style.top = 95 - s + 'px';
    sp.style.width = sp.style.height = 110 + 2 * s + 'px';
    sp.style.background = col('spread');
    sp.style.opacity = t >= 5.5 ? 1 : 0;
    ol('sp').style.opacity = win(t, 7.5, 9.8);
    // the five copies slide out from under the box
    for (const k of [2, 3, 4, 5, 6]) {
      const [dx, dy, c, a] = S[k];
      const p = pr(t, a, a + 1.5);
      const e = sh[k];
      e.style.left = 350 + dx * p + 'px';
      e.style.top = 95 + dy * p + 'px';
      e.style.background = col(c);
      e.style.opacity = t >= a ? 1 : 0;
      ol(k).style.opacity = win(t, a + 1.5, a + 4.3);
    }
    ol('bar').style.opacity = win(t, 27, 29.8);
    labs.forEach((l) => { const iv = ivs[l.dataset.l]; l.style.opacity = iv ? win(t, ...iv) : 0; });
    let txt;
    if (step === 0) txt = `400 − 350 + 60 = 110 · 300 − 95 − 95 = 110`;
    else if (step === 1) txt = n(`101q = 25.25mm = 95.43px · 350 − 95.43 = 254.57`);
    else if (step === 2) txt = n(`116q = 29mm = 109.61px · 350 − 109.61 = 240.39`);
    else if (step === 3) txt = `25vw = 0.25 × 400 = 100px · 1in = 96px · 95 − 96 = −1`;
    else if (step === 4) txt = n(`217q = 205.04px · 69q = 65.20px · 95 − 65.20 = 29.80`);
    else if (step === 5) txt = `75vw = 0.75 × 400 = 300px · 350 − 300 = 50`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = n(txt);
  };
};
</script>
