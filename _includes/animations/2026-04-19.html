<div class="cap" data-t="12" data-step="Le U"><h3>3. Le deuxième p : un U</h3><p><code>+p</code> vaut <code>&amp;+p</code> : un p juste après un p, donc le 2e p de body et le 2e p du dl. Il est plus précis que <code>p</code>, ses valeurs gagnent. Des bordures 30 30 30 0 autour d'un contenu de 160 × 40 : 190 × 100 en x = 130, ouvert à gauche. Le rayon de 9in est réduit à 50px : un demi-disque, avec une courbe intérieure de 20px. La marge du bas de −30 du carré le remonte en y = 65, sur le carré.</p></div>
