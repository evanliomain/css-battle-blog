<div class="now" aria-live="polite">
<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="Qui reçoit quoi"><h3>1. Trois sélecteurs</h3><p><code>*</code> vise tous les éléments : html, head, body et style. Le <code>*{</code> imbriqué veut dire <code>* *</code> : tout élément placé dans un autre, donc head, body et style. Hors de toute règle, <code>&amp;</code> vise la racine, html. head et style ne s'affichent pas : seuls html et body comptent. Pas de doctype : en mode quirks, un nombre sans unité est en px.</p></div>
<div class="cap" data-t="4.5" data-step="Le fond"><h3>2. Un canevas fuchsia</h3><p><code>background:#A82973</code> ne va qu'à html. Le navigateur peint le fond de l'élément racine sur tout le canevas, et pas seulement dans sa boîte. Tout le canevas est fuchsia, alors que html n'est qu'une boîte de 292 × 60.</p></div>
<div class="cap" data-t="9" data-step="La bordure de html"><h3>3. html : quatre tirets</h3><p><code>margin:30%54</code> : une marge en pourcentage est une part de la largeur, ici 30 % de 400 = 120 en haut et en bas, et 54 sur les côtés. html fait 400 − 2 × 54 = 292px de large. <code>border:28q dashed</code> : 1q vaut un quart de millimètre, donc 28q = 26,457px, et Chrome prend 26px. Dans mon Chrome, chaque tiret fait 52px : quatre tirets en haut et en bas, avec des espaces de 28px, et les côtés sont pleins. Le trou de 240 × 8 au milieu est le contenu de html.</p></div>
<div class="cap" data-t="14" data-step="La bordure de body"><h3>4. body : trois carrés</h3><p>La règle imbriquée donne à body <code>margin:-22 1</code>, et la même bordure tiretée de 26px. body fait 240 − 2 × 1 = 238px de large et commence 22px au-dessus du contenu de html, en y = 124. Son contenu fait 0px de haut : ses bordures du haut et du bas se touchent en y = 150. Chaque côté a trois tirets de 52px, avec des espaces de 41px, et les bordures latérales remplissent les coins : body dessine trois carrés de 52 × 52. Sa boîte de marge fait −22 + 52 − 22 = 8px de haut : c'est la hauteur du contenu de html.</p></div>
<div class="cap" data-t="19" data-step="scale:5 .4"><h3>5. Étirer et écraser</h3><p><code>scale:5 .4</code> agrandit body autour de son centre, (200 ; 150) : 5 fois plus large, 0,4 fois moins haut. Chaque carré devient une barre de 260 × 20,8. Celle du milieu va de x = 70 à 330 et de y = 139,6 à 160,4 : elle remplit le trou de html et dessine les trois ponts entre les tirets. Les deux autres partent en x = −395 et 535, hors du canevas.</p></div>
<div class="cap" data-t="24" data-step="skew(15deg)"><h3>6. La pente</h3><p><code>transform:skew(15deg</code> va à html, et body suit. Le centre (200 ; 150) ne bouge pas, et chaque point glisse à droite de tan 15° ≈ 0,268 fois sa distance sous y = 150 : −8px sur le bord du haut, en y = 120, et +8px sur le bord du bas, en y = 180. Le fond du canevas, lui, ne penche pas.</p></div>
<div class="cap" data-t="28.5" data-step="Résultat" data-live="114 caractères · 100 % identique"><h3>7. Résultat : 114 caractères</h3><p>Une seule bordure tiretée pour deux boîtes. Sur html, elle dessine les quatre maillons. Sur body, étirée et écrasée, son tiret du milieu devient la barre qui les relie. Un skew penche toute la chaîne.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="Who gets what"><h3>1. Three selectors</h3><p><code>*</code> matches every element: html, head, body and style. The nested <code>*{</code> means <code>* *</code>: every element inside another one, so head, body and style. Outside any rule, <code>&amp;</code> matches the root, html. head and style are not displayed: only html and body matter. There is no doctype: in quirks mode, a number with no unit is in px.</p></div>
<div class="cap" data-t="4.5" data-step="The background"><h3>2. A fuchsia canvas</h3><p><code>background:#A82973</code> goes to html only. The browser paints the root element's background on the whole canvas, not just in its box. So the whole canvas is fuchsia, even though html is only a 292 × 60 box.</p></div>
<div class="cap" data-t="9" data-step="html's border"><h3>3. html: four dashes</h3><p><code>margin:30%54</code>: a percentage margin is a share of the width, here 30% of 400 = 120 on top and bottom, and 54 on the sides. html is 400 − 2 × 54 = 292px wide. <code>border:28q dashed</code>: 1q is a quarter of a millimeter, so 28q = 26.457px, and Chrome uses 26px. In my Chrome, each dash is 52px long: four dashes on top and bottom, with 28px gaps, and the sides are solid. The 240 × 8 slot in the middle is html's content.</p></div>
<div class="cap" data-t="14" data-step="body's border"><h3>4. body: three squares</h3><p>The nested rule gives body <code>margin:-22 1</code>, and the same 26px dashed border. body is 240 − 2 × 1 = 238px wide and starts 22px above html's content, at y = 124. Its content is 0px tall: its top and bottom borders touch at y = 150. Each side has three 52px dashes with 41px gaps, and the side borders fill the corners: body draws three 52 × 52 squares. Its margin box is −22 + 52 − 22 = 8px tall: that is the height of html's content.</p></div>
<div class="cap" data-t="19" data-step="scale:5 .4"><h3>5. Stretch and squash</h3><p><code>scale:5 .4</code> scales body around its center, (200, 150): 5 times wider, 0.4 times as tall. Each square becomes a 260 × 20.8 bar. The middle one goes from x = 70 to 330 and from y = 139.6 to 160.4: it fills html's slot and draws the three bridges between the dashes. The two others land at x = −395 and 535, off the canvas.</p></div>
<div class="cap" data-t="24" data-step="skew(15deg)"><h3>6. The tilt</h3><p><code>transform:skew(15deg</code> goes to html, and body moves with it. The center (200, 150) stays put, and each point moves right by tan 15° ≈ 0.268 times its distance below y = 150: −8px on the top edge, at y = 120, and +8px on the bottom edge, at y = 180. The canvas background does not tilt.</p></div>
<div class="cap" data-t="28.5" data-step="Result" data-live="114 characters · 100% match"><h3>7. Result: 114 characters</h3><p>One dashed border for two boxes. On html, it draws the four links. On body, stretched and squashed, its middle dash becomes the bar that joins them. A skew tilts the whole chain.</p></div>
{%- endif %}

<script>
(window.AnimScenes = window.AnimScenes || {}).t0807 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const scene = $('.scene'), live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.5), 1 - pr(t, b - 0.4, b));
  const lerp = (a, b, k) => a + (b - a) * k;
  const nf = (v, d) => { const s = v.toFixed(d).replace('-', '−'); return fr ? s.replace('.', ',') : s; };
  const c = fr ? '\u00a0:' : ':';
  // Measured on the official code in local Chrome (quirks mode, 400 × 300), getBoundingClientRect, computed styles and
  // renders with one part removed: html (54, 120) 292 × 60, margin 120px 54px, border 26px dashed (28q = 26.457px);
  // html's border alone: dashes x 54, 134, 214, 294 (52 wide) on y 120..146 and 154..180, sides x 54..80 and 320..346;
  // body (81, 124) 238 × 52, margin -22px 1px, content 0px tall; body's border alone: three 52 × 52 squares at x 81, 174, 267;
  // scale 5 0.4 around (200, 150): bounding box x -397.79..797.79 (skewed), y 139.6..160.4; transform matrix(1, 0, 0.267949, 1, 0, 0).
  const FIN = 28.5;
  const BL = $('.t0807-blank'), SK = $('.t0807-sk'), BD = $('.t0807-bd');
  const PH = $$('.t0807-p[data-g="h"]'), PB = $$('.t0807-p[data-g="b"]');
  const X = (k) => $(`.t0807-box[data-x="${k}"]`);
  const CL = $('.t0807-cl');
  const TG = (k) => $(`.t0807-tag[data-g="${k}"]`);
  const LS = $$('.t0807-l');
  const LW = { 1: [4.6, 8.8], 2: [9.6, 13.8], 3: [14.6, 18.8], 4: [19.6, 23.8], 5: [24.6, 28.3] };
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    const wide = fig.dataset.view === 'wide';
    const k = parseFloat(scene.style.getPropertyValue('--k')) || 1;
    // 2. the canvas turns fuchsia
    const bl = 1 - pr(t, 5, 6.2);
    BL.style.opacity = bl;
    const ln = bl > 0.5 ? '#14142a' : '#fff';
    // 3. html's border, 4. body's border
    const ph = pr(t, 10, 11.2), pb = pr(t, 15, 16.2);
    PH.forEach((e) => { e.style.opacity = ph; e.style.background = teach ? 'var(--t0807-th)' : 'var(--t0807-or)'; });
    PB.forEach((e) => { e.style.opacity = pb; e.style.background = teach ? 'var(--t0807-tb)' : 'var(--t0807-or)'; });
    // 5. scale 5 .4, 6. skew 15deg
    const ks = pr(t, 19.8, 22.4), kk = pr(t, 24.8, 27);
    const sx = lerp(1, 5, ks), sy = lerp(1, 0.4, ks), ang = 15 * kk;
    // the bar is 139.6..160.4, but Chrome paints the bridges on rows 140..159: the result snaps to that
    BD.style.transform = `scale(${sx}, ${t >= FIN ? 20 / 52 : sy})`;
    SK.style.transform = `skewX(${ang}deg)`;
    // boxes
    const op = (e, v) => { e.style.opacity = v; e.style.borderColor = ln; };
    op(X('h'), Math.max(win(t, 0.2, 4.4), win(t, 9.2, 13.8)) * 0.9);
    op(X('hc'), Math.max(win(t, 11, 13.8), win(t, 16.6, 18.8)) * 0.9);
    op(X('b'), Math.max(win(t, 0.2, 4.4), win(t, 14.2, 18.8)) * 0.9);
    op(CL, win(t, 16, 18.8) * 0.9);
    // tags just above their box, at screen size
    const tag = (e, x, y, v) => Object.assign(e.style, { left: `${x}px`, top: `${y - 19 * k}px`, opacity: v });
    tag(TG('h'), 54, 120, Math.max(win(t, 0.2, 4.4), win(t, 9.2, 13.8)));
    tag(TG('b'), 210, 124, Math.max(win(t, 0.4, 4.4), win(t, 14.2, 18.8)));
    // step labels: at the top left of the canvas, or of the wide frame
    LS.forEach((e) => {
      const n = +e.dataset.n, [a, z] = LW[e.dataset.l];
      const x = wide ? -412 : 6, y = (wide ? -4 : 6) + n * 20 * k;
      Object.assign(e.style, { left: `${x}px`, top: `${y}px`, opacity: win(t, a, z) });
    });
    let txt = '';
    if (step === 0) txt = '* → html, head, body, style · * * → head, body, style · & → html';
    else if (step === 1) txt = fr ? 'canevas\u00a0: #A82973' : 'canvas: #A82973';
    else if (step === 2) txt = fr ? 'html\u00a0: 292 × 60 · bordure\u00a0: 26px' : 'html: 292 × 60 · border: 26px';
    else if (step === 3) txt = fr ? 'body\u00a0: 238 × 52 · contenu de html\u00a0: 240 × 8' : "body: 238 × 52 · html's content: 240 × 8";
    else if (step === 4) txt = `scale${c} ${nf(sx, 2)} ${nf(sy, 2)} · ${fr ? 'barre' : 'bar'}${c} ${nf(52 * sx, 1)} × ${nf(52 * sy, 1)}`;
    else if (step === 5) txt = `skew${c} ${nf(ang, 1)}deg · ${fr ? 'décalage' : 'shift'}${c} ±${nf(30 * Math.tan(ang * Math.PI / 180), 2)}px`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
