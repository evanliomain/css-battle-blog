<div class="cap" data-t="5" data-step="&amp;,p"><h3>2. Deux pilules</h3><p>Hors de toute règle, <code>&amp;</code> désigne la racine : html. html et p reçoivent <code>height:150</code> : 80 × 230. <code>border-radius:9in</code>, soit 864px, est ramené à 40px, la moitié de la largeur : les deux boîtes deviennent des pilules. body garde ses 80 × 140 et ses coins carrés.</p></div>
<div class="cap" data-t="10" data-step="offset"><h3>3. Au centre</h3><p><code>offset:ray(45deg)</code> pose chaque élément au départ d'un rayon, à distance 0 : son centre va au centre de son bloc conteneur, quelles que soient ses marges. Pour html, c'est le centre du canevas, (200, 150). Pour body, le centre de la boîte de contenu de html, qui est le centre de html. Pour p, le centre de body. Les trois se retrouvent en (200, 150).</p></div>
<div class="cap" data-t="15" data-step="rotations"><h3>4. Trois angles</h3><p>Le rayon pointe à 45° (0° vers le haut, dans le sens des aiguilles d'une montre). <code>offset-rotate</code> vaut <code>auto</code> : l'élément tourne pour que son axe x suive le rayon, de 45° − 90° = −45°. Les rotations s'additionnent d'un élément à l'autre : html −45°, body −90°, p −135°. La pilule de html va d'en haut à gauche à en bas à droite, celle de p d'en haut à droite à en bas à gauche, et body se couche : 140 × 80.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0627 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? '\u00a0:' : ':';
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  const num = (v) => (fr ? String(v).replace('.', ',') : String(v));
  // Measured on the official code in local Chrome (400 × 300, quirks mode), with offset removed: html 80 × 140 at (0, 0)
  // (80 × 230 with the &,p rule), body 80 × 140 at (48, 48), p 80 × 140 at (88, 88) (80 × 230); border 40px (5ch).
  // With offset: all centered at (200, 150); renders with one element hidden or recolored: html −45°, body −90°, p −135°.
  // Official render: X from x = 107 to 292 and y = 57 to 242 (pixels), middle row yellow from x = 130 to 269,
  // column x = 129 blue from y = 136 to 163, column x = 200 yellow from y = 93 to 206.
  const FIN = 26;
  const Y = 'var(--t0627-yl)';
  const B = [
    { el: $('.t0627-h'), x: 0, y: 0, h2: 230, r2: 40, a: -45, c: 'var(--t0627-h)' },
    { el: $('.t0627-b'), x: 48, y: 48, h2: 140, r2: 0, a: -90, c: 'var(--t0627-b)' },
    { el: $('.t0627-p'), x: 88, y: 88, h2: 230, r2: 40, a: -135, c: 'var(--t0627-p)' },
  ];
  const cross = $('.t0627-x');
  const marks = $$('.t0627-m');
  const L = (k) => $$(`.zlab[data-l="${k}"]`);
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    // 1. the boxes and the canvas color
    const k1 = pr(t, [0.3, 1.5]);
    fig.style.setProperty('--bg', mix(k1, '#5dbcf9', '#fff'));
    // 2. html and p: 230 tall, round ends
    const k2 = pr(t, [5.4, 7]);
    // 3. to the center, 4. the turns
    const k3 = pr(t, [10.4, 12.6]);
    const k4 = pr(t, [15.4, 18.6]);
    // 5. teaching colors: html and p go yellow, body keeps its color
    const k5 = pr(t, [21.4, 22.6]);
    B.forEach((b, i) => {
      const w = 80, h = 140 + (b.h2 - 140) * k2;
      const cx = b.x + 40 + (200 - b.x - 40) * k3, cy = b.y + h / 2 + (150 - b.y - h / 2) * k3;
      const s = b.el.style;
      s.opacity = k1;
      s.left = `${cx - w / 2}px`;
      s.top = `${cy - h / 2}px`;
      s.width = `${w}px`;
      s.height = `${h}px`;
      s.borderRadius = `${b.r2 * k2}px`;
      s.transform = `rotate(${b.a * k4}deg)`;
      s.background = teach ? (i === 1 ? b.c : mix(k5, Y, b.c)) : Y;
    });
    cross.style.opacity = win(t, 10.3, 15);
    marks.forEach((m) => (m.style.opacity = win(t, 21.5, FIN)));
    [[0.3, 5], [5.3, 10], [10.3, 15], [15.3, 21], [21.3, FIN]].forEach(([s, e], k) => L(k + 1).forEach((l) => (l.style.opacity = win(t, s, e))));
    let txt;
    if (step === 0) txt = `html, body, p${c} 80 × 140`;
    else if (step === 1) txt = `html, p${c} 80 × ${(140 + 90 * k2).toFixed(0)} · r = ${(40 * k2).toFixed(0)}`;
    else if (step === 2) txt = `${fr ? 'centres' : 'centers'} → (200, 150)`;
    else if (step === 3) txt = `html ${(-45 * k4).toFixed(0)}° · body ${(-90 * k4).toFixed(0)}° · p ${(-135 * k4).toFixed(0)}°`;
    else if (step === 4) txt = `body${c} x = 130 … 270 · y = ${num(136.6)} … ${num(163.4)}`;
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
