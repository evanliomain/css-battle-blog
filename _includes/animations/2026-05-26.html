{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="html"><h3>1. La boîte de html</h3><p><code>*</code> vise tous les éléments, html compris. <code>margin:70 45%70 100</code> met 70px en haut et en bas, 45 % de 400 = 180px à droite et 100px à gauche. En mode quirks, html remplit la page moins ses marges : 120 × 160 en (100, 70). Son <code>background:#a84a4b</code> est celui de la racine : il couvre tout le canevas.</p></div>
<div class="cap" data-t="5" data-step="Bordure"><h3>2. Une bordure de 40px</h3><p><code>border:5ch solid#f5e3b5</code>. Le ch est la largeur du « 0 » dans la police de l'élément. html garde la police par défaut, Times en 16px, où 1ch = 8px : 5ch = 40px. <code>border-bottom:0</code>, dans la règle <code>&amp;</code> (html seul), enlève le côté du bas : un U à l'envers.</p></div>
<div class="cap" data-t="10.5" data-step="Arche"><h3>3. L'arche</h3><p><code>border-radius:2in 2in 0 0</code> demande des coins de 192px en haut. La boîte ne fait que 120px de large : le navigateur réduit tous les rayons du facteur 120 / 384 = 0,3125, à 60px. Le bord extérieur devient un demi-cercle de rayon 60. Dedans, la bordure laisse un rayon de 60 − 40 = 20 : le trou fait 40px de large.</p></div>
<div class="cap" data-t="15" data-step="body"><h3>4. body, le corps du i</h3><p>Le <code>*{</code> imbriqué vise ce qui est dans html : body et p (head et style ne s'affichent pas). <code>font:2vw"</code> leur donne une police de 8px ; le <code>"</code> seul ouvre un nom de police vide, que la fin du code ferme. Là, 1ch = 4px et <code>5ch</code> = 20px. <code>margin:50%120 0</code> : 50 % des 40px de contenu de html = 20px en haut, 120px de chaque côté. body est poussé en x = 260, sans place pour son contenu : 40px de large avec ses bordures. En mode quirks, il descend jusqu'au bas de html : 40 × 100 en (260, 130).</p></div>
<div class="cap" data-t="20.5" data-step="p"><h3>5. p, hors du canevas</h3><p>p est dans body. La même marge lui donne 50 % des 0px de contenu de body = 0 en haut, et 120px à gauche : x = 280 + 120 = 400. Un carré de bordure de 40 × 40 en (400, 150), jamais affiché.</p></div>
<div class="cap" data-t="26" data-step="Ombres"><h3>6. Deux ombres</h3><p>Le <code>*{</code> le plus imbriqué ne vise que p (et style). <code>color:30383F</code>, sans dièse, est quand même lu comme une couleur en mode quirks, et les ombres sans couleur la prennent. <code>-35vw -5pc</code> copie p 140px à gauche et 80px plus haut : le point du i en (260, 70). <code>-65vw 0</code> le copie 260px à gauche : la barre du A en (140, 150).</p></div>
<div class="cap" data-t="31" data-step="Résultat" data-live="191 caractères · 100 % identique"><h3>7. Résultat : 191 caractères</h3><p>Une seule bordure pour trois boîtes : 40px sur html, 20px sur body et p, car le ch suit la police. html dessine le A, body le corps du i, et p, garé hors du canevas, lance les deux carrés.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html"><h3>1. html's box</h3><p><code>*</code> matches every element, html included. <code>margin:70 45%70 100</code> puts 70px at the top and the bottom, 45% of 400 = 180px on the right and 100px on the left. In quirks mode, html fills the page minus its margins: 120 × 160 at (100, 70). Its <code>background:#a84a4b</code> is the root's: it covers the whole canvas.</p></div>
<div class="cap" data-t="5" data-step="Border"><h3>2. A 40px border</h3><p><code>border:5ch solid#f5e3b5</code>. A ch is the width of the "0" in the element's font. html keeps the default font, 16px Times, where 1ch = 8px: 5ch = 40px. <code>border-bottom:0</code>, in the <code>&amp;</code> rule (html only), removes the bottom side: an upside-down U.</p></div>
<div class="cap" data-t="10.5" data-step="Arch"><h3>3. The arch</h3><p><code>border-radius:2in 2in 0 0</code> asks for 192px top corners. The box is only 120px wide: the browser scales every radius by 120 / 384 = 0.3125, down to 60px. The outer edge becomes a half circle of radius 60. Inside, the border leaves a radius of 60 − 40 = 20: the hole is 40px wide.</p></div>
<div class="cap" data-t="15" data-step="body"><h3>4. body, the stem of the i</h3><p>The nested <code>*{</code> matches what is inside html: body and p (head and style are not displayed). <code>font:2vw"</code> gives them an 8px font; the lone <code>"</code> opens an empty font name that the end of the code closes. There, 1ch = 4px and <code>5ch</code> = 20px. <code>margin:50%120 0</code>: 50% of html's 40px content width = 20px at the top, 120px on each side. body is pushed to x = 260, with no room left for its content: 40px wide with its borders. In quirks mode, it stretches down to html's bottom: 40 × 100 at (260, 130).</p></div>
<div class="cap" data-t="20.5" data-step="p"><h3>5. p, off the canvas</h3><p>p is inside body. The same margin gives it 50% of body's 0px content width = 0 at the top, and 120px on the left: x = 280 + 120 = 400. A 40 × 40 square of border at (400, 150), never shown.</p></div>
<div class="cap" data-t="26" data-step="Shadows"><h3>6. Two shadows</h3><p>The innermost <code>*{</code> only matches p (and style). <code>color:30383F</code>, with no hash, still reads as a color in quirks mode, and shadows with no color take it. <code>-35vw -5pc</code> copies p 140px left and 80px up: the dot of the i at (260, 70). <code>-65vw 0</code> copies it 260px left: the bar of the A at (140, 150).</p></div>
<div class="cap" data-t="31" data-step="Result" data-live="191 characters · 100% match"><h3>7. Result: 191 characters</h3><p>One border for three boxes: 40px on html, 20px on body and p, because a ch follows the font. html draws the A, body the stem of the i, and p, parked off the canvas, throws the two squares.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0526 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.5), 1 - pr(t, b - 0.3, b));
  const c = fr ? ' :' : ':';
  const n = (s) => (fr ? s.replace(/(\d)\.(\d)/g, '$1,$2') : s);
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  // Measured on the official code in local Chrome (400 × 300 iframe, quirks mode, hidden scrollbars, getBoundingClientRect, getComputedStyle).
  // html: 100, 70, 120 × 160, border 40px (16px Times, 1ch = 8px) on top and sides, 0 at the bottom, radius 192px → drawn 60px; background rgb(168 74 75) on the canvas.
  // body: 260, 130, 40 × 100 (font 8px "", border 20px, margin 20px 120px 0, content 0 wide). p: 400, 150, 40 × 40 (border 20px, margin 0 120px 0).
  // p's box-shadow: rgb(48 56 63) -140px -80px, -260px 0 → squares at (260, 70) and (140, 150).
  const blank = $('.t0526-blank'), A = $('.t0526-a'), under = $('.t0526-under'), body = $('.t0526-body'), P = $('.t0526-p');
  const hbox = $('.t0526-hbox'), cbox = $('.t0526-cbox');
  const SH = $$('.t0526-sh');
  const labs = $$('.zlab');
  const ivs = [[0.3, 4.8], [5.3, 10.3], [10.8, 14.8], [15.3, 20.3], [20.8, 25.8], [26.3, 30.8]];
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const wide = fig.dataset.view === 'wide';
    const tw = teach ? 1 - pr(t, 31.2, 32.4) : 0;
    const col = (v, real) => mix(tw, `var(--t0526-${v})`, `var(--t0526-${real})`);
    // step 1: html's background reaches the canvas
    blank.style.opacity = 1 - pr(t, 1, 2.6);
    hbox.style.opacity = win(t, 0.3, 14.8);
    // step 2: the 40px border, then border-bottom:0
    const bw = 40 * pr(t, 5.6, 7.6);
    const bb = bw * (1 - pr(t, 8.2, 9.6));
    A.style.borderWidth = `${bw}px ${bw}px ${bb}px`;
    A.style.borderColor = col('html', 'cream');
    // step 3: the radius, scaled down to 60px
    const r = 60 * pr(t, 11.2, 13.6);
    A.style.borderRadius = `${r}px ${r}px 0 0`;
    // step 4: body, first with no side margins, then pushed 120px right
    cbox.style.opacity = win(t, 15.3, 20.3);
    body.style.opacity = pr(t, 16, 16.8);
    body.style.left = `${140 + 120 * pr(t, 17.4, 19)}px`;
    body.style.borderColor = col('body', 'cream');
    // step 5: p, at the left of body's content box, then pushed 120px right
    P.style.opacity = pr(t, 21, 21.8);
    P.style.left = `${280 + 120 * pr(t, 22.4, 24)}px`;
    P.style.borderColor = col('p', 'cream');
    // step 6: the two shadows leave p's box
    const k = pr(t, 26.8, 29.2);
    SH.forEach((s) => {
      s.style.opacity = t >= 26.5 ? 1 : 0;
      s.style.left = `${400 + (+s.dataset.x - 400) * k}px`;
      s.style.top = `${150 + (+s.dataset.y - 150) * k}px`;
      s.style.background = col('sh', 'slate');
    });
    // same-color underlay below the A, so that no canvas line shows between the bar and the legs
    under.style.opacity = k >= 1 ? 1 : 0;
    under.style.background = col('sh', 'slate');
    // labels: one per step, at the top left of the frame
    labs.forEach((l) => {
      const x0 = wide ? -30 : 0, y0 = wide ? -30 : 0;
      l.style.left = `calc(${x0}px + 4px * var(--k, 1))`;
      l.style.top = `calc(${y0}px + 4px * var(--k, 1))`;
      l.style.opacity = win(t, ...ivs[+l.dataset.l - 1]);
    });
    let txt;
    if (step === 0) txt = `html${c} 400 − 100 − 180 = 120 · 300 − 70 − 70 = 160`;
    else if (step === 1) txt = `16px Times${c} 1ch = 8px · 5ch = 40px`;
    else if (step === 2) txt = n(`2in = 192px · 120 / (192 + 192) = 0.3125 · 192 × 0.3125 = 60px`);
    else if (step === 3) txt = `2vw = 8px · 5ch = 20px · x = 140 + 120 = 260 · 120 − 20 = 100`;
    else if (step === 4) txt = `p${c} x = 260 + 20 + 120 = 400 · y = 130 + 20 = 150`;
    else if (step === 5) txt = `400 − 140 = 260 · 150 − 80 = 70 · 400 − 260 = 140`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
