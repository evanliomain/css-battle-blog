<div class="cap" data-t="0" data-step="html"><h3>1. html, une grande boîte</h3><p>Il n'y a pas de doctype : la page est en mode quirks, et les nombres sans unité sont des px dans <code>margin</code>. Le <code>&amp;</code> seul vise la racine : html. <code>margin:-157-197</code> le tire de 157px vers le haut et de 197px vers la gauche, et autant de l'autre côté : 400 + 394 = 794px de large. En mode quirks, html remplit la hauteur de la fenêtre moins ses marges : 300 + 314 = 614px.</p></div>
<div class="cap" data-t="5" data-step="Le cadre"><h3>2. 31ex : un cadre plein</h3><p><code>*</code> donne à html une bordure olive en tirets de <code>31ex</code>. Un ex est la hauteur d'un x dans la police de l'élément, ici la police par défaut de 16px. Dans la cible, la bordure fait 227px. Ses côtés sont trop courts pour un trou à cette épaisseur : Chrome la dessine pleine. Il reste une fenêtre de 340 × 160, de x = 30 à 370 et de y = 70 à 230.</p></div>
<div class="cap" data-t="10" data-step="body"><h3>3. body, crème partout</h3><p>Le <code>+*</code> imbriqué veut dire <code>* + *</code> : un élément juste après un autre élément. Seul body convient : il suit head. <code>margin:-80 0</code> le remonte de 80px dans la bordure de html : 340 × 320 en (30, −10). Son fond est crème, et html n'en a pas : le crème peint tout le canevas. Seule la fenêtre le montre.</p></div>
<div class="cap" data-t="15" data-step="Les carrés"><h3>4. Les tirets de body : quatre carrés</h3><p><code>font:3Q</code> donne à body une police de 3 quarts de millimètre : 2,83px. Le même <code>31ex</code> fait alors 40px dans la cible. Les côtés de body font 320px : Chrome dessine tiret 80, trou 40, tiret 80, trou 40, tiret 80. Les deux trous, de y = 70 à 110 et de 190 à 230, ouvrent les quatre carrés des coins. Le haut et le bas restent sur le cadre de html.</p></div>
<div class="cap" data-t="20" data-step="La rangée"><h3>5. Les tirets de p : la rangée du milieu</h3><p>p hérite de la police de 2,83px : sa bordure fait aussi 40px. <code>/40vw</code> fixe la hauteur de ligne à 160px, et le <code>.</code> donne à p une ligne : 160 + 80 = 240px de haut, en (70, 30). Ses côtés font tiret 80, trou 80, tiret 80. Le trou, de y = 110 à 190, ouvre la rangée du milieu.</p></div>
<div class="cap" data-t="25" data-step="Résultat" data-live="105 caractères · 100 % identique"><h3>6. Résultat : 105 caractères</h3><p>Une seule bordure <code>31ex</code> en tirets, sur trois boîtes. La police la rend épaisse sur html, fine sur body et p. Le crème passe par la fenêtre du cadre, sauf là où tombent les tirets.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html"><h3>1. html, a big box</h3><p>There is no doctype: the page is in quirks mode, and numbers with no unit are px in <code>margin</code>. The lone <code>&amp;</code> selects the root: html. <code>margin:-157-197</code> pulls it 157px up and 197px left, and as much on the other side: 400 + 394 = 794px wide. In quirks mode, html fills the height of the window minus its margins: 300 + 314 = 614px.</p></div>
<div class="cap" data-t="5" data-step="The frame"><h3>2. 31ex: a solid frame</h3><p><code>*</code> gives html a <code>31ex</code> dashed olive border. An ex is the height of an x in the element's font, here the default 16px font. In the target, the border is 227px. Its sides are too short for a gap at that width: Chrome draws it solid. What is left is a 340 × 160 window, from x = 30 to 370 and y = 70 to 230.</p></div>
<div class="cap" data-t="10" data-step="body"><h3>3. body, cream everywhere</h3><p>The nested <code>+*</code> means <code>* + *</code>: an element right after another element. Only body fits: it follows head. <code>margin:-80 0</code> pulls it 80px up into html's border: 340 × 320 at (30, −10). Its background is cream, and html has none: the cream paints the whole canvas. Only the window shows it.</p></div>
<div class="cap" data-t="15" data-step="The squares"><h3>4. body's dashes: four squares</h3><p><code>font:3Q</code> gives body a 3 quarter-millimeter font: 2.83px. The same <code>31ex</code> is then 40px in the target. body's sides are 320px long: Chrome draws dash 80, gap 40, dash 80, gap 40, dash 80. The two gaps, from y = 70 to 110 and 190 to 230, open the four corner squares. The top and bottom stay on html's frame.</p></div>
<div class="cap" data-t="20" data-step="The row"><h3>5. p's dashes: the middle row</h3><p>p inherits the 2.83px font: its border is 40px too. <code>/40vw</code> sets the line height to 160px, and the <code>.</code> gives p one line: 160 + 80 = 240px tall, at (70, 30). Its sides go dash 80, gap 80, dash 80. The gap, from y = 110 to 190, opens the middle row.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0706 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? ' :' : ':';
  const num = (v, d = 0) => { const s = Math.abs(v).toFixed(d); return (v < -0.005 ? '−' : '') + (fr ? s.replace('.', ',') : s); };
  // Geometry of the target (31ex = 227px on html, 40px on body and p), checked in local Chrome by writing those widths in px:
  // html (-197, -157) 794 × 614, solid; body (30, -10) 340 × 320; p (70, 30) 260 × 240.
  // Dashes measured on Chrome's render: body sides 80/40/80/40/80, top and bottom 80/50/80/50/80; p sides 80/80/80, top and bottom 80/10/80/10/80.
  const FIN = 25;
  const lerp = (a, b, k) => a + (b - a) * k;
  const put = (e, x, y, w, h) => { e.style.left = `${x}px`; e.style.top = `${y}px`; e.style.width = `${w}px`; e.style.height = `${h}px`; };
  const cream = $('.t0706-cream'), frame = $('.t0706-frame');
  const hb = $('.t0706-hb'), bb = $('.t0706-bb'), pb = $('.t0706-pb');
  const parse = (e) => { const [x, y, w, h, s, cut] = e.dataset.r.split(' '); return { e, x: +x, y: +y, w: +w, h: +h, s, cut }; };
  const bd = $$('.t0706-bd > i').map(parse), pd = $$('.t0706-pd > i').map(parse);
  // A dash grows from the outer edge of its side, to the border width (40px). In real colors, body's side dashes
  // reach 1px into html's frame (same olive), so that no seam shows along x = 30 and x = 370, and the dashes that end
  // on the window's top or bottom edge (y = 70, y = 230) stop 1px inside the frame, so that edge is drawn once.
  const grow = (d, k, ext, real) => {
    let y = d.y, h = d.h;
    if (real && d.cut === 'e') h -= 1;
    if (real && d.cut === 's') { y += 1; h -= 1; }
    if (d.s === 't') put(d.e, d.x, y, d.w, h * k);
    else if (d.s === 'b') put(d.e, d.x, y + h * (1 - k), d.w, h * k);
    else if (d.s === 'l') put(d.e, d.x - ext, y, d.w * k + ext, h);
    else put(d.e, d.x + d.w * (1 - k), y, d.w * k + ext, h);
  };
  const L = (k) => $$(`.t0706-l[data-l="${k}"]`);
  const col = (teach, v) => (teach ? `var(--t0706-${v})` : 'var(--t0706-ol)');
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    const out = 1 - pr(t, [FIN - 0.4, FIN]);
    // 1. html's box: from the canvas to (-197, -157) 794 × 614
    const kM = pr(t, [0.5, 2.5]);
    put(hb, lerp(0, -197, kM), lerp(0, -157, kM), lerp(400, 794, kM), lerp(300, 614, kM));
    hb.style.opacity = 0.9 * pr(t, [0.2, 0.5]) * out;
    // 2. html's border grows to 227px, solid
    const kF = pr(t, [5.5, 7.5]);
    frame.style.borderWidth = `${227 * kF}px`;
    frame.style.opacity = t >= 5.5 ? 1 : 0;
    frame.style.borderColor = col(teach, 'c1');
    // 3. body's box, then its cream background on the whole canvas
    const kB = pr(t, [10.5, 12]);
    put(bb, 30, lerp(70, -10, kB), 340, lerp(160, 320, kB));
    bb.style.opacity = 0.9 * pr(t, [10.2, 10.5]) * out;
    cream.style.opacity = pr(t, [12.5, 13.5]);
    // 4. body's dashes grow to 40px
    const kD = pr(t, [15.5, 17.5]);
    bd.forEach((d) => { grow(d, kD, teach ? 0 : 1, !teach); d.e.style.background = col(teach, 'c2'); d.e.style.opacity = t >= 15.5 ? 1 : 0; });
    // 5. p's box (its 160px line), then its dashes
    const kL = pr(t, [20.5, 21.5]), kP = pr(t, [22, 23.5]);
    put(pb, 70, 30, 260, 80 + 160 * kL);
    pb.style.opacity = 0.9 * pr(t, [20.2, 20.5]) * out;
    pd.forEach((d) => { grow(d, kP, 0, !teach); d.e.style.background = col(teach, 'c3'); d.e.style.opacity = t >= 22 ? 1 : 0; });
    [[0.3, 5], [5.3, 10], [10.3, 15], [15.3, 20], [20.3, 25]].forEach(([a, z], k) => L(k + 1).forEach((e) => (e.style.opacity = win(t, a, z))));
    let txt;
    if (step === 0) txt = `html${c} ${num(lerp(400, 794, kM))} × ${num(lerp(300, 614, kM))} ${fr ? 'en' : 'at'} (${num(lerp(0, -197, kM))}, ${num(lerp(0, -157, kM))})`;
    else if (step === 1) txt = fr ? `bordure de html${c} ${num(227 * kF)}px` : `html's border${c} ${num(227 * kF)}px`;
    else if (step === 2) txt = `body${c} 340 × ${num(lerp(160, 320, kB))} ${fr ? 'en' : 'at'} (30, ${num(lerp(70, -10, kB))})`;
    else if (step === 3) txt = fr ? `bordure de body${c} ${num(40 * kD)}px` : `body's border${c} ${num(40 * kD)}px`;
    else if (step === 4) txt = fr ? `p${c} 260 × ${num(80 + 160 * kL)} · bordure ${num(40 * kP)}px` : `p${c} 260 × ${num(80 + 160 * kL)} · border ${num(40 * kP)}px`;
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
