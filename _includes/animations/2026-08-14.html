<div class="cap" data-t="0" data-step="Tout en violet"><h3>1. Tout en violet</h3><p><code>*</code> vise tous les éléments, html compris. Le fond de html peint tout le canevas en <code>#6D1477</code>. <code>padding:20</code> n'a pas d'unité : en mode quirks, ce sont des px. html a 20px de padding, body garde sa marge par défaut de 8px et prend lui aussi 20px de padding : son contenu commence en (48 ; 48) et fait 304px de large.</p></div>
<div class="cap" data-t="5" data-step="Trois p, trois a"><h3>2. Trois <code>p</code>, trois <code>a</code></h3><p>Aucune balise n'est fermée. Un <code>&lt;p></code> ferme le <code>p</code> d'avant : on obtient trois <code>p</code>, avec un <code>a</code> dans chacun. Flottant, un <code>a</code> devient un bloc ; vide, il fait 20 + 20 = 40px de côté. Flottant, un <code>p</code> s'ajuste à son <code>a</code> : 20 + 40 + 20 = 80px. Pour l'instant, les <code>p</code> gardent leur marge par défaut de 16px en haut.</p></div>
<div class="cap" data-t="10" data-step="Les marges"><h3>3. Les marges</h3><p><code>margin:62…0 22</code> : 62px en haut, 22px à gauche. Le premier <code>p</code> descend en (70 ; 110). Mais chaque <code>p</code> prend alors 22 + 80 = 102px, et trois font 306px : 2px de trop pour les 304px du contenu de body. Sans marge négative, le troisième passe à la ligne, en (70 ; 252), en partie hors du canevas.</p></div>
<div class="cap" data-t="15" data-step="−4 %"><h3>4. Une marge droite de −4 %</h3><p>Une marge en % se calcule sur la largeur du bloc parent : les 304px du contenu de body. 4 % font 12,16px. Chaque <code>p</code> ne prend plus que 22 + 80 − 12,16 = 89,84px : les trois tiennent sur une ligne, en x = 70, 159,84 et 249,69. Chrome les peint sur des pixels entiers : 160 et 250, avec 10px d'écart.</p></div>
<div class="cap" data-t="20" data-step="Arrondir [a]"><h3>5. Arrondir les <code>[a]</code></h3><p><code>[a]</code> vise tout élément qui porte l'attribut <code>a</code> : le premier et le troisième <code>p</code>, et le deuxième <code>a</code>. <code>border-radius:50%</code> en fait des cercles : 40px de rayon pour les <code>p</code>, 20px pour le <code>a</code>.</p></div>
<div class="cap" data-t="25" data-step="Résultat" data-live="133 caractères · 100 % identique"><h3>6. Résultat : 133 caractères</h3><p>Les <code>p</code> sont beiges, les <code>a</code> violets comme le fond : ils font les trous. Un seul padding de 20px donne toutes les tailles.</p></div>

<div class="cap" data-t="5" data-step="Three p, three a"><h3>2. Three <code>p</code>, three <code>a</code></h3><p>No tag is closed. A <code>&lt;p></code> closes the <code>p</code> before it: that gives three <code>p</code>, with one <code>a</code> in each. As a float, an <code>a</code> becomes a block; it is empty, so it is 20 + 20 = 40px wide. As a float, a <code>p</code> wraps its <code>a</code>: 20 + 40 + 20 = 80px. For now, the <code>p</code> elements keep their default 16px top margin.</p></div>
<div class="cap" data-t="10" data-step="The margins"><h3>3. The margins</h3><p><code>margin:62…0 22</code>: 62px on top, 22px on the left. The first <code>p</code> moves to (70, 110). But each <code>p</code> now takes 22 + 80 = 102px, and three take 306px: 2px too many for the 304px of content in body. With no negative margin, the third one wraps to (70, 252), partly off the canvas.</p></div>
<div class="cap" data-t="15" data-step="−4%"><h3>4. A −4% right margin</h3><p>A margin in % is a share of the parent's width: the 304px of content in body. 4% is 12.16px. Each <code>p</code> now takes only 22 + 80 − 12.16 = 89.84px: the three fit on one row, at x = 70, 159.84 and 249.69. Chrome paints them on whole pixels: 160 and 250, 10px apart.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0814 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const lerp = (a, b, k) => a + (b - a) * k;
  const n2 = (v) => (fr ? v.toFixed(2).replace('.', ',') : v.toFixed(2));
  const c = fr ? ' :' : ':';
  const sep = fr ? ' ;' : ',';
  // Measured on the official code and variants (getBoundingClientRect in local Chrome):
  // body (28, 28) 344 × 182, content 304px wide from (48, 48); p 80 × 80, a 40 × 40 at +20
  // without the margin rule: p at (48, 64) (128, 64) (208, 64); with margin:62 0 0 22: (70, 110) (172, 110) (70, 252)
  // official: (70, 110) (159.844, 110) (249.688, 110), painted from x = 160 and 250
  const FIN = 25;
  const P0 = [[48, 64], [128, 64], [208, 64]];
  const P1 = [[70, 110], [172, 110], [70, 252]];
  const ps = $$('.t0814-p');
  const as = ps.map((p) => p.firstElementChild);
  const body = $('.t0814-body');
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    body.style.opacity = teach ? pr(t, [0.3, 1]) : 0;
    const op = pr(t, [5.4, 6.4]);
    const k1 = pr(t, [10.6, 12.6]);
    const k1c = pr(t, [10.8, 13]);
    const m = 12.16 * pr(t, [15.6, 17.6]);
    const k2 = pr(t, [16, 18]);
    const rk = pr(t, [20.6, 23]);
    const pos = [
      [lerp(P0[0][0], P1[0][0], k1), lerp(P0[0][1], P1[0][1], k1)],
      [lerp(P0[1][0], P1[1][0], k1) - m, lerp(P0[1][1], P1[1][1], k1)],
      [lerp(lerp(P0[2][0], P1[2][0], k1c), 249.69, k2), lerp(lerp(P0[2][1], P1[2][1], k1c), 110, k2)],
    ];
    // once the margin is in place, the boxes sit on the whole pixels Chrome paints
    if (k2 >= 1) { pos[1][0] = 160; pos[2][0] = 250; }
    ps.forEach((p, i) => {
      p.style.opacity = op;
      p.style.left = `${pos[i][0]}px`; p.style.top = `${pos[i][1]}px`;
      p.style.borderRadius = i === 1 ? '0' : `${40 * rk}px`;
      as[i].style.background = teach ? 'var(--t0814-a)' : 'var(--t0814-pu)';
      as[i].style.borderRadius = i === 1 ? `${20 * rk}px` : '0';
    });
    $$('.t0814-g').forEach((g) => {
      const i = +g.dataset.g;
      const w1 = win(t, 0.3, 4.8);
      g.style.opacity = 0.9 * (i === 3 ? Math.max(w1, win(t, 10.3, 19.8)) : w1);
    });
    [[0.2, 4.8], [5.2, 9.8], [10.2, 14.8], [15.2, 19.8], [20.2, 24.8]].forEach(([a, z], i) => ($(`.t0814-l[data-l="${i + 1}"]`).style.opacity = win(t, a, z)));
    let txt = '';
    if (step === 0) txt = `body${c} (28${sep} 28) · 344 × 182 · ${fr ? 'contenu' : 'content'} 304px`;
    else if (step === 1) txt = `a${c} 40 × 40 · p${c} 80 × 80`;
    else if (step === 2) txt = `p${c} (${Math.round(pos[0][0])}${sep} ${Math.round(pos[0][1])}) (${Math.round(pos[1][0])}${sep} ${Math.round(pos[1][1])}) (${Math.round(pos[2][0])}${sep} ${Math.round(pos[2][1])})`;
    else if (step === 3) txt = `margin-right${c} −${n2(m)}px · x = 70 / ${n2(172 - m)} / ${n2(lerp(70, 249.69, k2))}`;
    else if (step === 4) txt = `border-radius${c} ${n2(40 * rk)}px · ${n2(20 * rk)}px`;
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
