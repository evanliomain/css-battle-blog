<div class="cap" data-t="0" data-step="html : 360 × 260"><h3>1. html : 360 × 260</h3><p><code>*</code> vise tous les éléments. Pas de doctype : la page est en mode quirks, et <code>20</code> se lit en px. En mode quirks, html remplit les 400 × 300 de la page, moins ses marges : une boîte de 360 × 260 en (20 ; 20). Son fond, <code>#6592CF</code>, est peint sur tout le canevas.</p></div>
<div class="cap" data-t="4" data-step="Bordure pointillée"><h3>2. Une bordure pointillée</h3><p>html n'a pas de <code>--b</code> : <code>var()</code> prend sa valeur de repli, <code>dotted#3F3642</code>. <code>64q</code>, c'est 60,47px : Chrome trace 60px. En haut et en bas, la bordure pointillée devient quatre disques brun-noir de 60px, centrés en x = 50, 150, 250 et 350. Il reste à html un contenu de 360 × 140 en (20 ; 80).</p></div>
<div class="cap" data-t="9" data-step="body"><h3>3. body : des bandes vertes</h3><p>Le <code>*{</code> imbriqué vise les descendants de html. body reçoit <code>--b:solid#A8D38B</code> : la même déclaration lui donne une bordure verte pleine de 60px. <code>margin:-60 30</code> le place en (50 ; 20), 300 de large. En mode quirks, il remplit le contenu de html, moins ses marges : 140 + 2 × 60 = 260 de haut. Ses deux bandes cachent les disques, sauf les moitiés extérieures des quatre disques des bouts.</p></div>
<div class="cap" data-t="14" data-step="h6"><h3>4. h6 : 200 × 140</h3><p><code>h6{margin:30 90-30 10}</code> place h6 dans le contenu de body : 200 × 140 en (60 ; 110). Lui aussi a deux bordures vertes de 60px. Entre les deux, son contenu fait 20px de haut : la hauteur que lui laisse pre, avec ses deux lignes de texte de 10px. La marge basse de -30 garde le contenu de body à 140px.</p></div>
<div class="cap" data-t="18.5" data-step="pre"><h3>5. pre, dans h6</h3><p>pre est dans h6. <code>-70%</code> est pris sur la largeur de h6, 200px : -140px. pre monte donc de 140px, et <code>60</code> à droite et <code>-60</code> à gauche le décalent de 60px vers la gauche : 200 × 140 en (0 ; 30). Sa bordure basse tombe pile sur la bordure haute de h6. Son contenu de 20px tient le texte.</p></div>
<div class="cap" data-t="23" data-step="Rotation"><h3>6. Un quart de tour</h3><p><code>rotate:90deg</code> fait tourner h6 autour de son centre, (160 ; 180), et pre tourne avec lui. Les bordures deviennent des piliers verticaux : h6 en x = 90 à 230, pre en x = 170 à 310. Les deux contenus de 20px deviennent deux fentes bleues : x = 150 à 170 en bas, x = 230 à 250 en haut. Le fond bleu de h6 et de pre coupe les bandes de body.</p></div>
<div class="cap" data-t="28" data-step="Résultat" data-live="178 caractères · 100 % identique"><h3>7. Résultat : 178 caractères</h3><p>La bordure pointillée de html donne les quatre demi-disques. La bordure verte de body donne les deux barres. h6 et pre, tournés d'un quart de tour, donnent les quatre piliers et les deux fentes.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html: 360 × 260"><h3>1. html: 360 × 260</h3><p><code>*</code> targets every element. There is no doctype: the page is in quirks mode, and <code>20</code> is read as px. In quirks mode, html fills the 400 × 300 page, minus its margins: a 360 × 260 box at (20, 20). Its background, <code>#6592CF</code>, is painted on the whole canvas.</p></div>
<div class="cap" data-t="4" data-step="Dotted border"><h3>2. A dotted border</h3><p>html has no <code>--b</code>: <code>var()</code> takes its fallback, <code>dotted#3F3642</code>. <code>64q</code> is 60.47px: Chrome draws 60px. At the top and the bottom, the dotted border becomes four dark discs of 60px, centered at x = 50, 150, 250 and 350. That leaves html a 360 × 140 content box at (20, 80).</p></div>
<div class="cap" data-t="9" data-step="body"><h3>3. body: green bands</h3><p>The nested <code>*{</code> targets html's descendants. body gets <code>--b:solid#A8D38B</code>: the same declaration gives it a solid 60px green border. <code>margin:-60 30</code> puts it at (50, 20), 300 wide. In quirks mode, it fills html's content box, minus its margins: 140 + 2 × 60 = 260 tall. Its two bands hide the discs, except the outer halves of the four discs at the ends.</p></div>
<div class="cap" data-t="14" data-step="h6"><h3>4. h6: 200 × 140</h3><p><code>h6{margin:30 90-30 10}</code> puts h6 in body's content box: 200 × 140 at (60, 110). It also has two 60px green borders. Between them, its content box is 20px tall: the height pre leaves it, with its two 10px lines of text. The bottom margin of -30 keeps body's content box at 140px.</p></div>
<div class="cap" data-t="18.5" data-step="pre"><h3>5. pre, inside h6</h3><p>pre is inside h6. <code>-70%</code> is taken from h6's width, 200px: -140px. So pre goes up 140px, and <code>60</code> on the right and <code>-60</code> on the left move it 60px to the left: 200 × 140 at (0, 30). Its bottom border lands exactly on h6's top border. Its 20px content box holds the text.</p></div>
<div class="cap" data-t="23" data-step="Rotation"><h3>6. A quarter turn</h3><p><code>rotate:90deg</code> turns h6 around its center, (160, 180), and pre turns with it. The borders become vertical pillars: h6 from x = 90 to 230, pre from x = 170 to 310. The two 20px content boxes become two blue slots: x = 150 to 170 at the bottom, x = 230 to 250 at the top. h6's and pre's blue background cuts through body's bands.</p></div>
<div class="cap" data-t="28" data-step="Result" data-live="178 characters · 100% match"><h3>7. Result: 178 characters</h3><p>html's dotted border gives the four half discs. body's green border gives the two bars. h6 and pre, turned a quarter turn, give the four pillars and the two slots.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0731 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const f2 = (v) => (fr ? v.toFixed(2).replace('.', ',') : v.toFixed(2));
  const c = fr ? ' :' : ':';
  const sc = fr ? ' ;' : ',';
  // Measured on the official code in local Chrome (quirks mode, 400 × 300):
  // html (20, 20) 360 × 260, dotted border 60px (64q = 60.47px) top and bottom: 4 discs per edge, centers x 50/150/250/350, y 50 and 250.
  // body (50, 20) 300 × 260, solid green border 60px, content (50, 80) 300 × 140.
  // h6 before rotation (60, 110) 200 × 140, content 20px tall; after rotate:90deg (90, 80) 140 × 200.
  // pre in h6's frame (0, 30) 200 × 140 (margin-top -70% of 200 = -140); after rotation (170, 20) 140 × 200.
  const FIN = 28;
  const dots = $$('.t0731-dot'), body = $('.t0731-body'), rot = $('.t0731-rot');
  const h6 = $('.t0731-h6'), pre = $('.t0731-pre'), patches = $$('.t0731-patch');
  const htb = $('.t0731-htb'), bdb = $('.t0731-bdb'), hb = $('.t0731-hb'), pb = $('.t0731-pb'), cb = $('.t0731-cb');
  const L = (k) => $$(`.t0731-l[data-l="${k}"]`);
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    const ann = 1 - pr(t, [FIN, FIN + 0.6]);
    // html: its box, then the dotted border
    htb.style.opacity = 0.9 * pr(t, [0.2, 0.8]) * (1 - pr(t, [8.6, 9.2]));
    const d = 60 * pr(t, [4.4, 6.4]);
    dots.forEach((e) => { e.style.opacity = d > 0 ? 1 : 0; e.style.width = e.style.height = `${d}px`; e.style.margin = `${-d / 2}px 0 0 ${-d / 2}px`; e.style.background = teach ? 'var(--t0731-hc)' : 'var(--t0731-dk)'; });
    cb.style.opacity = 0.9 * win(t, 6.6, 8.8);
    // body: its box, then its two green bands
    bdb.style.opacity = 0.9 * win(t, 9.2, 13.8);
    const bw = 60 * pr(t, [9.8, 11.8]);
    body.style.opacity = pr(t, [9.2, 9.6]);
    body.style.borderWidth = `${bw}px 0`;
    body.style.borderColor = teach ? 'var(--t0731-bc)' : 'var(--t0731-gr)';
    // h6, then pre inside it, then the quarter turn
    rot.style.opacity = pr(t, [14.4, 15.4]);
    pre.style.opacity = pr(t, [18.9, 19.9]);
    const a = pr(t, [23.4, 26.4]);
    rot.style.transform = `rotate(${90 * a}deg)`;
    h6.style.borderColor = teach ? 'var(--t0731-6c)' : 'var(--t0731-gr)';
    pre.style.borderColor = teach ? 'var(--t0731-pc)' : 'var(--t0731-gr)';
    h6.style.backgroundColor = pre.style.backgroundColor = teach ? 'var(--t0731-sc)' : 'var(--t0731-bl)';
    hb.style.opacity = 0.9 * win(t, 14.4, 27.6);
    pb.style.opacity = 0.9 * win(t, 18.9, 27.6);
    // same-color patches where a rotated pillar meets a band of body (no seam in the real colors)
    patches.forEach((e) => (e.style.opacity = !teach && a === 1 ? 1 : 0));
    [[0.3, 3.8], [4.3, 8.8], [9.3, 13.8], [14.3, 18.3], [18.8, 22.8], [23.3, 27.6]].forEach(([p, z], k) => L(k + 1).forEach((e) => (e.style.opacity = win(t, p, z) * ann)));
    let txt;
    if (step === 0) txt = `html${c} 360 × 260 · (20${sc} 20)`;
    else if (step === 1) txt = `${fr ? 'disques' : 'discs'}${c} ${Math.round(d)}px · x = 50, 150, 250, 350`;
    else if (step === 2) txt = `body${c} 300 × 260 · ${fr ? 'bandes' : 'bands'} ${Math.round(bw)}px`;
    else if (step === 3) txt = `h6${c} 200 × 140 · (60${sc} 110) · ${fr ? 'contenu' : 'content'} 20px`;
    else if (step === 4) txt = `pre${c} 200 × 140 · (0${sc} 30) · margin-top -140px`;
    else if (step === 5) txt = `rotate${c} ${f2(90 * a).replace(/[.,]00$/, '')}deg`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
