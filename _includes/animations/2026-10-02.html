<figure class="anim t1002" data-duration="25" data-scene="t1002" data-wide="-50 -40 500 380" style="--bg:#141413">
<style>

<div class="anim-col">

<i class="t1002-g t1002-eye t1002-e2"></i>

</div>
<div class="anim-side">
<pre class="code" aria-hidden="true"><span data-on="3">&lt;h2></span><span data-on="4" data-tone="2">&lt;h6>&lt;h6></span>&lt;style>*{<span data-on="1">background:#141413;margin:40 100</span>;<span data-on="1 2 3 4 6">border:solid#D97757;border-width:30 20 0</span>;*{<span data-on="2" data-tone="2">margin:-6%20 13</span>;*{<span data-on="3 4">margin:0-6ex -8q</span>;<span data-on="5" data-tone="2">zoom:1.67</span></pre>
<div class="now" aria-live="polite">
<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="html : une arche"><h3>1. html : une arche</h3><p><code>*</code> touche d'abord <code>html</code>. Son fond sombre part sur le canevas. <code>margin:40 100</code> en fait une boîte de 200×220, et sa bordure corail de 30px en haut, 20px sur les côtés et 0 en bas dessine une arche.</p></div>
<div class="cap" data-t="3.5" data-step="body : une seconde arche, les yeux"><h3>2. body : une seconde arche, les yeux</h3><p>Le <code>body</code> reçoit le même fond et la même bordure. <code>margin:-6%20 13</code> : −6 % de 160px, soit −9,6px, le fait remonter sous la bordure de <code>html</code>. Entre les deux arches, deux couloirs de 20px restent sombres. Les bandes de l'étape suivante les fermeront à y=90 : ce sont les yeux.</p></div>
<div class="cap" data-t="7" data-step="h2 : une bande large"><h3>3. h2 : une bande large</h3><p><code>&lt;h2></code> a la même bordure, sans hauteur de contenu : c'est une bande pleine de 30px. <code>margin:0-6ex</code> la fait déborder de 6ex de chaque côté, et un <code>ex</code> dépend de la taille de police : 24px pour un <code>h2</code>, environ 66px de débord.</p></div>
<div class="cap" data-t="10.5" data-step="h6 : deux bandes étroites"><h3>4. h6 : deux bandes étroites</h3><p>Même règle pour les deux <code>&lt;h6></code>, mais leur police fait 10,7px : 6ex ne valent plus que 30px. Leur marge basse de <code>-8q</code> (−7,6px) fait chevaucher les bandes.</p></div>
<div class="cap" data-t="14" data-step="zoom:1.67"><h3>5. zoom:1.67</h3><p><code>zoom:1.67</code> grossit les trois titres : bordures, marges et débords. Les bandes passent à 50px de haut. Le <code>h2</code> fait 300px de large : les bras. Les <code>h6</code> remplissent le ventre jusqu'à y=215.</p></div>
<div class="cap" data-t="17.5" data-step="Les jambes"><h3>6. Les jambes</h3><p>Sous les bandes, il reste les bordures latérales des deux arches, 20px chacune, jusqu'en bas de <code>html</code> : quatre jambes. Comme la bordure du bas vaut 0, rien ne les relie en bas.</p></div>
<div class="cap" data-t="21" data-step="Au pixel près" data-live="141 caractères · 100 % identique"><h3>7. Au pixel près</h3><p>Cinq boîtes et une seule bordure : le monstre en 141 caractères.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html: an arch"><h3>1. html: an arch</h3><p><code>*</code> matches <code>html</code> first. Its dark background goes to the canvas. <code>margin:40 100</code> makes it a 200×220 box, and its coral border, 30px at the top, 20px on the sides and 0 at the bottom, draws an arch.</p></div>
<div class="cap" data-t="3.5" data-step="body: a second arch, the eyes"><h3>2. body: a second arch, the eyes</h3><p><code>body</code> gets the same background and border. <code>margin:-6%20 13</code>: −6% of 160px is −9.6px, which pulls it up under <code>html</code>'s border. Between the two arches, two 20px-wide gaps stay dark. The bands of the next step close them at y=90: those are the eyes.</p></div>
<div class="cap" data-t="7" data-step="h2: a wide band"><h3>3. h2: a wide band</h3><p><code>&lt;h2></code> has the same border and no content height: it is a solid 30px band. <code>margin:0-6ex</code> makes it stick out by 6ex on each side, and an <code>ex</code> depends on the font size: 24px for an <code>h2</code>, about 66px of overhang.</p></div>
<div class="cap" data-t="10.5" data-step="h6: two narrow bands"><h3>4. h6: two narrow bands</h3><p>Same rule for both <code>&lt;h6></code>, but their font is 10.7px: 6ex is only 30px. Their <code>-8q</code> bottom margin (−7.6px) makes the bands overlap.</p></div>
<div class="cap" data-t="14" data-step="zoom:1.67"><h3>5. zoom:1.67</h3><p><code>zoom:1.67</code> scales up all three headings: borders, margins and overhangs. The bands grow to 50px. The <code>h2</code> is 300px wide: the arms. The <code>h6</code> fill the belly down to y=215.</p></div>
<div class="cap" data-t="17.5" data-step="The legs"><h3>6. The legs</h3><p>Below the bands, what is left are the side borders of the two arches, 20px each, down to the bottom of <code>html</code>: four legs. The bottom border is 0, so nothing joins them at the bottom.</p></div>
<div class="cap" data-t="21" data-step="Pixel-perfect" data-live="141 characters · 100% match"><h3>7. Pixel-perfect</h3><p>Five boxes and one border: the monster in 141 characters.</p></div>
{%- endif %}
</div>

</div>
</div>
<script>
(window.AnimScenes = window.AnimScenes || {}).t1002 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const ah = $('.t1002-ah'), ab = $('.t1002-ab'), [b2, b6a, b6b] = $$('.t1002-bd'), live = $('.live');
  const end = $$('.cap').pop().dataset.live;
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const lerp = (a, b, m) => a + (b - a) * m;
  const mix = (a, b, m) => `rgb(${[0, 1, 2].map((i) => Math.round(a[i] + (b[i] - a[i]) * m)).join(' ')})`;
  const CORAL = [217, 119, 87];
  const TEACH = { b: [95, 179, 232], h2: [232, 197, 71], h6: [143, 209, 106] };
  // Heading rectangles (x, y, w, h) without zoom and with zoom:1.67, measured in Chrome (the h2 drawn at 50..350, as on the judge).
  const R = [[[93.7, 90.4, 212.6, 30], [50, 90, 300, 50]], [[130.4, 112.9, 139.2, 30], [110, 128, 180, 50]], [[130.4, 135.3, 139.2, 30], [110, 165, 180, 50]]];
  const n = (v, d = 0) => v.toFixed(d).replace('.', fr ? ',' : '.');
  const c = fr ? ' :' : ':';
  return (t, step) => {
    const show = (sel, a, b) => $$(sel).forEach((e) => { e.style.opacity = pr(t, a, a + 0.6) * (1 - pr(t, b - 0.4, b)); });
    const real = fig.dataset.teach === '1' ? pr(t, 21, 21.8) : 1;
    ah.style.opacity = pr(t, 0.4, 1.4);
    ab.style.opacity = pr(t, 3.7, 4.6);
    ab.style.borderColor = mix(TEACH.b, CORAL, real);
    // 1px more under the h2 band (hidden by it) so that no seam shows between them once the stage is scaled.
    ab.style.borderTopWidth = t >= 7.2 ? '31px' : '30px';
    const z = pr(t, 14.3, 16.5);
    [b2, b6a, b6b].forEach((e, i) => {
      const [a, b] = R[i];
      const [x, y, w, h] = a.map((v, k) => lerp(v, b[k], z));
      e.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${mix(i ? TEACH.h6 : TEACH.h2, CORAL, real)};opacity:${i ? pr(t, 10.7 + (i - 1) * 0.6, 11.4 + (i - 1) * 0.6) : pr(t, 7.2, 8)}`;
    });
    show('.t1002-g-h', 0.4, 3.5); show('.t1002-l-h', 0.4, 3.5);
    show('.t1002-g-b', 3.7, 7); show('.t1002-l-b', 3.7, 7);
    show('.t1002-eye', 5, 10.5); show('.t1002-l-e', 5, 10.5);
    show('.t1002-l-2', 7.2, 10.5); show('.t1002-l-6', 10.7, 14); show('.t1002-l-z', 14.2, 17.5);
    show('.t1002-leg', 17.7, 21); show('.t1002-l-k', 17.7, 21);
    let txt = '';
    if (step === 0) txt = `html${c} 200 × 220 ${fr ? 'en' : 'at'} (100, 40) · border 30 20 0`;
    else if (step === 1) txt = `margin-top${c} −6% × 160 = ${n(-9.6, 1)} px · body x 140 → 260`.replace('6%', fr ? '6 %' : '6%');
    else if (step === 2) txt = `h2${c} 24 px · 6ex ≈ ${n(66.3, 1)} px · ${fr ? 'largeur' : 'width'} ${n(212.6, 1)} px`;
    else if (step === 3) txt = `h6${c} ${n(10.7, 1)} px · 6ex ≈ ${n(29.6, 1)} px · ${fr ? 'largeur' : 'width'} ${n(139.2, 1)} px`;
    else if (step === 4) txt = `zoom${c} ${n(1 + 0.67 * z, 2)} · ${fr ? 'bandes' : 'bands'} ${n(30 + 20 * z)} px · h2 ${n(lerp(212.6, 300, z))} px`;
    else if (step === 5) txt = `${fr ? 'jambes' : 'legs'}${c} x 100, 140, 240, 280 · y 215 → 260`;
    else txt = end;
    live.textContent = txt;
  };
};
</script>
</figure>
