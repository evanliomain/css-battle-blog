<div class="cap" data-t="0" data-step="Le canevas"><h3>1. Un fond pour le canevas</h3><p><code>&lt;dl>&lt;p></code> ouvre deux éléments, et aucun ne ferme l'autre : la page est html > body > dl > p. <code>*</code> vise tous les éléments, mais head et style ne sont pas affichés. Il reste html, body, dl et p. html est la racine : son fond <code>#3157b4</code> est peint sur tout le canevas, quelle que soit la taille de sa boîte.</p></div>
<div class="cap" data-t="4.5" data-step="Quatre boîtes"><h3>2. Quatre boîtes au centre</h3><p><code>height:7;width:7</code> (sans unité, des px en mode quirks) : quatre boîtes de 7 × 7. <code>offset:ray(0deg</code> leur donne un chemin. Au départ du chemin, le centre de la boîte est posé au centre de son bloc conteneur. Pour html, c'est le canevas : (200, 150). body est posé au centre de html, dl au centre de body, p au centre de dl. Les quatre boîtes s'empilent de (196,5 ; 146,5) à (203,5 ; 153,5). Leur fond bleu ne se voit pas sur le canevas bleu.</p></div>
<div class="cap" data-t="9.5" data-step="Quarts de tour"><h3>3. Un quart de tour chacune</h3><p>Une boîte sur un chemin se tourne dans le sens du chemin. Le rayon à 0deg pointe vers le haut, et la boîte tourne de 0° − 90° = −90° : un quart de tour vers la gauche. Une boîte tourne avec tout ce qu'elle contient, donc le tour d'un enfant s'ajoute à celui de son parent : html −90°, body −180°, dl −270°, p −360°, comme s'il n'avait pas tourné.</p></div>
<div class="cap" data-t="15.5" data-step="Ombre verte"><h3>4. L'ombre verte</h3><p>Voici l'ombre de p, qui n'a pas tourné. <code>60px 60px 0 39q#84be8d</code> copie la boîte 60px à droite et 60px plus bas, sans flou, et la grossit de 39q = 36,85px de chaque côté : un carré de 7 + 2 × 36,85 = 80,70, de (219,65 ; 169,65) à (300,35 ; 250,35). <code>border-radius:50%0 0</code> arrondit le coin en haut à gauche de 3,5px. Dans l'ombre, ce coin devient un quart de cercle de 3,5 + 36,85 = 40,35, la moitié du côté, tourné vers le centre.</p></div>
<div class="cap" data-t="20" data-step="Ombre marine"><h3>5. L'ombre bleu marine dessous</h3><p><code>60px 60px 0 49q#060f55</code> fait la même chose avec 49q = 46,30px : un carré de 99,60, de (210,20 ; 160,20) à (309,80 ; 259,80), avec un quart de cercle de 49,80. La première ombre de la liste est peinte au-dessus : le vert couvre le bleu marine, sauf un bord de 49q − 39q = 10q = 9,45px.</p></div>
<div class="cap" data-t="24.5" data-step="Quatre feuilles"><h3>6. Quatre feuilles</h3><p>Les quatre boîtes ont les mêmes ombres, mais chacune les porte dans son propre sens. La feuille de html part en haut à droite, celle de body en haut à gauche, celle de dl en bas à gauche, et celle de p reste en bas à droite. Le coin arrondi fait toujours face au centre. Entre deux feuilles, il reste 2 × (60 − 49,80) = 20,40px de fond.</p></div>
<div class="cap" data-t="29.5" data-step="Résultat" data-live="145 caractères · 100 % identique"><h3>7. Résultat : 145 caractères</h3><p>Une boîte de 7px, deux ombres et un rayon : quatre quarts de tour emboîtés envoient la même feuille encadrée dans les quatre coins.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="The canvas"><h3>1. A background for the canvas</h3><p><code>&lt;dl>&lt;p></code> opens two elements, and neither closes the other: the page is html > body > dl > p. <code>*</code> targets every element, but head and style are not displayed. That leaves html, body, dl and p. html is the root: its <code>#3157b4</code> background is painted on the whole canvas, whatever the size of its box.</p></div>
<div class="cap" data-t="4.5" data-step="Four boxes"><h3>2. Four boxes in the middle</h3><p><code>height:7;width:7</code> (no unit: px in quirks mode) makes four 7 × 7 boxes. <code>offset:ray(0deg</code> gives them a path. At the start of the path, the box's center is put at the center of its containing block. For html, that is the canvas: (200, 150). body goes to the center of html, dl to the center of body, p to the center of dl. The four boxes stack from (196.5, 146.5) to (203.5, 153.5). Their blue background does not show on the blue canvas.</p></div>
<div class="cap" data-t="9.5" data-step="Quarter turns"><h3>3. A quarter turn each</h3><p>A box on a path turns to follow the path. The ray at 0deg points up, and the box turns by 0° − 90° = −90°: a quarter turn to the left. A box turns with everything inside it, so a child's turn adds to its parent's: html −90°, body −180°, dl −270°, p −360°, as if it had not turned.</p></div>
<div class="cap" data-t="15.5" data-step="Green shadow"><h3>4. The green shadow</h3><p>Here is p's shadow, as p has not turned. <code>60px 60px 0 39q#84be8d</code> copies the box 60px right and 60px down, with no blur, and grows it by 39q = 36.85px on each side: a square of 7 + 2 × 36.85 = 80.70, from (219.65, 169.65) to (300.35, 250.35). <code>border-radius:50%0 0</code> rounds the top left corner by 3.5px. In the shadow, that corner becomes a quarter circle of 3.5 + 36.85 = 40.35, half the side, facing the center.</p></div>
<div class="cap" data-t="20" data-step="Navy shadow"><h3>5. The navy shadow below</h3><p><code>60px 60px 0 49q#060f55</code> does the same with 49q = 46.30px: a 99.60 square, from (210.20, 160.20) to (309.80, 259.80), with a 49.80 quarter circle. The first shadow in the list is painted on top: the green covers the navy, except for a 49q − 39q = 10q = 9.45px rim.</p></div>
<div class="cap" data-t="24.5" data-step="Four leaves"><h3>6. Four leaves</h3><p>The four boxes have the same shadows, but each one carries them its own way round. html's leaf goes to the top right, body's to the top left, dl's to the bottom left, and p's stays at the bottom right. The round corner always faces the center. Between two leaves, 2 × (60 − 49.80) = 20.40px of background is left.</p></div>
<div class="cap" data-t="29.5" data-step="Result" data-live="145 characters · 100% match"><h3>7. Result: 145 characters</h3><p>A 7px box, two shadows and a ray: four nested quarter turns send the same framed leaf to the four corners.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0507 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.5), 1 - pr(t, b - 0.3, b));
  const c = fr ? ' :' : ':';
  const n = (v) => (fr ? String(v).replace('.', ',') : String(v));
  // Measured on the official code in local Chrome (400 × 300 page, quirks mode):
  // html, body, dl and p are 7 × 7, all at (196.5, 146.5) (a test copy with a red background on p: pixels 196 and 203 half covered).
  // offset-rotate auto turns each box by 0deg − 90deg, added to its parent's: a test copy with one shadow color per element
  // puts html's leaf top right, body's top left, dl's bottom left, p's bottom right.
  // Shadows: 60px 60px 0 36.8504px #84be8d, 60px 60px 0 46.2992px #060f55, border-radius 50% 0 0 (3.5px).
  // The last frame draws the same 7 × 7 boxes with the same shadows, turned around (200, 150). They are moved there by a
  // transform, as the offset path does, not by left/top: a fractional left is snapped to whole pixels and shifts the edges.
  const FIN = 29.5;
  const ROT = [-90, -180, -270, -360];
  const TC = [[250, 204, 21], [244, 114, 182], [34, 211, 238], [251, 146, 60]];
  const BLUE = [49, 87, 180], GREEN = [132, 190, 141], NAVY = [6, 15, 85], WHITE = [255, 255, 255];
  const G = 36.8504, N = 46.2992;
  const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
  const rgba = (col, a) => `rgb(${col.join(' ')} / ${a.toFixed(3)})`;
  const boxes = $$('.t0507-g'), arrows = $$('.t0507-a'), ring = $('.t0507-ring');
  const labs = $$('.zlab[data-l]');
  const ivs = [[0.3, 4.3], [4.8, 9.2], [9.8, 15.2], [15.8, 19.8], [20.3, 24.2], [26.6, 29.3]];
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const fin = pr(t, FIN + 0.2, FIN + 0.9);
    const tw = teach ? 1 - fin : 0;
    boxes.forEach((b, i) => {
      const fill = mix(BLUE, TC[i], tw * pr(t, 4.8, 5.6));
      b.style.background = rgba(fill, 1);
      const navy = mix(NAVY, TC[i], tw);
      let gs = G, ns = N, ga, na, rot;
      if (i === 3) {
        gs = G * pr(t, 16.2, 18.2);
        ns = N * pr(t, 20.8, 22.8);
        ga = pr(t, 15.8, 16.2);
        na = pr(t, 20.3, 20.7);
        rot = 0;
      } else {
        ga = na = pr(t, 24.8, 25.2);
        rot = ROT[i] * pr(t, 25.4, 27.8);
      }
      b.style.boxShadow = `60px 60px 0 ${gs.toFixed(4)}px ${rgba(GREEN, ga)}, 60px 60px 0 ${ns.toFixed(4)}px ${rgba(navy, na)}`;
      b.style.transform = `translate(196.5px, 146.5px) rotate(${rot}deg)`;
    });
    arrows.forEach((a, i) => {
      a.style.transform = `rotate(${ROT[i] * pr(t, 10.4, 13.6)}deg)`;
      const o = i === 3 ? win(t, 9.8, 24.2) : Math.max(win(t, 9.8, 15.2), win(t, 25.2, 29.3));
      a.style.opacity = o;
      a.firstChild.style.color = rgba(teach ? TC[i] : WHITE, 1);
    });
    ring.style.opacity = win(t, 4.8, 9.2);
    labs.forEach((l) => {
      l.style.opacity = win(t, ...ivs[+l.dataset.l - 1]);
    });
    let txt;
    if (step === 0) txt = `* → html, head, body, dl, p, style · html${c} #3157b4`;
    else if (step === 1) txt = `7 × 7 · (${n(196.5)}${fr ? ' ; ' : ', '}${n(146.5)}) → (${n(203.5)}${fr ? ' ; ' : ', '}${n(153.5)})`;
    else if (step === 2) txt = 'html −90° · body −180° · dl −270° · p −360°';
    else if (step === 3) txt = `39q = ${n(36.85)}px · 7 + 2 × ${n(36.85)} = ${n('80.70')} · r = ${n(3.5)} + ${n(36.85)} = ${n(40.35)}`;
    else if (step === 4) txt = `49q = ${n('46.30')}px · 7 + 2 × ${n('46.30')} = ${n('99.60')} · 10q = ${n(9.45)}px`;
    else if (step === 5) txt = `html ↗ · body ↖ · dl ↙ · p ↘`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
