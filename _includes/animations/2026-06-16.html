<div class="cap" data-t="0" data-step="html"><h3>1. html, un carré de 260</h3><p><code>&lt;img></code> donne cinq éléments : html, head, body, img et style. <code>*</code> les touche tous. La marge <code>5%70</code> de html se lit 5 % de 400 = 20px en haut et en bas, et 70px sur les côtés. En mode quirks, html remplit la hauteur : 300 − 40 = 260 et 400 − 140 = 260. Un carré, en (70, 20). Son fond brun couvre tout le canevas.</p></div>
<div class="cap" data-t="4.5" data-step="Quatre coins"><h3>2. Un disque, quatre coins</h3><p>Le <code>border-image</code> de html est un disque jaune de <code>2.2em</code> = 35,2px de rayon, au centre d'une image de 260 × 260. La découpe <code>230</code> coupe à 230px de chaque bord : 230 + 230 dépasse 260, donc seuls les quatre coins sont peints. Chaque coin est un morceau de 230 × 230 qui contient tout le disque. <code>8lh</code> vaut 8 × 18 = 144px, trop pour deux coins sur 260 : ils sont réduits à 130px. Quatre disques de 19,9px de rayon.</p></div>
<div class="cap" data-t="10.5" data-step="html tourne"><h3>3. html tourne de 45°</h3><p><code>&amp;</code> est html, <code>&amp;>*</code> ses enfants head et body. html tourne autour de son centre, (200, 150). Les disques étaient à 56,52px du centre sur chaque axe : ils passent sur les axes, à 56,52 × √2 = 79,93px. À gauche, à droite, en haut et en bas.</p></div>
<div class="cap" data-t="15" data-step="body"><h3>4. body, quatre carrés</h3><p>body a la marge <code>50</code> : 160 × 160 en (120, 70), au même centre. Il est dans html, donc déjà tourné de 45°. Sa police de <code>1in</code> = 96px fait un disque de 211,2px : il couvre toute l'image. La découpe 230 dépasse 160 : chaque coin montre l'image entière, toute jaune. <code>8lh</code> = 8 × 7,56 = 60,47px : quatre carrés jaunes aux coins, une croix brune entre eux.</p></div>
<div class="cap" data-t="19.5" data-step="body tourne"><h3>5. body tourne encore</h3><p>body a aussi son <code>rotate:45deg</code> : 45 + 45 = 90°. Un carré aux quatre coins pareils, tourné d'un quart de tour, reste le même. Il se pose à plat, de 120 à 280. Son fond brun cache la moitié intérieure de chaque disque : il reste quatre demi-cercles.</p></div>
<div class="cap" data-t="24" data-step="img"><h3>6. img, le centre</h3><p>img, sans source, n'a pas de contenu. <code>padding:30</code> lui donne 60 × 60, et la marge 50 la place en (170, 120), au centre. Ses coins de 60,47px sont réduits à 30px : quatre coins de 30 × 30, tout jaunes. Elle couvre le milieu de la croix brune et laisse quatre rectangles bruns.</p></div>
<div class="cap" data-t="28.5" data-step="Résultat" data-live="160 caractères · 100 % identique"><h3>7. Résultat : 160 caractères</h3><p>Un seul <code>border-image</code> sur trois éléments. La police change sa taille : des disques sur html, des carrés pleins sur body et img.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html"><h3>1. html, a 260 square</h3><p><code>&lt;img></code> gives five elements: html, head, body, img and style. <code>*</code> selects them all. html's margin <code>5%70</code> reads 5% of 400 = 20px at the top and bottom, and 70px on the sides. In quirks mode html fills the height: 300 − 40 = 260 and 400 − 140 = 260. A square, at (70, 20). Its brown background covers the whole canvas.</p></div>
<div class="cap" data-t="4.5" data-step="Four corners"><h3>2. One disc, four corners</h3><p>html's <code>border-image</code> is a yellow disc of radius <code>2.2em</code> = 35.2px, in the middle of a 260 × 260 image. The slice <code>230</code> cuts 230px from each edge: 230 + 230 is more than 260, so only the four corners are painted. Each corner is a 230 × 230 piece that holds the whole disc. <code>8lh</code> is 8 × 18 = 144px, too much for two corners on 260: they shrink to 130px. Four discs of radius 19.9px.</p></div>
<div class="cap" data-t="10.5" data-step="html turns"><h3>3. html turns 45°</h3><p><code>&amp;</code> is html, <code>&amp;>*</code> its children head and body. html turns around its center, (200, 150). The discs were 56.52px from the center on each axis: they move onto the axes, 56.52 × √2 = 79.93px away. Left, right, top and bottom.</p></div>
<div class="cap" data-t="15" data-step="body"><h3>4. body, four squares</h3><p>body has the margin <code>50</code>: 160 × 160 at (120, 70), same center. It sits in html, so it is already turned 45°. Its <code>1in</code> = 96px font makes a 211.2px disc: it covers the whole image. The slice 230 is more than 160: each corner shows the whole image, all yellow. <code>8lh</code> = 8 × 7.56 = 60.47px: four yellow squares at the corners, a brown cross between them.</p></div>
<div class="cap" data-t="19.5" data-step="body turns"><h3>5. body turns again</h3><p>body has its own <code>rotate:45deg</code> too: 45 + 45 = 90°. A square with four equal corners, turned a quarter, looks the same. It lies flat, from 120 to 280. Its brown background hides the inner half of each disc: four half circles are left.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0616 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? ' :' : ':';
  const n2 = (v) => (fr ? String(v).replace('.', ',') : String(v));
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  // Measured on the official code in local Chrome (400 × 300 iframe, quirks mode, getBoundingClientRect, getComputedStyle):
  // html 260 × 260 at (70, 20) (margin 20px 70px), rotate 45deg around (200, 150), font 16px, line height 18px,
  // border-image-width 144px (shrunk to 130px: 2 × 144 > 260), gradient radius 35.2px.
  // body 160 × 160 at (120, 70), font 96px / 7.55906px, border-image-width 60.4724px, gradient radius 211.2px;
  // its four corners are painted 60px wide (gap 180..219). img 60 × 60 at (170, 120), padding 30px, rotate none.
  // html alone: discs of about 40px across, centered near (143.5, 93.5) before the turn, at x 100..139 on row 150 after.
  const FIN = 28.5, YEL = '#f7cb71', BR = '#7c3219';
  const html = $('.t0616-html'), body = $('.t0616-body'), img = $('.t0616-img');
  const discs = $$('.t0616-d'), pcs = $$('.t0616-pc');
  const bcs = $$('.t0616-body > i'), ics = $$('.t0616-img > i');
  const hb = $('.t0616-hb'), bx = $('.t0616-bx');
  const labs = $$('.zlab');
  // corner pieces: start (230 × 230 pieces of the 260 image), end (130 × 130 quadrants); disc center inside the piece
  const P = [[0, 0, 0, 0, 130, 130], [30, 0, 130, 0, 100, 130], [0, 30, 0, 130, 130, 100], [30, 30, 130, 130, 100, 100]];
  return (t, step) => {
    const wide = fig.dataset.view === 'wide';
    const teach = fig.dataset.teach === '1';
    const tw = teach ? 1 - pr(t, [FIN, FIN + 0.8]) : 0;
    const out = 1 - pr(t, [FIN, FIN + 0.6]);
    hb.style.opacity = Math.min(pr(t, [0.3, 1]), out);
    const hr = 45 * pr(t, [11, 13.4]);
    hb.style.transform = html.style.transform = `rotate(${hr}deg)`;
    const co = Math.cos(hr * Math.PI / 180), si = Math.sin(hr * Math.PI / 180);
    const dOn = pr(t, [4.8, 5.6]), pOn = Math.min(pr(t, [5.8, 6.5]), 1 - pr(t, [15.2, 16]));
    const m = pr(t, [7, 9.6]);
    const dc = mix(tw, 'var(--t0616-dk)', YEL);
    P.forEach(([x0, y0, x1, y1, rx, ry], i) => {
      const w = 230 + (130 - 230) * m, s = w / 230;
      const x = x0 + (x1 - x0) * m, y = y0 + (y1 - y0) * m;
      const pc = pcs[i], d = discs[i];
      pc.style.left = `${x}px`; pc.style.top = `${y}px`; pc.style.width = pc.style.height = `${w}px`;
      pc.style.opacity = pOn;
      const r = 35.2 * s, dx = x + rx * s - 130, dy = y + ry * s - 130;
      const cx = 200 + dx * co - dy * si, cy = 150 + dx * si + dy * co;
      d.style.left = `${cx - r}px`; d.style.top = `${cy - r}px`; d.style.width = d.style.height = `${2 * r}px`;
      d.style.setProperty('--t0616-dc', dc);
      d.style.opacity = dOn;
    });
    const bo = pr(t, [15.4, 16.4]);
    body.style.opacity = bo;
    bx.style.opacity = Math.min(bo, out);
    const br = 45 + 45 * pr(t, [20, 22.4]);
    body.style.transform = bx.style.transform = `rotate(${br}deg)`;
    body.style.background = mix(tw, 'var(--t0616-bb)', BR);
    const bc = mix(tw, 'var(--t0616-bc)', YEL);
    bcs.forEach((q) => { q.style.background = bc; });
    img.style.opacity = pr(t, [24.4, 25.4]);
    img.style.background = mix(tw, 'var(--t0616-im)', YEL);
    ics.forEach((q) => { q.style.opacity = out; });
    labs.forEach((l) => {
      const n = +l.dataset.l, second = l.classList.contains('t0616-l2');
      l.style.left = `calc(${wide ? 420 : 400}px - 4px * var(--k, 1))`;
      l.style.top = wide ? `calc(350px - ${second ? 22 : 40}px * var(--k, 1))` : (second ? 'calc(300px - 1px * var(--k, 1))' : 'calc(1px * var(--k, 1))');
      const ivs = [[0.3, 4.5], [4.8, 10.5], [10.8, 15], [15.3, 19.5], [19.8, 24], [24.3, FIN]];
      l.style.opacity = win(t, ...ivs[n - 1]);
    });
    let txt;
    if (step === 0) txt = `html${c} 260 × 260 ${fr ? 'en' : 'at'} (70, 20)`;
    else if (step === 1) txt = `html${c} ${fr ? '4 coins de 130, disques de' : '4 corners of 130, discs of'} r = ${n2(19.9)}`;
    else if (step === 2) txt = `html${c} 45° · ${n2(79.93)}px ${fr ? 'du centre' : 'from the center'}`;
    else if (step === 3) txt = `body${c} 160 × 160 · 8lh = ${n2(60.47)}px`;
    else if (step === 4) txt = `body${c} 45° + 45° = 90°`;
    else if (step === 5) txt = `img${c} 60 × 60 ${fr ? 'en' : 'at'} (170, 120)`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
