{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="html"><h3>1. html et le fond</h3><p>Pas de doctype : la page est en mode quirks, et une longueur sans unité y vaut des px. html remplit la page moins ses marges : <code>margin:42 92</code> lui laisse 400 − 2 × 92 = 216 de large et 300 − 2 × 42 = 216 de haut. <code>&amp;</code> au premier niveau vise la racine, html, dont le fond est peint sur tout le canevas. <code>#16a4</code> vaut <code>#1166aa44</code> : un bleu opaque à 26,7 %, qui donne <code>#c0d6e8</code> sur le blanc de la page.</p></div>
<div class="cap" data-t="4.5" data-step="Quatre images"><h3>2. body et quatre images vides</h3><p>body garde sa marge par défaut de 8px : 200 × 200 en (100, 50). Les quatre <code>&lt;img></code> n'ont pas d'image : leur contenu fait 0 × 0, et <code>padding:50</code> en fait des boîtes de 100 × 100. Elles sont en ligne : deux par ligne dans les 200px de body. En mode quirks, une ligne qui ne contient que des images ne garde pas de place sous la ligne de base : les deux rangées se touchent, en y = 50 et y = 150.</p></div>
<div class="cap" data-t="9.5" data-step="Un dégradé"><h3>3. Un seul dégradé</h3><p>Les quatre images reçoivent <code>radial-gradient(#3f4869,2.2em,#e25c57 0 73em,#3f4869 0)</code>. Sur une image normale, la police fait 16px : 2.2em = 35,2px et 73em = 1168px. Cela donne un disque bleu de rayon 35,2 au centre, puis du rouge bien au-delà des coins, à 70,7px du centre. Sans la règle <code>[r]</code>, mon rendu montre ce dessin sur les quatre cases.</p></div>
<div class="cap" data-t="15" data-step="Les arrêts à 0"><h3>4. Des arrêts à 0</h3><p>Après <code>#3f4869</code>, la virgule fait de <code>2.2em</code> un simple repère entre deux couleurs. Un arrêt ne peut pas revenir avant un arrêt ou un repère précédent : <code>#e25c57 0</code> est avancé jusqu'à 2.2em. Le bleu va donc de 0 à 2.2em et le rouge part de 2.2em : un bord net. De même, <code>#3f4869 0</code> est avancé jusqu'à 73em : après 73em, tout est bleu.</p></div>
<div class="cap" data-t="20" data-step="Police à 3 %"><h3>5. Une police de 3 %</h3><p><code>[r]{font:3%a}</code> donne aux deux images <code>r</code> une police de 3 % de 16px : 0,48px. <code>a</code> est un nom de police, obligatoire dans <code>font</code>. Le même dégradé se recalcule avec ce petit em : 2.2em = 1,056px, un point bleu au centre, et 73em = 35,04px. Le rouge devient un disque de rayon 35,04, et le bleu remplit le reste de la case.</p></div>
<div class="cap" data-t="26" data-step="Résultat" data-live="156 caractères · 100 % identique"><h3>6. Résultat : 156 caractères</h3><p>Un seul dégradé pour quatre images. Il est écrit en em : une police de 3 % sur deux d'entre elles suffit à inverser leurs couleurs.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html"><h3>1. html and the background</h3><p>No doctype: the page is in quirks mode, and a length without a unit is px there. html fills the page minus its margins: <code>margin:42 92</code> leaves it 400 − 2 × 92 = 216 wide and 300 − 2 × 42 = 216 high. <code>&amp;</code> at the top level targets the root, html, whose background is painted on the whole canvas. <code>#16a4</code> means <code>#1166aa44</code>: a blue at 26.7% opacity, which gives <code>#c0d6e8</code> over the white page.</p></div>
<div class="cap" data-t="4.5" data-step="Four images"><h3>2. body and four empty images</h3><p>body keeps its default 8px margin: 200 × 200 at (100, 50). The four <code>&lt;img></code> have no image: their content is 0 × 0, and <code>padding:50</code> makes them 100 × 100 boxes. They are inline: two per line in body's 200px. In quirks mode, a line that holds only images keeps no room under the baseline: the two rows touch, at y = 50 and y = 150.</p></div>
<div class="cap" data-t="9.5" data-step="One gradient"><h3>3. One gradient</h3><p>All four images get <code>radial-gradient(#3f4869,2.2em,#e25c57 0 73em,#3f4869 0)</code>. On a plain image the font is 16px: 2.2em = 35.2px and 73em = 1168px. That gives a blue disc of radius 35.2 in the middle, then red far past the corners, 70.7px from the center. Without the <code>[r]</code> rule, my render shows this picture on all four squares.</p></div>
<div class="cap" data-t="15" data-step="Stops at 0"><h3>4. Stops at 0</h3><p>After <code>#3f4869</code>, the comma makes <code>2.2em</code> a plain hint between two colors. A stop cannot go back before an earlier stop or hint: <code>#e25c57 0</code> moves up to 2.2em. So blue runs from 0 to 2.2em and red starts at 2.2em: a hard edge. In the same way, <code>#3f4869 0</code> moves up to 73em: past 73em, everything is blue.</p></div>
<div class="cap" data-t="20" data-step="A 3% font"><h3>5. A 3% font</h3><p><code>[r]{font:3%a}</code> gives the two <code>r</code> images a font of 3% of 16px: 0.48px. <code>a</code> is a font name, required in <code>font</code>. The same gradient is computed again with this small em: 2.2em = 1.056px, a blue dot in the middle, and 73em = 35.04px. The red becomes a disc of radius 35.04, and blue fills the rest of the square.</p></div>
<div class="cap" data-t="26" data-step="Result" data-live="156 characters · 100% match"><h3>6. Result: 156 characters</h3><p>One gradient for four images. It is written in em: a 3% font on two of them is enough to swap their colors.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0505 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.5), 1 - pr(t, b - 0.3, b));
  const c = fr ? '\u00a0:' : ':';
  const n = (v) => (fr ? String(v).replace('.', ',') : String(v));
  // Measured on the official code in local Chrome (400 × 300 page, quirks mode):
  // html 216 × 216 at (92, 42); body 200 × 200 at (100, 50); the four imgs 100 × 100 at (100, 50), (200, 50),
  // (100, 150), (200, 150), in that order (r, plain, plain, r).
  // getComputedStyle on the gradient: plain imgs (16px) 35.2px hint, red 0 → 1168px, blue 0;
  // r imgs (font 3% of 16px) 1.056px hint, red 0 → 35.04px, blue 0. The canvas is (192, 214, 232) = #c0d6e8.
  // The scene uses the same gradients with these px values. Under the four imgs, a same-color underlay
  // (red, then the four quadrants) so that no seam shows between the squares on the scaled stage.
  const FIN = 26;
  const TEACH = { html: 'rgb(250 204 21 / .55)', body: 'rgb(244 114 182 / .45)', i: '#22d3ee', r: '#a78bfa' };
  const white = $('.t0505-w'), hb = $('.t0505-html'), bb = $('.t0505-body');
  const ur = $('.t0505-ur'), uc = $('.t0505-uc');
  const imgs = $$('.t0505-i');
  const ring = $('.t0505-ring'), ray = $('.t0505-ray'), ticks = $$('.t0505-tick'), dots = $$('.t0505-dot');
  const labs = $$('.zlab[data-l]');
  const ivs = [[0.3, 4.3], [4.8, 9.3], [10.3, 14.8], [15.3, 19.8], [20.3, 25.8]];
  const dash = 'calc(1.5px * var(--k, 1)) dashed #fff';
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const fin = pr(t, FIN + 0.2, FIN + 0.9);
    // 1. html's background over the white page, html's box
    white.style.opacity = 1 - pr(t, 0.6, 2.4);
    const hA = win(t, 0.3, 4.3);
    hb.style.opacity = hA;
    hb.style.background = teach ? TEACH.html : 'none';
    hb.style.border = teach ? '0' : dash;
    // 2. body, then the four images in flow order
    bb.style.opacity = win(t, 4.8, 9.3);
    bb.style.background = teach ? TEACH.body : 'none';
    bb.style.border = teach ? '0' : dash;
    // 3. the gradient grows in; 5. the r images' em shrinks from 16px to 0.48px
    const gA = pr(t, 9.8, 10.4), gr = pr(t, 10.4, 12.6);
    const sh = pr(t, 20.6, 23.6);
    imgs.forEach((im, i) => {
      const r = im.dataset.r === '1';
      const iA = pr(t, 5.4 + 0.6 * i, 5.9 + 0.6 * i);
      im.style.opacity = iA;
      im.style.transform = `scale(${(0.6 + 0.4 * iA).toFixed(3)})`;
      const e = r ? 16 * Math.pow(0.03, sh) : 16;
      const r1 = 2.2 * e * gr, r2 = Math.max(73 * e, r1);
      const g = im.children[0], f = im.children[1];
      g.style.opacity = gA;
      g.style.background = `radial-gradient(#3f4869 ${r1.toFixed(3)}px,#e25c57 0 ${r2.toFixed(3)}px,#3f4869 0)`;
      const col = r ? TEACH.r : TEACH.i;
      // teaching colors: a fill before the gradient, then an inner outline; otherwise a dashed outline
      f.style.background = teach && gA < 0.999 ? `color-mix(in srgb, ${col} ${((1 - gA) * 100).toFixed(1)}%, transparent)` : 'none';
      f.style.boxShadow = teach && gA > 0.001 ? `inset 0 0 0 calc(2px * var(--k, 1)) ${col}` : 'none';
      f.style.border = teach ? '0' : dash;
      f.style.opacity = teach ? 1 - fin : 1 - pr(t, FIN - 0.4, FIN);
    });
    // underlay: red while the four squares are red, then the four quadrants
    ur.style.opacity = gA;
    uc.style.opacity = pr(t, 23.6, 24);
    // 4. the gradient ray: hint and red at 35.2px, 100% at the corners (70.7px)
    const rA = win(t, 15.3, 19.8);
    ring.style.opacity = rA;
    ray.style.opacity = rA;
    ticks.forEach((k) => { k.style.opacity = rA; });
    // 5. the blue dots of radius 1.056px
    const dA = win(t, 23.4, 25.8);
    dots.forEach((d) => { d.style.opacity = dA; });
    labs.forEach((l) => {
      l.style.opacity = win(t, ...ivs[+l.dataset.l - 1]);
    });
    let txt;
    if (step === 0) txt = `html${c} 216 × 216 ${fr ? 'en' : 'at'} (92, 42) · #16a4 = #1166aa44 → #c0d6e8`;
    else if (step === 1) txt = `body${c} 200 × 200 · 4 × img${c} 0 + 2 × 50 = 100`;
    else if (step === 2) txt = `16px${c} 2.2em = ${n(35.2)}px · 73em = 1168px`;
    else if (step === 3) txt = `#e25c57 0 → 2.2em · #3f4869 0 → 73em`;
    else if (step === 4) {
      const e = 16 * Math.pow(0.03, sh);
      txt = `em = ${n(e.toFixed(2))}px · 2.2em = ${n((2.2 * e).toFixed(3))}px · 73em = ${n((73 * e).toFixed(2))}px`;
    } else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
