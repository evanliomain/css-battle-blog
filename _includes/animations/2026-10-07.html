{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="Le canevas vert"><h3>1. Le canevas vert</h3><p><code>*</code> touche d'abord <code>html</code>. Son fond vert tilleul s'étend à tout le canevas. Avec <code>zoom:2.5</code>, sa boîte de 160 × 120px CSS couvre les 400 × 300 du canevas.</p></div>
<div class="cap" data-t="3.36" data-step="Le dégradé de html, ×2,5"><h3>2. Le dégradé de html, ×2,5</h3><p><code>html</code> reçoit aussi le <code>border-image</code>. À <code>zoom:2.5</code>, les arrêts tombent à 40px et 130px : un disque ardoise, un anneau transparent, de l'ardoise partout ailleurs.</p></div>
<div class="cap" data-t="7.2" data-step="Le morceau du milieu tombe"><h3>3. Le morceau du milieu tombe</h3><p><code>40%13%</code> découpe l'image en neuf morceaux : 40 % de la hauteur en haut et en bas, 13 % de la largeur de chaque côté. Sans le mot-clé <code>fill</code>, le morceau du milieu n'est jamais peint : le vert apparaît à travers.</p></div>
<div class="cap" data-t="11.52" data-step="body : zoom ×6,25"><h3>4. body : zoom ×6,25</h3><p><code>body</code> reçoit aussi <code>zoom:2.5</code>, en plus de celui de <code>html</code> : ×6,25 au total. Sa marge par défaut de 8px devient 50px, ce qui laisse une boîte verte de 300 × 200, qui cache le trou de <code>html</code>.</p></div>
<div class="cap" data-t="15.36" data-step="Le dégradé de body : la barre"><h3>5. Le dégradé de body : la barre</h3><p>Même <code>border-image</code> sur <code>body</code>, cette fois à ×6,25 : le disque passe à 100px de rayon, et le morceau du milieu qui manque (222 × 40) devient la barre.</p></div>
<div class="cap" data-t="20.16" data-step="Résultat" data-live="112 caractères · 100 % identique"><h3>6. Résultat : 112 caractères</h3><p>Dans les vraies couleurs, les deux ardoises et les deux verts se confondent. Deux éléments, une règle : l'image exacte en 112 caractères.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="The lime canvas"><h3>1. The lime canvas</h3><p><code>*</code> matches <code>html</code> first. Its lime background spreads to the whole canvas. With <code>zoom:2.5</code>, its 160 × 120 CSS px box covers the 400 × 300 canvas.</p></div>
<div class="cap" data-t="3.36" data-step="html's gradient, ×2.5"><h3>2. html's gradient, ×2.5</h3><p><code>html</code> also gets the <code>border-image</code>. At <code>zoom:2.5</code> the stops land at 40px and 130px: a slate disc, a see-through ring, slate everywhere else.</p></div>
<div class="cap" data-t="7.2" data-step="The middle slice drops"><h3>3. The middle slice drops</h3><p><code>40%13%</code> cuts the image into nine pieces: 40% of the height at the top and the bottom, 13% of the width on each side. Without the <code>fill</code> keyword, the middle piece is never painted, so the lime shows through.</p></div>
<div class="cap" data-t="11.52" data-step="body: zoom ×6.25"><h3>4. body: zoom ×6.25</h3><p><code>body</code> gets <code>zoom:2.5</code> too, on top of <code>html</code>'s: ×6.25 in total. Its default 8px margin becomes 50px, which leaves a 300 × 200 lime box that hides <code>html</code>'s hole.</p></div>
<div class="cap" data-t="15.36" data-step="body's gradient: the bar"><h3>5. body's gradient: the bar</h3><p>Same <code>border-image</code> on <code>body</code>, now ×6.25: the disc grows to a 100px radius, and the missing middle piece (222 × 40) becomes the bar.</p></div>
<div class="cap" data-t="20.16" data-step="Result" data-live="112 characters · 100% match"><h3>6. Result: 112 characters</h3><p>In the real colors, the two slates and the two limes blend. Two elements, one rule: the exact picture in 112 characters.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t1007 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const HBI = $('.hbi'), BBI = $('.bbi'), HP = $('.hp'), BP = $('.bp'), HBOX = $('.hbox'), BBOX = $('.bbox'), live = $('.live');
  const HG = $$('.hg'), BG = $$('.bg');
  const LB = { l1: $('.l1'), l2: $('.l2'), l3a: $('.l3a'), l3b: $('.l3b'), lb: $('.lb'), l5a: $('.l5a'), l5b: $('.l5b') };
  const caps = $$('.caps .cap');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const lerp = (a, b, m) => a + (b - a) * m;
  const n = (v, d = 0) => v.toFixed(d).replace('.', fr ? ',' : '.');
  const c = fr ? ' :' : ':';
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.6), 1 - pr(t, b - 0.5, b));
  const R55 = 55 * 96 / 101.6;
  // The official border-image, or one with its stops scaled (k = zoom shown / own zoom).
  const bi = (col, k, fill) => (k === 1
    ? `radial-gradient(1Q,${col} 1pc,#0000 0 55Q,${col})40%13%${fill ? ' fill' : ''}/auto`
    : `radial-gradient(1Q,${col} ${16 * k}px,#0000 0 ${R55 * k}px,${col})40%13%${fill ? ' fill' : ''}/auto`);
  const piece = (el, w, h, r1, r2, col, d) => {
    el.style.background = `radial-gradient(circle at ${w / 2}px ${h / 2}px,${col} ${r1}px,#0000 0 ${r2}px,${col} 0)`;
    el.style.transform = `translateY(${d * 220}px) rotate(${d * 9}deg)`;
    el.style.opacity = 1 - pr(d, 0.6, 1);
  };
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const real = !teach || t >= 20.16;
    const hc = real ? '#476573' : '#2f6db5', bc = real ? '#476573' : '#8a3f8f', card = real ? '#b8d982' : '#f3e49c';
    // html: its gradient grows from ×1 to ×2.5, then the middle piece drops (t 8.6 → 10.6).
    const kh = lerp(1, 2.5, pr(t, 4.2, 6.6));
    const dh = pr(t, 8.6, 10.6);
    HBI.style.opacity = pr(t, 3.4, 4);
    HBI.style.borderImage = bi(hc, kh === 2.5 ? 1 : kh / 2.5, t < 8.6);
    HP.style.display = t >= 8.6 && dh < 1 ? '' : 'none';
    piece(HP, 296, 60, 40, 2.5 * R55, hc, dh);
    // body: margin 8 → 20 → 50, then its card, then its gradient from ×2.5 to ×6.25, then its middle piece drops.
    const m = t < 13 ? lerp(8, 20, pr(t, 12, 12.9)) : lerp(20, 50, pr(t, 13, 14));
    Object.assign(BBOX.style, { left: m + 'px', top: m + 'px', width: 400 - 2 * m + 'px', height: 300 - 2 * m + 'px', opacity: win(t, 11.6, 20.16) });
    Object.assign(LB.lb.style, { left: m + 2 + 'px', top: m + 2 + 'px', opacity: win(t, 11.8, 15.4) });
    LB.lb.textContent = m < 19.9 ? 'body · margin 8px' : m < 49.9 ? `8px × 2.5 = ${n(m)}px` : '8px × 6.25 = 50px';
    BBI.style.opacity = pr(t, 14.2, 14.9);
    BBI.style.background = card;
    const kb = lerp(2.5, 6.25, pr(t, 16, 17.6));
    const db = pr(t, 18, 19.8);
    BBI.style.borderImage = t < 15.6 ? 'none' : bi(bc, kb === 6.25 ? 1 : kb / 6.25, t < 18);
    BP.style.display = t >= 18 && db < 1 ? '' : 'none';
    piece(BP, 222, 40, 100, 6.25 * R55, bc, db);
    HBOX.style.opacity = win(t, 0.3, 3.4);
    HG.forEach((e) => { e.style.opacity = win(t, 7.4, 11.4); });
    BG.forEach((e) => { e.style.opacity = win(t, 17.6, 20.16); });
    LB.l1.style.opacity = win(t, 0.5, 3.4);
    LB.l2.style.opacity = win(t, 6.4, 7.2);
    LB.l3a.style.opacity = win(t, 7.6, 11.4);
    LB.l3b.style.opacity = win(t, 7.6, 11.4);
    LB.l5a.style.opacity = win(t, 17.6, 20.16);
    LB.l5b.style.opacity = win(t, 17.6, 20.16);
    let txt = '';
    if (step === 0) txt = fr ? 'html : 160 × 120 px CSS × 2,5 = 400 × 300' : 'html: 160 × 120 CSS px × 2.5 = 400 × 300';
    else if (step === 1) txt = `zoom ×${n(kh, 2)} · 1pc → ${n(16 * kh, 1)}px · 55Q → ${n(R55 * kh, 1)}px`;
    else if (step === 2) txt = `13% × 400 = 52px · 40% × 300 = 120px`;
    else if (step === 3) txt = `body${c} margin ${n(m, 1)}px · ${n(400 - 2 * m)} × ${n(300 - 2 * m)}`;
    else if (step === 4) txt = t < 17.8 ? `zoom ×${n(kb, 2)} · 1pc → ${n(16 * kb, 1)}px · 55Q → ${n(R55 * kb, 1)}px` : `13% × 300 = 39px · 40% × 200 = 80px`;
    else txt = caps[step].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
