<div class="cap" data-t="0" data-step="html : 340 × 80"><h3>1. <code>html</code> : 340 × 80</h3><p>Pas de doctype : la page est en mode quirks, et <code>110 30</code> sans unité veut dire des px. <code>*</code> vise <code>html</code>, <code>head</code>, <code>style</code> et <code>body</code> ; <code>head</code> et <code>style</code> ne sont pas affichés. En mode quirks, <code>html</code> remplit le cadre de 400 × 300 moins ses marges : 340 × 80, de (30 ; 110) à (370 ; 190). Son fond bleu passe au canevas : tout le cadre est bleu.</p></div>
<div class="cap" data-t="4.5" data-step="5ch = 40px : une bande"><h3>2. <code>5ch</code> = 40px : une bande</h3><p><code>html</code> garde la police par défaut, 16px en Times : 1ch = 8px, donc 5ch = 40px. <code>border-block</code> met une bordure verte en haut et en bas. Les deux font 40px et la boîte n'en fait que 80 : le contenu a 0px de haut. La bordure haute va de y = 110 à 150, la basse de 150 à 190. Elles forment une bande de x = 30 à 370.</p></div>
<div class="cap" data-t="9" data-step="body : 70 × 250"><h3>3. <code>body</code> : 70 × 250</h3><p>Le <code>*</code> imbriqué vise <code>head</code>, <code>style</code> et <code>body</code>. <code>margin:-125-0-125 270</code> : −125px en haut et en bas, 0 à droite, 270px à gauche. Le body fait 340 − 270 = 70px de large, de x = 300 à 370. En mode quirks, il remplit la hauteur du contenu de <code>html</code>, 0px, moins ses marges : 0 + 125 + 125 = 250px, de y = 25 à 275. Il a lui aussi le fond bleu.</p></div>
<div class="cap" data-t="13.5" data-step="36q : 5ch = 85px"><h3>4. <code>36q</code> : 5ch = 85px</h3><p>Le body reçoit aussi <code>border-block</code>, mais avec sa propre police. <code>font:36q'</code> : 36 quarts de millimètre, 34,02px. La famille est la chaîne vide <code>''</code>, fermée par la fin du code : Chrome reste en Times. 1ch y fait 17px, et 5ch donne une bordure de 85px. Vert de y = 25 à 110 et de 190 à 275. Le milieu bleu, de 110 à 190, cache la bande de <code>html</code> entre x = 300 et 370.</p></div>
<div class="cap" data-t="18" data-step="1in : arrondi de 70px"><h3>5. <code>1in</code> : arrondi de 70px</h3><p><code>border-radius:1in 0 0 1in</code> arrondit les deux coins de gauche : 1in = 96px. Mais en haut, 96 + 0 dépasse la largeur de 70px. Chrome réduit alors tous les rayons d'un même facteur, 70/96 : il reste 70px. La bordure gauche fait 0px, donc le bord intérieur garde son angle droit. La courbe va de (300 ; 95) à (370 ; 25), puis le bord descend tout droit jusqu'à y = 110.</p></div>
<div class="cap" data-t="22.5" data-step="box-reflect : le miroir"><h3>6. <code>box-reflect</code> : le miroir</h3><p><code>-webkit-box-reflect:left 50vw</code> peint une copie du body, retournée de gauche à droite, à sa gauche. 50vw = 200px d'écart entre le bord gauche du body (x = 300) et le bord droit de la copie : elle va de x = 30 à 100. Ses deux quarts de disque s'arrondissent vers la droite, et son milieu bleu cache la bande de <code>html</code> à gauche. Il reste le rectangle vert du milieu, de x = 100 à 300.</p></div>
<div class="cap" data-t="27" data-step="Résultat" data-live="161 caractères · 100 % identique"><h3>7. Résultat : 161 caractères</h3><p>Une bande verte pour le milieu, un body dont les bordures font les deux formes de droite, et un reflet pour celles de gauche. La même déclaration <code>border-block</code> sert aux deux éléments, avec deux tailles de <code>ch</code>.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html: 340 × 80"><h3>1. <code>html</code>: 340 × 80</h3><p>No doctype: the page is in quirks mode, and <code>110 30</code> with no unit means px. <code>*</code> matches <code>html</code>, <code>head</code>, <code>style</code> and <code>body</code>; <code>head</code> and <code>style</code> are not displayed. In quirks mode, <code>html</code> fills the 400 × 300 frame minus its margins: 340 × 80, from (30, 110) to (370, 190). Its blue background goes to the canvas: the whole frame is blue.</p></div>
<div class="cap" data-t="4.5" data-step="5ch = 40px: a band"><h3>2. <code>5ch</code> = 40px: a band</h3><p><code>html</code> keeps the default font, 16px Times: 1ch = 8px, so 5ch = 40px. <code>border-block</code> puts a green border at the top and at the bottom. Both are 40px, and the box is only 80px tall: the content is 0px tall. The top border goes from y = 110 to 150, the bottom one from 150 to 190. Together they make a band from x = 30 to 370.</p></div>
<div class="cap" data-t="9" data-step="body: 70 × 250"><h3>3. <code>body</code>: 70 × 250</h3><p>The nested <code>*</code> matches <code>head</code>, <code>style</code> and <code>body</code>. <code>margin:-125-0-125 270</code>: −125px at the top and bottom, 0 on the right, 270px on the left. The body is 340 − 270 = 70px wide, from x = 300 to 370. In quirks mode, it fills the height of the content of <code>html</code>, 0px, minus its margins: 0 + 125 + 125 = 250px, from y = 25 to 275. It also has the blue background.</p></div>
<div class="cap" data-t="13.5" data-step="36q: 5ch = 85px"><h3>4. <code>36q</code>: 5ch = 85px</h3><p>The body also gets <code>border-block</code>, but with its own font. <code>font:36q'</code>: 36 quarter millimeters, 34.02px. The family is the empty string <code>''</code>, closed by the end of the code: Chrome stays on Times. There, 1ch is 17px, and 5ch gives an 85px border. Green from y = 25 to 110 and from 190 to 275. The blue middle, from 110 to 190, hides the band of <code>html</code> between x = 300 and 370.</p></div>
<div class="cap" data-t="18" data-step="1in: a 70px rounding"><h3>5. <code>1in</code>: a 70px rounding</h3><p><code>border-radius:1in 0 0 1in</code> rounds the two left corners: 1in = 96px. But at the top, 96 + 0 is more than the 70px width. Chrome then scales all the radii by the same factor, 70/96: 70px are left. The left border is 0px, so the inner edge keeps its square corner. The curve goes from (300, 95) to (370, 25), then the edge goes straight down to y = 110.</p></div>
<div class="cap" data-t="22.5" data-step="box-reflect: the mirror"><h3>6. <code>box-reflect</code>: the mirror</h3><p><code>-webkit-box-reflect:left 50vw</code> paints a copy of the body, flipped left to right, on its left. 50vw = 200px between the left edge of the body (x = 300) and the right edge of the copy: it goes from x = 30 to 100. Its two quarter discs round toward the right, and its blue middle hides the band of <code>html</code> on the left. The green rectangle in the middle is left, from x = 100 to 300.</p></div>
<div class="cap" data-t="27" data-step="Result" data-live="161 characters · 100% match"><h3>7. Result: 161 characters</h3><p>A green band for the middle, a body whose borders make the two shapes on the right, and a reflection for the two on the left. The same <code>border-block</code> declaration serves both elements, with two sizes of <code>ch</code>.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0821 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const WH = $('.t0821-wh'), HT = $('.t0821-h[data-h="t"]'), HB = $('.t0821-h[data-h="b"]'), B = $('.t0821-b'), R = $('.t0821-r');
  const K = $$('.t0821-k'), live = $('.live');
  const G = (k) => $(`.t0821-g[data-g="${k}"]`);
  const L = (k) => $(`.t0821-l[data-l="${k}"]`);
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const mix = (a, b, p) => a.map((v, i) => v + (b[i] - v) * p);
  const box = (e, r) => { e.style.left = `${r[0]}px`; e.style.top = `${r[1]}px`; e.style.width = `${r[2]}px`; e.style.height = `${r[3]}px`; };
  const f2 = (v) => { const s = (Math.round(v * 100) / 100).toFixed(2).replace(/\.?0+$/, ''); return fr ? s.replace('.', ',') : s; };
  const c = fr ? ' :' : ':';
  // Measured on the official code (getBoundingClientRect, computed styles):
  // html 340 × 80 at (30, 110), borders 40px; body 70 × 250 at (300, 25), borders 85px, radius 96px used as 70px;
  // reflection: left 200px, so the copy spans x = 30 to 100.
  const H = [30, 110, 340, 80], BODY = [300, 25, 70, 250], HC = [30, 150, 340, 0];
  const W = { bg: [0.8, 2.4], h: [5, 6.6], b: [9.5, 11.3], bf: [11.4, 12.2], bt: [14, 15.8], rad: [18.5, 20.3], rf: [23, 25.4], fin: 27 };
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < W.fin;
    const done = t >= W.fin || (!teach && t >= W.rf[1]);
    // 1. the canvas turns blue (html's background goes to the canvas)
    WH.style.opacity = 1 - pr(t, W.bg);
    box(G('h'), H);
    G('h').style.opacity = win(t, 0.2, 13.4) * 0.9;
    // 2. html's top and bottom borders, 40px each; the bottom one starts 1px higher, under the top one (no seam)
    const ph = pr(t, W.h);
    box(HT, [30, 110, 340, 40 * ph]);
    box(HB, [30, 190 - 41 * ph, 340, 41 * ph]);

    HB.style.background = teach ? 'var(--t0821-hb)' : 'var(--t0821-gr)';
    HT.style.opacity = HB.style.opacity = !done && t >= W.h[0] ? 1 : 0;
    // 3. body: from html's 0px tall content to 70 × 250, then its background
    const pb = pr(t, W.b);
    const br = mix(HC, BODY, pb);
    box(G('b'), br);
    G('b').style.opacity = win(t, 9.2, 26.6) * 0.9;
    // 4. its borders, 85px; 5. its left corners, up to 70px
    const bw = 85 * pr(t, W.bt), rad = 70 * pr(t, W.rad);
    const paint = (e) => {
      box(e, BODY);
      e.style.borderWidth = `${bw}px 0`;
      e.style.borderColor = teach ? (e === R ? 'var(--t0821-rf)' : 'var(--t0821-bt)') : 'var(--t0821-gr)';
      e.style.background = teach ? 'var(--t0821-bb)' : 'var(--t0821-bl)';
      e.style.borderRadius = e === R ? `0 ${rad}px ${rad}px 0` : `${rad}px 0 0 ${rad}px`;
    };
    paint(B);
    B.style.opacity = done ? 0 : pr(t, W.bf);

    paint(R);
    R.style.borderRadius = `${rad}px 0 0 ${rad}px`;
    R.style.transform = `translateX(${-270 * pf}px) scaleX(${1 - 2 * pf})`;
    R.style.opacity = done ? 0 : pr(t, [W.rf[0], W.rf[0] + 0.3]);
    box(G('r'), [300 - 270 * pf, 25, 70, 250]);
    G('r').style.opacity = win(t, W.rf[0], 26.6) * 0.9;
    G('r').style.borderColor = teach ? 'var(--t0821-rf)' : 'var(--t0821-line)';

    K.forEach((e) => (e.style.opacity = done ? 1 : 0));

    lw.forEach(([a, z], k) => (L(k + 1).style.opacity = win(t, a, z)));
    let txt = '';

    else if (step === 1) txt = `border-block${c} ${f2(40 * ph)}px · y 110 → ${f2(110 + 40 * ph)} · ${f2(190 - 40 * ph)} → 190`;
    else if (step === 2) txt = `body${c} ${f2(br[2])} × ${f2(br[3])} · ${fr ? 'de' : 'from'} (${f2(br[0])}${fr ? ' ;' : ','} ${f2(br[1])})`;
    else if (step === 3) txt = `border-block${c} ${f2(bw)}px · ${fr ? 'milieu' : 'middle'} ${f2(250 - 2 * bw)}px`;
    else if (step === 4) txt = `border-radius${c} ${f2(rad)}px`;
    else if (step === 5) txt = `${fr ? 'copie' : 'copy'}${c} x ${f2(300 - 270 * pf)} → ${f2(370 - 270 * pf)}`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
