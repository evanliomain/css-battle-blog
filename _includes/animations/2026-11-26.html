<script>
(window.AnimScenes = window.AnimScenes || {}).t1126 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const DOTS = [0, 1, 2, 3].map((i) => $(`.t1126-d${i}`));
  const PILLS = [0, 1, 2, 3].map((i) => $(`.t1126-p${i}`));
  const HBOX = $('.t1126-hbox'), BODY = $('.t1126-body'), PATH = $('.t1126-path'), CEN = $('.t1126-cen');
  const ANC = $('.t1126-anc'), START = $('.t1126-start'), ARM = $('.t1126-arm');
  const K = (n) => $$(`.t1126-k${n}`);
  const L = (k) => $(`.t1126-l-${k}`);
  // measured in Chrome (quirks mode, 400 × 300):
  // html 110 × 110 at (145, 95), dotted border 40 (43q): one 40px dot per corner, centers 20px from the edges
  // body 110 × 110 at (145, 95) (margin -40 out of html's 30 × 30 content box), border 10 (11q), round
  // pills 40 × 20 (width 20 + 2 × 10 of border); without offset: dt (115, 65), dl (85, 35), dl (55, 5), p (25, -25)
  // offset: circle r 78.4252 (83q), centered at -21% of the parent's 110px border box: (121.9, 150); start = rightmost point
  // anchor 69.9213 (74q) from the pill's left edge; centers: (200.33, 100.08) 90°, (250.25, 150.1) 180°, (200.22, 200.03) 270°, (150.3, 150) 360°
  const R = 78.4252, A = 69.9213, OFF = A - 20;
  const SX = 121.9 + R, SY = 150;
  const STATIC = [[135, 75], [105, 45], [75, 15], [45, -15]];
  const FINAL = [[200.33, 100.08], [250.25, 150.1], [200.22, 200.03], [150.3, 150]];
  const TEACH = ['var(--t1126-p0)', 'var(--t1126-p1)', 'var(--t1126-p2)', 'var(--t1126-p3)'];
  const T = { d: [0.4, 3.4], b: [5.4, 8.4], p: [10.4, 12.6], c: [15.4, 17.8], a: [20.6, 23.8], l: [[26.4, 28.6], [28.8, 31], [31.2, 33.4]], fin: [34.1, 34.8] };
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const num = (v, d) => v.toFixed(d).replace('.', fr ? ',' : '.');
  const c = fr ? ' :' : ':';
  const rad = (deg) => (deg * Math.PI) / 180;
  const put = (el, x, y) => Object.assign(el.style, { left: `${x}px`, top: `${y}px` });
  return (t, st) => {
    const step = st + 1;
    const teach = fig.dataset.teach === '1';
    const fin = t >= T.fin[0];
    const tc = teach && !fin;
    // 1. html's dots grow with the border width
    const gd = pr(t, T.d), w = 40 * gd;
    DOTS.forEach((el, i) => {
      const x = i % 2 ? 255 - w : 145, y = i > 1 ? 205 - w : 95;
      Object.assign(el.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${w}px`, opacity: gd > 0 ? 1 : 0, background: tc ? 'var(--t1126-h)' : 'var(--t1126-k)' });
    });
    HBOX.style.opacity = win(t, 0.2, T.b[1] + 0.6);
    // 2. the body grows out of html's content box (margin 0 → -40), border 0 → 10
    const gb = pr(t, T.b), size = 30 + 80 * gb, bw = 10 * gb;
    Object.assign(BODY.style, {
      left: `${200 - size / 2}px`, top: `${150 - size / 2}px`, width: `${size}px`, height: `${size}px`, borderWidth: `${bw}px`,
      opacity: t >= T.b[0] ? 1 : 0, borderColor: tc ? 'var(--t1126-b)' : 'var(--t1126-k)',
      background: tc ? 'color-mix(in srgb, var(--t1126-b) 22%, var(--t1126-n))' : 'var(--t1126-n)',
    });
    // 3 to 6. the pills: anchor moves from its static place to the start point, the pill turns (k + 1) × 90°
    const gp = pr(t, T.p), pw = 20 + 20 * gp;
    const moves = [pr(t, T.a), ...T.l.map((r) => pr(t, r))];
    PILLS.forEach((el, i) => {
      const m = moves[i];
      const rot = 90 * (i + 1) * m;
      const [sx, sy] = STATIC[i];
      const ax = sx + OFF + (SX - (sx + OFF)) * m, ay = sy + (SY - sy) * m;
      let cx = ax - OFF * Math.cos(rad(rot)), cy = ay - OFF * Math.sin(rad(rot));
      if (m === 1) [cx, cy] = FINAL[i];
      // a pill at a multiple of 90° is drawn without a transform, so its edges stay sharp
      const q = ((rot % 180) + 180) % 180;
      const flat = m === 0 || m === 1;
      const upright = flat && Math.abs(q - 90) < 1e-6;
      const bwid = upright ? 20 : pw, bhei = upright ? pw : 20;
      Object.assign(el.style, {
        left: `${cx - bwid / 2}px`, top: `${cy - bhei / 2}px`, width: `${bwid}px`, height: `${bhei}px`,
        transform: flat ? 'none' : `rotate(${rot}deg)`, opacity: gp > 0 ? 1 : 0,
        background: tc ? TEACH[i] : 'var(--t1126-c)',
      });
    });
    // the current level's circle (step 4: the dt's, growing; then each level's in turn)
    let lev = -1;
    if (step === 4 || step === 5) lev = 0;
    else if (step === 6) lev = t < T.l[1][0] ? 1 : t < T.l[2][0] ? 2 : 3;
    const gc = pr(t, T.c);
    const r = step === 4 ? R * gc : R;
    const ang = rad(90 * Math.max(0, lev)), ccx = SX - R * Math.cos(ang), ccy = SY - R * Math.sin(ang);
    const showPath = lev >= 0 && !fin ? 1 : 0;
    Object.assign(PATH.style, { left: `${ccx - r}px`, top: `${ccy - r}px`, width: `${2 * r}px`, height: `${2 * r}px`, opacity: showPath });
    put(CEN, ccx, ccy); CEN.style.opacity = showPath;
    put(START, step === 4 ? ccx + r * Math.cos(ang) : SX, step === 4 ? ccy + r * Math.sin(ang) : SY);
    START.style.opacity = step >= 4 && !fin ? 1 : 0;
    // the anchor of the pill on the move, and the dotted line from the pill's center to it
    if (lev >= 0 && step >= 5 && !fin) {
      const i = lev, m = moves[i], rot = 90 * (i + 1) * m;
      const [sx, sy] = STATIC[i];
      const ax = sx + OFF + (SX - (sx + OFF)) * m, ay = sy + (SY - sy) * m;
      const cx = ax - OFF * Math.cos(rad(rot)), cy = ay - OFF * Math.sin(rad(rot));
      put(ANC, ax, ay); ANC.style.opacity = 1;
      Object.assign(ARM.style, { left: `${cx}px`, top: `${cy}px`, width: `${OFF}px`, transform: `rotate(${rot}deg)`, opacity: 1 });
    } else { ANC.style.opacity = 0; ARM.style.opacity = 0; }
    // digits in the code
    K(1).forEach((k) => (k.textContent = String(Math.round(43 * gd))));
    K(2).forEach((k) => (k.textContent = String(Math.round(40 * gb))));
    K(3).forEach((k) => (k.textContent = String(Math.round(11 * gb))));
    K(4).forEach((k) => (k.textContent = String(Math.round(20 * gp))));
    K(5).forEach((k) => (k.textContent = '21'));
    K(6).forEach((k) => (k.textContent = String(step < 4 ? 83 : step === 4 ? Math.round(83 * gc) : 83)));
    K(7).forEach((k) => (k.textContent = '74'));
    L('a').style.opacity = win(t, 0.3, T.b[0] - 0.3);
    L('b').style.opacity = win(t, T.b[0], T.p[0] - 0.3);
    L('c').style.opacity = win(t, T.p[0], T.c[0] - 0.3);
    L('d').style.opacity = win(t, T.c[0], T.a[0] - 0.3);
    L('e').style.opacity = win(t, T.a[0], T.l[0][0] - 0.3);
    L('f').style.opacity = win(t, T.l[0][0], T.fin[0]);
    let txt = '';
    if (step === 1) txt = `html${c} 110 × 110 · dotted ${num(w, 0)}px`;
    else if (step === 2) txt = `body${c} ${num(size, 0)} × ${num(size, 0)} · ${fr ? 'bordure' : 'border'} ${num(bw, 0)}`;
    else if (step === 3) txt = `4 × ${num(pw, 0)} × 20`;
    else if (step === 4) txt = `circle r ${num(r, 2)} · ${fr ? 'départ' : 'start'} (${num(121.9 + r, 2)}${fr ? ' ;' : ','} 150)`;
    else if (step === 5) txt = `${fr ? 'ancre' : 'anchor'} ${num(A, 2)} · dt ${num(90 * moves[0], 0)}°`;
    else if (step === 6) txt = `dt 90° · dl ${num(180 * moves[1], 0)}° · dl ${num(270 * moves[2], 0)}° · p ${num(360 * moves[3], 0)}°`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
