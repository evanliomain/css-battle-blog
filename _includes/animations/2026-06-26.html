<pre class="code" aria-hidden="true">&lt;style><span data-on="1" data-tone="2">*{</span><span data-on="1">margin:37.5%50%</span>;<span data-on="2 3 4" data-tone="2">box-shadow:</span><span data-on="2">58q -58q 0 58q#222</span>,<span data-on="3">87q 87q 0 29q#222</span>,<span data-on="4">3in 0 0 3in#D8F581</span>;<span data-on="5 6">scale:-1</span></pre>
<div class="now" aria-live="polite">
<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="margin"><h3>1. Deux boîtes vides</h3><p><code>*</code> vise html, head, style et body. head et style sont masqués. Une marge en % est une part de la largeur du bloc conteneur. Pour html, c'est le canevas, 400px : 37,5 % font 150px et 50 % font 200px. La boîte de html se réduit à 0 × 0, en (200, 150). Le bloc conteneur de body est la boîte de contenu de html, large de 0px : ses marges valent 0, et body est lui aussi une boîte de 0 × 0 en (200, 150).</p></div>
<div class="cap" data-t="4" data-step="58q"><h3>2. Un grand carré</h3><p><code>58q -58q 0 58q#222</code>. 1q est un quart de millimètre, 0,945px : 58q font 54,8px. Sur une boîte de 0 × 0, un étalement de 54,8px dessine un carré de 109,6 × 109,6. Le décalage le pousse de 54,8px à droite et vers le haut : son coin bas gauche est sur le centre. Il va de x = 200 à 309,6 et de y = 40,4 à 150. html dessine le même carré, caché sous celui de body.</p></div>
<div class="cap" data-t="8" data-step="29q"><h3>3. Un petit carré</h3><p><code>87q 87q 0 29q#222</code> : 29q font 27,4px, donc un carré de 54,8 × 54,8, poussé de 82,2px (87q) à droite et vers le bas. Il va de x = 254,8 à 309,6 et de y = 204,8 à 259,6. Son côté droit est aligné sur celui du grand carré, en x = 309,6.</p></div>
<div class="cap" data-t="12" data-step="3in"><h3>4. Un demi-fond</h3><p><code>3in 0 0 3in#D8F581</code> : 3in font 288px. L'étalement dessine un carré de 576 × 576, et le décalage le pousse de 288px à droite : son bord gauche tombe pile en x = 200. Il va de x = 200 à 776 et de y = −138 à 438 : toute la moitié droite du canevas. C'est la dernière ombre, elle est donc peinte sous les deux carrés noirs. La moitié gauche est encore le canevas blanc.</p></div>
<div class="cap" data-t="17" data-step="html"><h3>5. html se retourne</h3><p><code>scale:-1</code> multiplie les deux axes par −1 autour du centre de la boîte, (200, 150) : c'est un demi-tour. Le retournement de html emporte tout ce qu'il contient, body compris. Toutes les ombres passent à gauche : (x, y) devient (400 − x, 300 − y).</p></div>
<div class="cap" data-t="22" data-step="body"><h3>6. body se remet à l'endroit</h3><p>body a son propre <code>scale:-1</code>. Dans html, déjà retourné, il se retourne une fois de plus : −1 × −1 = 1, et la copie de body revient à droite. Celle de html reste à gauche : grand carré de x = 90,4 à 200 et de y = 150 à 259,6, petit carré de x = 90,4 à 145,2 et de y = 40,4 à 95,2, vert de x = −376 à 200. body est peint au-dessus de html, mais chaque vert s'arrête en x = 200 : il ne couvre jamais les carrés de l'autre copie.</p></div>
<div class="cap" data-t="27" data-step="Résultat" data-live="100 caractères · 100 % identique"><h3>7. Résultat : 100 caractères</h3><p>Quatre carrés noirs et un fond vert complet, avec une seule liste de trois ombres dessinée deux fois. Les deux grands carrés se touchent par un coin, au centre (200, 150).</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="margin"><h3>1. Two empty boxes</h3><p><code>*</code> selects html, head, style and body. head and style are hidden. A margin in % is a share of the containing block's width. For html, that is the canvas, 400px: 37.5% is 150px and 50% is 200px. html's box shrinks to 0 × 0, at (200, 150). body's containing block is html's content box, 0px wide: its margins are 0, and body is a 0 × 0 box at (200, 150) too.</p></div>
<div class="cap" data-t="4" data-step="58q"><h3>2. A big square</h3><p><code>58q -58q 0 58q#222</code>. 1q is a quarter of a millimeter, 0.945px: 58q is 54.8px. On a 0 × 0 box, a 54.8px spread draws a 109.6 × 109.6 square. The offset moves it 54.8px right and 54.8px up: its bottom-left corner sits on the center. It spans x = 200 to 309.6 and y = 40.4 to 150. html draws the same square, hidden under body's.</p></div>
<div class="cap" data-t="8" data-step="29q"><h3>3. A small square</h3><p><code>87q 87q 0 29q#222</code>: 29q is 27.4px, so a 54.8 × 54.8 square, moved 82.2px (87q) right and down. It spans x = 254.8 to 309.6 and y = 204.8 to 259.6. Its right side lines up with the big square's, at x = 309.6.</p></div>
<div class="cap" data-t="12" data-step="3in"><h3>4. Half a background</h3><p><code>3in 0 0 3in#D8F581</code>: 3in is 288px. The spread draws a 576 × 576 square, and the offset moves it 288px right: its left edge lands exactly on x = 200. It spans x = 200 to 776 and y = −138 to 438: the whole right half of the canvas. It is the last shadow, so it is painted under the two black squares. The left half is still the white canvas.</p></div>
<div class="cap" data-t="17" data-step="html"><h3>5. html turns over</h3><p><code>scale:-1</code> multiplies both axes by −1 around the box's center, (200, 150): a half turn. html's turn carries everything inside it, body included. All the shadows go to the left: (x, y) becomes (400 − x, 300 − y).</p></div>
<div class="cap" data-t="22" data-step="body"><h3>6. body turns back</h3><p>body has its own <code>scale:-1</code>. Inside html, which is already turned, it turns once more: −1 × −1 = 1, and body's copy is back on the right. html's copy stays on the left: big square from x = 90.4 to 200 and y = 150 to 259.6, small square from x = 90.4 to 145.2 and y = 40.4 to 95.2, green from x = −376 to 200. body is painted above html, but each green stops at x = 200, so it never covers the other copy's squares.</p></div>
<div class="cap" data-t="27" data-step="Result" data-live="100 characters · 100% match"><h3>7. Result: 100 characters</h3><p>Four black squares and a full green background, from one list of three shadows drawn twice. The two big squares touch at one corner, at the center (200, 150).</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0626 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? '\u00a0:' : ':';
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  const num = (v) => (fr ? String(v).replace('.', ',') : String(v));
  // Measured on the official code in local Chrome (400 × 300 iframe): html and body are both 0 × 0 at (200, 150),
  // html margins 150px / 200px, body margins 0. Computed shadows: 54.8032px -54.8032px 0 54.8032px, 82.2047px 82.2047px 0 27.4016px,
  // 288px 0 0 288px. Renders with html's or body's shadows removed: html's copy fills x < 200, body's x >= 200 (60,000 pixels each).
  // Edges in the official render: x = 90.4, 145.2, 200, 254.8, 309.6 and y = 40.4, 95.2, 150, 204.8, 259.6.
  const FIN = 27;
  const Q58 = 54.8032, Q29 = 27.4016, Q87 = 82.2047, IN3 = 288;
  const gh = $('.t0626-gh'), gb = $('.t0626-gb');
  const part = (g, k) => g.querySelector(`:scope > .t0626-s${k}`);
  const H = { g: part(gh, 'g'), b: part(gh, 'b'), s: part(gh, 's') };
  const B = { g: part(gb, 'g'), b: part(gb, 'b'), s: part(gb, 's') };
  const under = $('.t0626-under');
  const cross = $('.t0626-x');
  const mh = $('.t0626-mh'), mv = $('.t0626-mv'), m2 = $('.t0626-m2');
  const labs = $$('.zlab');
  const sq = (el, cx, cy, h, col) => {
    const s = el.style;
    s.left = `${cx - h}px`;
    s.top = `${cy - h}px`;
    s.width = s.height = `${2 * h}px`;
    s.background = col;
  };
  return (t, step) => {
    const wide = fig.dataset.view === 'wide';
    const tw = fig.dataset.teach === '1' ? 1 - pr(t, [FIN, FIN + 0.8]) : 0;
    const k2 = pr(t, [4.4, 6.4]);
    const k3 = pr(t, [8.4, 10.4]);
    const k4 = pr(t, [12.4, 14.8]);
    const k5 = pr(t, [17.4, 20.2]);
    const k6 = pr(t, [22.4, 25.2]);
    const K = 'var(--t0626-k)', G = 'var(--t0626-g)';
    [[H, 'var(--t0626-hk)', 'var(--t0626-hg)'], [B, 'var(--t0626-bk)', 'var(--t0626-bg)']].forEach(([P, tk, tg]) => {
      const ck = mix(tw, tk, K), cg = mix(tw, tg, G);
      sq(P.g, IN3 * k4, 0, IN3 * k4, cg);
      sq(P.b, Q58 * k2, -Q58 * k2, Q58 * k2, ck);
      sq(P.s, Q87 * k3, Q87 * k3, Q29 * k3, ck);
      P.g.style.opacity = k4 > 0 ? 1 : 0;
    });
    gh.style.transform = `rotate(${180 * k5}deg)`;
    gb.style.transform = `rotate(${180 * k6}deg)`;
    // Same-color underlay once both halves are in place, in the real colors: no seam on x = 200.
    under.style.opacity = tw === 0 && k6 >= 1 ? 1 : 0;
    cross.style.opacity = Math.max(win(t, 0.3, 4), win(t, 17.3, 22));
    mh.style.opacity = mv.style.opacity = win(t, 0.3, 4);
    m2.style.opacity = Math.max(win(t, 12.3, 17), win(t, 22.3, FIN));
    // Labels: in the top band of the canvas (canvas view) or above the canvas, off canvas (wide view).
    labs.forEach((l) => {
      const n = +l.dataset.l, second = l.classList.contains('t0626-l2');
      l.style.left = wide ? '-96px' : '3px';
      l.style.top = `calc(${wide ? -71 : 2}px + ${second ? 16 : 0}px * var(--k, 1))`;
      const ivs = [[0.3, 4], [4.3, 8], [8.3, 12], [12.3, 17], [17.3, 22], [22.3, FIN]];
      l.style.opacity = win(t, ...ivs[n - 1]);
    });
    let txt;
    if (step === 0) txt = `html, body${c} 0 × 0 → (200, 150)`;
    else if (step === 1) txt = `${fr ? 'grand carré' : 'big square'}${c} ${num((2 * Q58 * k2).toFixed(1))} × ${num((2 * Q58 * k2).toFixed(1))}`;
    else if (step === 2) txt = `${fr ? 'petit carré' : 'small square'}${c} ${num((2 * Q29 * k3).toFixed(1))} × ${num((2 * Q29 * k3).toFixed(1))}`;
    else if (step === 3) txt = `${fr ? 'vert' : 'green'}${c} x = 200 … ${(200 + 2 * IN3 * k4).toFixed(0)}`;
    else if (step === 4) txt = `html${c} ${(180 * k5).toFixed(0)}°`;
    else if (step === 5) txt = `body${c} 180° + ${(180 * k6).toFixed(0)}° = ${(180 + 180 * k6).toFixed(0)}°`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
