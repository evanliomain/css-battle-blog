<div class="cap" data-t="0" data-step="html : 170 × 170"><h3>1. <code>html</code> : 170 × 170</h3><p>Au premier niveau de la feuille, <code>&amp;</code> désigne la racine : html. <code>margin:65 115</code> n'a pas d'unité : le mode quirks lit des px. En mode quirks, html est étiré sur toute la hauteur du canevas : 300 − 2 × 65 = 170. Sa largeur fait 400 − 2 × 115 = 170. html n'a pas de fond : le canevas reste blanc.</p></div>
<div class="cap" data-t="5" data-step="Un cadre doré"><h3>2. Un cadre doré</h3><p><code>box-shadow:0 0 0 5ch#D9BB61</code> : pas de décalage, pas de flou, une extension de 5ch. 1ch est la largeur du 0 de la police par défaut, 8px : 5ch font 40px. L'ombre dépasse de 40px de chaque côté : 250 × 250, à partir de (75 ; 25). Une ombre externe n'est pas peinte sous sa boîte : il reste un cadre doré de 40px de large.</p></div>
<div class="cap" data-t="10" data-step="Le contour pointillé"><h3>3. Le contour pointillé</h3><p><code>outline:dashed 53q#FFF</code>. 1q est un quart de millimètre, 0,945px : 53q font 50,08px, et Chrome arrondit à 50px. Le contour entoure la boîte de html, de 65 à 335 : 270px par côté. Chrome met un tiret sur chaque coin, long de 100px : il reste un trou de 70px au milieu de chaque côté. Le contour est peint au-dessus de l'ombre : les tirets blancs cachent les coins du cadre, et il reste quatre barres dorées de 70 × 40.</p></div>
<div class="cap" data-t="15" data-step="body et sa bordure"><h3>4. <code>body</code> et sa bordure</h3><p><code>*{</code> dans <code>&amp;{</code> vise tout ce qui est dans html ; seul body s'affiche. En mode quirks, body remplit html : avec <code>margin:10</code>, il fait 150 × 150, à partir de (125 ; 75). <code>border:solid 74q#394257</code> : 74q font 69,92px, arrondis à 69px. 150 − 2 × 69 = 12 : la bordure laisse un trou de 12px au centre, où l'on voit le canevas blanc.</p></div>
<div class="cap" data-t="20" data-step="Des coins creusés"><h3>5. Des coins creusés</h3><p><code>border-radius:5ch</code> donne des coins de 40px, et <code>corner-shape:scoop</code> les creuse vers l'intérieur : chaque coin de body est entaillé par un quart de cercle de 40px, centré sur le coin. Le bord intérieur de la bordure suit : autour de chaque coin, il devient un arc de 40 + 69 = 109px. Plus le rayon grandit, plus les arcs mangent le trou.</p></div>
<div class="cap" data-t="25" data-step="Plus de trou"><h3>6. Plus de trou</h3><p>Le centre de body est à 75 × √2 = 106,07px de chaque coin. C'est moins que 109 : les quatre arcs le couvrent, et le trou disparaît. J'ai vérifié avec une bordure de 60px : les arcs ne font plus que 100px, et un trou en étoile d'environ 17px de large reste au centre.</p></div>
<div class="cap" data-t="30" data-step="Résultat" data-live="146 caractères · 100 % identique"><h3>7. Résultat : 146 caractères</h3><p>Une ombre et un contour pointillé sur html font les quatre barres. La bordure épaisse de body, aux coins creusés, fait la croix, sans trou.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html: 170 × 170"><h3>1. <code>html</code>: 170 × 170</h3><p>At the top level of the style sheet, <code>&amp;</code> means the root: html. <code>margin:65 115</code> has no units: quirks mode reads px. In quirks mode, html is stretched over the whole height of the canvas: 300 − 2 × 65 = 170. Its width is 400 − 2 × 115 = 170. html has no background: the canvas stays white.</p></div>
<div class="cap" data-t="5" data-step="A gold frame"><h3>2. A gold frame</h3><p><code>box-shadow:0 0 0 5ch#D9BB61</code>: no offset, no blur, a 5ch spread. 1ch is the width of the 0 in the default font, 8px: 5ch is 40px. The shadow sticks out 40px on each side: 250 × 250, from (75, 25). An outer shadow is not painted under its box: what is left is a gold frame, 40px wide.</p></div>
<div class="cap" data-t="10" data-step="The dashed outline"><h3>3. The dashed outline</h3><p><code>outline:dashed 53q#FFF</code>. 1q is a quarter of a millimeter, 0.945px: 53q is 50.08px, and Chrome rounds it down to 50px. The outline goes around the html box, from 65 to 335: 270px per side. Chrome puts a dash on each corner, 100px long, which leaves a 70px gap in the middle of each side. The outline is painted above the shadow: the white dashes hide the corners of the frame, and four 70 × 40 gold bars are left.</p></div>
<div class="cap" data-t="15" data-step="body and its border"><h3>4. <code>body</code> and its border</h3><p><code>*{</code> inside <code>&amp;{</code> targets everything in html; only body shows. In quirks mode, body fills html: with <code>margin:10</code>, it is 150 × 150, from (125, 75). <code>border:solid 74q#394257</code>: 74q is 69.92px, rounded down to 69px. 150 − 2 × 69 = 12: the border leaves a 12px hole in the middle, where the white canvas shows.</p></div>
<div class="cap" data-t="20" data-step="Scooped corners"><h3>5. Scooped corners</h3><p><code>border-radius:5ch</code> gives 40px corners, and <code>corner-shape:scoop</code> turns them inward: each corner of body is cut by a 40px quarter circle, centered on the corner. The inner edge of the border follows: around each corner, it becomes an arc of 40 + 69 = 109px. As the radius grows, the arcs eat the hole.</p></div>
<div class="cap" data-t="25" data-step="No hole left"><h3>6. No hole left</h3><p>The center of body is 75 × √2 = 106.07px away from each corner. That is less than 109: the four arcs cover it, and the hole is gone. I checked with a 60px border: the arcs are only 100px, and a star shaped hole about 17px wide stays in the middle.</p></div>
<div class="cap" data-t="30" data-step="Result" data-live="146 characters · 100% match"><h3>7. Result: 146 characters</h3><p>One shadow and one dashed outline on html make the four bars. The thick border of body, with scooped corners, makes the cross, with no hole.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0815 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const n2 = (v) => (fr ? v.toFixed(2).replace('.', ',') : v.toFixed(2));
  const c = fr ? ' :' : ':';
  const sep = fr ? ' ;' : ',';
  // Measured on the official code (getBoundingClientRect and getComputedStyle in local Chrome):
  // html (115, 65) 170 × 170, box-shadow spread 40px, outline 50px dashed (dashes 100px on the corners, 70px gaps)
  // body (125, 75) 150 × 150, border 69px, radius 40px, corner-shape superellipse(-1) = scoop
  // inner edge of a scooped corner: arc of radius (radius + 69) around the corner (hole measured with 60px border, radius 10..38)
  const FIN = 30;
  const ht = $('.t0815-ht'), frm = $('.t0815-fr'), bo = $('.t0815-bo'), ho = $('.t0815-ho');
  const bars = $$('.t0815-bar'), dashes = $$('.t0815-da');
  // Scooped shapes: a box 1px larger on each side, painted 1px in, with a mask of four circles (intersect).
  // The painted edge then lies inside the mask, so the masked corners leave no faint line along the box edge.
  const scoop = (e, color, size, pts, r) => {
    e.style.background = `linear-gradient(${color}, ${color}) 1px 1px / ${size}px ${size}px no-repeat`;
    const m = r > 0 ? pts.map(([x, y]) => `radial-gradient(circle at ${x}px ${y}px, #0000 ${r}px, #000 ${r + 0.6}px)`).join(',') : 'none';
    e.style.maskImage = m; e.style.webkitMaskImage = m;
    e.style.maskComposite = 'intersect'; e.style.webkitMaskComposite = 'source-in';
  };
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    // html
    ht.style.opacity = teach ? pr(t, [0.3, 1]) : 0;
    // the shadow: a frame that grows to 40px
    const s = 40 * pr(t, [5.6, 8.2]);
    const dop = pr(t, [10.8, 11.8]);
    frm.style.left = `${115 - s}px`; frm.style.top = `${65 - s}px`;
    frm.style.width = frm.style.height = `${170 + 2 * s}px`;
    frm.style.borderWidth = `${s}px`;
    // Once the dashes are opaque, the frame is swapped for the four bars it shows (same pixels, no edge under the dashes).
    frm.style.opacity = s > 0 && dop < 1 ? 1 : 0;
    bars.forEach((b) => (b.style.opacity = dop >= 1 ? 1 : 0));
    // the outline dashes: white on white once the frame is swapped, so they are only drawn while they matter
    dashes.forEach((d) => {
      d.style.background = teach ? 'var(--t0815-ol)' : '#fff';
      d.style.opacity = teach ? dop : dop < 1 ? dop : 0;
    });
    // body, its border and the hole
    const bop = pr(t, [15.6, 16.4]);
    const r = 40 * pr(t, [20.6, 23.6]);
    bo.style.opacity = bop;
    scoop(bo, 'var(--t0815-dk)', 150, [[1, 1], [151, 1], [1, 151], [151, 151]], r);
    ho.style.opacity = t < FIN ? bop : 0;
    scoop(ho, teach ? 'var(--t0815-ct)' : '#fff', 12, [[-68, -68], [82, -68], [-68, 82], [82, 82]], r > 0 ? r + 69 : 0);
    // guides
    $$('.t0815-g').forEach((g) => {
      const i = +g.dataset.g;
      g.style.opacity = 0.9 * [0, win(t, 0.3, 4.8), win(t, 5.3, 9.8), win(t, 10.3, 14.8), win(t, 15.3, 19.8)][i];
    });
    const cw = win(t, 25.3, 29.8);
    $('.t0815-cw').style.opacity = cw; $('.t0815-dg').style.opacity = cw; $('.t0815-m').style.opacity = cw;
    [[0.2, 4.8], [5.2, 9.8], [10.2, 14.8], [15.2, 19.8], [20.2, 24.8], [25.2, 29.8]].forEach(([a, z], i) => ($(`.t0815-l[data-l="${i + 1}"]`).style.opacity = win(t, a, z)));
    let txt = '';
    if (step === 0) txt = `html${c} (115${sep} 65) · 170 × 170`;
    else if (step === 1) txt = `box-shadow${c} ${n2(s)}px · ${n2(170 + 2 * s)} × ${n2(170 + 2 * s)}`;
    else if (step === 2) txt = `outline${c} 50px · 100 + 70 + 100 = 270`;
    else if (step === 3) txt = `body${c} (125${sep} 75) · 150 × 150 · border 69px`;
    else if (step === 4) txt = `${fr ? 'rayon' : 'radius'}${c} ${n2(r)}px · ${fr ? 'arcs intérieurs' : 'inner arcs'}${c} ${n2(r + 69)}px`;
    else if (step === 5) txt = `40 + 69 = 109 > ${n2(106.066)}`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
