<div class="cap" data-t="0" data-step="Deux boîtes"><h3>1. Deux boîtes</h3><p><code>*</code> donne à html <code>margin:83%165-152</code>. Une marge en % est une part de la largeur, même en haut : 83 % de 400 = 332. En mode quirks, html remplit la hauteur du canevas moins ses marges : 300 − 332 + 152 = 120. html fait 70 × 120 en (165, 332), sous le canevas. <code>*{*{</code> donne à body <code>margin:-160 0 210</code> : 120 + 160 − 210 = 70. body est un carré de 70 × 70 en (165, 172), et <code>border-radius:1in</code> en fait un cercle. Aucun des deux n'a de fond : seules leurs ombres se verront.</p></div>
<div class="cap" data-t="4.5" data-step="Le ciel"><h3>2. Le ciel</h3><p><code>color:8FC5EF</code> n'a pas de <code>#</code>, mais le mode quirks la lit quand même comme une couleur. Une ombre sans couleur prend celle-là. La dernière ombre de html, <code>0-55ch 0 3in</code>, monte de 55ch = 440px et s'étale de 3in = 288px : elle couvre x −123 à 523 et y −396 à 300. Tout le canevas devient bleu ciel.</p></div>
<div class="cap" data-t="9" data-step="Bloc blanc"><h3>3. Un bloc blanc</h3><p>html ne définit pas <code>--s</code> : <code>var(--s,…)</code> donne sa valeur de repli, <code>0-2in 0 5vh,0-272q</code>. Suivi de <code>0 37q#FFF</code>, le second morceau fait une ombre blanche : montée de 272q = 257px, étalée de 37q = 34,96px. Elle couvre x 130 à 270 et y 40 à 230.</p></div>
<div class="cap" data-t="13.5" data-step="Coupe, corps"><h3>4. La coupe et le corps</h3><p>Le premier morceau du repli, <code>0-2in 0 5vh</code>, est une ombre bleu ciel : montée de 2in = 192px, étalée de 5vh = 15px. Elle couvre x 150 à 250 sous y 125 et sépare les bras. Par-dessus, la première ombre, <code>0-9lh#2D3464</code>, est html monté de 9lh, 162px dans mon Chrome : le corps, 70 × 120 en (165, 170).</p></div>
<div class="cap" data-t="18" data-step="Tête"><h3>5. La tête</h3><p>body a la même <code>box-shadow</code>, mais il définit <code>--s:0-9914q 0 96in,0-39vh</code> : sa liste est différente. Sa première ombre est la même, <code>0-9lh#2D3464</code> : body monté de 162px, rond comme lui. C'est la tête, un disque de 70px en (165, 10). body est peint après html : ses ombres passent devant.</p></div>
<div class="cap" data-t="22.5" data-step="Disque blanc"><h3>6. Un disque blanc</h3><p>Le second morceau de <code>--s</code>, <code>0-39vh</code>, suivi de <code>0 37q#FFF</code> : montée de 39vh = 117px, étalée de 34,96px, en blanc. L'étalement agrandit aussi l'arrondi : c'est un cercle de rayon 69,96 autour de (200, 90). Son bas, en y = 160, fait la courbe de l'encolure. Il recouvre le haut de la coupe.</p></div>
<div class="cap" data-t="27" data-step="Cercle géant"><h3>7. Un cercle géant</h3><p>Le premier morceau de <code>--s</code>, <code>0-9914q 0 96in</code> : montée de 9367,56px, étalée de 9216px, en bleu ciel. La boîte fait 18 502px de large, avec des coins de 96 + 9216 = 9312px. Trop grands, ils sont ramenés à la moitié de la largeur : un cercle de rayon 9251, dont le bas est en y = 90,44. Sur les 140px des épaules, il ne descend que de 0,26px : un bord droit. Il efface tout ce qui est au-dessus. La dernière ombre de body, un cercle bleu ciel de rayon 323, reste cachée dessous.</p></div>
<div class="cap" data-t="31.5" data-step="Résultat" data-live="177 caractères · 100 % identique"><h3>8. Résultat : 177 caractères</h3><p>Une seule <code>box-shadow</code>, deux listes. html, carré, fait le ciel, les bras et le corps. body, rond, fait la tête, l'encolure et le haut des épaules.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="Two boxes"><h3>1. Two boxes</h3><p><code>*</code> gives html <code>margin:83%165-152</code>. A margin in % is a share of the width, even at the top: 83% of 400 = 332. In quirks mode, html fills the canvas height minus its margins: 300 − 332 + 152 = 120. html is 70 × 120 at (165, 332), below the canvas. <code>*{*{</code> gives body <code>margin:-160 0 210</code>: 120 + 160 − 210 = 70. body is a 70 × 70 square at (165, 172), and <code>border-radius:1in</code> makes it a circle. Neither has a background: only their shadows will show.</p></div>
<div class="cap" data-t="4.5" data-step="The sky"><h3>2. The sky</h3><p><code>color:8FC5EF</code> has no <code>#</code>, but quirks mode still reads it as a color. A shadow with no color takes this one. html's last shadow, <code>0-55ch 0 3in</code>, moves up 55ch = 440px and spreads 3in = 288px: it covers x −123 to 523 and y −396 to 300. The whole canvas turns sky blue.</p></div>
<div class="cap" data-t="9" data-step="White block"><h3>3. A white block</h3><p>html does not define <code>--s</code>, so <code>var(--s,…)</code> gives its fallback, <code>0-2in 0 5vh,0-272q</code>. Followed by <code>0 37q#FFF</code>, the second piece makes a white shadow: moved up 272q = 257px, spread 37q = 34.96px. It covers x 130 to 270 and y 40 to 230.</p></div>
<div class="cap" data-t="13.5" data-step="Cut, torso"><h3>4. The cut and the torso</h3><p>The first piece of the fallback, <code>0-2in 0 5vh</code>, is a sky blue shadow: moved up 2in = 192px, spread 5vh = 15px. It covers x 150 to 250 below y 125 and parts the arms. On top, the first shadow, <code>0-9lh#2D3464</code>, is html moved up 9lh, 162px in my Chrome: the torso, 70 × 120 at (165, 170).</p></div>
<div class="cap" data-t="18" data-step="Head"><h3>5. The head</h3><p>body has the same <code>box-shadow</code>, but it defines <code>--s:0-9914q 0 96in,0-39vh</code>: its list is different. Its first shadow is the same <code>0-9lh#2D3464</code>: body moved up 162px, round like body. That is the head, a 70px disc at (165, 10). body is painted after html: its shadows are on top.</p></div>
<div class="cap" data-t="22.5" data-step="White disc"><h3>6. A white disc</h3><p>The second piece of <code>--s</code>, <code>0-39vh</code>, followed by <code>0 37q#FFF</code>: moved up 39vh = 117px, spread 34.96px, white. The spread grows the corners too: it is a circle of radius 69.96 around (200, 90). Its bottom, at y = 160, is the curve of the neckline. It covers the top of the cut.</p></div>
<div class="cap" data-t="27" data-step="Giant circle"><h3>7. A giant circle</h3><p>The first piece of <code>--s</code>, <code>0-9914q 0 96in</code>: moved up 9367.56px, spread 9216px, sky blue. The box is 18,502px wide, with corners of 96 + 9216 = 9312px. Too big, they are scaled down to half the width: a circle of radius 9251, with its bottom at y = 90.44. Over the 140px of the shoulders it drops by only 0.26px: a straight edge. It wipes out everything above. body's last shadow, a sky blue circle of radius 323, stays hidden under it.</p></div>
<div class="cap" data-t="31.5" data-step="Result" data-live="177 characters · 100% match"><h3>8. Result: 177 characters</h3><p>One <code>box-shadow</code>, two lists. html, square, draws the sky, the arms and the torso. body, round, draws the head, the neckline and the top of the shoulders.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0608 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? ' :' : ':';
  const num = (n) => (fr ? String(n).replace('.', ',') : String(n));
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  // Measured on the official code in local Chrome (400 × 300, quirks mode, getBoundingClientRect, getComputedStyle).
  // html: margin 332px 165px −152px, 70 × 120 at (165, 332). body: margin −160px 0 210px, 70 × 70 at (165, 172), radius 96px.
  // html shadows: 0 −162px #2d3464 | 0 −192px 0 15px (sky) | 0 −257.008px 0 34.9606px #fff | 0 −440px 0 288px (sky).
  // body shadows: 0 −162px #2d3464 | 0 −9367.56px 0 9216px (sky) | 0 −117px 0 34.9606px #fff | 0 −440px 0 288px (sky).
  // Rounded corners grow with the spread and are scaled down to half the box: body's shadows are circles,
  // white disc r 69.9606 around (200, 90), giant circle r 9251 around (200, −9160.56) (bottom 90.44), last one r 323 around (200, −233).
  const FIN = 31.5;
  const H = [165, 332, 70, 120], B = [165, 172, 70, 70];
  const h4 = $('.t0608-h4'), h3 = $('.t0608-h3'), h2 = $('.t0608-h2'), h1 = $('.t0608-h1');
  const b4 = $('.t0608-b4'), b3 = $('.t0608-b3'), b2 = $('.t0608-b2'), b1 = $('.t0608-b1');
  const bh = $('.t0608-bh'), bb = $('.t0608-bb'), r4 = $('.t0608-r4');
  const labs = $$('.zlab');
  const ivs = [[0.3, 4.5], [4.8, 9], [9.3, 13.5], [13.8, 18], [18.3, 22.5], [22.8, 27], [27.3, FIN]];
  const put = (e, x, y, w, h) => { e.style.left = `${x}px`; e.style.top = `${y}px`; e.style.width = `${w}px`; e.style.height = `${h}px`; };
  // a shadow of box b: first moved by dy (over [a, a + 1]), then spread by s (over [a + 1, a + 2])
  const shadow = (e, b, dy, s, t, a) => {
    const m = pr(t, [a, a + 1]) * dy, k = pr(t, [a + 1, a + 2]) * s;
    put(e, b[0] - k, b[1] + m - k, b[2] + 2 * k, b[3] + 2 * k);
    e.style.opacity = pr(t, [a - 0.3, a]);
  };
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const wide = fig.dataset.view === 'wide';
    const tw = teach ? 1 - pr(t, [FIN, FIN + 0.8]) : 0;
    shadow(h4, H, -440, 288, t, 4.8);
    shadow(h3, H, -257.008, 34.9606, t, 9.3);
    shadow(h2, H, -192, 15, t, 13.8);
    shadow(h1, H, -162, 0, t, 15.6);
    shadow(b1, B, -162, 0, t, 18.6);
    shadow(b3, B, -117, 34.9606, t, 22.8);
    // the giant circle: shown growing with its bottom fixed at y = 90.44
    const g = pr(t, [27.6, 29.6]);
    const r = 35 * Math.pow(9251 / 35, g);
    b2.style.clipPath = `circle(${r}px at 500px ${790.44 - r}px)`;
    b2.style.opacity = pr(t, [27.3, 27.6]);
    put(b4, -123, -556, 646, 646);
    b4.style.opacity = pr(t, [27.3, 27.6]);
    h3.style.background = mix(tw, '#f59e0b', '#fff');
    h2.style.background = mix(tw, '#14b8a6', '#8fc5ef');
    b3.style.background = mix(tw, '#ec4899', '#fff');
    b2.style.background = mix(tw, '#7c3aed', '#8fc5ef');
    b4.style.background = mix(tw, '#c4b5fd', '#8fc5ef');
    bh.style.opacity = win(t, 0.4, FIN);
    bb.style.opacity = win(t, 0.4, FIN);
    r4.style.opacity = win(t, 29.8, FIN);
    // labels: two rows in the top left corner of the frame
    const x0 = wide ? -60 : 0, y0 = wide ? -60 : 0;
    labs.forEach((l) => {
      const row = +l.dataset.r;
      l.style.left = `calc(${x0}px + 4px * var(--k, 1))`;
      l.style.top = `calc(${y0}px + ${4 + 19 * row}px * var(--k, 1))`;
      l.style.opacity = win(t, ...ivs[+l.dataset.l - 1]);
    });
    let txt;
    if (step === 0) txt = `html${c} 70 × 120 · body${c} 70 × 70`;
    else if (step === 1) txt = `${fr ? 'ciel' : 'sky'}${c} x −123 → 523, y −396 → 300`;
    else if (step === 2) txt = `${fr ? 'blanc' : 'white'}${c} x 130 → 270, y 40 → 230`;
    else if (step === 3) txt = `${fr ? 'coupe' : 'cut'}${c} x 150 → 250 · ${fr ? 'corps' : 'torso'}${c} (165, 170)`;
    else if (step === 4) txt = `${fr ? 'tête' : 'head'}${c} (165, 10)`;
    else if (step === 5) txt = `${fr ? 'disque' : 'disc'}${c} r ${num(69.96)}, ${fr ? 'centre' : 'center'} (200, 90)`;
    else if (step === 6) txt = `r 9251 · ${fr ? 'bas' : 'bottom'}${c} y = ${num(90.44)}`;
    else txt = $$('.caps .cap')[7].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
