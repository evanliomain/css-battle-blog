<div class="cap" data-t="0" data-step="html"><h3>1. La boîte de html</h3><p>Il n'y a pas de doctype : la page est en mode quirks, et un nombre sans unité veut dire des px dans <code>margin</code>. <code>&amp;</code> tout seul vise la racine, html. Sa marge <code>40 130 100</code> laisse 130px à gauche et à droite. En mode quirks, html remplit la fenêtre moins ses marges : 140 × 160, de (130, 40) à (270, 200). Le rose de <code>*</code> peint tout le canevas.</p></div>
<div class="cap" data-t="5" data-step="Bordures"><h3>2. Un cadre épais, un trou</h3><p><code>*</code> donne à html une bordure <code>solid</code>, de la couleur du texte : <code>EFEB99</code>, sans dièse, accepté en mode quirks. <code>&amp;</code> change ses largeurs : 30 en haut, 50 à droite, 110 en bas, 20 à gauche. Le cadre jaune est le corps du fantôme. Il reste un trou rose de 70 × 20, de (150, 70) à (220, 90).</p></div>
<div class="cap" data-t="10" data-step="body"><h3>3. body coupe le trou en deux</h3><p>body est dans le trou. Sa bordure de <code>5vh</code> = 15px et sa marge de 20px de chaque côté en font un carré jaune de 30px, rempli par ses deux bordures. Sa marge du haut, −2, le remonte en y = 68. Il couvre le milieu du trou : il reste deux yeux roses de 20px. Avec −8 en bas, sa boîte de marge fait −2 + 30 − 8 = 20px, la hauteur du trou : html garde ses 160px.</p></div>
<div class="cap" data-t="15" data-step="Ombres 1 et 2"><h3>4. Deux ombres sous le corps</h3><p>Le <code>*</code> imbriqué dans <code>&amp;</code> vise les descendants de html : seul body s'affiche. Ses ombres prennent la couleur du texte. <code>5ch</code> vaut 40px et <code>33vw</code> 132px. Parti de y = 68, chaque carré arrive en y = 200, juste sous le cadre : en (130, 200) et en (210, 200).</p></div>
<div class="cap" data-t="20" data-step="Ombres 3 et 4"><h3>5. Deux pieds de plus</h3><p><code>9lh</code> vaut neuf lignes de 18px : 162px, donc y = 230. <code>-11q</code> vaut −10,39px et <code>74q</code> 69,92px. Les deux derniers carrés vont de x = 159,6 à 189,6 et de 239,9 à 269,9. Ils touchent les premiers par un coin : les pieds en damier.</p></div>
<div class="cap" data-t="25" data-step="Résultat" data-live="170 caractères · 100 % identique"><h3>6. Résultat : 170 caractères</h3><p>Le cadre de html fait le corps, son trou les yeux, body la barre qui les sépare, et quatre ombres de body les pieds.</p></div>

<div class="cap" data-t="5" data-step="Borders"><h3>2. A thick frame, a hole</h3><p><code>*</code> gives html a <code>solid</code> border, in the text color: <code>EFEB99</code>, with no hash, accepted in quirks mode. <code>&amp;</code> changes its widths: 30 at the top, 50 on the right, 110 at the bottom, 20 on the left. The yellow frame is the ghost's body. What is left is a 70 × 20 pink hole, from (150, 70) to (220, 90).</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0704 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? '\u00a0:' : ':';
  const at = fr ? 'en' : 'at';
  const num = (v, d = 0) => { const s = Math.abs(v).toFixed(d); return (v < -0.005 ? '−' : '') + (fr ? s.replace('.', ',') : s); };
  // Boxes measured with getBoundingClientRect on the official code in local Chrome:
  // html (130, 40) 140 × 160, borders 30 50 110 20 (hole 150..220 × 70..90); body (170, 68) 30 × 30, 15px borders.
  // Shadows (getComputedStyle): (−40, 132), (40, 132), (−10.3937, 162), (69.9213, 162), 30 × 30 each.
  const FIN = 25;
  const lerp = (a, b, k) => a + (b - a) * k;
  const put = (e, x, y, w, h) => { e.style.left = `${x}px`; e.style.top = `${y}px`; e.style.width = `${w}px`; e.style.height = `${h}px`; };
  const html = $('.t0704-html'), body = $('.t0704-body'), hb = $('.t0704-hb');
  const sh = [1, 2, 3, 4].map((k) => $(`.t0704-s${k}`));
  const OFF = [[-40, 132], [40, 132], [-10.3937, 162], [69.9213, 162]];
  const L = (k) => $$(`.t0704-l[data-l="${k}"]`);
  const col = (teach, v) => (teach ? `var(--t0704-${v})` : 'var(--t0704-ye)');
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    const out = 1 - pr(t, [FIN - 0.4, FIN]);
    // 1. html's box: from the whole window to (130, 40) 140 × 160
    const kH = pr(t, [0.5, 3]);
    const hx = lerp(0, 130, kH), hy = lerp(0, 40, kH), hw = lerp(400, 140, kH), hh = lerp(300, 160, kH);
    put(hb, hx, hy, hw, hh);
    hb.style.opacity = 0.9 * pr(t, [0.2, 0.5]) * out;
    // 2. html's borders grow to 30 50 110 20
    const kB = pr(t, [5.5, 8]);
    put(html, 130, 40, 140, 160);
    html.style.borderWidth = `${30 * kB}px ${50 * kB}px ${110 * kB}px ${20 * kB}px`;
    html.style.opacity = t >= 5.5 ? 1 : 0;
    html.style.borderColor = col(teach, 'c1');
    // 3. body appears at y = 70, then its −2 top margin lifts it to 68
    const bY = lerp(70, 68, pr(t, [12, 13]));
    put(body, 170, bY, 30, 30);
    body.style.opacity = pr(t, [10.5, 11.3]);
    body.style.background = col(teach, 'c2');
    // 4–5. the shadows leave body and slide to their offsets
    const kS = [pr(t, [16, 18]), pr(t, [16, 18]), pr(t, [21, 23]), pr(t, [21, 23])];
    const on = [15.5, 15.5, 20.5, 20.5];
    sh.forEach((e, i) => {
      const x = 170 + OFF[i][0] * kS[i], y = 68 + OFF[i][1] * kS[i];
      // real colors: a same-color strip, 2px up under html's frame and 0.5px narrower, so no seam shows at y = 200
      put(e, x, y, 30, 30);
      e.style.boxShadow = !teach && i < 2 && kS[i] === 1 ? '0 -2px 0 -0.5px var(--t0704-ye)' : 'none';
      e.style.opacity = t >= on[i] ? 1 : 0;
      e.style.background = col(teach, i < 2 ? 'c3' : 'c4');
    });
    [[0.3, 5], [5.3, 10], [10.3, 15], [15.3, 20], [20.3, 25]].forEach(([a, e], k) => L(k + 1).forEach((l) => (l.style.opacity = win(t, a, e))));
    let txt;
    if (step === 0) txt = `html${c} ${num(hw)} × ${num(hh)} ${at} (${num(hx)}, ${num(hy)})`;
    else if (step === 1) txt = `border-width${c} ${num(30 * kB)} ${num(50 * kB)} ${num(110 * kB)} ${num(20 * kB)} · ${fr ? 'trou' : 'hole'} ${num(140 - 70 * kB)} × ${num(160 - 140 * kB)}`;
    else if (step === 2) txt = `body${c} 30 × 30 ${at} (170, ${num(bY)})`;
    else if (step === 3) txt = `${fr ? 'ombres' : 'shadows'}${c} ${num(OFF[0][0] * kS[0])}px ${num(OFF[0][1] * kS[0])}px · ${num(OFF[1][0] * kS[1])}px ${num(OFF[1][1] * kS[1])}px`;
    else if (step === 4) txt = `${fr ? 'ombres' : 'shadows'}${c} ${num(OFF[2][0] * kS[2], 2)}px ${num(OFF[2][1] * kS[2])}px · ${num(OFF[3][0] * kS[3], 2)}px ${num(OFF[3][1] * kS[3])}px`;
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
