<div class="cap" data-t="0" data-step="Fond"><h3>1. Un fond translucide</h3><p>Au premier niveau, <code>&amp;</code> vise html. Son fond est peint sur tout le canevas. <code>#CB3C</code> est une couleur hexadécimale à 4 chiffres, avec de l'alpha : rgba(204, 187, 51, 0,8). Les 20 % qui manquent laissent voir le blanc dessous. On voit <code>#d6c95c</code>.</p></div>
<div class="cap" data-t="5" data-step="Quatre a"><h3>2. Quatre a vides</h3><p>Un a ne peut pas être dans un a : chaque <code>&lt;a></code> ferme le précédent. body reçoit quatre a côte à côte, vides : chacun fait 0 × 0, en haut de body, en y = 8. <code>margin:45</code> vaut 45px. Sur un élément en ligne, seules les marges gauche et droite le déplacent : 45 + 45 = 90 entre deux a. Ils sont en x = 53, 143, 233 et 323.</p></div>
<div class="cap" data-t="10.5" data-step="Première ombre"><h3>3. La première ombre</h3><p><code>3vw 150q 0 37q</code> : une ombre part d'une copie de la boîte, ici un point. Elle se décale de 3vw = 12px à droite et de 150q = 141,7px vers le bas, sans flou, puis grossit de 37q = 35px de chaque côté. Chaque a reçoit un carré de 69,9px, de y = 114,8 à 184,7. L'ombre prend la couleur du texte : <code>2F5A76</code>, sans #, accepté en mode quirks.</p></div>
<div class="cap" data-t="17" data-step="attr()"><h3>4. Une longueur lue dans un attribut</h3><p><code>attr(r q,214q)</code> lit l'attribut r et en fait une longueur en q. Le premier et le troisième a ont <code>r=87</code> : 87q = 82,2px vers le bas. L'étalement <code>5vh</code> = 15px donne un carré de 30px, de y = 75,2 à 105,2, au-dessus du grand carré.</p></div>
<div class="cap" data-t="23" data-step="Repli"><h3>5. Le repli</h3><p>Le deuxième et le quatrième a n'ont pas de r. attr() prend alors son repli, <code>214q</code> = 202,2px. Leur petit carré passe sous le grand, de y = 195,2 à 225,2.</p></div>
<div class="cap" data-t="28.5" data-step="Résultat" data-live="122 caractères · 100 % identique"><h3>6. Résultat : 122 caractères</h3><p>Quatre éléments vides, deux ombres chacun, et un fond translucide. Un seul attribut choisit si le petit carré va au-dessus ou en dessous.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="Background"><h3>1. A translucent background</h3><p>At the top level, <code>&amp;</code> matches html. Its background is painted on the whole canvas. <code>#CB3C</code> is a 4-digit hex color with alpha: rgba(204, 187, 51, 0.8). The missing 20% lets the white below show through. What you see is <code>#d6c95c</code>.</p></div>
<div class="cap" data-t="5" data-step="Four a"><h3>2. Four empty a</h3><p>An a can't sit inside an a: each <code>&lt;a></code> closes the one before. body gets four a side by side, all empty: each is 0 × 0, at the top of body, at y = 8. <code>margin:45</code> is 45px. On an inline element, only the left and right margins move it: 45 + 45 = 90 between two a. They sit at x = 53, 143, 233 and 323.</p></div>
<div class="cap" data-t="10.5" data-step="First shadow"><h3>3. The first shadow</h3><p><code>3vw 150q 0 37q</code>: a shadow starts as a copy of the box, here a point. It moves 3vw = 12px right and 150q = 141.7px down, with no blur, then grows by 37q = 35px on every side. Each a gets a 69.9px square, from y = 114.8 to 184.7. The shadow takes the text color: <code>2F5A76</code>, with no #, accepted in quirks mode.</p></div>
<div class="cap" data-t="17" data-step="attr()"><h3>4. A length read from an attribute</h3><p><code>attr(r q,214q)</code> reads the r attribute and makes it a length in q. The first and third a have <code>r=87</code>: 87q = 82.2px down. The spread <code>5vh</code> = 15px makes a 30px square, from y = 75.2 to 105.2, above the big square.</p></div>
<div class="cap" data-t="23" data-step="Fallback"><h3>5. The fallback</h3><p>The second and fourth a have no r. attr() then uses its fallback, <code>214q</code> = 202.2px. Their small square goes below the big one, from y = 195.2 to 225.2.</p></div>
<div class="cap" data-t="28.5" data-step="Result" data-live="122 characters · 100% match"><h3>6. Result: 122 characters</h3><p>Four empty elements, two shadows each, and a translucent background. One attribute decides whether the small square goes above or below.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0603 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? '\u00a0:' : ':';
  const n = (x) => (fr ? String(x).replace('.', ',') : String(x));
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  // Measured on the official code in local Chrome (400 × 300 iframe, quirks mode, getBoundingClientRect,
  // getComputedStyle, variant renders).
  // html background rgba(204, 187, 51, 0.8), seen as #d6c95c (#d6c95c instead of #CB3C gives the same picture).
  // The four a are siblings in body, display inline, each 0 × 0 at (53, 8), (143, 8), (233, 8), (323, 8).
  // box-shadow: rgb(47, 90, 118) 12px 141.732px 0 34.9606px, rgb(47, 90, 118) 12px 82.2047px | 202.205px 0 15px.
  // Big squares: x a + 12 ± 34.96, y 114.77 to 184.69. Small squares: x a - 3 to a + 27, y 75.20 to 105.20
  // (r=87) or 195.20 to 225.20 (no r, fallback 214q).
  const AX = [53, 143, 233, 323], AY = 8, DX = 12, DY = 141.732, S = 34.9606, DS = [82.2047, 202.205], s = 15;
  const yel = $('.t0603-yel'), big = $$('.t0603-big'), small = $$('.t0603-small');
  const mgs = $$('.t0603-mg'), pts = $$('.t0603-a'), movs = $$('.t0603-m'), lns = $$('.t0603-ln');
  const labs = $$('.zlab');
  const ivs = [[0.3, 5], [5.3, 10.5], [10.8, 17], [17.3, 23], [23.3, 28.5]];
  // each moving shadow: move from the a point to the offset, then grow by the spread
  const shadow = (el, ax, dy, sp, col, t, [m0, m1], [g0, g1]) => {
    const m = pr(t, [m0, m1]), g = pr(t, [g0, g1]);
    const cx = ax + DX * m, cy = AY + dy * m, r = sp * g;
    el.style.cssText = `left:${cx - r}px;top:${cy - r}px;width:${2 * r}px;height:${2 * r}px;background:${col};opacity:${t >= m0 ? 1 : 0}`;
    return [cx, cy, m];
  };
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const wide = fig.dataset.view === 'wide';
    const tw = teach ? 1 - pr(t, [28.8, 29.8]) : 0;
    yel.style.opacity = pr(t, [0.6, 2.6]);
    const real = '#2f5a76';
    const cBig = mix(tw, 'var(--t0603-big)', real), cR = mix(tw, 'var(--t0603-r)', real), cF = mix(tw, 'var(--t0603-fb)', real);
    const aOn = win(t, 5.4, 28.5);
    mgs.forEach((b) => (b.style.opacity = win(t, 5.4, 10.5)));
    pts.forEach((b) => (b.style.opacity = aOn));
    AX.forEach((ax, i) => {
      // first shadow (step 3): move 11 to 13, grow 13.5 to 15.5
      const [bx, by, bm] = shadow(big[i], ax, DY, S, cBig, t, [11, 13], [13.5, 15.5]);
      // second shadow: r=87 on a 1 and 3 (step 4), fallback on a 2 and 4 (step 5)
      const fb = i % 2;
      const tm = fb ? [23.5, 25.5] : [17.5, 19.5], tg = fb ? [26, 27.5] : [20, 21.5];
      const [sx, sy, sm] = shadow(small[i], ax, DS[fb], s, fb ? cF : cR, t, tm, tg);
      // the moving point and its offset line: the big shadow's in step 3, the small one's in steps 4 and 5
      const useBig = t < 17;
      const [px, py, pm] = useBig ? [bx, by, bm] : [sx, sy, sm];
      const vis = useBig ? win(t, 11, 17) : fb ? win(t, 23.5, 28.5) : win(t, 17.5, 23);
      movs[i].style.left = `${px}px`;
      movs[i].style.top = `${py}px`;
      movs[i].style.opacity = vis;
      const len = Math.hypot(px - ax, py - AY);
      lns[i].style.cssText = `left:${ax}px;top:${AY}px;width:${len}px;transform:translateY(-50%) rotate(${Math.atan2(py - AY, px - ax)}rad);opacity:${vis * (pm > 0 ? 1 : 0)}`;
    });
    // labels: two rows at the bottom of the frame
    const x0 = wide ? -50 : 0, yb = wide ? 360 : 300;
    labs.forEach((l) => {
      const row = +l.dataset.r;
      l.style.left = `calc(${x0}px + 4px * var(--k, 1))`;
      l.style.top = `calc(${yb}px - ${row ? 21 : 40}px * var(--k, 1))`;
      l.style.opacity = win(t, ...ivs[+l.dataset.l - 1]);
    });
    let txt;
    if (step === 0) txt = `${fr ? 'fond vu' : 'background seen'}${c} #d6c95c`;
    else if (step === 1) txt = `a${c} 0 × 0 · x = 53, 143, 233, 323 · y = 8`;
    else if (step === 2) txt = `${fr ? 'grands carrés' : 'big squares'}${c} ${n(69.9)} × ${n(69.9)} · y ${n(114.8)} → ${n(184.7)}`;
    else if (step === 3) txt = `r=87${c} 87q = ${n(82.2)}px · y ${n(75.2)} → ${n(105.2)}`;
    else if (step === 4) txt = `${fr ? 'repli' : 'fallback'}${c} 214q = ${n(202.2)}px · y ${n(195.2)} → ${n(225.2)}`;
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
