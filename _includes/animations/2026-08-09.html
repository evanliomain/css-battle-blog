{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="Qui reçoit quoi"><h3>1. Trois niveaux de <code>*</code></h3><p><code>*</code> vise tous les éléments : html, head, body, les deux img et style. Le <code>*{</code> imbriqué veut dire <code>* *</code> : tout ce qui est dans un autre élément, donc tous sauf html. Le troisième veut dire <code>* * *</code> : ce qui est dans body, les deux img et style. head et style ne s'affichent pas. Pas de doctype : en mode quirks, <code>50 90</code> sans unité est en px. Les boîtes en pointillés sont html, body et les deux img. Je laisse les couleurs de côté pour l'instant.</p></div>
<div class="cap" data-t="4.5" data-step="html : le cadre"><h3>2. html : le cadre</h3><p><code>margin:50 90</code> : html fait 400 − 180 = 220px de large et, en mode quirks, remplit la hauteur moins ses marges : 300 − 100 = 200px. <code>border:11q solid</code> : 11q = 10,39px, et Chrome arrondit une épaisseur de bordure au pixel inférieur : 10px. Sans couleur, la bordure prend <code>color</code>, <code>9D92C8</code> : en mode quirks, Chrome accepte une couleur hexadécimale sans <code>#</code>. html dessine un cadre lavande de (90 ; 50) à (310 ; 250).</p></div>
<div class="cap" data-t="9" data-step="body : les bandes"><h3>3. body : les longues bandes</h3><p>body reçoit la même bordure, et <code>margin:-10-130</code>. Sa boîte part de l'intérieur de html, (100 ; 60) en 200 × 180. Les marges négatives la font sortir de 130px de chaque côté et de 10px en haut et en bas : 460 × 200 en (−30 ; 50). Ses bordures du haut et du bas tombent pile sur celles de html et traversent tout le canevas. Ses côtés, en x = −30 et 420, sont hors du canevas.</p></div>
<div class="cap" data-t="13.5" data-step="Le fond"><h3>4. Le fond violet</h3><p><code>background:#594C94</code> va à body (et à head, aux img, à style). html n'a pas de fond : le navigateur peint alors le fond de body sur tout le canevas, et non dans la boîte de body. C'est le violet.</p></div>
<div class="cap" data-t="18" data-step="Deux carrés"><h3>5. Deux carrés blancs</h3><p>Les img n'ont pas de source : leur contenu fait 0 × 0. Avec la bordure de 10px, chacune est un carré de 20 × 20, blanc grâce à <code>color:FFF</code>. Elles sont côte à côte sur la ligne de body. <code>margin:80 100</code> : la première commence en x = −20 + 100 = 80, la seconde en 80 + 20 + 100 + 100 = 300. En hauteur, 80 + 20 + 80 = 180, la hauteur intérieure de body : les carrés commencent en y = 60 + 80 = 140.</p></div>
<div class="cap" data-t="22.5" data-step="scale:4.5 6"><h3>6. <code>scale:4.5 6</code></h3><p><code>scale</code> agrandit chaque carré depuis son centre : 20 × 4,5 = 90 de large, 20 × 6 = 120 de haut. Les rectangles vont de (45 ; 90) et (265 ; 90) à (135 ; 210) et (355 ; 210). Ils cachent le milieu des côtés de html : il n'en reste que 30px au-dessus et 30px en dessous.</p></div>
<div class="cap" data-t="27" data-step="Résultat" data-live="135 caractères · 100 % identique"><h3>7. Résultat : 135 caractères</h3><p>Trois niveaux de <code>*</code> et une seule bordure pour tous. html dessine le cadre, body étire les bandes d'un bord à l'autre, et les deux img deviennent les rectangles blancs.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="Who gets what"><h3>1. Three levels of <code>*</code></h3><p><code>*</code> matches every element: html, head, body, the two img and style. The nested <code>*{</code> means <code>* *</code>: every element inside another one, so all of them but html. The third one means <code>* * *</code>: what is inside body, the two img and style. head and style are not displayed. There is no doctype: in quirks mode, <code>50 90</code> with no unit is in px. The dashed boxes are html, body and the two img. I leave the colors out for now.</p></div>
<div class="cap" data-t="4.5" data-step="html: the frame"><h3>2. html: the frame</h3><p><code>margin:50 90</code>: html is 400 − 180 = 220px wide and, in quirks mode, fills the height minus its margins: 300 − 100 = 200px. <code>border:11q solid</code>: 11q = 10.39px, and Chrome rounds a border width down to whole pixels: 10px. With no color, the border takes <code>color</code>, <code>9D92C8</code>: in quirks mode, Chrome accepts a hex color with no <code>#</code>. html draws a lavender frame from (90, 50) to (310, 250).</p></div>
<div class="cap" data-t="9" data-step="body: the bands"><h3>3. body: the long bands</h3><p>body gets the same border, and <code>margin:-10-130</code>. Its box starts as the inside of html, (100, 60), 200 × 180. The negative margins push it out by 130px on each side and 10px up and down: 460 × 200 at (−30, 50). Its top and bottom borders land exactly on html's and run across the whole canvas. Its sides, at x = −30 and 420, are off the canvas.</p></div>
<div class="cap" data-t="13.5" data-step="The background"><h3>4. The purple background</h3><p><code>background:#594C94</code> goes to body (and to head, the img and style). html has no background, so the browser paints body's background on the whole canvas, and not in body's box. That is the purple.</p></div>
<div class="cap" data-t="18" data-step="Two squares"><h3>5. Two white squares</h3><p>The img have no source: their content is 0 × 0. With the 10px border, each one is a 20 × 20 square, white from <code>color:FFF</code>. They sit side by side on body's line. <code>margin:80 100</code>: the first starts at x = −20 + 100 = 80, the second at 80 + 20 + 100 + 100 = 300. Vertically, 80 + 20 + 80 = 180 is body's inner height: the squares start at y = 60 + 80 = 140.</p></div>
<div class="cap" data-t="22.5" data-step="scale:4.5 6"><h3>6. <code>scale:4.5 6</code></h3><p><code>scale</code> grows each square from its center: 20 × 4.5 = 90 wide, 20 × 6 = 120 tall. The rectangles go from (45, 90) and (265, 90) to (135, 210) and (355, 210). They hide the middle of html's sides: only 30px of each side shows above them, and 30px below.</p></div>
<div class="cap" data-t="27" data-step="Result" data-live="135 characters · 100% match"><h3>7. Result: 135 characters</h3><p>Three levels of <code>*</code> and one border for everyone. html draws the frame, body stretches the bands from edge to edge, and the two img become the white rectangles.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0809 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const lerp = (a, b, k) => a + (b - a) * k;
  const n2 = (v) => (fr ? v.toFixed(2).replace('.', ',') : v.toFixed(2));
  const c = fr ? ' :' : ':';
  const sep = fr ? ' ;' : ',';
  // Measured on the official code in local Chrome (quirks mode, 400 × 300), getBoundingClientRect and computed styles:
  // html (90, 50) 220 × 200, border 10px (11q rounded down; 10.9px renders the same), background transparent;
  // body (-30, 50) 460 × 200, border 10px; without its background, the 89,200 purple pixels turn white;
  // img without scale (80, 140) 20 × 20 and (300, 140) 20 × 20; with scale:4.5 6 (45, 90) 90 × 120 and (265, 90) 90 × 120.
  const FIN = 27;
  const BL = $('.t0809-blank'), B = $('.t0809-b');
  const HT = $$('.t0809-h');
  const HBand = $$('.t0809-h[data-p="t"],.t0809-h[data-p="b"]');
  const I = [$('.t0809-i[data-i="1"]'), $('.t0809-i[data-i="2"]')];
  const X = (k) => $(`.t0809-box[data-x="${k}"]`);
  const G = (k) => $(`.t0809-tag[data-g="${k}"]`);
  const L = (k) => $(`.t0809-l[data-l="${k}"]`);
  const box = (e, x, y, w, h) => Object.assign(e.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px` });
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    const ann = 1 - pr(t, [FIN, FIN + 0.6]);
    // 1. the boxes
    const tag = win(t, 0.2, 4.4);
    box(X('h'), 90, 50, 220, 200);
    X('h').style.opacity = Math.max(tag, win(t, 4.6, 8.8)) * 0.9;
    // 3. body: from html's content box to (-30, 50) 460 × 200
    const kb = pr(t, [9.6, 12]);
    const bx = [lerp(100, -30, kb), lerp(60, 50, kb), lerp(200, 460, kb), lerp(180, 200, kb)];
    const bfin = t < 9 ? [-30, 50, 460, 200] : bx;
    box(X('b'), ...bfin);
    X('b').style.opacity = Math.max(tag, win(t, 9.1, 13.3)) * 0.9;
    // 5-6. the img: 0 × 0 → 20 × 20 (border), then scale 4.5 6 from the center
    const ki = pr(t, [18.6, 20.2]);
    const ks = pr(t, [23, 25.6]);
    const sx = lerp(1, 4.5, ks), sy = lerp(1, 6, ks);
    const side = 20 * ki;
    [90, 310].forEach((cx, k) => {
      const w = t < 18 ? 20 : side * sx, h = t < 18 ? 20 : side * sy;
      box(X(String(k + 1)), cx - w / 2, 150 - h / 2, w, h);
      X(String(k + 1)).style.opacity = Math.max(tag, win(t, 18.1, 26.8)) * 0.9;
      box(I[k], cx - side * sx / 2, 150 - side * sy / 2, side * sx, side * sy);
      I[k].style.background = teach ? 'var(--t0809-ti)' : '#fff';
      I[k].style.opacity = t >= 18.6 ? 1 : 0;
    });
    ['h', 'b', '1', '2'].forEach((k) => (G(k).style.opacity = tag));
    // 2. html's border
    const bw = 10 * pr(t, [5.2, 7.2]);
    HT.forEach((e) => {
      e.style.background = teach ? 'var(--t0809-th)' : 'var(--t0809-lv)';
      e.style.opacity = t >= 5.2 ? 1 : 0;
    });
    box(HT[0], 90, 50, 220, bw);
    box(HT[1], 90, 250 - bw, 220, bw);
    box(HT[2], 90, 52, bw, 196);
    box(HT[3], 310 - bw, 52, bw, 196);
    // body's band covers html's top and bottom borders exactly: html's bands go away once body is in place
    HBand.forEach((e) => (e.style.opacity = t >= 5.2 && t < 12 ? 1 : 0));
    box(B, ...bx);
    B.style.borderColor = teach ? 'var(--t0809-tb)' : 'var(--t0809-lv)';
    B.style.opacity = pr(t, [9.2, 9.6]);
    // 4. the canvas turns purple
    BL.style.opacity = 1 - pr(t, [14, 15.2]);
    [[4.6, 8.8, 2], [9.1, 13.3, 3], [13.6, 17.8, 4], [18.1, 22.3, 5], [22.6, 26.8, 6]].forEach(([a, z, k]) => (L(k).style.opacity = win(t, a, z) * ann));
    let txt = '';
    if (step === 0) txt = fr ? '* → 6 éléments · * * → 5 · * * * → 3' : '* → 6 elements · * * → 5 · * * * → 3';
    else if (step === 1) txt = `border-width${c} ${n2(bw)}px`;
    else if (step === 2) txt = `body${c} (${n2(bx[0])}${sep} ${n2(bx[1])}) · ${n2(bx[2])} × ${n2(bx[3])}`;
    else if (step === 3) txt = fr ? 'canevas : #594C94' : 'canvas: #594C94';
    else if (step === 4) txt = `img${c} ${n2(side)} × ${n2(side)}`;
    else if (step === 5) txt = `scale${c} ${n2(sx)} ${n2(sy)} · ${n2(side * sx)} × ${n2(side * sy)}`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
