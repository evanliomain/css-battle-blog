<div class="cap" data-t="0" data-step="html"><h3>1. La boîte de html</h3><p><code>*</code> vise tous les éléments : html, head, style et body. Seuls html et body s'affichent. <code>margin:-50%25%180</code> donne à html −50 % de 400 = −200px en haut, 25 % = 100px sur les côtés et 180px en bas. En mode quirks, html remplit la page moins ses marges : 200 × 320 en (100, −200). Son bord du bas est en y = 120. html n'a pas de fond : cette boîte ne dessine rien.</p></div>
<div class="cap" data-t="5" data-step="Plateau"><h3>2. Le plateau du T</h3><p>Une ombre externe n'est peinte qu'en dehors de la boîte de son élément. <code>0 5ch</code> est une copie de html 40px plus bas (1ch = 8px dans la police par défaut de 16px) : 200 × 320 en (100, −160). Tout est sous la boîte de html, sauf les 40 derniers pixels : une bande de 200 × 40 en (100, 120). L'ombre n'a pas de couleur : elle prend <code>color:2F5A76</code>, lu comme #2F5A76 en mode quirks.</p></div>
<div class="cap" data-t="10.5" data-step="Pied"><h3>3. Le pied du T</h3><p><code>0 60vw 0-5pc</code> : 60vw = 240px vers le bas, flou 0, étalement −5pc = −80px. La copie perd 80px de chaque côté : 40 × 160 en (180, 120). Le plateau couvre ses 40 premiers pixels, car la première ombre est peinte au-dessus. Le reste est le pied, jusqu'à y = 280.</p></div>
<div class="cap" data-t="16" data-step="Bloc rouge"><h3>4. Un bloc rouge</h3><p><code>15ex 201q 0-32q#de6b67</code> est la dernière ombre : elle est peinte sous les autres. Chez moi, 15ex = 107,69px ; 201q = 189,92px (1q = 0,945px) ; l'étalement −32q = −30,24px. Un bloc de 139,53 × 259,53 en (237,92 ; 20,16), jusqu'à y = 279,69. Sa partie dans la boîte de html n'est pas peinte, et le plateau le couvre de y = 120 à 160.</p></div>
<div class="cap" data-t="21.5" data-step="Caches"><h3>5. Deux caches couleur du fond</h3><p>Deux ombres #f8d2d1 couvrent le rouge. <code>5ch 63q#f8d2d1</code> est html décalé de 40px à droite et de 59,53px vers le bas : son bord du bas est en y = 179,53. Elle cache le rouge au-dessus de l'assise, à gauche de x = 340 : il reste le dossier. <code>15ex 370q 0-74q#f8d2d1</code> : 107,69px à droite, 349,61px vers le bas, étalement −69,92px. 60,16 × 180,16 en (277,61 ; 219,53) : le vide entre les pieds.</p></div>
<div class="cap" data-t="28" data-step="Miroir"><h3>6. body, retourné</h3><p>Le <code>*{</code> imbriqué vise head, style et body. <code>margin:0</code> pose body sur la boîte de html : en mode quirks, body remplit html, 200 × 320 en (100, −200). body reçoit aussi les cinq ombres de <code>*</code>. <code>scale:-1 1</code> le retourne autour de son centre, x = 200. Sa boîte ne bouge pas, et ses ombres arrivent en miroir : le T sur le T, et une seconde chaise à gauche.</p></div>
<div class="cap" data-t="34" data-step="Fond"><h3>7. Le fond</h3><p><code>background:#d213</code> est sur body. html n'en a pas, donc le fond de body est peint sur tout le canevas. #d213 est #dd2211 à 20 % d'opacité : sur du blanc, #f8d3cf. Les caches sont en #f8d2d1 : l'écart est d'au plus 2 par canal, invisible.</p></div>
<div class="cap" data-t="38" data-step="Résultat" data-live="169 caractères · 100 % identique"><h3>8. Résultat : 169 caractères</h3><p>Une boîte cache ses propres ombres et vide l'espace au-dessus de la table. Cinq ombres dessinent la table et une chaise. body, retourné, dessine l'autre chaise.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html"><h3>1. html's box</h3><p><code>*</code> matches every element: html, head, style and body. Only html and body are displayed. <code>margin:-50%25%180</code> gives html −50% of 400 = −200px at the top, 25% = 100px on the sides and 180px at the bottom. In quirks mode, html fills the page minus its margins: 200 × 320 at (100, −200). Its bottom edge is at y = 120. html has no background: this box draws nothing.</p></div>
<div class="cap" data-t="5" data-step="Top"><h3>2. The top of the T</h3><p>An outer shadow is only painted outside its element's box. <code>0 5ch</code> is a copy of html 40px lower (1ch = 8px in the default 16px font): 200 × 320 at (100, −160). All of it is under html's box, except the last 40 pixels: a 200 × 40 strip at (100, 120). The shadow has no color: it takes <code>color:2F5A76</code>, read as #2F5A76 in quirks mode.</p></div>
<div class="cap" data-t="10.5" data-step="Leg"><h3>3. The leg of the T</h3><p><code>0 60vw 0-5pc</code>: 60vw = 240px down, blur 0, spread −5pc = −80px. The copy loses 80px on each side: 40 × 160 at (180, 120). The top covers its first 40 pixels, because the first shadow is painted on top. The rest is the leg, down to y = 280.</p></div>
<div class="cap" data-t="16" data-step="Red block"><h3>4. A red block</h3><p><code>15ex 201q 0-32q#de6b67</code> is the last shadow: it is painted below the others. In my Chrome, 15ex = 107.69px; 201q = 189.92px (1q = 0.945px); the spread −32q = −30.24px. A 139.53 × 259.53 block at (237.92, 20.16), down to y = 279.69. Its part inside html's box is not painted, and the top of the T covers it from y = 120 to 160.</p></div>
<div class="cap" data-t="21.5" data-step="Masks"><h3>5. Two masks in the background color</h3><p>Two #f8d2d1 shadows cover the red. <code>5ch 63q#f8d2d1</code> is html moved 40px right and 59.53px down: its bottom edge is at y = 179.53. It hides the red above the seat, left of x = 340: the back of the chair stays. <code>15ex 370q 0-74q#f8d2d1</code>: 107.69px right, 349.61px down, spread −69.92px. 60.16 × 180.16 at (277.61, 219.53): the gap between the legs.</p></div>
<div class="cap" data-t="28" data-step="Mirror"><h3>6. body, flipped</h3><p>The nested <code>*{</code> matches head, style and body. <code>margin:0</code> puts body on html's box: in quirks mode, body fills html, 200 × 320 at (100, −200). body also gets the five shadows of <code>*</code>. <code>scale:-1 1</code> flips it around its center, x = 200. Its box stays in place, and its shadows land mirrored: the T on the T, and a second chair on the left.</p></div>
<div class="cap" data-t="34" data-step="Background"><h3>7. The background</h3><p><code>background:#d213</code> is on body. html has none, so body's background is painted on the whole canvas. #d213 is #dd2211 at 20% opacity: over white, #f8d3cf. The masks are #f8d2d1: the gap is at most 2 per channel, too small to see.</p></div>
<div class="cap" data-t="38" data-step="Result" data-live="169 characters · 100% match"><h3>8. Result: 169 characters</h3><p>One box hides its own shadows and clears the space above the table. Five shadows draw the table and one chair. body, flipped, draws the other chair.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0525 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.5), 1 - pr(t, b - 0.3, b));
  const c = fr ? '\u00a0:' : ':';
  const n = (s) => (fr ? s.replace(/(\d)\.(\d)/g, '$1,$2') : s);
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  const lerp = (a, b, k) => a + (b - a) * k;
  const L = (a, b, k) => a.map((v, i) => lerp(v, b[i], k));
  const put = (e, r) => { e.style.left = `${r[0]}px`; e.style.top = `${r[1]}px`; e.style.width = `${r[2]}px`; e.style.height = `${r[3]}px`; };
  // Measured on the official code in local Chrome (400 × 300 iframe, quirks mode, getBoundingClientRect, getComputedStyle).
  // html and body: 100, -200, 200 × 320 (body margin 0); 1ch = 8px, 15ex = 107.6875px, 1q = 0.944882px.
  // html's shadows (first on top): 0 40px #2f5a76; 0 240px 0 -80px #2f5a76; 40px 59.5276px #f8d2d1;
  // 107.6875px 349.606px 0 -69.9213px #f8d2d1; 107.6875px 189.921px 0 -30.2362px #de6b67. body: same list, scale -1 1 (origin 100px 160px → x = 200).
  // Canvas: body's rgba(221 34 17 / .2) over white = rgb(248 211 207).
  const Q = 0.944882, EX = 107.6875;
  const H = [100, -200, 200, 320];
  const off = (dx, dy, s) => [100 + dx - s, -200 + dy - s, 200 + 2 * s, 320 + 2 * s];
  const R1 = off(0, 40, 0);
  const R2a = off(0, 240, 0), R2 = off(0, 240, -80);
  const R3 = off(40, 63 * Q, 0);
  const R4a = off(EX, 370 * Q, 0), R4 = off(EX, 370 * Q, -74 * Q);
  const R5a = off(EX, 201 * Q, 0), R5 = off(EX, 201 * Q, -32 * Q);
  const blank = $('.t0525-blank'), hole = $('.t0525-hole'), hbox = $('.t0525-hbox'), g1 = $('.t0525-g1'), g2 = $('.t0525-g2');
  const lays = [$('.t0525-html'), $('.t0525-body')];
  const labs = $$('.zlab');
  const ivs = [[0.3, 4.8], [5.3, 10.3], [10.8, 15.8], [16.3, 21.3], [21.8, 27.8], [28.3, 33.8], [34.3, 37.8]];
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const wide = fig.dataset.view === 'wide';
    const tw = teach ? 1 - pr(t, 38.2, 39.4) : 0;
    const col = (v, real) => mix(tw, `var(--t0525-${v})`, `var(--t0525-${real})`);
    // the five shadows, at their place at time t
    const r1 = L(H, R1, pr(t, 5.8, 7.8));
    const r2 = L(L(H, R2a, pr(t, 11.3, 13)), R2, pr(t, 13.4, 15.2));
    const r5 = L(L(H, R5a, pr(t, 16.8, 18.4)), R5, pr(t, 18.8, 20.6));
    const r3 = L(H, R3, pr(t, 22, 23.8));
    const r4 = L(L(H, R4a, pr(t, 24.2, 25.6)), R4, pr(t, 25.9, 27.4));
    const sh = [[r5, 16.3, 's5', 'red'], [r4, 24, 's4', 'pink'], [r3, 21.8, 's3', 'pink'], [r2, 10.8, 's2', 'blue'], [r1, 5.3, 's1', 'blue']];
    lays.forEach((lay, j) => {
      [...lay.children].forEach((e, i) => {
        const [r, t0, v, real] = sh[i];
        // body's first shadow: only its visible strip, so that no flipped edge sits under the edge of the box
        put(e, j === 1 && i === 4 ? [100, 118, 200, 42] : r);
        e.style.opacity = t >= t0 ? 1 : 0;
        e.style.background = col(v, real);
      });
    });
    // body: same box and same shadows, then flipped around x = 200
    lays[1].style.opacity = t >= 28.6 ? 1 : 0;
    lays[1].style.transform = `scaleX(${Math.cos(Math.PI * pr(t, 29.4, 32.6))})`;
    // the canvas gets body's background
    const bk = 1 - pr(t, 34.6, 36.2);
    blank.style.opacity = bk;
    // no outer shadow is painted inside its element's box: html's and body's box shows the canvas
    hole.style.background = mix(bk, '#fff', '#f8d3cf');
    // dashed boxes: html's box, and the full copy of the shadow being added
    hbox.style.opacity = win(t, 0.3, 33.8);
    let gr1 = null, gr2 = null;
    if (t >= 5.3 && t < 10.3) gr1 = [r1, win(t, 5.3, 10.3)];
    else if (t >= 10.8 && t < 15.8) gr1 = [r2, win(t, 10.8, 15.8)];
    else if (t >= 16.3 && t < 21.3) gr1 = [r5, win(t, 16.3, 21.3)];
    else if (t >= 21.8 && t < 27.8) { gr1 = [r3, win(t, 21.8, 27.8)]; if (t >= 24) gr2 = [r4, win(t, 24, 27.8)]; }
    g1.style.opacity = gr1 ? gr1[1] : 0;
    if (gr1) put(g1, gr1[0]);
    g2.style.opacity = gr2 ? gr2[1] : 0;
    if (gr2) put(g2, gr2[0]);
    // labels: one per step, top left of the canvas, or bottom left of the wide frame
    labs.forEach((l) => {
      l.style.left = wide ? 'calc(-20px + 4px * var(--k, 1))' : 'calc(4px * var(--k, 1))';
      l.style.top = wide ? 'calc(425px - 20px * var(--k, 1))' : 'calc(4px * var(--k, 1))';
      l.style.opacity = win(t, ...ivs[+l.dataset.l - 1]);
    });
    let txt;
    if (step === 0) txt = `html${c} 400 − 100 − 100 = 200 · 300 + 200 − 180 = 320 · −200 + 320 = 120`;
    else if (step === 1) txt = `5ch = 40px · −160 + 320 = 160 · 160 − 120 = 40`;
    else if (step === 2) txt = `60vw = 240px · 5pc = 80px · 100 + 80 = 180 · −200 + 240 + 80 = 120`;
    else if (step === 3) txt = n(`15ex = 107.69px · 201q = 189.92px · 100 + 107.69 + 30.24 = 237.92`);
    else if (step === 4) txt = n(`−200 + 320 + 59.53 = 179.53 · 100 + 107.69 + 69.92 = 277.61`);
    else if (step === 5) txt = n(`x → 400 − x · 377.45 → 22.55 · 237.92 → 162.08`);
    else if (step === 6) txt = fr ? '20\u00a0% de #dd2211 + 80\u00a0% de blanc = #f8d3cf' : '20% #dd2211 + 80% white = #f8d3cf';
    else txt = $$('.caps .cap')[7].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
