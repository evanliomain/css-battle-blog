<div class="cap" data-t="0" data-step="Éléments"><h3>1. html, body et trois p</h3><p>Chaque <code>&lt;p></code> ferme le précédent : body contient trois p vides. Le <code>&lt;style></code> va dans le troisième. <code>*</code> vise tous les éléments : html, head, body, les trois p et style. Le <code>p{</code> imbriqué vise les trois p.</p></div>
<div class="cap" data-t="4" data-step="html"><h3>2. html : 14 % de 400</h3><p>Une marge en % se calcule sur la largeur du bloc qui contient l'élément. Pour html, c'est le canevas de 400px : 14 % de 400 = 56. html fait 400 − 112 = 288 de large, en (56, 10). Son fond, <code>#1F1446</code>, peint tout le canevas.</p></div>
<div class="cap" data-t="8" data-step="body"><h3>3. body : 14 % de 288</h3><p>body reçoit la même marge. Le bloc qui le contient est html, de 288 de large : 14 % de 288 = 40,32. body fait 288 − 2 × 40,32, environ 207,4 de large. Il a le même fond indigo que le canevas : il ne se voit pas.</p></div>
<div class="cap" data-t="12" data-step="p"><h3>4. Les p : 14 % de 207,4</h3><p>Les p aussi : 14 % de 207,4, environ 29,03. Chaque p fait environ 149,3 de large, centré. <code>height:50</code> leur donne 50 de haut. Leurs marges de 10 fusionnent : avec celle de body, donc le premier p commence en y = 20, et entre elles, donc les p sont à 10px les uns des autres.</p></div>
<div class="cap" data-t="16" data-step="border"><h3>5. border : plein, jaune, 3px</h3><p><code>border:solid#ffca00</code> donne le style et la couleur. Pas d'épaisseur : chaque côté prend celle par défaut, medium, qui vaut 3px dans Chrome. Chaque p fait maintenant 56 de haut.</p></div>
<div class="cap" data-t="20" data-step="border-width"><h3>6. border-width : 0 35 30</h3><p>Trois valeurs : 0 en haut, 35 à gauche et à droite, 30 en bas. Le p garde sa largeur : les côtés de 35px mordent sur son contenu. Chaque p fait 50 + 30 = 80 de haut : un U. Toujours à 10px d'écart : en y = 20, 110 et 200.</p></div>
<div class="cap" data-t="24" data-step="Résultat" data-live="103 caractères · 100 % identique"><h3>7. Résultat : 103 caractères</h3><p>Trois U jaunes de 150 × 80, centrés, à 10px d'écart. Une seule marge, <code>10 14%</code>, réduit chaque niveau de 28 % : 400 → 288 → 207,4 → 149,3.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="Elements"><h3>1. html, body and three p's</h3><p>Each <code>&lt;p></code> closes the one before, so body holds three empty p's. The <code>&lt;style></code> goes into the third one. <code>*</code> matches every element: html, head, body, the three p's and style. The nested <code>p{</code> matches the three p's.</p></div>
<div class="cap" data-t="4" data-step="html"><h3>2. html: 14% of 400</h3><p>A margin in % is a share of the width of the element's containing block. For html, that is the 400px canvas: 14% of 400 = 56. html is 400 − 112 = 288 wide, at (56, 10). Its background, <code>#1F1446</code>, paints the whole canvas.</p></div>
<div class="cap" data-t="8" data-step="body"><h3>3. body: 14% of 288</h3><p>body gets the same margin. Its containing block is html, 288 wide: 14% of 288 = 40.32. body is 288 − 2 × 40.32, about 207.4 wide. It has the same indigo background as the canvas, so it does not show.</p></div>
<div class="cap" data-t="12" data-step="p"><h3>4. The p's: 14% of 207.4</h3><p>The p's too: 14% of 207.4 is about 29.03. Each p is about 149.3 wide, centered. <code>height:50</code> makes them 50 tall. Their 10px margins collapse: with body's, so the first p starts at y = 20, and with each other, so the p's are 10px apart.</p></div>
<div class="cap" data-t="16" data-step="border"><h3>5. border: solid, yellow, 3px</h3><p><code>border:solid#ffca00</code> sets the style and the color. It gives no width, so each side gets the default, medium: 3px in Chrome. Each p is now 56 tall.</p></div>
<div class="cap" data-t="20" data-step="border-width"><h3>6. border-width: 0 35 30</h3><p>Three values: 0 on top, 35 on the left and right, 30 at the bottom. The p keeps its width, so the 35px sides eat into its content. Each p is 50 + 30 = 80 tall: a U. Still 10px apart: at y = 20, 110 and 200.</p></div>
<div class="cap" data-t="24" data-step="Result" data-live="103 characters · 100% match"><h3>7. Result: 103 characters</h3><p>Three yellow U's, 150 × 80, centered and 10px apart. One margin, <code>10 14%</code>, shrinks each level by 28%: 400 → 288 → 207.4 → 149.3.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0515 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.5), 1 - pr(t, b - 0.3, b));
  const c = fr ? '\u00a0:' : ':';
  const pc = fr ? '\u00a0%' : '%';
  const n = (v) => (fr ? String(v).replace('.', ',') : String(v));
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  // Measured on the official code in local Chrome 157 (400 × 300 iframe, quirks mode, getBoundingClientRect, variant renders).
  // html 56, 10, 288 × 280 (margin 10 56); its background paints the canvas.
  // body 96.3125, 20, 207.375 × 260 (margin 10 40.3125). p's 125.34375 wide 149.3125 (margin 10 29.03125).
  // height 50 only: p's at y 20, 80, 140. + border:solid (medium = 3px): 56 tall at 20, 86, 152.
  // + border-width 0 35 30: 80 tall at 20, 110, 200. Painted on whole pixels: x 125 to 275, arms 125-160 and 240-275.
  // The painted U's use those whole pixels (left 125, width 150); the dashed boxes use the layout values.
  const bgc = $('.t0515-bgc'), html = $('.t0515-html'), body = $('.t0515-body');
  const us = $$('.t0515-u'), ps = $$('.t0515-p'), xps = $$('.t0515-xp');
  const xhtml = $('.t0515-xhtml'), xbody = $('.t0515-xbody');
  const labs = $$('.zlab[data-l]');
  const ivs = [[0.3, 3.8], [4.4, 7.8], [8.4, 11.8], [12.4, 15.8], [16.4, 19.8], [20.4, 23.8]];
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const wide = fig.dataset.view !== 'canvas';
    const tw = teach ? 1 - pr(t, 24.2, 25.2) : 0;
    const Y = 'var(--t0515-y)', B = 'var(--t0515-bg)';
    // step 2: html's background fills the canvas; html's own box in teaching colors
    bgc.style.opacity = pr(t, 4.6, 5.6);
    html.style.opacity = 0.45 * tw * pr(t, 5.6, 6.4);
    xhtml.style.opacity = win(t, 4.3, 11.8);
    // step 3: body
    body.style.opacity = 0.55 * tw * pr(t, 8.6, 9.4);
    xbody.style.opacity = win(t, 8.3, 15.8);
    // step 4: the p's, 50 tall; steps 5 and 6: their borders
    const g5 = pr(t, 16.6, 17.6), g6 = pr(t, 20.6, 22.4);
    const bt = 3 * g5 * (1 - g6), bs = 3 * g5 + 32 * g6, bb = 3 * g5 + 27 * g6;
    const h = 50 + bt + bb;
    const ts = teach ? Math.min(pr(t, 20.4, 21), tw) : 0;
    const side = mix(ts, 'var(--t0515-side)', Y), bot = mix(ts, 'var(--t0515-bot)', Y);
    const po = pr(t, 12.6, 13.4);
    const done = tw === 0 && g6 === 1;
    ps.forEach((p, i) => {
      const top = 20 + i * (h + 10);
      p.style.opacity = po;
      p.style.top = `${top}px`;
      p.style.height = `${h}px`;
      p.style.borderWidth = `${bt}px ${bs}px ${bb}px`;
      p.style.borderColor = `${Y} ${side} ${bot}`;
      p.style.background = mix(tw, 'var(--t0515-pc)', B);
      xps[i].style.top = `${top}px`;
      xps[i].style.height = `${h}px`;
      xps[i].style.opacity = win(t, 12.3, 23.8);
      // real colors, borders done: a yellow U (two arms and the bottom bar, overlapping) under each p, so no seam where the sides meet the bottom
      us[i].style.top = `${top}px`;
      us[i].style.opacity = done ? 1 : 0;
    });
    labs.forEach((l) => {
      const k = +l.dataset.l;
      l.style.opacity = win(t, ...ivs[k - 1]);
      l.style.left = wide ? '-46px' : `${l.dataset.x}px`;
      l.style.top = wide ? '-36px' : `${l.dataset.y}px`;
    });
    let txt;
    if (step === 0) txt = '* → html, head, body, p, p, p, style · * p → p, p, p';
    else if (step === 1) txt = `html${c} 14${pc} × 400 = 56 · 400 − 2 × 56 = 288`;
    else if (step === 2) txt = `body${c} 14${pc} × 288 = ${n(40.32)} · 288 − 2 × ${n(40.32)} ≈ ${n(207.4)}`;
    else if (step === 3) txt = `p${c} 14${pc} × ${n(207.4)} ≈ ${n(29.03)} · ≈ ${n(149.3)} × 50 · y = 20, 80, 140`;
    else if (step === 4) txt = `medium = 3px · 3 + 50 + 3 = 56 · y = 20, 86, 152`;
    else if (step === 5) txt = `0 + 50 + 30 = 80 · y = 20, 110, 200`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
