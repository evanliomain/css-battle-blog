<span class="zlab t0915-l-r" style="left:12px;top:12px">64% × 110 = {% if include.lang == "fr" %}70,4{% else %}70.4{% endif %} · {% if include.lang == "fr" %}70,4 + 70,4 > 110 → 55{% else %}70.4 + 70.4 > 110 → 55{% endif %}</span>

<div class="cap" data-t="0" data-step="Quatre images carrées"><h3>1. Quatre images carrées</h3><p>Une <code>&lt;img></code> sans source est une boîte vide. Sa bordure de <code>59q</code> (55,75px, arrondis à 55) en fait un carré plein de 110 × 110. <code>margin:22-52 2 72</code> les espace de 110 − 52 + 72 = 130 : x = 80 et 210, en y = 30. Les deux autres sont dans un <code>&lt;p></code>, sur la ligne suivante.</p></div>
<div class="cap" data-t="4" data-step="Trois coins ronds : une goutte"><h3>2. Trois coins ronds : une goutte</h3><p><code>border-radius:64%var(--r,64%)0</code> : sans <code>--r</code>, ça donne <code>64% 64% 0</code>, trois coins ronds, le coin bas droit carré. 64 % de 110 = 70,4 ; deux coins de 70,4 sur un côté de 110 ne tiennent pas : Chrome les réduit à 55, des demi-cercles. C'est une goutte.</p></div>
<div class="cap" data-t="8" data-step="Une variable vide : une feuille"><h3>3. Une variable vide : une feuille</h3><p><code>+&amp;</code> imbriqué vise une <code>img</code> qui suit une <code>img</code> : la seconde de chaque paire. <code>--r:</code>, sans valeur, est une variable vide : le rayon devient <code>64% 0</code>, deux coins ronds en diagonale, de 70,4 cette fois. C'est une feuille.</p></div>
<div class="cap" data-t="12" data-step="Le p fait un demi-tour"><h3>4. Le <code>p</code> fait un demi-tour</h3><p><code>p{scale:-1}</code> retourne le <code>p</code> sur les deux axes autour de son centre, (200 ; 225) : un demi-tour. Sa goutte passe en bas à droite, sa feuille en bas à gauche, de y = 160 à 270. Les quatre formes font le trèfle.</p></div>
<div class="cap" data-t="16" data-step="Résultat" data-live="146 caractères · 100 % identique"><h3>5. Résultat : 146 caractères</h3><p>Une seule règle <code>img</code>, une variable vide pour la feuille, et un demi-tour pour la seconde paire.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="Four square images"><h3>1. Four square images</h3><p>An <code>&lt;img></code> with no source is an empty box. Its <code>59q</code> border (55.75px, rounded down to 55) makes it a solid 110 × 110 square. <code>margin:22-52 2 72</code> spaces them 110 − 52 + 72 = 130 apart: x = 80 and 210, at y = 30. The other two are in a <code>&lt;p></code>, on the next line.</p></div>
<div class="cap" data-t="4" data-step="Three round corners: a drop"><h3>2. Three round corners: a drop</h3><p><code>border-radius:64%var(--r,64%)0</code>: with no <code>--r</code>, that is <code>64% 64% 0</code>, three round corners and a square bottom-right one. 64% of 110 is 70.4; two 70.4 corners do not fit on a 110 side, so Chrome scales them to 55, half circles. That is a drop.</p></div>
<div class="cap" data-t="8" data-step="An empty variable: a leaf"><h3>3. An empty variable: a leaf</h3><p>The nested <code>+&amp;</code> matches an <code>img</code> right after an <code>img</code>: the second of each pair. <code>--r:</code>, with no value, is an empty variable: the radius becomes <code>64% 0</code>, two round corners on a diagonal, 70.4 this time. That is a leaf.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0915 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const I = [0, 1, 2, 3].map((k) => $(`[data-i="${k}"]`)), P = $('.t0915-p'), oP = P.querySelector('.t0915-o'), live = $('.live');
  const L = (k) => $(`.t0915-l-${k}`);
  const W = { b: [0.3, 1.8], r: [4.2, 5.8], v: [8.2, 9.8], s: [12.2, 14], fin: [16.1, 16.9] };
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const f1 = (v) => { const s = (Math.round(v * 100) / 100).toFixed(2).replace(/\.?0+$/, ''); return (fr ? s.replace('.', ',') : s).replace('-', '−'); };
  const c = fr ? ' :' : ':';
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const real = !teach || t >= W.fin[0];
    const guides = t < W.fin[0] ? 1 : 0;
    const b = pr(t, W.b), r = pr(t, W.r), v = pr(t, W.v), s = pr(t, W.s);
    I.forEach((el, k) => {
      el.style.opacity = b;
      const second = k % 2 === 1;
      // drop: 55 55 0 55 (scaled); leaf: 70.4 0 70.4 0 once --r is empty
      const R = 55 * r;
      el.style.borderRadius = second
        ? `${R + (70.4 - R) * v}px ${R * (1 - v)}px ${70.4 * v}px ${R * (1 - v)}px`
        : `${R}px ${R}px 0 ${R}px`;
      el.style.background = second && !real && v > 0 ? 'var(--t0915-l)' : 'var(--t0915-t)';
    });
    P.style.rotate = `${180 * s}deg`;
    oP.style.opacity = (step === 3 ? 1 : 0) * guides;
    L('b').style.opacity = win(t, W.b[0], W.r[0] - 0.2);
    L('r').style.opacity = win(t, W.r[0], W.v[0] - 0.2);
    L('v').style.opacity = win(t, W.v[0], W.s[0] - 0.2);
    L('s').style.opacity = win(t, W.s[0], W.fin[0]);
    let txt = '';
    if (step === 0) txt = `img${c} x 80, 210 · y 30, 180`;
    else if (step === 1) txt = `${fr ? 'rayon' : 'radius'}${c} ${f1(55 * r)}`;
    else if (step === 2) txt = `${fr ? 'feuille' : 'leaf'}${c} ${f1(55 + 15.4 * v)} 0 ${f1(70.4 * v)} 0`;
    else if (step === 3) txt = `p${c} ${f1(180 * s)}°`;
    else txt = $$('.caps .cap')[4].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
