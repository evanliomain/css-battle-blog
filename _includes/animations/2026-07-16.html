<div class="cap" data-t="0" data-step="html et body"><h3>1. html et body</h3><p>Pas de doctype : la page est en mode quirks. <code>&lt;a></code> ouvre body, et la balise style se retrouve dans a. En haut du CSS, <code>&amp;</code> vaut la racine, html. <code>&amp;,a</code> donne à html <code>padding:117 50 117 7em</code> : des px en mode quirks, et 7em = 7 × 16 = 112. html remplit le canevas, 400 × 300. Sa zone de contenu va de (112, 117) à (350, 183). body y tient avec ses marges de 8 : 222 × 50 en (120, 125).</p></div>
<div class="cap" data-t="4.5" data-step="a : 50 × 234"><h3>2. a : une boîte vide</h3><p>Le <code>*{font:0 a}</code> imbriqué vaut <code>* *</code> : tout ce qui est dans html, donc body et a. Leur police fait 0 (<code>a</code> est la famille, obligatoire). Sur a, 7em vaut donc 0 : padding 117 50 117 0. a est en ligne et vide : sa boîte de contenu est un point en (120, 125). Avec le padding, elle fait 50 × 234, en (120, 8).</p></div>
<div class="cap" data-t="9" data-step="16ex = 114,875px"><h3>3. html : une ellipse sombre</h3><p><code>*</code> donne la même border-image à tous. Son image est un dégradé. Il n'a pas de taille propre : il prend celle de la boîte de html, 400 × 300. L'ellipse par défaut garde ce rapport 4:3. ex est la hauteur des minuscules de la police : 16ex = 114,875px chez moi. Le rose s'arrête à 0, donc juste après : un bord net. Une ellipse sombre de 114,875 × 86,16 au centre.</p></div>
<div class="cap" data-t="13.5" data-step="4 276"><h3>4. Découpe : 4 276</h3><p><code>4 276</code> coupe l'image à 4px du haut et du bas, et à 276px de la gauche et de la droite. 276 + 276 = 552, plus que 400 : la part gauche (x 0 → 276) et la part droite (x 124 → 400) se chevauchent. Dans ce cas, les bords haut et bas et le milieu sont vides. Il reste les coins et les bords gauche et droit. Chacun garde le centre de l'ellipse et 76px au-delà.</p></div>
<div class="cap" data-t="18" data-step="3% 50%"><h3>5. Largeurs : 3% 50%</h3><p>En %, la largeur se calcule sur la boîte : 3 % de 300 = 9px en haut et en bas, 50 % de 400 = 200px à gauche et à droite. Pas besoin de bordure. Le bord gauche de l'image (276 × 292) est étiré dans 200 × 282 : × 0,7246 en largeur, × 0,9658 en hauteur. L'ellipse devient un cercle de 83,24 × 83,21, centré en x = 144,93, et coupé en x = 200. Le bord droit fait le cercle miroir, en x = 255,07.</p></div>

(window.AnimScenes = window.AnimScenes || {}).t0716 = (fig) => {
  const fr = document.documentElement.lang === 'fr';

  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));

  // Measured on the official code in local Chrome (quirks mode, 400 × 300), getBoundingClientRect and computed styles:
  // html (0, 0) 400 × 300, padding 117px 50px 117px 112px, font 16px; body (120, 125) 222 × 50; a (120, 8) 50 × 234, padding 117px 50px 117px 0.
  // html border-image: radial-gradient(rgb(116, 32, 32) 114.875px, rgb(175, 106, 138) 0px) 4 276 / 3% 50%; on body and a the stop is 0px.
  // Left edge: image x 0..276, y 4..296 drawn in x 0..200, y 9..291 (× 200/276, × 282/292); right edge: image x 124..400 in x 200..400.
  const FIN = 27;
  const RX = 114.875, RY = 114.875 * 0.75, SX = 200 / 276, SY = 282 / 292;
  const w = $('.t0716-w'), img = $('.t0716-img'), pk = $('.t0716-pk'), pl = $('.t0716-pl'), prt = $('.t0716-pr'), bd = $('.t0716-bd'), ad = $('.t0716-ad');
  const hb = $('.t0716-hb'), hc = $('.t0716-hc'), bb = $('.t0716-bb'), ab = $('.t0716-ab'), o1 = $('.t0716-ol1'), o2 = $('.t0716-ol2'), ln = $$('.t0716-ln');
  const L = (k) => $$(`.t0716-l[data-l="${k}"]`);
  const box = (e, x, y, wd, ht) => Object.assign(e.style, { left: `${x}px`, top: `${y}px`, width: `${wd}px`, height: `${ht}px` });
  const grad = (r, d) => `radial-gradient(${r}px ${r * 0.75}px at 200px 150px, ${d} 100%, var(--t0716-p) 0)`;
