<script>
(window.AnimScenes = window.AnimScenes || {}).t0508 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.5), 1 - pr(t, b - 0.3, b));
  const c = fr ? ' :' : ':';
  const pc = fr ? ' %' : '%';
  const n = (v) => (fr ? String(v).replace('.', ',') : String(v));
  // Measured on the official code in local Chrome (400 × 300 page, quirks mode, getBoundingClientRect, computed styles):
  // html 0, 0, 400 × 300, font-size 16px; body 125, 65, 150 × 170, font-size 88.64px, border-radius 0 0 13% 13%.
  // Both: background-position -308.976px -30.2362px, repeat. html: size 169.6px auto (= 300), last gray stop 35.2px.
  // body: size 939.584px auto (= 170), last gray stop 195.008px. First stop 5vh = 15px on both.
  // html's rings on the canvas: centers (115.024, 119.764) and (284.624, 119.764); body's disk: (285.816, 119.764).
  // The last frame shows .t0508-plane and .t0508-body only, with the same gradients in px: same pixels as the official code.
  const FIN = 30;
  const REAL_H = [[223, 145, 75], [238, 238, 238], [223, 145, 75]];
  const TEACH_H = [[223, 145, 75], [56, 189, 248], [223, 145, 75]];
  const REAL_B = [[223, 145, 75], [238, 238, 238], [223, 145, 75]];
  const TEACH_B = [[244, 114, 182], [167, 139, 250], [252, 211, 77]];
  const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
  const rgb = (col) => `rgb(${col.join(' ')})`;
  const grad = (cols, r1, r2) => `radial-gradient(1q, ${rgb(cols[0])} ${r1.toFixed(3)}px, ${rgb(cols[1])} 0 ${r2.toFixed(3)}px, ${rgb(cols[2])})`;
  const plane = $('.t0508-plane'), tile = $('.t0508-tile'), bplane = $('.t0508-bplane'), body = $('.t0508-body');
  const hbox = $('.t0508-html'), bbox = $('.t0508-bbox'), main = $('.t0508-main');
  const copies = $$('.t0508-copy'), btiles = $$('.t0508-btile');
  const c0 = $('.t0508-c0'), c1 = $$('.t0508-c1'), c2 = $('.t0508-c2');
  const labs = $$('.zlab[data-l]');
  const ivs = [[0.3, 4.3], [4.8, 8.8], [9.6, 13.8], [15.2, 18.8], [19.4, 24.3], [25.2, 29.8]];
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const fin = pr(t, FIN + 0.2, FIN + 0.9);
    const tw = teach ? 1 - fin : 0;
    const ch = REAL_H.map((col, i) => mix(col, TEACH_H[i], tw));
    const cb = REAL_B.map((col, i) => mix(col, TEACH_B[i], tw));
    // step 1: html's and body's boxes
    hbox.style.opacity = win(t, 0.3, 4.3);
    bbox.style.opacity = win(t, 0.3, 4.3);
    // step 2: html's tile; step 3: the ring grows in it
    main.style.opacity = win(t, 4.7, 18.8);
    const a = pr(t, 9.8, 11.6);
    tile.style.backgroundImage = grad(ch, 15 * a, 35.2 * a);
    tile.style.opacity = Math.min(pr(t, 9.1, 9.7), 1 - pr(t, 15.3, 15.7));
    c0.style.opacity = win(t, 9.6, 13.8);
    // step 4: the tile repeats
    plane.style.backgroundImage = grad(ch, 15, 35.2);
    plane.style.opacity = pr(t, 14.3, 15.3);
    copies.forEach((b) => { b.style.opacity = win(t, 14.3, 18.8); });
    c1.forEach((b) => { b.style.opacity = win(t, 15.2, 18.8); });
    // step 5: the body's tile, shown whole; step 6: clipped to the body's box
    const bg = grad(cb, 15, 195.008);
    bplane.style.backgroundImage = bg;
    bplane.style.opacity = 0.7 * Math.min(pr(t, 19.4, 20.4), 1 - pr(t, 24.8, 25.6));
    btiles.forEach((b) => { b.style.opacity = win(t, 19.4, 24.3); });
    c2.style.opacity = win(t, 19.8, 24.3);
    body.style.backgroundImage = bg;
    body.style.opacity = pr(t, 24.8, 25.8);
    labs.forEach((l) => {
      l.style.opacity = win(t, ...ivs[+l.dataset.l - 1]);
    });
    let txt;
    if (step === 0) txt = `html${c} 400 × 300 · body${c} 150 × 170`;
    else if (step === 1) txt = `10.6em = 10.6 × 16 = ${n(169.6)}px · -327Q = −${n(308.98)}px · -32Q = −${n(30.24)}px`;
    else if (step === 2) txt = `5vh = 15px · 2.2em = 2.2 × 16 = ${n(35.2)}px`;
    else if (step === 3) txt = `x${c} ${n(115.02)}, ${n(284.62)} · y${c} ${n(119.76)}`;
    else if (step === 4) txt = `554${pc} × 16 = ${n(88.64)}px · 10.6em = ${n(939.58)}px · 2.2em = ${n(195.01)}px`;
    else if (step === 5) txt = `13${pc} × 150 = ${n(19.5)} · 13${pc} × 170 = ${n(22.1)} · x${c} ${n(270.82)} → 275`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
