<div class="cap" data-t="0" data-step="html"><h3>1. html, sous le canevas</h3><p>Le <code>&amp;</code> seul, hors de toute règle, vise la racine : html. Sa règle vient après <code>*</code> : html prend sa marge. <code>95%</code> se prend sur la largeur de 400px, même en haut : 380px. html fait 400 − 320 = 80px de large et, en mode quirks, 300 − 380 + 359 = 279px de haut. Il est en (160, 380), tout entier sous le canevas. <code>border-radius:1in</code> (96px) dépasse la moitié de sa largeur : ses coins tombent à 40px, c'est une pilule.</p></div>
<div class="cap" data-t="5" data-step="body"><h3>2. body remonte dans le canevas</h3><p>Le <code>*</code> vise aussi body. <code>margin:-285-35 300</code> le sort de html par le haut, de 285px, jusqu'en y = 95. Il déborde de 35px de chaque côté : 150px de large, en x = 125. En mode quirks, il fait 279 + 285 − 300 = 264px de haut. Les deux boîtes restent transparentes : le canevas est encore blanc.</p></div>
<div class="cap" data-t="10" data-step="Un trou"><h3>3. Un trou dans le magenta</h3><p>Les deux boîtes reçoivent les mêmes cinq ombres. La dernière, <code>0 0 0 3in</code>, étale 288px de magenta autour de body. Une ombre extérieure n'est jamais peinte sous sa propre boîte : la boîte de body reste un trou blanc, de 150px de large, de y = 95 jusqu'en bas.</p></div>
<div class="cap" data-t="15" data-step="Rebord et bouchon"><h3>4. Le rebord et le bouchon</h3><p><code>0-5vw</code> est une copie noire de body, montée de 20px. Seuls les 20px au-dessus de sa boîte se voient : le rebord, de y = 75 à 95. <code>0-95px 0-26q</code> monte une autre copie de 95px et la rétrécit de 26q, 24,57px, de chaque côté : 100,86px de large, à partir de y = 24,57. Au-dessus du rebord, c'est le bouchon.</p></div>
<div class="cap" data-t="20" data-step="Hors du canevas"><h3>5. Deux ombres hors du canevas</h3><p>Les deux ombres <code>0-4in</code> montent de 384px. Sur body, elles atterrissent au-dessus du canevas, de y = −289 à −25. On ne les voit jamais.</p></div>
<div class="cap" data-t="25" data-step="Le tube"><h3>6. Le tube, par le trou</h3><p>Les ombres de html sont peintes avant celles de body, donc dessous. Elles ne se voient que par le trou. Sur html, <code>0-4in</code> remonte la pilule de y = −4 à 275 : le tube noir. La première ombre, 20px plus petite de chaque côté, est le liquide : 40 × 239, avec un rayon de 20px.</p></div>
<div class="cap" data-t="30" data-step="Le trou se remplit"><h3>7. Le trou se remplit</h3><p>L'ombre <code>3in</code> de html part 288px au-dessus de html : en y = 380 − 288 = 92, sous le rebord. Elle remplit le trou autour du tube. Les ombres <code>0-5vw</code> et <code>0-95px</code> de html tombent sous le canevas.</p></div>
<div class="cap" data-t="35" data-step="Résultat" data-live="137 caractères · 100 % identique"><h3>8. Résultat : 137 caractères</h3><p>Une liste d'ombres, deux boîtes. Sur body, elle dessine le rebord, le bouchon et le magenta troué. Sur html, le tube et le magenta du trou.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html"><h3>1. html, below the canvas</h3><p>A lone <code>&amp;</code>, outside any rule, selects the root: html. Its rule comes after <code>*</code>, so html takes its margin. <code>95%</code> is taken from the 400px width, even on top: 380px. html is 400 − 320 = 80px wide and, in quirks mode, 300 − 380 + 359 = 279px tall. It sits at (160, 380), all below the canvas. <code>border-radius:1in</code> (96px) is more than half its width: its corners drop to 40px, a pill.</p></div>
<div class="cap" data-t="5" data-step="body"><h3>2. body comes up into the canvas</h3><p>The <code>*</code> also selects body. <code>margin:-285-35 300</code> pulls it 285px up out of html, to y = 95. It sticks out 35px on each side: 150px wide, at x = 125. In quirks mode it is 279 + 285 − 300 = 264px tall. Both boxes stay transparent: the canvas is still white.</p></div>
<div class="cap" data-t="10" data-step="A hole"><h3>3. A hole in the magenta</h3><p>Both boxes get the same five shadows. The last one, <code>0 0 0 3in</code>, spreads 288px of magenta around body. An outer shadow is never painted under its own box: body's box stays a white hole, 150px wide, from y = 95 down.</p></div>
<div class="cap" data-t="15" data-step="Brim and stopper"><h3>4. The brim and the stopper</h3><p><code>0-5vw</code> is a black copy of body, moved 20px up. Only the 20px above its box show: the brim, from y = 75 to 95. <code>0-95px 0-26q</code> moves another copy 95px up and shrinks it by 26q, 24.57px, on each side: 100.86px wide, from y = 24.57. Above the brim, it is the stopper.</p></div>
<div class="cap" data-t="20" data-step="Off canvas"><h3>5. Two shadows off canvas</h3><p>The two <code>0-4in</code> shadows move 384px up. On body, they land above the canvas, from y = −289 to −25. They are never seen.</p></div>
<div class="cap" data-t="25" data-step="The tube"><h3>6. The tube, through the hole</h3><p>html's shadows are painted before body's, so below them. They only show through the hole. On html, <code>0-4in</code> brings the pill up to y = −4 to 275: the black tube. The first shadow, 20px smaller on each side, is the liquid: 40 × 239, with a 20px radius.</p></div>
<div class="cap" data-t="30" data-step="The hole fills"><h3>7. The hole fills up</h3><p>html's <code>3in</code> shadow starts 288px above html: at y = 380 − 288 = 92, under the brim. It fills the hole around the tube. html's <code>0-5vw</code> and <code>0-95px</code> shadows land below the canvas.</p></div>
<div class="cap" data-t="35" data-step="Result" data-live="137 characters · 100% match"><h3>8. Result: 137 characters</h3><p>One shadow list, two boxes. On body, it draws the brim, the stopper and the magenta with a hole. On html, the tube and the magenta in the hole.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0707 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? ' :' : ':';
  const num = (v, d = 0) => { const s = Math.abs(v).toFixed(d); return (v < -0.005 ? '−' : '') + (fr ? s.replace('.', ',') : s); };
  // Measured on the official code in local Chrome (quirks mode, 400 × 300), getBoundingClientRect and getComputedStyle:
  // html (160, 380) 80 × 279, border-radius 96px (drawn 40px); body (125, 95) 150 × 264.
  // Shadows (both boxes): 0 -384 0 -20 #5adab8, 0 -20 black, 0 -95 0 -24.5669 black, 0 -384 black, 0 0 0 288 #993576.
  // An outer shadow is not painted under its own box; body's shadows are painted over html's.
  const FIN = 35, Q = 24.5669;
  const lerp = (a, b, k) => a + (b - a) * k;
  const put = (e, x, y, w, h) => { e.style.left = `${x}px`; e.style.top = `${y}px`; e.style.width = `${w}px`; e.style.height = `${h}px`; };
  const hmag = $('.t0707-hmag'), glass = $('.t0707-glass'), liq = $('.t0707-liq');
  const bmag = $('.t0707-bmag'), bk4 = $('.t0707-bk4'), cap = $('.t0707-cap'), brim = $('.t0707-brim'), btq = $('.t0707-btq');
  const hb = $('.t0707-hb'), bb = $('.t0707-bb');
  const L = (k) => $$(`.t0707-l[data-l="${k}"]`);
  const tc = (on, v, real) => (on ? `var(--t0707-${v})` : `var(--t0707-${real})`);
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    // 1. html's box goes from the canvas to (160, 380) 80 × 279, then gets its 40px corners
    const kM = pr(t, [0.5, 2.5]), kR = pr(t, [3, 4]);
    put(hb, lerp(0, 160, kM), lerp(0, 380, kM), lerp(400, 80, kM), lerp(300, 279, kM));
    hb.style.borderRadius = `${40 * kR}px`;
    hb.style.opacity = 0.9 * pr(t, [0.2, 0.5]) * (1 - pr(t, [FIN - 0.4, FIN]));
    // 2. body's box leaves html's box for (125, 95) 150 × 264
    const kB = pr(t, [5.5, 7.5]);
    put(bb, lerp(160, 125, kB), lerp(380, 95, kB), lerp(80, 150, kB), lerp(279, 264, kB));
    bb.style.opacity = 0.9 * pr(t, [5.2, 5.5]) * (1 - pr(t, [FIN - 0.4, FIN]));
    // 3. body's 3in shadow spreads to 288px; its container cuts body's box out
    const s = 288 * pr(t, [10.5, 12.5]);
    put(bmag, 125 - s, 95 - s, 150 + 2 * s, 264 + 2 * s);
    bmag.style.opacity = pr(t, [10.2, 10.5]);
    bmag.style.background = tc(teach, 'c1', 'mag');
    // 4. the brim (0 -20) and the stopper (0 -95, spread -24.57) come out of body's box
    const d = 20 * pr(t, [15.5, 16.7]);
    // only the parts above body's box are drawn, so that no black bleeds along the hole's antialiased edges
    put(brim, 125, 95 - d, 150, d);
    brim.style.opacity = t >= 15.5 ? 1 : 0;
    brim.style.background = tc(teach, 'c3', 'dark');
    const o3 = 95 * pr(t, [16.6, 18]), q3 = Q * pr(t, [18.1, 19.3]);
    put(cap, 125 + q3, 95 - o3 + q3, 150 - 2 * q3, Math.max(0, o3 - q3));
    cap.style.opacity = t >= 16.6 ? 1 : 0;
    cap.style.background = tc(teach, 'c4', 'dark');
    // 5. body's two 0 -4in shadows move 384px up, off the canvas
    const o4 = 384 * pr(t, [20.5, 22.5]);
    put(bk4, 125, 95 - o4, 150, Math.min(264, o4));
    put(btq, 145, 115 - o4, 110, Math.max(0, Math.min(224, o4 - 20)));
    bk4.style.opacity = btq.style.opacity = t >= 20.5 ? 1 : 0;
    bk4.style.background = tc(teach, 'c5', 'dark');
    // 6. html's 0 -4in shadows: the tube and the liquid, cut out of html's box
    const o1 = 384 * pr(t, [25.5, 27.5]);
    put(glass, 160, 380 - o1, 80, 279);
    put(liq, 180, 400 - o1, 40, 239);
    glass.style.opacity = liq.style.opacity = t >= 25.5 ? 1 : 0;
    glass.style.background = tc(teach, 'c5', 'dark');
    // 7. html's 3in shadow spreads to 288px (corner radius drawn about 148px)
    const kH = pr(t, [30.5, 32.5]), h = 288 * kH;
    put(hmag, 160 - h, 380 - h, 80 + 2 * h, 279 + 2 * h);
    hmag.style.borderRadius = `${40 + 108 * kH}px`;
    hmag.style.opacity = pr(t, [30.2, 30.5]);
    hmag.style.background = tc(teach, 'c2', 'mag');
    [[0.3, 5], [5.3, 10], [10.3, 15], [15.3, 20], [20.3, 25], [25.3, 30], [30.3, 35]].forEach(([a, z], k) => L(k + 1).forEach((e) => (e.style.opacity = win(t, a, z))));
    let txt;
    if (step === 0) txt = `html${c} ${num(lerp(400, 80, kM))} × ${num(lerp(300, 279, kM))} ${fr ? 'en' : 'at'} (${num(lerp(0, 160, kM))}, ${num(lerp(0, 380, kM))})`;
    else if (step === 1) txt = `body${c} ${num(lerp(80, 150, kB))} × ${num(lerp(279, 264, kB))} ${fr ? 'en' : 'at'} (${num(lerp(160, 125, kB))}, ${num(lerp(380, 95, kB))})`;
    else if (step === 2) txt = fr ? `ombre 3in de body${c} ${num(s)}px` : `body's 3in shadow${c} ${num(s)}px`;
    else if (step === 3) txt = fr ? `rebord${c} y = ${num(95 - d, 2)} · bouchon${c} y = ${num(95 - o3 + q3, 2)}` : `brim${c} y = ${num(95 - d, 2)} · stopper${c} y = ${num(95 - o3 + q3, 2)}`;
    else if (step === 4) txt = fr ? `décalage${c} ${num(-o4)}px` : `offset${c} ${num(-o4)}px`;
    else if (step === 5) txt = fr ? `tube${c} y = ${num(380 - o1)} → ${num(659 - o1)}` : `tube${c} y = ${num(380 - o1)} → ${num(659 - o1)}`;
    else if (step === 6) txt = fr ? `ombre 3in de html${c} haut en y = ${num(380 - h)}` : `html's 3in shadow${c} top at y = ${num(380 - h)}`;
    else txt = $$('.caps .cap')[7].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
