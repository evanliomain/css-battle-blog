<figure class="anim t0902" data-duration="20" data-scene="t0902" data-wide="-40 -30 480 360" data-off-label="-36 -26" style="--bg:#a84a4b">
<style>
.t0902{--t0902-c:#f5e3b5;--t0902-p:#f0a040;--t0902-i:#7ad0c8;--t0902-dash:rgb(255 240 220 / .85)}
.t0902 .t0902-k{position:absolute;display:block}
.t0902 .t0902-o{position:absolute;box-sizing:border-box;border:1.5px dashed var(--t0902-dash);pointer-events:none}
.t0902 .zlab{color:#fff;background:rgb(60 20 20 / .9);padding:1px 5px;border-radius:3px}
</style>
<div class="anim-col">
<div class="stage" role="img" aria-label="{% if include.lang == "fr" %}Animation : trois boîtes emboîtées, le body, un p zoomé deux fois et une image vide ; chacune a une bordure dont la border-image, d'une seule couleur, ne peint que les quatre coins : quatre petits carrés, quatre moyens, et quatre qui se touchent au centre en un grand carré{% else %}Animation: three nested boxes, the body, a p zoomed twice and an empty image; each has a border whose single-color border-image only paints the four corners: four small squares, four medium ones, and four that touch in the middle as one big square{% endif %}">
<div class="scene">
<div data-g="body"></div>
<div data-g="p"></div>
<div data-g="img"></div>
<div class="t0902-o" data-o="body" style="left:75px;top:25px;width:250px;height:250px"></div>
<div class="t0902-o" data-o="p" style="left:100px;top:50px;width:200px;height:200px"></div>
<div class="t0902-o" data-o="img" style="left:150px;top:100px;width:100px;height:100px"></div>
<span class="zlab t0902-l-b" style="left:12px;top:276px">border:25px · border-image → {% if include.lang == "fr" %}4 coins{% else %}4 corners{% endif %}</span>
<span class="zlab t0902-l-p" style="left:12px;top:276px">p{zoom:2} → 25 × 2 = 50</span>
<span class="zlab t0902-l-i" style="left:12px;top:276px">img · 0 + 50 + 50 = 100</span>
</div>
</div>
<div class="legend"><span><i style="--c:var(--t0902-c)"></i>{% if include.lang == "fr" %}coins du body{% else %}the body's corners{% endif %}</span><span><i style="--c:var(--t0902-p)"></i>{% if include.lang == "fr" %}du p (crème en vrai){% else %}the p's (cream in reality){% endif %}</span><span><i style="--c:var(--t0902-i)"></i>{% if include.lang == "fr" %}de l'img (crème en vrai){% else %}the img's (cream in reality){% endif %}</span></div>
</div>
<div class="anim-side">
<pre class="code" aria-hidden="true"><span data-on="3">&lt;p></span><span data-on="4">&lt;img></span>&lt;style>&amp;{background:#a84a4b;<span data-on="1">margin:17 67</span>;<span data-on="3 4" data-tone="2">p{zoom:2}</span>*{<span data-on="2 3 4">border:25px solid</span>;<span data-on="2" data-tone="2">border-image:conic-gradient(#f5e3b5</span></pre>
<div class="now" aria-live="polite">
<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="html et le body"><h3>1. <code>html</code> et le <code>body</code></h3><p><code>&amp;</code> seul vise <code>html</code> : fond rouge, qui va au canevas, et <code>margin:17 67</code> : une boîte de 266 × 266 en (67 ; 17). Le <code>body</code> garde sa marge par défaut de 8 : de (75 ; 25) à (325 ; 275), 250 × 250.</p></div>
<div class="cap" data-t="4" data-step="Une border-image : quatre coins"><h3>2. Une <code>border-image</code> : quatre coins</h3><p><code>*</code> imbriqué donne à tout ce qui est dans <code>html</code> une bordure de 25px et une <code>border-image</code>. <code>conic-gradient(#f5e3b5</code>, avec une seule couleur, est une image crème unie. La découpe par défaut est 100 % : chaque coin reçoit toute l'image, et les côtés et le milieu ne reçoivent rien. Le <code>body</code> ne montre que quatre carrés crème de 25px, à ses coins.</p></div>
<div class="cap" data-t="8" data-step="Le p zoomé : quatre carrés moyens"><h3>3. Le <code>p</code> zoomé : quatre carrés moyens</h3><p><code>p{zoom:2}</code> double tout le <code>p</code> : sa bordure fait 50px à l'écran. En mode quirks, sa marge par défaut est ignorée en haut du <code>body</code> : il commence juste dans sa bordure, en (100 ; 50), et fait 200 × 200. Quatre carrés crème de 50px, un cran plus à l'intérieur.</p></div>
<div class="cap" data-t="12" data-step="L'img : un carré plein"><h3>4. L'<code>img</code> : un carré plein</h3><p>L'<code>img</code>, dans le <code>p</code>, est zoomée elle aussi : bordure de 50px. Vide, elle fait 0 + 50 + 50 = 100 de côté, en (150 ; 100), au milieu de la ligne du <code>p</code>. Ses quatre coins de 50 se touchent : un carré crème plein de 100 × 100 au centre.</p></div>
<div class="cap" data-t="16" data-step="Résultat" data-live="113 caractères · 100 % identique"><h3>5. Résultat : 113 caractères</h3><p>Trois boîtes emboîtées, une seule <code>border-image</code> d'une couleur : 4 + 4 + 4 coins.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html and the body"><h3>1. <code>html</code> and the <code>body</code></h3><p>A lone <code>&amp;</code> matches <code>html</code>: a red background, which goes to the canvas, and <code>margin:17 67</code>: a 266 × 266 box at (67, 17). The <code>body</code> keeps its default 8 margin: from (75, 25) to (325, 275), 250 × 250.</p></div>
<div class="cap" data-t="4" data-step="A border-image: four corners"><h3>2. A <code>border-image</code>: four corners</h3><p>The nested <code>*</code> gives everything inside <code>html</code> a 25px border and a <code>border-image</code>. <code>conic-gradient(#f5e3b5</code>, with a single color, is a plain cream image. The default slice is 100%: each corner gets the whole image, and the sides and middle get nothing. The <code>body</code> only shows four 25px cream squares, at its corners.</p></div>
<div class="cap" data-t="8" data-step="The zoomed p: four medium squares"><h3>3. The zoomed <code>p</code>: four medium squares</h3><p><code>p{zoom:2}</code> doubles the whole <code>p</code>: its border is 50px on screen. In quirks mode, its default margin is dropped at the top of the <code>body</code>: it starts right inside its border, at (100, 50), and is 200 × 200. Four 50px cream squares, one step further in.</p></div>
<div class="cap" data-t="12" data-step="The img: a solid square"><h3>4. The <code>img</code>: a solid square</h3><p>The <code>img</code>, inside the <code>p</code>, is zoomed too: a 50px border. Empty, it is 0 + 50 + 50 = 100 wide, at (150, 100), in the middle of the <code>p</code>'s line. Its four 50 corners touch: a solid 100 × 100 cream square in the centre.</p></div>
<div class="cap" data-t="16" data-step="Result" data-live="113 characters · 100% match"><h3>5. Result: 113 characters</h3><p>Three nested boxes, one single-color <code>border-image</code>: 4 + 4 + 4 corners.</p></div>
{%- endif %}
</div>
<div class="live"></div>
</div>
</div>
<script>
(window.AnimScenes = window.AnimScenes || {}).t0902 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const L = (k) => $(`.t0902-l-${k}`);
  // boxes: x, y, size, corner size, teaching color
  const BOX = { body: [75, 25, 250, 25, '--t0902-c'], p: [100, 50, 200, 50, '--t0902-p'], img: [150, 100, 100, 50, '--t0902-i'] };
  for (const k of Object.keys(BOX)) {
    const g = $(`[data-g="${k}"]`);
    for (let i = 0; i < 4; i += 1) { const e = document.createElement('i'); e.className = 't0902-k'; g.append(e); }
  }
  const W = { body: [4.2, 5.8], p: [8.2, 9.8], img: [12.2, 13.8], fin: [16.1, 16.9] };
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const c = fr ? ' :' : ':';
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const real = !teach || t >= W.fin[0];
    const guides = t < W.fin[0] ? 1 : 0;
    for (const [k, [x, y, s, cs, col]] of Object.entries(BOX)) {
      const m = pr(t, W[k]);
      const corners = $$(`[data-g="${k}"] i`);
      const pos = [[x, y], [x + s - cs, y], [x, y + s - cs], [x + s - cs, y + s - cs]];
      corners.forEach((e, i) => {
        const sz = cs * m;
        Object.assign(e.style, { left: `${pos[i][0] + (cs - sz) * (i % 2)}px`, top: `${pos[i][1] + (cs - sz) * (i > 1 ? 1 : 0)}px`, width: `${sz}px`, height: `${sz}px`, background: real ? 'var(--t0902-c)' : `var(${col})` });
      });
      $(`[data-o="${k}"]`).style.opacity = ((k === 'body' || m > 0) && step <= 3 ? 1 : 0) * guides;
    }
    L('b').style.opacity = win(t, W.body[0], W.p[0] - 0.2);
    L('p').style.opacity = win(t, W.p[0], W.img[0] - 0.2);
    L('i').style.opacity = win(t, W.img[0], W.fin[0]);
    let txt = '';
    if (step === 0) txt = `html${c} 266 × 266 · body${c} 250 × 250`;
    else if (step === 1) txt = `body${c} 4 × 25px`;
    else if (step === 2) txt = `p${c} 4 × 50px`;
    else if (step === 3) txt = `img${c} 100 × 100`;
    else txt = $$('.caps .cap')[4].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
</figure>
