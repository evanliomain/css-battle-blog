<figure class="anim t1026" data-duration="30" data-scene="t1026" data-wide="-50 -40 500 380" style="--bg:#479582">
<style>
.t1026{--blue:#2834ba;--mark:#fef3c7}

<b class="t1026-lab t1026-l-u" style="left:6px;top:24px">{% if include.lang == "fr" %}<b>u</b> : bordures de 10px{% else %}<b>u</b>: 10px borders{% endif %}</b>
<b class="t1026-lab t1026-l-ul" style="left:6px;top:281px">{% if include.lang == "fr" %}<b>ul</b> (bloc) : coupe s et u{% else %}<b>ul</b> (block): splits s and u{% endif %}</b>
<b class="t1026-lab t1026-l-i" style="left:6px;top:6px">{% if include.lang == "fr" %}<b>i</b> : début ligne 2, fin ligne 4{% else %}<b>i</b>: start on line 2, end on line 4{% endif %}</b>

<b class="t1026-lab t1026-l-hout" style="left:226px;top:321px">{% if include.lang == "fr" %}boîte de <b>html</b> tournée : y 22 → 308{% else %}turned <b>html</b> box: y 22 → 308{% endif %}</b>
<b class="t1026-lab t1026-l-map" style="left:6px;top:24px">{% if include.lang == "fr" %}lignes → colonnes, début → haut{% else %}lines → columns, start → top{% endif %}</b>
</div>

<div class="anim-side">
<pre class="code" aria-hidden="true"><span data-on="2">&lt;s>&lt;u></span><span data-on="2" data-tone="2">&lt;ul></span><span data-on="3">&lt;i></span><span data-on="4">&lt;b dir=rtl></span><span data-on="3" data-tone="2">&lt;li></span>&lt;style><span data-on="2 3 4">s,u,i,b{border:5vw solid#2834ba;border-radius:1in;padding:30;margin:-50}</span><span data-on="2">s{border-width:0 40;margin:180}u{border-width:10;padding:10 30}</span><span data-on="4">b{margin:110}</span>&amp;{<span data-on="5">rotate:1 1 0 180deg</span>;<span data-on="1">margin:57;background:#479582;font:0/10vw"</span></pre>
<div class="now" aria-live="polite">
<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="Avant le demi-tour : des lignes"><h3>1. Avant le demi-tour : des lignes</h3><p>Imaginez d'abord la page sans rotation. Le fond de <code>html</code> part sur le canevas. <code>font:0/10vw"</code> : du texte de taille 0, mais des lignes de 40px. Le contenu du <code>body</code> tient en 5 lignes. Tout se dessine avec des bordures d'éléments en ligne, coupés d'une ligne à l'autre.</p></div>
<div class="cap" data-t="4.5" data-step="ul coupe s et u : les prises"><h3>2. ul coupe s et u : les prises</h3><p><code>&lt;s></code> et <code>&lt;u></code> sont en ligne, et le <code>&lt;ul></code> est un bloc : il les coupe en deux morceaux, ligne 1 et ligne 5. Le premier morceau a les bordures de début, le second celles de fin. <code>s</code> (bordures de début et de fin de 40) fait les têtes de prise, <code>u</code> (bordures de 10) les broches.</p></div>
<div class="cap" data-t="10" data-step="li coupe i : deux boucles ouvertes"><h3>3. li coupe i : deux boucles ouvertes</h3><p>Dans le <code>ul</code> (retrait de 40px), <code>&lt;i></code> est coupé par le <code>&lt;li></code> vide, qui fait la ligne 3. Ligne 2, le début de <code>i</code> : bordure de gauche arrondie, bordures haute et basse. Ligne 4, sa fin : même chose à droite. Rayon <code>1in</code> ramené à 50px par la taille de chaque morceau.</p></div>
<div class="cap" data-t="15" data-step="b dir=rtl ferme les boucles"><h3>4. b dir=rtl ferme les boucles</h3><p><code>&lt;b dir=rtl></code> est dans <code>i</code>, coupé de la même façon. En droite-à-gauche, son début est à droite : ses morceaux sont l'inverse de ceux de <code>i</code>, et chacun ferme une boucle. <code>margin:110</code> place la seconde boucle.</p></div>
<div class="cap" data-t="20" data-step="rotate:1 1 0 180deg : lignes → colonnes"><h3>5. rotate:1 1 0 180deg : lignes → colonnes</h3><p><code>rotate:1 1 0 180deg</code> sur <code>html</code> : un demi-tour en 3D autour de la diagonale qui passe par son centre (200, 165). Aplati à l'écran, c'est une symétrie par rapport à cette diagonale : les lignes deviennent des colonnes, le début de ligne passe en haut et la fin en bas. La boîte de <code>html</code> dépasse alors un peu en bas (vue large).</p></div>
<div class="cap" data-t="26.5" data-step="Résultat" data-live="246 caractères · 100 % identique"><h3>6. Résultat : 246 caractères</h3><p>Dans les vraies couleurs, tout est bleu : six balises vides, aucune largeur ni hauteur écrite, et la rallonge est là.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="Before the turn: lines"><h3>1. Before the turn: lines</h3><p>First, picture the page without the rotation. The background of <code>html</code> goes to the canvas. <code>font:0/10vw"</code>: text of size 0, but 40px lines. The <code>body</code> content fills 5 lines. Everything is drawn with the borders of inline elements, split from one line to the next.</p></div>
<div class="cap" data-t="4.5" data-step="ul splits s and u: the plugs"><h3>2. ul splits s and u: the plugs</h3><p><code>&lt;s></code> and <code>&lt;u></code> are inline, and the <code>&lt;ul></code> is a block: it splits them in two pieces, on line 1 and line 5. The first piece gets the start borders, the second one the end borders. <code>s</code> (40px start and end borders) makes the plug heads, <code>u</code> (10px borders) the pins.</p></div>
<div class="cap" data-t="10" data-step="li splits i: two open loops"><h3>3. li splits i: two open loops</h3><p>Inside the <code>ul</code> (40px indent), <code>&lt;i></code> is split by the empty <code>&lt;li></code>, which makes line 3. On line 2, the start of <code>i</code>: a rounded left border, top and bottom borders. On line 4, its end: the same on the right. The <code>1in</code> radius shrinks to 50px to fit each piece.</p></div>
<div class="cap" data-t="15" data-step="b dir=rtl closes the loops"><h3>4. b dir=rtl closes the loops</h3><p><code>&lt;b dir=rtl></code> sits in <code>i</code> and is split the same way. Right-to-left, its start is on the right: its pieces are the opposite of <code>i</code>'s, and each one closes a loop. <code>margin:110</code> places the second loop.</p></div>
<div class="cap" data-t="20" data-step="rotate:1 1 0 180deg: lines → columns"><h3>5. rotate:1 1 0 180deg: lines → columns</h3><p><code>rotate:1 1 0 180deg</code> on <code>html</code>: a 3D half-turn around the diagonal through its center (200, 165). Flattened on screen, it mirrors the page across that diagonal: lines become columns, the start of a line goes to the top and the end to the bottom. The <code>html</code> box then sticks out a little at the bottom (wide view).</p></div>
<div class="cap" data-t="26.5" data-step="Result" data-live="246 characters · 100% match"><h3>6. Result: 246 characters</h3><p>In the real colors, everything is blue: six empty tags, no width or height anywhere, and there is the extension cord.</p></div>
{%- endif %}

<script>
(window.AnimScenes = window.AnimScenes || {}).t1026 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector('.t1026-' + s);
  const all = (s) => [...fig.querySelectorAll('.t1026-' + s)];
  const live = fig.querySelector('.live');
  const caps = [...fig.querySelectorAll('.caps .cap')];
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b, c, d) => Math.min(pr(t, a, b), 1 - pr(t, c, d));
  const op = (s, v) => all(s).forEach((e) => { e.style.opacity = v; });
  const lay = $('lay'), pieces = all('f');
  const TEACH = { s: '#e07a5f', u: '#f2cc8f', i: '#2834ba', b: '#c4a8ff' };
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    // 1: html, lines
    op('hbox', Math.min(pr(t, 0.4, 1), 1 - pr(t, 26.6, 27.2)));
    op('line', win(t, 1, 2, 19.2, 19.8));
    all('ln').forEach((e, k) => { e.style.opacity = win(t, 1.2 + 0.3 * k, 1.6 + 0.3 * k, 19.2, 19.8); });
    op('l-html', win(t, 0.6, 1, 4.2, 4.5));
    op('l-lines', win(t, 1.6, 2, 4.2, 4.5));
    // 2: s and u, split by the ul
    op('ulbox', win(t, 4.6, 5, 9.6, 10));
    op('l-ul', win(t, 4.6, 5, 9.6, 10));
    op('s1', pr(t, 5.4, 6)); op('s2', pr(t, 6.6, 7.2));
    op('u1', pr(t, 6, 6.6)); op('u2', pr(t, 7.2, 7.8));
    op('l-s', win(t, 5.4, 5.8, 9.6, 10));
    op('l-u', win(t, 6.2, 6.6, 9.6, 10));
    // 3: i, split by the li (line 3)
    op('i1', pr(t, 10.6, 11.2)); op('i2', pr(t, 12, 12.6));
    op('l-i', win(t, 10.2, 10.6, 14.6, 15));
    op('l-li', win(t, 11.2, 11.6, 14.6, 15));
    $('l3').style.background = t > 11.2 && t < 15 ? '#fef3c74d' : '';
    // 4: b dir=rtl
    op('b1', pr(t, 15.6, 16.2)); op('b2', pr(t, 16.8, 17.4));
    op('l-b', win(t, 15.2, 15.6, 19.4, 19.8));
    // 5: the half-turn around the diagonal through (200, 165)
    const a = 180 * pr(t, 21, 25);
    lay.style.rotate = `1 1 0 ${a}deg`;
    op('axis', win(t, 20.2, 20.8, 25.6, 26.2));
    op('l-rot', win(t, 20.2, 20.6, 26.2, 26.5));
    op('l-map', win(t, 25, 25.4, 26.2, 26.5));
    op('l-hout', win(t, 25, 25.4, 26.2, 26.5));
    // teaching colors until the result, then all blue
    const real = teach ? pr(t, 26.6, 27.6) : 1;
    pieces.forEach((e) => { e.style.borderColor = real < 1 ? `color-mix(in srgb,${TEACH[e.dataset.c]} ${100 - 100 * real}%,#2834ba)` : ''; });
    let txt = '';
    if (step === 0) txt = fr ? 'html : 286 × 216 en (57, 57) · lignes de 40 px, y 65 → 265' : 'html: 286 × 216 at (57, 57) · 40 px lines, y 65 → 265';
    else if (step === 1) txt = fr ? 's : morceaux de 60 × 60 · u : 40 × 40 · lignes 1 et 5' : 's: 60 × 60 pieces · u: 40 × 40 · lines 1 and 5';
    else if (step === 2) txt = fr ? 'i : morceaux de 210 × 100 · rayon 1in → 50 px · lignes 2 et 4' : 'i: 210 × 100 pieces · radius 1in → 50 px · lines 2 and 4';
    else if (step === 3) txt = fr ? 'b : morceaux de 50 × 100 · début à droite' : 'b: 50 × 100 pieces · start on the right';
    else if (step === 4) txt = `rotate: 1 1 0 ${Math.round(a)}deg` + (a > 179.5 ? (fr ? ' · (x, y) → (y + 35, x − 35)' : ' · (x, y) → (y + 35, x − 35)') : '');
    else txt = caps[step] ? caps[step].dataset.live || '' : '';
    live.textContent = txt;
  };
};
</script>
</figure>
