<div class="cap" data-t="0" data-step="Deux boîtes"><h3>1. Deux boîtes, deux marges</h3><p><code>*{</code> vise html, head, style et body ; head et style ne s'affichent pas. <code>margin:0 70</code> vaut pour html et pour body : en mode quirks, 70 sans unité compte comme 70px. html va de x = 70 à 330, et body, dans html, de 140 à 260. Le mode quirks étire aussi les deux boîtes sur toute la hauteur : 300px.</p></div>
<div class="cap" data-t="5" data-step="Le repli"><h3>2. html : le repli</h3><p>Personne ne pose <code>--x</code> sur html : <code>var()</code> donne son repli, <code>#4A9A86,5vw,#FAE29E</code>, virgules comprises. Le dégradé se lit <code>radial-gradient(1q,#4A9A86,5vw,#FAE29E 0 53q,#4C4C6B)</code>. <code>5vw</code> = 20px est un point de transition, et le 0 de <code>#FAE29E 0</code> passe à 20px : du vert net jusqu'au rayon 20. Le jaune va jusqu'à 53q = 50,08px. <code>#4C4C6B</code> se place à 100 % de la taille <code>1q</code>, 0,945px, et passe donc lui aussi à 50,08px.</p></div>
<div class="cap" data-t="10" data-step="La tuile"><h3>3. Une tuile de 37mm</h3><p><code>/37mm</code> donne la largeur de la tuile : 37mm = 139,84px. La hauteur reste <code>auto</code>, et un dégradé n'a pas de taille propre : la tuile prend toute la hauteur de html, 300px. <code>50%</code> la centre sur la boîte de html : de x = 130,08 à 269,92, avec le disque au centre, en (200, 150).</p></div>
<div class="cap" data-t="15" data-step="La répétition"><h3>4. La tuile se répète</h3><p>Le fond de html, l'élément racine, couvre tout le canevas, et la tuile s'y répète tous les 139,84px. Deux copies tombent dans le canevas, de −9,76 à 130,08 et de 269,92 à 409,76 : des disques centrés en x = 60,16 et 339,84. Les copies suivantes restent hors du canevas. En hauteur, une tuile fait déjà 300px : une seule rangée de disques se voit.</p></div>
<div class="cap" data-t="20" data-step="body"><h3>5. body échange les couleurs</h3><p>La règle imbriquée pose <code>--x:#FAE29E,5vw,#4A9A86</code> sur body : son dégradé a un centre jaune et un anneau vert. Sa tuile fait aussi 139,84 × 300, centrée sur la boîte de body, dont le centre est encore x = 200 : ses tuiles tombent pile sur celles de html.</p></div>
<div class="cap" data-t="25" data-step="La découpe"><h3>6. La boîte de body coupe</h3><p>Le fond de body s'arrête à sa boîte, de x = 140 à 260. Le disque du milieu, de 149,92 à 250,08, y tient en entier. Les disques voisins de body commencent à 289,76 et finissent à 110,24 : ils restent dehors. Autour du disque, le gris-violet de body tombe sur celui de html.</p></div>
<div class="cap" data-t="30" data-step="Résultat" data-live="127 caractères · 100 % identique"><h3>7. Résultat : 127 caractères</h3><p>Un dégradé, une tuile répétée par html, et un body assez étroit pour ne garder que le disque du milieu, aux couleurs inversées.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="Two boxes"><h3>1. Two boxes, two margins</h3><p><code>*{</code> matches html, head, style and body; head and style are not displayed. <code>margin:0 70</code> applies to html and to body: in quirks mode, a unitless 70 counts as 70px. html runs from x = 70 to 330, and body, inside html, from 140 to 260. Quirks mode also stretches both boxes to the full height: 300px.</p></div>
<div class="cap" data-t="5" data-step="Fallback"><h3>2. html: the fallback</h3><p>Nothing sets <code>--x</code> on html, so <code>var()</code> gives its fallback, <code>#4A9A86,5vw,#FAE29E</code>, commas included. The gradient reads <code>radial-gradient(1q,#4A9A86,5vw,#FAE29E 0 53q,#4C4C6B)</code>. <code>5vw</code> = 20px is a transition hint, and the 0 of <code>#FAE29E 0</code> moves up to 20px: sharp green out to radius 20. The yellow runs out to 53q = 50.08px. <code>#4C4C6B</code> sits at 100% of the <code>1q</code> size, 0.945px, so it moves up to 50.08px too.</p></div>
<div class="cap" data-t="10" data-step="The tile"><h3>3. A 37mm tile</h3><p><code>/37mm</code> sets the tile's width: 37mm = 139.84px. Its height stays <code>auto</code>, and a gradient has no size of its own: the tile takes html's full height, 300px. <code>50%</code> centers it on html's box: from x = 130.08 to 269.92, with the disc in the middle, at (200, 150).</p></div>
<div class="cap" data-t="15" data-step="The repeat"><h3>4. The tile repeats</h3><p>html is the root element, so its background covers the whole canvas, and the tile repeats every 139.84px. Two copies land on the canvas, from −9.76 to 130.08 and from 269.92 to 409.76: discs centered at x = 60.16 and 339.84. The next copies stay off the canvas. Vertically, one tile is already 300px tall: only one row of discs shows.</p></div>
<div class="cap" data-t="20" data-step="body"><h3>5. body swaps the colors</h3><p>The nested rule sets <code>--x:#FAE29E,5vw,#4A9A86</code> on body: its gradient has a yellow center and a green ring. Its tile is 139.84 × 300 too, centered on body's box, whose center is also x = 200: its tiles fall exactly on html's.</p></div>
<div class="cap" data-t="25" data-step="The cut"><h3>6. body's box cuts</h3><p>body's background stops at its box, from x = 140 to 260. The middle disc, from 149.92 to 250.08, fits inside. body's neighbouring discs start at 289.76 and end at 110.24: they stay out. Around the disc, body's gray-purple lands on html's.</p></div>
<div class="cap" data-t="30" data-step="Result" data-live="127 characters · 100% match"><h3>7. Result: 127 characters</h3><p>One gradient, one tile repeated by html, and a body narrow enough to keep only the middle disc, with its colors swapped.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0423 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.5), 1 - pr(t, b - 0.3, b));
  // Measured on the official code in local Chrome (400 × 300 iframe, quirks mode, getBoundingClientRect, getComputedStyle).
  // html: (70, 0) 260 × 300; body: (140, 0) 120 × 300. background-size 139.843px auto (37mm), position 50% 50%.
  // html (no --x): radial-gradient(1q, #4A9A86, 5vw, #FAE29E 0px, #FAE29E 53q, #4C4C6B): green to r = 20, yellow to r = 50.079.
  // body (--x set): radial-gradient(1q, #FAE29E, 5vw, #4A9A86 0px, #4A9A86 53q, #4C4C6B).
  // Tiles: ... -149.606, -9.764, 130.079, 269.921, 409.764 ... (width 139.843): disc centers -79.685, 60.157, 200, 339.843, 479.685.
  const white = $('.t0423-white');
  const hd = $$('.t0423-hd'), hm = $('.t0423-hm'), bm = $('.t0423-bm'), bg = $$('.t0423-d');
  const tl = $$('.t0423-tl'), tm = $('.t0423-tm'), html = $('.t0423-html'), body = $('.t0423-body');
  const labs = $$('.zlab');
  const ivs = { 1: [0.3, 4.8], 2: [5.3, 9.8], 3: [10.3, 14.8], 4: [15.3, 19.8], 6: [25.3, 29.8] };
  const box = (el, o, col, teach) => {
    el.style.opacity = o;
    el.style.boxShadow = teach && o > 0 ? `inset 0 0 0 calc(2px * var(--k, 1)) ${col}` : 'none';
    el.style.outline = !teach && o > 0 ? 'calc(1.5px * var(--k, 1)) dashed #fff' : 'none';
    el.style.outlineOffset = 'calc(-0.75px * var(--k, 1))';
    el.style.filter = !teach && o > 0 ? 'drop-shadow(0 0 calc(1px * var(--k, 1)) rgb(0 0 0 / .9))' : 'none';
  };
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    // step 1: white canvas and the two boxes
    white.style.opacity = 1 - pr(t, 5.4, 6.4);
    box(html, win(t, 0.3, 4.8), 'var(--t0423-hbox)', teach);
    box(body, Math.max(win(t, 0.3, 4.8), win(t, 25.3, 29.8)), 'var(--t0423-bbox)', teach);
    // step 2: html's disc in the middle; step 4: its copies
    const oc = pr(t, 15.6, 16.8);
    hd.forEach((d) => { d.style.opacity = d === hm ? pr(t, 6, 7.2) * (1 - pr(t, 21.4, 21.5)) : oc; });
    // step 3: the tile; step 4: the copies
    box(tm, win(t, 10.3, 19.8), 'var(--t0423-tile)', teach);
    tl.forEach((e) => { if (e !== tm) box(e, win(t, 15.3, 19.8), 'var(--t0423-tile)', teach); });
    // step 5: body's discs, the middle one solid, the others ghosts; step 6: the ghosts are cut away
    bm.style.opacity = pr(t, 20.4, 21.4);
    const og = Math.min(pr(t, 20.4, 21.4), 1 - pr(t, 25.6, 26.6)) * 0.4;
    bg.forEach((d) => {
      d.style.opacity = og;
      d.style.outline = og > 0 ? `calc(1.5px * var(--k, 1)) dashed ${teach ? 'var(--t0423-bbox)' : '#fff'}` : 'none';
    });
    labs.forEach((l) => { const iv = ivs[l.dataset.l]; l.style.opacity = iv ? win(t, ...iv) : 0; });
    let txt;
    if (step === 0) txt = fr ? 'html : x 70 → 330 · body : x 140 → 260 · 300px de haut' : 'html: x 70 → 330 · body: x 140 → 260 · 300px tall';
    else if (step === 1) txt = fr ? '5vw = 20px · 53q = 50,08px · 1q = 0,945px' : '5vw = 20px · 53q = 50.08px · 1q = 0.945px';
    else if (step === 2) txt = fr ? '37mm = 139,84px · auto = 300px · 50% : 130,08 → 269,92' : '37mm = 139.84px · auto = 300px · 50%: 130.08 → 269.92';
    else if (step === 3) txt = fr ? 'disques en x = 60,16 · 200 · 339,84' : 'discs at x = 60.16 · 200 · 339.84';
    else if (step === 4) txt = fr ? 'body : --x → #FAE29E,5vw,#4A9A86 0 53q' : 'body: --x → #FAE29E,5vw,#4A9A86 0 53q';
    else if (step === 5) txt = fr ? 'body : 140 → 260 · disque : 149,92 → 250,08' : 'body: 140 → 260 · disc: 149.92 → 250.08';
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
