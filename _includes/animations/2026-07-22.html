<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="html"><h3>1. html, et son fond sur le canevas</h3><p>Il n'y a pas de doctype : la page est en mode quirks. Au premier niveau, <code>&amp;</code> vise la racine : html. Le fond de html est peint sur tout le canevas, quelle que soit la taille de sa boîte : <code>background:#2D3464</code> donne le bleu nuit.</p></div>
<div class="cap" data-t="5" data-step="La boîte"><h3>2. Une petite boîte de 34 × 24</h3><p><code>margin:138 183</code> compte en px. En mode quirks, html remplit la fenêtre, moins ses marges : 400 − 2 × 183 = 34 de large, 300 − 2 × 138 = 24 de haut. La boîte va de (183, 138) à (217, 162), au centre du canevas. La loupe en haut à gauche la montre cinq fois plus grande : elle n'est là que pour l'animation.</p></div>
<div class="cap" data-t="10" data-step="La bordure"><h3>3. Une bordure de 2px, sans style</h3><p><code>border:3q#F7EC7D</code> donne la largeur et la couleur. 3q = 0,75mm = 2,835px, et Chrome arrondit la largeur d'une bordure au pixel inférieur : 2px. Le raccourci ne donne pas de style : il reste à <code>none</code>, et rien n'est encore dessiné.</p></div>
<div class="cap" data-t="15" data-step="Les styles"><h3>4. Des points en haut et en bas</h3><p><code>border-style:dotted solid</code> : la première valeur va en haut et en bas, la seconde à gauche et à droite. Les côtés sont deux barres pleines de 2px, sur toute la hauteur. En haut et en bas, une bordure pointillée de 2px fait des carrés de 2 × 2, séparés de 2px : sept points, à x = 187, 191, … 211.</p></div>
<div class="cap" data-t="20" data-step="scale"><h3>5. Dix fois plus grand</h3><p><code>scale:10</code> agrandit la boîte autour de son centre, (200, 150). 34 × 24 devient 340 × 240, de (30, 30) à (370, 270). Les barres font 20px de large, les points deviennent des carrés de 20 × 20, séparés de 20px. Le fond reste sur le canevas : il ne change pas.</p></div>
<div class="cap" data-t="26" data-step="Résultat" data-live="94 caractères · 100 % identique"><h3>6. Résultat : 94 caractères</h3><p>Une bordure pointillée minuscule, agrandie dix fois : deux barres et quatorze carrés, une pellicule.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html"><h3>1. html, and its background on the canvas</h3><p>There is no doctype: the page is in quirks mode. At the top level, <code>&amp;</code> targets the root: html. html's background is painted on the whole canvas, whatever the size of its box: <code>background:#2D3464</code> gives the navy blue.</p></div>
<div class="cap" data-t="5" data-step="The box"><h3>2. A small 34 × 24 box</h3><p><code>margin:138 183</code> counts in px. In quirks mode, html fills the window, minus its margins: 400 − 2 × 183 = 34 wide, 300 − 2 × 138 = 24 tall. The box runs from (183, 138) to (217, 162), in the middle of the canvas. The magnifier at the top left shows it five times bigger: it is only there for the animation.</p></div>
<div class="cap" data-t="10" data-step="Border"><h3>3. A 2px border, with no style</h3><p><code>border:3q#F7EC7D</code> sets the width and the color. 3q = 0.75mm = 2.835px, and Chrome rounds a border width down to whole pixels: 2px. The shorthand sets no style: it stays <code>none</code>, and nothing is drawn yet.</p></div>
<div class="cap" data-t="15" data-step="Styles"><h3>4. Dots at the top and bottom</h3><p><code>border-style:dotted solid</code>: the first value goes to the top and bottom, the second one to the left and right. The sides are two solid 2px bars, full height. At the top and bottom, a 2px dotted border makes 2 × 2 squares, 2px apart: seven dots, at x = 187, 191, … 211.</p></div>
<div class="cap" data-t="20" data-step="scale"><h3>5. Ten times bigger</h3><p><code>scale:10</code> makes the box bigger around its center, (200, 150). 34 × 24 becomes 340 × 240, from (30, 30) to (370, 270). The bars are 20px wide, and the dots become 20 × 20 squares, 20px apart. The background stays on the canvas: it does not change.</p></div>
<div class="cap" data-t="26" data-step="Result" data-live="94 characters · 100% match"><h3>6. Result: 94 characters</h3><p>A tiny dotted border, scaled by ten: two bars and fourteen squares, a film strip.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0722 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const c = fr ? '\u00a0:' : ':';
  const dec = (x, n) => (fr ? x.toFixed(n).replace('.', ',') : x.toFixed(n));
  // Measured on the official code in local Chrome (quirks mode, 400 × 300 iframe), getBoundingClientRect and computed styles:
  // html: offset box (183, 138, 34 × 24), border 2px (3q floored), border-style "dotted solid", scale 10;
  // scaled box (30, 30, 340 × 240). Unscaled render: side bars x = 183..185 and 215..217, y = 138..162;
  // dots 2 × 2 at x = 187, 191, …, 211, rows y = 138..140 and 160..162. body: 14 × 4, transparent.
  const FIN = 26;
  const w = $('.t0722-w'), h = $('.t0722-h'), lp = $('.t0722-lp'), box = $('.t0722-box'), lpl = $('.t0722-lpl');
  const L = (k) => $$(`.t0722-l[data-l="${k}"]`);
  const css = getComputedStyle(fig);
  const col = (n) => css.getPropertyValue(`--t0722-${n}`).trim();
  const place = (e, x, y, wd, ht) => { e.style.left = `${x}px`; e.style.top = `${y}px`; e.style.width = `${wd}px`; e.style.height = `${ht}px`; };
  // the html box, in its own px (34 × 24): a ghost ring (step 3), two side bars, fourteen dots
  const build = (host) => {
    const parts = { g: null, sides: [], dots: [] };
    const add = (cls, x, y, wd, ht) => { const e = document.createElement('div'); if (cls) e.className = cls; place(e, x, y, wd, ht); host.appendChild(e); return e; };
    parts.g = add('t0722-g', 0, 0, 34, 24);
    for (let i = 0; i < 7; i++) parts.dots.push(add('', 4 + 4 * i, 0, 2, 2), add('', 4 + 4 * i, 22, 2, 2));
    parts.sides.push(add('', 0, 0, 2, 24), add('', 32, 0, 2, 24));
    return parts;
  };
  const P = [build(h), build(lp.firstElementChild)];
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    const ann = 1 - pr(t, [FIN, FIN + 0.6]);
    const Y = col('y');
    // 1. html's background on the canvas: the white canvas turns navy
    w.style.opacity = 1 - pr(t, [0.6, 1.8]);
    // 3. the border: width and color, no style (ghost); 4. dotted at the top and bottom, solid on the sides
    const ghost = 0.45 * Math.min(pr(t, [10.6, 11.6]), 1 - pr(t, [15.6, 16.4]));
    const drawn = pr(t, [15.8, 17]);
    P.forEach((p) => {
      p.g.style.opacity = ghost;
      p.g.style.borderColor = teach ? '#fff' : Y;
      p.sides.forEach((e) => { e.style.background = teach ? col('sd') : Y; e.style.opacity = drawn; });
      p.dots.forEach((e) => { e.style.background = teach ? col('dt') : Y; e.style.opacity = drawn; });
    });
    // 5. scale: 1 → 10 around the center (200, 150)
    const s = 1 + 9 * pr(t, [20.6, 24.4]);
    h.style.transform = `scale(${s})`;
    // magnifier (steps 2 to 4)
    const lo = Math.min(pr(t, [5.6, 6.4]), 1 - pr(t, [20.2, 20.8]));
    lp.style.opacity = lo; lpl.style.opacity = lo;
    // html's box outline (steps 2 and 5)
    place(box, 200 - 17 * s, 150 - 12 * s, 34 * s, 24 * s);
    box.style.opacity = 0.9 * Math.max(win(t, 5.3, 9.8), win(t, 20.3, 25.8));
    [[0.3, 4.8], [5.3, 9.8], [10.3, 14.8], [15.3, 19.8], [20.3, 25.8]].forEach(([a, z], k) => L(k + 1).forEach((e) => (e.style.opacity = win(t, a, z) * ann)));
    let txt;
    if (step === 0) txt = `${fr ? 'canevas' : 'canvas'}${c} #2D3464 · html = ${fr ? 'racine' : 'root'}`;
    else if (step === 1) txt = `html${c} 400 − 2 × 183 = 34 · 300 − 2 × 138 = 24`;
    else if (step === 2) txt = `${fr ? 'bordure' : 'border'}${c} 3q = ${dec(2.835, 3)}px → 2px · ${fr ? 'style' : 'style'}${c} none`;
    else if (step === 3) txt = `${fr ? 'points' : 'dots'}${c} x = 187, 191, …, 211 · y = 138, 160`;
    else if (step === 4) txt = `scale${c} ${dec(s, 1)} · ${dec(34 * s, 1)} × ${dec(24 * s, 1)}`;
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
