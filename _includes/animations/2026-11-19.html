<div class="cap" data-t="0" data-step="Un gris fait de noir transparent"><h3>1. Un gris fait de noir transparent</h3><p>Seul en haut de la feuille, <code>&amp;</code> désigne la racine, <code>html</code>. <code>#222a</code> est un hex à 4 chiffres : <code>#222222</code> avec une opacité de <code>aa</code> = 170/255, soit 2/3. Le fond de <code>html</code> passe au canevas, posé sur le blanc de la page : 34 × 2/3 + 255 × 1/3 = 107,7, arrondi à 108 = <code>6c</code>. C'est pile le gris de la cible.</p></div>
<div class="cap" data-t="4" data-step="margin:0 165 230 : un carré de 70"><h3>2. <code>margin:0 165 230</code> : un carré de 70</h3><p>En mode quirks, les nombres sans unité sont des px. <code>html</code> fait 400 − 2 × 165 = 70 de large, et il remplit la hauteur du cadre moins ses marges : 300 − 230 = 70. Un carré de 70 en (165, 0), de centre (200, 35). Son fond est parti au canevas : la boîte elle-même ne peint rien. Seules ses ombres vont se voir.</p></div>
<div class="cap" data-t="8" data-step="Un coin pointu, tourné vers le haut"><h3>3. Un coin pointu, tourné vers le haut</h3><p><code>border-radius:0%50%50%</code> : le 4ᵉ rayon reprend le 2ᵉ, donc 0, 35, 35, 35. Trois coins ronds, un coin pointu en haut à gauche. <code>rotate:45deg</code> tourne la boîte autour de son centre : la pointe monte tout en haut. La diagonale de la boîte est maintenant verticale.</p></div>
<div class="cap" data-t="13" data-step="Deux ombres qui descendent"><h3>4. Deux ombres qui descendent</h3><p>Les ombres tournent avec la boîte. Un décalage (d, d) suit sa diagonale : à l'écran, il descend tout droit de d × √2. <code>86Q</code> = 81,26px donne 114,92 : une goutte marine centrée en (200, 149,92). <code>29mm</code> = 109,61px donne 155,01 : une goutte blanche en (200, 190,01). La première ombre est peinte au-dessus : la pointe blanche, en y = 140,5, est cachée par le disque marine.</p></div>
<div class="cap" data-t="18" data-step="La 3ᵉ ombre reste hors cadre"><h3>5. La 3ᵉ ombre reste hors cadre</h3><p><code>-56q</code> = −52,91px : cette ombre monte de 74,83. L'étalement <code>3Q</code> = 2,83 l'élargit à 75,67. Son centre tombe en y = −39,8, et son bas arrondi s'arrête en y = −2 : juste au-dessus du canevas. Sur <code>html</code>, elle ne sert à rien. Elle est là pour le <code>body</code>.</p></div>
<div class="cap" data-t="22" data-step="Le body reçoit les mêmes règles"><h3>6. Le <code>body</code> reçoit les mêmes règles</h3><p>Le <code>*</code> vise aussi le <code>body</code>. En mode quirks, il garde sa marge de 8 et remplit <code>html</code> : 54 × 54 en (173, 8), au même centre (200, 35). Il tourne avec <code>html</code>, et il prend le même rayon et les trois mêmes ombres. Pour l'instant, ses copies marine et blanche se posent sur celles de <code>html</code>, et sa copie bleu clair monte.</p></div>
<div class="cap" data-t="26" data-step="scale:-1 : un demi-tour"><h3>7. <code>scale:-1</code> : un demi-tour</h3><p>Imbriqué dans <code>&amp;</code>, ce <code>*</code> ne vise que le <code>body</code>. <code>scale:-1</code> retourne les deux axes autour du centre : c'est un demi-tour. Sa pointe passe en bas, et ses décalages changent de sens. Marine et blanc montent hors cadre, en y = −79,9 et −120. La goutte bleu clair descend de 74,83 en (200, 109,8) : 54 + 2 × 2,83 = 59,67 de large, pointe en y = 152. Peinte après les ombres de <code>html</code>, elle couvre la pointe marine.</p></div>
<div class="cap" data-t="31" data-step="Résultat" data-live="153 caractères · 100 % identique"><h3>8. Résultat : 153 caractères</h3><p>Une seule forme de goutte, une seule liste de trois ombres, portée par deux éléments. Le demi-tour du <code>body</code> choisit quelles ombres tombent sur le canevas : deux pour <code>html</code>, une pour le <code>body</code>.</p></div>

<div class="cap" data-t="0" data-step="A gray made of see-through black"><h3>1. A gray made of see-through black</h3><p>Alone at the top of the sheet, <code>&amp;</code> is the root, <code>html</code>. <code>#222a</code> is a 4-digit hex: <code>#222222</code> with an alpha of <code>aa</code> = 170/255, which is 2/3. <code>html</code>'s background goes to the canvas, over the page's white: 34 × 2/3 + 255 × 1/3 = 107.7, rounded to 108 = <code>6c</code>. Exactly the target's gray.</p></div>
<div class="cap" data-t="4" data-step="margin:0 165 230: a 70px square"><h3>2. <code>margin:0 165 230</code>: a 70px square</h3><p>In quirks mode, numbers with no unit are px. <code>html</code> is 400 − 2 × 165 = 70 wide, and it fills the frame's height minus its margins: 300 − 230 = 70. A 70px square at (165, 0), centered on (200, 35). Its background went to the canvas: the box itself paints nothing. Only its shadows will show.</p></div>
<div class="cap" data-t="8" data-step="One sharp corner, turned up"><h3>3. One sharp corner, turned up</h3><p><code>border-radius:0%50%50%</code>: the 4th radius repeats the 2nd, so 0, 35, 35, 35. Three round corners, one sharp corner at the top left. <code>rotate:45deg</code> turns the box around its center: the sharp corner goes to the very top. The box's diagonal is now vertical.</p></div>
<div class="cap" data-t="13" data-step="Two shadows going down"><h3>4. Two shadows going down</h3><p>Shadows turn with their box. An offset (d, d) runs along its diagonal: on screen, it goes straight down by d × √2. <code>86Q</code> = 81.26px gives 114.92: a navy drop centered on (200, 149.92). <code>29mm</code> = 109.61px gives 155.01: a white drop at (200, 190.01). The first shadow is painted on top: the white point, at y = 140.5, is hidden by the navy disc.</p></div>
<div class="cap" data-t="18" data-step="The 3rd shadow stays off canvas"><h3>5. The 3rd shadow stays off canvas</h3><p><code>-56q</code> = −52.91px: this shadow goes up by 74.83. The <code>3Q</code> spread (2.83) widens it to 75.67. Its center lands at y = −39.8, and its round bottom stops at y = −2: just above the canvas. On <code>html</code>, it is useless. It is there for the <code>body</code>.</p></div>
<div class="cap" data-t="22" data-step="The body gets the same rules"><h3>6. The <code>body</code> gets the same rules</h3><p>The <code>*</code> also targets the <code>body</code>. In quirks mode, it keeps its 8px margin and fills <code>html</code>: 54 × 54 at (173, 8), with the same center (200, 35). It turns with <code>html</code>, and it gets the same radius and the same three shadows. For now, its navy and white copies sit on <code>html</code>'s, and its light blue copy goes up.</p></div>
<div class="cap" data-t="26" data-step="scale:-1: a half-turn"><h3>7. <code>scale:-1</code>: a half-turn</h3><p>Nested in <code>&amp;</code>, this <code>*</code> only targets the <code>body</code>. <code>scale:-1</code> flips both axes around the center: a half-turn. Its point goes down, and its offsets change direction. Navy and white go up, off canvas, to y = −79.9 and −120. The light blue drop comes down by 74.83 to (200, 109.8): 54 + 2 × 2.83 = 59.67 wide, point at y = 152. Painted after <code>html</code>'s shadows, it covers the navy point.</p></div>
<div class="cap" data-t="31" data-step="Result" data-live="153 characters · 100% match"><h3>8. Result: 153 characters</h3><p>One drop shape, one list of three shadows, on two elements. The <code>body</code>'s half-turn picks which shadows land on the canvas: two for <code>html</code>, one for the <code>body</code>.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t1119 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const CG = $('.t1119-cg'), H = $('[data-f="html"]'), B = $('[data-f="body"]'), live = $('.live');
  const S = (o, c) => $(`.t1119-s[data-o="${o}"][data-c="${c}"]`);
  const OH = $('.t1119-o[data-o="h"]'), OB = $('.t1119-o[data-o="b"]');
  const K = (n) => $$(`.t1119-k${n}`);
  const L = (k) => $(`.t1119-l-${k}`);
  // measured in Chrome: 86Q = 81.2598px, 29mm = 109.606px, -56q = -52.9134px, 3Q = 2.83465px
  const D1 = 81.2598, D2 = 109.606, D3 = -52.9134, SP = 2.83465;
  const W = { a: [0.3, 2.3], b: [4.3, 6.8], r: [8.3, 9.6], c: [9.8, 11.8], d: [13.3, 16.3], e: [18.3, 20.8], f: [22.3, 24.3], g: [26.3, 29.3], fin: [31.1, 31.9] };
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const lerp = (a, b, m) => a + (b - a) * m;
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const num = (v, d) => v.toFixed(d).replace('.', fr ? ',' : '.').replace('-', '−');
  const c = fr ? ' :' : ':';
  const set = (el, size, dx, dy, sp, r, op, ow) => {
    Object.assign(el.style, { left: `${dx - sp}px`, top: `${dy - sp}px`, width: `${size + 2 * sp}px`, height: `${size + 2 * sp}px`, borderRadius: r, opacity: op, outline: ow });
  };
  return (t, st) => {
    const step = st + 1;
    const teach = fig.dataset.teach === '1';
    const fin = t >= W.fin[0];
    const real = !teach || fin;
    const a = pr(t, W.a), b = pr(t, W.b), r = pr(t, W.r), cc = pr(t, W.c), d = pr(t, W.d), e = pr(t, W.e), f = pr(t, W.f), g = pr(t, W.g);
    CG.style.opacity = a;
    // html: the whole frame (0, 0, 400, 300), then margin 0 165 230 → (165, 0) 70 × 70, then rotate
    const hl = lerp(0, 165, b), hw = 400 - 2 * hl, hh = lerp(300, 70, b);
    Object.assign(H.style, { left: `${hl}px`, top: '0px', width: `${hw}px`, height: `${hh}px`, transform: `rotate(${45 * cc}deg)` });
    const rad = r > 0 ? `0 ${50 * r}% ${50 * r}%` : '0';
    const ow = (who) => (real ? 'none' : `2px solid var(--t1119-${who})`);
    // html's shadows: offsets grow along the turned diagonal
    set(S('h', 'n'), 70, D1 * d, D1 * d, 0, rad, d > 0 ? 1 : 0, ow('html'));
    set(S('h', 'w'), 70, D2 * d, D2 * d, 0, rad, d > 0 ? 1 : 0, ow('html'));
    set(S('h', 'l'), 70, D3 * e, D3 * e, SP * e, rad, e > 0 ? 1 : 0, ow('html'));
    // html box: dashed guide, orange fill in teaching colors
    const guides = fin ? 0 : 1;
    OH.style.opacity = (step >= 2 ? 1 : 0) * guides;
    OH.style.borderRadius = rad;
    OH.style.background = teach && !fin ? 'color-mix(in srgb, var(--t1119-html) 35%, transparent)' : 'none';
    OH.style.borderColor = teach ? 'var(--t1119-html)' : '';
    OH.firstElementChild.style.opacity = teach && step >= 2 && step <= 5 ? 1 : 0;
    // body: 8px inside html (quirks), same center; scale:-1 shown as a half-turn
    Object.assign(B.style, { left: '8px', top: '8px', width: `${hw - 16}px`, height: `${hh - 16}px`, transform: `rotate(${180 * g}deg)`, opacity: f });
    set(S('b', 'n'), 54, D1, D1, 0, '0 50% 50%', f, ow('body'));
    set(S('b', 'w'), 54, D2, D2, 0, '0 50% 50%', f, ow('body'));
    set(S('b', 'l'), 54, D3, D3, SP, '0 50% 50%', f, ow('body'));
    OB.style.opacity = guides;
    OB.style.borderRadius = '0 50% 50%';
    OB.style.background = teach && !fin ? 'color-mix(in srgb, var(--t1119-body) 35%, transparent)' : 'none';
    OB.style.borderColor = teach ? 'var(--t1119-body)' : '';
    OB.firstElementChild.style.opacity = teach && step >= 6 && !fin ? 1 : 0;
    // digits in the code
    K(6).forEach((k) => (k.textContent = String(Math.round(165 * b))));
    K(7).forEach((k) => (k.textContent = String(Math.round(230 * b))));
    K(5).forEach((k) => (k.textContent = String(Math.round(45 * cc))));
    K(1).forEach((k) => (k.textContent = String(Math.round(86 * d))));
    K(2).forEach((k) => (k.textContent = String(Math.round(29 * d))));
    K(3).forEach((k) => (k.textContent = String(Math.round(-56 * e))));
    K(4).forEach((k) => (k.textContent = String(Math.round(3 * e))));
    K(8).forEach((k) => (k.textContent = g <= 0 ? '1' : g >= 1 ? '-1' : (Math.abs(1 - 2 * g) < 0.05 ? '0' : (1 - 2 * g).toFixed(1))));
    L('a').style.opacity = win(t, 0.3, W.b[0] - 0.2);
    L('b').style.opacity = win(t, W.b[0], W.r[0] - 0.2);
    L('c').style.opacity = win(t, W.r[0], W.d[0] - 0.2);
    L('d').style.opacity = win(t, W.d[0] + 1, W.e[0] - 0.2);
    L('e').style.opacity = win(t, W.d[0] + 1, W.e[0] - 0.2);
    L('f').style.opacity = win(t, W.e[0] + 1, W.f[0] - 0.2);
    L('g').style.opacity = win(t, W.f[0], W.g[0] - 0.2);
    L('h').style.opacity = win(t, W.g[0], W.fin[0]);
    let txt = '';
    if (step === 1) txt = `${fr ? 'canevas' : 'canvas'}${c} ${a < 0.5 ? '#ffffff' : '#6c6c6c'}`;
    else if (step === 2) txt = `html${c} ${Math.round(hw)} × ${Math.round(hh)} ${fr ? 'en' : 'at'} (${Math.round(hl)}, 0)`;
    else if (step === 3) txt = `rotate${c} ${Math.round(45 * cc)}° · ${fr ? 'pointe' : 'point'} y = ${num(35 - 35 * Math.SQRT2 * Math.sin((45 + 45 * cc) * Math.PI / 180), 1)}`;
    else if (step === 4) txt = `↓ ${num(D1 * Math.SQRT2 * d, 2)} · ↓ ${num(D2 * Math.SQRT2 * d, 2)}`;
    else if (step === 5) txt = `↑ ${num(-D3 * Math.SQRT2 * e, 2)} · ${fr ? 'centre' : 'center'} y = ${num(35 + D3 * Math.SQRT2 * e, 1)}`;
    else if (step === 6) txt = `body${c} 54 × 54 ${fr ? 'en' : 'at'} (173, 8)`;
    else if (step === 7) txt = `body${c} ${Math.round(180 * g)}° · ${fr ? 'bleu clair' : 'light blue'} y = ${num(35 + D3 * Math.SQRT2 * Math.cos(Math.PI * g), 1)}`;
    else txt = $$('.caps .cap')[7].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
