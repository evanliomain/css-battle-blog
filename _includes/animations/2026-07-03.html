<div class="now" aria-live="polite">
<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="Disque"><h3>1. Le disque de html</h3><p><code>*</code> donne à chaque élément le même fond. Sur html, il couvre le canevas. <code>1Q</code> fait du dégradé un cercle de 0,945px de rayon. L'indice <code>25vw</code> vaut 100px : il repousse le bleu clair jusqu'à 100px. Il reste un disque sombre de 100px de rayon, centré en (200, 150).</p></div>
<div class="cap" data-t="5" data-step="body"><h3>2. La boîte de body</h3><p>Le <code>*</code> imbriqué vise tout sauf html. Les pourcentages se calculent sur la largeur, 400px : body est 100px plus bas et 140px plus à l'intérieur, de x = 140 à 260. En mode quirks, body remplit la hauteur de html moins ses marges : 300 − 100 + 999 = 1199px.</p></div>
<div class="cap" data-t="10" data-step="Disque de body"><h3>3. Le disque de body tombe hors du canevas</h3><p>body a le même dégradé : un disque de 100px de rayon au centre de sa boîte, en (200, 699,5). Il va de y = 599,5 à 799,5, loin sous le canevas. Sur le canevas, body n'est que du bleu clair : une bande de 120px qui coupe le disque de html. C'est la tête du robot.</p></div>
<div class="cap" data-t="15" data-step="Yeux"><h3>4. Deux images pour les yeux</h3><p>Le troisième <code>*</code> vise les enfants de body. Une <code>&lt;img></code> vide n'a pas de contenu : <code>padding:.94em</code>, 15,04px avec sa police de 16px, en fait un carré de 30,06px. <code>margin:30 0 0 20</code> place les yeux en (160, 130) et (210,06, 130). Le disque de chaque image la couvre entièrement : elle est sombre.</p></div>
<div class="cap" data-t="20" data-step="Bouche"><h3>5. Un h6 pour la bouche</h3><p>La police d'un h6 fait 10,72px : le même <code>.94em</code> ne donne que 10,08px. Le h6 vide fait 20,13px de haut. <code>margin:30 25</code> lui laisse 70px de large : la bouche va de (165, 190,06) à (235, 210,19).</p></div>
<div class="cap" data-t="25" data-step="Barre"><h3>6. Le h6 suivant fait la barre</h3><p>Le second <code>&lt;h6></code> ferme le premier : ils sont frères. <code>+*</code> le vise et lui donne <code>margin:-10 10</code> : 100px de large, de x = 150 à 250. Sa marge du haut, −10, fusionne avec les 30px du bas de la bouche : il reste 20px. La barre va de y = 230,19 à 250,31.</p></div>
<div class="cap" data-t="30" data-step="Résultat" data-live="161 caractères · 100 % identique"><h3>7. Résultat : 161 caractères</h3><p>Un seul dégradé partout : il fait le disque sur html, il est rejeté hors du canevas sur body, et il noircit les quatre petites boîtes.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="Disc"><h3>1. html's disc</h3><p><code>*</code> gives every element the same background. On html, it covers the canvas. <code>1Q</code> makes the gradient a circle with a 0.945px radius. The hint <code>25vw</code> is 100px: it pushes the light blue out to 100px. What is left is a dark disc with a 100px radius, centered at (200, 150).</p></div>
<div class="cap" data-t="5" data-step="body"><h3>2. body's box</h3><p>The nested <code>*</code> selects everything but html. Percentages use the width, 400px: body is 100px down and 140px in, from x = 140 to 260. In quirks mode, body fills html's height minus its margins: 300 − 100 + 999 = 1199px.</p></div>
<div class="cap" data-t="10" data-step="body's disc"><h3>3. body's disc falls off the canvas</h3><p>body has the same gradient: a disc with a 100px radius at the center of its box, at (200, 699.5). It runs from y = 599.5 to 799.5, far below the canvas. On the canvas, body is only light blue: a 120px strip across html's disc. That is the robot's head.</p></div>
<div class="cap" data-t="15" data-step="Eyes"><h3>4. Two images for the eyes</h3><p>The third <code>*</code> selects body's children. An empty <code>&lt;img></code> has no content: <code>padding:.94em</code>, 15.04px with its 16px font, makes it a 30.06px square. <code>margin:30 0 0 20</code> puts the eyes at (160, 130) and (210.06, 130). Each image's own disc covers it entirely: it is dark.</p></div>
<div class="cap" data-t="20" data-step="Mouth"><h3>5. An h6 for the mouth</h3><p>An h6's font is 10.72px: the same <code>.94em</code> gives only 10.08px. The empty h6 is 20.13px tall. <code>margin:30 25</code> leaves it 70px wide: the mouth runs from (165, 190.06) to (235, 210.19).</p></div>
<div class="cap" data-t="25" data-step="Bar"><h3>6. The next h6 is the bar</h3><p>The second <code>&lt;h6></code> closes the first: they are siblings. <code>+*</code> selects it and gives it <code>margin:-10 10</code>: 100px wide, from x = 150 to 250. Its −10 top margin collapses with the mouth's 30px bottom margin: 20px are left. The bar runs from y = 230.19 to 250.31.</p></div>
<div class="cap" data-t="30" data-step="Result" data-live="161 characters · 100% match"><h3>7. Result: 161 characters</h3><p>One gradient everywhere: it makes the disc on html, it is pushed off the canvas on body, and it darkens the four small boxes.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0703 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? '\u00a0:' : ':';
  const at = fr ? 'en' : 'at';
  const num = (v, d = 0) => { const s = Math.abs(v).toFixed(d); return (v < -0.005 ? '−' : '') + (fr ? s.replace('.', ',') : s); };
  // Boxes measured with getBoundingClientRect on the official code in local Chrome:
  // html 400 × 300 (disc r = 100 at (200, 150)); body (140, 100) 120 × 1199 (its disc at (200, 699.5));
  // img (160, 130) and (210.063, 130), 30.063 × 30.063; h6 (165, 190.063) 70 × 20.125; h6 + * (150, 230.188) 100 × 20.125.
  // Without the +* rule, the second h6 sits at (165, 240.188), 70 × 20.125.
  const FIN = 30;
  const lerp = (a, b, k) => a + (b - a) * k;
  const put = (e, x, y, w, h) => { e.style.left = `${x}px`; e.style.top = `${y}px`; e.style.width = `${w}px`; e.style.height = `${h}px`; };
  const disc = $('.t0703-disc'), body = $('.t0703-body'), bdisc = $('.t0703-bdisc');
  const i1 = $('.t0703-i1'), i2 = $('.t0703-i2'), h1 = $('.t0703-h1'), h2 = $('.t0703-h2');
  const L = (k) => $$(`.zlab[data-l="${k}"]`);
  const col = (teach, v, real) => (teach ? `var(--t0703-${v})` : `var(--t0703-${real})`);
  const IMG = 30.0625, H6 = 20.125;
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    // 1. html's disc: radius 1Q, then the 25vw hint pushes the light blue out to 100px
    const r = lerp(0.945, 100, pr(t, [1.5, 3.5]));
    // painted as a hard-stop radial gradient, like the official code, in a box 1px larger on each side
    put(disc, 199 - r, 149 - r, 2 * r + 2, 2 * r + 2);
    disc.style.opacity = pr(t, [0.2, 0.6]);
    disc.style.background = `radial-gradient(circle ${r}px, ${col(teach, 'c1', 'dk')} ${r}px, #0000 ${r}px)`;
    // 2. body's box grows down to 1199px
    const bh = lerp(0, 1199, pr(t, [6, 9]));
    body.style.height = `${bh}px`;
    body.style.opacity = t >= 5.5 ? 1 : 0;
    body.style.background = col(teach, 'c2', 'lb');
    // 3. body's own disc, centered on its box
    bdisc.style.opacity = pr(t, [11, 12.5]);
    bdisc.style.background = col(teach, 'c2d', 'dk');
    // 4. the two images grow with their padding; the second one follows the first
    const w = lerp(0, IMG, pr(t, [16, 18]));
    put(i1, 160, 130, w, w);
    put(i2, 180 + w, 130, w, w);
    [i1, i2].forEach((e) => { e.style.opacity = t >= 15.5 ? 1 : 0; e.style.background = col(teach, 'c3', 'dk'); });
    // 5. the mouth
    const mh = lerp(0, H6, pr(t, [21, 23]));
    put(h1, 165, 190.0625, 70, mh);
    h1.style.opacity = t >= 20.5 ? 1 : 0;
    h1.style.background = col(teach, 'c4', 'dk');
    // 6. the second h6: first with margin:30 25, then with margin:-10 10
    const kB = pr(t, [26.5, 28.5]);
    put(h2, lerp(165, 150, kB), lerp(240.1875, 230.1875, kB), lerp(70, 100, kB), H6);
    h2.style.opacity = pr(t, [25.3, 25.8]);
    h2.style.background = col(teach, 'c5', 'dk');
    [[0.3, 5], [5.3, 10], [10.3, 15], [15.3, 20], [20.3, 25], [25.3, 30]].forEach(([a, e], k) => L(k + 1).forEach((l) => (l.style.opacity = win(t, a, e))));
    let txt;
    if (step === 0) txt = `html · ${fr ? 'rayon' : 'radius'}${c} ${num(r, 2)}px`;
    else if (step === 1) txt = `body${c} 120 × ${num(bh)} ${at} (140, 100)`;
    else if (step === 2) txt = `${fr ? 'disque de body' : "body's disc"}${c} (200, ${num(699.5, 1)}) · y ${num(599.5, 1)} → ${num(799.5, 1)}`;
    else if (step === 3) txt = `img${c} ${num(w, 2)} × ${num(w, 2)} ${at} (160, 130) · (${num(180 + w, 2)}, 130)`;
    else if (step === 4) txt = `h6${c} 70 × ${num(mh, 2)} ${at} (165, ${num(190.0625, 2)})`;
    else if (step === 5) txt = `h6 + *${c} ${num(lerp(70, 100, kB))} × ${num(H6, 2)} ${at} (${num(lerp(165, 150, kB))}, ${num(lerp(240.1875, 230.1875, kB), 2)})`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
