<div class="cap" data-t="0" data-step="Éléments"><h3>1. html et body</h3><p><code>*</code> touche html, head, style et body ; head et style restent cachés. Tous reçoivent le même <code>background</code>. Celui de html couvre toute la page, avec son crème <code>#efeade</code>. Le <code>*{…}</code> imbriqué touche les enfants : body reçoit <code>margin:105 0</code>, en px (mode quirks). En mode quirks, body remplit la hauteur : 400 × 90 en y = 105.</p></div>
<div class="cap" data-t="4.5" data-step="Disque"><h3>2. Un disque plein</h3><p><code>radial-gradient(1lh,…)</code> : un cercle de rayon 1lh. <code>139%</code> entre les deux couleurs est un point de transition. Il tire le <code>#0000</code> jusqu'à 139 % : le violet reste plein jusque-là, puis s'arrête net. Sur html, 1lh vaut 18px : un disque de 1,39 × 18 = 25,02px de rayon.</p></div>
<div class="cap" data-t="9" data-step="Tuiles"><h3>3. Deux têtes en haut</h3><p>Première couche de html : <code>0-5em/50%</code>. html a une police de 16px : 5em = 80px. <code>50%</code> de 400 donne des tuiles de 200 × 300, qui se répètent. Leur centre est en (100, 70) et (300, 70) : deux têtes. Les copies en y = 370 tombent hors du canevas.</p></div>
<div class="cap" data-t="13.5" data-step="Tête du bas"><h3>4. La tête du bas</h3><p>Deuxième couche : <code>0 5em</code>, taille auto, donc une tuile de 400 × 300 décalée de +80px. Son disque est en (200, 230) : la troisième tête. Sa copie en (200, −70) est hors du canevas.</p></div>
<div class="cap" data-t="18" data-step="body"><h3>5. Le même fond sur body</h3><p>body peint aussi le fond, car html a déjà le sien. <code>font:3vh/4"</code> lui donne 9px et une hauteur de ligne de 4 × 9 = 36px. Alors 1lh = 36px : des disques de 50,04px. Et 5em = 45px : centres en (100, 105), (300, 105) et (200, 195).</p></div>
<div class="cap" data-t="22.5" data-step="Bande"><h3>6. Coupés par la bande</h3><p>Avec <code>fixed</code>, les dégradés de body sont placés dans le repère de la page, comme ceux de html. Mais body ne peint que dans sa boîte, de y = 105 à 195. Il ne reste que la moitié basse des deux disques du haut et la moitié haute du disque du bas : les épaules.</p></div>
<div class="cap" data-t="27" data-step="Résultat" data-live="134 caractères · 100 % identique"><h3>7. Résultat : 134 caractères</h3><p>Une seule liste de fonds sur html et sur body. 1lh et 5em changent d'un élément à l'autre : des têtes de 25px sur html, des épaules de 50px sur body.</p></div>
{%- else %}

<div class="cap" data-t="4.5" data-step="Disc"><h3>2. A solid disc</h3><p><code>radial-gradient(1lh,…)</code>: a circle of radius 1lh. <code>139%</code> between the two colors is a color hint. It pulls <code>#0000</code> out to 139%: the purple stays solid up to there, then stops at once. On html, 1lh is 18px: a disc of radius 1.39 × 18 = 25.02px.</p></div>
<div class="cap" data-t="9" data-step="Tiles"><h3>3. Two heads at the top</h3><p>html's first layer: <code>0-5em/50%</code>. html has a 16px font: 5em = 80px. 50% of 400 gives 200 × 300 tiles, which repeat. Their centers are at (100, 70) and (300, 70): two heads. The copies at y = 370 fall off the canvas.</p></div>

<div class="cap" data-t="18" data-step="body"><h3>5. The same background on body</h3><p>body paints the background too, because html already has its own. <code>font:3vh/4"</code> gives it 9px and a line height of 4 × 9 = 36px. So 1lh = 36px: 50.04px discs. And 5em = 45px: centers at (100, 105), (300, 105) and (200, 195).</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0613 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? '\u00a0:' : ':';
  const n = (v) => (fr ? String(v).replace('.', ',') : String(v));
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  // Measured on the official code in local Chrome (400 × 300 iframe, quirks mode, getComputedStyle, getBoundingClientRect):
  // html: 400 × 300, font 16px, the gradient computes to radial-gradient(18px, …): 1lh = 18px, 5em = 80px.
  // body: 400 × 90 at y = 105, font 9px / 36px: 1lh = 36px, 5em = 45px.
  // The hint at 139% pulls #0000 to 139%: solid disc of radius 1.39 × 1lh (render: same picture as "#594f7c 139%,#0000 0").
  // html layer 1: tiles 200 × 300 from (0, −80): discs at (100, 70), (300, 70), copies at y = 370. Layer 2: tile 400 × 300 from (0, 80): (200, 230), copy (200, −70).
  // body (fixed): discs of radius 50.04 at (100, 105), (300, 105), (200, 195), painted only inside 0..400 × 105..195.
  // Render of the official code: heads span 45..94 and 205..254, shoulders 105..154 and 145..194.
  const FIN = 27, L1 = 18, L2 = 36;
  const hd = $$('.t0613-hdisc'), gh = $$('.t0613-ghost'), bd = $$('.t0613-bdisc');
  const tiles = $$('.t0613-tile'), bbox = $('.t0613-bbox'), lh = $('.t0613-lh'), band = $('.t0613-band');
  const labs = $$('.zlab');
  // Each disc is a 120 × 120 box at whole pixels, painted with the official gradient (radius 1.39 × lh): same edges as the official render.
  const place = (e, lh, dx, dy) => {
    e.style.left = `${+e.dataset.x - dx - 60}px`;
    e.style.top = `${+e.dataset.y - dy - 60}px`;
    e.style.setProperty('--t0613-lh', `${lh}px`);
  };
  const ivs = [[0.3, 4.5], [4.8, 9], [9.3, 13.5], [13.8, 18], [18.3, 22.5], [22.8, FIN]];
  const grow = { 2: [5.6, 7.4], 3: [9.9, 11.4], 4: [14.4, 15.9] };
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const tw = teach ? 1 - pr(t, [FIN, FIN + 0.8]) : 0;
    const out = 1 - pr(t, [FIN, FIN + 0.6]);
    // html's discs: one in step 2, the rest of layer 1 in step 3, layer 2 in step 4
    hd.forEach((e) => {
      const k = pr(t, grow[e.dataset.a]);
      place(e, Math.max(L1 * k, 0.01), 0, 0);
      e.style.opacity = k > 0 ? 1 : 0;
      e.style.setProperty('--t0613-col', mix(tw, 'var(--t0613-hd)', '#594f7c'));
    });
    // 1lh ring on html during step 2
    lh.style.opacity = win(t, 4.9, 9);
    // tiles: layer 1 in step 3, layer 2 in step 4
    tiles.forEach((e) => {
      e.style.opacity = e.dataset.a === '3' ? win(t, 9.4, 13.5) : win(t, 13.9, 18);
    });
    // body's box: dashed in step 1 and in steps 5 and 6; tinted in teaching colors until the result
    bbox.style.opacity = Math.max(win(t, 0.6, 4.5), win(t, 18.4, FIN));
    band.style.background = mix(tw * pr(t, [0.6, 1.4]), 'rgb(219 39 119 / .12)', 'transparent');
    // body's discs: they grow in step 5, the parts outside the band fade out in step 6
    const kb = pr(t, [18.8, 20.6]);
    const lb = Math.max(L2 * kb, 0.01);
    bd.forEach((e) => {
      place(e, lb, 0, 105);
      e.style.opacity = kb > 0 ? 1 : 0;
      e.style.setProperty('--t0613-col', mix(tw, 'var(--t0613-bd)', '#594f7c'));
    });
    gh.forEach((e) => {
      place(e, lb, 0, 0);
      e.style.opacity = kb > 0 ? 0.45 * (1 - pr(t, [23.2, 24.8])) : 0;
      e.style.setProperty('--t0613-col', mix(tw, 'var(--t0613-bd)', '#594f7c'));
    });
    labs.forEach((l) => {
      const k = +l.dataset.l, second = l.classList.contains('t0613-l2');
      // top left of the canvas, above the heads (y = 45)
      l.style.left = 'calc(4px * var(--k, 1))';
      l.style.top = `calc(${second ? 19 : 3}px * var(--k, 1))`;
      l.style.opacity = win(t, ...ivs[k - 1]);
    });
    let txt;
    if (step === 0) txt = `html${c} 400 × 300 · body${c} 400 × 90 ${fr ? 'en' : 'at'} y = 105`;
    else if (step === 1) txt = `html${c} 1lh = 18px · ${fr ? 'rayon' : 'radius'} ${n('25.02')}`;
    else if (step === 2) txt = `${fr ? 'têtes en' : 'heads at'} (100, 70) ${fr ? 'et' : 'and'} (300, 70)`;
    else if (step === 3) txt = `${fr ? 'tête en' : 'head at'} (200, 230)`;
    else if (step === 4) txt = `body${c} 1lh = 36px · ${fr ? 'rayon' : 'radius'} ${n('50.04')} · 5em = 45px`;
    else if (step === 5) txt = `body${c} y = 105 → 195 · ${fr ? 'trois demi-disques' : 'three half discs'}`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
