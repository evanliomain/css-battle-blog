<div class="cap" data-t="0" data-step="html : 150 × 492"><h3>1. html : 150 × 492</h3><p><code>&amp;</code>, seul au premier niveau, vise la racine : html. Pas de doctype : la page est en mode quirks, et <code>80 125</code> se lit en px. html fait 400 − 2 × 125 = 150 de large, en (125 ; 80). Chrome lui donne 492px de haut : la marge haute de body, 352, plus les 300 − 2 × 80 = 140px du mode quirks. Il descend jusqu'à y = 572, sous le canevas.</p></div>
<div class="cap" data-t="4.5" data-step="Haut arrondi"><h3>2. Un haut en demi-cercle</h3><p><code>9in</code>, c'est 864px, bien plus que la moitié des 150px de large. Chrome réduit donc les rayons à 75px. Le haut de html devient un demi-cercle de rayon 75 centré en (200 ; 155). En dessous, les côtés sont droits jusqu'à y = 497.</p></div>
<div class="cap" data-t="8.5" data-step="Ombres de html"><h3>3. L'arche et le fond orange</h3><p><code>*</code> donne à tous les éléments les six mêmes ombres. Sans couleur, une ombre prend <code>color</code> : <code>696049</code>, un brun gris. La première, <code>0 0 0 5vw</code>, étale html de 20px : l'arche. La deuxième, orange, l'étale de 192px : elle couvre tout le canevas. Une ombre ne se peint jamais sous la boîte, donc l'intérieur de html reste blanc. Les quatre autres ombres de html passent sous son ombre orange.</p></div>
<div class="cap" data-t="13.5" data-step="body"><h3>4. body : 20 × 454, sous le canevas</h3><p>body reçoit <code>margin:352 65-666</code>. Il part du haut de html : la marge haute de 352 le pose en y = 432, sous le canevas. Les marges de côté de 65 lui laissent 150 − 130 = 20 de large, en x = 190. En mode quirks, body prend les 140px de haut de la page entre les marges de html, moins ses propres marges : 140 − 352 + 666 = 454. Son anneau de 20px reste sous le canevas.</p></div>
<div class="cap" data-t="18" data-step="Ombre orange"><h3>5. Une ombre orange qui coupe</h3><p>La deuxième ombre de body, orange, l'étale aussi de 192px : elle commence en y = 432 − 192 = 240 et couvre toute la largeur. body est peint après html, donc cette ombre cache le bas de l'arche. Ici, elle est dessinée en transparence, pour voir ce qu'elle cache.</p></div>
<div class="cap" data-t="22.5" data-step="Barre et pattes"><h3>6. La barre et les pattes</h3><p>Trois ombres sont des copies de body, 20 × 454, décalées. <code>0-78vw</code> la monte de 312px : la barre, à partir de y = 120. <code>-50vh -64mm</code> et <code>50vh -64mm 0</code> la décalent de 150px à gauche et à droite, et de 241,89px vers le haut : les pattes, à partir de y = 190,11. Elles sont après l'ombre orange dans la liste, donc peintes dessous : elles s'arrêtent en y = 240.</p></div>
<div class="cap" data-t="27.5" data-step="Base"><h3>7. La base</h3><p>La dernière ombre, <code>0-86q 0 138q</code>, monte body de 81,26px et l'étale de 130,39px. Elle va de x = 59,61 à 340,39, et commence en y = 432 − 81,26 − 130,39 = 220,35. Elle rejoint les deux pattes, et l'ombre orange la coupe aussi en y = 240.</p></div>
<div class="cap" data-t="32" data-step="Résultat" data-live="156 caractères · 100 % identique"><h3>8. Résultat : 156 caractères</h3><p>Une seule liste d'ombres sert aux deux éléments. Sur html, elle dessine l'arche et le fond. Sur body, elle coupe tout en y = 240 et dessine la barre, les pattes et la base.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html: 150 × 492"><h3>1. html: 150 × 492</h3><p><code>&amp;</code>, alone at the top level, targets the root: html. There is no doctype: the page is in quirks mode, and <code>80 125</code> is read as px. html is 400 − 2 × 125 = 150 wide, at (125, 80). Chrome makes it 492px tall: body's top margin, 352, plus the 300 − 2 × 80 = 140px of quirks mode. It reaches y = 572, below the canvas.</p></div>
<div class="cap" data-t="4.5" data-step="Rounded top"><h3>2. A half-circle top</h3><p><code>9in</code> is 864px, far more than half of the 150px width. So Chrome scales the radii down to 75px. The top of html becomes a half circle of radius 75, centered at (200, 155). Below it, the sides are straight down to y = 497.</p></div>
<div class="cap" data-t="8.5" data-step="html's shadows"><h3>3. The arch and the orange background</h3><p><code>*</code> gives every element the same six shadows. With no color, a shadow takes <code>color</code>: <code>696049</code>, a gray brown. The first one, <code>0 0 0 5vw</code>, spreads html by 20px: the arch. The second one, orange, spreads it by 192px: it covers the whole canvas. A shadow is never painted under its box, so html's inside stays white. html's four other shadows go under its orange one.</p></div>
<div class="cap" data-t="13.5" data-step="body"><h3>4. body: 20 × 454, below the canvas</h3><p>body gets <code>margin:352 65-666</code>. It starts at the top of html: the top margin of 352 puts it at y = 432, below the canvas. The side margins of 65 leave it 150 − 130 = 20 wide, at x = 190. In quirks mode, body takes the page's 140px of height between html's margins, minus its own margins: 140 − 352 + 666 = 454. Its 20px ring stays below the canvas.</p></div>
<div class="cap" data-t="18" data-step="Orange shadow"><h3>5. An orange shadow that cuts</h3><p>body's second shadow, the orange one, also spreads it by 192px: it starts at y = 432 − 192 = 240 and covers the whole width. body is painted after html, so this shadow hides the bottom of the arch. Here it is drawn see-through, to show what it hides.</p></div>
<div class="cap" data-t="22.5" data-step="Bar and legs"><h3>6. The bar and the legs</h3><p>Three shadows are shifted copies of body, 20 × 454. <code>0-78vw</code> moves it 312px up: the bar, from y = 120. <code>-50vh -64mm</code> and <code>50vh -64mm 0</code> move it 150px left and right, and 241.89px up: the legs, from y = 190.11. They come after the orange shadow in the list, so they are painted under it: they stop at y = 240.</p></div>
<div class="cap" data-t="27.5" data-step="Base"><h3>7. The base</h3><p>The last shadow, <code>0-86q 0 138q</code>, moves body 81.26px up and spreads it by 130.39px. It spans x = 59.61 to 340.39, and starts at y = 432 − 81.26 − 130.39 = 220.35. It joins the two legs, and the orange shadow cuts it at y = 240 too.</p></div>
<div class="cap" data-t="32" data-step="Result" data-live="156 characters · 100% match"><h3>8. Result: 156 characters</h3><p>One shadow list serves both elements. On html, it draws the arch and the background. On body, it cuts everything at y = 240 and draws the bar, the legs and the base.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0730 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const n2 = (v) => (fr ? v.toFixed(2).replace('.', ',') : v.toFixed(2));
  const c = fr ? ' :' : ':';
  const sc = fr ? ' ;' : ',';
  // Measured on the official code in local Chrome (quirks mode, 400 × 300):
  // html (125, 80) 150 × 492, border-radius 864px → 75px. body (190, 432) 20 × 454.
  // Shadows (computed): 0 0 0 20px, 0 0 0 192px #F8B140, 0 -312px, -150px -241.89px, 150px -241.89px 0, 0 -81.26px 0 130.39px.
  const FIN = 32;
  const MM = 241.88976, Q86 = 81.25984, Q138 = 130.3937;
  const html = $('.t0730-html'), body = $('.t0730-body'), hb = $('.t0730-hb'), bb = $('.t0730-bb'), cut = $('.t0730-cut');
  const L = (k) => $$(`.t0730-l[data-l="${k}"]`);
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    const ann = 1 - pr(t, [FIN, FIN + 0.6]);
    const v = (k) => `var(--t0730-${teach ? k : 'dk'})`;
    const OR = 'var(--t0730-or)';
    // html: its box, the rounded top, then its ring and its orange shadow (its four other shadows go under the orange one)
    const r = 75 * pr(t, [5, 7.5]);
    html.style.borderRadius = hb.style.borderRadius = `${r}px`;
    hb.style.opacity = 0.9 * win(t, 0.2, 13.2);
    const hr = 20 * pr(t, [9, 10.4]), ho = 192 * pr(t, [10.8, 12.8]);
    const hs = [];
    if (hr > 0) hs.push(`0 0 0 ${hr}px ${v('rc')}`);
    if (ho > 0) hs.push(`0 0 0 ${ho}px ${OR}`);
    if (ho === 192) hs.push(`0 -312px ${v('dk')}`, `-150px -${MM}px ${v('dk')}`, `150px -${MM}px 0 ${v('dk')}`, `0 -${Q86}px 0 ${Q138}px ${v('dk')}`);
    html.style.boxShadow = hs.length ? hs.join(',') : 'none';
    // body: its box and ring, the orange shadow, then the shifted copies
    bb.style.opacity = 0.9 * win(t, 13.7, 31.6);
    const br = 20 * pr(t, [14.6, 16]), bo = 192 * pr(t, [18.4, 20.6]);
    const a = pr(t, [23, 26]), b = pr(t, [28, 30.6]);
    const bs = [];
    if (br > 0) bs.push(`0 0 0 ${br}px ${v('rc')}`);
    if (bo > 0) bs.push(`0 0 0 ${bo}px ${teach ? 'var(--t0730-cc)' : OR}`);
    if (a > 0) bs.push(`0 ${-312 * a}px ${v('vc')}`, `${-150 * a}px ${-MM * a}px ${v('gc')}`, `${150 * a}px ${-MM * a}px 0 ${v('gc')}`);
    if (b > 0) bs.push(`0 ${-Q86 * b}px 0 ${Q138 * b}px ${v('bc')}`);
    body.style.boxShadow = bs.length ? bs.join(',') : 'none';
    cut.style.opacity = 0.9 * win(t, 20.4, 31.6) * (teach ? 1 : 0);
    [[0.3, 4.2], [4.8, 8.2], [8.8, 13.2], [13.8, 17.7], [18.3, 22.2], [22.8, 27.2], [27.8, 31.6]].forEach(([p, z], k) => L(k + 1).forEach((e) => (e.style.opacity = win(t, p, z) * ann)));
    let txt;
    if (step === 0) txt = `html${c} 150 × 492 · (125${sc} 80)`;
    else if (step === 1) txt = `border-radius${c} ${Math.round(r)}px`;
    else if (step === 2) txt = `${fr ? 'anneau' : 'ring'} ${Math.round(hr)}px · orange ${Math.round(ho)}px`;
    else if (step === 3) txt = `body${c} 20 × 454 · (190${sc} 432)`;
    else if (step === 4) txt = `orange${c} ${Math.round(bo)}px · y = ${Math.round(432 - bo)}`;
    else if (step === 5) txt = `${fr ? 'barre' : 'bar'} y = ${Math.round(432 - 312 * a)} · ${fr ? 'pattes' : 'legs'} y = ${n2(432 - MM * a)}`;
    else if (step === 6) txt = `base${c} y = ${n2(432 - (Q86 + Q138) * b)}`;
    else txt = $$('.caps .cap')[7].dataset.live || '';
    live.textContent = txt;
  };
};
