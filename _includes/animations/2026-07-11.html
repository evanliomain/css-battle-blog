(window.AnimScenes = window.AnimScenes || {}).t0711 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);

  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

  // html: margin 90px 160px 50px, border box (160, 90) 80 × 160, background propagated to the canvas.
  // body: margin 0 130px 0 -130px, border box (30, 90) 80 × 160. color rgb(132, 190, 141). 1ch = 8px, 1Q = 0.94488px.
  // box-shadow (both): #3157b4 130.394px 0; 50.0787px -40px; 65.1969px 25.5118px 0 4.72441px.
  const H = [160, 90, 80, 160], B = [30, 90, 80, 160];
  const off = (b, dx) => [b[0] + dx, b[1], b[2], b[3]];
  const S1 = [290.394, 90, 80, 160], S2 = [210.0787, 50, 80, 160], S3 = [220.4725, 110.7874, 89.4488, 169.4488];
  const FIN = 27.5;
  const hs1 = $('.t0711-hs1'), hs2 = $('.t0711-hs2'), hs3 = $('.t0711-hs3');
  const bs1 = $('.t0711-bs1'), bs2 = $('.t0711-bs2'), bs3 = $('.t0711-bs3');
  const hb = $('.t0711-hb'), bb = $('.t0711-bb');
  const L = (k) => $$(`.t0711-l[data-l="${k}"]`);
  const lerp = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
  // Clip a shape [x, y, w, h] (canvas px) to what is left once the rectangles [x1, y1, x2, y2] are removed: one path
  // of grid cells, so the pieces join with no seam.
  const clip = (e, [x, y, w, h], holes) => {
    const x2 = x + w, y2 = y + h;
    const hs = holes.map(([a, b, c, d]) => [Math.max(a, x), Math.max(b, y), Math.min(c, x2), Math.min(d, y2)]).filter(([a, b, c, d]) => c > a && d > b);
    if (!hs.length) { e.style.clipPath = 'none'; return; }
    const u = (v) => [...new Set(v)].sort((p, q) => p - q);
    const xs = u([x, x2, ...hs.flatMap((r) => [r[0], r[2]])]), ys = u([y, y2, ...hs.flatMap((r) => [r[1], r[3]])]);
    const f = (v) => +v.toFixed(3);
    let d = '';
    for (let j = 0; j < ys.length - 1; j++) {
      const my = (ys[j] + ys[j + 1]) / 2;
      let run = null;
      for (let i = 0; i <= xs.length - 1; i++) {
        const mx = i < xs.length - 1 ? (xs[i] + xs[i + 1]) / 2 : null;
        const vis = mx !== null && !hs.some(([a, b, c, dd]) => mx > a && mx < c && my > b && my < dd);
        if (vis && run === null) run = xs[i];
        if (!vis && run !== null) { d += `M${f(run - x)} ${f(ys[j] - y)}H${f(xs[i] - x)}V${f(ys[j + 1] - y)}H${f(run - x)}Z`; run = null; }

  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    const col = [teach ? 'var(--t0711-c3)' : 'var(--t0711-b)', teach ? 'var(--t0711-c1)' : 'var(--t0711-g)', teach ? 'var(--t0711-c2)' : 'var(--t0711-g)'];

    hs3.style.opacity = pr(t, [9.1, 9.3]);
    hs1.style.opacity = pr(t, [13.6, 13.8]);
    put(hs2, lerp(H, S2, k2));
    put(hs3, lerp(H, S3, k3));
    put(hs1, lerp(H, S1, k1));

    bb.style.opacity = 0.9 * pr(t, [18.1, 18.6]) * (1 - pr(t, [FIN - 0.5, FIN]));
    // 6. body's three shadows, 130px further left
    const j2 = pr(t, [23, 24.8]), j3 = pr(t, [23.6, 25.4]), j1 = pr(t, [24.2, 26]);
    bs2.style.opacity = pr(t, [22.7, 22.9]);
    bs3.style.opacity = pr(t, [23.3, 23.5]);
    bs1.style.opacity = pr(t, [23.9, 24.1]);
    put(bs2, lerp(B, off(S2, -130), j2));
    put(bs3, lerp(B, off(S3, -130), j3));
    put(bs1, lerp(B, off(S1, -130), j1));

    const hHide = [hBox], bHide = [bBox];

    if (bOn) { hHide.push(bE); bHide.push(bE); }

    // anti-aliased edges do not add up.

    clip(hs2, lerp(H, S2, k2), hHide);
    clip(hs3, lerp(H, S3, k3), k2 === 1 ? [...hHide, [160, 90, edge + 0.6, 209.4]] : hHide);
    clip(hs1, lerp(H, S1, k1), [hBox]);
    clip(bs2, lerp(B, off(S2, -130), j2), bHide);
    clip(bs3, lerp(B, off(S3, -130), j3), j2 === 1 ? [...bHide, [30, 90, 110.6, 209.4]] : bHide);
    clip(bs1, lerp(B, off(S1, -130), j1), [bBox]);
    if (!teach) { hs1.style.opacity = 0; bs1.style.opacity = 0; }
    [[0.3, 4.5], [4.8, 9], [9.3, 13.5], [13.8, 18], [18.3, 22.5], [22.8, 27.5]].forEach(([a, z], k) => L(k + 1).forEach((e) => (e.style.opacity = win(t, a, z))));
    let txt;
    if (step === 0) txt = fr ? `html${c} 80 × 160 en (160, 90)` : `html${c} 80 × 160 at (160, 90)`;
    else if (step === 1) txt = fr ? `ombre${c} décalage ${num(50.08 * k2, 2)} ${num(-40 * k2, 1)}` : `shadow${c} offset ${num(50.08 * k2, 2)} ${num(-40 * k2, 1)}`;
    else if (step === 2) txt = fr ? `ombre${c} décalage ${num(65.2 * k3, 2)} ${num(25.51 * k3, 2)} · étalement ${num(4.72 * k3, 2)}` : `shadow${c} offset ${num(65.2 * k3, 2)} ${num(25.51 * k3, 2)} · spread ${num(4.72 * k3, 2)}`;
    else if (step === 3) txt = fr ? `ombre bleue${c} décalage ${num(130.39 * k1, 2)} 0` : `blue shadow${c} offset ${num(130.39 * k1, 2)} 0`;
    else if (step === 4) txt = fr ? `body${c} x = ${num(160 - 130 * kb, 0)}` : `body${c} x = ${num(160 - 130 * kb, 0)}`;
    else if (step === 5) txt = fr ? `body${c} trois ombres, 130px plus à gauche` : `body${c} three shadows, 130px further left`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
