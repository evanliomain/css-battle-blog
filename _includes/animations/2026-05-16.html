<div class="cap" data-t="0" data-step="Éléments"><h3>1. body, p, hr, p</h3><p>Le premier <code>&lt;p></code> ouvre body. Un p ne peut pas contenir de hr : <code>&lt;hr></code> ferme le p, qui reste vide. Le second <code>&lt;p></code> reçoit le style. Le <code>*</code> extérieur n'a pas de déclaration à lui. Le <code>*</code> intérieur, <code>* *</code>, vise tout ce qui est sous html : head, body, p, hr, p et style.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0516 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);

  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.5), 1 - pr(t, b - 0.3, b));

  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  // Measured on the official code in local Chrome 157 (400 × 300 iframe, quirks mode, getBoundingClientRect, variant renders).
  // body 74, 66, 252 × 168, border 24px (6vw), content 98, 90, 204 × 120; its background goes to the canvas.
  // p, hr, p: margin 72 66 -180, so 72 wide at x = 164. First p 164, 162, 72 × 72 (border-inline 24, content 24 × 72).
  // Collapsed margins 72 - 180 = -108: hr layout box 164, 126, 72 × 48 (border 24, content 24 × 0), second p 164, 66, 72 × 72.
  // hr scale .33 .5 around (200, 150): 188.12, 138, 23.76 × 24.
  const bg = $('.t0516-bg'), body = $('.t0516-body'), p1 = $('.t0516-p1'), hr = $('.t0516-hr'), p2 = $('.t0516-p2'), c1 = $('.t0516-c1'), c2 = $('.t0516-c2');
  const mt = $('.t0516-mt'), v1 = $('.t0516-v1'), v2 = $('.t0516-v2');
  const xbody = $('.t0516-xbody'), xp1 = $('.t0516-xp1'), xhr = $('.t0516-xhr'), xp2 = $('.t0516-xp2');
  const labs = $$('.zlab[data-l]'), mlabs = $$('.zlab[data-m]');
  const ivs = [[0.3, 4.3], [4.8, 8.8], [9.3, 13.3], [13.8, 17.8], [18.3, 22.3], [22.8, 26.8]];
  const mivs = [[10.2, 13.3], [14.6, 17.8], [19.1, 22.3]];
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const wide = fig.dataset.view !== 'canvas';
    const tw = teach ? 1 - pr(t, 27.2, 28.2) : 0;
    const P = 'var(--t0516-pink)', C = 'var(--t0516-cream)';
    // step 2: body's background fills the canvas, then its border appears
    bg.style.opacity = pr(t, 5, 6.2);
    body.style.opacity = pr(t, 6.4, 7.4);
    body.style.borderColor = mix(tw, 'var(--t0516-bd)', C);
    xbody.style.opacity = win(t, 0.3, 8.8);
    // step 3: the first p, 72 below body's content top
    mt.style.opacity = 0.9 * win(t, 9.6, 13.3);
    p1.style.opacity = pr(t, 10.6, 11.6);
    p1.style.borderColor = mix(tw, 'var(--t0516-p1)', C);
    c1.style.opacity = p1.style.opacity;
    c1.style.background = mix(tw, 'var(--t0516-p1c)', P);
    c1.style.height = tw > 0 ? '72px' : '74px'; // real colors: 2px of pink past the bottom, so no cream seam on body's border
    xp1.style.opacity = win(t, 9.3, 13.3);
    // step 4: -108 from the p's bottom (234) up to 126, then the hr
    const g1 = pr(t, 14.3, 15.5);
    v1.style.opacity = win(t, 14.2, 17.8);
    v1.style.top = `${234 - 108 * g1}px`;
    v1.style.height = `${108 * g1}px`;
    hr.style.opacity = pr(t, 15.6, 16.6);
    xhr.style.opacity = win(t, 13.8, 26.8);
    // step 5: -108 from the hr's bottom (174) up to 66, then the second p
    const g2 = pr(t, 18.8, 20);
    v2.style.opacity = win(t, 18.7, 22.3);
    v2.style.top = `${174 - 108 * g2}px`;
    v2.style.height = `${108 * g2}px`;
    p2.style.opacity = pr(t, 20.1, 21.1);
    p2.style.borderColor = mix(tw, 'var(--t0516-p2)', C);
    c2.style.opacity = p2.style.opacity;
    c2.style.background = mix(tw, 'var(--t0516-p2c)', P);
    c2.style.top = tw > 0 ? '66px' : '64px'; // real colors: 2px of pink past the top
    c2.style.height = tw > 0 ? '72px' : '74px';
    xp2.style.opacity = win(t, 18.3, 22.3);
    // step 6: scale .33 .5 around the hr's center
    const k = pr(t, 23.6, 25.4);
    hr.style.transform = `scale(${1 - 0.67 * k}, ${1 - 0.5 * k})`;
    hr.style.background = mix(tw, 'var(--t0516-hr)', C);
    labs.forEach((l) => {
      l.style.opacity = win(t, ...ivs[+l.dataset.l - 1]);
      l.style.left = wide ? '-46px' : '4px';
      l.style.top = wide ? '-36px' : '3px';
    });
    mlabs.forEach((l) => { l.style.opacity = win(t, ...mivs[+l.dataset.m - 1]); });
    let txt;
    if (step === 0) txt = '* * → head, body, p, hr, p, style · * * * → p, hr, p, style';
    else if (step === 1) txt = `body${c} 400 − 2 × 74 = 252 · 300 − 2 × 66 = 168 · 6vw = 24px`;
    else if (step === 2) txt = `p${c} 204 − 2 × 66 = 72 · 90 + 72 = 162`;
    else if (step === 3) txt = `hr${c} 234 + 72 − 180 = 126 · 72 × 48`;
    else if (step === 4) txt = `p${c} 174 + 72 − 180 = 66`;
    else if (step === 5) txt = `72 × ${n(0.33)} = ${n(23.76)} · 48 × ${n(0.5)} = 24`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
