<div class="cap" data-t="0" data-step="Deux boîtes"><h3>1. Deux boîtes, une règle</h3><p><code>*</code> vise html, head, style et body : tous reçoivent le même <code>background</code>. head et style ne s'affichent pas. Le <code>*{</code> imbriqué vise ce qui est dans html : body (et head, style). Pas de doctype : en mode quirks, <code>130 50</code> sans unité est en px, et body remplit la hauteur de html moins ses marges : 300 − 260 = 40px. body fait 300 × 40, en (50 ; 130). Pour l'instant, je laisse les fonds de côté : le canevas est blanc.</p></div>
<div class="cap" data-t="5" data-step="Un disque net"><h3>2. Un disque net</h3><p>Je commence par html. <code>1q</code> seul est la taille : un cercle de rayon 1q = 0,945px. <code>#144650</code> est à 0. <code>37q</code>, entre deux couleurs, est un repère de transition. <code>#F3AC3C</code>, sans position, est à 100 % du rayon : 0,945px, avant le repère. Le navigateur le repousse à 37q = 34,96px, et la couleur saute là : bleu jusqu'à 34,96px, orange après. Sans taille, la tuile est la boîte de html : le disque est en (200 ; 150).</p></div>
<div class="cap" data-t="10" data-step="38.8ch sur html"><h3>3. <code>38.8ch</code> : des tuiles de 310,4 × 300</h3><p>html garde la police par défaut, 16px en Times dans mon Chrome : 1ch = 8px, et 38,8ch = 310,4px. La hauteur est <code>auto</code> : un dégradé n'a pas de taille propre, donc auto vaut 100 % de la boîte, 300px. Les tuiles se répètent depuis (0 ; 0) : un disque en x = 155,2, le suivant en 465,6, hors du canevas.</p></div>
<div class="cap" data-t="15" data-step="223% 25lh sur html"><h3>4. <code>223%25lh</code> : quatre demi-disques</h3><p>Une position en % se calcule sur la place qui reste : 2,23 × (400 − 310,4) = 199,81px. <code>lh</code> est la hauteur de ligne de html : 18px dans mon Chrome, donc 25lh = 450px. Les tuiles commencent en x = −110,59 et 199,81, et en y = −150, 150 et 450. Les disques tombent en x = 44,61 et 355,01, centrés en y = 0 et 300 : sur les bords du canevas, on n'en voit que la moitié. Le canevas prend le fond de html.</p></div>
<div class="cap" data-t="20" data-step="body : ses unités"><h3>5. body : les mêmes valeurs, d'autres unités</h3><p>body a son propre fond, peint seulement dans sa boîte. <code>font:6q/0'</code> lui donne 6q = 5,67px, une hauteur de ligne de 0 et la famille <code>''</code> (la chaîne est fermée par la fin du fichier). Dans mon Chrome, 1ch y vaut 2,83px : 38,8ch = 109,80px. 25lh = 25 × 0 = 0. La hauteur auto vaut 40px. Chaque disque de 34,96px de rayon dépasse les 40px de body : body le coupe en haut et en bas.</p></div>
<div class="cap" data-t="25" data-step="223% sur body"><h3>6. <code>223%</code> : trois pastilles</h3><p>Sur body, il reste 300 − 109,80 = 190,20px : 2,23 × 190,20 = 424,14px. Les tuiles glissent de presque quatre largeurs. Dans body, elles commencent en x = −15,08, 94,73 et 204,53 : les disques sont centrés en x = 89,82, 199,63 et 309,43 sur le canevas, en y = 150. Les disques voisins tombent hors de body.</p></div>
<div class="cap" data-t="30" data-step="Résultat" data-live="101 caractères · 100 % identique"><h3>7. Résultat : 101 caractères</h3><p>Un seul fond, écrit une fois. Sur html, il donne les quatre demi-disques des bords. Sur body, avec une autre police, les mêmes <code>223%</code>, <code>25lh</code> et <code>38.8ch</code> donnent les trois pastilles.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="Two boxes"><h3>1. Two boxes, one rule</h3><p><code>*</code> matches html, head, style and body: all of them get the same <code>background</code>. head and style are not displayed. The nested <code>*{</code> matches what is inside html: body (and head, style). There is no doctype: in quirks mode, <code>130 50</code> with no unit is in px, and body fills the height of html minus its margins: 300 − 260 = 40px. body is 300 × 40, at (50, 130). For now, I leave the backgrounds out: the canvas is white.</p></div>
<div class="cap" data-t="5" data-step="A sharp disc"><h3>2. A sharp disc</h3><p>I start with html. <code>1q</code> alone is the size: a circle with a ray of 1q = 0.945px. <code>#144650</code> is at 0. <code>37q</code>, between two colors, is a transition hint. <code>#F3AC3C</code> has no position, so it is at 100% of the ray: 0.945px, before the hint. The browser pushes it to 37q = 34.96px, and the color jumps there: blue up to 34.96px, orange after. With no size, the tile is html's box: the disc is at (200, 150).</p></div>
<div class="cap" data-t="10" data-step="38.8ch on html"><h3>3. <code>38.8ch</code>: tiles of 310.4 × 300</h3><p>html keeps the default font, 16px Times in my Chrome: 1ch = 8px, and 38.8ch = 310.4px. The height is <code>auto</code>: a gradient has no size of its own, so auto is 100% of the box, 300px. The tiles repeat from (0, 0): one disc at x = 155.2, the next at 465.6, off the canvas.</p></div>
<div class="cap" data-t="15" data-step="223% 25lh on html"><h3>4. <code>223%25lh</code>: four half discs</h3><p>A % position is a share of the room left: 2.23 × (400 − 310.4) = 199.81px. <code>lh</code> is html's line height: 18px in my Chrome, so 25lh = 450px. The tiles start at x = −110.59 and 199.81, and at y = −150, 150 and 450. The discs land at x = 44.61 and 355.01, centered at y = 0 and 300: on the edges of the canvas, so only half of each shows. The canvas takes html's background.</p></div>
<div class="cap" data-t="20" data-step="body: its own units"><h3>5. body: same values, other units</h3><p>body has its own background, painted only inside its box. <code>font:6q/0'</code> gives it 6q = 5.67px, a line height of 0 and the family <code>''</code> (the string is closed by the end of the file). In my Chrome, 1ch is then 2.83px: 38.8ch = 109.80px. 25lh = 25 × 0 = 0. The auto height is 40px. Each disc, with its 34.96px ray, is taller than body's 40px: body cuts it at the top and bottom.</p></div>
<div class="cap" data-t="25" data-step="223% on body"><h3>6. <code>223%</code>: three pills</h3><p>On body, the room left is 300 − 109.80 = 190.20px: 2.23 × 190.20 = 424.14px. The tiles slide almost four widths. Inside body, they start at x = −15.08, 94.73 and 204.53: the discs are centered at x = 89.82, 199.63 and 309.43 on the canvas, at y = 150. The discs next to them fall outside body.</p></div>
<div class="cap" data-t="30" data-step="Result" data-live="101 characters · 100% match"><h3>7. Result: 101 characters</h3><p>One background, written once. On html, it gives the four half discs on the edges. On body, with another font, the same <code>223%</code>, <code>25lh</code> and <code>38.8ch</code> give the three pills.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0810 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const lerp = (a, b, k) => a + (b - a) * k;
  const n2 = (v) => (fr ? v.toFixed(2).replace('.', ',') : v.toFixed(2));
  const c = fr ? ' :' : ':';
  const sep = fr ? ' ;' : ',';
  // Measured on the official code in local Chrome (quirks mode, 400 × 300), getBoundingClientRect and computed styles:
  // html (0, 0) 400 × 300, font 16px Times, background-position 223% 450px, background-size 310.4px auto;
  // body (50, 130) 300 × 40, font 5.66929px "", line-height 0, background-position 223% 0px, background-size 109.804px auto.
  // 223% of (400 - 310.4) = 199.808; 223% of (300 - 109.804) = 424.137. 37q = 34.9606px.
  // A render with these px values (html 199.808px 450px/310.4px 300px, body 424.137px 0/109.804px 40px) matches the
  // official render within 7 levels.
  const LX = -130, LY = -80; // origin of the html layers
  const R = 34.9606, Q = 0.9449;
  const HW = 310.4, HX = 199.808, HY = 450, BW = 109.804, BX = 424.137;
  const FIN = 30;
  const H = $('.t0810-h'), HG = $('.t0810-hg'), BL = $('.t0810-blank');
  const B = $('.t0810-b'), BG = $('.t0810-bg'), RG = $('.t0810-ring');
  const BH = $('.t0810-box[data-x="h"]'), BB = $('.t0810-box[data-x="b"]');
  const L = (k) => $(`.t0810-l[data-l="${k}"]`);
  const line = 'rgb(20 20 42 / .8)';
  const lw = 'calc(1.5px * var(--k, 1))';
  const grid = (x, y, w, h) => `linear-gradient(90deg,${line} ${lw},#0000 0) ${x}px 0/${w}px 100%,linear-gradient(${line} ${lw},#0000 0) 0 ${y}px/100% ${h}px`;
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    const ann = 1 - pr(t, [FIN, FIN + 0.6]);
    // 1. the two boxes
    BH.style.cssText = 'left:0;top:0;width:400px;height:300px';
    BH.style.opacity = win(t, 0.2, 9.8) * 0.9;
    const k1 = pr(t, [0.6, 2.6]);
    const bx = [lerp(0, 50, k1), lerp(0, 130, k1), lerp(400, 300, k1), lerp(300, 40, k1)];
    Object.assign(BB.style, { left: `${bx[0]}px`, top: `${bx[1]}px`, width: `${bx[2]}px`, height: `${bx[3]}px` });
    BB.style.opacity = Math.max(win(t, 0.2, 4.8), win(t, 20.2, 29.8)) * 0.9;
    BL.style.opacity = 1 - pr(t, [5.2, 5.8]);
    // 2-4. html's background: hint from 1q to 37q, then size, then position
    const hint = lerp(Q, R, pr(t, [5.6, 8.4]));
    const w = lerp(400, HW, pr(t, [10.6, 12.8]));
    const kp = pr(t, [15.6, 18.6]);
    const x = HX * kp, y = HY * kp;
    const hd = teach ? 'var(--t0810-hd)' : '#144650';
    const hg = !teach && t >= FIN ? 'radial-gradient(1q,#144650,37q,#F3AC3C)' : `radial-gradient(1q,${hd},${hint}px,#f3ac3c)`;
    H.style.background = `${hg} ${x - LX}px ${y - LY}px/${w}px 300px`;
    H.style.opacity = pr(t, [5.2, 5.6]);
    HG.style.background = grid(x - LX, y - LY, w, 300);
    HG.style.opacity = win(t, 10.4, 19.8) * 0.9;
    // 5-6. body's background: size from 310.4 to 109.80, then position
    const bw = lerp(HW, BW, pr(t, [20.8, 23]));
    const xb = BX * pr(t, [25.6, 28.6]);
    const bd = teach ? 'var(--t0810-bd)' : '#144650';
    const bo = teach ? 'var(--t0810-bb)' : '#f3ac3c';
    B.style.background = !teach && t >= FIN ? `radial-gradient(1q,#144650,37q,#F3AC3C) ${BX}px 0/${BW}px 40px` : `radial-gradient(1q,${bd},37q,${bo}) ${xb}px 0/${bw}px 40px`;
    B.style.opacity = pr(t, [20.2, 20.7]);
    BG.style.background = `linear-gradient(90deg,${line} ${lw},#0000 0) ${xb}px 0/${bw}px 100%`;
    BG.style.opacity = win(t, 20.4, 29.8) * 0.9;
    RG.style.background = `radial-gradient(circle,#0000 calc(${R}px - ${lw}),${line} 0 ${R}px,#0000 0) ${xb}px 0/${bw}px 100% repeat-x`;
    RG.style.opacity = win(t, 23.2, 29.8) * 0.8;
    [[0.2, 4.8], [5.2, 9.8], [10.2, 14.8], [15.2, 19.8], [20.2, 24.8], [25.2, 29.8]].forEach(([a, z], k) => (L(k + 1).style.opacity = win(t, a, z) * ann));
    let txt = '';
    if (step === 0) txt = `body${c} (${n2(bx[0])}${sep} ${n2(bx[1])}) · ${n2(bx[2])} × ${n2(bx[3])}`;
    else if (step === 1) txt = fr ? `#F3AC3C repoussé à ${n2(hint)}px` : `#F3AC3C pushed to ${n2(hint)}px`;
    else if (step === 2) txt = `background-size${c} ${n2(w)}px × 300px`;
    else if (step === 3) txt = `background-position${c} ${n2(x)}px ${n2(y)}px`;
    else if (step === 4) txt = `background-size${c} ${n2(bw)}px × 40px`;
    else if (step === 5) txt = `background-position${c} ${n2(xb)}px 0px`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
