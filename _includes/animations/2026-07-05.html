<style>

<div class="anim-col">

<div class="anim-side">
<pre class="code" aria-hidden="true"><span data-on="1">&lt;p>&lt;img>&lt;p>&lt;img></span>&lt;style>*{background:#3450AE;<span data-on="1">margin:20</span>;<span data-on="2 4 5" data-tone="2">+*{</span><span data-on="4 5">scale:-1 1</span>;<span data-on="2">*{border:solid 5vw#F7EC7D;border-radius:1in;</span><span data-on="3">*{zoom:75%</span></pre>
<div class="now" aria-live="polite">
<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="Les marges"><h3>1. Une marge à chaque étage</h3><p>Il n'y a pas de doctype : la page est en mode quirks, et <code>margin:20</code> veut dire 20px. <code>&lt;p></code> ouvre body et un premier p, avec son img. Le second <code>&lt;p></code> ferme le premier et en ouvre un autre, qui reçoit l'autre img et le style. <code>*</code> donne la marge à tous : html en (20, 20), body en (40, 40), et les p en x = 60. Le bleu est partout.</p></div>
<div class="cap" data-t="5" data-step="Les bordures"><h3>2. Quatre bordures jaunes</h3><p>Le <code>+*</code> imbriqué veut dire <code>* + *</code> : body, qui suit head, le second p, qui suit le premier, et le style. Le <code>*</code> imbriqué dedans vise leurs descendants : les deux p et les deux img. Chacun reçoit une bordure jaune de <code>5vw</code> = 20px et des coins de <code>1in</code> = 96px. Les img n'ont pas de contenu : ce sont des disques de 40px. Avec leurs marges, chaque p fait 120px de haut.</p></div>
<div class="cap" data-t="10" data-step="Le zoom"><h3>3. zoom:75% sur les img</h3><p>Le <code>*</code> imbriqué une fois de plus vise les enfants des p : les deux img. <code>zoom:75%</code> réduit leur bordure et leur marge à 15px. La pastille fait 30px, sa ligne 60px, et chaque p 100px de haut. Les pilules vont de y = 40 à 140 et de 160 à 260.</p></div>
<div class="cap" data-t="15" data-step="body"><h3>4. Le miroir de body</h3><p>body est dans <code>+*</code> : <code>scale:-1 1</code> le retourne de gauche à droite, autour de son centre, en x = 200. Tout ce qu'il contient suit. Les deux pastilles passent à droite, de x = 275 à 305.</p></div>
<div class="cap" data-t="20" data-step="Le 2e p"><h3>5. Le second p se retourne encore</h3><p>Le second p suit le premier : il est aussi dans <code>+*</code> et reçoit le même <code>scale:-1 1</code>. Son centre est aussi en x = 200. Retourné deux fois, il revient à l'endroit : sa pastille revient à gauche, de x = 95 à 125.</p></div>
<div class="cap" data-t="25" data-step="Résultat" data-live="122 caractères · 100 % identique"><h3>6. Résultat : 122 caractères</h3><p>Une marge pour tous les étages, une bordure pour les pilules et les pastilles, et un seul <code>+*</code> qui retourne body et remet le second p à l'endroit.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="Margins"><h3>1. One margin on every level</h3><p>There is no doctype: the page is in quirks mode, and <code>margin:20</code> means 20px. <code>&lt;p></code> opens body and a first p, with its img. The second <code>&lt;p></code> closes the first one and opens another, which gets the other img and the style. <code>*</code> gives the margin to all: html at (20, 20), body at (40, 40), and the p at x = 60. The blue is everywhere.</p></div>
<div class="cap" data-t="5" data-step="Borders"><h3>2. Four yellow borders</h3><p>The nested <code>+*</code> means <code>* + *</code>: body, which follows head, the second p, which follows the first, and the style. The <code>*</code> nested inside selects their descendants: both p and both img. Each gets a <code>5vw</code> = 20px yellow border and <code>1in</code> = 96px corners. The img have no content: they are 40px discs. With their margins, each p is 120px tall.</p></div>
<div class="cap" data-t="10" data-step="Zoom"><h3>3. zoom:75% on the img</h3><p>The <code>*</code> nested one level deeper selects the children of the p: both img. <code>zoom:75%</code> shrinks their border and their margin to 15px. The knob is 30px, its line 60px, and each p 100px tall. The pills run from y = 40 to 140 and from 160 to 260.</p></div>
<div class="cap" data-t="15" data-step="body"><h3>4. body's mirror</h3><p>body is in <code>+*</code>: <code>scale:-1 1</code> flips it left to right, around its center, at x = 200. Everything inside follows. Both knobs move to the right, from x = 275 to 305.</p></div>
<div class="cap" data-t="20" data-step="2nd p"><h3>5. The second p flips again</h3><p>The second p follows the first one: it is in <code>+*</code> too and gets the same <code>scale:-1 1</code>. Its center is at x = 200 too. Flipped twice, it is back as it was: its knob goes back to the left, from x = 95 to 125.</p></div>
<div class="cap" data-t="25" data-step="Result" data-live="122 characters · 100% match"><h3>6. Result: 122 characters</h3><p>One margin for every level, one border for the pills and the knobs, and a single <code>+*</code> that flips body and turns the second p back.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0705 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? ' :' : ':';
  const at = fr ? 'en' : 'at';
  const num = (v, d = 0) => { const s = Math.abs(v).toFixed(d); return (v < -0.005 ? '−' : '') + (fr ? s.replace('.', ',') : s); };
  // Boxes measured with getBoundingClientRect on the official code in local Chrome:
  // html (20, 20) 360 × 260; body (40, 40) 320 × 220; p (60, 40) and (60, 160), 280 × 100, 20px border;
  // img 30 × 30 (zoom .75 of a 20px border and 20px margins), at (275, 75) and (95, 195) once flipped.
  // Without the zoom (checked by rendering the code without zoom:75%): 40px knobs, 120px pills.
  // In between (b = border, z = zoom): knob 2bz wide, margin 20z; p height 2b + 40z + 2bz, from y = 40, the second one 20px lower.
  const FIN = 25;
  const lerp = (a, b, k) => a + (b - a) * k;
  const put = (e, x, y, w, h) => { e.style.left = `${x}px`; e.style.top = `${y}px`; e.style.width = `${w}px`; e.style.height = `${h}px`; };
  const bd = $('.t0705-bd'), p2w = $('.t0705-p2w');
  const p1 = $('.t0705-p1'), p2 = $('.t0705-p2'), k1 = $('.t0705-k1'), k2 = $('.t0705-k2');
  const hb = $('.t0705-hb'), bb = $('.t0705-bb');
  const L = (k) => $$(`.t0705-l[data-l="${k}"]`);
  const col = (teach, v) => (teach ? `var(--t0705-${v})` : 'var(--t0705-ye)');
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    const out = 1 - pr(t, [FIN - 0.4, FIN]);
    // 1. html and body boxes, 20px margin each
    const kH = pr(t, [0.5, 2]), kB = pr(t, [2.5, 4]);
    put(hb, lerp(0, 20, kH), lerp(0, 20, kH), lerp(400, 360, kH), lerp(300, 260, kH));
    hb.style.opacity = 0.9 * pr(t, [0.2, 0.5]) * out;
    put(bb, lerp(20, 40, kB), lerp(20, 40, kB), lerp(360, 320, kB), lerp(260, 220, kB));
    bb.style.opacity = 0.9 * pr(t, [2.2, 2.5]) * out;
    // 2. the borders grow to 20px (img: no content, so the border is the whole disc)
    const b = 20 * pr(t, [5.5, 7.5]);
    // 3. zoom on the img: 1 -> .75
    const z = lerp(1, 0.75, pr(t, [10.5, 12.5]));
    const kw = 2 * b * z, km = 20 * z;           // knob size, knob margin
    const ph = 2 * b + 2 * km + kw;              // p height: its border + the img's margin box
    put(p1, 60, 40, 280, ph);
    put(p2, 60, 40 + ph + 20, 280, ph);
    put(k1, 60 + b + km, 40 + b + km, kw, kw);
    put(k2, 60 + b + km, 40 + ph + 20 + b + km, kw, kw);
    [p1, p2].forEach((e) => (e.style.borderWidth = `${b}px`));
    [k1, k2].forEach((e) => (e.style.borderWidth = `${b * z}px`));
    const vis = t >= 5.5 ? 1 : 0;
    [p1, p2, k1, k2].forEach((e) => (e.style.opacity = vis));
    p1.style.borderColor = col(teach, 'c1');
    p2.style.borderColor = col(teach, 'c2');
    k1.style.borderColor = k2.style.borderColor = col(teach, 'c3');
    // 4. body flips around x = 200; 5. the second p flips around x = 200 too
    const sB = lerp(1, -1, pr(t, [15.5, 17.5])), sP = lerp(1, -1, pr(t, [20.5, 22.5]));
    bd.style.transform = `scaleX(${sB})`;
    p2w.style.transform = `scaleX(${sP})`;
    [[0.3, 5], [5.3, 10], [10.3, 15], [15.3, 20], [20.3, 25]].forEach(([a, e], k) => L(k + 1).forEach((l) => (l.style.opacity = win(t, a, e))));
    let txt;
    if (step === 0) txt = `html${c} ${num(lerp(400, 360, kH))} × ${num(lerp(300, 260, kH))} ${at} (${num(lerp(0, 20, kH))}, ${num(lerp(0, 20, kH))}) · body${c} ${at} (${num(lerp(20, 40, kB))}, ${num(lerp(20, 40, kB))})`;
    else if (step === 1) txt = fr ? `bordure${c} ${num(b)}px · p${c} 280 × ${num(ph)}` : `border${c} ${num(b)}px · p${c} 280 × ${num(ph)}`;
    else if (step === 2) txt = fr ? `zoom${c} ${num(z * 100)} % · pastille ${num(kw)}px · p${c} 280 × ${num(ph)}` : `zoom${c} ${num(z * 100)}% · knob ${num(kw)}px · p${c} 280 × ${num(ph)}`;
    else if (step === 3) txt = `body${c} scale ${num(sB, 2)} 1`;
    else if (step === 4) txt = fr ? `2e p${c} scale ${num(sP, 2)} 1` : `2nd p${c} scale ${num(sP, 2)} 1`;
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
