<div class="cap" data-t="4" data-step="html, une boîte"><h3>2. html devient une boîte</h3><p><code>&amp;,a</code> donne à html une marge et une bordure. <code>55%</code> des 400px de large font 220px : html commence en y = 220, à 99px de chaque côté. <code>64Q</code> fait 60,47px, tracés en 60px. html fait 202 × 120, et son contenu 82 × 0 : il n'y a plus de place. La bordure <code>#4bda</code> est un turquoise aux deux tiers opaque : sur le sable, elle donne #78c3c7. Son bas sort du canevas.</p></div>
<div class="cap" data-t="9.5" data-step="body, 91px"><h3>3. body, 91px de haut</h3><p>Le <code>*</code> imbriqué vise tout élément placé dans html ou dans un a. body en fait partie. Sa marge <code>-91-263 0 59</code> : 59 à gauche, −263 à droite, donc 82 − 59 + 263 = 286 de large, à partir de x = 218. En mode quirks, body s'étire sur la hauteur du contenu de html, ici 0, moins ses propres marges : 0 + 91 = 91. Avec −91 en haut, il va de y = 189 à 280.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0714 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);

  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? ' :' : ':';
  const num = (v, d = 0) => { const s = Math.abs(v).toFixed(d); return (v < -0.005 ? '−' : '') + (fr ? s.replace('.', ',') : s); };
  // Measured on the official code in local Chrome (quirks mode, 400 × 300), getBoundingClientRect and computed styles:
  // html: margin 220px 99px, border 60px (64Q), border box (99, 220) 202 × 120, content 82 × 0.
  // body: margin -91 -263 0 59, box (218, 189) 286 × 91, scale 1.49 3 around (361, 234.5) → (147.93, 98) 426.14 × 273.
  // a (inline, empty): border boxes (277, 129), (193, 129), (109, 129), 120 × 138; text box 0 × 18 at y = 189;
  // scaled: (235.84, -82), (110.68, -82), (-14.48, -82), 178.8 × 414. Without scale: same layout, triangles 120 × 60.
  const FIN = 26.5;
  const CX = 361, CY = 234.5;
  const w = $('.t0714-w'), html = $('.t0714-html'), hb = $('.t0714-hb'), hc = $('.t0714-hc'), bod = $('.t0714-body');
  const T = $$('.t0714-tri'), AB = $$('.t0714-ab'), TX = $$('.t0714-tx');
  const L = (k) => $$(`.t0714-l[data-l="${k}"]`);
  const box = (e, x, y, wd, ht) => Object.assign(e.style, { left: `${x}px`, top: `${y}px`, width: `${wd}px`, height: `${ht}px` });
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    w.style.opacity = 1 - pr(t, [0.4, 1.4]);
    // 2. html's border box
    const hg = pr(t, [4.6, 6.4]);
    box(html, 200 - 101 * hg, 280 - 60 * hg, 202 * hg, 120 * hg);
    html.style.opacity = pr(t, [4.4, 4.6]);
    html.style.background = teach ? 'var(--t0714-h)' : 'var(--t0714-tq)';
    hb.style.opacity = 0.9 * win(t, 6.4, 9.5);
    hc.style.opacity = 0.9 * win(t, 6.4, 9.5);
    // 3. body, then 5. scale
    const s = pr(t, [21.2, 23.6]);
    const sx = 1 + 0.49 * s, sy = 1 + 2 * s;
    const X = (x) => CX + (x - CX) * sx, Y = (y) => CY + (y - CY) * sy;
    box(bod, X(218), Y(189), 286 * sx, 91 * sy);
    bod.style.opacity = 0.9 * pr(t, [10, 10.5]) * (1 - pr(t, [26, 26.5]));
    // 4. the links: border width b grows 0 → 60; each a starts 59 + 2b − 263 after the previous one
    const b = 60 * pr(t, [15.6, 17.8]);
    T.forEach((tri, i) => {
      const x = 277 + i * (2 * b - 204);
      box(tri, X(x), Y(207), 2 * b * sx, b * sy);
      tri.style.opacity = pr(t, [15.2, 15.6]);
      tri.style.background = teach ? `var(--t0714-c${i + 1})` : 'var(--t0714-k)';
      box(AB[i], X(x), Y(189 - b), 2 * b * sx, (18 + 2 * b) * sy);
      AB[i].style.borderColor = teach ? `var(--t0714-c${i + 1})` : '#1d1530';
      AB[i].style.opacity = 0.9 * pr(t, [15.2, 15.6]) * (1 - pr(t, [26, 26.5]));
      const tw = 3 * parseFloat(getComputedStyle(TX[i]).getPropertyValue('--k') || 1);
      box(TX[i], X(x + b) - tw / 2, Y(189), tw, 18 * sy);
      TX[i].style.opacity = 0.9 * win(t, 14.9, 20.5);
    });
    [[0.3, 4], [4.4, 9.5], [9.9, 14.5], [14.9, 20.5], [20.9, 26.5]].forEach(([a, z], k) => L(k + 1).forEach((e) => (e.style.opacity = win(t, a, z))));
    let txt;
    if (step === 0) txt = fr ? `fond${c} #e0d59d · tout le canevas` : `background${c} #e0d59d · the whole canvas`;
    else if (step === 1) txt = fr ? `html${c} ${num(202 * hg)} × ${num(120 * hg)} en (${num(200 - 101 * hg)}, ${num(280 - 60 * hg)}) · bordure 60` : `html${c} ${num(202 * hg)} × ${num(120 * hg)} at (${num(200 - 101 * hg)}, ${num(280 - 60 * hg)}) · border 60`;
    else if (step === 2) txt = fr ? `body${c} 286 × 91 en (218, 189)` : `body${c} 286 × 91 at (218, 189)`;
    else if (step === 3) txt = fr ? `bordure${c} ${num(b, 1)}px · a en x = ${[0, 1, 2].map((i) => num(277 + i * (2 * b - 204), 1)).join(' ; ')}` : `border${c} ${num(b, 1)}px · a at x = ${[0, 1, 2].map((i) => num(277 + i * (2 * b - 204), 1)).join(', ')}`;
    else if (step === 4) txt = fr ? `scale${c} ${num(sx, 2)} ${num(sy, 2)} · sommets en y = ${num(Y(207), 1)}` : `scale${c} ${num(sx, 2)} ${num(sy, 2)} · apexes at y = ${num(Y(207), 1)}`;
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
