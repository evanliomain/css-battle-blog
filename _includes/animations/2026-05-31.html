<div class="cap" data-t="0" data-step="html"><h3>1. Les tirets de html</h3><p><code>*</code> vise html, head, body et style. Ici, html d'abord. <code>margin:50 10</code> en fait une boîte de 380 × 200 en (10, 50) : en mode quirks, html remplit la page moins ses marges. <code>border-block:32Q dashed</code> lui donne une bordure en tirets en haut et en bas. 32Q font 30,24px, et Chrome la dessine sur 30px. Un tiret fait deux fois l'épaisseur, 60px : cinq tirets par côté, séparés de 20px.</p></div>
<div class="cap" data-t="6" data-step="Canevas"><h3>2. Le fond va au canevas</h3><p>Le <code>*{</code> imbriqué veut dire <code>* *</code> : head, body et style, mais pas html. body reçoit <code>background:#556d7f</code>. html n'a pas de fond : celui de body passe alors au canevas, qu'il peint en entier. La boîte de body, elle, reste transparente.</p></div>
<div class="cap" data-t="11" data-step="body"><h3>3. La boîte de body</h3><p><code>margin:-25</code> agrandit body de 25px de chaque côté : 430 × 190 en (−15, 55). body a aussi les tirets de <code>border-block</code>, venus du premier <code>*</code>. Sur 430px, ils sont séparés de 32,5px. Celui du milieu va de x = 170 à 230, centré sur le canevas.</p></div>
<div class="cap" data-t="17" data-step="Rotation"><h3>4. Un quart de tour</h3><p><code>rotate:90deg</code> tourne body autour de son centre, qui est aussi celui du canevas, (200, 150). Ses bordures du haut et du bas deviennent deux barres verticales de 30px : de x = 105 à 135 et de 265 à 295. Elles tombent au milieu des tirets de html centrés en x = 120 et 280.</p></div>
<div class="cap" data-t="22" data-step="Étirement"><h3>5. Trois fois plus long</h3><p><code>scale:3 1</code> étire body trois fois dans sa longueur, qui est maintenant verticale. Le tiret du milieu passe de 60 à 180px : de y = 60 à 240. Il entre de 20px dans les tirets de html, en haut et en bas. Les tirets suivants partent hors du canevas, au-dessus de y = −37,5 et en dessous de 337,5.</p></div>
<div class="cap" data-t="27" data-step="Résultat" data-live="107 caractères · 100 % identique"><h3>6. Résultat : 107 caractères</h3><p>Sur le canevas, il ne reste que les dix tirets de html et le tiret du milieu de chaque bordure de body. Avec les tirets de html qu'elles touchent, les deux barres forment deux I.</p></div>

<div class="cap" data-t="6" data-step="Canvas"><h3>2. The background goes to the canvas</h3><p>The nested <code>*{</code> means <code>* *</code>: head, body and style, but not html. body gets <code>background:#556d7f</code>. html has no background, so body's background goes to the canvas and paints all of it. body's own box stays clear.</p></div>
<div class="cap" data-t="11" data-step="body"><h3>3. body's box</h3><p><code>margin:-25</code> makes body 25px larger on each side: 430 × 190 at (−15, 55). body also gets the <code>border-block</code> dashes, from the first <code>*</code>. On 430px, they are 32.5px apart. The middle one runs from x = 170 to 230, centered on the canvas.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0531 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? ' :' : ':';
  const n = (x) => (fr ? String(x).replace('.', ',') : String(x));
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  // Measured on the official code in local Chrome (400 × 300 iframe, quirks mode, getBoundingClientRect, renders with colored borders).
  // html: 10, 50, 380 × 200, border-block 30px (32Q = 30.24px), no background. Dashes 60px: x = 10, 90, 170, 250, 330; y = 50–80 and 220–250.
  // body: layout box -15, 55, 430 × 190 (offset 430 × 190), border-block 30px, background #556d7f (painted on the canvas).
  // Its dashes, unturned: local x = 0, 92.5, 185, 277.5, 370 (60px each). transform-origin 215px 95px = canvas (200, 150).
  // rotate 90deg + scale 3 1: bounding box 105, -495, 190 × 1290. Bars x = 105–135 and 265–295, y = 60–240 on the canvas.
  const R = '#f4dcbf';
  const blank = $('.t0531-blank'), body = $('.t0531-body'), hbox = $('.t0531-hbox'), bbox = $('.t0531-bbox');
  const hds = $$('.t0531-hd'), bds = $$('.t0531-bd');
  const labs = $$('.zlab');
  const ivs = [[0.3, 5.8], [6.3, 10.8], [11.3, 16.8], [17.3, 21.8], [22.3, 26.8]];
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const wide = fig.dataset.view === 'wide';
    const tw = teach ? 1 - pr(t, [27.3, 28.3]) : 0;
    // step 1: html's box, then its dashes, left to right
    hbox.style.opacity = win(t, 0.3, 26.8);
    const hc = mix(tw, 'var(--t0531-hd)', R);
    hds.forEach((d) => {
      const i = +d.dataset.i;
      d.style.opacity = pr(t, [0.9 + 0.25 * i, 1.6 + 0.25 * i]);
      d.style.background = hc;
    });
    // step 2: body's background reaches the canvas
    blank.style.opacity = 1 - pr(t, [6.6, 8.2]);
    // step 3: body's box and its dashes
    bbox.style.opacity = win(t, 11.3, 26.8);
    const bc = mix(tw, 'var(--t0531-bd)', R);
    bds.forEach((d) => {
      const i = +d.dataset.i;
      d.style.opacity = pr(t, [12 + 0.25 * i, 12.7 + 0.25 * i]);
      d.style.background = bc;
    });
    // steps 4 and 5: the quarter turn, then the stretch along body's own length
    const a = 90 * pr(t, [17.6, 19.8]);
    const s = 1 + 2 * pr(t, [22.6, 24.8]);
    body.style.transform = `rotate(${a}deg) scale(${s}, 1)`;
    // labels: one per step, at the top left of the frame
    labs.forEach((l) => {
      const x0 = wide ? -40 : 0, y0 = wide ? -235 : 0;
      l.style.left = `calc(${x0}px + 4px * var(--k, 1))`;
      l.style.top = `calc(${y0}px + 4px * var(--k, 1))`;
      l.style.opacity = win(t, ...ivs[+l.dataset.l - 1]);
    });
    let txt;
    if (step === 0) txt = `32Q = ${n(30.24)}px → 30px · ${fr ? 'tirets' : 'dashes'} 60, ${fr ? 'écart' : 'gap'} 20`;
    else if (step === 1) txt = `${fr ? 'canevas' : 'canvas'}${c} #556d7f`;
    else if (step === 2) txt = `body${c} (−15, 55) · 430 × 190 · ${fr ? 'écart' : 'gap'} ${n(32.5)}`;
    else if (step === 3) txt = `${fr ? 'barres' : 'bars'}${c} x = 105–135, 265–295`;
    else if (step === 4) txt = `60 × 3 = 180 · y = 60–240`;
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
