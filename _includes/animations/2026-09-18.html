<div class="anim-col">
<div class="stage" role="img" aria-label="{% if include.lang == "fr" %}Animation : avec zoom:10, html devient une boîte de 12 × 22 dont la bordure, sans côté droit et arrondie à gauche, fait un crochet ; le body, sans largeur, n'est plus qu'une bordure : une barre verticale ; un p sans hauteur, élargi par une marge négative, n'est qu'une bordure lui aussi : la barre horizontale{% else %}Animation: with zoom:10, html becomes a 12 × 22 box whose border, with no right side and rounded on the left, makes a bracket; the body, with no width, is only a border: a vertical bar; a p with no height, widened by a negative margin, is only a border too: the horizontal bar{% endif %}">

<span class="zlab t0918-l-b" style="left:12px;top:12px">body · 10 − 17 − 17 &lt; 0 → 0 + 1 + 1 = 2</span>

</div>

<div class="legend"><span><i style="--c:var(--t0918-y)"></i>{% if include.lang == "fr" %}bordure de html{% else %}html's border{% endif %}</span><span><i style="--c:var(--t0918-b)"></i>{% if include.lang == "fr" %}du body (jaune en vrai){% else %}the body's (yellow in reality){% endif %}</span><span><i style="--c:var(--t0918-p)"></i>{% if include.lang == "fr" %}du p (jaune en vrai){% else %}the p's (yellow in reality){% endif %}</span></div>
</div>
<div class="anim-side">
<pre class="code" aria-hidden="true"><span data-on="4">&lt;p></span>&lt;style>*{<span data-on="1 3 4">border:1px solid#FAE29E</span>;<span data-on="3">margin:5 17</span>}&amp;{<span data-on="1" data-tone="2">zoom:10</span>;background:#4C4C6B;<span data-on="1">margin:4 16 4 12;border-width:2 0 2 2</span>;<span data-on="2" data-tone="2">border-radius:4px 0 0 4px</span>;p{<span data-on="4">margin:2-1 0-15</span></pre>
<div class="now" aria-live="polite">
<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="html : un crochet"><h3>1. <code>html</code> : un crochet</h3><p><code>&amp;</code> seul vise <code>html</code>. <code>zoom:10</code> agrandit tout dix fois : le cadre ne fait plus que 40 × 30. <code>margin:4 16 4 12</code> laisse à <code>html</code> 40 − 28 = 12 de large et, en mode quirks, 30 − 8 = 22 de haut. Sa bordure jaune, venue de <code>*</code>, passe à <code>2 0 2 2</code> : haut, bas et gauche, sans côté droit. À l'écran, de x = 120 à 240 et de y = 40 à 260.</p></div>
<div class="cap" data-t="4" data-step="Deux coins ronds"><h3>2. Deux coins ronds</h3><p><code>border-radius:4px 0 0 4px</code> arrondit les deux coins de gauche de 4, soit 40px à l'écran. Le bord intérieur suit avec un rayon de 4 − 2 = 2 : la bordure garde son épaisseur dans la courbe.</p></div>
<div class="cap" data-t="8" data-step="Le body : une barre"><h3>3. Le <code>body</code> : une barre</h3><p>Le <code>body</code> garde <code>margin:5 17</code> et la bordure de 1. Dans les 10 de contenu de <code>html</code>, 17 + 17 de marge ne laissent rien : sa largeur tombe à 0, et sa marge gauche le pousse en x = 31. En mode quirks, il fait 18 − 10 = 8 de haut. Il ne reste que ses bordures gauche et droite, collées : une barre de 2 × 8, de x = 310 à 330 et de y = 110 à 190.</p></div>
<div class="cap" data-t="12" data-step="Le p : la seconde barre"><h3>4. Le <code>p</code> : la seconde barre</h3><p>Le <code>p</code> est vide : 0 de haut, et seule sa bordure de 1 compte, 2 de haut. <code>margin:2-1 0-15</code> le descend de 2, et ses marges de −15 à gauche et −1 à droite l'élargissent : 0 + 15 + 1 = 16. Il va de x = 170 à 330, de y = 140 à 160 : la barre horizontale qui rejoint la verticale.</p></div>
<div class="cap" data-t="16" data-step="Résultat" data-live="158 caractères · 100 % identique"><h3>5. Résultat : 158 caractères</h3><p>Trois boîtes sans contenu, réduites à leur bordure jaune : un crochet et un T couché.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html: a bracket"><h3>1. <code>html</code>: a bracket</h3><p>A lone <code>&amp;</code> matches <code>html</code>. <code>zoom:10</code> makes everything ten times bigger: the frame is only 40 × 30. <code>margin:4 16 4 12</code> leaves <code>html</code> 40 − 28 = 12 wide and, in quirks mode, 30 − 8 = 22 tall. Its yellow border, from <code>*</code>, becomes <code>2 0 2 2</code>: top, bottom and left, no right side. On screen, from x = 120 to 240 and y = 40 to 260.</p></div>
<div class="cap" data-t="4" data-step="Two round corners"><h3>2. Two round corners</h3><p><code>border-radius:4px 0 0 4px</code> rounds the two left corners by 4, 40px on screen. The inner edge follows with a radius of 4 − 2 = 2: the border keeps its thickness around the curve.</p></div>
<div class="cap" data-t="8" data-step="The body: a bar"><h3>3. The <code>body</code>: a bar</h3><p>The <code>body</code> keeps <code>margin:5 17</code> and the 1 wide border. Inside <code>html</code>'s 10 of content, 17 + 17 of margin leave nothing: its width drops to 0, and its left margin pushes it to x = 31. In quirks mode, it is 18 − 10 = 8 tall. Only its left and right borders are left, side by side: a 2 × 8 bar, from x = 310 to 330 and y = 110 to 190.</p></div>
<div class="cap" data-t="12" data-step="The p: the second bar"><h3>4. The <code>p</code>: the second bar</h3><p>The <code>p</code> is empty: 0 tall, so only its 1 wide border counts, 2 tall. <code>margin:2-1 0-15</code> moves it 2 down, and its −15 left and −1 right margins widen it: 0 + 15 + 1 = 16. It runs from x = 170 to 330, y = 140 to 160: the horizontal bar that meets the vertical one.</p></div>
<div class="cap" data-t="16" data-step="Result" data-live="158 characters · 100% match"><h3>5. Result: 158 characters</h3><p>Three boxes with no content, reduced to their yellow border: a bracket and a T on its side.</p></div>
{%- endif %}

<script>
(window.AnimScenes = window.AnimScenes || {}).t0918 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const H = $('[data-e="html"]'), B = $('[data-e="body"]'), P = $('[data-e="p"]'), oH = $('[data-o="html"]'), live = $('.live');
  const L = (k) => $(`.t0918-l-${k}`);
  const W = { z: [0.3, 1.8], r: [4.2, 5.8], b: [8.2, 9.8], p: [12.2, 13.8], fin: [16.1, 16.9] };
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const lerp = (a, b, m) => a + (b - a) * m;
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const f1 = (v) => { const s = (Math.round(v * 100) / 100).toFixed(2).replace(/\.?0+$/, ''); return (fr ? s.replace('.', ',') : s).replace('-', '−'); };
  const c = fr ? ' :' : ':';
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const real = !teach || t >= W.fin[0];
    const guides = t < W.fin[0] ? 1 : 0;
    const z = pr(t, W.z), r = pr(t, W.r), b = pr(t, W.b), p = pr(t, W.p);
    // 1-2. html: border 2 0 2 2 (20px on screen), then round left corners
    H.style.borderWidth = `${20 * z}px 0 ${20 * z}px ${20 * z}px`;
    H.style.borderRadius = `${40 * r}px 0 0 ${40 * r}px`;
    oH.style.opacity = (step <= 1 ? z : 0) * guides;
    L('z').style.opacity = win(t, W.z[0], W.r[0] - 0.2);
    L('r').style.opacity = win(t, W.r[0], W.b[0] - 0.2);
    // 3. body: only its side borders, a 20 × 80 bar
    B.style.opacity = b;
    B.style.borderColor = real ? 'var(--t0918-y)' : 'var(--t0918-b)';
    L('b').style.opacity = win(t, W.b[0], W.p[0] - 0.2);
    // 4. p: widened to the left by its −15 margin
    P.style.opacity = p > 0 ? 1 : 0;
    P.style.left = `${lerp(310, 170, p)}px`;
    P.style.width = `${lerp(20, 160, p)}px`;
    P.style.borderColor = real ? 'var(--t0918-y)' : 'var(--t0918-p)';
    L('p').style.opacity = win(t, W.p[0], W.fin[0]);
    let txt = '';
    if (step === 0) txt = `html${c} x 120 → 240, y 40 → 260`;
    else if (step === 1) txt = `${fr ? 'rayon' : 'radius'}${c} ${f1(40 * r)}px`;
    else if (step === 2) txt = `body${c} x 310 → 330, y 110 → 190`;
    else if (step === 3) txt = `p${c} x ${f1(lerp(310, 170, p))} → 330, y 140 → 160`;
    else txt = $$('.caps .cap')[4].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
