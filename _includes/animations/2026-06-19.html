<div class="cap" data-t="0" data-step="html"><h3>1. html, une boîte de 0 × 0 au centre</h3><p>Hors de toute règle, <code>&amp;</code> désigne la racine : html. Son fond couvre tout le canevas. <code>*</code> touche html, head, style et body ; head et style sont masqués. Une marge en % se calcule sur la largeur du parent, même en haut et en bas : 37,5 % × 400 = 150px et 50 % × 400 = 200px. html fait 400 − 400 = 0 de large. En mode quirks, il remplit la hauteur du canevas, donc il fait 300 − 300 = 0 de haut. html est un point, en (200, 150).</p></div>
<div class="cap" data-t="5" data-step="Ombres"><h3>2. Deux ombres sur une boîte vide</h3><p>La boîte fait 0 × 0, donc une ombre n'est que son étalement : un carré de deux fois l'étalement. <code>32q -32q 0 60px</code> donne un carré blanc de 120 × 120, décalé de 30,24px vers la droite et le haut. <code>64q -64q 0 32q</code> donne un carré #444 de 60,47 × 60,47, décalé de 60,47px. La première ombre est peinte au-dessus : le carré #444 couvre le coin extérieur du blanc.</p></div>
<div class="cap" data-t="10" data-step="rotate"><h3>3. rotate:45deg</h3><p>html tourne de 45° autour de sa boîte, au centre du canevas. Les deux carrés deviennent des losanges, et le coin en haut à droite pointe maintenant vers la droite.</p></div>
<div class="cap" data-t="14" data-step="scale:-1"><h3>4. scale:-1 retourne html</h3><p><code>scale:-1</code> retourne html sur ses deux axes : c'est un demi-tour autour du centre. Les losanges passent à gauche. html est tourné de 45° + 180° = 225°.</p></div>
<div class="cap" data-t="18" data-step="body"><h3>5. body, la même chose</h3><p>body a aussi la marge, scale:-1 et les ombres. Sa marge en % se calcule sur la largeur de html, 0 : elle vaut 0. body est donc aussi un point en (200, 150). Il est dans html, donc il tourne avec lui : ses ombres tombent d'abord pile sur celles de html.</p></div>
<div class="cap" data-t="22" data-step="scale:-1 de body"><h3>6. Le scale:-1 de body</h3><p>Le <code>scale:-1</code> de body s'ajoute à celui de html : encore un demi-tour, 225° + 180° = 405°, soit 45°. Les ombres de body passent à droite. Les deux carrés blancs se chevauchent au milieu et forment le X.</p></div>

{%- else %}
<div class="cap" data-t="0" data-step="html"><h3>1. html, a 0 × 0 box at the center</h3><p>Outside any rule, <code>&amp;</code> means the root: html. Its background goes to the whole canvas. <code>*</code> selects html, head, style and body; head and style are hidden. A margin in % is a share of the parent's width, even at the top and bottom: 37.5% × 400 = 150px and 50% × 400 = 200px. html is 400 − 400 = 0 wide. In quirks mode it fills the canvas height, so it is 300 − 300 = 0 tall. html is a point, at (200, 150).</p></div>
<div class="cap" data-t="5" data-step="Shadows"><h3>2. Two shadows on an empty box</h3><p>The box is 0 × 0, so a shadow is only its spread: a square twice the spread. <code>32q -32q 0 60px</code> gives a 120 × 120 white square, moved 30.24px right and up. <code>64q -64q 0 32q</code> gives a 60.47 × 60.47 #444 square, moved 60.47px. The first shadow is painted on top: the #444 square covers the outer corner of the white one.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0619 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? ' :' : ':';
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  // Measured on the official code in local Chrome (400 × 300 iframe, quirks mode, getBoundingClientRect, getComputedStyle):
  // html 0 × 0 at (200, 150), margins 150px / 200px, rotate 45deg, scale -1; body 0 × 0 at (200, 150), margin 0, scale -1.
  // Shadows (both): #444 60.4724px -60.4724px 0 30.2362px, then #fff 30.2362px -30.2362px 0 60px.
  // The two frames are 0 × 0 boxes at (200, 150) with the same shadows (32q = 30.2362px), spreads grown from 0.
  const FIN = 27;
  const fh = $('.t0619-fh'), fb = $('.t0619-fb');
  const Q = 30.2362;
  const sh = (d, w, gd, gw) => `${d} ${2 * Q}px ${-2 * Q}px 0 ${Q * gd}px, ${w} ${Q}px ${-Q}px 0 ${60 * gw}px`;
  const lines = $$('.t0619-ln'), pt = $('.t0619-pt');
  const labs = $$('.zlab');
  return (t, step) => {
    const wide = fig.dataset.view === 'wide';
    const teach = fig.dataset.teach === '1';
    const tw = teach ? 1 - pr(t, [FIN, FIN + 0.8]) : 0;
    const gw = pr(t, [5.3, 6.3]), gd = pr(t, [7, 8]);
    const r = 45 * pr(t, [10.4, 11.8]);
    const s = 1 - 2 * pr(t, [14.4, 16]);
    fh.style.transform = `rotate(${r}deg) scale(${s})`;
    const bo = pr(t, [18.6, 19.4]);
    fb.style.opacity = bo;
    const s2 = 1 - 2 * pr(t, [22.4, 24]);
    fb.style.transform = `rotate(${r}deg) scale(${s * s2})`;
    fh.style.boxShadow = sh(mix(tw, 'var(--t0619-hd)', '#444'), mix(tw, 'var(--t0619-hw)', '#fff'), gd, gw);
    fb.style.boxShadow = sh(mix(tw, 'var(--t0619-bd)', '#444'), mix(tw, 'var(--t0619-bw)', '#fff'), gd, gw);
    lines.forEach((l) => { l.style.opacity = win(t, 0.3, 5); });
    pt.style.opacity = Math.min(pr(t, [0.3, 1]), 1 - pr(t, [FIN, FIN + 0.6]));
    labs.forEach((l) => {
      const n = +l.dataset.l, second = l.classList.contains('t0619-l2');
      l.style.left = wide ? 'calc(-50px + 4px * var(--k, 1))' : 'calc(4px * var(--k, 1))';
      l.style.top = `calc(${wide ? -40 : 0}px + ${second ? 20 : 4}px * var(--k, 1))`;
      const ivs = [[0.3, 5], [5.3, 10], [10.3, 14], [14.3, 18], [18.3, 22], [22.3, FIN]];
      l.style.opacity = win(t, ...ivs[n - 1]);
    });
    let txt;
    if (step === 0) txt = `html${c} 0 × 0 ${fr ? 'en' : 'at'} (200, 150)`;
    else if (step === 1) txt = fr ? 'blanc : 120 × 120 · #444 : 60,47 × 60,47' : 'white: 120 × 120 · #444: 60.47 × 60.47';
    else if (step === 2) txt = `html${c} 45°`;
    else if (step === 3) txt = `html${c} 45° + 180° = 225°`;
    else if (step === 4) txt = `body${c} 0 × 0 ${fr ? 'en' : 'at'} (200, 150)`;
    else if (step === 5) txt = `body${c} 225° + 180° = 45°`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
