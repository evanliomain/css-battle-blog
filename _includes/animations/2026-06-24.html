<div class="cap" data-t="0" data-step="Fond"><h3>1. Une règle, deux boîtes</h3><p><code>*</code> vise html, head, style et body. head et style sont masqués : la même règle dessine donc sur deux boîtes, html et body. Le fond de l'élément racine est peint sur tout le canevas : tout est #394257.</p></div>
<div class="cap" data-t="4.5" data-step="margin"><h3>2. margin: 70 80</h3><p>Sans unité, 70 et 80 sont lus en px : les pages de CSS Battle sont en mode quirks. Dans ce mode, html remplit la hauteur de la page, moins ses marges : 300 − 140 = 160px de haut, 400 − 160 = 240px de large. body remplit html de la même façon : 80 × 20, de (160, 140) à (240, 160).</p></div>
<div class="cap" data-t="10.5" data-step="outline html"><h3>3. Le cadre de html</h3><p><code>outline:32q solid#FAE29E</code> trace un trait jaune autour de la boîte, sans prendre de place. 32q font 30,24px, et Chrome en fait 30px. Autour de html, le cadre va de (50, 40) à (350, 260).</p></div>
<div class="cap" data-t="15" data-step="outline body"><h3>4. Le cadre de body</h3><p>body a le même outline : un cadre de (130, 110) à (270, 190). Son intérieur, la boîte de body, reste sombre : c'est la petite barre du milieu, 80 × 20.</p></div>
<div class="cap" data-t="20" data-step="outset"><h3>5. La zone de l'image</h3><p>Il n'y a pas de bordure, mais <code>border-image</code> dessine quand même, dans une zone qui part de la boîte. <code>/74q 64q</code> est l'outset : il pousse cette zone de 69,92px en haut et en bas, et de 60,47px à gauche et à droite. Pour html, elle couvre presque tout le canevas : 360,94 × 299,84.</p></div>
<div class="cap" data-t="25" data-step="Coins de html"><h3>6. Rien que les coins</h3><p><code>conic-gradient(#FAE29E)</code> n'a qu'une couleur : c'est une image jaune unie, de la taille de la zone. La découpe <code>200</code> prend 200px depuis chaque bord. 200 + 200 dépasse la largeur comme la hauteur : les morceaux se chevauchent, et les bords restent vides. Sans <code>fill</code>, le milieu non plus n'est pas peint. Seuls les quatre coins restent, dessinés en 30,24 × 40 (<code>5ch 32q</code>), soit 30 × 40 à l'écran, aux coins du canevas.</p></div>
<div class="cap" data-t="31" data-step="Coins de body"><h3>7. Les coins de body</h3><p>body reçoit le même border-image. Sa zone fait 200,94 × 159,84, de (99,53, 70,08) à (300,47, 229,92). Ses quatre coins tombent dans la boîte de html : des encoches en x = 100 et 270, y = 70 et 190. Elles pendent du cadre de html, à 20px de ses côtés.</p></div>
<div class="cap" data-t="36.5" data-step="Résultat" data-live="121 caractères · 100 % identique"><h3>8. Résultat : 121 caractères</h3><p>Deux cadres et huit coins, tous jaunes, sans chevauchement : 27 600 + 9 600 + 4 800 + 4 800 = 46 800 pixels jaunes. Une seule règle les dessine tous, une fois sur html et une fois sur body.</p></div>

<div class="cap" data-t="4.5" data-step="margin"><h3>2. margin: 70 80</h3><p>With no unit, 70 and 80 are read as px: CSS Battle pages run in quirks mode. In that mode, html fills the height of the page, minus its margins: 300 − 140 = 160px tall, 400 − 160 = 240px wide. body fills html the same way: 80 × 20, from (160, 140) to (240, 160).</p></div>

<div class="cap" data-t="20" data-step="outset"><h3>5. The image area</h3><p>There is no border, but <code>border-image</code> still draws, in an area that starts from the box. <code>/74q 64q</code> is the outset: it pushes that area out by 69.92px at the top and bottom, and by 60.47px on the left and right. For html, it covers almost the whole canvas: 360.94 × 299.84.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0624 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? ' :' : ':';
  const num = (v, d = 0) => (fr ? v.toFixed(d).replace('.', ',') : v.toFixed(d));
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  const lerp = (k, a, b) => a.map((v, i) => v + (b[i] - v) * k);
  const put = (e, [x, y, w, h]) => { e.style.left = `${x}px`; e.style.top = `${y}px`; e.style.width = `${w}px`; e.style.height = `${h}px`; };
  // Measured on the official code in local Chrome (400 × 300 iframe, getBoundingClientRect, getComputedStyle):
  // html box 80..320 × 70..230, body box 160..240 × 140..160; outline 32q computed as 30px;
  // border-image-width 40px 30.2362px, border-image-outset 69.9213px 60.4724px.
  // Each part alone: html outline 27,600 yellow px (50..350 × 40..260), body outline 9,600 (130..270 × 110..190),
  // html corners 4 × 30 × 40 at x 20, 350 / y 0, 260, body corners 4 × 30 × 40 at x 100, 270 / y 70, 190.
  const FIN = 36.5;
  const HB = [80, 70, 240, 160], BB = [160, 140, 80, 20];
  const HA = [80 - 60.47, 70 - 69.92, 240 + 120.94, 160 + 139.84], BA = [160 - 60.47, 140 - 69.92, 80 + 120.94, 20 + 139.84];
  const tabs = (x1, x2, y1, y2) => [[x1, y1, 30, 40], [x2, y1, 30, 40], [x1, y2, 30, 40], [x2, y2, 30, 40]];
  const HT = tabs(20, 350, 0, 260), BT = tabs(100, 270, 70, 190);
  // body's top and bottom tabs touch the inside of html's frame (y = 70 and 230): 1px more under the frame, so no seam.
  BT[0] = [100, 69, 30, 41]; BT[1] = [270, 69, 30, 41]; BT[2] = [100, 190, 30, 41]; BT[3] = [270, 190, 30, 41];
  const slices = ([x, y, w, h]) => { const sw = Math.min(200, w), sh = Math.min(200, h); return [[x, y, sw, sh], [x + w - sw, y, sw, sh], [x, y + h - sh, sw, sh], [x + w - sw, y + h - sh, sw, sh]]; };
  const el = Object.fromEntries(['ho', 'bo', 'hb', 'bb', 'ha', 'ba'].map((k) => [k, $(`[data-e="${k}"]`)]));
  const hc = $$('[data-e="hc"]'), bc = $$('[data-e="bc"]');
  const labs = $$('.zlab');
  return (t, step) => {
    const wide = fig.dataset.view === 'wide';
    const teach = fig.dataset.teach === '1';
    const tw = teach ? 1 - pr(t, [FIN, FIN + 0.8]) : 0;
    const Y = 'var(--t0624-y)';
    const col = (v) => mix(tw, `var(--t0624-${v})`, Y);
    // 2. margins
    const kH = pr(t, [5, 7]), kB = pr(t, [7.6, 9.6]);
    const hbox = lerp(kH, [0, 0, 400, 300], HB);
    const bbox = lerp(kB, hbox, BB);
    // 3-4. outlines
    const wH = 30 * pr(t, [11.2, 13.4]), wB = 30 * pr(t, [15.7, 17.9]);
    put(el.ho, [80 - wH, 70 - wH, 240 + 2 * wH, 160 + 2 * wH]);
    el.ho.style.borderWidth = `${wH}px`; el.ho.style.borderColor = col('ho');
    put(el.bo, [160 - wB, 140 - wB, 80 + 2 * wB, 20 + 2 * wB]);
    el.bo.style.borderWidth = `${wB}px`; el.bo.style.borderColor = col('bo');
    // Dashed boxes and image areas: light on the dark canvas, or the teaching color.
    const dash = (e, r, v, o) => {
      put(e, r);
      const oc = teach ? `var(--t0624-${v})` : 'var(--t0624-d)';
      e.style.outline = o > 0 ? `calc(1.5px * var(--k, 1)) dashed color-mix(in srgb, ${oc} ${(o * 100).toFixed(0)}%, transparent)` : 'none';
      e.style.outlineOffset = 'calc(-0.75px * var(--k, 1))';
    };
    dash(el.hb, hbox, 'ho', Math.min(pr(t, [4.6, 5.1]), 1 - pr(t, [FIN - 0.4, FIN])));
    dash(el.bb, bbox, 'bo', Math.min(pr(t, [7.2, 7.7]), 1 - pr(t, [FIN - 0.4, FIN])));
    // 5. outset: html's area grows from its box. 7. body's area.
    const kHA = pr(t, [21, 23.2]), kBA = pr(t, [31.6, 33.2]);
    const ha = lerp(kHA, HB, HA), ba = lerp(kBA, BB, BA);
    dash(el.ha, ha, 'hc', win(t, 20.4, 31));
    dash(el.ba, ba, 'bc', win(t, 31.2, FIN));
    // 6-7. The image cut in four overlapping slices, then each slice drawn into a 30 × 40 corner.
    const corners = (list, area, T, a, s0) => {
      const fade = pr(t, [a, a + 0.8]), shrink = pr(t, [s0, s0 + 2]);
      const S = slices(area);
      list.forEach((e, i) => {
        put(e, lerp(shrink, S[i], T[i]));
        e.style.background = list === hc ? col('hc') : col('bc');
        e.style.opacity = fade * (0.32 + 0.68 * shrink);
      });
    };
    corners(hc, HA, HT, 25.6, 28.2);
    corners(bc, BA, BT, 33.4, 34.2);
    labs.forEach((l) => {
      const n = +l.dataset.l, second = l.classList.contains('t0624-l2');
      l.style.left = wide ? '-46px' : '54px';
      // Wide view: above the canvas. Canvas view: the dark bands at the top and bottom, between the html corners.
      l.style.top = wide ? `calc(-56px + ${second ? 16 : 0}px * var(--k, 1))` : second ? 'calc(298px - 16px * var(--k, 1))' : '2px';
      const ivs = [[0.3, 4.5], [4.8, 10.5], [10.8, 15], [15.3, 20], [20.3, 25], [25.3, 31], [31.3, FIN]];
      l.style.opacity = win(t, ...ivs[n - 1]);
    });
    let txt;
    if (step === 0) txt = `html, body${c} #394257`;
    else if (step === 1) txt = `html${c} ${Math.round(hbox[2])} × ${Math.round(hbox[3])} · body${c} ${Math.round(bbox[2])} × ${Math.round(bbox[3])}`;
    else if (step === 2) txt = `outline html${c} ${Math.round(wH)}px`;
    else if (step === 3) txt = `outline body${c} ${Math.round(wB)}px`;
    else if (step === 4) txt = `outset${c} ${num(ha[1] < 70 ? 70 - ha[1] : 0, 2)}px ${num(80 - ha[0], 2)}px`;
    else if (step === 5 || step === 6) {
      const s0 = step === 5 ? 28.2 : 34.2, k = pr(t, [s0, s0 + 2]);
      txt = k <= 0 ? (fr ? 'découpe 200 → 4 coins' : 'slice 200 → 4 corners') : `${fr ? 'coins' : 'corners'}${c} ${Math.round((step === 5 ? 200 : 200) + (30 - 200) * k)} × ${Math.round((step === 5 ? 200 : 159.84) + (40 - (step === 5 ? 200 : 159.84)) * k)}`;
    } else txt = $$('.caps .cap')[7].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
