<figure class="anim t0924" data-duration="24" data-scene="t0924" data-wide="-40 -30 480 360" data-off-label="-36 -26" style="--bg:#fade8b">
<style>
.t0924{--t0924-navy:#3a4b86;--t0924-h:#e0663a;--t0924-b:#3a7fe0;--t0924-dash:rgb(60 50 20 / .75)}
.t0924 .t0924-g{position:absolute;left:200px;top:150px;width:0;height:0}
.t0924 .t0924-g > i{position:absolute;display:block}
.t0924 .t0924-o{position:absolute;box-sizing:border-box;border:1.5px dashed var(--t0924-dash);pointer-events:none}
.t0924 .t0924-pt{position:absolute;left:200px;top:150px;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--t0924-dash)}
.t0924 .zlab{color:#fff;background:rgb(30 35 60 / .88);padding:1px 5px;border-radius:3px}
</style>
<div class="anim-col">
<div class="stage" role="img" aria-label="{% if include.lang == "fr" %}Animation : html et body, réduits à un point au centre par leurs marges, portent chacun quatre ombres carrées ; scale:-1 fait faire un demi-tour aux ombres de html ; le body, retourné deux fois, garde les siennes à l'endroit ; ensemble elles forment une croix et deux carrés opposés{% else %}Animation: html and body, shrunk to a point in the centre by their margins, each carry four square shadows; scale:-1 turns html's shadows half a turn; the body, flipped twice, keeps its own the right way round; together they make a cross and two opposite squares{% endif %}">
<div class="scene">
<div class="t0924-g" data-g="h"><i data-r="c"></i><i data-r="r"></i><i data-r="b"></i><i data-r="s"></i></div>
<div class="t0924-g" data-g="b"><i data-r="c"></i><i data-r="r"></i><i data-r="b"></i><i data-r="s"></i></div>
<div class="t0924-o"></div>
<div class="t0924-pt"></div>
<span class="zlab t0924-l-m" style="left:12px;top:12px">37.5% × 400 = 150 · 50% × 400 = 200</span>
<span class="zlab t0924-l-c" style="left:12px;top:12px">5ch = 5 × 8 = 40 → 80 × 80</span>
<span class="zlab t0924-l-o" style="left:12px;top:12px">5pc = 80 · 5lh = 90 · 32Q = {% if include.lang == "fr" %}30,24{% else %}30.24{% endif %}</span>
<span class="zlab t0924-l-h" style="left:12px;top:12px">html · scale:-1</span>
<span class="zlab t0924-l-b" style="left:12px;top:12px">body · scale:-1 × scale:-1 = 1</span>
</div>
</div>
<div class="legend"><span><i style="--c:var(--t0924-h)"></i>{% if include.lang == "fr" %}ombres de html{% else %}html's shadows{% endif %}</span><span><i style="--c:var(--t0924-b)"></i>{% if include.lang == "fr" %}ombres du body (bleu nuit en vrai){% else %}body's shadows (navy in reality){% endif %}</span></div>
</div>
<div class="anim-side">
<pre class="code" aria-hidden="true">&lt;style>*{<span data-on="4 5" data-tone="2">scale:-1</span>;background:#fade8b;<span data-on="1">margin:37.5%50%</span>;color:3A4B86;box-shadow:<span data-on="2" data-tone="2">0 0 0 5ch</span>,<span data-on="3" data-tone="2">5pc 0 0 5ch,0 5pc 0 5ch,-5lh 5lh 0 32Q</span></pre>
<div class="now" aria-live="polite">
<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="Deux boîtes réduites à un point"><h3>1. Deux boîtes réduites à un point</h3><p><code>*</code> vise <code>html</code> et le <code>body</code>. Une marge en % se calcule sur la largeur : <code>37.5%50%</code> donne 150 en haut et en bas, 200 sur les côtés. <code>html</code> fait 400 − 400 = 0 de large et, en mode quirks, 300 − 300 = 0 de haut : un point en (200 ; 150). Dans une boîte de 0 de large, les marges du <code>body</code> font 0 : il est au même point.</p></div>
<div class="cap" data-t="4" data-step="Une ombre : le carré du centre"><h3>2. Une ombre : le carré du centre</h3><p>Une ombre sans décalage, étalée de <code>5ch</code> : 5 × 8 = 40px tout autour d'un point. C'est un carré de 80 × 80, de (160 ; 110) à (240 ; 190). Elle prend la couleur du texte, <code>3A4B86</code>, un hex sans <code>#</code> que le mode quirks accepte.</p></div>
<div class="cap" data-t="8" data-step="Trois ombres de plus"><h3>3. Trois ombres de plus</h3><p><code>5pc 0 0 5ch</code> décale le même carré de 80px à droite : un bras. <code>0 5pc 0 5ch</code> le décale de 80px vers le bas : un autre bras. <code>-5lh 5lh 0 32Q</code> fait un carré de 60,48 (étalement de 30,24), décalé de 90px à gauche et vers le bas (1lh = 18px) : le petit carré en bas à gauche.</p></div>
<div class="cap" data-t="12" data-step="scale:-1 sur html : un demi-tour"><h3>4. <code>scale:-1</code> sur html : un demi-tour</h3><p><code>scale:-1</code> retourne <code>html</code> sur les deux axes autour de son centre, le point (200 ; 150) : c'est un demi-tour. Ses ombres passent de l'autre côté : le bras de gauche, le bras du haut, et le petit carré en haut à droite.</p></div>
<div class="cap" data-t="16" data-step="Le body, retourné deux fois"><h3>5. Le body, retourné deux fois</h3><p>Le <code>body</code> a les mêmes ombres et aussi <code>scale:-1</code>, mais il est dans <code>html</code>, déjà retourné. Deux demi-tours autour du même point s'annulent : ses ombres restent à l'endroit, à droite, en bas et en bas à gauche. Les deux jeux forment la croix et les deux carrés opposés.</p></div>
<div class="cap" data-t="20" data-step="Résultat" data-live="125 caractères · 100 % identique"><h3>6. Résultat : 125 caractères</h3><p>Quatre ombres écrites une fois, dessinées deux fois, à l'endroit et retournées.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="Two boxes shrunk to a point"><h3>1. Two boxes shrunk to a point</h3><p><code>*</code> matches <code>html</code> and the <code>body</code>. A margin in % uses the width: <code>37.5%50%</code> gives 150 at the top and bottom, 200 on the sides. <code>html</code> is 400 − 400 = 0 wide and, in quirks mode, 300 − 300 = 0 tall: a point at (200, 150). Inside a 0 wide box, the <code>body</code>'s margins are 0: it sits on the same point.</p></div>
<div class="cap" data-t="4" data-step="One shadow: the centre square"><h3>2. One shadow: the centre square</h3><p>A shadow with no offset, spread by <code>5ch</code>: 5 × 8 = 40px all around a point. That is an 80 × 80 square, from (160, 110) to (240, 190). It uses the text color, <code>3A4B86</code>, a hex with no <code>#</code> that quirks mode accepts.</p></div>
<div class="cap" data-t="8" data-step="Three more shadows"><h3>3. Three more shadows</h3><p><code>5pc 0 0 5ch</code> moves the same square 80px right: an arm. <code>0 5pc 0 5ch</code> moves it 80px down: another arm. <code>-5lh 5lh 0 32Q</code> makes a 60.48 square (spread 30.24), moved 90px left and down (1lh = 18px): the small square at the bottom left.</p></div>
<div class="cap" data-t="12" data-step="scale:-1 on html: a half turn"><h3>4. <code>scale:-1</code> on html: a half turn</h3><p><code>scale:-1</code> flips <code>html</code> on both axes around its centre, the point (200, 150): that is a half turn. Its shadows move to the other side: the left arm, the top arm, and the small square at the top right.</p></div>
<div class="cap" data-t="16" data-step="The body, flipped twice"><h3>5. The body, flipped twice</h3><p>The <code>body</code> has the same shadows and <code>scale:-1</code> too, but it is inside <code>html</code>, which is already flipped. Two half turns around the same point cancel out: its shadows stay the right way round, right, bottom and bottom left. Both sets make the cross and the two opposite squares.</p></div>
<div class="cap" data-t="20" data-step="Result" data-live="125 characters · 100% match"><h3>6. Result: 125 characters</h3><p>Four shadows written once, drawn twice: the right way round and flipped.</p></div>
{%- endif %}
</div>
<div class="live"></div>
</div>
</div>
<script>
(window.AnimScenes = window.AnimScenes || {}).t0924 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const gH = $('[data-g="h"]'), gB = $('[data-g="b"]'), O = $('.t0924-o'), PT = $('.t0924-pt'), live = $('.live');
  const L = (k) => $(`.t0924-l-${k}`);
  const W = { m: [0.3, 1.8], c: [4.2, 5.6], o: [8.2, 10], h: [12.2, 14.2], b: [16.2, 18.2], fin: [20.1, 20.9] };
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const lerp = (a, b, m) => a + (b - a) * m;
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const f1 = (v) => { const s = (Math.round(v * 100) / 100).toFixed(2).replace(/\.?0+$/, ''); return (fr ? s.replace('.', ',') : s).replace('-', '−'); };
  const c = fr ? ' :' : ':';
  // each shadow: offset (dx, dy) and half size, relative to the point (200, 150)
  const R = { c: [0, 0, 40], r: [80, 0, 40], b: [0, 80, 40], s: [-90, 90, 30.24] };
  const draw = (g, sz, off, col) => g.querySelectorAll('i').forEach((el) => {
    const [dx, dy, h] = R[el.dataset.r];
    const m = el.dataset.r === 'c' ? 0 : off, k = el.dataset.r === 'c' ? sz : (off > 0 ? 1 : 0);
    Object.assign(el.style, { left: `${dx * m - h * k}px`, top: `${dy * m - h * k}px`, width: `${2 * h * k}px`, height: `${2 * h * k}px`, background: col });
  });
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const real = !teach || t >= W.fin[0];
    const guides = t < W.fin[0] ? 1 : 0;
    const m = pr(t, W.m), cs = pr(t, W.c), o = pr(t, W.o), h = pr(t, W.h), b = pr(t, W.b);
    Object.assign(O.style, { left: `${lerp(0, 200, m)}px`, top: `${lerp(0, 150, m)}px`, width: `${lerp(400, 0, m)}px`, height: `${lerp(300, 0, m)}px` });
    O.style.opacity = (step === 0 ? 1 : 0) * guides;
    PT.style.opacity = m * (step <= 4 ? 1 : 0) * guides;
    // html's shadows: drawn, then turned half a turn
    draw(gH, cs, o, real ? 'var(--t0924-navy)' : 'var(--t0924-h)');
    gH.style.rotate = `${180 * h}deg`;
    // body's shadows: inside the turned html, then turned back by its own scale:-1
    draw(gB, b > 0 ? 1 : 0, b > 0 ? 1 : 0, real ? 'var(--t0924-navy)' : 'var(--t0924-b)');
    gB.style.rotate = `${180 - 180 * b}deg`;
    gB.style.opacity = b > 0 ? 1 : 0;
    L('m').style.opacity = win(t, W.m[0], W.c[0] - 0.2);
    L('c').style.opacity = win(t, W.c[0], W.o[0] - 0.2);
    L('o').style.opacity = win(t, W.o[0], W.h[0] - 0.2);
    L('h').style.opacity = win(t, W.h[0], W.b[0] - 0.2);
    L('b').style.opacity = win(t, W.b[0], W.fin[0]);
    let txt = '';
    if (step === 0) txt = `html${c} ${f1(lerp(400, 0, m))} × ${f1(lerp(300, 0, m))}`;
    else if (step === 1) txt = `${fr ? 'carré' : 'square'}${c} ${f1(80 * cs)} × ${f1(80 * cs)}`;
    else if (step === 2) txt = `${fr ? 'petit carré' : 'small square'}${c} x ${f1(110 - 30.24)} → ${f1(110 + 30.24)}`;
    else if (step === 3) txt = `html${c} ${f1(180 * h)}°`;
    else if (step === 4) txt = `body${c} 180° − ${f1(180 * b)}°`;
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
</figure>
