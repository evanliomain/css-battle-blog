{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="Qui reçoit quoi"><h3>1. Deux boîtes</h3><p>Chrome ajoute html, head et body ; style va dans head. <code>*</code> vise les quatre, et le <code>*{</code> imbriqué, qui veut dire <code>* *</code>, vise head, style et body. head et style ne s'affichent pas. html garde <code>margin:10 130</code>, body reçoit <code>margin:0 0 140</code>. Pas de doctype : en mode quirks, un nombre sans unité est en px, et html et body s'étirent en hauteur. html fait 400 − 260 = 140 sur 300 − 20 = 280, en (130 ; 10). body remplit html moins sa marge du bas : 140 × 140.</p></div>
<div class="cap" data-t="5" data-step="Le fond"><h3>2. Le fond</h3><p><code>background:#0E127D</code> va à html et à body. Le fond de html peint tout le canevas. Celui de body reste donc dans la boîte de body : il revient à l'étape 4.</p></div>
<div class="cap" data-t="10" data-step="border-image de html"><h3>3. Le border-image de html</h3><p><code>conic-gradient(#EDDF5A)</code> n'a qu'une couleur : c'est une image jaune unie, de la taille de html. Largeurs : 60 % de 280 = 168 en haut et en bas, 9 % de 140 = 12,6 sur les côtés. 168 + 168 dépasse 280 : Chrome réduit les quatre aux 5/6, soit 140 et 10,5. Il peint 10. Le haut et le bas prennent toute la hauteur : il n'y a plus de place pour les côtés. Les quatre coins font deux barres. Le bord du haut et celui du bas reçoivent une tuile de 140 − 2 × 34 = 72px ; <code>space</code> en met une seule, au milieu : de x = 34 à 106.</p></div>
<div class="cap" data-t="16" data-step="border-image de body"><h3>4. Le même sur body</h3><p>body reçoit la même règle sur son carré de 140. 60 % de 140 = 84, et 84 + 84 dépasse 140 : réduit aux 5/6, ça fait 70 en haut et en bas, et 10,5 sur les côtés. La tuile fait encore 72px, de 34 à 106. Le fond bleu marine de body cache la moitié haute des bandes de html, puis ses propres bandes retombent juste au même endroit : rien ne change encore.</p></div>
<div class="cap" data-t="21" data-step="rotate de html"><h3>5. html tourne</h3><p><code>rotate:90deg</code> fait tourner html autour de son centre, (200 ; 150). 140 × 280 devient 280 × 140 : de x = 60 à 340 et de y = 80 à 220. Ses trois bandes deviennent horizontales : de y = 80 à 90, de 114 à 186 et de 210 à 220. body tourne avec lui : son carré est maintenant à droite, de x = 200 à 340.</p></div>
<div class="cap" data-t="26.5" data-step="rotate de body"><h3>6. body tourne encore</h3><p>body a lui aussi <code>rotate:90deg</code>, autour de son propre centre : 180deg en tout. Dans le navigateur, les deux rotations se font en même temps ; ici, je les sépare. Les bandes de body deviennent verticales : de x = 200 à 210, de 234 à 306 et de 330 à 340. Son fond cache les bandes de html à partir de x = 200, et sa barre de gauche les relie : un E à l'envers.</p></div>
<div class="cap" data-t="32" data-step="Résultat" data-live="124 caractères · 100 % identique"><h3>7. Résultat : 124 caractères</h3><p>Une seule règle pour deux boîtes : une image jaune unie découpée par <code>border-image</code>, et un <code>rotate</code> qui compte deux fois pour body.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="Who gets what"><h3>1. Two boxes</h3><p>Chrome adds html, head and body; style goes in head. <code>*</code> matches all four, and the nested <code>*{</code>, which means <code>* *</code>, matches head, style and body. head and style are not displayed. html keeps <code>margin:10 130</code>, body gets <code>margin:0 0 140</code>. There is no doctype: in quirks mode, a number with no unit is in px, and html and body stretch to fill the height. html is 400 − 260 = 140 wide and 300 − 20 = 280 tall, at (130, 10). body fills html minus its bottom margin: 140 × 140.</p></div>
<div class="cap" data-t="5" data-step="The background"><h3>2. The background</h3><p><code>background:#0E127D</code> goes to html and to body. html's background paints the whole canvas. So body's background stays in body's own box: it comes back in step 4.</p></div>
<div class="cap" data-t="10" data-step="html's border-image"><h3>3. html's border-image</h3><p><code>conic-gradient(#EDDF5A)</code> has a single color: it is a plain yellow image, the size of html. Widths: 60% of 280 = 168 on top and bottom, 9% of 140 = 12.6 on the sides. 168 + 168 is more than 280, so Chrome scales all four to 5/6: 140 and 10.5. It paints 10. Top and bottom take the whole height: there is no room left for the sides. The four corners make two bars. The top and bottom edges get a tile of 140 − 2 × 34 = 72px; <code>space</code> puts a single one, in the middle: from x = 34 to 106.</p></div>
<div class="cap" data-t="16" data-step="body's border-image"><h3>4. The same on body</h3><p>body gets the same rule on its 140 square. 60% of 140 = 84, and 84 + 84 is more than 140: scaled to 5/6, that is 70 on top and bottom, and 10.5 on the sides. The tile is 72px again, from 34 to 106. body's navy background hides the top half of html's bands, then its own bands land exactly on the same spots: nothing changes yet.</p></div>
<div class="cap" data-t="21" data-step="html's rotate"><h3>5. html turns</h3><p><code>rotate:90deg</code> turns html around its center, (200, 150). 140 × 280 becomes 280 × 140: from x = 60 to 340 and from y = 80 to 220. Its three bands turn horizontal: y = 80 to 90, 114 to 186 and 210 to 220. body turns with it: its square is now on the right, from x = 200 to 340.</p></div>
<div class="cap" data-t="26.5" data-step="body's rotate"><h3>6. body turns again</h3><p>body has <code>rotate:90deg</code> too, around its own center: 180deg in all. In the browser, both rotations happen at once; here I split them. body's bands turn vertical: x = 200 to 210, 234 to 306 and 330 to 340. Its background hides html's bands from x = 200 on, and its left bar joins them: a backward E.</p></div>
<div class="cap" data-t="32" data-step="Result" data-live="124 characters · 100% match"><h3>7. Result: 124 characters</h3><p>One rule for two boxes: a plain yellow image cut by <code>border-image</code>, and one <code>rotate</code> that counts twice for body.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0806 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const nf = (v, d) => { const s = String(+v.toFixed(d)); return fr ? s.replace('.', ',') : s; };
  const c = fr ? '\u00a0:' : ':';
  // Measured on the official code in local Chrome (quirks mode, 400 × 300):
  // html offset (130, 10), 140 × 280, rotate 90deg, getBoundingClientRect (60, 80, 280, 140);
  // body offset (0, 0) in html, 140 × 140, getBoundingClientRect (200, 80, 140, 140).
  // Painted: yellow rows y = 80-90, 114-186, 210-220 from x = 60 to 200 (html), columns x = 200-210, 234-306, 330-340 (body).
  // Band widths are 10.5px by the formula; Chrome paints 10px (also at a 2× device scale).
  const FIN = 32;
  const BL = $('.t0806-blank'), H = $('.t0806-h'), B = $('.t0806-b'), BG = $('.t0806-bg');
  const HB = $$('.t0806-hb'), BD = $$('.t0806-bd');
  const X = (k) => $$(`.t0806-box[data-x="${k}"]`);
  const G = (k) => $(`.t0806-tag[data-g="${k}"]`);
  const L = (k) => $$(`.t0806-l[data-l="${k}"]`);
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    const ann = 1 - pr(t, [FIN, FIN + 0.6]);
    // 1. the boxes
    const w1 = win(t, 0.2, 4.8);
    G('h').style.opacity = w1;
    G('b').style.opacity = w1;
    X('h').forEach((e) => (e.style.opacity = Math.max(w1, win(t, 10.2, 15.8), win(t, 21.2, 26.3)) * 0.9));
    X('b').forEach((e) => (e.style.opacity = Math.max(w1, win(t, 16.2, 20.8), win(t, 26.7, 31.8)) * 0.9));
    // 2. the canvas turns navy
    BL.style.opacity = 1 - pr(t, [5.4, 6.6]);
    // 3. html's border-image
    X('hr').forEach((e) => (e.style.opacity = win(t, 10.4, 15.8) * 0.9));
    const hc = pr(t, [10.8, 11.8]), ht = pr(t, [12.4, 13.4]);
    HB.forEach((e) => {
      const tile = e.dataset.k === 't';
      e.style.opacity = tile ? ht : hc;
      e.style.background = teach ? (tile ? 'var(--t0806-ht)' : 'var(--t0806-hc)') : 'var(--t0806-ye)';
    });
    // 4. body: its background, then its border-image
    X('br').forEach((e) => (e.style.opacity = win(t, 16.4, 20.8) * 0.9));
    const kg = pr(t, [16.4, 17.2]), bc = pr(t, [17.8, 18.8]), bt = pr(t, [19, 20]);
    BD.forEach((e) => {
      const tile = e.dataset.k === 't';
      e.style.opacity = tile ? bt : bc;
      e.style.background = teach ? (tile ? 'var(--t0806-bt)' : 'var(--t0806-bc)') : 'var(--t0806-ye)';
    });
    // 5-6. one rotate:90deg for html, and the same again for body, around its own center
    const ah = 90 * pr(t, [21.8, 24.2]), ab = 90 * pr(t, [27.2, 29.6]);
    H.style.transform = `rotate(${ah}deg)`;
    B.style.transform = `rotate(${ab}deg)`;
    // real colors, once turned: the navy box goes 1px past html's edges (canvas color there) and stops 2px
    // under body's left bar, so no seam shows where html's bands meet that bar
    const snug = !teach && ab === 90;
    Object.assign(BG.style, snug
      ? { left: '-1px', top: '-1px', width: '139px', height: '142px' }
      : { left: '0', top: '0', width: '140px', height: '140px' });
    BG.style.opacity = kg;
    BG.style.background = teach ? 'var(--t0806-bb)' : 'var(--t0806-nv)';
    [[0.4, 4.8, 1], [5.6, 9.8, 2], [10.6, 15.8, 3], [16.6, 20.8, 4], [21.6, 26.3, 5], [27, 31.8, 6]].forEach(([a, z, k]) => L(k).forEach((e) => (e.style.opacity = win(t, a, z) * ann)));
    let txt = '';
    if (step === 0) txt = `html${c} 140 × 280 · body${c} 140 × 140`;
    else if (step === 1) txt = fr ? 'canevas\u00a0: #0E127D' : 'canvas: #0E127D';
    else if (step === 2) txt = fr ? 'html\u00a0: bandes de 10, 72, 10' : 'html: bands of 10, 72, 10';
    else if (step === 3) txt = fr ? 'body\u00a0: bandes de 10, 72, 10' : 'body: bands of 10, 72, 10';
    else if (step === 4) txt = `html${c} rotate ${nf(ah, 1)}deg`;
    else if (step === 5) txt = `body${c} ${nf(90 + ab, 1)}deg`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
