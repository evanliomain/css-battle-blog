<div class="cap" data-t="0" data-step="html : une ligne"><h3>1. html : une ligne de 258px</h3><p><code>*</code> vise tous les éléments. Sur <code>html</code>, <code>margin:150 71</code> laisse 400 − 2 × 71 = 258px de large. En mode quirks, <code>html</code> remplit la fenêtre moins ses marges : 300 − 2 × 150 = 0. C'est une ligne en y = 150. Son fond <code>#ec4c</code> part sur tout le canevas : un jaune à 80 % d'opacité, posé sur du blanc.</p></div>
<div class="cap" data-t="3" data-step="Ombre de html : la barre verte"><h3>2. L'ombre de html : une barre verte</h3><p><code>0 0 0 5vw</code> est une ombre sans décalage ni flou, étalée de 5vw = 20px, en <code>#4A9A86</code>. Autour d'une boîte de 258 × 0, elle fait une bande verte de 298 × 40 en (51, 130). L'ombre <code>inset 0 1in</code> se dessine à l'intérieur : <code>html</code> n'a pas de hauteur, elle ne montre rien.</p></div>
<div class="cap" data-t="6" data-step="body : le grand carré"><h3>3. body : le grand carré</h3><p><code>margin:-30 99</code> et <code>padding:15</code> : 258 − 2 × 99 = 60px de large. En mode quirks, le <code>body</code> remplit <code>html</code> moins ses marges : 0 − (−30 − 30) = 60px de haut. Le voilà en (170, 120), centré sur la ligne. Son ombre verte fait 100 × 100. <code>inset 0 1in</code> décale l'ombre intérieure de 96px vers le bas : elle couvre tout le carré de 60px, en crème, la couleur du texte.</p></div>
<div class="cap" data-t="10.5" data-step="Deux img vides, 30 × 30"><h3>4. Deux &lt;img> vides de 30 × 30</h3><p>Une <code>&lt;img></code> sans image ne mesure rien : avec <code>padding:15</code>, elle fait 30 × 30. Elles sont en ligne, en haut du contenu du <code>body</code> : y = 135. La première commence 115px après le bord du contenu (x = 185) : x = 300. Elle reçoit la même ombre verte, 70 × 70, et le même remplissage crème.</p></div>
<div class="cap" data-t="13.5" data-step="-375 : la 2e passe à gauche"><h3>5. Marge droite de −375 : la seconde passe à gauche</h3><p>Sans elle, la seconde <code>&lt;img></code> suivrait la première, hors du canevas en x = 445. La marge droite de −375px ramène le curseur de la ligne de 330 à −45. Avec ses 115px de marge gauche, la seconde se pose en x = 70 : pile le symétrique de la première autour de x = 200.</p></div>
<div class="cap" data-t="17" data-step="Les outlines, peintes en dernier"><h3>6. Les outlines, peintes en dernier</h3><p><code>11q</code> fait 10,4px, et Chrome arrondit l'épaisseur d'une outline au pixel inférieur : 10px. Elle prend la couleur du texte, crème. Les outlines se peignent après toutes les boîtes et les ombres de la page. Celle de <code>html</code> entoure une boîte de 0px de haut : c'est une barre pleine de 278 × 20. Elle passe sur les bords verts des carrés et les relie.</p></div>
<div class="cap" data-t="20" data-step="Résultat" data-live="168 caractères · 100 % identique"><h3>7. Résultat : 168 caractères</h3><p>Quatre éléments, une seule liste de règles. Le vert vient des ombres, le crème des ombres intérieures et des outlines. L'ordre de peinture fait les jointures.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html: a line"><h3>1. html: a 258px line</h3><p><code>*</code> matches every element. On <code>html</code>, <code>margin:150 71</code> leaves 400 − 2 × 71 = 258px of width. In quirks mode, <code>html</code> fills the window minus its margins: 300 − 2 × 150 = 0. It is a line at y = 150. Its <code>#ec4c</code> background goes to the whole canvas: a yellow at 80% opacity, over white.</p></div>
<div class="cap" data-t="3" data-step="html's shadow: the green bar"><h3>2. html's shadow: a green bar</h3><p><code>0 0 0 5vw</code> is a shadow with no offset and no blur, spread by 5vw = 20px, in <code>#4A9A86</code>. Around a 258 × 0 box, it makes a 298 × 40 green band at (51, 130). The <code>inset 0 1in</code> shadow is drawn inside: <code>html</code> has no height, so it shows nothing.</p></div>
<div class="cap" data-t="6" data-step="body: the big square"><h3>3. body: the big square</h3><p><code>margin:-30 99</code> and <code>padding:15</code>: 258 − 2 × 99 = 60px wide. In quirks mode, the <code>body</code> fills <code>html</code> minus its margins: 0 − (−30 − 30) = 60px tall. So it sits at (170, 120), centred on the line. Its green shadow is 100 × 100. <code>inset 0 1in</code> moves the inner shadow 96px down: it covers the whole 60px square, in cream, the text color.</p></div>
<div class="cap" data-t="10.5" data-step="Two empty imgs, 30 × 30"><h3>4. Two empty &lt;img>, 30 × 30</h3><p>An <code>&lt;img></code> with no image has no size: with <code>padding:15</code>, it is 30 × 30. They are inline, at the top of the <code>body</code>'s content: y = 135. The first one starts 115px after the content edge (x = 185): x = 300. It gets the same green shadow, 70 × 70, and the same cream fill.</p></div>
<div class="cap" data-t="13.5" data-step="-375: the 2nd goes left"><h3>5. A −375 right margin: the second one goes left</h3><p>Without it, the second <code>&lt;img></code> would follow the first, off the canvas at x = 445. The −375px right margin takes the line's pen back from 330 to −45. With its 115px left margin, the second one lands at x = 70: the exact mirror of the first around x = 200.</p></div>
<div class="cap" data-t="17" data-step="Outlines, painted last"><h3>6. Outlines, painted last</h3><p><code>11q</code> is 10.4px, and Chrome rounds an outline's width down to whole pixels: 10px. It takes the text color, cream. Outlines are painted after all the boxes and shadows of the page. The one around <code>html</code> wraps a box 0px tall: it is a solid 278 × 20 bar. It runs over the green edges of the squares and joins them.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t1105 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const GH = $('.t1105-gh'), GB = $('.t1105-gb'), FB = $('.t1105-fb'), GI1 = $('.t1105-gi1'), FI1 = $('.t1105-fi1'), GI2 = $('.t1105-gi2'), FI2 = $('.t1105-fi2');
  const RS = $$('.t1105-r'), RH = $('.t1105-rh'), RB = $('.t1105-rb'), RI = $$('.t1105-ri');
  const HL = $('.t1105-hl'), BB = $('.t1105-bb'), BI1 = $('.t1105-bi1'), BI2 = $('.t1105-bi2'), PEN = $('.t1105-pen'), live = $('.live');
  const LBG = $('.t1105-l-bg'), LH = $('.t1105-l-html'), LS = $('.t1105-l-sh'), LB = $('.t1105-l-body'), LI = $('.t1105-l-img'), LP = $('.t1105-l-pen'), LO = $('.t1105-l-out');
  const W = { line: [0.3, 1.5], sh: [3.2, 4.4], body: [6.3, 7.8], bfill: [8, 9.2], imgs: [10.8, 12], swap: [13.8, 15.6], out: [17.3, 18.6], fin: [20.2, 21] };
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const lerp = (a, b, m) => a + (b - a) * m;
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const n = (v) => String(Math.round(v)).replace('-', '−');
  const c = fr ? ' :' : ':';
  const place = (el, x, y, w, h) => Object.assign(el.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px` });
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const real = !teach || t >= W.fin[0];
    const fill = real ? 'var(--t1105-cream)' : 'var(--t1105-fill)';
    const ring = real ? 'var(--t1105-cream)' : 'var(--t1105-ring)';
    const guides = real ? 0 : 1;
    // 1. html line, 2. its green shadow
    HL.style.opacity = win(t, W.line[0], W.body[1]) * guides;
    LBG.style.opacity = win(t, 0.3, 2.8);
    LH.style.opacity = win(t, W.line[0], 5.8);
    GH.style.opacity = pr(t, W.sh);
    LS.style.opacity = win(t, W.sh[0], 5.8);
    // 3. body: from html's line (71, 150, 258 × 0) to (170, 120, 60 × 60), then its shadow and fill
    const b = pr(t, W.body), bf = pr(t, W.bfill);
    const bx = lerp(71, 170, b), by = lerp(150, 120, b), bw = lerp(258, 60, b), bh = lerp(0, 60, b);
    place(BB, bx, by, bw, bh);
    BB.style.opacity = t >= W.body[0] ? (real ? 1 - pr(t, [W.out[0], W.out[1]]) : 1) * (t < W.fin[0] ? 1 : 0) : 0;
    GB.style.opacity = bf;
    FB.style.opacity = bf;
    FB.style.background = fill;
    LB.style.opacity = win(t, W.body[0], 10.3);
    // 4. imgs, 5. the second one moves left
    const im = pr(t, W.imgs), sw = pr(t, W.swap);
    const x2 = lerp(445, 70, sw);
    place(GI2, x2 - 20, 115, 70, 70);
    place(FI2, x2, 135, 30, 30);
    BI2.style.left = `${x2}px`;
    [GI1, FI1, GI2, FI2].forEach((e) => { e.style.opacity = im; });
    [FI1, FI2].forEach((e) => { e.style.background = fill; });
    [BI1, BI2].forEach((e) => { e.style.opacity = im * (t < W.out[0] ? 1 : 1 - pr(t, W.out)) * (t < W.fin[0] ? 1 : 0); });
    LI.style.opacity = win(t, W.imgs[0], W.swap[0] + 0.3);
    PEN.style.left = `${lerp(330, -45, Math.min(1, sw / 0.6))}px`;
    PEN.style.opacity = win(t, W.swap[0] - 0.2, 16.8);
    LP.style.opacity = win(t, W.swap[0] - 0.2, 16.8);
    // 6. outlines on top
    const o = pr(t, W.out);
    RS.forEach((e) => { e.style.opacity = o; e.style.borderColor = ring; });
    RH.style.background = ring;
    LO.style.opacity = win(t, W.out[0], W.fin[0]);
    let txt = '';
    if (step === 0) txt = `html${c} x 71 → 329, y 150 · ${fr ? 'hauteur' : 'height'} 0`;
    else if (step === 1) txt = `${fr ? 'ombre' : 'shadow'}${c} x 51 → 349, y 130 → 170`;
    else if (step === 2) txt = `body${c} x ${n(bx)} → ${n(bx + bw)}, y ${n(by)} → ${n(by + bh)}`;
    else if (step === 3) txt = `img 1${c} x 300 → 330, y 135 → 165`;
    else if (step === 4) txt = `img 2${c} x ${n(x2)} → ${n(x2 + 30)}`;
    else if (step === 5) txt = `outline html${c} x 61 → 339, y 140 → 160`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
