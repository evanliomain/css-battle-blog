<div class="cap" data-t="0" data-step="body : une ligne de 160px"><h3>1. <code>body</code> : une ligne de 160px</h3><p>Pas de doctype : la page est en mode quirks, et les nombres sans unité sont des px. Le code commence par une espace insécable : c'est du texte, donc le body s'ouvre là et reçoit une ligne. Le <code>*</code> imbriqué vise tout sauf <code>html</code> : le body a <code>margin:80 125</code>, de x = 125 à 275 à partir de y = 80, et <code>font:147q'</code>, une police de 138,9px. Une ligne de cette police fait 160px de haut.</p></div>
<div class="cap" data-t="5" data-step="p : 210 × 160"><h3>2. <code>p</code> : 210 × 160</h3><p>Le troisième <code>*</code> vise les éléments qui ont au moins deux ancêtres : le <code>p</code> (et le <code>style</code>, caché). Le <code>p</code> contient une espace insécable : une ligne de 160px. Il se place sous la ligne du body, à y = 240, et <code>margin:-140-30 0</code> le remonte à 100 et l'élargit de 30px de chaque côté : 210px, de x = 95 à 305. Il finit à 260 : le body fait 180px de haut, et <code>html</code> 80 + 180 + 80 = 340.</p></div>
<div class="cap" data-t="10" data-step="html : un anneau"><h3>3. <code>html</code> : un anneau</h3><p><code>html</code> reçoit le dégradé avec la police par défaut, 16px. <code>4%1em</code> : 4 % de 400 = 16px de large, 1em = 16px de haut, un cercle. Le dégradé est bleu jusqu'à 32q = 30,24px, orange jusqu'à 5ch = 40px, puis bleu. Il est centré dans la boîte de 400 × 340, à y = 170, et <code>0-95q</code> le remonte de 89,76px : centre en (200 ; 80,24).</p></div>
<div class="cap" data-t="15" data-step="body : le cercle s'étire"><h3>4. <code>body</code> : le cercle s'étire</h3><p>Dans le body, la police fait 138,9px : 1em = 138,9px de haut, mais 4 % de 150 = 6px de large. La forme est 23,1 fois plus haute que large. Le bleu va toujours jusqu'à 30,24px à gauche et à droite du centre : une bande de x = 170 à 230 sur toute la hauteur. L'orange va jusqu'à 5ch = 347,2px et couvre le reste. Le body passe devant <code>html</code> et cache le bas de l'anneau.</p></div>
<div class="cap" data-t="20" data-step="p : la même bande"><h3>5. <code>p</code> : la même bande</h3><p>Dans le <code>p</code>, 4 % de 210 = 8,4px de large et 1em = 138,9px de haut. Les arrêts du dégradé sont des longueurs, pas des pourcentages : le bleu s'arrête encore à 30,24px du centre, de x = 170 à 230. Les côtés orange vont de 95 à 170 et de 230 à 305, de y = 100 à 260.</p></div>
<div class="cap" data-t="25" data-step="Résultat" data-live="132 caractères · 100 % identique"><h3>6. Résultat : 132 caractères</h3><p>L'anneau de <code>html</code> fait l'arc. Le body fait la marche du haut, le <code>p</code> celle du bas, et leurs deux bandes font l'ouverture. Un seul dégradé sert aux trois éléments : <code>4%</code> suit la largeur de chaque boîte, <code>1em</code> suit sa police.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="body: one 160px line"><h3>1. <code>body</code>: one 160px line</h3><p>No doctype: the page is in quirks mode, and numbers with no unit are px. The code starts with a no-break space: that is text, so the body opens there and gets a line. The nested <code>*</code> matches everything but <code>html</code>: the body gets <code>margin:80 125</code>, from x = 125 to 275 from y = 80, and <code>font:147q'</code>, a 138.9px font. One line of that font is 160px tall.</p></div>
<div class="cap" data-t="5" data-step="p: 210 × 160"><h3>2. <code>p</code>: 210 × 160</h3><p>The third <code>*</code> matches elements with at least two ancestors: the <code>p</code> (and the <code>style</code>, hidden). The <code>p</code> holds a no-break space: one 160px line. It goes under the body's line, at y = 240, and <code>margin:-140-30 0</code> lifts it to 100 and widens it by 30px on each side: 210px, from x = 95 to 305. It ends at 260: the body is 180px tall, and <code>html</code> 80 + 180 + 80 = 340.</p></div>
<div class="cap" data-t="10" data-step="html: a ring"><h3>3. <code>html</code>: a ring</h3><p><code>html</code> gets the gradient with the default 16px font. <code>4%1em</code>: 4% of 400 = 16px wide, 1em = 16px tall, a circle. The gradient is blue up to 32q = 30.24px, orange up to 5ch = 40px, then blue. It is centered in the 400 × 340 box, at y = 170, and <code>0-95q</code> lifts it by 89.76px: center at (200, 80.24).</p></div>
<div class="cap" data-t="15" data-step="body: the circle stretches"><h3>4. <code>body</code>: the circle stretches</h3><p>In the body, the font is 138.9px: 1em = 138.9px tall, but 4% of 150 = 6px wide. The shape is 23.1 times taller than wide. The blue still goes 30.24px left and right of the center: a band from x = 170 to 230, all the way down. The orange goes up to 5ch = 347.2px and covers the rest. The body sits in front of <code>html</code> and hides the bottom of the ring.</p></div>
<div class="cap" data-t="20" data-step="p: the same band"><h3>5. <code>p</code>: the same band</h3><p>In the <code>p</code>, 4% of 210 = 8.4px wide and 1em = 138.9px tall. The color stops are lengths, not percentages: the blue still stops 30.24px from the center, from x = 170 to 230. The orange sides go from 95 to 170 and from 230 to 305, from y = 100 to 260.</p></div>
<div class="cap" data-t="25" data-step="Result" data-live="132 characters · 100% match"><h3>6. Result: 132 characters</h3><p>The ring of <code>html</code> makes the arch. The body makes the upper step, the <code>p</code> the lower one, and their two bands make the opening. One gradient serves all three elements: <code>4%</code> follows the width of each box, <code>1em</code> follows its font.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0819 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const H = $('.t0819-h'), B = $('.t0819-b'), P = $('.t0819-p'), live = $('.live');
  const G = (k) => $(`.t0819-g[data-g="${k}"]`);
  const L = (k) => $(`.t0819-l[data-l="${k}"]`);
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const box = (e, r) => { e.style.left = `${r[0]}px`; e.style.top = `${r[1]}px`; e.style.width = `${r[2]}px`; e.style.height = `${r[3]}px`; };
  const f2 = (v) => { const s = (Math.round(v * 100) / 100).toFixed(2).replace(/\.?0+$/, ''); return fr ? s.replace('.', ',') : s; };
  const c = fr ? '\u00a0:' : ':';
  const sep = fr ? '\u00a0;' : ',';
  // Measured on the official code (getBoundingClientRect, computed styles, renders with one part changed):
  // body 150 × 180 at (125, 80), its line 160px tall; p 210 × 160 at (95, 100); html 400 × 340.
  // Fonts: html 16px; body and p 138.898px (147q), 1ch = 69.445px. 32q = 30.236px, 95q = 89.764px.
  // html alone: ring at x = 200, rows 40 to 119; at y = 80, orange from x = 160 to 169 and 230 to 239.
  // body and p alone: navy band from x = 170 to 229 on every row, orange elsewhere.
  const W = { b: [0.3, 1.3], bl: [1.5, 2.5], p: [5.3, 5.8], pm: [6.2, 8.4], h: [10.3, 11], hm: [11.8, 13.8], bb: [15.3, 15.9], bs: [16.5, 18.8], pb: [20.3, 20.9], ps: [21.5, 23.8], fin: 25 };
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < W.fin;
    const nv = 'var(--t0819-nv)';
    const col = (k) => (teach ? `var(--t0819-${k})` : 'var(--t0819-or)');
    const colB = (k) => (teach ? `var(--t0819-${k})` : nv);
    // 1-2. boxes: p from y = 240 with no margin to its real place
    const m = pr(t, W.pm);
    const py = 240 - 140 * m, pw = 150 + 60 * m;
    const pa = pr(t, W.p); // before the p shows up, the body holds only its own line
    const bh = 160 + (py + 80 - 160) * pa, hh = bh + 160;
    box(P, [125 - 30 * m, py, pw, 160]);
    B.style.height = `${bh}px`;
    box(G('b'), [125, 80, 150, bh]);
    G('b').style.opacity = win(t, W.b[0], 24.6) * 0.9;
    G('bl').style.opacity = win(t, W.bl[0], 9.6);
    box(G('p'), [125 - 30 * m, py, pw, 160]);
    box(G('pl'), [125 - 30 * m, py, pw, 160]);
    G('p').style.opacity = win(t, W.p[0], 24.6) * 0.9;
    G('pl').style.opacity = win(t, W.p[0], 9.6);
    box(G('html'), [0, 0, 400, hh]);
    G('html').style.opacity = win(t, 5.3, 14.6) * 0.9;
    // 3. html: a 16px circle, ring from 30.236 to 40px, center y 170 → 80.236
    const cy = 170 - 89.764 * pr(t, W.hm);
    H.style.opacity = pr(t, W.h);
    H.style.background = `radial-gradient(16px 16px at 200px ${cy}px, ${nv} 30.236px, ${col('ring')} 0 40px, ${nv} 0)`;
    box(G('tile'), [0, cy - 170, 400, 340]);
    G('tile').style.opacity = win(t, W.h[0], 14.6) * 0.9;
    // 4-5. body and p: the same gradient, 1em from 16px to 138.898px (the real code from then on)
    const grad = (ry, s, b) => `radial-gradient(4% ${ry}px, ${b} 30.236px, ${s} 0 347.225px, ${nv} 0) 0 -89.764px`;
    const rb = 16 + 122.898 * pr(t, W.bs), rp = 16 + 122.898 * pr(t, W.ps);
    B.style.opacity = pr(t, W.bb);
    B.style.background = grad(rb, col('bs'), colB('bb'));
    P.style.opacity = pr(t, W.pb);
    P.style.background = grad(rp, col('ps'), colB('pb'));
    const lw = [[0.2, 4.6], [5.2, 9.6], [10.2, 14.6], [15.2, 19.6], [20.2, 24.6]];
    lw.forEach(([a, z], k) => (L(k + 1).style.opacity = win(t, a, z)));
    let txt = '';
    if (step === 0) txt = `body${c} 150 × 160 · ${fr ? 'de' : 'from'} (125${sep} 80)`;
    else if (step === 1) txt = `p${c} y = ${f2(py)} · body${c} 150 × ${f2(bh)} · html${c} 400 × ${f2(hh)}`;
    else if (step === 2) txt = `${fr ? 'centre' : 'center'}${c} (200${sep} ${f2(cy)})`;
    else if (step === 3) txt = `body${c} 6 × ${f2(rb)} · ×${f2(rb / 6)}`;
    else if (step === 4) txt = `p${c} 8,4 × ${f2(rp)} · ×${f2(rp / 8.4)}`.replace('8,4', fr ? '8,4' : '8.4');
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
