<figure class="anim t1102" data-duration="26" data-scene="t1102" data-wide="-50 -40 500 380" style="--bg:#492fb0">
<style>
.t1102{--pink:#db5ead;--bbg:#3f7fd0;--bl:#f2a65a;--pbg:#a594f2;--pl:#4fc3d9}
.t1102 .t1102-h{left:110px;top:60px;width:180px;height:180px}
.t1102 .t1102-b{left:170px;top:60px;width:120px;height:120px}
.t1102 .t1102-p{left:230px;top:60px;width:60px;height:60px}
.t1102 .t1102-box{outline:2px dashed #ffd23f;outline-offset:-2px;pointer-events:none}
.t1102 .t1102-ghost{left:110px;top:60px;width:180px;height:180px;outline:2px dashed #fff;outline-offset:-2px;pointer-events:none}
.t1102 .t1102-img{left:230px;top:60px;width:60px;height:60px;outline:2px dashed #fff;outline-offset:-2px;pointer-events:none}
.t1102 .t1102-dot{width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;pointer-events:none}
.t1102 .t1102-lab{font:10.5px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:#24302f;background:rgb(255 255 255 / .85);padding:1px 3px;border-radius:2px;white-space:nowrap;pointer-events:none;z-index:53}
.t1102 .t1102-lab b{font-weight:600}
.t1102[data-view="wide"] .t1102-lab{font-size:12.5px}
</style>
<div class="anim-col">
<div class="stage" role="img" aria-label="{% if include.lang == "fr" %}Animation : une même ombre intérieure dessine un L dans html, body et p, emboîtés dans un coin ; l'img donne sa hauteur au p, et scale:-1 retourne son L{% else %}Animation: one inset shadow draws an L in html, body and p, nested in one corner; the img gives the p its height, and scale:-1 flips its L{% endif %}">
<div class="scene">
<div class="t1102-h"></div>
<div class="t1102-ghost"></div>
<div class="t1102-b"></div>
<div class="t1102-p"></div>
<div class="t1102-box t1102-hbox" style="left:110px;top:60px;width:180px;height:180px"></div>
<div class="t1102-box t1102-bbox" style="left:170px;top:60px;width:120px;height:120px"></div>
<div class="t1102-img"></div>
<div class="t1102-dot"></div>
<div class="t1102-lab t1102-lab-h" style="left:110px;top:246px"><b>html</b> · 180 × 180</div>
<div class="t1102-lab t1102-lab-b" style="left:174px;top:184px"><b>body</b> · 120 × 120</div>
<div class="t1102-lab t1102-lab-p" style="left:234px;top:124px"><b>p</b> · 60 × 60</div>
<div class="t1102-lab t1102-lab-i" style="left:8px;top:8px"><b>img</b> · 0 × 0, margin 60 × 60</div>
</div>
</div>
<div class="legend"><span><i style="--c:var(--pink)"></i>{% if include.lang == "fr" %}L de html{% else %}html's L{% endif %}</span><span><i style="--c:var(--bbg)"></i>{% if include.lang == "fr" %}fond du body (violet en vrai){% else %}body's background (violet in reality){% endif %}</span><span><i style="--c:var(--bl)"></i>{% if include.lang == "fr" %}L du body (rose en vrai){% else %}body's L (pink in reality){% endif %}</span><span><i style="--c:var(--pbg)"></i>{% if include.lang == "fr" %}fond du p (violet en vrai){% else %}p's background (violet in reality){% endif %}</span><span><i style="--c:var(--pl)"></i>{% if include.lang == "fr" %}L du p (rose en vrai){% else %}p's L (pink in reality){% endif %}</span></div>
</div>
<div class="anim-side">
<pre class="code" aria-hidden="true"><span data-on="4">&lt;p>&lt;img></span>&lt;style>*{<span data-on="1">background:#492FB0</span>;<span data-on="1">margin:60 110</span>;<span data-on="2">box-shadow:inset 32q -32q#DB5EAD</span>;*{<span data-on="3 4" data-tone="2">margin:0 0 60 60</span>;*{<span data-on="5" data-tone="2">scale:-1</span></pre>
<div class="now" aria-live="polite">
<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="html : un carré de 180"><h3>1. html : un carré de 180</h3><p><code>*</code> touche d'abord <code>html</code> : son fond violet part sur tout le canevas. <code>margin:60 110</code> lui laisse 180px de large, et en mode quirks sa hauteur remplit la page moins ses marges : 300 − 120 = 180. Un carré de 180 en (110, 60).</p></div>
<div class="cap" data-t="3.5" data-step="L'ombre intérieure : un L"><h3>2. L'ombre intérieure : un L</h3><p><code>inset 32q -32q</code> (environ 30px, −30px) : une ombre intérieure peint la boîte sauf sous une copie d'elle-même décalée de 30px à droite et 30px vers le haut. Il reste une bande à gauche et une en bas : un L rose.</p></div>
<div class="cap" data-t="8.5" data-step="body : le même L, plus petit"><h3>3. body : le même L, plus petit</h3><p><code>* *</code> vise <code>body</code> : <code>margin:0 0 60 60</code> en fait un carré de 120 (le mode quirks lui donne la hauteur de <code>html</code> moins 60), calé dans le coin haut-droit. Même fond, qui recouvre l'intérieur du premier L, et même ombre : un L de 120 dans le premier.</p></div>
<div class="cap" data-t="12.5" data-step="p : sa hauteur vient de l'img"><h3>4. p : sa hauteur vient de l'img</h3><p>Le <code>&lt;p></code> reçoit la même marge : 60px de large, en (230, 60). Mais il ne contient aucun texte : il ferait 0px de haut. L'<code>&lt;img></code> règle ça : sans source, elle fait 0×0, mais elle reçoit aussi <code>margin:0 0 60 60</code>, et sa boîte de marge de 60×60 fait une ligne de 60px. Le <code>&lt;p></code> mesure donc 60×60, et son ombre dessine un petit L.</p></div>
<div class="cap" data-t="17" data-step="scale:-1 : le L retourné"><h3>5. scale:-1 : le L retourné</h3><p><code>* * *</code> vise le <code>&lt;p></code> (et l'<code>&lt;img></code>, invisible) : <code>scale:-1</code> le retourne autour de son centre, dans les deux sens, ce qui revient à un demi-tour. Le L devient une bande en haut et une à droite, et la case violette reste vide.</p></div>
<div class="cap" data-t="21.5" data-step="Résultat" data-live="112 caractères · 100 % identique"><h3>6. Résultat : 112 caractères</h3><p>Une ombre, trois boîtes emboîtées, un retournement : l'image complète, au pixel près.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html: a 180 square"><h3>1. html: a 180 square</h3><p><code>*</code> matches <code>html</code> first: its violet background goes to the whole canvas. <code>margin:60 110</code> leaves it 180px wide, and in quirks mode its height fills the page minus its margins: 300 − 120 = 180. A 180 square at (110, 60).</p></div>
<div class="cap" data-t="3.5" data-step="The inset shadow: an L"><h3>2. The inset shadow: an L</h3><p><code>inset 32q -32q</code> (about 30px, −30px): an inset shadow paints the box except under a copy of itself moved 30px right and 30px up. What is left is a strip on the left and one at the bottom: a pink L.</p></div>
<div class="cap" data-t="8.5" data-step="body: the same L, smaller"><h3>3. body: the same L, smaller</h3><p><code>* *</code> matches <code>body</code>: <code>margin:0 0 60 60</code> makes it a 120 square (quirks mode gives it the height of <code>html</code> minus 60), set in the top right corner. Same background, which covers the inside of the first L, and same shadow: a 120 L inside the first one.</p></div>
<div class="cap" data-t="12.5" data-step="p: its height comes from the img"><h3>4. p: its height comes from the img</h3><p>The <code>&lt;p></code> gets the same margin: 60px wide, at (230, 60). But it holds no text, so it would be 0px tall. The <code>&lt;img></code> fixes that: with no source it is 0×0, but it gets <code>margin:0 0 60 60</code> too, and its 60×60 margin box makes a 60px line. So the <code>&lt;p></code> is 60×60, and its shadow draws a small L.</p></div>
<div class="cap" data-t="17" data-step="scale:-1: the L flipped"><h3>5. scale:-1: the L flipped</h3><p><code>* * *</code> matches the <code>&lt;p></code> (and the <code>&lt;img></code>, which stays invisible): <code>scale:-1</code> flips it around its center, both ways, which is the same as a half turn. The L becomes a strip at the top and one on the right, and the violet cell stays empty.</p></div>
<div class="cap" data-t="21.5" data-step="Result" data-live="112 characters · 100% match"><h3>6. Result: 112 characters</h3><p>One shadow, three nested boxes, one flip: the whole picture, pixel-perfect.</p></div>
{%- endif %}
</div>
<div class="live"></div>
</div>
</div>
<script>
(window.AnimScenes = window.AnimScenes || {}).t1102 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const H = $('.t1102-h'), B = $('.t1102-b'), P = $('.t1102-p'), ghost = $('.t1102-ghost'), hbox = $('.t1102-hbox'), bbox = $('.t1102-bbox'), img = $('.t1102-img'), dot = $('.t1102-dot');
  const lab = (k) => $('.t1102-lab-' + k), live = $('.live');
  const caps = [...fig.querySelectorAll('.caps .cap')];
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b, f = 0.6) => pr(t, a, a + f) * (1 - pr(t, b - f, b));
  const O = 32 * 96 / 101.6;
  const n = (v, d = 2) => v.toFixed(d).replace('.', fr ? ',' : '.');
  const L = fr ? { c: ' :', at: 'en' } : { c: ':', at: 'at' };
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < 21.5;
    const k = pr(t, 4.2, 7.2);
    H.style.boxShadow = `inset ${O * k}px ${-O * k}px var(--pink)`;
    ghost.style.transform = `translate(${O * k}px,${-O * k}px)`;
    ghost.style.opacity = win(t, 3.8, 8.5);
    ghost.style.background = teach ? 'rgb(255 255 255 / .15)' : 'none';
    hbox.style.opacity = win(t, 0.4, 8.5);
    lab('h').style.opacity = win(t, 0.6, 8.5);
    // body: its background covers the inside of the first L, its own L
    B.style.opacity = pr(t, 8.8, 9.6);
    B.style.background = teach ? 'var(--bbg)' : '#492fb0';
    B.style.boxShadow = `inset ${O}px ${-O}px ${teach ? 'var(--bl)' : 'var(--pink)'}`;
    bbox.style.opacity = win(t, 8.8, 12.5);
    lab('b').style.opacity = win(t, 9, 12.5);
    // p: height from the img's margin box, then the flip
    const hgt = 60 * pr(t, 13.6, 15.4);
    const rot = 180 * pr(t, 17.6, 20.2);
    P.style.opacity = t >= 12.6 ? 1 : 0;
    P.style.height = `${hgt}px`;
    P.style.background = teach ? 'var(--pbg)' : '#492fb0';
    P.style.boxShadow = hgt > 0 ? `inset ${O}px ${-O}px ${teach ? 'var(--pl)' : 'var(--pink)'}` : 'none';
    P.style.transformOrigin = '30px 30px';
    P.style.transform = `rotate(${rot}deg)`;
    const ia = win(t, 12.8, 21.5);
    img.style.opacity = ia * (1 - pr(t, 17, 17.6));
    const a = rot * Math.PI / 180;
    dot.style.opacity = ia;
    dot.style.left = `${260 + 30 * Math.cos(a) + 30 * Math.sin(a)}px`;
    dot.style.top = `${90 + 30 * Math.sin(a) - 30 * Math.cos(a)}px`;
    lab('p').style.opacity = win(t, 15.2, 17.2);
    lab('i').style.opacity = win(t, 13, 17.2);
    let txt = '';
    if (step === 0) txt = `html${L.c} 180 × 180 ${L.at} (110, 60) · 300 − 120 = 180`;
    else if (step === 1) txt = `inset ${n(O * k)}px ${k > 0.0005 ? '−' : ''}${n(O * k)}px · 32q = ${n(O)}px`;
    else if (step === 2) txt = `body${L.c} 120 × 120 ${L.at} (170, 60)`;
    else if (step === 3) txt = `p${L.c} 60 × ${Math.round(hgt)} · img${L.c} 0 × 0, margin 60 × 60`;
    else if (step === 4) txt = `scale:-1 = ${fr ? 'demi-tour' : 'half turn'}${L.c} ${Math.round(rot)}°`;
    else txt = caps[step] ? caps[step].dataset.live || '' : '';
    live.textContent = txt;
  };
};
</script>
</figure>
