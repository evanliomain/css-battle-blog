{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="html"><h3>1. Deux bandes sur html</h3><p>Au premier niveau, <code>&amp;</code> vise la racine, html. Il bat <code>*</code> : html prend <code>margin:80 40</code>. Il fait 320 × 140 en (40, 80). <code>border-block:5ch</code> lui donne une bordure de 40px en haut et en bas : deux bandes vertes. Pour l'instant, on voit le blanc de la page.</p></div>
<div class="cap" data-t="6" data-step="Le dégradé"><h3>2. Une tuile, un disque</h3><p>Le fond de html va au canevas. <code>70vh 9in</code> : une tuile de 210 × 864. Le dégradé est un cercle de 1Q de rayon, 0,945px. Le vert va jusqu'à 53Q, 50,08px. Le bleu, sans position, se met à 0,945px : avant 50,08, il remonte là. Le bord est net.</p></div>
<div class="cap" data-t="12" data-step="Les tuiles"><h3>3. Les tuiles se placent sur html</h3><p>Les tuiles se calent sur la zone de html, sous la bordure : 320 × 60 en (40, 120). <code>40vw</code>, 160px, met un bord de tuile en x = 200. En hauteur, la tuile est centrée : les disques sont en y = 150. Ils se répètent tous les 210px : deux disques, en x = 95 et 305. Le vert translucide, sur le blanc de la page, donne le vert des bandes.</p></div>
<div class="cap" data-t="18" data-step="body"><h3>4. body coupe le bas</h3><p><code>margin:0 110-430</code> : 110 à gauche et à droite, -430 en bas. body fait 100px de large, de x = 150 à 250. En mode quirks, il remplit la hauteur de html moins ses marges : 60 + 430 = 490px. Son fond bleu couvre la bande du bas au milieu : deux piliers.</p></div>
<div class="cap" data-t="23" data-step="Disque de body"><h3>5. Le disque de body</h3><p>body a le même fond, calé sur sa propre boîte. Sa tuile est centrée sur ses 490px : son disque tombe en (205, 365), sous le canevas. Grâce aux 864px de la tuile, le disque de la tuile du dessus est en y = −499, loin lui aussi. body ne montre que du bleu.</p></div>
<div class="cap" data-t="27.5" data-step="Résultat" data-live="132 caractères · 100 % identique"><h3>6. Résultat : 132 caractères</h3><p>Une bordure fait la barre et les piliers. Le fond de html fait les deux disques. body, poussé très bas, coupe la bande du bas et cache son propre disque hors du canevas.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html"><h3>1. Two bands on html</h3><p>At the top level, <code>&amp;</code> selects the root, html. It beats <code>*</code>: html gets <code>margin:80 40</code>. It is 320 × 140 at (40, 80). <code>border-block:5ch</code> gives it a 40px border at the top and the bottom: two green bands. For now, the page's white shows.</p></div>
<div class="cap" data-t="6" data-step="The gradient"><h3>2. One tile, one disk</h3><p>html's background goes to the canvas. <code>70vh 9in</code>: a 210 × 864 tile. The gradient is a circle with a 1Q ray, 0.945px. The green goes up to 53Q, 50.08px. The navy, with no position, goes at 0.945px: that is before 50.08, so it moves up there. The edge is sharp.</p></div>
<div class="cap" data-t="12" data-step="The tiles"><h3>3. The tiles sit on html</h3><p>The tiles are placed on html's area, inside the border: 320 × 60 at (40, 120). <code>40vw</code>, 160px, puts a tile edge at x = 200. Vertically, the tile is centered: the disks are at y = 150. They repeat every 210px: two disks, at x = 95 and 305. The translucent green, over the page's white, gives the bands' green.</p></div>
<div class="cap" data-t="18" data-step="body"><h3>4. body cuts the bottom</h3><p><code>margin:0 110-430</code>: 110 on the left and right, -430 at the bottom. body is 100px wide, from x = 150 to 250. In quirks mode, it fills html's height minus its margins: 60 + 430 = 490px. Its navy background covers the middle of the bottom band: two pillars.</p></div>
<div class="cap" data-t="23" data-step="body's disk"><h3>5. body's own disk</h3><p>body has the same background, placed on its own box. Its tile is centered on its 490px: its disk falls at (205, 365), below the canvas. Thanks to the 864px tile, the disk of the tile above is at y = −499, far away too. body only shows navy.</p></div>
<div class="cap" data-t="27.5" data-step="Result" data-live="132 characters · 100% match"><h3>6. Result: 132 characters</h3><p>One border makes the bar and the pillars. html's background makes the two disks. body, pushed far down, cuts the bottom band and hides its own disk off the canvas.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0709 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? ' :' : ':';
  const num = (v, d = 0) => { const s = Math.abs(v).toFixed(d); return (v < -0.005 ? '−' : '') + (fr ? s.replace('.', ',') : s); };
  // Measured on the official code in local Chrome (quirks mode, 400 × 300), getBoundingClientRect:
  // html (40, 80) 320 × 140, border-block 40px (5ch); its padding box (40, 120) 320 × 60 places the canvas tiles.
  // body (150, 120) 100 × 490. Tile 210 × 864 (70vh × 9in), at 160px (40vw), centered vertically.
  // Canvas disks: (95, 150) and (305, 150), radius 53Q = 50.079px. body's disk: (205, 365).
  const R = 50.079, FIN = 27.5;
  const can = $('.t0709-can'), disk = $('.t0709-disk'), dot = $('.t0709-dot');
  const top = $('.t0709-top'), bot = $('.t0709-bot'), body = $('.t0709-body');
  const t1 = $('.t0709-t1'), t2 = $('.t0709-t2');
  const g1 = $('.t0709-g1'), g2 = $('.t0709-g2'), g3 = $('.t0709-g3');
  const hb = $('.t0709-hb'), pb = $('.t0709-pb'), bb = $('.t0709-bb');
  const L = (k) => $$(`.t0709-l[data-l="${k}"]`);
  const circ = (e, cx, cy, r) => { e.style.left = `${cx - r}px`; e.style.top = `${cy - r}px`; e.style.width = `${2 * r}px`; e.style.height = `${2 * r}px`; };
  const put = (e, x, y, w, h) => { e.style.left = `${x}px`; e.style.top = `${y}px`; e.style.width = `${w}px`; e.style.height = `${h}px`; };
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    // 1. html shrinks from the canvas to (40, 80) 320 × 140, then its border grows to 40px
    const kM = pr(t, [0.5, 2.5]), kB = pr(t, [3, 4.8]);
    put(hb, 40 * kM, 80 * kM, 400 - 80 * kM, 300 - 160 * kM);
    hb.style.opacity = 0.9 * pr(t, [0.2, 0.5]) * (1 - pr(t, [5.6, 6]));
    top.style.height = bot.style.height = `${40 * kB}px`;
    bot.style.top = `${220 - 40 * kB}px`;
    top.style.background = bot.style.background = teach ? 'var(--t0709-c1)' : 'var(--t0709-green)';
    // 2. one tile: x −10..200, y −282..582; dot, green disk to 50.08, then the navy of the tile
    put(t1, -10, -282, 210, 864);
    put(t2, 200, -282, 210, 864);
    t1.style.opacity = 0.95 * pr(t, [6.2, 6.6]) * (1 - pr(t, [17.5, 18]));
    t2.style.opacity = 0.95 * pr(t, [13.3, 13.7]) * (1 - pr(t, [17.5, 18]));
    dot.style.opacity = win(t, 6.6, 8);
    const kD = pr(t, [7.6, 9.4]);
    circ(disk, 95, 150, R * kD);
    const kN = pr(t, [9.8, 11.3]);
    can.style.opacity = kN;
    disk.style.opacity = kN >= 1 ? 0 : 1;
    // 3. the second tile appears, from x = 200 to the right edge
    const kT = pr(t, [13.8, 15.8]);
    can.style.clipPath = `inset(0 ${200 * (1 - kT)}px 0 0)`;
    put(pb, 40, 120, 320, 60);
    pb.style.opacity = 0.9 * win(t, 12.3, 18);
    circ(g1, 95, 150, R);
    circ(g2, 305, 150, R);
    g1.style.opacity = 0.9 * pr(t, [9.6, 10]) * (1 - pr(t, [17.5, 18]));
    g2.style.opacity = 0.9 * pr(t, [15.6, 16]) * (1 - pr(t, [17.5, 18]));
    // 4. body grows down from y = 120 to 610
    const kY = pr(t, [18.5, 20.8]);
    body.style.height = `${490 * kY}px`;
    body.style.opacity = pr(t, [18.3, 18.5]);
    body.style.background = teach ? 'var(--t0709-c2)' : '';
    put(bb, 150, 120, 100, 490 * kY);
    bb.style.opacity = 0.9 * pr(t, [18.3, 18.5]) * (1 - pr(t, [FIN - 0.5, FIN]));
    // 5. body's own disk, centered at (205, 365)
    circ(g3, 205, 365, R);
    g3.style.opacity = 0.9 * win(t, 23.3, FIN);
    [[0.3, 6], [6.3, 12], [12.3, 18], [18.3, 23], [23.3, 27.5]].forEach(([a, z], k) => L(k + 1).forEach((e) => (e.style.opacity = win(t, a, z))));
    let txt;
    if (step === 0) txt = kB > 0 ? (fr ? `bordure${c} ${num(40 * kB, 1)}px en haut et en bas` : `border${c} ${num(40 * kB, 1)}px top and bottom`) : `html${c} ${num(400 - 80 * kM, 0)} × ${num(300 - 160 * kM, 0)}`;
    else if (step === 1) txt = fr ? `rayon du vert${c} ${num(R * kD, 2)}px` : `green ray${c} ${num(R * kD, 2)}px`;
    else if (step === 2) txt = fr ? `disques en x = 95${kT >= 1 ? ' et 305' : ''}, y = 150` : `disks at x = 95${kT >= 1 ? ' and 305' : ''}, y = 150`;
    else if (step === 3) txt = `body${c} 100 × ${num(490 * kY, 0)}`;
    else if (step === 4) txt = fr ? `disque de body${c} (205, 365)` : `body's disk${c} (205, 365)`;
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
