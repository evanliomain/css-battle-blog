<div class="now" aria-live="polite">
<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="html"><h3>1. html, juste à droite du canevas</h3><p>Pas de doctype : la page est en mode quirks. <code>*</code> vise html, head, style et body ; head et style sont masqués. Pour html, <code>margin:90-62 150 402</code> laisse 400 − 402 + 62 = 60px de large : x = 402 à 462, hors du canevas. html n'a pas de fond : c'est une boîte vide. Elle fait 120px de haut, de y = 90 à 210.</p></div>
<div class="cap" data-t="5" data-step="body"><h3>2. body, deux fois plus large</h3><p>Le <code>*{</code> imbriqué vise ce qui est dans un autre élément : head, style et body. Il vient après, donc sa marge l'emporte. <code>margin:60-60-60 0</code> descend body de 60px, en y = 150, et sa marge droite de −60 le fait déborder : 120px de large. En mode quirks, sa hauteur vaut les 60px de html moins ses deux marges : 60 − 60 + 60 = 60.</p></div>
<div class="cap" data-t="10" data-step="Coins"><h3>3. border-radius:0 9in</h3><p>Les coins haut gauche et bas droit restent à 0. Les coins haut droit et bas gauche demandent 9in, 864px. C'est trop pour des côtés de 60px : le navigateur réduit les rayons jusqu'à ce qu'ils tiennent. Chaque boîte reçoit deux quarts de cercle de 60px de rayon.</p></div>
<div class="cap" data-t="15" data-step="-2in 0"><h3>4. L'ombre -2in 0 : la forme bleu nuit</h3><p>Une ombre sans flou est une copie de la boîte, coins arrondis compris. <code>-2in</code> vaut −192px : les copies de html et de body arrivent en x = 210. Elles se chevauchent et font une seule forme, de x = 210 à 330. C'est déjà la forme de droite.</p></div>
<div class="cap" data-t="20" data-step="224q 0"><h3>5. L'ombre 224q 0 : deux copies dorées, loin à droite</h3><p><code>224q</code>, 224 quarts de millimètre, vaut 211,65px. Les deux copies dorées partent vers la droite : de x = 613,65 à 673,65 pour html, jusqu'à 733,65 pour body. Elles sont hors du canevas.</p></div>
<div class="cap" data-t="25" data-step="Reflet"><h3>6. -webkit-box-reflect:left : le miroir</h3><p>html et body ont chacun un reflet, collé à leur bord gauche, en x = 402. Le reflet montre tout ce que la boîte peint, ombres comprises : x devient 804 − x. Les copies dorées arrivent de x = 130,35 et 70,35 à 190,35 : la forme de gauche. Les reflets des copies bleu nuit tombent en x = 474 à 594, hors du canevas.</p></div>
<div class="cap" data-t="30" data-step="Résultat" data-live="133 caractères · 100 % identique"><h3>7. Résultat : 133 caractères</h3><p>Une seule règle pour deux boîtes hors du canevas. L'ombre bleu nuit les copie sur le canevas. L'ombre dorée part de l'autre côté, et le reflet la ramène en miroir.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html"><h3>1. html, just right of the canvas</h3><p>There is no doctype: the page is in quirks mode. <code>*</code> selects html, head, style and body; head and style are hidden. For html, <code>margin:90-62 150 402</code> leaves 400 − 402 + 62 = 60px of width: x = 402 to 462, off the canvas. html has no background: it is an empty box. It is 120px tall, from y = 90 to 210.</p></div>
<div class="cap" data-t="5" data-step="body"><h3>2. body, twice as wide</h3><p>The nested <code>*{</code> selects what sits inside another element: head, style and body. It comes later, so its margin wins. <code>margin:60-60-60 0</code> moves body 60px down, to y = 150, and its −60 right margin makes it stick out: 120px wide. In quirks mode, its height is html's 60px minus its two margins: 60 − 60 + 60 = 60.</p></div>
<div class="cap" data-t="10" data-step="Corners"><h3>3. border-radius:0 9in</h3><p>The top left and bottom right corners stay at 0. The top right and bottom left corners ask for 9in, 864px. That is too much for 60px sides: the browser scales the radii down until they fit. Each box gets two quarter circles with a 60px radius.</p></div>
<div class="cap" data-t="15" data-step="-2in 0"><h3>4. The -2in 0 shadow: the navy shape</h3><p>A shadow with no blur is a copy of the box, rounded corners included. <code>-2in</code> is −192px: the copies of html and body land at x = 210. They overlap and make one shape, from x = 210 to 330. That is already the right shape.</p></div>
<div class="cap" data-t="20" data-step="224q 0"><h3>5. The 224q 0 shadow: two gold copies, far right</h3><p><code>224q</code>, 224 quarter millimeters, is 211.65px. The two gold copies move right: from x = 613.65 to 673.65 for html, to 733.65 for body. They are off the canvas.</p></div>
<div class="cap" data-t="25" data-step="Mirror"><h3>6. -webkit-box-reflect:left: the mirror</h3><p>html and body each get a mirror image, against their left edge, at x = 402. The mirror shows everything the box paints, shadows included: x becomes 804 − x. The gold copies land from x = 130.35 and 70.35 to 190.35: the left shape. The mirror images of the navy copies fall at x = 474 to 594, off the canvas.</p></div>
<div class="cap" data-t="30" data-step="Result" data-live="133 characters · 100% match"><h3>7. Result: 133 characters</h3><p>One rule for two boxes off the canvas. The navy shadow copies them onto the canvas. The gold shadow goes the other way, and the mirror brings it back, flipped.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0701 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? '\u00a0:' : ':';
  const num = (v, d = 0) => { const s = Math.abs(v).toFixed(d); return (v < -0.005 ? '−' : '') + (fr ? s.replace('.', ',') : s); };
  // Measured on the official code in local Chrome (getBoundingClientRect, 400 × 300, quirks mode):
  // html (402, 90) 60 × 120, body (402, 150) 120 × 60; radii 0 9in → 60px (0 60px renders the same);
  // shadows -2in = -192px, 224q = 211.654px; box-reflect: left mirrors both around x = 402 (x → 804 − x):
  // gold copies → 130.346..190.346 (html) and 70.346..190.346 (body); navy copies → 474..594.
  const FIN = 30, X = 402, DN = -192, DG = 211.654;
  const boxes = $$('.t0701-bx'), mboxes = $$('.t0701-mir .t0701-box');
  const n = $$('.scene > .t0701-n'), g = $$('.scene > .t0701-g');
  const mn = $$('.t0701-mir .t0701-n'), mg = $$('.t0701-mir .t0701-g');
  const mir = $('.t0701-mir'), axis = $('.t0701-axis');
  const L = (k) => $$(`.zlab[data-l="${k}"]`);
  const col = (teach, k, real) => `var(--t0701-${teach ? k : real})`;
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    const ann = 1 - pr(t, [FIN, FIN + 0.6]);
    // 1–2. the two boxes
    boxes[0].style.opacity = 0.9 * pr(t, [0.3, 1.2]) * ann;
    boxes[1].style.opacity = 0.9 * pr(t, [5.3, 6.2]) * ann;
    // 3. the corners round to 60px
    const r = 60 * pr(t, [11, 13]);
    boxes.forEach((e) => (e.style.borderRadius = `0 ${r}px`));
    // 4. navy copies slide 192px left; 5. gold copies slide 211.654px right
    const kn = pr(t, [16, 18]), kg = pr(t, [21, 23]);
    n.forEach((e, i) => {
      e.style.left = `${X + DN * kn}px`;
      e.style.opacity = t >= 15.3 ? 1 : 0;
      e.style.background = col(teach, i ? 'nb' : 'nh', 'navy');
    });
    g.forEach((e, i) => {
      e.style.left = `${X + DG * kg}px`;
      e.style.opacity = t >= 20.3 ? 1 : 0;
      e.style.background = col(teach, i ? 'gb' : 'gh', 'gold');
    });
    // 6. the mirror image of everything both boxes paint flips around x = 402
    const s = 1 - 2 * pr(t, [26, 28.5]);
    mir.style.opacity = t >= 25.3 ? 1 : 0;
    mir.style.transform = `scaleX(${s})`;
    mn.forEach((e, i) => { e.style.opacity = 1; e.style.background = col(teach, i ? 'nb' : 'nh', 'navy'); });
    mg.forEach((e, i) => { e.style.opacity = 1; e.style.background = col(teach, i ? 'gb' : 'gh', 'gold'); });
    mboxes.forEach((e) => { e.style.opacity = 0.6 * ann; e.style.borderRadius = '0 60px'; });
    axis.style.opacity = win(t, 25.3, 30);
    [[0.3, 5], [5.3, 10], [10.3, 15], [15.3, 20], [20.3, 25], [25.3, 30]].forEach(([a, e], k) => L(k + 1).forEach((l) => (l.style.opacity = win(t, a, e))));
    let txt;
    if (step === 0) txt = `html${c} 60 × 120 · x = 402 … 462`;
    else if (step === 1) txt = `body${c} 120 × 60 · x = 402 … 522`;
    else if (step === 2) txt = `${fr ? 'rayon' : 'radius'}${c} ${num(r, 1)}px`;
    else if (step === 3) txt = `-2in 0${c} x = ${num(X + DN * kn, 2)}`;
    else if (step === 4) txt = `224q 0${c} x = ${num(X + DG * kg, 2)}`;
    else if (step === 5) { const a = X + DG * s, b = X + (DG + 120) * s; txt = `${fr ? 'reflet doré' : 'gold mirror'}${c} x = ${num(Math.min(a, b), 2)} … ${num(Math.max(a, b), 2)}`; }
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
