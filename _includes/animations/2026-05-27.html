<div class="cap" data-t="0" data-step="html"><h3>1. La boîte de html</h3><p>Au niveau le plus haut, <code>&amp;</code> vise la racine, html, et <code>&amp;>*</code> ses enfants, head et body. <code>margin:60 85</code> fait de html une boîte de 230 × 180 en (85, 60). Son fond <code>#fd13</code> est un jaune à 20 % d'opacité. Le fond de la racine passe à tout le canevas : sur le blanc, il donne la crème <code>#fff8cf</code>.</p></div>

<div class="cap" data-t="9" data-step="body"><h3>3. body, un rond brun</h3><p>body reçoit aussi <code>margin:60 85</code> : il lui reste 230 − 170 = 60px de large. Le <code>*{</code> imbriqué vise body, dl, h1 et p : <code>height:60</code> et <code>border-radius:50%</code> font un rond de 60px en (170, 120). dl, h1 et p ont la même boîte : leurs marges du haut fusionnent avec celle de body. <code>inset 2in 0</code> décale l'ombre de 192px, plus que la boîte : elle la remplit de brun.</p></div>
