{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="html : une zone presque carrée"><h3>1. <code>html</code> : une zone presque carrée</h3><p><code>*</code> vise <code>html</code>, qui fait tout le canevas, 400 × 300, sans fond. Son <code>border-image</code> a un débord de <code>53q 0</code> : 53q = 50,08px en haut et en bas, rien sur les côtés. L'image de bordure est donc peinte dans une zone de 400 × 400,16, de y = −50,08 à 350,08.</p></div>
<div class="cap" data-t="4" data-step="Le dégradé, en quatre coins"><h3>2. Le dégradé, en quatre coins</h3><p><code>50%</code> coupe l'image en quatre quarts, et <code>97lh</code> donne la largeur des bords. Dans <code>html</code>, 1lh vaut 18px : 97lh = 1746px. Deux bords de 1746px n'entrent pas dans 400px, alors le navigateur réduit toutes les largeurs : 200px chacune. Les quatre coins remplissent la zone et recomposent le dégradé. <code>5lh</code> = 90px : un disque blanc de 90px de rayon, centré en (200 ; 150).</p></div>
<div class="cap" data-t="8.5" data-step="body : le même border-image"><h3>3. <code>body</code> : le même <code>border-image</code></h3><p><code>*</code> vise aussi le <code>body</code> : 384 × 284 en mode quirks, à partir de (8 ; 8). Avec le débord, sa zone fait 384 × 384,16, centrée en (200 ; 150). Sans autre règle, son 1lh vaut aussi 18px : ses coins font 192px et son disque blanc 90px de rayon. Pile sur le dessin de <code>html</code> : en vraies couleurs, rien ne change.</p></div>
<div class="cap" data-t="12.5" data-step="font:1q : 1lh = 1px"><h3>4. <code>font:1q''</code> : 1lh = 1px</h3><p>La règle imbriquée donne au <code>body</code> une taille de police de 1q = 0,945px. Sa hauteur de ligne normale vaut alors 1px. 97lh = 97px : les coins entrent, 97 × 97, avec 190px entre eux. Rien ne remplit le milieu, on y voit <code>html</code>. 5lh = 5px : le blanc n'est plus qu'un point à la pointe de chaque coin.</p></div>
<div class="cap" data-t="17" data-step="scale:.21"><h3>5. <code>scale:.21</code></h3><p><code>scale:.21</code> réduit le <code>body</code> autour de son centre, (200 ; 150). Sa zone passe à 80,64 × 80,67, chaque coin à 20,37 × 20,37, avec 39,9px entre deux coins. Quatre carrés rouges sur le disque blanc : les trous du bouton. Les points blancs ne font plus que 0,53px de rayon : ils ne se voient pas.</p></div>
<div class="cap" data-t="21.5" data-step="Résultat" data-live="92 caractères · 100 % identique"><h3>6. Résultat : 92 caractères</h3><p>Une seule déclaration <code>border-image</code>, pour deux éléments. Dans <code>html</code>, 1lh vaut 18px : un grand disque. Dans le <code>body</code>, 1lh vaut 1px : quatre petits carrés.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html: an almost square area"><h3>1. <code>html</code>: an almost square area</h3><p><code>*</code> matches <code>html</code>, which fills the canvas, 400 × 300, with no background. Its <code>border-image</code> has an outset of <code>53q 0</code>: 53q = 50.08px at the top and bottom, nothing on the sides. So the border image is painted in a 400 × 400.16 area, from y = −50.08 to 350.08.</p></div>
<div class="cap" data-t="4" data-step="The gradient, in four corners"><h3>2. The gradient, in four corners</h3><p><code>50%</code> cuts the image in four quarters, and <code>97lh</code> is the width of the borders. In <code>html</code>, 1lh is 18px: 97lh = 1746px. Two borders of 1746px do not fit in 400px, so the browser scales all the widths down: 200px each. The four corners fill the area and put the gradient back together. <code>5lh</code> = 90px: a white disk of radius 90, centered at (200, 150).</p></div>
<div class="cap" data-t="8.5" data-step="body: the same border-image"><h3>3. <code>body</code>: the same <code>border-image</code></h3><p><code>*</code> matches the <code>body</code> too: 384 × 284 in quirks mode, from (8, 8). With the outset, its area is 384 × 384.16, centered at (200, 150). With no other rule, its 1lh is 18px too: its corners are 192px and its white disk has radius 90. Right on top of the <code>html</code> drawing: in real colors, nothing changes.</p></div>
<div class="cap" data-t="12.5" data-step="font:1q: 1lh = 1px"><h3>4. <code>font:1q''</code>: 1lh = 1px</h3><p>The nested rule gives the <code>body</code> a font size of 1q = 0.945px. Its normal line height is then 1px. 97lh = 97px: the corners fit, 97 × 97, with 190px between them. Nothing fills the middle, so <code>html</code> shows through. 5lh = 5px: the white is just a dot at the tip of each corner.</p></div>
<div class="cap" data-t="17" data-step="scale:.21"><h3>5. <code>scale:.21</code></h3><p><code>scale:.21</code> shrinks the <code>body</code> around its center, (200, 150). Its area becomes 80.64 × 80.67, each corner 20.37 × 20.37, with 39.9px between two corners. Four red squares on the white disk: the holes of the button. The white dots now have a radius of 0.53px: they do not show.</p></div>
<div class="cap" data-t="21.5" data-step="Result" data-live="92 characters · 100% match"><h3>6. Result: 92 characters</h3><p>One <code>border-image</code> declaration, for two elements. In <code>html</code>, 1lh is 18px: a big disk. In the <code>body</code>, 1lh is 1px: four small squares.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0824 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const HA = $('.t0824-ha'), HU = $('.t0824-hu'), HC = $$('.t0824-hc'), live = $('.live');
  const B = $('.t0824-b'), BB = $('.t0824-bb'), BA = $('.t0824-ba'), BU = $('.t0824-bu'), BC = $$('.t0824-bc');
  const L = (k) => $(`.t0824-l[data-l="${k}"]`);
  const W = { hout: [0.6, 2.6], hc: 4.4, bb: [8.7, 9.2], ba: [9.3, 9.6], bout: [9.6, 10.9], bc: [11.1, 11.8], font: [13, 16], sc: [17.4, 19.8], fin: [21.5, 22.1] };
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const f2 = (v) => { const s = (Math.round(v * 100) / 100).toFixed(2).replace(/\.?0+$/, ''); return fr ? s.replace('.', ',') : s; };
  const O = 53 * 96 / 2.54 / 40; // 53q in px
  const c = fr ? ' :' : ':';
  const edge = 'inset 0 0 0 1px rgb(20 20 42 / .55)';
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < W.fin[0];
    const ann = 1 - pr(t, W.fin);
    const hRed = teach ? 'var(--t0824-th)' : 'var(--t0824-red)';
    const bRed = teach ? 'var(--t0824-tb)' : 'var(--t0824-red)';
    // 1. html: the outset grows the border image area
    const o = O * pr(t, W.hout);
    HA.style.top = `${-o}px`;
    HA.style.height = `${300 + 2 * o}px`;
    HA.style.opacity = win(t, 0.2, 8.9);
    HA.style.background = `rgb(255 255 255 / ${0.5 * (1 - pr(t, [4.2, 4.8]))})`;
    // 2. html: four corners of 200px, the whole gradient (an underlay hides the seams)
    const hg = `radial-gradient(#fff 90px, ${hRed} 0)`;
    let last = 0;
    HC.forEach((e, i) => {
      last = pr(t, [W.hc + 0.6 * i, W.hc + 0.6 * i + 0.5]);
      e.style.opacity = last;
      e.style.backgroundImage = hg;
      e.style.boxShadow = teach ? edge : 'none';
    });
    HU.style.opacity = last;
    HU.style.backgroundImage = hg;
    // 3-5. body: same border-image, then font:1q (1lh 18px -> 1px), then scale .21
    const ob = O * pr(t, W.bout), ah = 284 + 2 * ob;
    const lh = Math.pow(18, 1 - pr(t, W.font));
    const w = Math.min(97 * lh, 192, ah / 2);
    const R = 5 * lh * w / 192;
    const s = 1 - 0.79 * pr(t, W.sc);
    const lw = `${2 / s}px`;
    B.style.opacity = pr(t, W.bb);
    B.style.transform = `scale(${s})`;
    BB.style.borderWidth = lw;
    BB.style.opacity = ann;
    BA.style.top = `${-ob}px`;
    BA.style.height = `${ah}px`;
    BA.style.borderWidth = lw;
    BA.style.opacity = ann * pr(t, W.ba);
    const bc = pr(t, W.bc);
    const bg = `radial-gradient(#fff ${R}px, ${bRed} 0)`;
    const pos = [[0, -ob], [384 - w, -ob], [0, 284 + ob - w], [384 - w, 284 + ob - w]];
    BC.forEach((e, i) => {
      e.style.left = `${pos[i][0]}px`;
      e.style.top = `${pos[i][1]}px`;
      e.style.width = e.style.height = `${w}px`;
      e.style.backgroundImage = bg;
      e.style.backgroundSize = `${2 * w}px ${2 * w}px`;
      e.style.opacity = bc;
      e.style.boxShadow = teach ? `inset 0 0 0 ${1 / s}px rgb(20 20 42 / .55)` : 'none';
    });
    // while the corners touch (192px), an underlay with the whole gradient hides the seams
    BU.style.top = `${-ob}px`;
    BU.style.height = `${ah}px`;
    BU.style.backgroundImage = `radial-gradient(#fff ${5 * lh}px, ${bRed} 0)`;
    BU.style.opacity = bc * Math.min(1, Math.max(0, (w - 190.5) / 1.5));
    const lwin = [[0.2, 3.9], [4.2, 8.3], [8.7, 12.3], [12.7, 16.8], [17.2, 21.3]];
    lwin.forEach(([a, z], i) => (L(i + 1).style.opacity = win(t, a, z)));
    const area = fr ? 'zone' : 'area';
    let txt = '';
    if (step === 0) txt = `${fr ? 'débord' : 'outset'}${c} ${f2(o)}px · ${area} 400 × ${f2(300 + 2 * o)}`;
    else if (step === 1) txt = `97lh = 1746px → 200px · 5lh = 90px`;
    else if (step === 2) txt = `body · ${area} 384 × ${f2(ah)}${bc > 0 ? ` · ${fr ? 'coins' : 'corners'} ${f2(w)}px` : ''}`;
    else if (step === 3) txt = `1lh = ${f2(lh)}px · 97lh → ${f2(w)}px · 5lh = ${f2(5 * lh)}px`;
    else if (step === 4) txt = `scale${c} ${f2(s)} · ${fr ? 'coins' : 'corners'} ${f2(97 * s)}px`;
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
