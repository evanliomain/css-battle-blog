<div class="cap" data-t="0" data-step="Fond de html"><h3>1. Un fond pour html</h3><p><code>*</code> touche tous les éléments : html, head, body, p et style. html est la racine : son fond s'étend à tout le canevas. <code>2em</code> est le rayon du cercle : la police de html fait 16px, donc 32px. Blanc jusqu'à 62 % = 19,84px, orange jusqu'à <code>95q</code> = 89,76px, rouge jusqu'à 344 % = 110,08px, puis orange. Un anneau rouge et un petit disque blanc.</p></div>
<div class="cap" data-t="4.5" data-step="html tourne"><h3>2. html tourne</h3><p><code>rotate:90deg</code> touche aussi html. Sa boîte de 400 × 300 tourne autour de son centre, (200, 150), et se dresse en 300 × 400, de y = −50 à 350. Les cercles ont ce même centre : rien ne bouge sur le canevas.</p></div>
<div class="cap" data-t="9" data-step="body"><h3>3. body, une barre</h3><p>Le <code>+*</code> imbriqué veut dire <code>* + *</code> : un élément juste après un autre. Seul body convient, il suit head. Sa marge sans unité se lit en px en mode quirks : 400 − 2 × 70 = 260px de large, 300 − 2 × 135 = 30px de haut, en (70, 135). Sa police de <code>77q</code> fait 72,76px, donc <code>2em</code> vaut 145,51px et 62 % vaut 90,22px, plus que <code>95q</code> = 89,76px. L'orange n'a plus de place : blanc jusqu'à 90,22px du centre, puis rouge. Une barre blanche aux bouts rouges.</p></div>
<div class="cap" data-t="13.5" data-step="body tourne"><h3>4. body tourne deux fois</h3><p>body a son propre <code>rotate:90deg</code>, et il est dans html, déjà tourné de 90°. 90 + 90 = 180° : body tourne autour de (200, 150) et se retrouve à plat, à la même place. Ses bouts rouges dépassent de l'anneau, à gauche et à droite : deux tenons.</p></div>
<div class="cap" data-t="18" data-step="p"><h3>5. p, une deuxième barre</h3><p>p est dans body. Après <code>&lt;p></code> vient une espace insécable : elle ne disparaît pas, donc p a une ligne. p hérite de la police de body : hauteur de ligne 41 % × 72,76 = 29,83px. p fait 260 × 29,83, posé sur body, avec le même dégradé de 145,51px.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0617 = (fig) => {
  const fr = document.documentElement.lang === 'fr';

  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? ' :' : ':';
  const n2 = (v) => (fr ? String(v).replace('.', ',') : String(v));
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  // Measured on the official code in local Chrome (400 × 300 iframe, quirks mode, getBoundingClientRect, getComputedStyle):
  // html 400 × 300, rotate 90deg around (200, 150): bounding box (50, -50) 300 × 400; font 16px, gradient radius 32px.

  // p: layout 260 × 29.8281 at the top of body, transform-origin 130px 14.9141px; bounding box (185.086, 20.086) 29.828 × 260.
  const FIN = 27;
  const cv = $('.t0617-cv'), body = $('.t0617-body'), p = $('.t0617-p');
  const hb = $('.t0617-hb'), bb = $('.t0617-bb'), pb = $('.t0617-pb');
  const labs = $$('.zlab');
  return (t, step) => {
    const wide = fig.dataset.view === 'wide';
    const teach = fig.dataset.teach === '1';
    const tw = teach ? 1 - pr(t, [FIN, FIN + 0.8]) : 0;
    const g = pr(t, [0.4, 2.4]);
    const disc = mix(tw, 'var(--t0617-dk)', '#fff');
    cv.style.background = `radial-gradient(circle at 200px 150px, ${disc} ${19.84 * g}px, #e8ad6d 0 ${89.76 * g}px, #a84a4b 0 ${110.08 * g}px, #e8ad6d 0)`;
    const ha = `rotate(${90 * pr(t, [5, 7.2])}deg)`;
    hb.style.transform = ha;
    hb.style.opacity = Math.min(pr(t, [4.6, 5]), 1 - pr(t, [FIN, FIN + 0.6]));
    const bw = mix(tw, 'var(--t0617-bw)', '#fff'), br = mix(tw, 'var(--t0617-br)', '#a84a4b');
    const pw = mix(tw, 'var(--t0617-pw)', '#fff'), pr2 = mix(tw, 'var(--t0617-pr)', '#a84a4b');
    body.style.background = `radial-gradient(circle at 50% 50%, ${bw} 90.22px, ${br} 0)`;
    p.style.background = `radial-gradient(circle at 50% 50%, ${pw} 90.22px, ${pr2} 0)`;
    const bo = pr(t, [9.4, 10.4]);
    body.style.opacity = bo;
    const ba = `rotate(${180 * pr(t, [14, 16.6])}deg)`;
    body.style.transform = ba;
    bb.style.transform = ba;
    bb.style.opacity = Math.min(bo, 1 - pr(t, [FIN, FIN + 0.6]));
    const po = pr(t, [18.4, 19.4]);
    p.style.opacity = po;
    const pa = `rotate(${90 * pr(t, [23, 25.2])}deg)`;
    p.style.transform = pa;
    pb.style.transform = pa;
    pb.style.opacity = Math.min(po, 1 - pr(t, [FIN, FIN + 0.6]));
    labs.forEach((l) => {
      const n = +l.dataset.l, second = l.classList.contains('t0617-l2');
      l.style.left = `calc(${wide ? 440 : 400}px - 4px * var(--k, 1))`;
      l.style.top = wide ? `calc(410px - ${second ? 22 : 40}px * var(--k, 1))` : `calc(${second ? 20 : 4}px * var(--k, 1))`;
      const ivs = [[0.3, 4.5], [4.8, 9], [9.3, 13.5], [13.8, 18], [18.3, 22.5], [22.8, FIN]];
      l.style.opacity = win(t, ...ivs[n - 1]);
    });
    let txt;
    if (step === 0) txt = `html${c} 2em = 32px · ${fr ? 'anneau' : 'ring'} ${n2(89.76)} → ${n2(110.08)}`;
    else if (step === 1) txt = `html${c} 300 × 400, 90°`;
    else if (step === 2) txt = `body${c} 260 × 30 · 2em = ${n2(145.51)}px`;
    else if (step === 3) txt = `body${c} 90° + 90° = 180°`;
    else if (step === 4) txt = `p${c} 260 × ${n2(29.83)}`;
    else if (step === 5) txt = `p${c} 90° + 180° = 270°`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
