  const f2 = (v) => { const s = (Math.round(v * 100) / 100).toFixed(2).replace(/\.?0+$/, ''); return fr ? s.replace('.', ',') : s; };
  const f3 = (v) => { const s = v.toFixed(3); return fr ? s.replace(".", ",") : s; };

  const R = { canvas: [0, 0, 400, 300], html: [-80, 60, 560, 180], body: [200, 110.39, 0, 79.22] };
