<pre class="code" aria-hidden="true">&lt;style><span data-on="1 2">*{</span><span data-on="1 5">margin:40 90</span>;<span data-on="2" data-tone="2">background:#E38F66</span>;<span data-on="1 2 5">border:</span><span data-on="3" data-tone="2">dashed</span><span data-on="1 2 5"> 5em#F7EC7D</span>;<span data-on="2">*{</span><span data-on="2">margin:-120-185-30</span>;<span data-on="4">scale:2 1</span></pre>
<div class="now" aria-live="polite">
<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="html"><h3>1. html : un cadre plein</h3><p>Pas de doctype : la page est en mode quirks. Un nombre sans unité compte en px, et html s'étire sur la hauteur de la fenêtre. <code>*</code> vise d'abord html : <code>margin:40 90</code> donne une boîte de 220 × 220, de x = 90 à 310 et de y = 40 à 260. Sa bordure fait <code>5em</code> = 80px. Elle est en tirets, mais dans mon rendu elle sort pleine : un cadre jaune autour d'un trou de 60 × 60.</p></div>
<div class="cap" data-t="5" data-step="body"><h3>2. body : une boîte très large</h3><p>Le <code>*{</code> imbriqué vise body (head et style sont masqués). Il reçoit le même fond orange et la même bordure. <code>margin:-120-185-30</code> le tire de 120px vers le haut et de 185px vers l'extérieur de chaque côté : x = −15 à 415, à partir de y = 0. En mode quirks, body s'étire pour remplir les 60px du contenu de html : 60 + 120 + 30 = 210px de haut. Son fond cache le cadre de html.</p></div>
<div class="cap" data-t="10" data-step="Les tirets"><h3>3. dashed : deux trous</h3><p>Les côtés haut et bas de body font 430px de long. Dans mon rendu, Chrome dessine chacun en jaune, orange, jaune : 160px, 110px, 160px. Les côtés gauche et droit restent pleins. Les trous de 110px laissent voir le fond orange de body.</p></div>
<div class="cap" data-t="15" data-step="L'étirement"><h3>4. scale:2 1 : deux fois plus large</h3><p><code>scale:2 1</code> double la largeur de body autour de son centre, x = 200. body va maintenant de x = −230 à 630. Les trous passent à 220px : de x = 90 à 310. Les bouts jaunes deviennent quatre blocs de 90 × 80 sur les bords du canevas. Les côtés gauche et droit sortent du canevas.</p></div>
<div class="cap" data-t="20" data-step="La barre"><h3>5. La barre : la bordure de html dépasse</h3><p>body finit en y = 210. En dessous, la bordure basse de html est toujours là, de y = 180 à 260. Ses 50px du bas se voient : une barre de 220 × 50, de x = 90 à 310. En couleurs pédagogiques, le fond de body devient transparent un instant pour montrer le cadre de html dessous.</p></div>
<div class="cap" data-t="25" data-step="Résultat" data-live="96 caractères · 100 % identique"><h3>6. Résultat : 96 caractères</h3><p>Une seule règle donne la même bordure à html et à body. La bordure de html fait la barre. Les tirets de body, étirés deux fois plus large, font les quatre blocs.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html"><h3>1. html: a solid frame</h3><p>There is no doctype: the page is in quirks mode. A number with no unit counts as px, and html stretches to the height of the window. <code>*</code> first targets html: <code>margin:40 90</code> gives a 220 × 220 box, from x = 90 to 310 and y = 40 to 260. Its border is <code>5em</code> = 80px. It is dashed, but in my render it comes out solid: a yellow frame around a 60 × 60 hole.</p></div>
<div class="cap" data-t="5" data-step="body"><h3>2. body: a very wide box</h3><p>The nested <code>*{</code> targets body (head and style are hidden). It gets the same orange background and the same border. <code>margin:-120-185-30</code> pulls it 120px up and 185px out on each side: x = −15 to 415, from y = 0. In quirks mode, body stretches to fill html's 60px of content: 60 + 120 + 30 = 210px tall. Its background hides html's frame.</p></div>
<div class="cap" data-t="10" data-step="The dashes"><h3>3. dashed: two gaps</h3><p>body's top and bottom sides are 430px long. In my render, Chrome draws each one as yellow, orange, yellow: 160px, 110px, 160px. The left and right sides stay solid. The 110px gaps show body's orange background.</p></div>
<div class="cap" data-t="15" data-step="The stretch"><h3>4. scale:2 1: twice as wide</h3><p><code>scale:2 1</code> doubles body's width around its center, x = 200. body now runs from x = −230 to 630. The gaps grow to 220px: from x = 90 to 310. The yellow ends become four 90 × 80 blocks on the canvas edges. The left and right sides go off the canvas.</p></div>
<div class="cap" data-t="20" data-step="The bar"><h3>5. The bar: html's border peeks out</h3><p>body ends at y = 210. Below it, html's bottom border is still there, from y = 180 to 260. Its lower 50px show: a 220 × 50 bar, from x = 90 to 310. With teaching colors, body's background turns see-through for a moment, to show html's frame under it.</p></div>
<div class="cap" data-t="25" data-step="Result" data-live="96 characters · 100% match"><h3>6. Result: 96 characters</h3><p>One rule gives html and body the same border. html's border makes the bar. body's dashes, stretched twice as wide, make the four blocks.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0726 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const mix = (a, b, p) => a + (b - a) * p;
  const c = fr ? '\u00a0:' : ':';
  const n = (x) => (x < 0 ? '−' + Math.abs(x) : String(x));
  // Measured on the official code in local Chrome (quirks mode, 400 × 300):
  // html 90..310 × 40..260 (quirks: 300 - 40 - 40 = 220 tall), border 80px, content 170..230 × 120..180; its dashed border renders solid.
  // body (layout) -15..415 × 0..210 (quirks: margin box = html's 60px content, 60 + 120 + 30 = 210), border 80px, content 65..335 × 80..130.
  // body's top and bottom sides: yellow 160, gap 110, yellow 160; left and right sides solid.
  // scale:2 1 around x = 200: body -230..630; canvas blocks 0..90 and 310..400 at y 0..80 and 130..210; bar 90..310 × 210..260.
  const FIN = 25;
  const html = $('.t0726-html'), body = $('.t0726-body'), bg = $('.t0726-bg');
  const ys = $$('.t0726-y'), ends = $$('.t0726-end');
  const bxH = $('.t0726-bxh'), bxC = $('.t0726-bxc'), bxB = $('.t0726-bxb'), bxR = $('.t0726-bxr');
  const L = (k) => $$(`.t0726-l[data-l="${k}"]`);
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    const ann = 1 - pr(t, [FIN, FIN + 0.6]);
    const v = (k, r) => `var(--t0726-${teach ? k : r})`;
    // 1. html's frame: the border grows inward from 0 to 80px
    const hb = 80 * pr(t, [0.6, 2.4]);
    html.style.borderWidth = `${hb}px`;
    html.style.borderColor = v('hb', 'ye');
    // 2. body: its box grows from html's content box to -15..415 × 0..210, then fills in
    const g = pr(t, [5.6, 7.4]);
    body.style.opacity = pr(t, [7.4, 8.4]);
    bg.style.background = v('bb', 'or');
    bg.style.opacity = teach ? 1 - 0.6 * win(t, 20.6, 24.4) : 1;
    ys.forEach((e) => (e.style.background = v('bd', 'ye')));
    // 3. dashed: a 110px gap opens in the top and bottom sides (2px overlap while closed)
    const d = pr(t, [10.6, 12.6]);
    ends.forEach((e) => (e.style.width = `${160 + 56 * (1 - d)}px`));
    // 4. scale:2 1 around x = 200
    const s = 1 + pr(t, [15.6, 17.8]);
    body.style.transform = `scaleX(${s})`;
    bxB.style.left = `${mix(170, 200 - 215 * s, g)}px`;
    bxB.style.top = `${mix(120, 0, g)}px`;
    bxB.style.width = `${mix(60, 430 * s, g)}px`;
    bxB.style.height = `${mix(60, 210, g)}px`;
    bxH.style.opacity = 0.9 * win(t, 0.3, 4.8);
    bxC.style.opacity = 0.9 * win(t, 2.4, 7.6);
    bxB.style.opacity = 0.9 * Math.max(win(t, 5.3, 9.8), win(t, 15.3, 19.8));
    bxR.style.opacity = 0.9 * win(t, 20.3, 24.8);
    [[0.3, 4.8], [5.3, 9.8], [10.3, 14.8], [15.3, 19.8], [20.3, 24.8]].forEach(([p, z], k) => L(k + 1).forEach((e) => (e.style.opacity = win(t, p, z) * ann)));
    let txt;
    if (step === 0) txt = `html${c} 220 × 220 · ${fr ? 'bordure' : 'border'} ${Math.round(hb)}px`;
    else if (step === 1) txt = `body${c} 430 × 210 · x = −15 … 415`;
    else if (step === 2) txt = `${fr ? 'haut et bas' : 'top and bottom'}${c} ${Math.round(215 - 55 * d)} + ${Math.round(110 * d)} + ${Math.round(215 - 55 * d)}`;
    else if (step === 3) txt = `body${c} ${Math.round(430 * s)}px · x = ${n(Math.round(200 - 215 * s))} … ${Math.round(200 + 215 * s)}`;
    else if (step === 4) txt = `${fr ? 'barre' : 'bar'}${c} 220 × 50 · y = 210 … 260`;
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
