<figure class="anim t0912" data-duration="16" data-scene="t0912" data-wide="-40 -30 480 360" data-off-label="-36 -26" style="--bg:#1d025e">

</style>
<div class="anim-col">
<div class="stage" role="img" aria-label="{% if include.lang == "fr" %}Animation : un dégradé radial donne un disque crème au fond de html : la tête de la clé ; le body, zoomé neuf fois, devient une bande de 50,8px qui monte très au-dessus du canevas ; son fond, le même dégradé neuf fois plus grand, est crème en bas et bleu nuit en haut : le manche et la fente{% else %}Animation: a radial gradient gives html's background a cream disc: the head of the wrench; the body, zoomed nine times, becomes a 50.8px strip that rises far above the canvas; its background, the same gradient nine times bigger, is cream at the bottom and navy at the top: the handle and the slot{% endif %}">
<div class="scene">
<div class="t0912-can"></div>
<div class="t0912-body"><i data-i="n" style="background:var(--t0912-n)"></i><i data-i="g" style="background:radial-gradient(circle 8.5px,var(--t0912-c) 450.7px,var(--t0912-n)) 0 -493.2px"></i></div>
<div class="t0912-o" data-o="body" style="left:174.6px;top:-1332px;width:50.8px;height:1587px"></div>
<div class="t0912-ring" style="left:-250.7px;top:104.6px;width:901.4px;height:901.4px"></div>
<span class="zlab t0912-l-h" style="left:12px;top:244px">53q = {% if include.lang == "fr" %}50,08{% else %}50.08{% endif %} · 0 −58q → y = 150 − {% if include.lang == "fr" %}54,8{% else %}54.8{% endif %}</span>
<span class="zlab t0912-l-b" style="left:12px;top:244px">zoom:9 · 19.4 × 9 = {% if include.lang == "fr" %}174,6{% else %}174.6{% endif %} · −333%</span>
<span class="zlab t0912-l-g" style="left:12px;top:244px">53q × 9 = {% if include.lang == "fr" %}450,7{% else %}450.7{% endif %} · {% if include.lang == "fr" %}centre{% else %}centre{% endif %} y = {% if include.lang == "fr" %}555,3{% else %}555.3{% endif %}</span>
</div>
</div>
<div class="legend"><span><i style="--c:var(--t0912-c)"></i>{% if include.lang == "fr" %}disque du dégradé{% else %}gradient disc{% endif %}</span><span><i style="--c:var(--t0912-n)"></i>{% if include.lang == "fr" %}hors du disque{% else %}outside the disc{% endif %}</span></div>
</div>
<div class="anim-side">
<pre class="code" aria-hidden="true">&lt;style>*{background:<span data-on="1 3" data-tone="2">radial-gradient(1Q,#f5e3b5 53q,#1d025e)0-58q</span>;*{<span data-on="2">margin:-333%19.4 5</span>;<span data-on="2 3" data-tone="2">zoom:9</span></pre>
<div class="now" aria-live="polite">
<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="Un disque : la tête"><h3>1. Un disque : la tête</h3><p>Le fond de <code>html</code> va au canevas. <code>radial-gradient(1Q,…)</code> : un cercle de rayon <code>1Q</code>, mais le crème va jusqu'à <code>53q</code> (50,08px), puis bleu nuit : un disque net de rayon 50,08. La tuile fait tout le canevas ; <code>0-58q</code> la remonte de 54,8px. Le disque est centré en (200 ; 95,2) : la tête de la clé.</p></div>
<div class="cap" data-t="4" data-step="Le body zoomé : une bande"><h3>2. Le <code>body</code> zoomé : une bande</h3><p><code>*</code> imbriqué donne au <code>body</code> <code>zoom:9</code> et <code>margin:-333%19.4 5</code>. Les côtés font 19,4 × 9 = 174,6 : le <code>body</code> va de x = 174,6 à 225,4. Une marge en % suit la largeur du parent : −333 % de 400 = −1332, il commence très au-dessus du canevas. En mode quirks, il descend jusqu'à 300 − 5 × 9 = 255.</p></div>
<div class="cap" data-t="8" data-step="Le même disque, neuf fois plus grand"><h3>3. Le même disque, neuf fois plus grand</h3><p>Le <code>body</code> a le même fond, zoomé lui aussi : un disque de rayon 450,7, dans une tuile de 50,8 × 1587 remontée de 58q × 9 = 493,2. La tuile se répète, et celle du dessous a son disque centré en y = 555,3, sous le canevas. Son bord passe en y = 104,6, presque droit sur 50,8px : crème en dessous (le manche), bleu nuit au-dessus (la fente dans la tête).</p></div>
<div class="cap" data-t="12" data-step="Résultat" data-live="92 caractères · 100 % identique"><h3>4. Résultat : 92 caractères</h3><p>Un seul dégradé : la tête sur <code>html</code>, le manche et la fente sur le <code>body</code> zoomé.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="A disc: the head"><h3>1. A disc: the head</h3><p><code>html</code>'s background goes to the canvas. <code>radial-gradient(1Q,…)</code>: a circle of radius <code>1Q</code>, but the cream goes up to <code>53q</code> (50.08px), then navy: a sharp disc of radius 50.08. The tile is the whole canvas; <code>0-58q</code> moves it 54.8px up. The disc is centred at (200, 95.2): the head of the wrench.</p></div>
<div class="cap" data-t="4" data-step="The zoomed body: a strip"><h3>2. The zoomed <code>body</code>: a strip</h3><p>The nested <code>*</code> gives the <code>body</code> <code>zoom:9</code> and <code>margin:-333%19.4 5</code>. The sides are 19.4 × 9 = 174.6: the <code>body</code> runs from x = 174.6 to 225.4. A margin in % follows the parent's width: −333% of 400 = −1332, so it starts far above the canvas. In quirks mode, it goes down to 300 − 5 × 9 = 255.</p></div>
<div class="cap" data-t="8" data-step="The same disc, nine times bigger"><h3>3. The same disc, nine times bigger</h3><p>The <code>body</code> has the same background, zoomed too: a disc of radius 450.7, in a 50.8 × 1587 tile moved up by 58q × 9 = 493.2. The tile repeats, and the one below has its disc centred at y = 555.3, under the canvas. Its edge passes at y = 104.6, almost flat over 50.8px: cream below (the handle), navy above (the slot in the head).</p></div>
<div class="cap" data-t="12" data-step="Result" data-live="92 characters · 100% match"><h3>4. Result: 92 characters</h3><p>One gradient: the head on <code>html</code>, the handle and the slot on the zoomed <code>body</code>.</p></div>
{%- endif %}
</div>
<div class="live"></div>
</div>
</div>
<script>
(window.AnimScenes = window.AnimScenes || {}).t0912 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const CAN = $('.t0912-can'), BODY = $('.t0912-body'), N = $('[data-i="n"]'), G = $('[data-i="g"]'), oB = $('[data-o="body"]'), RING = $('.t0912-ring'), live = $('.live');
  const L = (k) => $(`.t0912-l-${k}`);
  const W = { h: [0.3, 1.8], b: [4.2, 5.8], g: [8.2, 9.8], fin: [12.1, 12.9] };
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const lerp = (a, b, m) => a + (b - a) * m;
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const f1 = (v) => { const s = (Math.round(v * 100) / 100).toFixed(2).replace(/\.?0+$/, ''); return (fr ? s.replace('.', ',') : s).replace('-', '−'); };
  const c = fr ? ' :' : ':';
  return (t, step) => {
    const guides = t < W.fin[0] ? 1 : 0;
    const h = pr(t, W.h), b = pr(t, W.b), g = pr(t, W.g);
    // 1. html's disc grows, then sits 54.8px above the centre
    CAN.style.background = `radial-gradient(circle 0.945px, var(--t0912-c) ${50.08 * h}px, var(--t0912-n)) 0 ${-54.8 * h}px`;
    // 2. the body box, 3. its own gradient
    BODY.style.opacity = b > 0 ? 1 : 0;
    N.style.opacity = 1 - g;
    G.style.opacity = g;
    oB.style.opacity = b * (step === 1 || step === 2 ? 1 : 0) * guides;
    RING.style.opacity = g * (step === 2 ? 1 : 0) * guides;
    L('h').style.opacity = win(t, W.h[0], W.b[0] - 0.2);
    L('b').style.opacity = win(t, W.b[0], W.g[0] - 0.2);
    L('g').style.opacity = win(t, W.g[0], W.fin[0]);
    let txt = '';
    if (step === 0) txt = `${fr ? 'tête' : 'head'}${c} r ${f1(50.08 * h)}, y ${f1(150 - 54.8 * h)}`;
    else if (step === 1) txt = `body${c} x 174,6 → 225,4, y −1332 → 255`.replace(/(\d),(\d)/g, fr ? '$1,$2' : '$1.$2');
    else if (step === 2) txt = `${fr ? 'bord du disque' : 'disc edge'}${c} y ${f1(104.6)}`;
    else txt = $$('.caps .cap')[3].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
</figure>
