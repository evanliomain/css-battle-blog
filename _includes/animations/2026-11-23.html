<figure class="anim t1123" data-duration="26" data-scene="t1123" data-wide="-75 -160 550 620" data-off-label="-70 440" style="--bg:#f8b140">
<style>
.t1123{--t1123-o:#cf6939;--t1123-d:#2f434e;--t1123-y:#f8b140;--t1123-html:#4dabf7;--t1123-body:#f783ac}
.t1123 .t1123-cv{position:absolute;left:-100px;top:-200px;width:600px;height:700px;background:var(--t1123-o)}

<div class="anim-col">
<div class="stage" role="img" aria-label="{% if include.lang == "fr" %}Animation : la règle * donne à html et au body les marges 35 -35, border-radius:9in et le fond ; & vise html, qui prend les marges -146 -61, d'où une boîte de 522 × 592 en (-61, -146), et une bordure de 6cm, dessinée à 226 px, qui couvre tout le canevas sauf un trou de 70 × 140 ; le rayon 9in, trop grand, est réduit à 261 px, et le rayon intérieur vaut 261 − 226 = 35 : le trou devient un stade debout ; le fond de html passe au canevas, en tuiles de 70 × 140 centrées en (200, 150), avec un anneau ardoise de 4,72 à 15,11 px ; le body, 140 × 70 en (130, 115), arrondi à 35, porte le même fond centré au même point : il ajoute le stade couché, peint par-dessus la bordure{% else %}Animation: the * rule gives html and the body the margins 35 -35, border-radius:9in and the background; & targets html, which takes the margins -146 -61, so a 522 × 592 box at (-61, -146), and a 6cm border, drawn at 226px, that covers the whole canvas except a 70 × 140 hole; the 9in radius is too big and shrinks to 261px, and the inner radius is 261 − 226 = 35: the hole becomes a standing stadium; html's background goes to the canvas, in 70 × 140 tiles centered on (200, 150), with a slate ring from 4.72 to 15.11px; the body, 140 × 70 at (130, 115), rounded to 35, has the same background centered on the same point: it adds the lying stadium, painted over the border{% endif %}">

<div class="t1123-bd"></div>

<span class="zlab t1123-l-c" style="left:4px;top:4px">9in = 864 → 261 · 261 − 226 = 35</span>

</div>

</div>
<div class="anim-side">
<pre class="code" aria-hidden="true">&lt;style><span data-on="1 5" data-tone="2">*</span>{<span data-on="5">margin:<span class="t1123-k t1123-k7">35</span>-<span class="t1123-k t1123-k8">35</span></span>;<span data-on="3 5">border-radius:<span class="t1123-k t1123-k4">9</span>in</span>;<span data-on="4 5">background:radial-gradient(1q,#CF6939 <span class="t1123-k t1123-k5">5</span>q,#2F434E 0 <span class="t1123-k t1123-k6">16</span>q,#CF6939)</span>}<span data-on="1 2 3" data-tone="2">&amp;</span>{<span data-on="1">margin:-<span class="t1123-k t1123-k1">146</span>-<span class="t1123-k t1123-k2">61</span></span>;<span data-on="2">border:<span class="t1123-k t1123-k3">6</span>cm solid#F8B140</span></pre>
<div class="now" aria-live="polite">
<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="Deux règles, deux boîtes"><h3>1. Deux règles, deux boîtes</h3><p><code>*</code> vise tous les éléments : <code>html</code> et le <code>body</code> reçoivent les marges <code>35-35</code>, <code>border-radius:9in</code> et le fond (<code>head</code> et <code>style</code> sont cachés). <code>&amp;</code> seul, hors de toute règle, vise la racine, <code>html</code> : il prend les marges <code>-146-61</code> à la place, et la bordure. En mode quirks, <code>html</code> remplit la fenêtre moins ses marges : 400 + 2 × 61 = 522 de large, 300 + 2 × 146 = 592 de haut, à partir de (−61, −146).</p></div>
<div class="cap" data-t="4" data-step="Une bordure de 226 px"><h3>2. Une bordure de 226 px</h3><p><code>6cm</code> font 226,77px, et Chrome dessine la bordure à 226. 522 − 2 × 226 = 70 et 592 − 2 × 226 = 140 : la bordure couvre tout le canevas sauf un trou de 70 × 140, de x = 165 à 235 et de y = 80 à 220 (−61 + 226 = 165, −146 + 226 = 80). Sa couleur est celle du fond de la cible.</p></div>
<div class="cap" data-t="8" data-step="Un rayon trop grand"><h3>3. Un rayon trop grand</h3><p><code>9in</code> font 864px. Quand les rayons ne tiennent pas, le navigateur les réduit tous du même facteur : 522 / (2 × 864). Chaque coin passe à 261, la moitié de la largeur : le dehors de <code>html</code> est un stade de 522 × 592. Au bord intérieur de la bordure, le rayon vaut 261 − 226 = 35 : le trou devient un stade de 70 × 140, les pétales du haut et du bas.</p></div>
<div class="cap" data-t="12" data-step="L'anneau, sur le canevas"><h3>4. L'anneau, sur le canevas</h3><p>Le fond de <code>html</code> passe au canevas, en tuiles grandes comme le trou, 70 × 140, centrées en (200, 150). <code>radial-gradient(1q,…)</code> : la forme est un cercle de 0,94px, mais les arrêts sont des longueurs. Orange jusqu'à 5q = 4,72px, ardoise de 4,72 à 16q = 15,11px. Le dernier orange n'a pas de position : 100 % = 0,94px, ramené à 15,11, donc il commence net. Les copies, tous les 70px en largeur et 140px en hauteur, restent sous la bordure.</p></div>
<div class="cap" data-t="17" data-step="Le body"><h3>5. Le <code>body</code></h3><p>En mode quirks, le <code>body</code> remplit la boîte de contenu de <code>html</code> moins ses marges : 140 − 2 × 35 = 70 de haut, 70 + 2 × 35 = 140 de large, à partir de (130, 115). Même rayon : réduit à 35. Même fond, même centre (200, 150) : son anneau tombe pile sur celui du canevas. Le <code>body</code> est peint par-dessus la bordure : ce sont les pétales de gauche et de droite.</p></div>
<div class="cap" data-t="22" data-step="Résultat" data-live="144 caractères · 100 % identique"><h3>6. Résultat : 144 caractères</h3><p>Deux stades : un trou dans une bordure, et le <code>body</code>. Un seul anneau, dessiné deux fois au même endroit.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="Two rules, two boxes"><h3>1. Two rules, two boxes</h3><p><code>*</code> targets every element: <code>html</code> and the <code>body</code> get the margins <code>35-35</code>, <code>border-radius:9in</code> and the background (<code>head</code> and <code>style</code> are hidden). <code>&amp;</code> alone, outside any rule, targets the root, <code>html</code>: it takes the margins <code>-146-61</code> instead, and the border. In quirks mode, <code>html</code> fills the window minus its margins: 400 + 2 × 61 = 522 wide, 300 + 2 × 146 = 592 tall, from (−61, −146).</p></div>
<div class="cap" data-t="4" data-step="A 226px border"><h3>2. A 226px border</h3><p><code>6cm</code> is 226.77px, and Chrome draws the border at 226. 522 − 2 × 226 = 70 and 592 − 2 × 226 = 140: the border covers the whole canvas except a 70 × 140 hole, from x = 165 to 235 and y = 80 to 220 (−61 + 226 = 165, −146 + 226 = 80). Its color is the target's background.</p></div>
<div class="cap" data-t="8" data-step="A radius too big"><h3>3. A radius too big</h3><p><code>9in</code> is 864px. When the radii don't fit, the browser shrinks them all by the same factor: 522 / (2 × 864). Each corner becomes 261, half the width: the outside of <code>html</code> is a 522 × 592 stadium. On the inner edge of the border, the radius is 261 − 226 = 35: the hole becomes a 70 × 140 stadium, the top and bottom petals.</p></div>
<div class="cap" data-t="12" data-step="The ring, on the canvas"><h3>4. The ring, on the canvas</h3><p><code>html</code>'s background goes to the canvas, in tiles as big as the hole, 70 × 140, centered on (200, 150). <code>radial-gradient(1q,…)</code>: the shape is a 0.94px circle, but the stops are lengths. Orange up to 5q = 4.72px, slate from 4.72 to 16q = 15.11px. The last orange has no position: 100% = 0.94px, pulled up to 15.11, so it starts sharp. The copies, every 70px across and 140px down, stay under the border.</p></div>
<div class="cap" data-t="17" data-step="The body"><h3>5. The <code>body</code></h3><p>In quirks mode, the <code>body</code> fills <code>html</code>'s content box minus its margins: 140 − 2 × 35 = 70 tall, 70 + 2 × 35 = 140 wide, from (130, 115). Same radius: shrunk to 35. Same background, same center (200, 150): its ring lands right on the canvas ring. The <code>body</code> is painted over the border: these are the left and right petals.</p></div>
<div class="cap" data-t="22" data-step="Result" data-live="144 characters · 100% match"><h3>6. Result: 144 characters</h3><p>Two stadiums: a hole in a border, and the <code>body</code>. One ring, drawn twice at the same spot.</p></div>
{%- endif %}
</div>

</div>
<script>
(window.AnimScenes = window.AnimScenes || {}).t1123 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const CV = $('.t1123-cv'), HB = $('.t1123-hb'), BD = $('.t1123-bd'), OH = $('.t1123-oh'), OP = $('.t1123-op'), OB = $('.t1123-ob'), live = $('.live');
  const K = (n) => $$(`.t1123-k${n}`);
  const L = (k) => $(`.t1123-l-${k}`);
  // measured in Chrome: html 522 × 592 at (-61, -146), border 226px (6cm = 226.77), so a 70 × 140 padding box at (165, 80)
  // body 140 × 70 at (130, 115); 9in = 864px, clamped to 261 on html (inner 35) and to 35 on the body
  // 5q = 4.72px, 16q = 15.11px; the canvas background repeats on 70 × 140 tiles from (165, 80)
  const R1 = 4.71875, R2 = 15.1094, BW = 226, RMAX = 261;
  const W = { m: [0.4, 2.8], b: [4.4, 6.8], r: [8.4, 10.8], g: [12.4, 14.2], y: [17.4, 19.6], fin: [22.1, 22.8] };
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const num = (v, d) => v.toFixed(d).replace('.', fr ? ',' : '.');
  const c = fr ? ' :' : ':';
  const ring = (col, k) => `radial-gradient(circle,${col} ${R1 * k}px,var(--t1123-d) ${R1 * k}px ${R2 * k}px,${col} ${R2 * k}px)`;
  return (t, st) => {
    const step = st + 1;
    const teach = fig.dataset.teach === '1';
    const fin = t >= W.fin[0];
    const m = pr(t, W.m), b = pr(t, W.b), r = pr(t, W.r), g = pr(t, W.g), y = pr(t, W.y);
    // html's box: margins -146 -61 on a 400 × 300 window
    const hx = -61 * m, hy = -146 * m, hw = 400 + 122 * m, hh = 300 + 292 * m;
    const bw = BW * b;
    // the radius follows 9in until it reaches the clamp (261)
    const asked = 864 * r, R = Math.min(RMAX, asked);
    // step 4: the border turns see-through for a moment, to show the copies of the ring
    const see = Math.min(pr(t, [14.4, 15.0]), 1 - pr(t, [16.0, 16.6]));
    // the canvas: html's background, tiled on its padding box (70 × 140 from (165, 80), so (265, 280) in this layer)
    CV.style.background = `${ring('var(--t1123-o)', g)} 265px 280px / 70px 140px`;
    Object.assign(HB.style, {
      left: `${hx}px`, top: `${hy}px`, width: `${hw}px`, height: `${hh}px`,
      borderWidth: `${bw}px`, borderRadius: `${R}px`,
      borderColor: teach && !fin ? 'var(--t1123-html)' : 'var(--t1123-y)',
      opacity: 1 - 0.8 * see,
    });
    // the body: html's content box minus its margins 35 -35; radius 9in clamps to half the short side
    const bx = 165 - 35 * y, by = 80 + 35 * y, bww = 70 + 70 * y, bh = 140 - 70 * y;
    Object.assign(BD.style, {
      left: `${bx}px`, top: `${by}px`, width: `${bww}px`, height: `${bh}px`, borderRadius: `${Math.min(bww, bh) / 2}px`,
      opacity: pr(t, [17.0, 17.4]),
      background: ring(teach && !fin ? 'var(--t1123-body)' : 'var(--t1123-o)', 1),
    });
    // outlines
    const oo = fin ? 0 : 1;
    Object.assign(OH.style, { left: `${hx}px`, top: `${hy}px`, width: `${hw}px`, height: `${hh}px`, borderRadius: `${R}px`, opacity: oo });
    OH.firstElementChild.textContent = `html ${Math.round(hw)} × ${Math.round(hh)}`;
    Object.assign(OP.style, { left: '165px', top: '80px', width: '70px', height: '140px', borderRadius: `${Math.max(0, R - BW)}px`, opacity: win(t, W.b[0] + 1.2, W.y[0]) });
    Object.assign(OB.style, { left: `${bx}px`, top: `${by}px`, width: `${bww}px`, height: `${bh}px`, borderRadius: `${Math.min(bww, bh) / 2}px`, opacity: oo * pr(t, [17.0, 17.4]) });
    OB.firstElementChild.textContent = `body ${Math.round(bww)} × ${Math.round(bh)}`;
    // digits in the code
    K(1).forEach((k) => (k.textContent = String(Math.round(146 * m))));
    K(2).forEach((k) => (k.textContent = String(Math.round(61 * m))));
    K(3).forEach((k) => (k.textContent = step < 2 ? '6' : String(Math.round(6 * b))));
    K(4).forEach((k) => (k.textContent = step < 3 ? '9' : String(Math.round(9 * r))));
    K(5).forEach((k) => (k.textContent = step < 4 ? '5' : String(Math.round(5 * g))));
    K(6).forEach((k) => (k.textContent = step < 4 ? '16' : String(Math.round(16 * g))));
    K(7).forEach((k) => (k.textContent = step < 5 ? '35' : String(Math.round(35 * y))));
    K(8).forEach((k) => (k.textContent = step < 5 ? '35' : String(Math.round(35 * y))));
    L('a').style.opacity = win(t, 0.3, W.b[0] - 0.3);
    L('b').style.opacity = win(t, W.b[0], W.r[0] - 0.3);
    L('c').style.opacity = win(t, W.r[0], W.g[0] - 0.3);
    L('d').style.opacity = win(t, W.g[0], 17.0);
    L('e').style.opacity = win(t, 17.1, W.fin[0]);
    // live line
    let txt = '';
    if (step === 1) txt = `html${c} ${Math.round(hw)} × ${Math.round(hh)}`;
    else if (step === 2) txt = `border${c} ${Math.round(bw)}px → ${Math.round(hw - 2 * bw)} × ${Math.round(hh - 2 * bw)}`;
    else if (step === 3) txt = `${Math.round(asked)}px → ${Math.round(R)} · ${fr ? 'intérieur' : 'inside'} ${Math.round(Math.max(0, R - BW))}`;
    else if (step === 4) txt = `5q = ${num(R1 * g, 2)} · 16q = ${num(R2 * g, 2)}`;
    else if (step === 5) txt = `body${c} ${Math.round(bww)} × ${Math.round(bh)}`;
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
</figure>
