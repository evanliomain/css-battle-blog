{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="Le dégradé"><h3>1. Un cercle de 1Q</h3><p>Le <code>*</code> donne le même fond à tous les éléments. html est l'élément racine : son fond couvre le canevas, et son dégradé est centré en (200, 150). <code>radial-gradient(1Q,</code> en fait un cercle de 1Q de rayon, 0,945px. Pour l'instant, on voit le blanc de la page.</p></div>
<div class="cap" data-t="4.5" data-step="Sable puis bleu"><h3>2. Du sable, puis du bleu</h3><p>Le sable part du centre. <code>90Q</code>, entre deux virgules, est un repère de transition à 85,04px. Le bleu suivant demande 0, ramené à 85,04 : le sable s'arrête net. Le bleu va ensuite jusqu'à 115px. Les positions en px ne dépendent pas de la taille du cercle.</p></div>
<div class="cap" data-t="9.5" data-step="#b85c"><h3>3. La dernière couleur</h3><p><code>#b85c</code> n'a pas de position : elle se met à 100 %, la fin du rayon, 0,945px. C'est avant 115px, donc elle passe à 115px : le bleu s'arrête net. Au-delà, c'est un sable à 80 % d'opacité. Posé sur le blanc de la page, il donne le même sable que le centre.</p></div>
<div class="cap" data-t="14" data-step="body"><h3>4. body coupe le bas</h3><p><code>+*</code> se lit <code>* + *</code> : un élément qui suit un autre élément, ici body, après head. <code>margin:141 45%0</code> lui laisse 40px de large, de x = 180 à 220. Il a le même dégradé, centré sur lui : ses coins sont à 74,24px du centre, avant 85,04. Il est tout sable, et coupe l'anneau en bas.</p></div>
<div class="cap" data-t="19" data-step="p"><h3>5. Le p, une ligne de 18px</h3><p>Le p contient une espace insécable : elle ne disparaît pas, et le p a une ligne de 18px. Il fait 40 × 18 en (180, 141), et son centre tombe en (200, 150), le centre du canevas. Même dégradé : ses coins sont à 21,93px de son centre, il est tout sable.</p></div>
<div class="cap" data-t="23.5" data-step="scale"><h3>6. Étiré par scale</h3><p>Le <code>*</code> imbriqué vise ce qui est dans body : le p. <code>scale:9 1.1</code> l'étire autour de son centre : 360 × 19,8, de x = 20 à 380 et de y = 140,1 à 159,9. Son fond s'étire avec lui et reste tout sable : il coupe l'anneau à gauche et à droite.</p></div>
<div class="cap" data-t="28" data-step="Résultat" data-live="110 caractères · 100 % identique"><h3>7. Résultat : 110 caractères</h3><p>Un seul dégradé, donné à html, body et p. Sur le canevas, il dessine l'anneau. Sur body et sur le p, trop petits pour atteindre le bleu, il ne peint que du sable : trois coupes dans l'anneau.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="The gradient"><h3>1. A 1Q circle</h3><p>The <code>*</code> gives every element the same background. html is the root element: its background covers the canvas, and its gradient is centered at (200, 150). <code>radial-gradient(1Q,</code> makes it a circle with a 1Q ray, 0.945px. For now, the page's white shows.</p></div>
<div class="cap" data-t="4.5" data-step="Sand, then blue"><h3>2. Sand, then blue</h3><p>The sand starts at the center. <code>90Q</code>, between two commas, is a transition hint at 85.04px. The next blue asks for 0, moved up to 85.04: the sand stops sharp. Then the blue goes on to 115px. Positions in px do not depend on the circle's size.</p></div>
<div class="cap" data-t="9.5" data-step="#b85c"><h3>3. The last color</h3><p><code>#b85c</code> has no position: it goes at 100%, the end of the ray, 0.945px. That is before 115px, so it moves to 115px: the blue stops sharp. Beyond, it is a sand at 80% opacity. Over the page's white, it gives the same sand as the center.</p></div>
<div class="cap" data-t="14" data-step="body"><h3>4. body cuts the bottom</h3><p><code>+*</code> reads <code>* + *</code>: an element that follows another element, here body, after head. <code>margin:141 45%0</code> leaves it 40px wide, from x = 180 to 220. It has the same gradient, centered on itself: its corners are 74.24px from the center, short of 85.04. It is all sand, and cuts the ring at the bottom.</p></div>
<div class="cap" data-t="19" data-step="p"><h3>5. The p, one 18px line</h3><p>The p holds a no-break space: it does not collapse, and the p gets one 18px line. It is 40 × 18 at (180, 141), and its center falls at (200, 150), the canvas center. Same gradient: its corners are 21.93px from its center, it is all sand.</p></div>
<div class="cap" data-t="23.5" data-step="scale"><h3>6. Stretched by scale</h3><p>The nested <code>*</code> selects what is inside body: the p. <code>scale:9 1.1</code> stretches it around its center: 360 × 19.8, from x = 20 to 380 and from y = 140.1 to 159.9. Its background stretches with it and stays all sand: it cuts the ring on the left and right.</p></div>
<div class="cap" data-t="28" data-step="Result" data-live="110 characters · 100% match"><h3>7. Result: 110 characters</h3><p>One gradient, given to html, body and the p. On the canvas, it draws the ring. On body and the p, too small to reach the blue, it only paints sand: three cuts in the ring.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0710 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? ' :' : ':';
  const num = (v, d = 0) => { const s = Math.abs(v).toFixed(d); return (v < -0.005 ? '−' : '') + (fr ? s.replace('.', ',') : s); };
  // Measured on the official code in local Chrome (quirks mode, 400 × 300), getBoundingClientRect:
  // html (0, 0) 400 × 300, its background goes to the canvas. body (180, 141) 40 × 143.
  // p before scale (180, 141) 40 × 18; with scale:9 1.1, (20, 140.1) 360 × 19.8. 90Q = 85.039px, 1Q = 0.945px.
  const R1 = 85.039, R2 = 115, FIN = 28;
  const grad = $('.t0710-grad'), blue = $('.t0710-blue'), sand = $('.t0710-sand'), out = $('.t0710-out');
  const body = $('.t0710-body'), p = $('.t0710-p'), dot = $('.t0710-dot');
  const g1 = $('.t0710-g1'), g2 = $('.t0710-g2'), g3 = $('.t0710-g3');
  const bb = $('.t0710-bb'), pb = $('.t0710-pb');
  const L = (k) => $$(`.t0710-l[data-l="${k}"]`);
  const disk = (e, cx, cy, r) => { e.style.left = `${cx - r}px`; e.style.top = `${cy - r}px`; e.style.width = `${2 * r}px`; e.style.height = `${2 * r}px`; };
  const put = (e, x, y, w, h) => { e.style.left = `${x}px`; e.style.top = `${y}px`; e.style.width = `${w}px`; e.style.height = `${h}px`; };
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    // 1. the 1Q circle, a dot at the center
    dot.style.opacity = pr(t, [0.3, 0.8]) * (1 - pr(t, [4.3, 4.8]));
    // 2. sand grows to 85.04, then blue from 85.04 to 115
    const ks = pr(t, [5, 6.8]), kb = pr(t, [7, 8.8]);
    disk(sand, 200, 150, R1 * ks);
    disk(blue, 200, 150, kb > 0 ? R1 + (R2 - R1) * kb : 0);
    // 3. #b85c beyond 115px, 80% over the white page
    out.style.opacity = pr(t, [10, 11.8]);
    // Once the ring is whole, the official gradient itself takes over (same picture, same edges as the code).
    const gOn = t >= 11.8;
    grad.style.opacity = gOn ? 1 : 0;
    if (gOn) { out.style.opacity = 0; blue.style.opacity = 0; sand.style.opacity = 0; } else { blue.style.opacity = 1; sand.style.opacity = 1; }
    // 4. body grows down from y = 141 to 284
    const kB = pr(t, [14.5, 16.5]);
    body.style.height = `${143 * kB}px`;
    body.style.opacity = pr(t, [14.3, 14.5]);
    put(bb, 180, 141, 40, 143 * kB);
    bb.style.opacity = 0.9 * pr(t, [14.3, 14.5]) * (1 - pr(t, [FIN - 0.5, FIN]));
    // body's own sand disk: radius 85.04 around its center (200, 212.5)
    disk(g1, 200, 212.5, R1);
    g1.style.opacity = 0.9 * win(t, 16.8, 19);
    // 5. the p, 40 × 18 at (180, 141); its own sand disk is html's
    p.style.opacity = pr(t, [19.4, 19.9]);
    disk(g2, 200, 150, R1);
    g2.style.opacity = 0.9 * win(t, 20.3, 23.5);
    // 6. scale:9 1.1 around (200, 150)
    const kS = pr(t, [24, 26.2]);
    const sx = 1 + 8 * kS, sy = 1 + 0.1 * kS;
    p.style.transform = `scale(${sx}, ${sy})`;
    put(pb, 200 - 20 * sx, 150 - 9 * sy, 40 * sx, 18 * sy);
    pb.style.opacity = 0.9 * pr(t, [19.4, 19.9]) * (1 - pr(t, [FIN - 0.5, FIN]));
    // outer guide for the 115px edge, step 3
    disk(g3, 200, 150, R2);
    g3.style.opacity = 0.9 * win(t, 9.8, 14);
    body.style.background = teach ? 'var(--t0710-c1)' : 'var(--t0710-sand)';
    p.style.background = teach ? 'var(--t0710-c2)' : 'var(--t0710-sand)';
    [[0.3, 4.5], [4.8, 9.5], [9.8, 14], [14.3, 19], [19.3, 23.5], [23.8, 28]].forEach(([a, z], k) => L(k + 1).forEach((e) => (e.style.opacity = win(t, a, z))));
    let txt;
    if (step === 0) txt = fr ? `rayon du cercle${c} 1Q = 0,945px` : `circle ray${c} 1Q = 0.945px`;
    else if (step === 1) txt = kb > 0 ? (fr ? `bleu jusqu'à ${num(R1 + (R2 - R1) * kb, 2)}px` : `blue up to ${num(R1 + (R2 - R1) * kb, 2)}px`) : (fr ? `sable jusqu'à ${num(R1 * ks, 2)}px` : `sand up to ${num(R1 * ks, 2)}px`);
    else if (step === 2) txt = fr ? `#b85c au-delà de 115px · opacité ${num(80 * pr(t, [10, 11.8]), 0)} %` : `#b85c beyond 115px · opacity ${num(80 * pr(t, [10, 11.8]), 0)}%`;
    else if (step === 3) txt = fr ? `body${c} 40 × ${num(143 * kB, 0)}` : `body${c} 40 × ${num(143 * kB, 0)}`;
    else if (step === 4) txt = fr ? `p${c} 40 × 18, centre (200, 150)` : `p${c} 40 × 18, center (200, 150)`;
    else if (step === 5) txt = fr ? `p${c} ${num(40 * sx, 1)} × ${num(18 * sy, 2)}` : `p${c} ${num(40 * sx, 1)} × ${num(18 * sy, 2)}`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
