<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="html"><h3>1. html, un cadre invisible</h3><p><code>&lt;p></code> donne cinq éléments : html, head, body, p et style. <code>*</code> les touche tous, head et style restent cachés. html reçoit la marge <code>5 30</code> et une bordure de <code>5vw</code> = 20px, de la couleur du canevas. En mode quirks, html remplit la hauteur : 340 × 290 en (30, 5). Sa boîte de remplissage fait 300 × 250, en (50, 25), centrée sur (200, 150).</p></div>
<div class="cap" data-t="4.5" data-step="Anneau"><h3>2. Un anneau clair</h3><p>Le fond de html passe au canevas. <code>radial-gradient(1q,…)</code> est un cercle, centré dans sa boîte de remplissage. Sombre jusqu'à <code>5vh</code> = 15px, clair de là jusqu'à <code>25vw</code> = 100px. Le dernier arrêt n'a pas de position : il va à 100 % du cercle, <code>1q</code> = 0,945px. C'est avant 100px, donc il remonte à 100px : un bord net, sombre au-delà.</p></div>
<div class="cap" data-t="9.5" data-step="Tuiles"><h3>3. Des tuiles sur tout le canevas</h3><p>Le code ne donne aucune couleur de fond. Le dégradé fait 300 × 250, la taille de la boîte de remplissage, et il se répète. Ses coins sont sombres : les tuiles voisines remplissent le reste du canevas. Leurs anneaux s'arrêtent pile au bord du canevas, en x = 0, x = 400, y = 0 et y = 300.</p></div>
<div class="cap" data-t="14" data-step="body"><h3>4. body, un carré troué</h3><p><code>*{*{…}}</code> veut dire <code>* *</code> : tout sauf html. body reçoit <code>height:90;width:90</code>, la marge et la bordure : 130 × 130 en (80, 30). Sa boîte de remplissage, 90 × 90 en (100, 50), a son propre dégradé, centré en (145, 95). Un trou sombre de 15px, puis du clair : ses coins ne sont qu'à 63,6px du centre. Sa bordure sombre recouvre l'anneau.</p></div>
<div class="cap" data-t="18.5" data-step="p"><h3>5. p, le second carré</h3><p>p est dans body. <code>p{margin:90}</code> veut dire <code>* * p</code> : sa marge est 90 au lieu de 5 30. 90, c'est la largeur de body : p commence là où le contenu de body s'arrête, en (190, 140). Sa bordure se pose sur celle de body. Son trou est en (255, 205).</p></div>
<div class="cap" data-t="23.5" data-step="Croix"><h3>6. Deux quarts de disque</h3><p>body et p cachent deux quarts de l'anneau. Leurs bordures tracent une croix sombre de 20px qui passe par (200, 150), sur le trou de l'anneau. Il reste deux quarts de disque, en haut à droite et en bas à gauche. Leur bord rond est le cercle de 100px : il touche le haut de body (y = 50) et la droite de p (x = 300).</p></div>
<div class="cap" data-t="28" data-step="Résultat" data-live="145 caractères · 100 % identique"><h3>7. Résultat : 145 caractères</h3><p>Un seul dégradé sur trois éléments : un anneau sur le canevas avec html, un carré troué avec body, un autre avec p. Les bordures font la croix.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html"><h3>1. html, a frame that never shows</h3><p><code>&lt;p></code> gives five elements: html, head, body, p and style. <code>*</code> selects them all; head and style stay hidden. html gets the margin <code>5 30</code> and a <code>5vw</code> = 20px border, in the canvas color. In quirks mode html fills the height: 340 × 290 at (30, 5). Its padding box is 300 × 250, at (50, 25), centered on (200, 150).</p></div>
<div class="cap" data-t="4.5" data-step="Ring"><h3>2. A light ring</h3><p>html's background goes to the canvas. <code>radial-gradient(1q,…)</code> is a circle, centered in its padding box. Dark up to <code>5vh</code> = 15px, light from there up to <code>25vw</code> = 100px. The last stop has no position: it goes at 100% of the circle, <code>1q</code> = 0.945px. That is before 100px, so it moves up to 100px: a hard edge, dark beyond.</p></div>
<div class="cap" data-t="9.5" data-step="Tiles"><h3>3. Tiles over the whole canvas</h3><p>The code sets no background color. The gradient is 300 × 250, the size of the padding box, and it repeats. Its corners are dark: the neighboring tiles fill the rest of the canvas. Their rings stop right at the canvas edges, at x = 0, x = 400, y = 0 and y = 300.</p></div>
<div class="cap" data-t="14" data-step="body"><h3>4. body, a square with a hole</h3><p><code>*{*{…}}</code> means <code>* *</code>: everything but html. body gets <code>height:90;width:90</code>, the margin and the border: 130 × 130 at (80, 30). Its padding box, 90 × 90 at (100, 50), has its own gradient, centered on (145, 95). A dark 15px hole, then light: its corners are only 63.6px from the center. Its dark border covers the ring.</p></div>
<div class="cap" data-t="18.5" data-step="p"><h3>5. p, the second square</h3><p>p is inside body. <code>p{margin:90}</code> means <code>* * p</code>: its margin is 90 instead of 5 30. 90 is body's width: p starts where body's content ends, at (190, 140). Its border lands on body's border. Its hole is at (255, 205).</p></div>
<div class="cap" data-t="23.5" data-step="Cross"><h3>6. Two quarter discs</h3><p>body and p hide two quarters of the ring. Their borders draw a 20px dark cross through (200, 150), over the ring's hole. Two quarter discs are left, top right and bottom left. Their round edge is the 100px circle: it touches the top of body (y = 50) and the right of p (x = 300).</p></div>
<div class="cap" data-t="28" data-step="Result" data-live="145 characters · 100% match"><h3>7. Result: 145 characters</h3><p>One gradient on three elements: a ring on the canvas with html, a square with a hole with body, another one with p. The borders make the cross.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0615 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? ' :' : ':';
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  // Measured on the official code in local Chrome (400 × 300 iframe, quirks mode, getBoundingClientRect, getComputedStyle):
  // html 340 × 290 at (30, 5), margin 5px 30px, border 20px: padding box 300 × 250 at (50, 25), center (200, 150).
  // body 130 × 130 at (80, 30), border 20px: padding box 90 × 90 at (100, 50). p 130 × 130 at (190, 140), margin 90px:
  // padding box 90 × 90 at (210, 160). Gradient: dark to 15px, light 15px to 100px, dark beyond, hard edges.
  // html's background is repeated in 300 × 250 tiles over the canvas (no-repeat leaves the outside of html white).
  const FIN = 28, D = '#2d696f', L = '#81a5a9';
  const tiles = $('.t0615-tiles'), hb = $('.t0615-hb'), body = $('.t0615-body'), p = $('.t0615-p');
  const pad = $('.t0615-pad'), circ = $('.t0615-circ'), vls = $$('.t0615-vl'), hls = $$('.t0615-hl');
  const labs = $$('.zlab');
  const grad = (h, f, r) => `radial-gradient(1q, ${h} 15px, ${f} 0 ${r}px, ${h})`;
  const ivs = [[0.3, 4.5], [4.8, 9.5], [9.8, 14], [14.3, 18.5], [18.8, 23.5], [23.8, FIN]];
  return (t, step) => {
    const wide = fig.dataset.view === 'wide';
    const teach = fig.dataset.teach === '1';
    const tw = teach ? 1 - pr(t, [FIN, FIN + 0.8]) : 0;
    const out = 1 - pr(t, [FIN, FIN + 0.6]);
    hb.style.opacity = pr(t, [0.3, 1]) * tw; // in the real colors the border is the canvas color: hidden, so its edges leave no trace
    hb.style.borderColor = mix(tw, 'var(--t0615-hb)', D);
    pad.style.opacity = Math.min(pr(t, [0.6, 1.3]), 1 - pr(t, [14.3, 15]));
    // ring: grows from 15px to 100px; first only the middle tile, then all tiles
    const r = 15 + 85 * pr(t, [5.5, 8]);
    tiles.style.opacity = pr(t, [4.8, 5.4]);
    tiles.style.background = grad(D, mix(tw, 'var(--t0615-rg)', L), r);
    tiles.style.backgroundSize = '300px 250px';
    const k = pr(t, [10, 12]);
    const ix = 300 * (1 - k), iy = 250 * (1 - k);
    tiles.style.clipPath = `inset(${iy}px ${ix}px ${iy}px ${ix}px)`;
    const grid = Math.min(pr(t, [10, 10.8]), 1 - pr(t, [14.3, 15]));
    vls.concat(hls).forEach((l) => { l.style.opacity = grid; });
    // body and p
    const bo = pr(t, [14.4, 15.2]);
    body.style.opacity = bo;
    body.style.borderColor = mix(tw, 'var(--t0615-bb)', D);
    body.style.background = grad(mix(tw, 'var(--t0615-bh)', D), mix(tw, 'var(--t0615-bf)', L), 100);
    const po = pr(t, [18.9, 19.5]), pm = pr(t, [19.8, 22.2]);
    p.style.left = `${100 + 90 * pm}px`;
    p.style.top = `${50 + 90 * pm}px`;
    p.style.borderColor = mix(tw, 'var(--t0615-pb)', D);
    p.style.background = grad(mix(tw, 'var(--t0615-ph)', D), mix(tw, 'var(--t0615-pf)', L), 100);
    // step 6: body and p fade a little to show the ring under them, then come back
    const see = teach ? Math.min(pr(t, [24.2, 25]), 1 - pr(t, [26.4, 27.2])) : 0;
    body.style.opacity = bo * (1 - 0.6 * see);
    p.style.opacity = po * (1 - 0.6 * see);
    circ.style.opacity = Math.min(pr(t, [24.2, 25]), out);
    labs.forEach((l) => {
      const n = +l.dataset.l, second = l.classList.contains('t0615-l2');
      const [x0, y0, , h0] = wide ? [-100, -75, 600, 450] : [0, 0, 400, 300];
      l.style.left = `calc(${x0}px + 4px * var(--k, 1))`;
      l.style.top = `calc(${y0 + h0}px - ${second ? 4 : 23}px * var(--k, 1))`;
      l.style.opacity = win(t, ...ivs[n - 1]);
    });
    let txt;
    if (step === 0) txt = `html${c} 340 × 290 ${fr ? 'en' : 'at'} (30, 5) · ${fr ? 'remplissage' : 'padding box'} 300 × 250`;
    else if (step === 1) txt = `${fr ? 'anneau' : 'ring'}${c} 15px → 100px ${fr ? 'autour de' : 'around'} (200, 150)`;
    else if (step === 2) txt = `${fr ? 'tuiles de 300 × 250, aucune couleur de fond' : 'tiles of 300 × 250, no background color'}`;
    else if (step === 3) txt = `body${c} 130 × 130 ${fr ? 'en' : 'at'} (80, 30) · ${fr ? 'trou en' : 'hole at'} (145, 95)`;
    else if (step === 4) txt = `p${c} 130 × 130 ${fr ? 'en' : 'at'} (190, 140) · ${fr ? 'trou en' : 'hole at'} (255, 205)`;
    else if (step === 5) txt = `${fr ? 'croix' : 'cross'}${c} 20px · ${fr ? '2 quarts de disque' : '2 quarter discs'}, r = 100`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
