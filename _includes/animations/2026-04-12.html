<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="La boîte de html"><h3>1. html : 40 × 170</h3><p>Au premier niveau, <code>&amp;</code> vise la racine : html. Pas de doctype : mode quirks, les marges sans unité sont des px. <code>margin:65 210 65 150</code> laisse 400 − 150 − 210 = 40px de large. En mode quirks, html prend la hauteur de la fenêtre moins ses marges : 300 − 65 − 65 = 170. Rien n'a encore de fond : le canevas est blanc.</p></div>
<div class="cap" data-t="5" data-step="Trois ombres"><h3>2. Trois ombres, trois barres</h3><p><code>color:442929</code>, sans <code>#</code>, est accepté en mode quirks. Une ombre sans couleur prend celle-ci. Chaque ombre est une copie de la boîte, décalée : <code>-5ch</code>, soit −40px dans mon Chrome, en x = 110 ; <code>5ch</code> en x = 190 ; <code>25vw</code>, soit 100px, en x = 250. Une ombre n'est jamais peinte sous sa propre boîte : de 150 à 190, html reste vide.</p></div>
<div class="cap" data-t="10" data-step="Le canevas"><h3>3. Le fond de body peint le canevas</h3><p>Imbriqué dans <code>&amp;</code>, <code>*</code> vise ce qui est dans html : body (et head, style, qui ne s'affichent pas). html n'a pas de fond : celui de body, <code>#f3ac3c</code>, passe au canevas. body ne le peint pas sur sa propre boîte.</p></div>
<div class="cap" data-t="15" data-step="La boîte de body"><h3>4. body : 640 × 220</h3><p>body se place dans html, en (150, 65), avec la marge <code>40-300-90</code>. Le haut : 65 + 40 = 105. À gauche et à droite, −300 : 40 + 300 + 300 = 640px de large, à partir de x = −150. Son milieu tombe en x = 170, celui de html. En mode quirks, body prend la hauteur de html moins ses marges : 170 − 40 + 90 = 220.</p></div>
<div class="cap" data-t="20" data-step="Les points"><h3>5. Une bordure en points de 80px</h3><p><code>border:5pc dotted</code> : 5pc font 5 × 16 = 80px, et une bordure pointillée aussi épaisse dessine des disques de 80px. Sur les 640px du haut, mon Chrome en met cinq, un à chaque coin, avec des écarts de (640 − 5 × 80) / 4 = 60px : un disque tous les 140px. Même chose en bas. Les côtés font 220px de haut : rien entre les disques des coins.</p></div>
<div class="cap" data-t="25" data-step="Les encoches"><h3>6. Des points couleur canevas</h3><p>Les points sont en <code>#F3AC3C</code>, la couleur du canevas : là, on ne les voit pas. Sur les barres, ils creusent un demi-disque. Le disque du milieu est centré sur body, donc en (170, 145) : il entame les deux premières barres. Le suivant, 140px plus loin en (310, 145), entame la troisième. Grâce au −90, la rangée du bas commence en 105 + 220 − 80 = 245, sous les barres, qui finissent en 235.</p></div>
<div class="cap" data-t="30" data-step="Résultat" data-live="136 caractères · 100 % identique"><h3>7. Résultat : 136 caractères</h3><p>Trois ombres font les barres. La bordure pointillée de body, couleur canevas, y découpe les trois encoches.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html's box"><h3>1. html: 40 × 170</h3><p>At the top level, <code>&amp;</code> matches the root: html. No doctype: quirks mode, unitless margins are px. <code>margin:65 210 65 150</code> leaves 400 − 150 − 210 = 40px of width. In quirks mode, html takes the viewport's height minus its margins: 300 − 65 − 65 = 170. Nothing has a background yet: the canvas is white.</p></div>
<div class="cap" data-t="5" data-step="Three shadows"><h3>2. Three shadows, three bars</h3><p><code>color:442929</code>, with no <code>#</code>, is accepted in quirks mode. A shadow with no color takes this one. Each shadow is a copy of the box, moved: <code>-5ch</code>, −40px in my Chrome, at x = 110; <code>5ch</code> at x = 190; <code>25vw</code>, 100px, at x = 250. A shadow is never painted under its own box: from 150 to 190, html stays empty.</p></div>
<div class="cap" data-t="10" data-step="The canvas"><h3>3. body's background paints the canvas</h3><p>Nested in <code>&amp;</code>, <code>*</code> matches what is inside html: body (and head and style, which are not displayed). html has no background, so body's, <code>#f3ac3c</code>, goes to the canvas. body does not paint it on its own box.</p></div>
<div class="cap" data-t="15" data-step="body's box"><h3>4. body: 640 × 220</h3><p>body sits in html, at (150, 65), with the margin <code>40-300-90</code>. The top: 65 + 40 = 105. Left and right, −300: 40 + 300 + 300 = 640px wide, from x = −150. Its middle falls at x = 170, html's middle. In quirks mode, body takes html's height minus its margins: 170 − 40 + 90 = 220.</p></div>
<div class="cap" data-t="20" data-step="The dots"><h3>5. A border of 80px dots</h3><p><code>border:5pc dotted</code>: 5pc is 5 × 16 = 80px, and a dotted border that thick draws 80px discs. On the 640px top side, my Chrome puts five, one at each corner, with gaps of (640 − 5 × 80) / 4 = 60px: one disc every 140px. The same at the bottom. The sides are 220px tall: nothing between the corner discs.</p></div>
<div class="cap" data-t="25" data-step="The notches"><h3>6. Dots the color of the canvas</h3><p>The dots are <code>#F3AC3C</code>, the canvas color: there, they do not show. On the bars, they cut a half disc. The middle disc is centered on body, so at (170, 145): it bites the first two bars. The next one, 140px further at (310, 145), bites the third. Thanks to the −90, the bottom row starts at 105 + 220 − 80 = 245, below the bars, which end at 235.</p></div>
<div class="cap" data-t="30" data-step="Result" data-live="136 characters · 100% match"><h3>7. Result: 136 characters</h3><p>Three shadows make the bars. body's dotted border, in the canvas color, cuts the three notches into them.</p></div>
{%- endif %}

<script>
(window.AnimScenes = window.AnimScenes || {}).t0412 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.5), 1 - pr(t, b - 0.3, b));
  const n = (s) => (fr ? s.replace(/(\d)\.(\d)/g, '$1,$2') : s);
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  // Measured on the official code in local Chrome 157 (400 × 300 page, quirks mode, getBoundingClientRect, getComputedStyle):
  // html 150, 65, 40 × 170, no background, color rgb(68, 41, 41), box-shadow -40px, 40px, 100px (5ch = 40px, Times 16px; 25vw = 100px).
  // body -150, 105, 640 × 220, margin 40px -300px -90px, border 80px dotted rgb(243, 172, 60), background rgb(243, 172, 60) (goes to the canvas).
  // Dots (the same border with a red color, 640 × 220 box): 80px discs, top row x = -150, -10, 130, 270, 410 (left edges), y = 105 to 185;
  // bottom row the same x, y = 245 to 325; nothing on the sides between the corner discs.
  // Rendered colors: #f3ac3c (canvas), #442929 (bars).
  const DK = '#442929', OR = '#f3ac3c';
  const W = $('.t0412-white');
  const S = [[$('.t0412-s1'), 110], [$('.t0412-s2'), 190], [$('.t0412-s3'), 250]];
  const dots = $$('.t0412-dot'), dols = $$('.t0412-dol');
  const OB = $('.t0412-obody');
  const labs = $$('.zlab');
  const ivs = { 1: [0.3, 4.8], 2: [5.3, 9.8], 3: [10.3, 14.8], 4: [15.3, 19.8], 5: [20.3, 24.8], 6: [25.3, 29.8] };
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const tw = teach ? 1 - pr(t, 30.2, 31.2) : 0;
    // html's box: transparent, 40 × 170 at (150, 65)
    $('.t0412-ohtml').style.opacity = win(t, 0.3, 9.8);
    // no background before body's: white canvas
    W.style.opacity = 1 - pr(t, 10.5, 11.5);
    // the three shadows slide out from under html's box; never drawn inside it (150 to 190)
    const k = pr(t, 5.5, 7.5);
    S.forEach(([el, x], i) => {
      const L = 150 + (x - 150) * pr(t, 5.5 + i * 0.4, 7.5 + i * 0.4);
      el.style.left = L + 'px';
      el.style.opacity = pr(t, 5.5 + i * 0.4, 5.9 + i * 0.4);
      const l = Math.max(0, Math.min(40, 190 - L)), r = Math.max(0, Math.min(40, L + 40 - 150));
      el.style.clipPath = L < 150 ? `inset(0 ${r}px 0 0)` : `inset(0 0 0 ${l}px)`;
      el.style.background = mix(tw, 'var(--t0412-sh)', DK);
    });
    // body's box grows from html's box to 640 × 220 at (-150, 105)
    const b = pr(t, 15.5, 17.5);
    OB.style.left = 150 - 300 * b + 'px';
    OB.style.top = 65 + 40 * b + 'px';
    OB.style.width = 40 + 600 * b + 'px';
    OB.style.height = 170 + 50 * b + 'px';
    OB.style.opacity = win(t, 15.5, 29.8);
    $('.t0412-vline').style.opacity = win(t, 16.5, 19.8);
    // the dots: 80px discs; in teaching colors first, then the canvas color
    const ck = pr(t, 25.5, 26.5);
    dots.forEach((d, i) => {
      const a = pr(t, 20.5 + (i % 5) * 0.25, 21.3 + (i % 5) * 0.25);
      d.style.opacity = a > 0 ? 1 : 0;
      d.style.transform = `scale(${a})`;
      d.style.background = mix(tw * (1 - ck), 'var(--t0412-dt)', OR);
    });
    dols.forEach((d, i) => { d.style.opacity = win(t, 21 + (i % 5) * 0.25, 29.8); });
    labs.forEach((l) => { const iv = ivs[l.dataset.l]; l.style.opacity = iv ? win(t, ...iv) : 0; });
    let txt;
    if (step === 0) txt = `400 − 150 − 210 = 40 · 300 − 65 − 65 = 170`;
    else if (step === 1) txt = `150 − 40 = 110 · 150 + 40 = 190 · 150 + 100 = 250`;
    else if (step === 2) txt = `background:#f3ac3c → ${fr ? 'canevas' : 'canvas'}`;
    else if (step === 3) txt = `150 − 300 = −150 · 40 + 300 + 300 = 640 · 170 − 40 + 90 = 220`;
    else if (step === 4) txt = `5 × 80 + 4 × 60 = 640 · 80 + 60 = 140`;
    else if (step === 5) txt = `−150 + 320 = 170 · 170 + 140 = 310 · 105 + 220 − 80 = 245`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = n(txt);
  };
};
</script>
