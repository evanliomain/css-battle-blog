<figure class="anim t1003" data-duration="25" data-scene="t1003" data-wide="-20 -170 600 480" style="--bg:#fff">
<style>
.t1003{--mark:#e0a800}
.t1003 .scene i{position:absolute;box-sizing:border-box}
.t1003 .t1003-h,.t1003 .t1003-m,.t1003 .t1003-g-h{left:100px;top:50px;width:200px;height:200px;border-radius:864px}
.t1003 .t1003-b,.t1003 .t1003-g-b{left:150px;top:160px;width:20px;height:20px;border-radius:864px}
.t1003 .t1003-g{border:2px dashed var(--mark);pointer-events:none}
.t1003 .t1003-lab{z-index:53;font:600 12px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;color:#14171c;background:#ffd23f;padding:2px 5px;border-radius:3px;white-space:nowrap;pointer-events:none}
.t1003[data-view="wide"] .t1003-lab{font-size:19px}
.t1003 .t1003-l-h{left:104px;top:256px}
.t1003 .t1003-l-o{left:6px;top:6px}
.t1003 .t1003-l-s{left:150px;top:-164px}
.t1003[data-view="canvas"] .t1003-l-s{left:6px;top:6px}
.t1003 .t1003-l-b{left:180px;top:150px}
</style>
<div class="anim-col">
<div class="stage" role="img" aria-label="{% if include.lang == "fr" %}Animation : le cercle de html, son outline ocre qui masque tout autour, son ombre intérieure, puis les ombres du body : deux yeux et deux grands disques de cheveux{% else %}Animation: html's circle, its ochre outline that masks everything around it, its inset shadow, then body's shadows: two eyes and two big discs of hair{% endif %}">
<div class="scene">
<i class="t1003-h"></i>
<i class="t1003-b"></i>
<i class="t1003-m"></i>
<i class="t1003-g t1003-g-h"></i>
<i class="t1003-g t1003-g-b"></i>
<b class="t1003-lab t1003-l-h">html 200 × 200</b>
<b class="t1003-lab t1003-l-o">outline:9in</b>
<b class="t1003-lab t1003-l-s">{% if include.lang == "fr" %}ombres de html, sous l'outline{% else %}html's shadows, under the outline{% endif %}</b>
<b class="t1003-lab t1003-l-b">body 20 × 20</b>
</div>
</div>
<div class="legend"><span><i style="--c:#b08743"></i>{% if include.lang == "fr" %}outline de html (transparent pour voir dessous){% else %}html outline (see-through to show what it hides){% endif %}</span><span><i style="--c:#8e44c9"></i>{% if include.lang == "fr" %}ombres de html{% else %}html shadows{% endif %}</span><span><i style="--c:#1f7fd6"></i>{% if include.lang == "fr" %}ombres du body{% else %}body shadows{% endif %}</span></div>
</div>
<div class="anim-side">
<pre class="code" aria-hidden="true">.&lt;style>*{<span data-on="3">color:441212</span>;<span data-on="1">border-radius:9in</span>;<span data-on="4" data-tone="2">margin:55%65%35%50</span>;box-shadow:<span data-on="3"><span data-on="6" data-tone="2">-5vw -30vw 0 5lh</span>,<span data-on="7" data-tone="2">45vw -5em 0 5lh</span>,<span data-on="5" data-tone="2">5em 0</span>,<span data-on="4" data-tone="2">inset 0 0 0 5vw</span></span>}&amp;{<span data-on="1">margin:50 100</span>;<span data-on="2">outline:9in solid#b08743</span></pre>
<div class="now" aria-live="polite">
<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="html, un cercle"><h3>1. html, un cercle</h3><p>Le canevas est blanc. <code>&amp;</code>, c'est <code>html</code> : <code>margin:50 100</code> en fait un carré de 200×200, et <code>border-radius:9in</code> (864px, ramené à 100px) un cercle. Il n'a pas de fond : on ne le voit pas encore.</p></div>
<div class="cap" data-t="3" data-step="L'outline, un masque"><h3>2. L'outline, un masque</h3><p><code>outline:9in solid#b08743</code> suit l'arrondi et peint 864px d'ocre tout autour du cercle. Un outline est peint après tout le reste : il cachera tout ce qui sort du cercle.</p></div>
<div class="cap" data-t="6" data-step="L'ombre intérieure : le contour"><h3>3. L'ombre intérieure : le contour</h3><p><code>*</code> donne à <code>html</code> les quatre ombres, dans sa <code>color</code>, <code>441212</code>. <code>inset 0 0 0 5vw</code> dessine un anneau intérieur de 20px : le contour. Les trois autres tombent hors du cercle, sous l'outline (les couleurs pédagogiques le rendent transparent pour les montrer).</p></div>
<div class="cap" data-t="9" data-step="body : l'œil gauche"><h3>4. body : l'œil gauche</h3><p>Le <code>body</code> prend <code>margin:55%65%35%50</code>, en pourcentage des 200px de <code>html</code> : un carré de 20×20 en (150, 160), rond lui aussi. Son ombre intérieure de 20px le remplit : l'œil gauche.</p></div>
<div class="cap" data-t="12" data-step="5em 0 : l'œil droit"><h3>5. 5em 0 : l'œil droit</h3><p><code>5em 0</code> copie le disque 80px plus à droite : l'œil droit.</p></div>
<div class="cap" data-t="15" data-step="Premier disque de cheveux"><h3>6. Premier disque de cheveux</h3><p><code>-5vw -30vw 0 5lh</code> : décalage de (−20, −120) et étalement de 5lh, soit 90px. Le disque passe à 100px de rayon, centré en (140, 50). Ce qui sort du cercle reste sous l'outline.</p></div>
<div class="cap" data-t="18" data-step="Second disque : la mèche"><h3>7. Second disque : la mèche</h3><p><code>45vw -5em 0 5lh</code> : décalage de (180, −80), même étalement. Un second disque de 100px de rayon, centré en (340, 90), coupe la droite du visage : la mèche.</p></div>
<div class="cap" data-t="21" data-step="Au pixel près" data-live="166 caractères · 100 % identique"><h3>8. Au pixel près</h3><p>Un cercle, un outline, quatre ombres partagées : le visage en 166 caractères.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html, a circle"><h3>1. html, a circle</h3><p>The canvas is white. <code>&amp;</code> is <code>html</code>: <code>margin:50 100</code> makes it a 200×200 square, and <code>border-radius:9in</code> (864px, clamped to 100px) a circle. It has no background: nothing shows yet.</p></div>
<div class="cap" data-t="3" data-step="The outline, a mask"><h3>2. The outline, a mask</h3><p><code>outline:9in solid#b08743</code> follows the radius and paints 864px of ochre all around the circle. An outline is painted after everything else, so it will hide anything that leaves the circle.</p></div>
<div class="cap" data-t="6" data-step="The inset shadow: the rim"><h3>3. The inset shadow: the rim</h3><p><code>*</code> gives <code>html</code> all four shadows, in its <code>color</code>, <code>441212</code>. <code>inset 0 0 0 5vw</code> draws a 20px ring inside: the rim. The other three land outside the circle, under the outline (the teaching colors make it see-through to show them).</p></div>
<div class="cap" data-t="9" data-step="body: the left eye"><h3>4. body: the left eye</h3><p><code>body</code> takes <code>margin:55%65%35%50</code>, in percent of <code>html</code>'s 200px: a 20×20 square at (150, 160), round as well. Its 20px inset shadow fills it: the left eye.</p></div>
<div class="cap" data-t="12" data-step="5em 0: the right eye"><h3>5. 5em 0: the right eye</h3><p><code>5em 0</code> copies the disc 80px to the right: the right eye.</p></div>
<div class="cap" data-t="15" data-step="First disc of hair"><h3>6. First disc of hair</h3><p><code>-5vw -30vw 0 5lh</code>: an offset of (−20, −120) and a spread of 5lh, 90px. The disc grows to a 100px radius, centered at (140, 50). Whatever leaves the circle stays under the outline.</p></div>
<div class="cap" data-t="18" data-step="Second disc: the fringe"><h3>7. Second disc: the fringe</h3><p><code>45vw -5em 0 5lh</code>: an offset of (180, −80), same spread. A second 100px-radius disc, centered at (340, 90), cuts the right side of the face: the fringe.</p></div>
<div class="cap" data-t="21" data-step="Pixel-perfect" data-live="166 characters · 100% match"><h3>8. Pixel-perfect</h3><p>One circle, one outline, four shared shadows: the face in 166 characters.</p></div>
{%- endif %}
</div>
<div class="live"></div>
</div>
</div>
<script>
(window.AnimScenes = window.AnimScenes || {}).t1003 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const h = $('.t1003-h'), b = $('.t1003-b'), m = $('.t1003-m'), live = $('.live');
  const end = $$('.cap').pop().dataset.live;
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, c) => ease(Math.min(1, Math.max(0, (t - a) / (c - a))));
  const mix = (a, c, k) => `rgb(${[0, 1, 2].map((i) => Math.round(a[i] + (c[i] - a[i]) * k)).join(' ')})`;
  const DARK = [68, 18, 18], HT = [142, 68, 201], BT = [31, 127, 214];
  // The four shadows: x, y, spread (5vw = 20, 30vw = 120, 45vw = 180, 5em = 80, 5lh = 90).
  const S = [[-20, -120, 90], [180, -80, 90], [80, 0, 0]];
  const sh = (k, col) => [...S.map(([x, y, s], i) => `${x * k[i]}px ${y * k[i]}px 0 ${s * k[i]}px ${col}`), `inset 0 0 0 ${20 * k[3]}px ${col}`].join(',');
  const n = (v) => Math.round(v);
  const c = fr ? ' :' : ':';
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const real = teach ? pr(t, 21, 21.8) : 1;
    const show = (sel, a, z) => $$(sel).forEach((e) => { e.style.opacity = pr(t, a, a + 0.6) * (1 - pr(t, z - 0.4, z)); });
    const ow = 864 * pr(t, 3.3, 5.6);
    // In teaching colors the outline turns see-through while the hidden shadows matter.
    const see = teach ? pr(t, 6.2, 7) * (1 - real) : 0;
    m.style.outline = ow > 0 ? `${ow}px solid rgb(176 135 67 / ${1 - 0.7 * see})` : 'none';
    const hk = pr(t, 6.3, 8.2);
    h.style.boxShadow = sh([hk, hk, hk, hk], mix(HT, DARK, real));
    const bk = [pr(t, 15.3, 17.5), pr(t, 18.3, 20.5), pr(t, 12.3, 14), pr(t, 9.4, 10.4)];
    b.style.boxShadow = sh(bk, mix(BT, DARK, real));
    show('.t1003-g-h', 0.3, 6); show('.t1003-l-h', 0.3, 3);
    show('.t1003-l-o', 3.3, 6);
    $('.t1003-l-s').style.opacity = pr(t, 6.6, 7.2) * (1 - pr(t, 8.6, 9)) * (teach ? 1 : 0);
    show('.t1003-g-b', 9.2, 12); show('.t1003-l-b', 9.2, 12);
    let txt = '';
    if (step === 0) txt = `html${c} 200 × 200 ${fr ? 'en' : 'at'} (100, 50) · ${fr ? 'rayon' : 'radius'} 864 → 100 px`;
    else if (step === 1) txt = `outline${c} ${n(ow)} px`;
    else if (step === 2) txt = `inset${c} ${n(20 * hk)} px · ${fr ? '3 ombres sous l\'outline' : '3 shadows under the outline'}`;
    else if (step === 3) txt = `body${c} 20 × 20 ${fr ? 'en' : 'at'} (150, 160) · inset ${n(20 * bk[3])} px`;
    else if (step === 4) txt = `5em 0${c} ${fr ? 'décalage' : 'offset'} ${n(80 * bk[2])} px`;
    else if (step === 5 || step === 6) {
      const i = step - 5, k = bk[i];
      txt = `${fr ? 'décalage' : 'offset'} (${n(S[i][0] * k)}, ${n(S[i][1] * k)}) · ${fr ? 'étalement' : 'spread'} ${n(90 * k)} px · ${fr ? 'rayon' : 'radius'} ${n(10 + 90 * k)} px`;
    } else txt = end;
    live.textContent = txt.replace(/-/g, '−');
  };
};
</script>
</figure>
