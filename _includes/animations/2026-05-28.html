(window.AnimScenes = window.AnimScenes || {}).t0528 = (fig) => {
  const fr = document.documentElement.lang === 'fr';

  // Measured on the official code in local Chrome (400 × 300 iframe, quirks mode, getBoundingClientRect, getComputedStyle).
  // html: 115, 110, 170 × 80.1875, border-radius 384px, background #31696b (painted on the canvas).
  // body: -259, 120.1875, 60 × 59.8125, margin 10.1875px 484px 10px -374px, border-radius 384px, background #31696b.
  // Both: color rgb(100 223 227); box-shadow 40px 0 0 15px, -40px 0 0 15px, rgba(119 34 34 / .467) 0 0 0 192px,
  // 428.976px 165px 0 69.9213px, 564.094px 0, 294px 0, #fff 384px 0, #fff 474.331px 0.
  const CY = '#64dfe3';
  const blank = $('.t0528-blank'), html = $('.t0528-html'), body = $('.t0528-body'), hbox = $('.t0528-hbox'), bbox = $('.t0528-bbox');
  const labs = $$('.zlab');
  const ivs = [[0.3, 4.3], [4.8, 8.8], [9.3, 13.8], [14.3, 18.8], [19.3, 23.8], [24.3, 28.8], [29.3, 33.8]];
  const S = (x, y, s, col) => `${x.toFixed(3)}px ${y.toFixed(3)}px 0 ${s.toFixed(3)}px ${col}`;
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const wide = fig.dataset.view === 'wide';
    const tw = teach ? 1 - pr(t, 34.3, 35.3) : 0;
    const col = (v) => mix(tw, `var(--t0528-${v})`, CY);
    // step 1: html's box becomes a pill, then its background reaches the canvas
    const rk = pr(t, 0.6, 2.2);
    html.style.borderRadius = rk >= 1 ? '384px' : `${40.09375 * rk}px`;
    blank.style.opacity = 1 - pr(t, 2.4, 3.9);
    hbox.style.opacity = win(t, 0.3, 33.8);
    // the pill's outline, until the brown shows it

    const far = [
      S(428.976 * p4, 165 * p4, 69.9213 * p4, col('s4')),
      S(564.094 * p56, 0, 0, col('s5')),
      S(294 * p56, 0, 0, col('s5')),
      S(384 * p78, 0, 0, '#fff'),
      S(474.331 * p78, 0, 0, '#fff'),

    const first = (p, q) => [S(40 * p, 0, 15 * p, col('s1')), S(-40 * p, 0, 15 * p, col('s2')), S(0, 0, 192 * q, '#7227')];
    html.style.boxShadow = [...first(p12, p3), ...far].join(',');
    body.style.boxShadow = [...first(pb, pb), ...far].join(',');

    body.style.opacity = pr(t, 14.5, 15.5);
    bbox.style.opacity = win(t, 14.5, 33.8);

    labs.forEach((l) => {

    else if (step === 3) txt = `body${c} 170 − 484 + 374 = 60`;

    else if (step === 5) txt = `x = −229 + 294 = 65 · −229 + ${n(564.1)} = ${n(335.1)}`;
    else if (step === 6) txt = `x = −229 + 384 = 155 · −229 + ${n(474.3)} = ${n(245.3)}`;
