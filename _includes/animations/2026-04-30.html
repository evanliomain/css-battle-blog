{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="html"><h3>1. html, un carré invisible</h3><p>Le code commence par une espace insécable : du texte, qui ouvre body avant le <code>&lt;style></code>. <code>*</code> vise html, head, style et body, et leur donne à tous le fond <code>#394257</code>. Celui de html remplit tout le canevas. html reçoit <code>margin:5%35%55%200</code> : les pourcentages se calculent sur la largeur de 400, soit 20, 140 et 220, puis 200px. En mode quirks, html fait 400 − 140 − 200 = 60 de large et 300 − 20 − 220 = 60 de haut, en (200, 20). Il a la couleur du fond : on ne le voit pas.</p></div>
<div class="cap" data-t="5" data-step="Deux copies"><h3>2. Deux copies rose pâle</h3><p><code>color:EED9D9</code> donne la couleur des ombres qui n'en ont pas. Le mode quirks accepte le code hexadécimal sans <code>#</code>. Une ombre sans flou est une copie de la boîte, décalée. <code>0 5em</code> : 5 × 16 = 80px plus bas, en y = 100. <code>0 45vw</code> : 45 % de 400 = 180px plus bas, en y = 200.</p></div>
<div class="cap" data-t="10" data-step="La copie verte"><h3>3. La copie verte, dessous</h3><p><code>0 8em#668884</code> : 8 × 16 = 128px plus bas, de y = 148 à 208. La première ombre de la liste est peinte au-dessus, la dernière tout en bas. Les deux copies rose pâle la couvrent de 148 à 160 et de 200 à 208 : il reste la bande verte de 160 à 200.</p></div>
<div class="cap" data-t="15" data-step="Deux de plus"><h3>4. Deux copies de plus</h3><p><code>63q 35vw</code> : 63 × 0,945 = 59,53px à droite et 140px plus bas, en (259,53, 160). <code>-45vw 0</code> : 180px à gauche, en (20, 20). La moitié de l'image est là : html et ses cinq copies.</p></div>
<div class="cap" data-t="20" data-step="body"><h3>5. body, un second carré</h3><p>Le <code>*</code> imbriqué vise head, style et body. body est dans html, large de 60 : avec <code>margin:200 60-200-60</code>, il fait 60 − 60 + 60 = 60 de large, en x = 200 − 60 = 140. En mode quirks, il remplit la hauteur de html moins ses marges : 60 − 200 + 200 = 60, en y = 20 + 200 = 220. Le premier <code>*</code> lui donne aussi la même liste d'ombres : ses copies partent vers le bas et la gauche, presque toutes hors du canevas.</p></div>
<div class="cap" data-t="25" data-step="scale:-1"><h3>6. scale:-1, un demi-tour</h3><p><code>scale:-1</code> retourne body sur ses deux axes, autour de son centre (170, 250) : c'est un demi-tour. Ses ombres tournent avec lui : chaque décalage change de signe. Les copies arrivent en (140, 140), (140, 40), en vert en (140, 92), en (80,47, 80) et en (320, 220). Le centre de html, (230, 50), et celui de body, (170, 250), sont symétriques autour du centre du canevas, (200, 150) : la moitié de html revient, tournée d'un demi-tour.</p></div>
<div class="cap" data-t="30" data-step="Résultat" data-live="146 caractères · 100 % identique"><h3>7. Résultat : 146 caractères</h3><p>Une liste de cinq ombres, deux carrés. html dessine une moitié de l'escalier, body l'autre, retournée d'un demi-tour autour du centre du canevas.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html"><h3>1. html, an invisible square</h3><p>The code starts with a no-break space: text, which opens body before the <code>&lt;style></code>. <code>*</code> targets html, head, style and body, and gives them all the background <code>#394257</code>. html's one fills the whole canvas. html gets <code>margin:5%35%55%200</code>: the percentages are taken from the width of 400, so 20, 140 and 220, then 200px. In quirks mode, html is 400 − 140 − 200 = 60 wide and 300 − 20 − 220 = 60 tall, at (200, 20). It has the background color, so you don't see it.</p></div>
<div class="cap" data-t="5" data-step="Two copies"><h3>2. Two pink copies</h3><p><code>color:EED9D9</code> sets the color of every shadow that has none. Quirks mode accepts the hex code without <code>#</code>. A shadow with no blur is a copy of the box, moved. <code>0 5em</code>: 5 × 16 = 80px down, at y = 100. <code>0 45vw</code>: 45% of 400 = 180px down, at y = 200.</p></div>
<div class="cap" data-t="10" data-step="The green copy"><h3>3. The green copy, underneath</h3><p><code>0 8em#668884</code>: 8 × 16 = 128px down, from y = 148 to 208. The first shadow of the list is painted on top, the last one at the bottom. The two pink copies cover it from 148 to 160 and from 200 to 208: a green band is left, from 160 to 200.</p></div>
<div class="cap" data-t="15" data-step="Two more"><h3>4. Two more copies</h3><p><code>63q 35vw</code>: 63 × 0.945 = 59.53px right and 140px down, at (259.53, 160). <code>-45vw 0</code>: 180px left, at (20, 20). Half of the picture is there: html and its five copies.</p></div>
<div class="cap" data-t="20" data-step="body"><h3>5. body, a second square</h3><p>The nested <code>*</code> targets head, style and body. body sits in html, which is 60 wide: with <code>margin:200 60-200-60</code>, it is 60 − 60 + 60 = 60 wide, at x = 200 − 60 = 140. In quirks mode, it fills html's height minus its margins: 60 − 200 + 200 = 60, at y = 20 + 200 = 220. The first <code>*</code> gives it the same shadow list too: its copies go down and left, almost all off the canvas.</p></div>
<div class="cap" data-t="25" data-step="scale:-1"><h3>6. scale:-1, half a turn</h3><p><code>scale:-1</code> flips body on both axes, around its center (170, 250): that is half a turn. Its shadows turn with it, so every offset changes sign. The copies land at (140, 140), (140, 40), in green at (140, 92), at (80.47, 80) and at (320, 220). html's center, (230, 50), and body's, (170, 250), are symmetric around the center of the canvas, (200, 150): html's half comes back, turned half a turn.</p></div>
<div class="cap" data-t="30" data-step="Result" data-live="146 characters · 100% match"><h3>7. Result: 146 characters</h3><p>One list of five shadows, two squares. html draws one half of the staircase, body draws the other one, turned half a turn around the center of the canvas.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0430 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.5), 1 - pr(t, b - 0.3, b));
  const c = fr ? '\u00a0:' : ':';
  const n = (x) => (fr ? String(x).replace('.', ',') : String(x));
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  // Measured on the official code in local Chrome 157 (400 × 300 iframe, quirks mode, getBoundingClientRect, getComputedStyle, variant renders).
  // html 60 × 60 at (200, 20); body 60 × 60 at (140, 220), scale -1. Same shadow list on both, color rgb(238, 217, 217):
  // 0 80px, 0 180px, 0 128px #668884, 59.5276px 140px, -180px 0.
  // html's copies: (200, 100), (200, 200), green (200, 148), (259.53, 160), (20, 20).
  // body's copies (offsets reversed by the flip, checked with a red variant): (140, 140), (140, 40), green (140, 92), (80.47, 80), (320, 220).
  const hc = $$('.t0430-h'), bc = $$('.t0430-b');
  const off = (e) => e.dataset.o.split(' ').map(Number);
  const grp = $('.t0430-grp'), ghost = $('.t0430-ghost');
  const hb = $('.t0430-hb'), bb = $('.t0430-bb');
  const und = $$('.t0430-u');
  const labs = $$('.zlab');
  const ivs = [[0.3, 4.8], [5.3, 9.8], [10.3, 14.8], [15.3, 19.8], [20.3, 24.8], [25.3, 29.8]];
  // when each copy appears and slides, by list index (0 = -45vw 0 … 4 = 0 5em)
  const hT = [[15.9, 17.4], [15.3, 16.8], [10.3, 11.8], [6.4, 7.9], [5.3, 6.8]];
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const fin = pr(t, 30.2, 31.2);
    const tw = teach ? 1 - fin : 0;
    // html's copies slide out of html's box
    hc.forEach((e, i) => {
      const [dx, dy] = off(e), [a, b] = hT[i], k = pr(t, a + 0.3, b);
      e.style.opacity = pr(t, a, a + 0.3);
      e.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
    });
    // the hidden part of the green copy (teaching colors, step 3 on)
    ghost.style.opacity = teach ? pr(t, 12, 12.5) * (1 - fin) : 0;
    // body's copies: same list, unflipped, then the half turn
    const ba = pr(t, 21.3, 21.8), bm = pr(t, 21.8, 23.6);
    bc.forEach((e) => {
      const [dx, dy] = off(e);
      e.style.opacity = ba;
      e.style.transform = `translate(${dx * bm}px, ${dy * bm}px)`;
      if (e.classList.contains('t0430-cr')) e.style.background = mix(tw, 'var(--t0430-bc)', 'var(--t0430-cream)');
    });
    grp.style.transform = `rotate(${180 * pr(t, 25.8, 28.6)}deg)`;
    // the two boxes: dashed outline (or teaching color), until the result
    const boxes = [[hb, 'var(--t0430-hb)', pr(t, 0.3, 1)], [bb, 'var(--t0430-bb)', pr(t, 20.3, 21)]];
    boxes.forEach(([e, col, a]) => {
      const show = a * (1 - fin);
      e.style.opacity = show;
      e.style.background = e === bb ? (teach ? mix(0.22 * show, col, 'var(--t0430-dark)') : 'var(--t0430-dark)') : (teach ? `color-mix(in srgb, ${col} 22%, transparent)` : 'none');
      e.style.boxShadow = teach && show > 0 ? `inset 0 0 0 calc(2.5px * var(--k, 1)) ${mix(show, col, 'var(--t0430-dark)')}` : 'none';
      e.style.outline = !teach && show > 0 ? 'calc(1.5px * var(--k, 1)) dashed #fff' : 'none';
      e.style.outlineOffset = 'calc(-0.75px * var(--k, 1))';
      e.style.filter = !teach && show > 0 ? 'drop-shadow(0 0 calc(1px * var(--k, 1)) rgb(0 0 0 / .9))' : 'none';
    });
    // same-color underlays on the shared edges, once everything is in place
    und.forEach((e) => { e.style.opacity = pr(t, 28.6, 29); });
    labs.forEach((l) => { l.style.opacity = win(t, ...ivs[+l.dataset.l - 1]); });
    let txt;
    if (step === 0) txt = `5%35%55%200 → 20 140 220 200 · 400 − 140 − 200 = 60 · 300 − 20 − 220 = 60`;
    else if (step === 1) txt = `0 5em${c} 20 + 80 = 100 · 0 45vw${c} 20 + 180 = 200`;
    else if (step === 2) txt = `0 8em${c} 20 + 128 = 148 · ${fr ? 'visible de' : 'visible from'} 160 ${fr ? 'à' : 'to'} 200`;
    else if (step === 3) txt = `63q 35vw${c} 200 + ${n(59.53)} = ${n(259.53)} · -45vw 0${c} 200 − 180 = 20`;
    else if (step === 4) txt = `body${c} 60 − 60 + 60 = 60 · x = 200 − 60 = 140 · y = 20 + 200 = 220`;
    else if (step === 5) txt = `220 − 80 = 140 · 220 − 180 = 40 · 140 − ${n(59.53)} = ${n(80.47)} · 140 + 180 = 320`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
