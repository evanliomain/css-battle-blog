<script>
(window.AnimScenes = window.AnimScenes || {}).t0609 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.2, b]));
  const c = fr ? '\u00a0:' : ':';
  const num = (n) => (fr ? String(n).replace('.', ',') : String(n));
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  // Measured on the official code in local Chrome (400 × 300 iframe, quirks mode, getBoundingClientRect, getComputedStyle).
  // html 400 × 300 at (0, 0): gradient center (200, 150). 1Q = 0.945px, 5ch = 40px, 74Q = 69.921px, 25vw = 100px.
  // Rendered radii: hole up to 40, violet up to 70, green up to 100. Hole pixel (234, 246, 239).
  // body: margin 232px 3px −325px, 394 × 393 at (3, 232), center (200, 428.5); rotated bounding box
  // (−78.247, 150.253) 556.493 × 556.493: top corner at (200, 150.253).
  const FIN = 27;
  const html = $('.t0609-html'), body = $('.t0609-body'), bb = $('.t0609-bb'), bh = $('.t0609-bh');
  const r1 = $('.t0609-r1'), r2 = $('.t0609-r2'), d1 = $('.t0609-d1'), d2 = $('.t0609-d2'), d3 = $('.t0609-d3');
  const labs = $$('.zlab');
  const ivs = [[0.3, 4.5], [4.8, 9], [9.3, 13.5], [13.8, 18], [18.3, 22.5], [22.8, FIN]];
  const circ = (e, x, y, r) => { e.style.left = `${x - r}px`; e.style.top = `${y - r}px`; e.style.width = e.style.height = `${2 * r}px`; };
  circ(r2, 200, 428.5, 128.5);
  const grad = (hole, a, b, c3, last) => `radial-gradient(0.945px, ${hole} ${a}px, #4c4c6b 0 ${b}px, #4a9a86 0 ${c3}px, ${last})`;
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const wide = fig.dataset.view === 'wide';
    const tw = teach ? 1 - pr(t, [FIN, FIN + 0.8]) : 0;
    // step 2: the stops grow one after the other; step 3: the hole loses its alpha
    const a = 40 * pr(t, [4.9, 5.9]);
    const b = a + 29.921 * pr(t, [5.9, 6.9]);
    const g = b + 30.079 * pr(t, [6.9, 7.9]);
    const al = 1 - (1 - 34 / 255) * pr(t, [9.6, 11.2]);
    const hole = `rgb(102 187 136 / ${al.toFixed(4)})`;
    html.style.background = grad(hole, a, b, g, '#ebf6f0');
    // step 4: body appears; its own gradient is always complete
    body.style.background = grad(hole, 40, 69.921, 100, mix(tw, 'var(--t0609-bd)', '#ebf6f0'));
    body.style.opacity = pr(t, [14, 14.8]);
    // step 6: the quarter of a right angle
    const rot = `rotate(${45 * pr(t, [23, 25])}deg)`;
    body.style.transform = bb.style.transform = rot;
    bh.style.opacity = win(t, 0.4, 4.5);
    bb.style.opacity = win(t, 13.8, FIN);
    circ(r1, 200, 150, 0.945 + 99.055 * (1 - pr(t, [0.8, 2.6])));
    r1.style.opacity = win(t, 0.6, 4.5);
    r2.style.opacity = win(t, 18.6, 22.5);
    d1.style.opacity = Math.max(win(t, 0.4, 9), win(t, 22.8, FIN));
    d2.style.opacity = Math.max(win(t, 18.4, 22.5), win(t, 22.8, FIN));
    d3.style.opacity = pr(t, [25, 25.4]) * (1 - pr(t, [FIN - 0.2, FIN]));
    // labels: two rows in the top left corner of the frame (above the rings on the canvas, above the canvas in wide view)
    const x0 = wide ? -90 : 0, y0 = wide ? -60 : 0;
    labs.forEach((l) => {
      const r = +l.dataset.r;
      l.style.left = `calc(${x0}px + 4px * var(--k, 1))`;
      l.style.top = `calc(${y0}px + ${4 + 19 * r}px * var(--k, 1))`;
      l.style.opacity = win(t, ...ivs[+l.dataset.l - 1]);
    });
    let txt;
    if (step === 0) txt = `html${c} 400 × 300 · 1Q = ${num(0.945)}px`;
    else if (step === 1) txt = `40 · ${num(69.92)} · 100`;
    else if (step === 2) txt = `#6b82 → (234, 246, 239)`;
    else if (step === 3) txt = `body${c} 394 × 393 ${fr ? 'en' : 'at'} (3, 232)`;
    else if (step === 4) txt = `${fr ? 'centre' : 'center'} (200, ${num(428.5)})`;
    else if (step === 5) txt = `${fr ? 'pointe' : 'tip'} (200, ${num(150.25)})`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
