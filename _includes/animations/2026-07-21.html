<div class="cap" data-t="0" data-step="html : 200 × 80"><h3>1. html : une boîte de 200 × 80</h3><p><code>*</code> vise tous les éléments, et d'abord html. Pas de doctype : la page est en mode quirks, et un nombre sans unité compte en px. Un pourcentage de marge se calcule sur la largeur, 400 : <code>40%</code> fait 160. html remplit la fenêtre, moins ses marges : 400 − 290 + 90 = 200 de large à partir de x = −90, et 300 − 160 − 60 = 80 de haut à partir de y = 160. Son fond vert est peint sur tout le canevas.</p></div>
<div class="cap" data-t="5" data-step="Jaune et blanc"><h3>2. Un carré jaune et un bloc blanc</h3><p>Une ombre est une copie de la boîte, décalée. <code>5pc 0#FAE29E</code> la décale de 80px vers la droite : de x = −10 à 190 (pointillés jaunes). Une ombre n'est jamais peinte sous sa propre boîte, et html va jusqu'à x = 110 : il ne reste qu'un carré de 80 × 80. <code>75vw 0#EBF6F0</code> la décale de 300px : un bloc blanc de x = 210 à 410.</p></div>
<div class="cap" data-t="10.5" data-step="Coupes vertes"><h3>3. Trois coupes vertes</h3><p>Sans couleur, une ombre prend <code>color</code> : <code>4A9A86</code>, le vert du fond (le mode quirks accepte une couleur sans #). La première ombre de la liste est peinte au-dessus : les trois vertes couvrent le bloc blanc. <code>55ch 0</code> (440px) couvre à partir de x = 350, <code>25pc -32q</code> à partir de x = 310 et jusqu'à y = 209,76. <code>7cm 0 0-32q</code> est rétrécie de 30,24px de chaque côté : une bande de y = 190,24 à 209,76. Il reste deux barres.</p></div>
<div class="cap" data-t="16.5" data-step="body"><h3>4. body : la même boîte, plus haut</h3><p>Le <code>*{</code> imbriqué vise les éléments placés dans un autre : body. Il garde le fond, les ombres et la couleur, mais prend <code>margin:-100-380 50%380</code>. 50 % de la largeur de html, c'est 100px. body part de (−90 + 380, 160 − 100) = (290, 60) et fait 200 × 80. Son fond est du vert du canevas : on ne le voit pas. La flèche montre le sens de son axe x.</p></div>
<div class="cap" data-t="22" data-step="scale:-1"><h3>5. scale:-1 : la moitié en miroir</h3><p><code>scale:-1</code> multiplie les deux axes par −1 autour du centre de body, (290 + 100, 60 + 40) = (390, 100). La boîte ne bouge pas, mais ses ombres partent vers la gauche et vers le haut. Le jaune va de x = 210 à 410, et body le cache à partir de 290 : un carré. Le bloc blanc va de x = −10 à 190, et les ombres vertes y découpent deux barres.</p></div>
<div class="cap" data-t="29" data-step="Résultat" data-live="161 caractères · 100 % identique"><h3>6. Résultat : 161 caractères</h3><p>Une seule liste d'ombres, dessinée deux fois : par html, puis par body retourné. La boîte de body est celle de html, tournée autour du centre du canevas : tout ce qu'il dessine est en miroir.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html: 200 × 80"><h3>1. html: a 200 × 80 box</h3><p><code>*</code> targets every element, html first. There is no doctype: the page is in quirks mode, and a number with no unit counts as px. A margin percentage is a share of the width, 400: <code>40%</code> is 160. html fills the window, minus its margins: 400 − 290 + 90 = 200 wide from x = −90, and 300 − 160 − 60 = 80 tall from y = 160. Its green background is painted on the whole canvas.</p></div>
<div class="cap" data-t="5" data-step="Yellow and white"><h3>2. A yellow square and a white block</h3><p>A shadow is a copy of the box, moved. <code>5pc 0#FAE29E</code> moves it 80px right: x = −10 to 190 (yellow dashes). A shadow is never painted under its own box, and html reaches x = 110: only an 80 × 80 square is left. <code>75vw 0#EBF6F0</code> moves it 300px right: a white block from x = 210 to 410.</p></div>
<div class="cap" data-t="10.5" data-step="Green cuts"><h3>3. Three green cuts</h3><p>With no color, a shadow takes <code>color</code>: <code>4A9A86</code>, the background green (quirks mode accepts a color with no #). The first shadow in the list is painted on top: the three green ones cover the white block. <code>55ch 0</code> (440px) covers from x = 350, <code>25pc -32q</code> from x = 310 and down to y = 209.76. <code>7cm 0 0-32q</code> is shrunk by 30.24px on every side: a strip from y = 190.24 to 209.76. Two bars are left.</p></div>
<div class="cap" data-t="16.5" data-step="body"><h3>4. body: the same box, higher up</h3><p>The nested <code>*{</code> targets the elements inside another one: body. It keeps the background, the shadows and the color, but gets <code>margin:-100-380 50%380</code>. 50% of html's width is 100px. body starts at (−90 + 380, 160 − 100) = (290, 60) and is 200 × 80. Its background is the canvas green: it does not show. The arrow shows which way its x axis points.</p></div>
<div class="cap" data-t="22" data-step="scale:-1"><h3>5. scale:-1: the mirror half</h3><p><code>scale:-1</code> multiplies both axes by −1 around body's center, (290 + 100, 60 + 40) = (390, 100). The box stays in place, but its shadows go left and up. The yellow one spans x = 210 to 410, and body hides it from 290: a square. The white block spans x = −10 to 190, and the green shadows cut two bars out of it.</p></div>
<div class="cap" data-t="29" data-step="Result" data-live="161 characters · 100% match"><h3>6. Result: 161 characters</h3><p>One shadow list, drawn twice: by html, then by body turned around. body's box is html's box turned around the center of the canvas: everything it draws is mirrored.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0721 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const c = fr ? '\u00a0:' : ':';
  const n2 = (v) => { const s = Math.abs(v).toFixed(2); return (v < -0.004 ? '−' : '') + (fr ? s.replace('.', ',') : s); };
  // Measured on the official code in local Chrome (quirks mode, 400 × 300), getBoundingClientRect and computed styles:
  // html (−90, 160) 200 × 80, margin 160px 290px 60px −90px. body (290, 60) 200 × 80, margin −100px −380px 100px 380px, scale −1.
  // Shadows (computed, both elements): 80px 0 #FAE29E, 440px 0, 264.567px 0 0 −30.2362px, 400px −30.2362px, 300px 0 #EBF6F0;
  // color rgb(74, 154, 134). Each shadow recolored in turn: html's cuts at x ≥ 350, x ≥ 310 (to y 209.76), y 190.24..209.76;
  // body's at x < 50, x < 90 (from y 90.24), y 90.24..109.76; yellow squares x 110..190 and 210..290.
  // The shadows are drawn as boxes, in canvas px. A shadow is never painted under its own box: here each element's box
  // is a green cover painted over its shadows, grown by 4px wherever it only meets green, so no edge of a hidden shadow shows.
  const FIN = 29;
  const Q = 30.23622, CM = 264.56693, E = 4;
  const html = $('.t0721-html'), body = $('.t0721-body'), ar = $('.t0721-ar'), w = $('.t0721-w');
  const hb = $('.t0721-hb'), bb = $('.t0721-bb'), gy1 = $('.t0721-gy1'), gy2 = $('.t0721-gy2');
  const L = (k) => $$(`.t0721-l[data-l="${k}"]`);
  const scene = $('.scene');
  // one element's five shadows, from the bottom one (the last in the list) to the top one: white, 25pc, 7cm, 55ch, yellow
  const make = (z) => ['wh', 'c3', 'c2', 'c1', 'y'].map((k, i) => { const e = document.createElement('div'); e.style.zIndex = z + i; e.dataset.k = k; scene.appendChild(e); return e; });
  const H = make(1), B = make(7);
  // rects in html's frame (box at (−90, 160), 200 × 80); body's are the same, turned around (200, 150).
  // a: yellow and white offsets, b: green offsets. Where two green shadows share a bar edge, one of them is pulled back
  // (25pc by 4px, under the 7cm strip, which grows to x = 354), so each edge is drawn by one shape only.
  const draw = (S, mir, a, b, teach) => {
    const r = [
      [-90 + 300 * a, 160, 200, 80],
      [-90 + 400 * b, 160 - Q * b, 200, 80 - E * b],
      [-90 + CM * b + Q, 160 + Q, 200 - 2 * Q + (354 - (110 + CM - Q)) * b, 80 - 2 * Q],
      [-90 + 440 * b, 160 - E, 200, 80 + 2 * E],
      [-90 + 80 * a, 160, 200, 80]];
    S.forEach((e, i) => {
      let [x0, y0, ww, hh] = r[i];
      if (mir) { x0 = 400 - x0 - ww; y0 = 300 - y0 - hh; }
      e.style.opacity = (i === 0 || i === 4 ? a : b) > 0 ? 1 : 0;
      e.style.left = `${x0}px`; e.style.top = `${y0}px`; e.style.width = `${ww}px`; e.style.height = `${hh}px`;
      const k = e.dataset.k;
      e.style.background = k === 'y' || k === 'wh' || teach ? `var(--t0721-${k})` : 'var(--t0721-g)';
    });
  };
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    const ann = 1 - pr(t, [FIN, FIN + 0.6]);
    // 1. html's background: the white canvas turns green
    w.style.opacity = 1 - pr(t, [0.6, 1.8]);
    // 2. and 3. html's shadows, under html's box
    html.style.opacity = t < 2 ? 0 : 1;
    draw(H, false, pr(t, [5.8, 8.2]), pr(t, [11.2, 14.6]), teach);
    // 5. body: scale 1 → −1, then its shadows, mirrored, under body's box
    const f = pr(t, [22.6, 24]);
    const sc = 1 - 2 * f;
    body.style.transform = f >= 1 ? 'none' : `scale(${sc})`;
    ar.style.transform = f >= 1 ? 'scale(-1)' : 'none';
    const bs = f >= 1 ? pr(t, [24.4, 27]) : 0;
    draw(B, true, bs, bs, teach);
    ar.style.opacity = 0.95 * win(t, 16.8, 28.6);
    hb.style.opacity = 0.9 * win(t, 0.2, 16.2);
    bb.style.opacity = 0.9 * win(t, 16.8, 28.6);
    gy1.style.opacity = win(t, 8.2, 10.2);
    gy2.style.opacity = win(t, 27, 28.6);
    [[0.3, 4.8], [5.3, 10.2], [10.8, 16.2], [16.8, 21.8], [22.3, 28.6]].forEach(([p, z], k) => L(k + 1).forEach((e) => (e.style.opacity = win(t, p, z) * ann)));
    let txt;
    if (step === 0) txt = `html${c} 200 × 80 · x = −90 → 110 · y = 160 → 240`;
    else if (step === 1) { const a = pr(t, [5.8, 8.2]); txt = `5pc${c} ${Math.round(80 * a)}px · 75vw${c} ${Math.round(300 * a)}px`; }
    else if (step === 2) { const b = pr(t, [11.2, 14.6]); txt = `55ch${c} ${Math.round(440 * b)}px · 7cm${c} ${n2(CM * b)}px · 25pc${c} ${Math.round(400 * b)}px`; }
    else if (step === 3) txt = `body${c} 200 × 80 · x = 290 → 490 · y = 60 → 140`;
    else if (step === 4) txt = `scale${c} ${n2(sc)}`;
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
