<figure class="anim t0906" data-duration="16" data-scene="t0906" data-wide="-40 -30 480 360" data-off-label="-36 -26" style="--bg:#fff">
<style>
.t0906{--t0906-p:#6d57c4;--t0906-r:#b9a8f0;--t0906-dash:rgb(60 50 100 / .7)}
.t0906 .t0906-g{position:absolute;left:0;top:0;width:400px;height:300px;transform-origin:200px 150px}
.t0906 .t0906-g > i{position:absolute;display:block;border-radius:10.4px}
.t0906 .t0906-bar{left:155px;top:105px;width:35px;height:90px;border-radius:10.4px 0 0 10.4px!important}
.t0906 .t0906-sq{left:275px;top:105px;width:90px;height:90px}
.t0906 .t0906-o{position:absolute;box-sizing:border-box;border:1.5px dashed var(--t0906-dash);pointer-events:none}
.t0906 .t0906-axis{position:absolute;left:199.5px;top:60px;width:1.5px;height:180px;background:var(--t0906-dash)}
.t0906 .zlab{color:#fff;background:rgb(30 25 60 / .9);padding:1px 5px;border-radius:3px}
</style>
<div class="anim-col">
<div class="stage" role="img" aria-label="{% if include.lang == "fr" %}Animation : html n'est que sa bordure gauche, une barre violette arrondie à gauche ; le body, en grande police, n'est qu'une bordure de 90px : un carré, tourné de 15 degrés, à droite ; le reflet de html, en miroir autour du milieu, double la barre et le carré{% else %}Animation: html is only its left border, a purple bar rounded on the left; the body, with a big font, is only a 90px border: a square, turned by 15 degrees, on the right; html's reflection, mirrored around the middle, doubles the bar and the square{% endif %}">
<div class="scene">
<div class="t0906-g" data-g="refl"><i class="t0906-bar"></i><i class="t0906-sq"></i></div>
<div class="t0906-g" data-g="real"><i class="t0906-bar"></i><i class="t0906-sq"></i></div>
<div class="t0906-o" data-o="html" style="left:155px;top:105px;width:90px;height:90px"></div>
<div class="t0906-axis"></div>
<span class="zlab t0906-l-h" style="left:12px;top:12px">2.2em = {% if include.lang == "fr" %}35,2{% else %}35.2{% endif %} → 35 · 11q = {% if include.lang == "fr" %}10,4{% else %}10.4{% endif %}</span>
<span class="zlab t0906-l-b" style="left:12px;top:12px">257% → {% if include.lang == "fr" %}41,12{% else %}41.12{% endif %}px · 2.2em → 90 · 15deg</span>
<span class="zlab t0906-l-r" style="left:12px;top:12px">-webkit-box-reflect:left −5lh = −90</span>
</div>
</div>
<div class="legend"><span><i style="--c:var(--t0906-p)"></i>html {% if include.lang == "fr" %}et body{% else %}and body{% endif %}</span><span><i style="--c:var(--t0906-r)"></i>{% if include.lang == "fr" %}reflet (violet en vrai){% else %}reflection (purple in reality){% endif %}</span></div>
</div>
<div class="anim-side">
<pre class="code" aria-hidden="true">&lt;style>*{<span data-on="3" data-tone="2">-webkit-box-reflect:left -5lh</span>;<span data-on="1">margin:105 155</span>;<span data-on="1 2">border-left:solid 2.2em#6D57C4;border-radius:11q</span>;*{<span data-on="2">margin:0 85</span>;<span data-on="2" data-tone="2">rotate:15deg;font:257%a</span></pre>
<div class="now" aria-live="polite">
<div class="caps">
{%- if include.lang == "fr" %}
<div class="cap" data-t="0" data-step="html : une barre"><h3>1. <code>html</code> : une barre</h3><p><code>margin:105 155</code> fait de <code>html</code> un carré de 90, de x = 155 à 245 et, en mode quirks, de y = 105 à 195. Il n'a pas de fond, seulement une bordure gauche de <code>2.2em</code> : 35,2px, arrondis à 35. Avec <code>border-radius:11q</code> (10,4), c'est une barre violette aux coins gauches arrondis.</p></div>
<div class="cap" data-t="4" data-step="Le body : un carré tourné"><h3>2. Le <code>body</code> : un carré tourné</h3><p><code>font:257%a</code> donne au <code>body</code> une police de 41,12px : sa bordure de <code>2.2em</code> fait 90,46, arrondis à 90. <code>margin:0 85</code> ne laisse aucune largeur à son contenu : le <code>body</code> n'est que sa bordure, un carré de 90, de x = 275 à 365. <code>rotate:15deg</code> le tourne autour de son centre.</p></div>
<div class="cap" data-t="8" data-step="Le reflet double tout"><h3>3. Le reflet double tout</h3><p><code>-webkit-box-reflect:left -5lh</code> ajoute à <code>html</code> son reflet en miroir, à sa gauche, avec un écart de −5lh = −90 : le reflet recouvre exactement <code>html</code>, retourné. Il reflète aussi son contenu. La barre revient de x = 210 à 245, et le carré tourné de x = 35 à 125, tourné dans l'autre sens. Le <code>body</code> a aussi un reflet, mais 5lh y vaut plus de 230px : il tombe hors du canevas.</p></div>
<div class="cap" data-t="12" data-step="Résultat" data-live="140 caractères · 100 % identique"><h3>4. Résultat : 140 caractères</h3><p>Une bordure en barre, une bordure en carré, et un reflet pour le reste.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html: a bar"><h3>1. <code>html</code>: a bar</h3><p><code>margin:105 155</code> makes <code>html</code> a 90 square, from x = 155 to 245 and, in quirks mode, from y = 105 to 195. It has no background, only a <code>2.2em</code> left border: 35.2px, rounded down to 35. With <code>border-radius:11q</code> (10.4), that is a purple bar with round left corners.</p></div>
<div class="cap" data-t="4" data-step="The body: a turned square"><h3>2. The <code>body</code>: a turned square</h3><p><code>font:257%a</code> gives the <code>body</code> a 41.12px font: its <code>2.2em</code> border is 90.46, rounded down to 90. <code>margin:0 85</code> leaves its content no width: the <code>body</code> is only its border, a 90 square, from x = 275 to 365. <code>rotate:15deg</code> turns it around its centre.</p></div>
<div class="cap" data-t="8" data-step="The reflection doubles everything"><h3>3. The reflection doubles everything</h3><p><code>-webkit-box-reflect:left -5lh</code> adds a mirrored copy of <code>html</code> on its left, with a gap of −5lh = −90: the copy lies exactly over <code>html</code>, flipped. It reflects its content too. The bar comes back from x = 210 to 245, and the turned square from x = 35 to 125, turned the other way. The <code>body</code> has a reflection too, but 5lh is over 230px there: it lands off the canvas.</p></div>
<div class="cap" data-t="12" data-step="Result" data-live="140 characters · 100% match"><h3>4. Result: 140 characters</h3><p>A border as a bar, a border as a square, and a reflection for the rest.</p></div>
{%- endif %}
</div>
<div class="live"></div>
</div>
</div>
<script>
(window.AnimScenes = window.AnimScenes || {}).t0906 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const R = $('[data-g="real"]'), M = $('[data-g="refl"]'), oH = $('[data-o="html"]'), AX = $('.t0906-axis'), live = $('.live');
  const L = (k) => $(`.t0906-l-${k}`);
  const W = { h: [0.3, 1.8], b: [4.2, 6], r: [8.2, 10], fin: [12.1, 12.9] };
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const f1 = (v) => { const s = (Math.round(v * 100) / 100).toFixed(2).replace(/\.?0+$/, ''); return (fr ? s.replace('.', ',') : s).replace('-', '−'); };
  const c = fr ? ' :' : ':';
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const real = !teach || t >= W.fin[0];
    const guides = t < W.fin[0] ? 1 : 0;
    const h = pr(t, W.h), b = pr(t, W.b), r = pr(t, W.r);
    [[R, 'var(--t0906-p)'], [M, real ? 'var(--t0906-p)' : 'var(--t0906-r)']].forEach(([g, col]) => {
      const [bar, sq] = g.querySelectorAll('i');
      bar.style.background = col; sq.style.background = col;
      bar.style.opacity = h; sq.style.opacity = b;
      sq.style.rotate = `${15 * b}deg`;
    });
    // the reflection: a mirror image around x = 200, swinging in
    M.style.opacity = r > 0 ? 1 : 0;
    M.style.transform = `perspective(800px) rotateY(${180 * r}deg)`;
    oH.style.opacity = (step <= 2 ? h : 0) * guides;
    AX.style.opacity = (step === 2 ? r : 0) * guides;
    L('h').style.opacity = win(t, W.h[0], W.b[0] - 0.2);
    L('b').style.opacity = win(t, W.b[0], W.r[0] - 0.2);
    L('r').style.opacity = win(t, W.r[0], W.fin[0]);
    let txt = '';
    if (step === 0) txt = `html${c} x 155 → 245, ${fr ? 'bordure' : 'border'} 35`;
    else if (step === 1) txt = `body${c} x 275 → 365, ${f1(15 * b)}°`;
    else if (step === 2) txt = `${fr ? 'miroir' : 'mirror'}${c} x → 400 − x`;
    else txt = $$('.caps .cap')[3].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
</figure>
