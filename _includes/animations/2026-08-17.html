<div class="cap" data-t="0" data-step="html : 50 × 150"><h3>1. <code>html</code> : 50 × 150</h3><p>Hors de toute règle, <code>&amp;</code> désigne la racine : <code>html</code>. Pas de doctype : la page est en mode quirks, et les nombres sans unité sont des px. <code>margin:75 175</code> : 75px en haut et en bas, 175px à gauche et à droite. html fait 400 − 2 × 175 = 50px de large. En mode quirks, il est étiré sur la hauteur de la fenêtre, moins ses marges : 300 − 2 × 75 = 150px. <code>*</code> lui donne le fond #F1E1BE, qui peint tout le canevas.</p></div>
<div class="cap" data-t="5" data-step="Un seul point"><h3>2. Un seul point</h3><p><code>border-left:dotted 50vh</code> : 50vh = 150px. Une bordure pointillée est une file de points ronds, aussi larges que la bordure. Sur ce côté de 150px, il y en a 8 à 10px, 4 à 20px, 3 à 30px, 2 à 50px. À 150px, un seul point remplit le côté : un disque de 150px, de (175 ; 75) à (325 ; 225). La largeur du contenu tombe à 0. La bordure n'a pas de couleur : elle prend <code>color:7C7565</code>, une couleur sans <code>#</code> que le mode quirks accepte.</p></div>
<div class="cap" data-t="13" data-step="body : 75 × 75"><h3>3. <code>body</code> : 75 × 75</h3><p>Le <code>*</code> imbriqué vise tout élément dans un autre : head, style et body. Seul body s'affiche. Il commence dans le contenu de html : en x = 325, 0px de large, 150px de haut. <code>margin:0-0 75-75</code> se lit 0, −0, 75 et −75. La marge gauche de −75px le fait partir de x = 250 et lui donne 75px de large. La marge du bas de 75px réduit sa hauteur à 150 − 75 = 75px. Le body est un carré de 75 × 75 en (250 ; 75).</p></div>
<div class="cap" data-t="19" data-step="Le quart caché"><h3>4. Le quart caché</h3><p>Le premier <code>*</code> donne aussi au body le fond #F1E1BE. html a déjà son fond : celui du body est donc peint dans sa propre boîte, par-dessus la bordure de html. Ce carré couleur du fond cache le quart en haut à droite du disque.</p></div>
<div class="cap" data-t="23" data-step="Ombre de droite"><h3>5. Ombre de droite</h3><p><code>75px 0</code> : une copie de la boîte du body, 75px plus à droite, de (325 ; 75) à (400 ; 150). L'ombre n'a pas de couleur : elle prend <code>currentColor</code>, le #7C7565 que body hérite de html.</p></div>
<div class="cap" data-t="27" data-step="Ombre du haut"><h3>6. Ombre du haut</h3><p><code>0-75px</code> se lit 0 et −75px : une copie 75px plus haut, de (250 ; 0) à (325 ; 75), de la même couleur. Les deux ombres touchent le carré clair par un côté chacune.</p></div>
<div class="cap" data-t="33" data-step="Résultat" data-live="124 caractères · 100 % identique"><h3>7. Résultat : 124 caractères</h3><p>Une bordure pointillée réduite à un seul point fait le disque. Le body, couleur du fond, en cache un quart, et ses deux ombres font les carrés gris.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html: 50 × 150"><h3>1. <code>html</code>: 50 × 150</h3><p>Outside any rule, <code>&amp;</code> matches the root: <code>html</code>. No doctype: the page is in quirks mode, and numbers with no unit are px. <code>margin:75 175</code>: 75px on top and at the bottom, 175px on the left and right. html is 400 − 2 × 175 = 50px wide. In quirks mode it is stretched to the window height, minus its margins: 300 − 2 × 75 = 150px. <code>*</code> gives it the background #F1E1BE, which paints the whole canvas.</p></div>
<div class="cap" data-t="5" data-step="One dot"><h3>2. One dot</h3><p><code>border-left:dotted 50vh</code>: 50vh = 150px. A dotted border is a row of round dots, as wide as the border. On this 150px side, there are 8 of them at 10px, 4 at 20px, 3 at 30px, 2 at 50px. At 150px, one dot fills the side: a 150px disc, from (175, 75) to (325, 225). The content width drops to 0. The border has no color: it takes <code>color:7C7565</code>, a color with no <code>#</code> that quirks mode accepts.</p></div>
<div class="cap" data-t="13" data-step="body: 75 × 75"><h3>3. <code>body</code>: 75 × 75</h3><p>The nested <code>*</code> matches any element inside another: head, style and body. Only body is displayed. It starts in the content box of html: at x = 325, 0px wide, 150px tall. <code>margin:0-0 75-75</code> reads 0, −0, 75 and −75. The −75px left margin makes it start at x = 250 and gives it 75px of width. The 75px bottom margin cuts its height to 150 − 75 = 75px. The body is a 75 × 75 square at (250, 75).</p></div>
<div class="cap" data-t="19" data-step="The hidden quarter"><h3>4. The hidden quarter</h3><p>The first <code>*</code> also gives the body the background #F1E1BE. html already has its own background, so the body's one is painted in its own box, over the border of html. This square in the background color hides the top right quarter of the disc.</p></div>
<div class="cap" data-t="23" data-step="Right shadow"><h3>5. Right shadow</h3><p><code>75px 0</code>: a copy of the body box, 75px to the right, from (325, 75) to (400, 150). The shadow has no color: it takes <code>currentColor</code>, the #7C7565 that body inherits from html.</p></div>
<div class="cap" data-t="27" data-step="Top shadow"><h3>6. Top shadow</h3><p><code>0-75px</code> reads 0 and −75px: a copy 75px up, from (250, 0) to (325, 75), in the same color. Each shadow touches the light square along one side.</p></div>
<div class="cap" data-t="33" data-step="Result" data-live="124 characters · 100% match"><h3>7. Result: 124 characters</h3><p>A dotted border cut down to a single dot makes the disc. The body, in the background color, hides a quarter of it, and its two shadows make the gray squares.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0817 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const L = (k) => $(`.t0817-l[data-l="${k}"]`);
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const box = (e, r) => { e.style.left = `${r[0]}px`; e.style.top = `${r[1]}px`; e.style.width = `${r[2]}px`; e.style.height = `${r[3]}px`; };
  const r0 = (v) => Math.round(v);
  const c = fr ? ' :' : ':';
  const sep = fr ? ' ;' : ',';
  // Measured on the official code (getBoundingClientRect, one part at a time):
  // html border box (175, 75) 150 × 150, content width 0, height 150; without the border: 50 × 150.
  // Disc alone: x 175..324, y 75..224. Dotted border on that 150px side: 8 dots at 10px, 4 at 20px, 3 at 30px, 2 at 50px.
  // body without margins: (325, 75) 0 × 150; with them: (250, 75) 75 × 75.
  // 1st shadow: x 325..399, y 75..149 · 2nd shadow: x 250..324, y 0..74.
  // Border widths shown in step 2: [width, dot count, from t]
  const W = [[10, 8, 5.4], [20, 4, 6.8], [30, 3, 8.2], [50, 2, 9.6], [150, 1, 11]];
  const FIN = 33;
  const h = $('.t0817-h'), b = $('.t0817-b'), gh = $('.t0817-g[data-g="html"]'), gb = $('.t0817-g[data-g="body"]');
  const S1 = $('.t0817-sh[data-s="1"]'), S2 = $('.t0817-sh[data-s="2"]');
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    // html: its dotted left border, one width at a time in step 2
    let w = 0, n = 0;
    for (const [ww, nn, a] of W) if (t >= a) { w = ww; n = nn; }
    h.style.borderLeftWidth = `${w}px`;
    h.style.width = `${Math.max(0, 50 - w)}px`;
    h.style.borderLeftColor = `var(--t0817-${teach ? 'dot' : 'gr'})`;
    h.style.opacity = w ? 1 : 0;
    gh.style.opacity = 0.9 * Math.max(win(t, 0.3, 4.8), win(t, 5.2, 12.8));
    box(gh, [175, 75, Math.max(50, w), 150]);
    // body: from the content box of html (325, 75, 0 × 150) to (250, 75, 75 × 75)
    const m = pr(t, [14, 17]);
    const bx = [325 - 75 * m, 75, 75 * m, 150 - 75 * m];
    box(gb, bx);
    gb.style.opacity = 0.9 * Math.max(win(t, 13.2, 18.8), t >= 19 && t < FIN ? 0.5 * pr(t, [19, 19.5]) : 0);
    b.style.opacity = pr(t, [19.3, 20]);
    b.style.background = `var(--t0817-${teach ? 'bd' : 'cr'})`;
    // shadows: copies of the body box, moved by their offsets
    const o1 = 75 * pr(t, [23.6, 25.6]), o2 = 75 * pr(t, [27.6, 29.6]);
    box(S1, [250 + o1, 75, 75, 75]);
    box(S2, [250, 75 - o2, 75, 75]);
    S1.style.opacity = pr(t, [23.2, 23.6]);
    S2.style.opacity = pr(t, [27.2, 27.6]);
    S1.style.background = `var(--t0817-${teach ? 's1' : 'gr'})`;
    S2.style.background = `var(--t0817-${teach ? 's2' : 'gr'})`;
    const dims = win(t, 1.2, 4.8);
    $$('.t0817-d, .t0817-m').forEach((e) => (e.style.opacity = dims));
    [[0.2, 4.8], [11, 12.8], [13.2, 18.8], [19.2, 22.8], [23.2, 26.8], [27.2, 32.6]].forEach(([a, z], i) => (L(i + 1).style.opacity = win(t, a, z)));
    let txt = '';
    if (step === 0) txt = `html${c} 50 × 150 · (175${sep} 75)`;
    else if (step === 1) txt = w ? `border-left${c} ${w}px dotted · ${n} ${fr ? (n > 1 ? 'points' : 'point') : (n > 1 ? 'dots' : 'dot')}` : `border-left${c} 0px`;
    else if (step === 2) txt = `body${c} ${r0(bx[2])} × ${r0(bx[3])} · (${r0(bx[0])}${sep} 75)`;
    else if (step === 3) txt = `body${c} (250${sep} 75) → (325${sep} 150) · #F1E1BE`;
    else if (step === 4) txt = `${fr ? '1ʳᵉ ombre' : '1st shadow'}${c} (${r0(250 + o1)}${sep} 75) → (${r0(325 + o1)}${sep} 150)`;
    else if (step === 5) txt = `${fr ? '2ᵉ ombre' : '2nd shadow'}${c} (250${sep} ${r0(75 - o2)}) → (325${sep} ${r0(150 - o2)})`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
