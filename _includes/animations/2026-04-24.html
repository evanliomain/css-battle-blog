<div class="cap" data-t="0" data-step="Deux boîtes"><h3>1. Deux règles, deux boîtes</h3><p><code>*{</code> vise tous les éléments : html, head, style et body. Le <code>*{</code> imbriqué veut dire <code>* *</code> : tout élément placé dans un autre, donc tous sauf html. head et style ne s'affichent pas. Pas de doctype : mode quirks. html fait 400 × 300, et body, avec sa marge de 8px par défaut, s'étire sur 384 × 284 en (8, 8). Les deux sont centrés sur (200, 150).</p></div>
<div class="cap" data-t="5" data-step="Le repli"><h3>2. html : le repli</h3><p>Personne ne pose <code>--a</code> sur html : <code>var(--a,…)</code> donne son repli, tout ce qui suit la première virgule, <code>#111,60px,#F7CB71</code>. Le fond de html devient <code>radial-gradient(1q,#111,60px,#F7CB71 0 75pt,#A34F50)</code>. <code>#111</code> part du centre. <code>60px</code> seul est un point de transition, et <code>#F7CB71 0</code> ne peut pas se placer avant lui : le 0 passe à 60px. Un disque noir de rayon 60, puis du jaune, sans fondu.</p></div>
<div class="cap" data-t="10" data-step="1q, 75pt"><h3>3. 1q et 75pt</h3><p><code>1q</code> est la taille : un cercle de rayon 1q = 0,945px. Les arrêts en px et en pt vont quand même plus loin. Le jaune s'arrête à 75pt = 100px. <code>#A34F50</code> n'a pas de position : 100 % de la taille, 0,945px, alors il passe lui aussi à 100px. Le rouge-brun commence net au rayon 100. Le fond de html couvre le canevas.</p></div>
<div class="cap" data-t="15" data-step="body"><h3>4. body : --a:#fff</h3><p>La règle imbriquée pose <code>--a:#fff</code> sur body. Son fond se lit <code>radial-gradient(1q,#fff 0 75pt,#A34F50)</code> : un disque blanc de rayon 100, du rouge-brun autour. Son centre est celui de body, (8 + 192, 8 + 142) = (200, 150) : le même que html. Son rouge-brun tombe pile sur celui de html. body couvre html : il ne reste qu'un disque blanc.</p></div>
<div class="cap" data-t="20" data-step="Nœud papillon"><h3>5. Le nœud papillon</h3><p><code>clip-path:polygon(0 50%,50%99%,50%0,99%50%)</code> se calcule sur la boîte de body, 384 × 284 : (8 ; 150), (200 ; 289,16), (200 ; 8), (388,16 ; 150) sur le canevas. Le tracé se croise au centre : deux triangles, en bas à gauche et en haut à droite. Leurs côtés en biais restent à 112,7 et 113,4px du centre, plus loin que le rayon de 100. body garde deux quarts blancs ; le noir et le jaune de html se voient dans les deux autres.</p></div>
<div class="cap" data-t="25" data-step="Résultat" data-live="134 caractères · 100 % identique"><h3>6. Résultat : 134 caractères</h3><p>Un seul dégradé, écrit une fois, pour deux boîtes : html prend le repli, body prend le blanc et une découpe en nœud papillon.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="Two boxes"><h3>1. Two rules, two boxes</h3><p><code>*{</code> matches every element: html, head, style and body. The nested <code>*{</code> means <code>* *</code>: every element inside another one, so all of them but html. head and style are not displayed. No doctype: quirks mode. html is 400 × 300, and body, with its default 8px margin, stretches to 384 × 284 at (8, 8). Both are centered on (200, 150).</p></div>
<div class="cap" data-t="5" data-step="Fallback"><h3>2. html: the fallback</h3><p>Nothing sets <code>--a</code> on html, so <code>var(--a,…)</code> gives its fallback: everything after the first comma, <code>#111,60px,#F7CB71</code>. html's background becomes <code>radial-gradient(1q,#111,60px,#F7CB71 0 75pt,#A34F50)</code>. <code>#111</code> starts at the center. <code>60px</code> alone is a transition hint, and <code>#F7CB71 0</code> cannot sit before it: the 0 moves up to 60px. A black disc of radius 60, then yellow, with no fade.</p></div>
<div class="cap" data-t="10" data-step="1q, 75pt"><h3>3. 1q and 75pt</h3><p><code>1q</code> is the size: a circle of radius 1q = 0.945px. Stops in px and pt still reach farther. The yellow ends at 75pt = 100px. <code>#A34F50</code> has no position: 100% of the size, 0.945px, so it moves up to 100px too. The red-brown starts sharp at radius 100. html's background covers the canvas.</p></div>
<div class="cap" data-t="15" data-step="body"><h3>4. body: --a:#fff</h3><p>The nested rule sets <code>--a:#fff</code> on body. Its background reads <code>radial-gradient(1q,#fff 0 75pt,#A34F50)</code>: a white disc of radius 100, red-brown around it. Its center is body's center, (8 + 192, 8 + 142) = (200, 150): the same as html's. Its red-brown lands exactly on html's. body covers html: only a white disc is left.</p></div>
<div class="cap" data-t="20" data-step="Bowtie"><h3>5. The bowtie</h3><p><code>clip-path:polygon(0 50%,50%99%,50%0,99%50%)</code> is taken on body's 384 × 284 box: (8, 150), (200, 289.16), (200, 8), (388.16, 150) on the canvas. The path crosses itself at the center: two triangles, bottom left and top right. Their slanted edges stay 112.7 and 113.4px from the center, farther than the radius of 100. body keeps two white quarters; html's black and yellow show in the other two.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0424 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.5), 1 - pr(t, b - 0.3, b));
  const mix = (k, a, b) => (k <= 0 ? b : k >= 1 ? a : `color-mix(in srgb, ${a} ${(k * 100).toFixed(1)}%, ${b})`);
  // Measured on the official code in local Chrome (400 × 300 iframe, quirks mode, getBoundingClientRect, getComputedStyle, pixels).
  // html: (0, 0) 400 × 300, no --a: radial-gradient(1q, #111, 60px, #F7CB71 0 75pt, #A34F50); black to r = 60, yellow to r = 100.
  // body: (8, 8) 384 × 284, --a #fff: radial-gradient(1q, #fff 0 75pt, #A34F50), clip-path polygon(0 50%, 50% 99%, 50% 0, 99% 50%)
  // = (8, 150) (200, 289.16) (200, 8) (388.16, 150) on the canvas. Both gradients centered on (200, 150).
  // Pixels: #a34f50 88,572 · #fff 15,714 · #f7cb71 10,062 · #111 5,652. Without the clip (variant): a full white disc.
  const white = $('.t0424-white'), hy = $('.t0424-hy'), hr = $('.t0424-hr');
  const bclip = $('.t0424-bclip'), bfull = $('.t0424-bfull'), html = $('.t0424-html'), body = $('.t0424-body');
  const lns = $$('.t0424-ln'), pts = $$('.t0424-pt[data-p]'), ctr = $('.t0424-c');
  const labs = $$('.zlab');
  const P = [[8, 150], [200, 289.16], [200, 8], [388.16, 150]];
  lns.forEach((l, i) => {
    const [x1, y1] = P[i], [x2, y2] = P[(i + 1) % 4];
    l.style.left = `${x1}px`; l.style.top = `${y1}px`;
    l.style.width = `${Math.hypot(x2 - x1, y2 - y1)}px`;
    l.style.marginTop = 'calc(-1px * var(--k, 1))';
    l.style.transform = `rotate(${Math.atan2(y2 - y1, x2 - x1)}rad)`;
  });
  pts.forEach((p, i) => { p.style.left = `${P[i][0]}px`; p.style.top = `${P[i][1]}px`; });
  const ivs = [[0.3, 4.8], [5.3, 9.8], [10.3, 14.8], [15.3, 19.8], [20.3, 24.8]];
  const box = (el, o, col, teach) => {
    el.style.opacity = o;
    el.style.boxShadow = teach && o > 0 ? `inset 0 0 0 calc(2px * var(--k, 1)) ${col}` : 'none';
    el.style.outline = !teach && o > 0 ? 'calc(1.5px * var(--k, 1)) dashed #fff' : 'none';
    el.style.outlineOffset = 'calc(-0.75px * var(--k, 1))';
    el.style.filter = !teach && o > 0 ? 'drop-shadow(0 0 calc(1px * var(--k, 1)) rgb(0 0 0 / .9))' : 'none';
  };
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const tw = teach ? 1 - pr(t, 25.2, 26.2) : 0;
    // step 1: white canvas, the two boxes and the common center
    white.style.opacity = 1 - pr(t, 5.4, 6.4);
    box(html, win(t, 0.3, 9.8), 'var(--t0424-hbox)', teach);
    box(body, Math.max(win(t, 0.3, 4.8), win(t, 15.3, 19.8)), 'var(--t0424-bbox)', teach);
    ctr.style.opacity = Math.max(win(t, 0.3, 4.8), win(t, 15.3, 19.8));
    // step 2: the black disc grows to r = 60 over the yellow
    const r = 60 * pr(t, 6.4, 8.4);
    hy.style.background = `radial-gradient(circle at 200px 150px, var(--t0424-blk) ${r}px, var(--t0424-yel) ${r}px)`;
    // step 3: the red-brown from r = 100
    hr.style.opacity = t < 5 ? 1 : pr(t, 11, 12.4);
    // step 4: body's background, unclipped, covers html; step 5: the clip
    const bc = mix(tw, 'var(--t0424-bred)', 'var(--t0424-red)');
    const bg = `radial-gradient(circle at 192px 142px, #fff 100px, ${bc} 100px)`;
    bfull.style.background = bg; bclip.style.background = bg;
    const ob = pr(t, 15.6, 16.8);
    bfull.style.opacity = ob * (1 - pr(t, 22.4, 23.8));
    bclip.style.opacity = ob;
    const op = win(t, 20.3, 25);
    lns.forEach((l) => { l.style.opacity = op; });
    pts.forEach((p) => { p.style.opacity = op; });
    labs.forEach((l) => { l.style.opacity = win(t, ...ivs[+l.dataset.l - 1]); });
    let txt;
    if (step === 0) txt = fr ? 'html\u00a0: 400 × 300 · body\u00a0: (8, 8) 384 × 284 · centre (200, 150)' : 'html: 400 × 300 · body: (8, 8) 384 × 284 · center (200, 150)';
    else if (step === 1) txt = fr ? 'html\u00a0: pas de --a → #111,60px,#F7CB71 0 75pt' : 'html: no --a → #111,60px,#F7CB71 0 75pt';
    else if (step === 2) txt = fr ? '1q = 0,945px · 75pt = 100px · #A34F50 à 100px' : '1q = 0.945px · 75pt = 100px · #A34F50 at 100px';
    else if (step === 3) txt = fr ? 'body\u00a0: --a = #fff → #fff 0 75pt,#A34F50' : 'body: --a = #fff → #fff 0 75pt,#A34F50';
    else if (step === 4) txt = fr ? '(8\u00a0; 150) (200\u00a0; 289,16) (200\u00a0; 8) (388,16\u00a0; 150)' : '(8, 150) (200, 289.16) (200, 8) (388.16, 150)';
    else txt = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
