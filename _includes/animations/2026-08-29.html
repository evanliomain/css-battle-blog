<div class="cap" data-t="0" data-step="html : une boîte qui dépasse en bas"><h3>1. <code>html</code> : une boîte qui dépasse en bas</h3><p><code>*</code> vise d'abord <code>html</code>. <code>margin:45%140-90</code> : 45 % de la largeur, soit 180 en haut, 140 à gauche et à droite, −90 en bas. <code>html</code> fait 400 − 280 = 120 de large. En mode quirks, il remplit la hauteur de la fenêtre moins ses marges : 300 − 180 + 90 = 210. Il va de y = 180 à 390, sous le bas du canevas.</p></div>
<div class="cap" data-t="4" data-step="Des coins de 1in : une arche"><h3>2. Des coins de <code>1in</code> : une arche</h3><p><code>border-radius:1in</code> vaut 96px. Deux coins de 96 ne tiennent pas dans 120 de large : le navigateur les réduit à 60. Le haut est un demi-cercle, et les coins du bas, de y = 330 à 390, sont hors du canevas. La boîte est transparente : on ne la voit pas.</p></div>
<div class="cap" data-t="8" data-step="Une arche blanche, une noire"><h3>3. Une arche blanche, une noire</h3><p>Les ombres prennent la forme de la boîte. <code>138q 0#FFF</code> la décale de 130,39 à droite : une arche blanche de x = 270,39 à 390,39. <code>69q 0#0C0D0A</code>, décalée de 65,2, est peinte dessous : seuls un dôme noir et une bande noire de 10px restent visibles. Une ombre externe n'est jamais peinte sous sa propre boîte.</p></div>
<div class="cap" data-t="12" data-step="Une ombre violette géante"><h3>4. Une ombre violette géante</h3><p><code>4in 0 0 9cm#6D57C4</code> décale la boîte de 384 et l'étale de 340,16 de chaque côté. Son bord gauche tombe en x = 140 + 384 − 340,16 = 183,84, son haut en y = −160,16. Dernière de la liste, elle est peinte sous les deux autres. Ses coins sont arrondis eux aussi, d'environ 243px (mesuré) : son coin en haut à gauche laisse un vide blanc au-dessus de la boîte.</p></div>
<div class="cap" data-t="16" data-step="Le body : la même boîte"><h3>5. Le <code>body</code> : la même boîte</h3><p><code>*</code> imbriqué vise ce qui est dans un élément : le <code>body</code>. <code>margin:0</code> efface la marge de 45 %. En mode quirks, le <code>body</code> remplit <code>html</code> : la même boîte, 120 × 210 en (140 ; 180), avec les mêmes coins et les mêmes ombres. Pour l'instant, elles tombent pile sur celles de <code>html</code>.</p></div>
<div class="cap" data-t="20" data-step="scale:-1 : un miroir"><h3>6. <code>scale:-1</code> : un miroir</h3><p><code>scale:-1</code> retourne le <code>body</code> autour de son centre, (200 ; 285). Ses ombres passent à gauche : arche blanche de x = 9,61 à 129,61, noire derrière, violet jusqu'à x = 216,16, dont le coin arrondi bouche le vide laissé par <code>html</code>. Le retournement vertical ne change rien : la boîte est symétrique et les ombres n'ont pas de décalage vertical. Le <code>body</code> est peint après <code>html</code>, par-dessus.</p></div>
<div class="cap" data-t="24" data-step="Résultat" data-live="117 caractères · 100 % identique"><h3>7. Résultat : 117 caractères</h3><p>L'arche du milieu n'est aucune ombre. Aucune des deux boîtes ne peint ses ombres sous elle-même : on y voit le canevas, blanc par défaut. Trois arches, deux boîtes, une seule règle d'ombres.</p></div>
{%- else %}

<div class="cap" data-t="4" data-step="1in corners: an arch"><h3>2. <code>1in</code> corners: an arch</h3><p><code>border-radius:1in</code> is 96px. Two 96 corners do not fit in 120 wide: the browser scales them down to 60. The top is a half circle, and the bottom corners, from y = 330 to 390, are off the canvas. The box is transparent: it cannot be seen.</p></div>

<div class="cap" data-t="16" data-step="The body: the same box"><h3>5. The <code>body</code>: the same box</h3><p>The nested <code>*</code> matches what is inside an element: the <code>body</code>. <code>margin:0</code> removes the 45% margin. In quirks mode, the <code>body</code> fills <code>html</code>: the same box, 120 × 210 at (140, 180), with the same corners and the same shadows. For now, they land right on <code>html</code>'s.</p></div>
<div class="cap" data-t="20" data-step="scale:-1: a mirror"><h3>6. <code>scale:-1</code>: a mirror</h3><p><code>scale:-1</code> flips the <code>body</code> around its centre, (200, 285). Its shadows go to the left: a white arch from x = 9.61 to 129.61, the black one behind, purple up to x = 216.16, its rounded corner filling the gap left by <code>html</code>. The vertical flip changes nothing: the box is symmetric and the shadows have no vertical offset. The <code>body</code> is painted after <code>html</code>, on top.</p></div>
