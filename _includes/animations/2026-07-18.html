<div class="cap" data-t="0" data-step="html : zoom et fond"><h3>1. html : un zoom et le fond</h3><p>Au plus haut niveau, <code>&amp;</code> veut dire <code>:scope</code> : la racine, html. <code>background:#479DBA</code> est le fond de la racine : il est peint sur tout le canevas. <code>zoom:2.5</code> multiplie par 2,5 toutes les longueurs de html et de ce qu'il contient : 1px devient 2,5px à l'écran.</p></div>
<div class="cap" data-t="4.5" data-step="html : 190 × 80"><h3>2. html : une boîte de 190 × 80</h3><p>Pas de doctype : la page est en mode quirks, et les nombres sans unité comptent en px. <code>margin:-20 42 108</code> fait, × 2,5 : −50 en haut, 105 sur les côtés, 270 en bas. En mode quirks, html remplit la fenêtre moins ses marges : 400 − 210 = 190 de large, 300 + 50 − 270 = 80 de haut, en (105, −50). Son fond part sur le canevas : la boîte elle-même est transparente.</p></div>
<div class="cap" data-t="9" data-step="body : 150 × 40"><h3>3. body : 20px à l'intérieur</h3><p>body garde sa marge par défaut de 8px. Avec le zoom, elle fait 8 × 2,5 = 20px. body remplit html moins ses marges : 190 − 40 = 150 de large, 80 − 40 = 40 de haut, en (125, −30). Lui aussi est transparent : rien n'est encore peint.</p></div>
<div class="cap" data-t="13.5" data-step="0 2pc"><h3>4. Une ombre, deux copies</h3><p><code>*</code> donne la même liste d'ombres à html et à body. Une ombre sans couleur prend la couleur du texte. <code>color:FAE29E</code> (sans dièse, en mode quirks) vaut pour tous, puis <code>&amp;{color:#323B}</code> vient après et change celle de html : un violet sombre à 73 % d'opacité, gris-bleu sur le fond. <code>0 2pc</code> descend de 32px × 2,5 = 80 : la copie de html va de y = 30 à 110, celle de body, jaune, de 50 à 90, 20px à l'intérieur.</p></div>
<div class="cap" data-t="18" data-step="0 6pc"><h3>5. 0 6pc : 240px plus bas</h3><p><code>0 6pc</code> descend de 96px × 2,5 = 240. La copie de html va de y = 190 à 270, celle de body de 210 à 250. Les deux paires du haut et du bas sont en place.</p></div>
<div class="cap" data-t="22.5" data-step="±72q 4pc"><h3>6. ±72q 4pc : les côtés</h3><p>72q font 18mm, soit 68,03px, et × 2,5 = 170,08. 4pc font 64px, × 2,5 = 160. À droite, la copie de html va de x = 275,08 à 465,08, de y = 110 à 190 ; celle de body de 295,08 à 445,08, de y = 130 à 170. <code>-72q</code> fait la même chose à gauche : de −65,08 à 124,92 pour html, de −44,92 à 105,08 pour body.</p></div>
<div class="cap" data-t="27.5" data-step="Résultat" data-live="121 caractères · 100 % identique"><h3>7. Résultat : 121 caractères</h3><p>Les quatre copies grises se touchent sans se chevaucher et font le cadre : les barres du haut et du bas, et les 20px intérieurs des copies de côté pour ses montants. Chaque copie jaune est 20px à l'intérieur de sa copie grise, comme body dans html.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html: zoom, background"><h3>1. html: a zoom and the background</h3><p>At the top level, <code>&amp;</code> means <code>:scope</code>: the root, html. <code>background:#479DBA</code> is the root's background: it is painted on the whole canvas. <code>zoom:2.5</code> multiplies every length of html and of what it holds by 2.5: 1px becomes 2.5px on screen.</p></div>
<div class="cap" data-t="4.5" data-step="html: 190 × 80"><h3>2. html: a 190 × 80 box</h3><p>There is no doctype: the page is in quirks mode, and numbers with no unit count as px. <code>margin:-20 42 108</code> is, × 2.5: −50 at the top, 105 on the sides, 270 at the bottom. In quirks mode, html fills the window minus its margins: 400 − 210 = 190 wide, 300 + 50 − 270 = 80 tall, at (105, −50). Its background goes to the canvas: the box itself is transparent.</p></div>
<div class="cap" data-t="9" data-step="body: 150 × 40"><h3>3. body: 20px inside</h3><p>body keeps its default 8px margin. With the zoom, it is 8 × 2.5 = 20px. body fills html minus its margins: 190 − 40 = 150 wide, 80 − 40 = 40 tall, at (125, −30). It is transparent too: nothing is painted yet.</p></div>
<div class="cap" data-t="13.5" data-step="0 2pc"><h3>4. One shadow, two copies</h3><p><code>*</code> gives the same shadow list to html and body. A shadow with no color takes the text color. <code>color:FAE29E</code> (no hash, in quirks mode) is for everyone, then <code>&amp;{color:#323B}</code> comes later and changes html's: a dark purple at 73% opacity, gray-blue over the background. <code>0 2pc</code> moves down 32px × 2.5 = 80: html's copy runs from y = 30 to 110, body's yellow one from 50 to 90, 20px inside.</p></div>

<div class="cap" data-t="22.5" data-step="±72q 4pc"><h3>6. ±72q 4pc: the sides</h3><p>72q is 18mm, so 68.03px, and × 2.5 = 170.08. 4pc is 64px, × 2.5 = 160. On the right, html's copy runs from x = 275.08 to 465.08, y = 110 to 190; body's from 295.08 to 445.08, y = 130 to 170. <code>-72q</code> does the same on the left: from −65.08 to 124.92 for html, from −44.92 to 105.08 for body.</p></div>
<div class="cap" data-t="27.5" data-step="Result" data-live="121 characters · 100% match"><h3>7. Result: 121 characters</h3><p>The four gray copies touch without overlapping and make the frame: the top and bottom bars, and the inner 20px of the side copies for its sides. Each yellow copy sits 20px inside its gray copy, like body inside html.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0718 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));
  const c = fr ? ' :' : ':';
  const num = (v, d = 0) => { const s = Math.abs(v).toFixed(d); return (v < -0.005 ? '−' : '') + (fr ? s.replace('.', ',') : s); };
  // Measured on the official code in local Chrome (quirks mode, 400 × 300), getBoundingClientRect and computed styles:
  // html (105, −50) 190 × 80, zoom 2.5, margin −20px 42px 108px, color rgba(51, 34, 51, .733), background → canvas.
  // body (125, −30) 150 × 40, margin 8px (20px on screen), color rgb(250, 226, 158). head: display none.
  // box-shadow (both): 0 32px, 0 96px, ±68.0315px 64px, × 2.5 on screen: (0, 80), (0, 240), (±170.08, 160).
  // On the blue, html's color shows as (56, 67, 87); the target's frame is #394257.
  const FIN = 27.5;
  const SX = 170.08;
  const w = $('.t0718-w'), hb = $('.t0718-hb'), bb = $('.t0718-bb');
  const H = [1, 2, 3, 4].map((k) => $(`.t0718-h${k}`)), Y = [1, 2, 3, 4].map((k) => $(`.t0718-y${k}`));
  const L = (k) => $$(`.t0718-l[data-l="${k}"]`);
  const box = (e, x, y, wd, ht) => Object.assign(e.style, { left: `${x}px`, top: `${y}px`, width: `${wd}px`, height: `${ht}px` });
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    const ann = 1 - pr(t, [FIN, FIN + 0.6]);
    // 1. html's background: white → blue
    w.style.opacity = 1 - pr(t, [0.6, 2]);
    // 2. html's box: margins 0 → (−50, 105, 270)
    const m = pr(t, [5.2, 7.6]);
    const hx = 105 * m, hy = -50 * m, hw = 400 - 210 * m, hh = 300 - 220 * m;
    box(hb, hx, hy, hw, hh);
    hb.style.opacity = 0.9 * pr(t, [4.7, 5.1]) * ann;
    // 3. body's box: margin 0 → 20 inside html
    const b = 20 * pr(t, [9.6, 11.8]);
    box(bb, 105 + b, -50 + b, 190 - 2 * b, 80 - 2 * b);
    bb.style.opacity = 0.9 * pr(t, [9.2, 9.6]) * ann;
    // 4–6. the four shadows, each on html (190 × 80 at (105, −50)) and body (150 × 40 at (125, −30))
    const sh = [
      [0, 80 * pr(t, [14.5, 16.8]), pr(t, [13.8, 14.3])],
      [0, 240 * pr(t, [18.9, 21.2]), pr(t, [18.3, 18.8])],
      [SX * pr(t, [23.4, 25.8]), 160 * pr(t, [23.4, 25.8]), pr(t, [22.8, 23.3])],
      [-SX * pr(t, [23.4, 25.8]), 160 * pr(t, [23.4, 25.8]), pr(t, [22.8, 23.3])],
    ];
    sh.forEach(([dx, dy, o], k) => {
      box(H[k], 105 + dx, -50 + dy, 190, 80);
      H[k].style.opacity = o;
      H[k].style.background = teach ? `var(--t0718-c${k + 1})` : 'var(--t0718-g)';
      box(Y[k], 125 + dx, -30 + dy, 150, 40);
      Y[k].style.opacity = o;
    });
    // real colors, once the copies are in place: a gray underlay under the frame's two sides, no seam at y = 110 and 190
    $$('.t0718-u').forEach((e) => (e.style.opacity = teach ? 0 : pr(t, [25.8, 26.2])));
    [[0.3, 4.3], [4.8, 8.8], [9.3, 13.3], [13.8, 17.8], [18.3, 22.3], [22.8, 27.3]].forEach(([u, z], k) => L(k + 1).forEach((e) => (e.style.opacity = win(t, u, z) * ann)));
    let txt;
    if (step === 0) txt = fr ? `canevas${c} #479DBA · zoom${c} 2,5` : `canvas${c} #479DBA · zoom${c} 2.5`;
    else if (step === 1) txt = fr ? `html${c} ${num(hw)} × ${num(hh)} en (${num(hx)}, ${num(hy)})` : `html${c} ${num(hw)} × ${num(hh)} at (${num(hx)}, ${num(hy)})`;
    else if (step === 2) txt = fr ? `body${c} ${num(190 - 2 * b)} × ${num(80 - 2 * b)} en (${num(105 + b)}, ${num(-50 + b)})` : `body${c} ${num(190 - 2 * b)} × ${num(80 - 2 * b)} at (${num(105 + b)}, ${num(-50 + b)})`;
    else if (step === 3) txt = fr ? `décalage${c} 0 ${num(sh[0][1])}px` : `offset${c} 0 ${num(sh[0][1])}px`;
    else if (step === 4) txt = fr ? `décalage${c} 0 ${num(sh[1][1])}px` : `offset${c} 0 ${num(sh[1][1])}px`;
    else if (step === 5) txt = fr ? `décalage${c} ±${num(sh[2][0], 2)}px ${num(sh[2][1])}px` : `offset${c} ±${num(sh[2][0], 2)}px ${num(sh[2][1])}px`;
    else txt = $$('.caps .cap')[6].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
