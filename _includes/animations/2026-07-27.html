(window.AnimScenes = window.AnimScenes || {}).t0727 = (fig) => {
  const fr = document.documentElement.lang === 'fr';

  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, [a, b]) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const win = (t, a, b) => Math.min(pr(t, [a, a + 0.5]), 1 - pr(t, [b - 0.4, b]));

  const num = (x) => (fr ? String(x).replace('.', ',') : String(x));
  // Measured on the official code in local Chrome (quirks mode, 400 × 300):
  // top borders 20px: html x 60..340 y 80, body 90..320 y 120, dl 120..300 y 160, p 150..280 y 200.
  // a elements (inline in p): 10 × 638 from y -100 (20px top border, padding 300, 18px line), x 80, 110, 140, 170;
  // the 4th holds the text .'' (4 + 2.890625 + 2.890625 = 9.77px), so it is 19.77px wide; the bar's first green column is x = 190.
  const FIN = 25;
  const W = [280, 230, 180, 130];
  const BT = ['hb', 'bb', 'db', 'pb'];
  const bars = $$('.t0727-bar'), bx = $$('.t0727-bx'), as = $$('.t0727-a');
  const a4 = $('.t0727-a4'), txt = $('.t0727-txt'), tb = $('.t0727-tb');

  const BIN = [[0.6, 2.4], [5.6, 6.8], [6.6, 7.8], [7.6, 8.8]];
  return (t, step) => {
    const teach = fig.dataset.teach === '1' && t < FIN;
    const ann = 1 - pr(t, [FIN, FIN + 0.6]);
    const v = (k, r) => `var(--t0727-${teach ? k : r})`;
    // the four bars: top borders of html, body, dl, p
    bars.forEach((e, i) => {
      e.style.width = `${W[i] * pr(t, BIN[i])}px`;
      e.style.background = v(BT[i], 'gr');
    });
    bx.forEach((e, i) => (e.style.opacity = 0.9 * win(t, i ? BIN[i][0] - 0.4 : 0.3, i ? 9.8 : 4.8) + 0.9 * (i === 3 ? win(t, 10.2, 14.8) : 0)));

      e.style.background = v('aa', 'bl');
      e.style.borderTopColor = v('at', 'gr');
    });

    txt.style.opacity = win(t, 15.3, 19.8) * (teach ? 1 : 0.85);
    txt.style.color = teach ? '#fff' : '#000';
    tb.style.opacity = 0.9 * win(t, 15.3, 19.8);

    let s;
    if (step === 0) s = `html${c} 280 × 20 · (60${fr ? '\u00a0;' : ','} 80)`;
    else if (step === 1) s = `${fr ? 'barres' : 'bars'}${c} 280 · 230 · 180 · 130`;
    else if (step === 2) s = `a${c} 10 × 638 · x = 80 · 110 · 140 · 170`;
    else if (step === 3) s = `${fr ? '4e a' : '4th a'}${c} ${num((Math.round(w4 * 100) / 100).toFixed(2))}px`;
    else if (step === 4) s = `${fr ? 'carrés' : 'squares'}${c} 4 + 3 + 2 + 1 = 10`;
    else s = $$('.caps .cap')[5].dataset.live || '';
    live.textContent = s;
  };
