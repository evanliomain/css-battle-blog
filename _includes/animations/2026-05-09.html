<div class="cap" data-t="0" data-step="html"><h3>1. &amp; vise html</h3><p>Au premier niveau d'une feuille de style, <code>&amp;</code> désigne la racine, html. Le fond de html est peint sur tout le canevas. Sa zone de placement est la boîte de html : en mode quirks, html remplit la fenêtre, 400 × 300. Rien n'est encore peint.</p></div>
<div class="cap" data-t="4" data-step="Tuile"><h3>2. Une tuile de 170,08 × 300</h3><p><code>45MM</code> est la taille de l'image de fond, en majuscules (les unités ne tiennent pas compte de la casse). 1mm = 3,78px : 45mm = 170,08px de large. La hauteur n'est pas donnée : elle vaut <code>auto</code>, et un dégradé n'a pas de taille propre, donc il prend la hauteur de la boîte de html, 300.</p></div>
<div class="cap" data-t="8.5" data-step="Dégradé"><h3>3. Un cercle de 1Q</h3><p><code>radial-gradient(1Q,…)</code> est un cercle de rayon 1Q = 0,945px, au centre de la tuile. Les arrêts sont des longueurs, mesurées depuis le centre : bleu jusqu'à 4mm = 15,12px, vert de là (le <code>0</code> est remonté) jusqu'à 37q = 34,96px. La dernière couleur, <code>#0991</code>, n'a pas de position : elle est à 100 % du rayon, 1Q, donc remontée à 37q. Le passage est net, et #0991 remplit le reste de la tuile. C'est un bleu-vert presque transparent : sur le blanc, il donne #eef8f8.</p></div>
<div class="cap" data-t="14" data-step="Position"><h3>4. Placée en (29,89 ; −30,24)</h3><p><code>13%-32q</code>. Un pourcentage aligne le point à 13 % de la tuile sur le point à 13 % de la zone : 13 % × (400 − 170,08) = 29,89. Comme la tuile a la hauteur de html, il faut une longueur pour la décaler : -32q = −30,24px. Le centre du cercle passe en (114,93 ; 119,76).</p></div>
<div class="cap" data-t="18.5" data-step="Répétition"><h3>5. Répétée</h3><p>Par défaut, le fond se répète : une copie tous les 170,08px en largeur et tous les 300px en hauteur. Le canevas montre un deuxième cercle, centré en x = 114,93 + 170,08 = 285,01. Les autres copies tombent hors du canevas. #0991 couvre tout le reste du canevas.</p></div>
<div class="cap" data-t="23" data-step="body"><h3>6. La boîte du body</h3><p><code>*{</code> est imbriqué dans <code>&amp;{</code> : il vise tous les descendants de html. head et style ne sont pas affichés, il reste le body. Les marges en % se calculent sur la largeur, 400 : 30 % = 120 en haut, 25 % = 100 à gauche et à droite. En mode quirks, <code>70</code> sans unité vaut 70px. Le body s'étire sur la hauteur de html, moins ses marges : sa boîte va de (100, 120) à (300, 230).</p></div>
<div class="cap" data-t="27.5" data-step="Bordure"><h3>7. Une bordure sans le haut</h3><p><code>border:32q solid#08C</code> : 32q = 30,24px, que Chrome arrondit à 30px. <code>border-top:0</code> enlève le haut : il reste un U. Les branches font 30 de large et s'arrêtent à y = 120. Le haut de chaque branche est arrondi par le disque bleu du dégradé, de même couleur, centré à 0,24px au-dessus. Le bas du disque et de l'anneau est caché sous la branche.</p></div>
<div class="cap" data-t="31" data-step="Résultat" data-live="132 caractères · 100 % identique"><h3>8. Résultat : 132 caractères</h3><p>Un seul dégradé sur html donne les disques bleus, les anneaux verts et le fond pâle. Une bordure sur le body donne le U.</p></div>
{%- else %}
<div class="cap" data-t="0" data-step="html"><h3>1. &amp; targets html</h3><p>At the top level of a style sheet, <code>&amp;</code> means the root, html. html's background is painted over the whole canvas. Its positioning area is html's box: in quirks mode, html fills the window, 400 × 300. Nothing is painted yet.</p></div>
<div class="cap" data-t="4" data-step="Tile"><h3>2. A 170.08 × 300 tile</h3><p><code>45MM</code> is the size of the background image, in capitals (units ignore case). 1mm = 3.78px: 45mm = 170.08px wide. The height is not given: it is <code>auto</code>, and a gradient has no size of its own, so it takes the height of html's box, 300.</p></div>
<div class="cap" data-t="8.5" data-step="Gradient"><h3>3. A 1Q circle</h3><p><code>radial-gradient(1Q,…)</code> is a circle of radius 1Q = 0.945px, at the center of the tile. The stops are lengths, measured from the center: blue up to 4mm = 15.12px, green from there (the <code>0</code> is raised) up to 37q = 34.96px. The last color, <code>#0991</code>, has no position: it sits at 100% of the radius, 1Q, so it is raised to 37q. The change is sharp, and #0991 fills the rest of the tile. It is an almost transparent blue-green: on white, it gives #eef8f8.</p></div>
<div class="cap" data-t="14" data-step="Position"><h3>4. Placed at (29.89, −30.24)</h3><p><code>13%-32q</code>. A percentage lines up the point at 13% of the tile with the point at 13% of the area: 13% × (400 − 170.08) = 29.89. The tile is as tall as html, so moving it up takes a length: -32q = −30.24px. The center of the circle moves to (114.93, 119.76).</p></div>
<div class="cap" data-t="18.5" data-step="Repeat"><h3>5. Repeated</h3><p>By default, a background repeats: a copy every 170.08px across and every 300px down. The canvas shows a second circle, centered at x = 114.93 + 170.08 = 285.01. The other copies fall off the canvas. #0991 covers the rest of the canvas.</p></div>
<div class="cap" data-t="23" data-step="body"><h3>6. The body's box</h3><p><code>*{</code> is nested in <code>&amp;{</code>: it targets every descendant of html. head and style are not displayed, which leaves the body. Margins in % are a share of the width, 400: 30% = 120 at the top, 25% = 100 on the left and right. In quirks mode, <code>70</code> with no unit means 70px. The body stretches to html's height, minus its margins: its box runs from (100, 120) to (300, 230).</p></div>
<div class="cap" data-t="27.5" data-step="Border"><h3>7. A border without the top</h3><p><code>border:32q solid#08C</code>: 32q = 30.24px, which Chrome rounds to 30px. <code>border-top:0</code> removes the top: a U is left. The branches are 30 wide and stop at y = 120. The top of each branch is rounded by the blue disk of the gradient, in the same color, centered 0.24px higher. The bottom of the disk and of the ring is hidden under the branch.</p></div>
<div class="cap" data-t="31" data-step="Result" data-live="132 characters · 100% match"><h3>8. Result: 132 characters</h3><p>One gradient on html gives the blue disks, the green rings and the pale background. One border on the body gives the U.</p></div>

<script>
(window.AnimScenes = window.AnimScenes || {}).t0509 = (fig) => {
  const fr = document.documentElement.lang === 'fr';
  const $ = (s) => fig.querySelector(s);
  const $$ = (s) => [...fig.querySelectorAll(s)];
  const live = $('.live');
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const pr = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const lin = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
  const win = (t, a, b) => Math.min(pr(t, a, a + 0.5), 1 - pr(t, b - 0.3, b));
  const c = fr ? ' :' : ':';
  const pc = fr ? ' %' : '%';
  const n = (v) => (fr ? String(v).replace('.', ',') : String(v));
  // Measured on the official code in local Chrome (400 × 300 page, quirks mode, getBoundingClientRect, computed styles):
  // html 0, 0, 400 × 300; background-position 13% -30.2362px, background-size 170.079px auto (= 300), repeat;
  // radial-gradient(1q, rgb(0 136 204) 4mm, rgb(166 206 57) 0px, rgb(166 206 57) 37q, rgba(0 153 153 / .067)):
  // tile at (29.89, −30.24), circle centers (114.93, 119.76) and (285.01, 119.76); a variant with
  // 29.89px -30.24px/170.08px gives the same pixels. body 100, 120, 200 × 110; border widths 0 30px 30px 30px.
  // #0991 over white renders as rgb(238 248 248) = #eef8f8, drawn here as an opaque color.
  // The last frame shows .t0509-plane (same gradient, same tiles) and .t0509-body (same border) only.
  const FIN = 31;
  const TX = 29.89, TY = -30.236;
  const R1 = 15.118, R2 = 34.961;
  const REAL = [[0, 136, 204], [166, 206, 57], [238, 248, 248], [0, 136, 204]];
  const TEACH = [[56, 189, 248], [167, 139, 250], [253, 230, 138], [249, 115, 22]];
  const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
  const rgb = (col) => `rgb(${col.join(' ')})`;
  // a: growth of the circle (0..1), o: opacity of the color after 37q (0..1)
  const grad = (cols, a, o) => {
    const r1 = R1 * a, r2 = R2 * a;
    const out = o >= 1 ? rgb(cols[2]) : `rgb(${cols[2].join(' ')} / ${o.toFixed(3)})`;
    return `radial-gradient(circle closest-side, ${rgb(cols[0])} ${r1.toFixed(3)}px, ${rgb(cols[1])} 0 ${r2.toFixed(3)}px, ${out} 0)`;
  };
  const plane = $('.t0509-plane'), tile = $('.t0509-tile'), body = $('.t0509-body'), ctr = $('.t0509-ctr');
  const hbox = $('.t0509-html'), main = $('.t0509-main'), bbox = $('.t0509-bbox'), copies = $$('.t0509-copy');
  const labs = $$('.zlab[data-l]');
  const ivs = [[0.3, 3.8], [4.4, 8.3], [9.0, 13.8], [16.4, 18.3], [19.0, 22.8], [23.3, 27.3], [28.0, 30.8]];
  const lerp = (a, b, k) => a + (b - a) * k;
  return (t, step) => {
    const teach = fig.dataset.teach === '1';
    const fin = pr(t, FIN + 0.2, FIN + 0.9);
    const tw = teach ? 1 - fin : 0;
    const cols = REAL.map((col, i) => mix(col, TEACH[i], tw));
    // step 1: html's box
    hbox.style.opacity = win(t, 0.3, 4);
    // step 2: the 170.08 × 300 tile at (0, 0); step 4: moved to (29.89, −30.24)
    const k = pr(t, 14.5, 16.3);
    const x = lerp(0, TX, k), y = lerp(0, TY, k);
    tile.style.left = main.style.left = `${x}px`;
    tile.style.top = main.style.top = `${y}px`;
    main.style.opacity = Math.min(pr(t, 4.2, 4.9), 1 - pr(t, 23, 23.5));
    // step 3: the disk and the ring grow, then #0991 fills the tile
    const a = pr(t, 9, 11);
    const o = pr(t, 11.3, 12.5);
    tile.style.backgroundImage = a > 0 ? grad(cols, a, o) : 'none';
    ctr.style.opacity = win(t, 8.8, 18.3);
    ctr.style.left = `${x + 85.039}px`;
    ctr.style.top = `${y + 150}px`;
    // step 5: the copies (one box with the repeating tile, under the original, which then fades out)
    const p = pr(t, 18.8, 20.2);
    plane.style.backgroundImage = grad(cols, 1, 1);
    plane.style.opacity = p;
    tile.style.opacity = 1 - pr(t, 20.2, 20.6);
    const co = Math.min(pr(t, 18.8, 19.5), 1 - pr(t, 23, 23.5));
    copies.forEach((b) => { b.style.opacity = co; });
    // step 6: the body's box; step 7: its border
    bbox.style.opacity = win(t, 23.3, 30.9);
    body.style.opacity = pr(t, 27.7, 28.6);
    body.style.borderColor = rgb(cols[3]);
    labs.forEach((l) => {
      l.style.opacity = win(t, ...ivs[+l.dataset.l - 1]);
    });
    let txt;
    if (step === 0) txt = `& = html${c} 400 × 300`;
    else if (step === 1) txt = `45mm = 45 × ${n(3.78)} = ${n(170.08)}px · auto = 300`;
    else if (step === 2) txt = `1Q = ${n(0.945)}px · 4mm = ${n(15.12)}px · 37q = ${n(34.96)}px`;
    else if (step === 3) txt = `13${pc} × (400 − ${n(170.08)}) = ${n(29.89)} · -32q = −${n(30.24)}px`;
    else if (step === 4) txt = `x${c} ${n(114.93)}, ${n(285.01)} · y${c} ${n(119.76)}`;
    else if (step === 5) txt = `30${pc} × 400 = 120 · 25${pc} × 400 = 100 · 70 → 70px`;
    else if (step === 6) txt = `32q = ${n(30.24)}px → 30px · border-top${c} 0`;
    else txt = $$('.caps .cap')[7].dataset.live || '';
    live.textContent = txt;
  };
};
</script>
