---
layout: default
---
{%- assign t = site.data.i18n[page.lang] -%}
<article class="post article">
  <p class="kicker">{{ page.kicker | default: t.news }} · <time datetime="{{ page.date | date_to_xmlschema }}">{% include date.html date=page.date lang=page.lang %}</time></p>
  <h1>{{ page.title }}</h1>
  {{ content }}
</article>
